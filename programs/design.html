<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>표지 생성기 · Program Tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #f4f6f8; --panel: #ffffff; --text: #111827; --muted: #6b7280;
      --line: #d1d5db; --primary: #12396d; --accent: #1d9bb2;
      --shadow: 0 16px 44px rgba(15,23,42,.13); --nav-h: 52px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; background: var(--bg); color: var(--text); padding-top: var(--nav-h); }

    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      height: var(--nav-h); background: var(--primary);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 700;
      text-decoration: none; padding: 7px 12px; border-radius: 8px;
      transition: background 0.15s; white-space: nowrap; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .nav-back:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .nav-title { flex: 1; text-align: center; font-size: 15px; font-weight: 800; color: #fff; }
    .nav-user { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .nav-user-name { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 600; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-logout {
      display: flex; align-items: center; gap: 5px;
      color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,0.12); border: none; border-radius: 7px;
      padding: 6px 10px; cursor: pointer; font-family: inherit; transition: background 0.15s;
    }
    .nav-logout:hover { background: rgba(255,255,255,0.22); color: #fff; }

    .app { display: grid; grid-template-columns: 340px minmax(0,1fr); min-height: calc(100vh - var(--nav-h)); }

    aside {
      background: var(--panel); border-right: 1px solid #e5e7eb;
      padding: 16px; overflow-y: auto; max-height: calc(100vh - var(--nav-h));
    }
    h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: -0.04em; }
    .sub { color: var(--muted); font-size: 12px; line-height: 1.45; margin-bottom: 14px; }
    .section { border-top: 1px solid #edf0f3; padding-top: 12px; margin-top: 12px; }
    .section h2 { font-size: 12px; font-weight: 800; margin: 0 0 10px; color: #374151; text-transform: uppercase; letter-spacing: 0.4px; }
    label { display: block; font-size: 11px; font-weight: 800; margin: 0 0 4px; color: #374151; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font-size: 13px; background: #fff;
      outline: none; font-family: inherit; transition: border-color 0.15s;
    }
    textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
    input[type="color"] { padding: 2px 4px; height: 34px; cursor: pointer; border-radius: 8px; }
    input[type="file"] { font-size: 12px; padding: 6px 8px; }
    input[type="range"] { padding: 0; accent-color: var(--primary); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field { margin-bottom: 8px; }
    .checkline { display: flex; align-items: center; gap: 7px; margin: 6px 0; font-size: 12px; color: #374151; font-weight: 700; cursor: pointer; }
    .checkline input[type="checkbox"] { width: auto; cursor: pointer; }
    .minirow { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: #9ca3af; font-weight: 700; margin-top: 2px; }
    .smallnote { font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 4px; }

    button {
      border: 0; border-radius: 9px; padding: 9px 12px;
      background: #111827; color: white; font-weight: 900;
      cursor: pointer; font-size: 12px; font-family: inherit; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #e5e7eb; color: #111827; }
    button.blue { background: #164a8a; }
    button.green { background: #0f766e; }
    button.ai-btn {
      width: 100%; background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff; font-size: 13px; padding: 11px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }

    /* View tabs */
    .view-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .view-tab {
      flex: 1; padding: 7px 0; font-size: 12px; font-weight: 800;
      border: 1.5px solid var(--line); border-radius: 8px;
      background: #f8fafc; color: #6b7280; cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .view-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .view-tab:hover:not(.active) { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; opacity: 1; }

    /* Items */
    .item-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
    .item-row {
      background: #f8fafc; border: 1.5px solid #e5e7eb;
      border-radius: 9px; padding: 8px 10px;
      transition: border-color 0.15s;
    }
    .item-row.is-selected { border-color: #2563eb; background: #eff6ff; }
    .item-row-top { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; }
    .item-text-input {
      flex: 1; border: 1px solid #d1d5db; border-radius: 7px;
      padding: 7px 9px; font-size: 13px; font-family: inherit; outline: none;
      background: #fff;
    }
    .item-text-input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.1); }
    .item-del { background: none; border: none; color: #9ca3af; font-size: 16px; cursor: pointer; padding: 2px 5px; line-height: 1; font-family: inherit; flex-shrink: 0; }
    .item-del:hover { color: #ef4444; opacity: 1; background: none; }
    .item-row-opts { display: grid; grid-template-columns: 70px 34px 34px; gap: 6px; align-items: center; }
    .item-opt-label { font-size: 10px; color: #6b7280; font-weight: 700; margin-bottom: 2px; }
    .item-fs-input {
      width: 100%; border: 1px solid #d1d5db; border-radius: 6px;
      padding: 5px 6px; font-size: 12px; font-family: inherit; outline: none; text-align: center; background: #fff;
    }
    .item-fs-input:focus { border-color: #2563eb; }
    .item-color-input { width: 34px; height: 34px; padding: 2px 3px; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; }
    .item-bold-btn {
      width: 34px; height: 34px; background: #e5e7eb; border: 1px solid #d1d5db;
      color: #374151; border-radius: 6px; cursor: pointer; font-size: 13px;
      font-weight: 900; font-family: inherit; transition: all 0.12s;
    }
    .item-bold-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .add-item-btn {
      width: 100%; background: #eff6ff; border: 1.5px dashed #93c5fd;
      color: #1d4ed8; border-radius: 8px; padding: 8px; font-size: 12px;
      font-weight: 800; cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .add-item-btn:hover { background: #dbeafe; opacity: 1; }

    /* AI status */
    .ai-status {
      display: none; margin-top: 8px; padding: 8px 10px;
      border-radius: 8px; font-size: 12px; font-weight: 700; text-align: center;
    }
    .ai-status.loading { display: block; background: #eff6ff; color: #1e40af; }
    .ai-status.success { display: block; background: #f0fdf4; color: #166534; }
    .ai-status.error { display: block; background: #fef2f2; color: #991b1b; }

    /* Canvas area */
    main { padding: 14px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
    .canvas-hint { font-size: 11px; color: #94a3b8; text-align: center; padding: 5px; flex-shrink: 0; margin-bottom: 4px; }
    .preview-shell { background: #e9edf2; border-radius: 16px; padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .info-bar { background: rgba(255,255,255,.90); border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px 12px; font-size: 11px; color: #374151; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
    .preview-scroll { flex: 1; overflow: auto; background: rgba(255,255,255,.32); border-radius: 12px; border: 1px solid rgba(148,163,184,.28); padding: 14px; }
    #previewBox { min-width: max-content; display: flex; justify-content: center; align-items: flex-start; }
    #previewBox svg { background: #fff; box-shadow: var(--shadow); max-width: none; height: auto; border-radius: 3px; display: block; }
    .text-item { cursor: move; }
    .text-item text { user-select: none; }
    .text-item:hover .item-hover-rect { display: block; }
    .item-hover-rect { display: none; }

    .zoom-bar { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: rgba(255,255,255,.7); border-radius: 8px; align-self: flex-end; flex-shrink: 0; }
    .zoom-bar span { font-size: 11px; color: #374151; font-weight: 700; min-width: 36px; text-align: center; }
    .zoom-btn { background: #fff; border: 1px solid #e5e7eb; color: #374151; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; font-family: inherit; padding: 0; }
    .zoom-btn:hover { background: #f1f5f9; opacity: 1; }

    #authLoading { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1080px) {
      .app { grid-template-columns: 1fr; }
      aside { max-height: none; }
      main { min-height: 75vh; }
      .nav-user-name { display: none; }
    }
    @media print {
      body { background: #fff; padding-top: 0; }
      .top-nav, aside, .info-bar, .zoom-bar, .canvas-hint { display: none; }
      main, .preview-shell, .preview-scroll { padding: 0; margin: 0; height: auto; overflow: visible; background: #fff; border: 0; flex: none; }
      #previewBox svg { box-shadow: none; width: 100% !important; }
    }
  </style>
</head>
<body>

<div id="authLoading"><div class="spinner"></div></div>

<nav class="top-nav">
  <a class="nav-back" href="../dashboard.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    목록으로
  </a>
  <div class="nav-title">🎨 표지 생성기</div>
  <div class="nav-user">
    <span class="nav-user-name" id="navUserName"></span>
    <button class="nav-logout" id="navLogout">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      로그아웃
    </button>
  </div>
</nav>

<div class="app">
  <aside>
    <h1>표지 생성기</h1>
    <div class="sub">항목을 추가하고 캔버스에서 드래그해 위치를 조정하세요. AI가 배경을 자동 디자인합니다.</div>

    <!-- 1. 출력 영역 -->
    <div class="section">
      <h2>출력 영역</h2>
      <div class="field">
        <label>출력 모드</label>
        <select id="mode">
          <option value="front">앞표지만</option>
          <option value="full">뒤표지 + 책등 + 앞표지</option>
        </select>
      </div>
      <div class="grid2">
        <div class="field"><label>가로(mm)</label><input id="frontW" type="number" placeholder="210" min="80" step="1" value="210"></div>
        <div class="field"><label>세로(mm)</label><input id="frontH" type="number" placeholder="297" min="100" step="1" value="297"></div>
        <div class="field"><label>도련(mm)</label><input id="bleed" type="number" placeholder="3" min="0" step="0.5" value="3"></div>
      </div>

      <!-- 책등 -->
      <div id="spineSection" style="display:none;">
        <label class="checkline" style="margin-bottom:6px;">
          <input id="noSpine" type="checkbox"> 책등 없음
        </label>
        <div id="spineDetails">
          <div class="field"><label>책등 두께(mm)</label><input id="spineW" type="number" placeholder="8" min="0" step="0.5" value="8"></div>
          <div class="field">
            <label>책등 문구</label>
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;">
              <label class="checkline" style="margin:0;flex:1;">
                <input id="spineVertical" type="checkbox"> 세로 배치
              </label>
            </div>
            <input id="spineText" type="text" placeholder="책등에 들어갈 텍스트">
          </div>
        </div>
      </div>

      <label class="checkline"><input id="showGuides" type="checkbox" checked> 재단선·도련선 표시</label>
    </div>

    <!-- 2. 표지 내용 -->
    <div class="section">
      <h2>표지 내용</h2>

      <!-- 앞/뒤 탭 (full 모드일 때만 표시) -->
      <div class="view-tabs" id="contentTabs" style="display:none;">
        <button class="view-tab active" data-view="front">앞표지</button>
        <button class="view-tab" data-view="back">뒤표지</button>
      </div>

      <div class="item-list" id="itemList"></div>
      <button class="add-item-btn" id="addItemBtn">+ 항목 추가</button>
      <div class="smallnote" style="margin-top:6px;">캔버스에서 드래그해 위치 조정 · 마우스 휠로 크기 조절</div>

      <div style="margin-top:12px; border-top:1px solid #f0f0f0; padding-top:10px;">
        <div class="field">
          <label>로고 이미지</label>
          <input id="logoFile" type="file" accept="image/*">
        </div>
        <div class="field">
          <label>기관명 / 학교명</label>
          <input id="logoOrg" type="text" placeholder="로고 옆에 표시될 이름">
        </div>
      </div>
    </div>

    <!-- 3. AI 배경 -->
    <div class="section">
      <h2>AI 배경 디자인</h2>

      <!-- 앞/뒤 탭 (full 모드일 때만 표시) -->
      <div class="view-tabs" id="bgTabs" style="display:none;">
        <button class="view-tab active" data-view="front">앞표지 배경</button>
        <button class="view-tab" data-view="back">뒤표지 배경</button>
      </div>

      <div class="field">
        <label>디자인 설명 <span style="font-weight:400;color:#9ca3af;">(AI에게 원하는 스타일 설명)</span></label>
        <textarea id="aiDesc" placeholder="예) 파란 계열의 심플한 학술 자료 표지, 기하학적 패턴, 깔끔하고 전문적인 느낌"></textarea>
      </div>
      <button class="ai-btn" id="generateBgBtn" onclick="generateAiBg()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        AI 배경 자동 생성
      </button>
      <div class="ai-status" id="aiStatus"></div>

      <div style="margin-top:10px; border-top:1px solid #f0f0f0; padding-top:10px;">
        <div class="field">
          <label>직접 업로드</label>
          <input id="bgFile" type="file" accept="image/*">
        </div>
        <div id="bgOpacityWrap" style="display:none;">
          <label>배경 투명도</label>
          <input id="bgOpacity" type="range" min="0.1" max="1" step="0.05" value="1">
          <div class="minirow"><span>투명</span><span id="bgOpacityVal">100%</span><span>진하게</span></div>
        </div>
        <button class="secondary" id="clearBgBtn" onclick="clearBg()" style="width:100%;margin-top:6px;display:none;">배경 제거</button>
      </div>
    </div>

    <!-- 4. 저장 -->
    <div class="section">
      <h2>저장</h2>
      <div class="btns">
        <button class="blue" id="downloadPng">PNG 저장</button>
        <button class="secondary" id="downloadSvg">SVG 저장</button>
        <button class="green" id="printPdf">PDF 저장/인쇄</button>
        <button class="secondary" id="resetBtn">초기화</button>
      </div>
      <div class="smallnote" style="margin-top:6px;">PDF는 인쇄창에서 "PDF로 저장"을 선택하세요.</div>
    </div>
  </aside>

  <main>
    <div class="canvas-hint">💡 텍스트 드래그로 위치 이동 · 마우스 휠로 크기 조절 · 클릭하여 선택</div>
    <div class="preview-shell">
      <div class="info-bar">
        <span id="sizeInfo"></span>
        <span id="selInfo" style="color:#2563eb;font-weight:800;"></span>
      </div>
      <div class="preview-scroll" id="previewScroll">
        <div id="previewBox"></div>
      </div>
      <div class="zoom-bar">
        <button class="zoom-btn" onclick="zoomOut()">−</button>
        <span id="zoomVal">100%</span>
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" style="font-size:10px;width:auto;padding:0 7px;" onclick="zoomFit()">맞춤</button>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script>
// ── Auth ───────────────────────────────────────────────────────────
auth.onAuthStateChanged(user => {
  if (!user) { window.location.href = '../index.html'; return; }
  document.getElementById('authLoading').style.display = 'none';
  document.getElementById('navUserName').textContent = user.displayName || user.email.split('@')[0];
});
document.getElementById('navLogout').addEventListener('click', () =>
  auth.signOut().then(() => location.href = '../index.html'));

// ── State ──────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

// Per-view state (front / back)
const views = {
  front: { items: [], bgData: '', bgOpacity: 1 },
  back:  { items: [], bgData: '', bgOpacity: 1 },
};
let activeView = 'front';  // 'front' | 'back'
let selectedId = null;
let logoData = '';
let zoomLevel = 1;
let isDragging = false, dragData = {};

function cv() { return views[activeView]; }

// ── Helpers ────────────────────────────────────────────────────────
function num(id, fb = 0) { return Math.max(0, parseFloat($(id).value) || fb); }
function readFile(input, cb) {
  const f = input.files?.[0]; if (!f) return cb('');
  const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(f);
}
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escSvg(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getSpineW() { return $('noSpine').checked ? 0 : num('spineW', 8); }

// ── Items ──────────────────────────────────────────────────────────
function makeItem(idx, view) {
  const frontW = num('frontW', 210), frontH = num('frontH', 297);
  const spineW = getSpineW(), b = num('bleed', 3);
  const mode = $('mode').value;
  const v = view || activeView;
  let cx;
  if (v === 'front') {
    cx = mode === 'full' ? b + frontW + spineW + frontW / 2 : b + frontW / 2;
  } else {
    cx = b + frontW / 2;
  }
  return {
    id: Date.now() + Math.random(),
    text: '', fontSize: 24, color: '#111827', bold: false,
    x: cx, y: b + frontH * (0.28 + idx * 0.14),
    view: v,
  };
}

function findItemGlobal(id) {
  return views.front.items.find(i => i.id === id) ||
         views.back.items.find(i => i.id === id) || null;
}

function itemViewOf(id) {
  if (views.front.items.find(i => i.id === id)) return 'front';
  if (views.back.items.find(i => i.id === id)) return 'back';
  return null;
}

// Select item — only updates CSS, does NOT rebuild DOM
function selectItem(id) {
  selectedId = id;
  if (id !== null) {
    const v = itemViewOf(id);
    if (v && v !== activeView) { activeView = v; renderItemList(); return; }
  }
  $('itemList').querySelectorAll('.item-row[data-item-id]').forEach(row => {
    const rid = parseFloat(row.dataset.itemId);
    row.classList.toggle('is-selected', rid === id);
  });
  highlightSelected();
}

function renderItemList() {
  const list = $('itemList');
  const prevFocus = document.activeElement;
  const prevFocusId = prevFocus?.dataset?.itemId;
  const prevFocusType = prevFocus?.dataset?.inputType;

  list.innerHTML = '';
  const viewItems = cv().items;
  viewItems.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'item-row' + (item.id === selectedId ? ' is-selected' : '');
    row.dataset.itemId = item.id;
    row.innerHTML = `
      <div class="item-row-top">
        <input class="item-text-input" type="text" data-input-type="text" data-item-id="${item.id}"
          placeholder="텍스트 입력..." value="${escAttr(item.text)}" autocomplete="off" />
        <button class="item-del" title="삭제" data-del="${item.id}">×</button>
      </div>
      <div class="item-row-opts">
        <div>
          <div class="item-opt-label">글자 크기</div>
          <input class="item-fs-input" type="number" data-input-type="fs" data-item-id="${item.id}" min="4" max="200" value="${item.fontSize}" />
        </div>
        <div>
          <div class="item-opt-label">색상</div>
          <input type="color" class="item-color-input" data-item-id="${item.id}" value="${item.color}" />
        </div>
        <div>
          <div class="item-opt-label">굵기</div>
          <button class="item-bold-btn${item.bold ? ' on' : ''}" data-bold="${item.id}">B</button>
        </div>
      </div>
    `;

    // Text input — update item directly, no DOM rebuild
    const textInput = row.querySelector('.item-text-input');
    textInput.addEventListener('input', e => { item.text = e.target.value; render(); });
    textInput.addEventListener('focus', () => { selectItem(item.id); });

    // Font size
    const fsInput = row.querySelector('.item-fs-input');
    fsInput.addEventListener('input', e => { item.fontSize = Math.max(4, +e.target.value || 4); render(); });
    fsInput.addEventListener('focus', () => { selectItem(item.id); });

    // Color
    row.querySelector('.item-color-input').addEventListener('input', e => { item.color = e.target.value; render(); });

    // Delete
    row.querySelector('.item-del').addEventListener('click', e => {
      e.stopPropagation();
      const vi = cv().items.indexOf(item);
      if (vi !== -1) cv().items.splice(vi, 1);
      if (selectedId === item.id) selectedId = null;
      renderItemList();
      render();
    });

    // Bold
    row.querySelector('.item-bold-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      item.bold = !item.bold;
      this.classList.toggle('on', item.bold);
      render();
    });

    // Row click to select (not on inputs/buttons)
    row.addEventListener('mousedown', e => {
      if (e.target.closest('input') || e.target.closest('button')) return;
      selectItem(item.id);
    });

    list.appendChild(row);
  });

  // Restore focus if possible
  if (prevFocusId && prevFocusType) {
    const restored = list.querySelector(
      `input[data-item-id="${prevFocusId}"][data-input-type="${prevFocusType}"]`
    );
    if (restored) {
      requestAnimationFrame(() => {
        restored.focus();
        if (restored.type === 'text' && restored.selectionStart !== undefined) {
          const len = restored.value.length;
          restored.setSelectionRange(len, len);
        }
      });
    }
  }
}

// ── SVG generation ─────────────────────────────────────────────────
function makeSvg() {
  const mode = $('mode').value;
  const frontW = num('frontW', 210), frontH = num('frontH', 297);
  const spineW = getSpineW(), b = num('bleed', 3);
  const w = mode === 'full' ? frontW * 2 + spineW + b * 2 : frontW + b * 2;
  const h = frontH + b * 2;
  const frontX = mode === 'full' ? b + frontW + spineW : b;
  const backX  = b;

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}mm" height="${h}mm" viewBox="0 0 ${w} ${h}">`;
  svg += `<defs>`;
  if (mode === 'full') {
    svg += `<clipPath id="cpFront"><rect x="${frontX}" y="0" width="${frontW + b}" height="${h}"/></clipPath>`;
    svg += `<clipPath id="cpBack"><rect x="0" y="0" width="${backX + frontW + (spineW > 0 ? spineW / 2 : 0)}" height="${h}"/></clipPath>`;
  }
  svg += `</defs>`;

  // White base
  svg += `<rect width="${w}" height="${h}" fill="#ffffff"/>`;

  // Backgrounds
  if (mode === 'full') {
    if (views.back.bgData) {
      svg += `<image href="${views.back.bgData}" x="0" y="0" width="${b + frontW + spineW / 2}" height="${h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cpBack)" opacity="${views.back.bgOpacity}"/>`;
    }
    if (views.front.bgData) {
      svg += `<image href="${views.front.bgData}" x="${frontX - b}" y="0" width="${frontW + b * 2}" height="${h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cpFront)" opacity="${views.front.bgOpacity}"/>`;
    }
  } else {
    if (views.front.bgData) {
      svg += `<image href="${views.front.bgData}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" opacity="${views.front.bgOpacity}"/>`;
    }
  }

  // All text items (front + back)
  const allItems = [...views.front.items, ...views.back.items];
  allItems.forEach(item => {
    if (!item.text.trim()) return;
    const fw = item.bold ? '900' : '400';
    const isSelected = item.id === selectedId;
    const approxW = item.text.length * item.fontSize * 0.58;
    const approxH = item.fontSize * 1.3;

    svg += `<g class="text-item" data-item-id="${item.id}" style="cursor:move;">`;
    if (isSelected) {
      svg += `<rect x="${item.x - approxW/2 - 4}" y="${item.y - approxH + 2}" width="${approxW + 8}" height="${approxH + 6}" fill="rgba(37,99,235,0.07)" stroke="#2563eb" stroke-width="0.6" stroke-dasharray="2 1.5" rx="2" pointer-events="none"/>`;
    } else {
      svg += `<rect class="item-hover-rect" x="${item.x - approxW/2 - 4}" y="${item.y - approxH + 2}" width="${approxW + 8}" height="${approxH + 6}" fill="transparent" stroke="#94a3b8" stroke-width="0.4" stroke-dasharray="2 1.5" rx="2" pointer-events="none"/>`;
    }
    svg += `<text x="${item.x}" y="${item.y}" font-size="${item.fontSize}" font-weight="${fw}" text-anchor="middle" fill="${item.color}" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif" letter-spacing="-0.4">${escSvg(item.text)}</text>`;
    svg += `</g>`;
  });

  // Logo + org (front cover)
  const orgName = $('logoOrg').value.trim();
  if (orgName || logoData) {
    const centerX = frontX + frontW / 2;
    const logoSize = Math.max(12, Math.min(frontW * .12, 22));
    const logoY = b + frontH * .90;
    const orgW = orgName.length * 2.3;
    const logoX = centerX - (logoSize + orgW) / 2;
    if (logoData) {
      svg += `<image href="${logoData}" x="${logoX}" y="${logoY - logoSize*.72}" width="${logoSize}" height="${logoSize}" preserveAspectRatio="xMidYMid meet"/>`;
    } else {
      svg += `<rect x="${logoX}" y="${logoY - logoSize*.72}" width="${logoSize}" height="${logoSize}" rx="${logoSize*.12}" fill="#12396d"/>`;
      svg += `<text x="${logoX + logoSize/2}" y="${logoY - logoSize*.22}" font-size="${logoSize*.45}" font-weight="900" text-anchor="middle" fill="#fff">P</text>`;
    }
    if (orgName) {
      svg += `<text x="${logoX + logoSize + 5}" y="${logoY - logoSize*.18}" font-size="${Math.max(6, frontW/26)}" font-weight="900" fill="#111827">${escSvg(orgName)}</text>`;
    }
  }

  // Spine text
  if (mode === 'full' && spineW > 2) {
    const spineVal = $('spineText').value.trim();
    if (spineVal) {
      const sx = b + frontW + spineW / 2;
      const isVertical = $('spineVertical').checked;
      if (isVertical) {
        // Stack each character vertically
        const chars = spineVal.split('');
        const charSize = Math.max(3, Math.min(spineW * 0.65, 9));
        const lineH = charSize * 1.25;
        const totalH = chars.length * lineH;
        const startY = h / 2 - totalH / 2 + charSize * 0.8;
        chars.forEach((ch, i) => {
          svg += `<text x="${sx}" y="${startY + i * lineH}" font-size="${charSize}" font-weight="900" text-anchor="middle" fill="#12396d" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif">${escSvg(ch)}</text>`;
        });
      } else {
        // Rotated (reads top→bottom on spine)
        const fs = Math.max(3.2, Math.min(6, spineW * .55));
        svg += `<text transform="translate(${sx} ${h/2}) rotate(90)" font-size="${fs}" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#12396d" font-family="Pretendard,'Noto Sans KR',Arial,sans-serif">${escSvg(spineVal)}</text>`;
      }
    }
  }

  // Guide lines
  if ($('showGuides').checked) {
    svg += `<rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="#ef4444" stroke-width="0.25" stroke-dasharray="2 1" opacity=".7"/>`;
    svg += `<rect x="${b}" y="${b}" width="${w-b*2}" height="${h-b*2}" fill="none" stroke="#2563eb" stroke-width="0.25" stroke-dasharray="2 1" opacity=".65"/>`;
    if (mode === 'full') {
      const backEnd = b + frontW, spineEnd = b + frontW + spineW;
      if (spineW > 0) {
        svg += `<line x1="${backEnd}" y1="${b}" x2="${backEnd}" y2="${h-b}" stroke="#111827" stroke-width="0.2" stroke-dasharray="1.5 1.3" opacity=".5"/>`;
        svg += `<line x1="${spineEnd}" y1="${b}" x2="${spineEnd}" y2="${h-b}" stroke="#111827" stroke-width="0.2" stroke-dasharray="1.5 1.3" opacity=".5"/>`;
        svg += `<text x="${backEnd + spineW/2}" y="${h-1.5}" font-size="2.8" text-anchor="middle" fill="#6b7280">책등</text>`;
      } else {
        svg += `<line x1="${backEnd}" y1="${b}" x2="${backEnd}" y2="${h-b}" stroke="#111827" stroke-width="0.2" stroke-dasharray="1.5 1.3" opacity=".5"/>`;
      }
      svg += `<text x="${b + frontW/2}" y="${h-1.5}" font-size="2.8" text-anchor="middle" fill="#6b7280">뒤표지</text>`;
      svg += `<text x="${spineEnd + frontW/2}" y="${h-1.5}" font-size="2.8" text-anchor="middle" fill="#6b7280">앞표지</text>`;
    }
  }

  svg += `</svg>`;
  return { svg, w, h, mode, frontW, frontH, spineW, b };
}

// ── Render ─────────────────────────────────────────────────────────
function render() {
  const data = makeSvg();
  const pxPerMm = 3.35;
  $('previewBox').innerHTML = data.svg;
  const svgEl = $('previewBox').querySelector('svg');
  svgEl.style.width = `${Math.max(200, data.w * pxPerMm * zoomLevel)}px`;

  $('sizeInfo').textContent = data.mode === 'full'
    ? `전체 ${data.w}×${data.h}mm  (앞/뒤 각 ${data.frontW}×${data.frontH}mm)`
    : `${data.w}×${data.h}mm / 재단 후 ${data.frontW}×${data.frontH}mm`;

  attachSvgListeners(svgEl);
  highlightSelected();
}

// ── SVG interaction ────────────────────────────────────────────────
function screenToSvg(svgEl, clientX, clientY) {
  const pt = svgEl.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svgEl.getScreenCTM().inverse());
}

function attachSvgListeners(svgEl) {
  svgEl.querySelectorAll('[data-item-id]').forEach(g => {
    g.addEventListener('mousedown', e => {
      e.stopPropagation();
      const id = parseFloat(g.dataset.itemId);
      selectItem(id);
      const item = findItemGlobal(id);
      if (!item) return;
      const svgPt = screenToSvg(svgEl, e.clientX, e.clientY);
      isDragging = true;
      dragData = {
        id, offsetX: svgPt.x - item.x, offsetY: svgPt.y - item.y,
        g, textEl: g.querySelector('text'),
      };
      e.preventDefault();
    });
  });

  svgEl.addEventListener('mousedown', e => {
    if (!e.target.closest('[data-item-id]')) {
      selectItem(null);
      $('itemList').querySelectorAll('.item-row').forEach(r => r.classList.remove('is-selected'));
    }
  });

  svgEl.addEventListener('mousemove', e => {
    if (!isDragging || !dragData.id) return;
    const svgPt = screenToSvg(svgEl, e.clientX, e.clientY);
    const newX = svgPt.x - dragData.offsetX;
    const newY = svgPt.y - dragData.offsetY;
    if (dragData.textEl) {
      dragData.textEl.setAttribute('x', newX);
      dragData.textEl.setAttribute('y', newY);
    }
    const selRect = dragData.g.querySelector('rect');
    if (selRect && selectedId) {
      const item = findItemGlobal(dragData.id);
      if (item) {
        const aw = item.text.length * item.fontSize * 0.58;
        const ah = item.fontSize * 1.3;
        selRect.setAttribute('x', newX - aw/2 - 4);
        selRect.setAttribute('y', newY - ah + 2);
      }
    }
    dragData.currentX = newX; dragData.currentY = newY;
    $('selInfo').textContent = `X: ${Math.round(newX)}  Y: ${Math.round(newY)}`;
  });

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    if (dragData.id && dragData.currentX !== undefined) {
      const item = findItemGlobal(dragData.id);
      if (item) { item.x = dragData.currentX; item.y = dragData.currentY; }
    }
    dragData = {};
    render();
    $('selInfo').textContent = '';
  }

  svgEl.addEventListener('mouseup', endDrag);
  svgEl.addEventListener('mouseleave', endDrag);

  svgEl.addEventListener('wheel', e => {
    if (!selectedId) return;
    e.preventDefault();
    const item = findItemGlobal(selectedId);
    if (!item) return;
    const delta = e.deltaY < 0 ? 1 : -1;
    item.fontSize = Math.max(4, Math.min(200, item.fontSize + delta));
    const fsInput = $('itemList').querySelector(`input[data-item-id="${selectedId}"][data-input-type="fs"]`);
    if (fsInput) fsInput.value = item.fontSize;
    render();
  }, { passive: false });
}

function highlightSelected() {
  if (!selectedId) return;
  const svgEl = $('previewBox').querySelector('svg');
  if (!svgEl) return;
  const g = svgEl.querySelector(`[data-item-id="${selectedId}"]`);
  if (!g) return;
  const textEl = g.querySelector('text');
  if (!textEl) return;
  try {
    const bbox = textEl.getBBox();
    const rect = g.querySelector('rect');
    if (rect && bbox.width > 0) {
      rect.setAttribute('x', bbox.x - 4);
      rect.setAttribute('y', bbox.y - 3);
      rect.setAttribute('width', bbox.width + 8);
      rect.setAttribute('height', bbox.height + 6);
    }
  } catch(e) {}
}

// ── Zoom ───────────────────────────────────────────────────────────
function zoomIn()  { zoomLevel = Math.min(zoomLevel + 0.15, 4); updateZoom(); }
function zoomOut() { zoomLevel = Math.max(zoomLevel - 0.15, 0.1); updateZoom(); }
function zoomFit() {
  const scroll = $('previewScroll'), data = makeSvg();
  zoomLevel = Math.min(
    (scroll.clientWidth - 30) / (data.w * 3.35),
    (scroll.clientHeight - 30) / (data.h * 3.35), 1
  );
  updateZoom();
}
function updateZoom() { $('zoomVal').textContent = Math.round(zoomLevel * 100) + '%'; render(); }
window.addEventListener('resize', zoomFit);

// ── AI background ──────────────────────────────────────────────────
function buildAiPrompt() {
  const userDesc = $('aiDesc').value.trim();
  const texts = cv().items.filter(i => i.text.trim()).map(i => i.text.trim());
  const org = $('logoOrg').value.trim();
  if (org) texts.push(org);
  const frontW = num('frontW', 210), frontH = num('frontH', 297);
  const isPortrait = frontH >= frontW;
  const mode = $('mode').value;
  const orientLabel = mode === 'full'
    ? (activeView === 'front' ? 'portrait front cover' : 'portrait back cover')
    : (isPortrait ? 'portrait' : 'landscape');
  const contentHint = texts.length > 0 ? `Cover text includes: "${texts.join('", "')}"` : '';
  const descPart = userDesc ? userDesc + '. ' : '';
  return `${descPart}Design a professional background for a printed ${orientLabel} document cover. ${contentHint} No text, letters, numbers, logos, borders, or crop marks. Central area should be clean for title placement. High quality, print-ready.`;
}

async function generateAiBg() {
  const btn = $('generateBgBtn'), status = $('aiStatus');
  btn.disabled = true;
  status.className = 'ai-status loading';
  status.textContent = '⏳ AI가 배경을 디자인하는 중... (10~30초)';

  try {
    const doc = await db.collection('settings').doc('config').get();
    const apiKey = doc.exists ? doc.data().openaiKey : null;
    if (!apiKey) {
      status.className = 'ai-status error';
      status.textContent = '⚠️ OpenAI API 키가 없습니다. 관리자 페이지에서 등록해주세요.';
      return;
    }

    const frontW = num('frontW', 210), frontH = num('frontH', 297);
    const isPortrait = frontH >= frontW;
    const size = isPortrait ? '1024x1536' : '1536x1024';

    const res = await fetch('https://api.openai.com/v1/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({ model: 'gpt-image-1', prompt: buildAiPrompt(), n: 1, size, quality: 'high' })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    cv().bgData = 'data:image/png;base64,' + data.data[0].b64_json;
    cv().bgOpacity = 1;
    status.className = 'ai-status success';
    status.textContent = `✓ ${activeView === 'front' ? '앞표지' : '뒤표지'} 배경 생성 완료!`;
    syncBgControls();
    render();
    setTimeout(() => { status.className = 'ai-status'; }, 3000);
  } catch(e) {
    status.className = 'ai-status error';
    status.textContent = '오류: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

function clearBg() {
  cv().bgData = '';
  $('bgFile').value = '';
  syncBgControls();
  render();
}

// ── Export ─────────────────────────────────────────────────────────
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('downloadSvg').addEventListener('click', () => {
  const { svg, mode } = makeSvg();
  download(`cover-${mode}.svg`, new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
});
$('downloadPng').addEventListener('click', () => {
  const { svg, w, h, mode } = makeSvg();
  const scale = 300 / 25.4;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
  const ctx = canvas.getContext('2d'), img = new Image();
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
  img.onload = () => {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => download(`cover-${mode}-300dpi.png`, blob), 'image/png');
    URL.revokeObjectURL(url);
  };
  img.src = url;
});
$('printPdf').addEventListener('click', () => {
  const { svg, w, h } = makeSvg();
  const win = window.open('', '_blank');
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>PDF</title><style>@page{size:${w}mm ${h}mm;margin:0}html,body{margin:0;padding:0;width:${w}mm;height:${h}mm}svg{display:block;width:${w}mm;height:${h}mm}</style></head><body>${svg}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);
  win.document.close();
});
$('resetBtn').addEventListener('click', () => {
  views.front.items = []; views.front.bgData = ''; views.front.bgOpacity = 1;
  views.back.items  = []; views.back.bgData  = ''; views.back.bgOpacity  = 1;
  selectedId = null; logoData = '';

});

});

$('bgFile').addEventListener('change', e => readFile(e.target, d => {
  cv().bgData = d; cv().bgOpacity = 1; syncBgControls(); render();
}));
$('logoFile').addEventListener('change', e => readFile(e.target, d => { logoData = d; render(); }));

['frontW','frontH','bleed','spineW','showGuides','logoOrg','spineText','spineVertical'].forEach(id => {
  const el = $(id); if (el) el.addEventListener('input', render);
});

// ── Init ───────────────────────────────────────────────────────────
syncModeUI();
renderItemList();
syncBgControls();
setTimeout(zoomFit, 100);
render();
</script>
</body>
</html>
