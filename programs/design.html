<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>디자인 보드 · Program Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: Pretendard, "Noto Sans KR", sans-serif;
      background: #1e1e2e;
      color: #e0e0f0;
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }

    /* Auth overlay */
    #authOverlay {
      position: fixed; inset: 0;
      background: #1e1e2e;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    #authOverlay.hidden { display: none; }

    /* TOP NAV */
    #topNav {
      height: 52px;
      background: #16162a;
      border-bottom: 1px solid #2e2e4a;
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px;
      flex-shrink: 0;
      z-index: 100;
    }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: 600;
      padding: 6px 10px; border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .nav-back:hover { background: #2e2e4a; color: #e0e0f0; }
    .nav-title {
      flex: 1;
      font-size: 15px; font-weight: 800; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-doc-name {
      background: transparent; border: 1px solid #3e3e5a;
      color: #e0e0f0; font-size: 13px; font-weight: 600;
      padding: 5px 10px; border-radius: 8px;
      font-family: inherit; outline: none; width: 180px;
      transition: border-color 0.15s;
    }
    .nav-doc-name:focus { border-color: #7c6af5; }
    .nav-sep { width: 1px; height: 26px; background: #2e2e4a; flex-shrink: 0; }
    .export-group { display: flex; gap: 6px; }
    .export-btn {
      background: #2e2e4a; border: 1px solid #3e3e5a;
      color: #e0e0f0; font-size: 12px; font-weight: 700;
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
      font-family: inherit; transition: all 0.15s; white-space: nowrap;
    }
    .export-btn:hover { background: #3e3e5a; border-color: #5e5e7a; }
    .export-btn.primary { background: #7c6af5; border-color: #7c6af5; color: #fff; }
    .export-btn.primary:hover { background: #6a58e3; }
    .nav-user { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
    .nav-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #7c6af5, #4fa8d5);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff;
    }
    .nav-user-name { font-size: 13px; color: #94a3b8; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn {
      background: transparent; border: 1px solid #3e3e5a;
      color: #94a3b8; font-size: 12px; font-weight: 600;
      padding: 5px 10px; border-radius: 8px; cursor: pointer;
      font-family: inherit; transition: all 0.15s;
    }
    .logout-btn:hover { border-color: #e05a5a; color: #e05a5a; }

    /* MAIN LAYOUT */
    #main { flex: 1; display: flex; overflow: hidden; }

    /* LEFT PANEL */
    #leftPanel {
      width: 58px;
      background: #16162a;
      border-right: 1px solid #2e2e4a;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 8px 0;
      gap: 2px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .tool-btn {
      width: 42px; height: 42px;
      background: transparent; border: none;
      border-radius: 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; color: #7a7a9a; transition: all 0.15s;
      font-family: inherit;
    }
    .tool-btn:hover { background: #2e2e4a; color: #e0e0f0; }
    .tool-btn.active { background: #7c6af5; color: #fff; }
    .tool-btn svg { width: 18px; height: 18px; }
    .tool-btn span { font-size: 9px; font-weight: 700; line-height: 1; }
    .tool-sep { width: 30px; height: 1px; background: #2e2e4a; margin: 4px 0; }

    /* CANVAS AREA */
    #canvasArea {
      flex: 1;
      background: #28283e;
      display: flex; flex-direction: column;
      align-items: center;
      overflow: auto;
      padding: 24px 24px 0;
      position: relative;
    }
    #canvasWrapper {
      position: relative;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }
    #designCanvas { display: block; }

    /* ZOOM BAR */
    #zoomBar {
      width: 100%;
      background: #16162a; border-top: 1px solid #2e2e4a;
      padding: 6px 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #7a7a9a;
      flex-shrink: 0; margin-top: auto;
      position: sticky; bottom: 0;
    }
    #zoomVal { color: #e0e0f0; font-weight: 700; min-width: 40px; text-align: center; }
    .zoom-btn {
      background: #2e2e4a; border: 1px solid #3e3e5a;
      color: #e0e0f0; width: 26px; height: 26px; border-radius: 6px;
      cursor: pointer; font-size: 16px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; transition: background 0.15s;
    }
    .zoom-btn:hover { background: #3e3e5a; }

    /* RIGHT PANEL */
    #rightPanel {
      width: 240px;
      background: #16162a;
      border-left: 1px solid #2e2e4a;
      display: flex; flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .panel-section { border-bottom: 1px solid #2e2e4a; padding: 12px; }
    .panel-section-title {
      font-size: 10px; font-weight: 800; color: #5e5e7a;
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;
    }
    .prop-row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
    .prop-row:last-child { margin-bottom: 0; }
    .prop-label { font-size: 11px; color: #7a7a9a; font-weight: 600; min-width: 36px; flex-shrink: 0; }
    .prop-input {
      flex: 1; background: #1e1e2e; border: 1px solid #3e3e5a;
      color: #e0e0f0; font-size: 12px; font-family: inherit;
      padding: 5px 8px; border-radius: 7px; outline: none;
      transition: border-color 0.15s; min-width: 0;
    }
    .prop-input:focus { border-color: #7c6af5; }
    .prop-input[type="color"] { padding: 2px 4px; height: 30px; cursor: pointer; }
    .prop-input[type="range"] { padding: 0; height: 4px; cursor: pointer; accent-color: #7c6af5; }
    select.prop-input { cursor: pointer; }
    .prop-input-sm { width: 60px; flex: none; }
    .prop-btn-row { display: flex; gap: 5px; margin-bottom: 7px; }
    .prop-btn-row:last-child { margin-bottom: 0; }
    .prop-btn {
      flex: 1; background: #1e1e2e; border: 1px solid #3e3e5a;
      color: #94a3b8; font-size: 11px; font-weight: 700;
      padding: 5px 4px; border-radius: 7px; cursor: pointer;
      font-family: inherit; transition: all 0.15s; text-align: center;
    }
    .prop-btn:hover { background: #2e2e4a; color: #e0e0f0; }
    .prop-btn.active { background: #7c6af5; border-color: #7c6af5; color: #fff; }
    .prop-btn svg { width: 13px; height: 13px; vertical-align: middle; }

    .doc-size-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px; }
    .doc-size-btn {
      background: #1e1e2e; border: 1px solid #3e3e5a;
      color: #94a3b8; font-size: 11px; font-weight: 700;
      padding: 6px 4px; border-radius: 7px; cursor: pointer;
      font-family: inherit; text-align: center; transition: all 0.15s;
    }
    .doc-size-btn:hover { background: #2e2e4a; color: #e0e0f0; }
    .doc-size-btn.active { background: #7c6af5; border-color: #7c6af5; color: #fff; }

    #layerList { display: flex; flex-direction: column; gap: 4px; }
    .layer-item {
      display: flex; align-items: center; gap: 6px;
      background: #1e1e2e; border: 1px solid #3e3e5a;
      border-radius: 7px; padding: 5px 8px; cursor: pointer;
      transition: all 0.15s;
    }
    .layer-item:hover { border-color: #5e5e7a; }
    .layer-item.selected { border-color: #7c6af5; background: #2a2040; }
    .layer-thumb {
      width: 22px; height: 22px; flex-shrink: 0;
      background: #2e2e4a; border-radius: 4px;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
    }
    .layer-name { flex: 1; font-size: 11px; color: #c0c0d8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer-vis { background: transparent; border: none; color: #5e5e7a; cursor: pointer; padding: 2px; font-size: 13px; line-height: 1; transition: color 0.15s; }
    .layer-vis:hover { color: #e0e0f0; }
    .layer-actions { display: flex; gap: 4px; margin-top: 8px; }
    .layer-action-btn {
      flex: 1; background: #1e1e2e; border: 1px solid #3e3e5a;
      color: #94a3b8; font-size: 11px; font-weight: 700;
      padding: 5px; border-radius: 7px; cursor: pointer;
      font-family: inherit; transition: all 0.15s; text-align: center;
    }
    .layer-action-btn:hover { background: #2e2e4a; color: #e0e0f0; }

    .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tpl-btn {
      background: #1e1e2e; border: 1px solid #3e3e5a;
      border-radius: 8px; padding: 8px 4px; cursor: pointer;
      text-align: center; transition: all 0.15s; font-family: inherit;
    }
    .tpl-btn:hover { border-color: #7c6af5; background: #2a2040; }
    .tpl-icon { font-size: 22px; display: block; margin-bottom: 4px; }
    .tpl-name { font-size: 10px; color: #94a3b8; font-weight: 700; }

    #imgFileInput { display: none; }

    #ctxMenu {
      position: fixed; z-index: 1000;
      background: #1e1e2e; border: 1px solid #3e3e5a;
      border-radius: 10px; padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none; min-width: 160px;
    }
    .ctx-item { padding: 7px 12px; border-radius: 6px; font-size: 13px; color: #c0c0d8; cursor: pointer; transition: background 0.12s; }
    .ctx-item:hover { background: #2e2e4a; }
    .ctx-item.danger { color: #e05a5a; }
    .ctx-sep { height: 1px; background: #2e2e4a; margin: 4px 0; }

    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #2e2e4a; border: 1px solid #3e3e5a;
      color: #e0e0f0; font-size: 13px; font-weight: 600;
      padding: 10px 20px; border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.25s ease;
      pointer-events: none; z-index: 5000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3e3e5a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #5e5e7a; }
  </style>
</head>
<body>

<div id="authOverlay">
  <div style="text-align:center;color:#94a3b8;font-size:15px;">로그인 확인 중...</div>
</div>

<div id="ctxMenu">
  <div class="ctx-item" onclick="ctxBringFront()">맨 앞으로</div>
  <div class="ctx-item" onclick="ctxSendBack()">맨 뒤로</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" onclick="ctxDuplicate()">복제</div>
  <div class="ctx-item" onclick="ctxGroup()">그룹</div>
  <div class="ctx-item" onclick="ctxUngroup()">그룹 해제</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" onclick="ctxLock()">잠금 / 해제</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" onclick="deleteSelected()">삭제</div>
</div>

<div id="toast"></div>
<input type="file" id="imgFileInput" accept="image/*" multiple />

<div id="topNav">
  <a class="nav-back" href="../dashboard.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    목록으로
  </a>
  <div class="nav-sep"></div>
  <div class="nav-title">🎨 디자인 보드</div>
  <input class="nav-doc-name" id="docName" type="text" placeholder="문서 이름 없음" />
  <div class="nav-sep"></div>
  <div class="export-group">
    <button class="export-btn" onclick="exportPNG()">PNG</button>
    <button class="export-btn" onclick="exportSVG()">SVG</button>
    <button class="export-btn primary" onclick="exportPDF()">PDF 저장</button>
  </div>
  <div class="nav-sep"></div>
  <div class="nav-user">
    <div class="nav-avatar" id="navAvatar">?</div>
    <span class="nav-user-name" id="navUserName"></span>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </div>
</div>

<div id="main">

  <!-- LEFT PANEL -->
  <div id="leftPanel">
    <button class="tool-btn active" id="tool-select" title="선택 (V)" onclick="setTool('select')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-7 1-4 7z"/></svg>
      <span>선택</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="tool-text" title="텍스트 (T)" onclick="setTool('text')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span>텍스트</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="tool-rect" title="사각형 (R)" onclick="setTool('rect')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span>사각형</span>
    </button>
    <button class="tool-btn" id="tool-circle" title="원 (C)" onclick="setTool('circle')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
      <span>원</span>
    </button>
    <button class="tool-btn" id="tool-triangle" title="삼각형" onclick="setTool('triangle')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 3 21 21 3 21"/></svg>
      <span>삼각형</span>
    </button>
    <button class="tool-btn" id="tool-line" title="선" onclick="setTool('line')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"/></svg>
      <span>선</span>
    </button>
    <button class="tool-btn" id="tool-star" title="별" onclick="addStar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>별</span>
    </button>
    <button class="tool-btn" id="tool-arrow" title="화살표" onclick="addArrow()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      <span>화살표</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" title="이미지 추가" onclick="document.getElementById('imgFileInput').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>이미지</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="tool-draw" title="자유 드로잉 (D)" onclick="setTool('draw')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span>펜</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" title="실행취소 (Ctrl+Z)" onclick="undo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
      <span>취소</span>
    </button>
    <button class="tool-btn" title="다시실행 (Ctrl+Y)" onclick="redo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4"/></svg>
      <span>다시</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" title="삭제 (Delete)" onclick="deleteSelected()" style="color:#e05a5a;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      <span>삭제</span>
    </button>
  </div>

  <!-- CANVAS AREA -->
  <div id="canvasArea">
    <div id="canvasWrapper">
      <canvas id="designCanvas"></canvas>
    </div>
    <div id="zoomBar">
      <button class="zoom-btn" onclick="zoomOut()">−</button>
      <span id="zoomVal">100%</span>
      <button class="zoom-btn" onclick="zoomIn()">+</button>
      <button class="zoom-btn" style="font-size:11px;width:auto;padding:0 8px;" onclick="zoomFit()">맞춤</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="rightPanel">

    <div class="panel-section">
      <div class="panel-section-title">문서 크기</div>
      <div class="doc-size-grid" id="docSizeGrid">
        <button class="doc-size-btn active" data-w="595" data-h="842" onclick="setDocSize(this)">A4 세로</button>
        <button class="doc-size-btn" data-w="842" data-h="595" onclick="setDocSize(this)">A4 가로</button>
        <button class="doc-size-btn" data-w="420" data-h="595" onclick="setDocSize(this)">A5 세로</button>
        <button class="doc-size-btn" data-w="595" data-h="420" onclick="setDocSize(this)">A5 가로</button>
        <button class="doc-size-btn" data-w="252" data-h="144" onclick="setDocSize(this)">명함</button>
        <button class="doc-size-btn" data-w="500" data-h="500" onclick="setDocSize(this)">정사각형</button>
        <button class="doc-size-btn" data-w="794" data-h="1123" onclick="setDocSize(this)">전단지</button>
        <button class="doc-size-btn" data-w="1080" data-h="1080" onclick="setDocSize(this)">SNS</button>
      </div>
      <div class="prop-row">
        <span class="prop-label">W</span>
        <input class="prop-input" type="number" id="canvasW" value="595" min="100" max="3000" onchange="applyCustomSize()" />
        <span class="prop-label" style="text-align:center;">H</span>
        <input class="prop-input" type="number" id="canvasH" value="842" min="100" max="3000" onchange="applyCustomSize()" />
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">배경</div>
      <div class="prop-row">
        <span class="prop-label">색상</span>
        <input class="prop-input" type="color" id="bgColor" value="#ffffff" onchange="applyBgColor()" />
        <button class="prop-btn" onclick="setBgTransparent()" style="flex:none;padding:5px 8px;font-size:10px;">투명</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">빠른 템플릿</div>
      <div class="tpl-grid">
        <button class="tpl-btn" onclick="applyTemplate('menu')"><span class="tpl-icon">🍽️</span><span class="tpl-name">메뉴판</span></button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// AUTH
auth.onAuthStateChanged(user => {
  if (!user) { window.location.href = '../index.html'; return; }
  document.getElementById('authOverlay').classList.add('hidden');
  const name = user.displayName || user.email || '사용자';
  document.getElementById('navUserName').textContent = name;
  document.getElementById('navAvatar').textContent = name[0].toUpperCase();
});
document.getElementById('logoutBtn').addEventListener('click', () => {
  auth.signOut().then(() => window.location.href = '../index.html');
});

// CANVAS
let canvasW = 595, canvasH = 842;
let zoomLevel = 1;
let currentTool = 'select';
let undoStack = [], redoStack = [];
let isDrawingShape = false, shapeStartX, shapeStartY, activeShape;

const canvas = new fabric.Canvas('designCanvas', {
  width: canvasW, height: canvasH,
  backgroundColor: '#ffffff',
  selection: true,
  preserveObjectStacking: true,
});

// ZOOM
function updateZoom() {
  const wrapper = document.getElementById('canvasWrapper');
  wrapper.style.transform = `scale(${zoomLevel})`;
  wrapper.style.transformOrigin = 'top center';
  wrapper.style.marginBottom = (canvasH * zoomLevel - canvasH) + 'px';
  document.getElementById('zoomVal').textContent = Math.round(zoomLevel * 100) + '%';
}
function zoomIn() { zoomLevel = Math.min(zoomLevel + 0.1, 4); updateZoom(); }
function zoomOut() { zoomLevel = Math.max(zoomLevel - 0.1, 0.1); updateZoom(); }
function zoomFit() {
  const area = document.getElementById('canvasArea');
  const availW = area.clientWidth - 48;
  const availH = area.clientHeight - 80;
  zoomLevel = Math.min(availW / canvasW, availH / canvasH, 1);
  updateZoom();
}
window.addEventListener('resize', zoomFit);

// UNDO/REDO
function saveState() {
  undoStack.push(JSON.stringify(canvas.toJSON(['locked'])));
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (undoStack.length < 2) return;
  redoStack.push(undoStack.pop());
  canvas.loadFromJSON(undoStack[undoStack.length - 1], () => { canvas.renderAll(); updateLayerList(); });
}
function redo() {
  if (!redoStack.length) return;
  const next = redoStack.pop();
  undoStack.push(next);
  canvas.loadFromJSON(next, () => { canvas.renderAll(); updateLayerList(); });
}

canvas.on('object:added', () => { saveState(); updateLayerList(); });
canvas.on('object:modified', () => { saveState(); updateLayerList(); });
canvas.on('object:removed', () => { saveState(); updateLayerList(); });
canvas.on('selection:created', updatePropsPanel);
canvas.on('selection:updated', updatePropsPanel);
canvas.on('selection:cleared', updatePropsPanel);

setTimeout(saveState, 100);

// TOOL SWITCH
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn[id^="tool-"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-' + tool);
  if (btn) btn.classList.add('active');
  if (tool === 'draw') {
    canvas.isDrawingMode = true;
    canvas.freeDrawingBrush.color = '#333333';
    canvas.freeDrawingBrush.width = 3;
    canvas.selection = false;
  } else {
    canvas.isDrawingMode = false;
    canvas.selection = (tool === 'select');
    canvas.getObjects().forEach(o => { if (!o.locked) o.selectable = (tool === 'select'); });
  }
}

// SHAPE DRAWING
canvas.on('mouse:down', function(opt) {
  if (['rect','circle','triangle','line'].includes(currentTool)) {
    const ptr = canvas.getPointer(opt.e);
    shapeStartX = ptr.x; shapeStartY = ptr.y;
    isDrawingShape = true;
    canvas.selection = false;
    if (currentTool === 'rect') {
      activeShape = new fabric.Rect({ left: shapeStartX, top: shapeStartY, width: 1, height: 1, fill: '#7c6af5', stroke: 'transparent', strokeWidth: 0, selectable: false, evented: false });
    } else if (currentTool === 'circle') {
      activeShape = new fabric.Ellipse({ left: shapeStartX, top: shapeStartY, rx: 1, ry: 1, fill: '#7c6af5', stroke: 'transparent', strokeWidth: 0, selectable: false, evented: false });
    } else if (currentTool === 'triangle') {
      activeShape = new fabric.Triangle({ left: shapeStartX, top: shapeStartY, width: 1, height: 1, fill: '#7c6af5', stroke: 'transparent', strokeWidth: 0, selectable: false, evented: false });
    } else if (currentTool === 'line') {
      activeShape = new fabric.Line([shapeStartX, shapeStartY, shapeStartX, shapeStartY], { stroke: '#7c6af5', strokeWidth: 3, selectable: false, evented: false });
    }
    canvas.add(activeShape);
  }
  if (currentTool === 'text') {
    const ptr = canvas.getPointer(opt.e);
    const txt = new fabric.IText('텍스트를 입력하세요', { left: ptr.x, top: ptr.y, fontFamily: 'Noto Sans KR', fontSize: 32, fill: '#1e1e2e' });
    canvas.add(txt);
    canvas.setActiveObject(txt);
    txt.enterEditing(); txt.selectAll();
    setTool('select');
  }
});
canvas.on('mouse:move', function(opt) {
  if (!isDrawingShape || !activeShape) return;
  const ptr = canvas.getPointer(opt.e);
  const w = Math.abs(ptr.x - shapeStartX), h = Math.abs(ptr.y - shapeStartY);
  const left = Math.min(ptr.x, shapeStartX), top = Math.min(ptr.y, shapeStartY);
  if (currentTool === 'rect' || currentTool === 'triangle') {
    activeShape.set({ left, top, width: w, height: h });
  } else if (currentTool === 'circle') {
    activeShape.set({ left, top, rx: w/2, ry: h/2 });
  } else if (currentTool === 'line') {
    activeShape.set({ x2: ptr.x, y2: ptr.y });
  }
  canvas.renderAll();
});
canvas.on('mouse:up', function() {
  if (isDrawingShape && activeShape) {
    isDrawingShape = false;
    activeShape.set({ selectable: true, evented: true });
    activeShape = null;
    setTool('select');
  }
});

// STAR
function addStar() {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 60 : 25;
    const angle = (Math.PI / 5) * i - Math.PI / 2;
    pts.push({ x: r * Math.cos(angle), y: r * Math.sin(angle) });
  }
  const star = new fabric.Polygon(pts, { left: canvasW/2 - 60, top: canvasH/2 - 60, fill: '#f5c842' });
  canvas.add(star); canvas.setActiveObject(star); setTool('select');
}

// ARROW
function addArrow() {
  const group = new fabric.Group([
    new fabric.Line([0, 0, 150, 0], { stroke: '#7c6af5', strokeWidth: 4, left: 0, top: 10 }),
    new fabric.Triangle({ width: 20, height: 20, fill: '#7c6af5', left: 140, top: 0, angle: 90 }),
  ], { left: canvasW/2 - 80, top: canvasH/2 });
  canvas.add(group); canvas.setActiveObject(group); setTool('select');
}

// IMAGE UPLOAD
document.getElementById('imgFileInput').addEventListener('change', function() {
  Array.from(this.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      fabric.Image.fromURL(e.target.result, img => {
        const scale = Math.min(canvasW * 0.6 / img.width, canvasH * 0.6 / img.height, 1);
        img.set({ left: canvasW/2 - (img.width*scale)/2, top: canvasH/2 - (img.height*scale)/2, scaleX: scale, scaleY: scale });
        canvas.add(img); canvas.setActiveObject(img);
      });
    };
    reader.readAsDataURL(file);
  });
  this.value = '';
  setTool('select');
});

// DRAG & DROP
document.getElementById('canvasArea').addEventListener('dragover', e => e.preventDefault());
document.getElementById('canvasArea').addEventListener('drop', e => {
  e.preventDefault();
  Array.from(e.dataTransfer.files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => {
      fabric.Image.fromURL(ev.target.result, img => {
        const scale = Math.min(canvasW*0.5/img.width, canvasH*0.5/img.height, 1);
        img.set({ left: canvasW/2-(img.width*scale)/2, top: canvasH/2-(img.height*scale)/2, scaleX: scale, scaleY: scale });
        canvas.add(img); canvas.setActiveObject(img);
      });
    };
    reader.readAsDataURL(file);
  });
});

// DOC SIZE
function setDocSize(btn) {
  document.querySelectorAll('.doc-size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('canvasW').value = btn.dataset.w;
  document.getElementById('canvasH').value = btn.dataset.h;
  applyCustomSize();
}
function applyCustomSize() {
  canvasW = parseInt(document.getElementById('canvasW').value) || 595;
  canvasH = parseInt(document.getElementById('canvasH').value) || 842;
  canvas.setWidth(canvasW); canvas.setHeight(canvasH);
  canvas.renderAll(); zoomFit();
}

// BACKGROUND
function applyBgColor() { canvas.setBackgroundColor(document.getElementById('bgColor').value, canvas.renderAll.bind(canvas)); }
function setBgTransparent() { canvas.setBackgroundColor('', canvas.renderAll.bind(canvas)); }

// PROPS PANEL
function updatePropsPanel() {
  const obj = canvas.getActiveObject();
  if (!obj) return;
  document.getElementById('propX').value = Math.round(obj.left);
  document.getElementById('propY').value = Math.round(obj.top);
  document.getElementById('propW').value = Math.round(obj.getScaledWidth());
  document.getElementById('propH').value = Math.round(obj.getScaledHeight());
  document.getElementById('propAngle').value = Math.round(obj.angle);
  document.getElementById('propOpacity').value = Math.round(obj.opacity * 100);

  const isText = ['i-text','text','textbox'].includes(obj.type);
  document.getElementById('propText').style.display = isText ? 'block' : 'none';
  if (isText) {
    document.getElementById('propFontSize').value = obj.fontSize;
    document.getElementById('propFontColor').value = rgbToHex(obj.fill) || '#1e1e2e';
    document.getElementById('propFont').value = obj.fontFamily || 'Noto Sans KR';
    document.getElementById('btnBold').classList.toggle('active', obj.fontWeight === 'bold');
    document.getElementById('btnItalic').classList.toggle('active', obj.fontStyle === 'italic');
    document.getElementById('btnUnderline').classList.toggle('active', !!obj.underline);
    document.getElementById('btnStrike').classList.toggle('active', !!obj.linethrough);
    const lh = obj.lineHeight || 1.2;
    document.getElementById('propLineHeight').value = lh;
    document.getElementById('lineHeightVal').textContent = lh.toFixed(2);
    const cs = obj.charSpacing || 0;
    document.getElementById('propCharSpacing').value = cs;
    document.getElementById('charSpacingVal').textContent = cs;
    ['left','center','right'].forEach(a => document.getElementById('btnAlign'+a[0].toUpperCase()).classList.toggle('active', obj.textAlign === a));
  }
  if (obj.fill && typeof obj.fill === 'string') {
    const hex = rgbToHex(obj.fill);
    if (hex) document.getElementById('propFill').value = hex;
  }
  if (obj.stroke && typeof obj.stroke === 'string') {
    const hex = rgbToHex(obj.stroke);
    if (hex) document.getElementById('propStroke').value = hex;
  }
  document.getElementById('propStrokeW').value = obj.strokeWidth || 0;
  if (obj.rx !== undefined) document.getElementById('propRadius').value = obj.rx;
  if (obj.shadow) {
    const sh = obj.shadow;
    const hex = rgbToHex(sh.color);
    if (hex) document.getElementById('shadowColor').value = hex;
    document.getElementById('shadowBlur').value = sh.blur;
    document.getElementById('shadowX').value = sh.offsetX;
    document.getElementById('shadowY').value = sh.offsetY;
  }
}

function rgbToHex(color) {
  if (!color || color === 'transparent') return null;
  if (color.startsWith('#')) return color;
  const m = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return null;
  return '#' + [m[1],m[2],m[3]].map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
}

// APPLY PROPS
function applyPropXY() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ left: +document.getElementById('propX').value, top: +document.getElementById('propY').value });
  o.setCoords(); canvas.renderAll();
}
function applyPropWH() {
  const o = canvas.getActiveObject(); if (!o) return;
  const w = +document.getElementById('propW').value, h = +document.getElementById('propH').value;
  o.set({ scaleX: w/o.width, scaleY: h/o.height }); o.setCoords(); canvas.renderAll();
}
function applyPropAngle() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ angle: +document.getElementById('propAngle').value }); o.setCoords(); canvas.renderAll();
}
function applyPropOpacity() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ opacity: +document.getElementById('propOpacity').value/100 }); canvas.renderAll();
}
function applyFont() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ fontFamily: document.getElementById('propFont').value }); canvas.renderAll();
}
function applyFontSize() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ fontSize: +document.getElementById('propFontSize').value }); canvas.renderAll();
}
function applyFontColor() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ fill: document.getElementById('propFontColor').value }); canvas.renderAll();
}
function toggleBold() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ fontWeight: o.fontWeight === 'bold' ? 'normal' : 'bold' });
  canvas.renderAll();
  document.getElementById('btnBold').classList.toggle('active', o.fontWeight === 'bold');
}
function toggleItalic() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ fontStyle: o.fontStyle === 'italic' ? 'normal' : 'italic' });
  canvas.renderAll();
  document.getElementById('btnItalic').classList.toggle('active', o.fontStyle === 'italic');
}
function toggleUnderline() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ underline: !o.underline }); canvas.renderAll();
  document.getElementById('btnUnderline').classList.toggle('active', o.underline);
}
function toggleStrike() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ linethrough: !o.linethrough }); canvas.renderAll();
  document.getElementById('btnStrike').classList.toggle('active', o.linethrough);
}
function setAlign(align) {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ textAlign: align }); canvas.renderAll();
  ['left','center','right'].forEach(a => document.getElementById('btnAlign'+a[0].toUpperCase()).classList.toggle('active', align === a));
}
function applyLineHeight() {
  const v = +document.getElementById('propLineHeight').value;
  document.getElementById('lineHeightVal').textContent = v.toFixed(2);
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ lineHeight: v }); canvas.renderAll();
}
function applyCharSpacing() {
  const v = +document.getElementById('propCharSpacing').value;
  document.getElementById('charSpacingVal').textContent = v;
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ charSpacing: v }); canvas.renderAll();
}
function applyFill() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ fill: document.getElementById('propFill').value }); canvas.renderAll();
}
function setNoFill() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ fill: 'transparent' }); canvas.renderAll();
}
function applyStroke() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ stroke: document.getElementById('propStroke').value }); canvas.renderAll();
}
function applyStrokeWidth() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ strokeWidth: +document.getElementById('propStrokeW').value }); canvas.renderAll();
}
function applyRadius() {
  const o = canvas.getActiveObject(); if (!o || o.type !== 'rect') return;
  const r = +document.getElementById('propRadius').value;
  o.set({ rx: r, ry: r }); canvas.renderAll();
}
function flipH() { const o = canvas.getActiveObject(); if (!o) return; o.set({ flipX: !o.flipX }); canvas.renderAll(); }
function flipV() { const o = canvas.getActiveObject(); if (!o) return; o.set({ flipY: !o.flipY }); canvas.renderAll(); }

function applyShadow() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set('shadow', new fabric.Shadow({
    color: document.getElementById('shadowColor').value,
    blur: +document.getElementById('shadowBlur').value,
    offsetX: +document.getElementById('shadowX').value,
    offsetY: +document.getElementById('shadowY').value,
  })); canvas.renderAll();
}
function removeShadow() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set('shadow', null); canvas.renderAll();
}

// LAYERS
function updateLayerList() {
  const list = document.getElementById('layerList');
  const objs = canvas.getObjects().slice().reverse();
  const selected = canvas.getActiveObject();
  list.innerHTML = '';
  objs.forEach((obj, i) => {
    const realIdx = canvas.getObjects().length - 1 - i;
    const item = document.createElement('div');
    item.className = 'layer-item' + (obj === selected ? ' selected' : '');
    const icon = ['i-text','text','textbox'].includes(obj.type) ? '✏️'
      : obj.type === 'image' ? '🖼️' : obj.type === 'rect' ? '▭'
      : (obj.type === 'circle' || obj.type === 'ellipse') ? '◯'
      : obj.type === 'triangle' ? '△' : obj.type === 'line' ? '━'
      : obj.type === 'group' ? '📁' : '◆';
    const name = ['i-text','text'].includes(obj.type) ? (obj.text||'').substring(0,12) : obj.type;
    item.innerHTML = `
      <span class="layer-thumb">${icon}</span>
      <span class="layer-name">${name}</span>
      <button class="layer-vis" onclick="toggleVisible(event,${realIdx})">${obj.visible!==false?'👁':'🚫'}</button>
    `;
    item.addEventListener('click', () => {
      canvas.setActiveObject(canvas.getObjects()[realIdx]);
      canvas.renderAll(); updateLayerList(); updatePropsPanel();
    });
    list.appendChild(item);
  });
}
function toggleVisible(e, idx) {
  e.stopPropagation();
  const obj = canvas.getObjects()[idx]; if (!obj) return;
  obj.set({ visible: !obj.visible }); canvas.renderAll(); updateLayerList();
}
function layerUp() {
  const o = canvas.getActiveObject(); if (!o) return;
  canvas.bringForward(o); canvas.renderAll(); updateLayerList();
}
function layerDown() {
  const o = canvas.getActiveObject(); if (!o) return;
  canvas.sendBackwards(o); canvas.renderAll(); updateLayerList();
}

// DELETE
function deleteSelected() {
  canvas.getActiveObjects().forEach(o => canvas.remove(o));
  canvas.discardActiveObject(); canvas.renderAll();
}

// CONTEXT MENU
const ctxMenu = document.getElementById('ctxMenu');
canvas.on('mouse:down', function(opt) {
  if (opt.e.button === 2) {
    opt.e.preventDefault();
    ctxMenu.style.display = 'block';
    ctxMenu.style.left = opt.e.clientX + 'px';
    ctxMenu.style.top = opt.e.clientY + 'px';
  } else {
    ctxMenu.style.display = 'none';
  }
});
canvas.wrapperEl.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('click', () => ctxMenu.style.display = 'none');

function ctxBringFront() { const o = canvas.getActiveObject(); if (o) { canvas.bringToFront(o); canvas.renderAll(); updateLayerList(); } }
function ctxSendBack() { const o = canvas.getActiveObject(); if (o) { canvas.sendToBack(o); canvas.renderAll(); updateLayerList(); } }
function ctxDuplicate() {
  const o = canvas.getActiveObject(); if (!o) return;
  o.clone(clone => { clone.set({ left: o.left+20, top: o.top+20 }); canvas.add(clone); canvas.setActiveObject(clone); });
}
function ctxGroup() {
  if (!canvas.getActiveObject() || canvas.getActiveObject().type !== 'activeSelection') return;
  canvas.getActiveObject().toGroup(); canvas.renderAll(); updateLayerList();
}
function ctxUngroup() {
  const o = canvas.getActiveObject(); if (!o || o.type !== 'group') return;
  o.toActiveSelection(); canvas.renderAll(); updateLayerList();
}
function ctxLock() {
  const o = canvas.getActiveObject(); if (!o) return;
  const locked = !o.locked; o.locked = locked;
  o.set({ selectable: !locked, evented: !locked, lockMovementX: locked, lockMovementY: locked, lockRotation: locked, lockScalingX: locked, lockScalingY: locked });
  canvas.renderAll(); showToast(locked ? '잠금됨' : '잠금 해제됨');
}

// KEYBOARD
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.contentEditable === 'true') return;
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  if (!e.ctrlKey && !e.metaKey) {
    if (e.key === 'v' || e.key === 'V') setTool('select');
    if (e.key === 't' || e.key === 'T') setTool('text');
    if (e.key === 'r' || e.key === 'R') setTool('rect');
    if (e.key === 'c' || e.key === 'C') setTool('circle');
    if (e.key === 'd' || e.key === 'D') setTool('draw');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); ctxDuplicate(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'g') { e.preventDefault(); ctxGroup(); }
  const step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowLeft') nudge(-step, 0);
  if (e.key === 'ArrowRight') nudge(step, 0);
  if (e.key === 'ArrowUp') nudge(0, -step);
  if (e.key === 'ArrowDown') nudge(0, step);
});
function nudge(dx, dy) {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ left: o.left+dx, top: o.top+dy }); o.setCoords(); canvas.renderAll();
}

function setDocSizeVal(w, h) {
  canvasW = w; canvasH = h;
  document.getElementById('canvasW').value = w;
  document.getElementById('canvasH').value = h;
  canvas.setWidth(w); canvas.setHeight(h);
  document.querySelectorAll('.doc-size-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.w) === w && parseInt(b.dataset.h) === h);
  });
  zoomFit();
}
function addTplText(text, left, top, opts={}) {
  const t = new fabric.IText(text, { left, top, fontFamily:'Noto Sans KR', fontSize:20, fill:'#1e1e2e', ...opts });
  canvas.add(t); return t;
}
function addTplRect(left, top, width, height, opts={}) {
  const r = new fabric.Rect({ left, top, width, height, fill:'#7c6af5', ...opts });
  canvas.add(r); return r;
}

// EXPORT
function exportPNG() {
  const link = document.createElement('a');
  link.download = (document.getElementById('docName').value || '디자인보드') + '.png';
  link.href = canvas.toDataURL({ format:'png', multiplier:2 });
  link.click(); showToast('PNG 저장 완료');
}
function exportSVG() {
  const blob = new Blob([canvas.toSVG()], { type:'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.download = (document.getElementById('docName').value || '디자인보드') + '.svg';
  link.href = url; link.click();
  URL.revokeObjectURL(url); showToast('SVG 저장 완료');
}
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const pdfW = canvasW * 0.75, pdfH = canvasH * 0.75;
  const pdf = new jsPDF({ orientation: canvasW > canvasH ? 'landscape' : 'portrait', unit:'pt', format:[pdfW,pdfH] });
  pdf.addImage(canvas.toDataURL({ format:'jpeg', quality:0.95, multiplier:2 }), 'JPEG', 0, 0, pdfW, pdfH);
  pdf.save((document.getElementById('docName').value || '디자인보드') + '.pdf');
  showToast('PDF 저장 완료');
}

// TOAST
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
