<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PPT N-up 변환기 · Program Tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --primary: #12396d; --accent: #1d9bb2; --bg: #f4f6f8;
      --panel: #fff; --line: #e5e7eb; --muted: #6b7280; --nav-h: 52px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; background: var(--bg); color: #111827; padding-top: var(--nav-h); }

    /* NAV */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500; height: var(--nav-h);
      background: var(--primary); display: flex; align-items: center; padding: 0 16px; gap: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .nav-back {
      display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.85);
      font-size: 13px; font-weight: 700; text-decoration: none; padding: 7px 12px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); transition: background 0.15s;
    }
    .nav-back:hover { background: rgba(255,255,255,0.15); }
    .nav-title { flex: 1; text-align: center; font-size: 15px; font-weight: 800; color: #fff; }
    .nav-user { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .nav-user-name { font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 600; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-logout { display: flex; align-items: center; gap: 5px; color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.12); border: none; border-radius: 7px; padding: 6px 10px; cursor: pointer; font-family: inherit; }
    .nav-logout:hover { background: rgba(255,255,255,0.22); color: #fff; }

    /* LAYOUT */
    .app { display: grid; grid-template-columns: 320px minmax(0,1fr); min-height: calc(100vh - var(--nav-h)); }
    aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px; overflow-y: auto; max-height: calc(100vh - var(--nav-h)); }
    main { padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }

    h1 { font-size: 17px; font-weight: 900; margin-bottom: 4px; letter-spacing: -0.4px; }
    .sub { color: var(--muted); font-size: 12px; line-height: 1.5; margin-bottom: 14px; }
    .section { border-top: 1px solid #edf0f3; padding-top: 14px; margin-top: 14px; }
    .section-title { font-size: 11px; font-weight: 800; color: #374151; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }
    label { display: block; font-size: 11px; font-weight: 800; color: #374151; margin-bottom: 4px; }
    select, input[type="number"] {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none; background: #fff;
    }
    select:focus, input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
    .field { margin-bottom: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .smallnote { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 5px; }

    /* UPLOAD ZONE */
    .upload-zone {
      border: 2px dashed #93c5fd; border-radius: 12px; padding: 28px 16px;
      text-align: center; cursor: pointer; transition: all 0.2s; background: #f0f7ff;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); background: #dbeafe; }
    .upload-icon { font-size: 32px; margin-bottom: 8px; }
    .upload-text { font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .upload-sub { font-size: 12px; color: var(--muted); }
    #fileInput { display: none; }

    /* N-UP SELECTOR */
    .nup-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .nup-btn {
      border: 2px solid var(--line); border-radius: 9px; padding: 8px 4px;
      cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 800;
      color: #374151; background: #fff; transition: all 0.15s; text-align: center;
    }
    .nup-btn .nup-icon { font-size: 18px; display: block; margin-bottom: 3px; }
    .nup-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    .nup-btn:hover:not(.active) { border-color: #93c5fd; background: #f0f7ff; }

    /* ORIENTATION */
    .orient-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .orient-btn {
      border: 2px solid var(--line); border-radius: 9px; padding: 10px 8px;
      cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 800;
      color: #374151; background: #fff; transition: all 0.15s; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .orient-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

    /* BUTTONS */
    .btn {
      border: 0; border-radius: 9px; padding: 10px 14px; font-weight: 800;
      cursor: pointer; font-size: 13px; font-family: inherit; transition: opacity 0.15s; width: 100%;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-green { background: #0f766e; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #111827; }

    /* SLIDE THUMBS */
    .slides-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .slide-count { font-size: 12px; color: var(--muted); font-weight: 700; }
    .thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
    .thumb-wrap {
      position: relative; background: #fff; border: 2px solid var(--line); border-radius: 7px; overflow: hidden;
      cursor: pointer; transition: border-color 0.15s; aspect-ratio: auto;
    }
    .thumb-wrap:hover { border-color: #93c5fd; }
    .thumb-wrap.excluded { opacity: 0.4; border-color: #fca5a5; }
    .thumb-wrap canvas { width: 100%; display: block; }
    .thumb-num {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 9px; font-weight: 800; color: #fff;
      background: rgba(0,0,0,0.5); border-radius: 3px; padding: 1px 4px;
    }
    .thumb-ex {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(255,0,0,0.15); font-size: 18px;
    }
    .thumb-hint { font-size: 10px; color: var(--muted); text-align: center; margin-top: 5px; }

    /* PREVIEW AREA */
    .preview-shell { background: #e0e5ec; border-radius: 14px; padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .preview-info { background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; font-size: 11px; color: #374151; display: flex; justify-content: space-between; flex-shrink: 0; }
    .preview-scroll { flex: 1; overflow: auto; background: rgba(255,255,255,.3); border-radius: 10px; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; }
    .page-preview {
      background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border-radius: 3px;
      position: relative; flex-shrink: 0;
    }
    .page-preview canvas { display: block; width: 100%; }
    .page-label { text-align: center; font-size: 10px; color: var(--muted); margin-top: 4px; font-weight: 700; }

    /* STATUS */
    .status-bar {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 9px;
      padding: 10px 14px; font-size: 12px; font-weight: 700; color: #1e40af;
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .status-bar.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .status-bar.success { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(30,64,175,0.3); border-top-color: #1e40af; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #authLoading { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .big-spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { max-height: none; }
    }
  </style>
</head>
<body>

<div id="authLoading"><div class="big-spinner"></div></div>

<nav class="top-nav">
  <a class="nav-back" href="../dashboard.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    목록으로
  </a>
  <div class="nav-title">📄 PPT N-up 변환기</div>
  <div class="nav-user">
    <span class="nav-user-name" id="navUserName"></span>
    <button class="nav-logout" id="navLogout">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      로그아웃
    </button>
  </div>
</nav>

<div class="app">
  <aside>
    <h1>PPT N-up 변환기</h1>
    <div class="sub">PPTX 파일을 업로드하면 슬라이드 크기에 관계없이 자동으로 배치하여 PDF로 출력합니다.</div>

    <!-- 파일 업로드 -->
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📂</div>
      <div class="upload-text">PPTX 파일 클릭 또는 드래그</div>
      <div class="upload-sub">PowerPoint 파일(.pptx)만 지원</div>
      <input type="file" id="fileInput" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation">
    </div>

    <!-- 슬라이드 목록 -->
    <div id="thumbSection" style="display:none;" class="section">
      <div class="slides-header">
        <div class="section-title">슬라이드 목록</div>
        <span class="slide-count" id="slideCount"></span>
      </div>
      <div class="thumb-grid" id="thumbGrid"></div>
      <div class="thumb-hint">슬라이드 클릭 → 제외/포함 토글</div>
    </div>

    <!-- 배치 설정 -->
    <div class="section">
      <div class="section-title">배치 설정</div>

      <div class="field">
        <label>1페이지당 슬라이드 수</label>
        <div class="nup-grid">
          <button class="nup-btn" data-nup="1"><span class="nup-icon">▭</span>1장</button>
          <button class="nup-btn active" data-nup="2"><span class="nup-icon">⬛⬛</span>2장</button>
          <button class="nup-btn" data-nup="4"><span class="nup-icon">▪▪<br>▪▪</span>4장</button>
          <button class="nup-btn" data-nup="6"><span class="nup-icon">▪▪▪<br>▪▪▪</span>6장</button>
          <button class="nup-btn" data-nup="8"><span class="nup-icon">▪▪▪▪<br>▪▪▪▪</span>8장</button>
          <button class="nup-btn" data-nup="9"><span class="nup-icon">▪▪▪<br>▪▪▪<br>▪▪▪</span>9장</button>
        </div>
      </div>

      <div class="field">
        <label>슬라이드 순서</label>
        <div class="orient-row">
          <button class="orient-btn active" id="orderLR">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            가로 우선
          </button>
          <button class="orient-btn" id="orderTB">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            세로 우선
          </button>
        </div>
      </div>
    </div>

    <!-- 용지 설정 -->
    <div class="section">
      <div class="section-title">용지 설정</div>
      <div class="field">
        <label>용지 규격</label>
        <select id="paperSize">
          <option value="a4">A4 (210×297mm)</option>
          <option value="a3">A3 (297×420mm)</option>
          <option value="b4">B4 (250×354mm)</option>
          <option value="b5">B5 (176×250mm)</option>
          <option value="letter">Letter (216×279mm)</option>
        </select>
      </div>
      <div class="field">
        <label>용지 방향</label>
        <div class="orient-row">
          <button class="orient-btn active" id="orientPort">
            <svg width="10" height="14" viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="1" y="1" width="8" height="12"/></svg>
            세로
          </button>
          <button class="orient-btn" id="orientLand">
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="1" y="1" width="12" height="8"/></svg>
            가로
          </button>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>좌우 여백(mm)</label><input id="marginH" type="number" value="10" min="0" max="50" step="1"></div>
        <div class="field"><label>상하 여백(mm)</label><input id="marginV" type="number" value="10" min="0" max="50" step="1"></div>
        <div class="field"><label>슬라이드 간격(mm)</label><input id="gap" type="number" value="5" min="0" max="30" step="1"></div>
      </div>
    </div>

    <!-- 액션 버튼 -->
    <div class="section">
      <button class="btn btn-primary" id="previewBtn" disabled>미리보기 생성</button>
      <div style="height:7px;"></div>
      <button class="btn btn-green" id="downloadBtn" disabled>PDF 다운로드</button>
      <div style="height:7px;"></div>
      <button class="btn btn-secondary" id="resetBtn">초기화</button>
    </div>
  </aside>

  <main>
    <div id="statusBar" class="status-bar" style="display:none;"></div>
    <div class="preview-shell">
      <div class="preview-info">
        <span id="previewInfo">파일을 업로드하면 미리보기가 표시됩니다.</span>
        <span id="previewPages" style="color:#2563eb;font-weight:800;"></span>
      </div>
      <div class="preview-scroll" id="previewScroll">
        <div class="empty-state">
          <div class="icon">📑</div>
          <p>PPTX 파일을 업로드하고<br>설정을 선택한 후 <b>미리보기 생성</b>을 클릭하세요.</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script>
// ── Auth ────────────────────────────────────────────────────────────
auth.onAuthStateChanged(user => {
  if (!user) { location.href = '../login.html'; return; }
  document.getElementById('authLoading').style.display = 'none';
  document.getElementById('navUserName').textContent = user.displayName || user.email.split('@')[0];
});
document.getElementById('navLogout').addEventListener('click', () =>
  auth.signOut().then(() => location.href = '../login.html'));

const $ = id => document.getElementById(id);

// ── State ────────────────────────────────────────────────────────────
let parsedSlides = [];     // {canvas, widthEMU, heightEMU, index}
let excludedSlides = new Set();
let nup = 2;
let orderLR = true;        // true=가로우선, false=세로우선
let landscape = false;
let renderedCanvases = []; // final page canvases for PDF

// ── Paper sizes (mm) ────────────────────────────────────────────────
const PAPER = {
  a4:     [210, 297],
  a3:     [297, 420],
  b4:     [250, 354],
  b5:     [176, 250],
  letter: [216, 279],
};
const NUP_COLS = { 1:[1,1], 2:[2,1], 4:[2,2], 6:[3,2], 8:[4,2], 9:[3,3] };

// ── Status helper ────────────────────────────────────────────────────
function showStatus(msg, type = 'info') {
  const el = $('statusBar');
  el.style.display = 'flex';
  el.className = 'status-bar' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  el.innerHTML = type === 'info'
    ? `<div class="spinner"></div><span>${msg}</span>`
    : `<span>${type === 'error' ? '❌' : '✅'} ${msg}</span>`;
}
function hideStatus() { $('statusBar').style.display = 'none'; }

// ── Upload / parse ───────────────────────────────────────────────────
$('uploadZone').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));

$('uploadZone').addEventListener('dragover', e => { e.preventDefault(); $('uploadZone').classList.add('drag-over'); });
$('uploadZone').addEventListener('dragleave', () => $('uploadZone').classList.remove('drag-over'));
$('uploadZone').addEventListener('drop', e => {
  e.preventDefault(); $('uploadZone').classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});

async function handleFile(file) {
  if (!file || !file.name.endsWith('.pptx')) {
    showStatus('.pptx 파일만 업로드할 수 있습니다.', 'error'); return;
  }
  showStatus(`"${file.name}" 파싱 중...`);
  $('previewBtn').disabled = true;
  $('downloadBtn').disabled = true;
  parsedSlides = [];
  excludedSlides.clear();
  $('thumbGrid').innerHTML = '';
  $('thumbSection').style.display = 'none';
  $('previewScroll').innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>슬라이드 렌더링 중...</p></div>';

  try {
    const buf = await file.arrayBuffer();
    const pptx = await parsePptx(buf);
    parsedSlides = pptx;
    renderThumbs();
    showStatus(`${parsedSlides.length}개 슬라이드 로드 완료. 설정 후 미리보기 생성을 클릭하세요.`, 'success');
    $('previewBtn').disabled = false;
    $('thumbSection').style.display = 'block';
    $('slideCount').textContent = `총 ${parsedSlides.length}장`;
    setTimeout(hideStatus, 3000);
  } catch(e) {
    console.error(e);
    showStatus('파일 파싱 실패: ' + e.message, 'error');
  }
}

// ── PPTX Parser ──────────────────────────────────────────────────────
async function parsePptx(arrayBuffer) {
  const zip = await JSZip.loadAsync(arrayBuffer);

  // Get slide dimensions from presentation.xml
  const presXml = await zip.file('ppt/presentation.xml').async('text');
  const presDoc = parsXml(presXml);
  const sldSz = presDoc.querySelector('sldSz');
  const slideWidthEMU  = parseInt(sldSz?.getAttribute('cx') || '9144000');
  const slideHeightEMU = parseInt(sldSz?.getAttribute('cy') || '6858000');

  // Get ordered slide list from relationships
  const presRelsXml = await zip.file('ppt/_rels/presentation.xml.rels').async('text');
  const presRelsDoc = parsXml(presRelsXml);
  const slideRels = Array.from(presRelsDoc.querySelectorAll('Relationship'))
    .filter(r => {
      const t = r.getAttribute('Type') || '';
      return t.includes('/slide') && !t.includes('Layout') && !t.includes('Master') && !t.includes('notesMaster');
    })
    .sort((a, b) => {
      const numA = parseInt((a.getAttribute('Target') || '').match(/slide(\d+)/)?.[1] || '0');
      const numB = parseInt((b.getAttribute('Target') || '').match(/slide(\d+)/)?.[1] || '0');
      return numA - numB;
    });

  const slides = [];
  for (let i = 0; i < slideRels.length; i++) {
    const target = slideRels[i].getAttribute('Target') || '';
    const slidePath = target.startsWith('/') ? target.slice(1) : 'ppt/' + target.replace(/^\.\.\//, '');

    const slideXml = await zip.file(slidePath)?.async('text');
    if (!slideXml) continue;

    // Load slide relationships (images)
    const slideDir = slidePath.substring(0, slidePath.lastIndexOf('/'));
    const slideName = slidePath.substring(slidePath.lastIndexOf('/') + 1);
    const relsPath = `${slideDir}/_rels/${slideName}.rels`;
    const relsXml = await zip.file(relsPath)?.async('text');
    const imageMap = {};

    if (relsXml) {
      const relsDoc = parsXml(relsXml);
      for (const rel of relsDoc.querySelectorAll('Relationship')) {
        const rTarget = rel.getAttribute('Target') || '';
        const rId = rel.getAttribute('Id') || '';
        if (rTarget.match(/\.(png|jpg|jpeg|gif|bmp|tiff?|wmf|emf|svg)/i)) {
          const imgPath = rTarget.startsWith('/') ? rTarget.slice(1)
            : (slideDir + '/' + rTarget).replace(/\/[^/]+\/\.\.\//g, '/');
          try {
            const b64 = await zip.file(imgPath)?.async('base64');
            if (b64) {
              const ext = imgPath.split('.').pop()?.toLowerCase();
              const mime = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' : ext === 'png' ? 'image/png' : ext === 'gif' ? 'image/gif' : 'image/png';
              imageMap[rId] = `data:${mime};base64,${b64}`;
            }
          } catch(e) {}
        }
      }
    }

    // Also get slide layout/master background if available
    const slideObj = { xml: slideXml, imageMap, widthEMU: slideWidthEMU, heightEMU: slideHeightEMU, index: i };
    const canvas = await renderSlide(slideObj);
    slides.push({ canvas, widthEMU: slideWidthEMU, heightEMU: slideHeightEMU, index: i });
  }
  return slides;
}

function parsXml(xmlStr) {
  // Strip namespace prefixes for easier querySelector usage
  const clean = xmlStr
    .replace(/\s+xmlns(?::[a-zA-Z0-9]+)?="[^"]*"/g, '')
    .replace(/<(\/?)([a-zA-Z0-9]+:)/g, '<$1')
    .replace(/\s([a-zA-Z0-9]+):([a-zA-Z])/g, ' $2');  // attr namespaces
  return new DOMParser().parseFromString(clean, 'text/xml');
}

// ── Slide Renderer ───────────────────────────────────────────────────
const RENDER_W = 1280;  // px, high resolution for quality

async function renderSlide(slide) {
  const canvas = document.createElement('canvas');
  const ratio = slide.heightEMU / slide.widthEMU;
  canvas.width  = RENDER_W;
  canvas.height = Math.round(RENDER_W * ratio);
  const ctx = canvas.getContext('2d');
  const sx = canvas.width  / slide.widthEMU;
  const sy = canvas.height / slide.heightEMU;

  // White base
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const doc = parsXml(slide.xml);

  // --- Background ---
  const bgPr = doc.querySelector('bg bgPr');
  if (bgPr) {
    await applyFill(ctx, bgPr, sx, sy, 0, 0, canvas.width, canvas.height, slide.imageMap);
  }

  // --- Shapes ---
  const spTree = doc.querySelector('spTree');
  if (spTree) {
    for (const el of Array.from(spTree.children)) {
      await renderElement(ctx, el, sx, sy, slide.imageMap);
    }
  }

  return canvas;
}

async function renderElement(ctx, el, sx, sy, imageMap) {
  const tag = el.tagName;
  if (tag === 'sp')    await renderSp(ctx, el, sx, sy, imageMap);
  else if (tag === 'pic')   await renderPic(ctx, el, sx, sy, imageMap);
  else if (tag === 'grpSp') await renderGrpSp(ctx, el, sx, sy, imageMap);
  else if (tag === 'graphicFrame') await renderGraphicFrame(ctx, el, sx, sy);
}

function getXfrm(el) {
  const xfrm = el.querySelector('xfrm, off')?.closest('xfrm') || el.querySelector('xfrm');
  if (!xfrm) return null;
  const off = xfrm.querySelector('off');
  const ext = xfrm.querySelector('ext');
  if (!off || !ext) return null;
  return {
    x: parseInt(off.getAttribute('x') || '0'),
    y: parseInt(off.getAttribute('y') || '0'),
    cx: parseInt(ext.getAttribute('cx') || '0'),
    cy: parseInt(ext.getAttribute('cy') || '0'),
    rot: parseInt(xfrm.getAttribute('rot') || '0'),
    flipH: xfrm.getAttribute('flipH') === '1',
    flipV: xfrm.getAttribute('flipV') === '1',
  };
}

async function applyFill(ctx, el, sx, sy, x, y, w, h, imageMap) {
  const solidFill = el.querySelector('solidFill');
  if (solidFill) {
    const srgb = solidFill.querySelector('srgbClr');
    const prst = solidFill.querySelector('prstClr');
    let color = '#FFFFFF';
    if (srgb) color = '#' + (srgb.getAttribute('val') || 'FFFFFF');
    else if (prst) color = prstToHex(prst.getAttribute('val') || 'white');
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    return true;
  }

  const gradFill = el.querySelector('gradFill');
  if (gradFill) {
    const stops = Array.from(gradFill.querySelectorAll('gs'));
    if (stops.length >= 2) {
      const grad = ctx.createLinearGradient(x, y, x + w, y + h);
      stops.forEach(s => {
        const pos = parseInt(s.getAttribute('pos') || '0') / 100000;
        const srgb = s.querySelector('srgbClr');
        if (srgb) grad.addColorStop(pos, '#' + (srgb.getAttribute('val') || '888888'));
      });
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);
    }
    return true;
  }

  const blipFill = el.querySelector('blipFill');
  if (blipFill) {
    const blip = blipFill.querySelector('blip');
    const rId = blip?.getAttribute('embed') || blip?.getAttribute('link');
    if (rId && imageMap?.[rId]) {
      await drawImageFit(ctx, imageMap[rId], x, y, w, h, 'cover');
    }
    return true;
  }

  return false;
}

async function renderSp(ctx, el, sx, sy, imageMap) {
  const xfrm = getXfrm(el.querySelector('spPr'));
  if (!xfrm) return;

  const x = xfrm.x * sx, y = xfrm.y * sy;
  const w = xfrm.cx * sx, h = xfrm.cy * sy;
  if (w <= 0 || h <= 0) return;

  ctx.save();
  if (xfrm.rot) {
    ctx.translate(x + w/2, y + h/2);
    ctx.rotate(xfrm.rot * Math.PI / 10800000);
    ctx.translate(-w/2, -h/2);
  } else {
    ctx.translate(x, y);
  }

  // Fill
  const spPr = el.querySelector('spPr');
  if (spPr) {
    const noFill = spPr.querySelector('noFill');
    if (!noFill) {
      const filled = await applyFill(ctx, spPr, sx, sy, 0, 0, w, h, imageMap);
      if (!filled) {
        // Default: check if it's a text box (transparent) or shape
        const prstGeom = spPr.querySelector('prstGeom');
        if (prstGeom && prstGeom.getAttribute('prst') !== 'rect') {
          // Shape placeholder — light grey
        }
      }
    }
  }

  // Text
  const txBody = el.querySelector('txBody');
  if (txBody) renderText(ctx, txBody, w, h, xfrm);

  ctx.restore();
}

async function renderPic(ctx, el, sx, sy, imageMap) {
  const xfrm = getXfrm(el.querySelector('spPr'));
  if (!xfrm) return;
  const x = xfrm.x * sx, y = xfrm.y * sy;
  const w = xfrm.cx * sx, h = xfrm.cy * sy;
  if (w <= 0 || h <= 0) return;

  const blip = el.querySelector('blip');
  const rId = blip?.getAttribute('embed') || blip?.getAttribute('link');
  if (!rId || !imageMap?.[rId]) return;

  ctx.save();
  if (xfrm.rot) {
    ctx.translate(x + w/2, y + h/2);
    ctx.rotate(xfrm.rot * Math.PI / 10800000);
    ctx.translate(-w/2, -h/2);
    await drawImageFit(ctx, imageMap[rId], -w/2, -h/2, w, h, 'contain');
  } else {
    await drawImageFit(ctx, imageMap[rId], x, y, w, h, 'contain');
  }
  ctx.restore();
}

async function renderGrpSp(ctx, el, sx, sy, imageMap) {
  for (const child of Array.from(el.children)) {
    await renderElement(ctx, child, sx, sy, imageMap);
  }
}

async function renderGraphicFrame(ctx, el, sx, sy) {
  // Tables, charts — draw a placeholder box
  const xfrm = getXfrm(el.querySelector('xfrm'));
  if (!xfrm) return;
  const x = xfrm.x * sx, y = xfrm.y * sy;
  const w = xfrm.cx * sx, h = xfrm.cy * sy;
  ctx.save();
  ctx.strokeStyle = '#d1d5db';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#f9fafb';
  ctx.fillRect(x, y, w, h);
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#9ca3af';
  ctx.font = `${Math.min(14, h*0.3)}px Pretendard, Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('차트/표', x + w/2, y + h/2);
  ctx.restore();
}

function renderText(ctx, txBody, boxW, boxH, xfrm) {
  const paras = Array.from(txBody.querySelectorAll('p'));
  if (!paras.length) return;

  // Body properties
  const bodyPr = txBody.querySelector('bodyPr');
  const anchor = bodyPr?.getAttribute('anchor') || 't'; // t=top, ctr=center, b=bottom
  const insetL = parseInt(bodyPr?.getAttribute('lIns') || '91440') / 914400 * 96;
  const insetR = parseInt(bodyPr?.getAttribute('rIns') || '91440') / 914400 * 96;
  const insetT = parseInt(bodyPr?.getAttribute('tIns') || '45720') / 914400 * 96;

  const textX = Math.max(0, insetL);
  const textW = Math.max(0, boxW - insetL - insetR);

  // Collect all runs for each paragraph
  const lineGroups = paras.map(p => {
    const align = p.querySelector('pPr')?.getAttribute('algn') || 'l';
    const runs = Array.from(p.querySelectorAll('r')).map(r => {
      const rPr = r.querySelector('rPr');
      const t = r.querySelector('t');
      const sz = parseInt(rPr?.getAttribute('sz') || '1800') / 100;  // hundredths of pt
      const bold = rPr?.getAttribute('b') === '1';
      const italic = rPr?.getAttribute('i') === '1';
      const srgb = rPr?.querySelector('solidFill srgbClr, solidFill > srgbClr');
      const color = srgb ? '#' + (srgb.getAttribute('val') || '000000') : '#000000';
      return { text: t?.textContent || '', sz, bold, italic, color };
    });
    // Handle fld elements (slide number, date)
    Array.from(p.querySelectorAll('fld')).forEach(fld => {
      const rPr = fld.querySelector('rPr');
      runs.push({ text: fld.querySelector('t')?.textContent || '', sz: 12, bold: false, italic: false, color: '#666666' });
    });
    return { runs, align };
  });

  // Scale font size based on box width
  const fontScale = Math.min(1, textW / 200);

  // Calculate total text height
  let totalH = 0;
  const lineHeights = lineGroups.map(pg => {
    const maxSz = Math.max(...pg.runs.map(r => r.sz * fontScale), 12);
    const lh = maxSz * 1.3;
    totalH += lh;
    return lh;
  });

  let startY;
  if (anchor === 'ctr') startY = insetT + (boxH - insetT - totalH) / 2;
  else if (anchor === 'b')  startY = boxH - totalH - 5;
  else startY = insetT;

  let curY = startY;
  lineGroups.forEach((pg, pi) => {
    const lh = lineHeights[pi];
    const baseline = curY + lh * 0.85;
    curY += lh;

    if (baseline < 0 || baseline > boxH) return;

    // Calculate total width of paragraph for alignment
    let curX = textX;

    if (pg.align === 'r') {
      // Right align: measure total, set start
      let totalW = 0;
      pg.runs.forEach(r => {
        const sz = Math.max(6, r.sz * fontScale);
        ctx.font = `${r.italic ? 'italic ' : ''}${r.bold ? '900' : '400'} ${sz}px Pretendard, Arial, sans-serif`;
        totalW += ctx.measureText(r.text).width;
      });
      curX = textX + textW - totalW;
    } else if (pg.align === 'ctr') {
      let totalW = 0;
      pg.runs.forEach(r => {
        const sz = Math.max(6, r.sz * fontScale);
        ctx.font = `${r.italic ? 'italic ' : ''}${r.bold ? '900' : '400'} ${sz}px Pretendard, Arial, sans-serif`;
        totalW += ctx.measureText(r.text).width;
      });
      curX = textX + (textW - totalW) / 2;
    }

    pg.runs.forEach(r => {
      if (!r.text) return;
      const sz = Math.max(6, r.sz * fontScale);
      ctx.font = `${r.italic ? 'italic ' : ''}${r.bold ? '900' : '400'} ${sz}px Pretendard, Arial, sans-serif`;
      ctx.fillStyle = r.color;
      ctx.textBaseline = 'alphabetic';
      // Clip to box
      const drawX = Math.max(textX, curX);
      if (drawX < textX + textW) ctx.fillText(r.text, drawX, baseline);
      curX += ctx.measureText(r.text).width;
    });
  });
}

// ── Image helpers ────────────────────────────────────────────────────
const imgCache = {};
function loadImg(src) {
  if (imgCache[src]) return Promise.resolve(imgCache[src]);
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { imgCache[src] = img; res(img); };
    img.onerror = rej;
    img.src = src;
  });
}

async function drawImageFit(ctx, src, x, y, w, h, mode = 'contain') {
  try {
    const img = await loadImg(src);
    const imgRatio = img.width / img.height;
    const boxRatio = w / h;
    let dw, dh, dx, dy;
    if (mode === 'cover') {
      if (imgRatio > boxRatio) { dh = h; dw = h * imgRatio; dx = x - (dw-w)/2; dy = y; }
      else { dw = w; dh = w / imgRatio; dx = x; dy = y - (dh-h)/2; }
    } else {
      if (imgRatio > boxRatio) { dw = w; dh = w / imgRatio; dx = x; dy = y + (h-dh)/2; }
      else { dh = h; dw = h * imgRatio; dx = x + (w-dw)/2; dy = y; }
    }
    const prevClip = ctx.save();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  } catch(e) {}
}

// ── Preset color map (partial) ───────────────────────────────────────
const PRST_COLORS = { white:'#FFFFFF', black:'#000000', red:'#FF0000', green:'#00FF00', blue:'#0000FF', yellow:'#FFFF00', gray:'#808080', grey:'#808080', darkBlue:'#00008B', darkGreen:'#006400', darkRed:'#8B0000', orange:'#FFA500' };
function prstToHex(name) { return PRST_COLORS[name] || '#FFFFFF'; }

// ── Thumbnails ───────────────────────────────────────────────────────
function renderThumbs() {
  const grid = $('thumbGrid');
  grid.innerHTML = '';
  parsedSlides.forEach((slide, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    wrap.dataset.idx = i;
    const c = slide.canvas.cloneNode(false);
    c.width  = slide.canvas.width;
    c.height = slide.canvas.height;
    c.getContext('2d').drawImage(slide.canvas, 0, 0);
    wrap.appendChild(c);
    const num = document.createElement('div');
    num.className = 'thumb-num';
    num.textContent = i + 1;
    wrap.appendChild(num);
    wrap.addEventListener('click', () => toggleExclude(i, wrap));
    grid.appendChild(wrap);
  });
}

function toggleExclude(idx, wrap) {
  if (excludedSlides.has(idx)) {
    excludedSlides.delete(idx);
    wrap.classList.remove('excluded');
    wrap.querySelector('.thumb-ex')?.remove();
  } else {
    excludedSlides.add(idx);
    wrap.classList.add('excluded');
    const ex = document.createElement('div');
    ex.className = 'thumb-ex';
    ex.textContent = '✕';
    wrap.appendChild(ex);
  }
}

// ── N-up layout ──────────────────────────────────────────────────────
function getSettings() {
  const [pw, ph] = PAPER[$('paperSize').value || 'a4'];
  const mh = parseFloat($('marginH').value) || 10;
  const mv = parseFloat($('marginV').value) || 10;
  const gp = parseFloat($('gap').value) || 5;
  const [cols, rows] = NUP_COLS[nup] || [2,1];
  const W = landscape ? ph : pw;
  const H = landscape ? pw : ph;
  return { pw: W, ph: H, mh, mv, gp, cols, rows };
}

async function buildPages() {
  const { pw, ph, mh, mv, gp, cols, rows } = getSettings();
  const perPage = cols * rows;
  const MM2PX = 3.7795;  // mm to px at 96dpi

  // Cell dimensions in mm
  const cellW = (pw - mh*2 - gp*(cols-1)) / cols;
  const cellH = (ph - mv*2 - gp*(rows-1)) / rows;

  const activeSlides = parsedSlides.filter((_, i) => !excludedSlides.has(i));
  const pages = [];

  for (let p = 0; p < Math.ceil(activeSlides.length / perPage); p++) {
    const pageCanvas = document.createElement('canvas');
    pageCanvas.width  = Math.round(pw * MM2PX);
    pageCanvas.height = Math.round(ph * MM2PX);
    const ctx = pageCanvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);

    for (let s = 0; s < perPage; s++) {
      const slideIdx = p * perPage + s;
      if (slideIdx >= activeSlides.length) break;
      const slide = activeSlides[slideIdx];

      let col, row;
      if (orderLR) { col = s % cols; row = Math.floor(s / cols); }
      else          { col = Math.floor(s / rows); row = s % rows; }

      const cellX = (mh + col * (cellW + gp)) * MM2PX;
      const cellY = (mv + row * (cellH + gp)) * MM2PX;
      const cellPxW = cellW * MM2PX;
      const cellPxH = cellH * MM2PX;

      // Scale slide to fit cell (maintain aspect ratio)
      const slideRatio = slide.canvas.width / slide.canvas.height;
      const cellRatio  = cellPxW / cellPxH;
      let dw, dh, dx, dy;
      if (slideRatio > cellRatio) {
        dw = cellPxW; dh = cellPxW / slideRatio;
        dx = cellX; dy = cellY + (cellPxH - dh) / 2;
      } else {
        dh = cellPxH; dw = cellPxH * slideRatio;
        dx = cellX + (cellPxW - dw) / 2; dy = cellY;
      }
      ctx.drawImage(slide.canvas, dx, dy, dw, dh);

      // Optional: thin border around each slide
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(dx, dy, dw, dh);
    }
    pages.push(pageCanvas);
  }
  return pages;
}

// ── Preview ───────────────────────────────────────────────────────────
$('previewBtn').addEventListener('click', async () => {
  if (!parsedSlides.length) return;
  showStatus('페이지 배치 중...');
  $('previewBtn').disabled = true;
  $('downloadBtn').disabled = true;
  await new Promise(r => setTimeout(r, 10));

  try {
    renderedCanvases = await buildPages();
    displayPreview(renderedCanvases);
    const active = parsedSlides.length - excludedSlides.size;
    $('previewInfo').textContent = `슬라이드 ${active}장 · ${nup}장/페이지 · ${$('paperSize').value.toUpperCase()} ${landscape ? '가로' : '세로'}`;
    $('previewPages').textContent = `총 ${renderedCanvases.length}페이지`;
    showStatus(`미리보기 완료 (${renderedCanvases.length}페이지)`, 'success');
    $('downloadBtn').disabled = false;
    setTimeout(hideStatus, 2000);
  } catch(e) {
    showStatus('배치 오류: ' + e.message, 'error');
  }
  $('previewBtn').disabled = false;
});

function displayPreview(pages) {
  const scroll = $('previewScroll');
  scroll.innerHTML = '';
  const previewH = Math.min(300, scroll.clientHeight - 30);
  pages.forEach((canvas, i) => {
    const wrap = document.createElement('div');
    const ratio = canvas.height / canvas.width;
    const previewW = previewH / ratio;
    wrap.className = 'page-preview';
    wrap.style.width = previewW + 'px';
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    c.getContext('2d').drawImage(canvas, 0, 0);
    wrap.appendChild(c);
    const lbl = document.createElement('div');
    lbl.className = 'page-label';
    lbl.textContent = `${i+1} / ${pages.length}`;
    wrap.appendChild(lbl);
    scroll.appendChild(wrap);
  });
}

// ── PDF Download ──────────────────────────────────────────────────────
$('downloadBtn').addEventListener('click', async () => {
  if (!renderedCanvases.length) return;
  showStatus('PDF 생성 중...');
  $('downloadBtn').disabled = true;
  await new Promise(r => setTimeout(r, 10));

  try {
    const { pw, ph } = getSettings();
    const orient = landscape ? 'landscape' : 'portrait';
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: orient, unit: 'mm', format: [Math.min(pw,ph), Math.max(pw,ph)] });

    renderedCanvases.forEach((canvas, i) => {
      if (i > 0) doc.addPage([Math.min(pw,ph), Math.max(pw,ph)], orient);
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      doc.addImage(imgData, 'JPEG', 0, 0, pw, ph);
    });

    const ts = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    doc.save(`slides_${nup}up_${ts}.pdf`);
    showStatus('PDF 저장 완료!', 'success');
    setTimeout(hideStatus, 3000);
  } catch(e) {
    showStatus('PDF 오류: ' + e.message, 'error');
  }
  $('downloadBtn').disabled = false;
});

// ── UI controls ────────────────────────────────────────────────────────
document.querySelectorAll('.nup-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nup-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

  });
});

  $('orderLR').classList.add('active');
  $('orderTB').classList.remove('active');
});
$('orderTB').addEventListener('click', () => {
  orderLR = false;
  $('orderTB').classList.add('active');
  $('orderLR').classList.remove('active');
});

$('orientPort').addEventListener('click', () => {
  landscape = false;
  $('orientPort').classList.add('active');
  $('orientLand').classList.remove('active');
});
$('orientLand').addEventListener('click', () => {
  landscape = true;
  $('orientLand').classList.add('active');
  $('orientPort').classList.remove('active');
});

$('resetBtn').addEventListener('click', () => {
  parsedSlides = []; excludedSlides.clear(); renderedCanvases = [];
  $('thumbGrid').innerHTML = ''; $('thumbSection').style.display = 'none';
  $('fileInput').value = '';
  $('previewBtn').disabled = true; $('downloadBtn').disabled = true;
  $('previewInfo').textContent = '파일을 업로드하면 미리보기가 표시됩니다.';
  $('previewPages').textContent = '';
  $('previewScroll').innerHTML = '<div class="empty-state"><div class="icon">📑</div><p>PPTX 파일을 업로드하고<br>설정을 선택한 후 <b>미리보기 생성</b>을 클릭하세요.</p></div>';
  hideStatus();
});
