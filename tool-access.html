<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>접근 권한 확인</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f4f6f8;color:#12396d}.box{text-align:center}.spin{width:38px;height:38px;margin:0 auto 14px;border:4px solid #dbe5ee;border-top-color:#12396d;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><b>사용 권한을 확인하고 있습니다.</b></div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script>auth.onAuthStateChanged(async user=>{if(!user){location.replace('login.html');return}const access=await ProgramAccess.getAccess(user).catch(()=>null);if(!access||!access.approved){location.replace('approval-waiting.html');return}const target=new URLSearchParams(location.search).get('target')||'';const allowed=['tools/cover-editor-phase4.html'];if(!allowed.includes(target)){location.replace('index.html');return}location.replace(target)});</script></body></html>
