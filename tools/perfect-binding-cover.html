<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>무선제본 표지 제작기 · Program Tool</title>
  <meta name="description" content="앞표지와 뒤표지를 연결하고 책등 폭과 재단 여백을 계산해 무선제본 인쇄용 PDF를 만드는 도구입니다." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#12396d;--cyan:#1d9bb2;--ink:#0f172a;--muted:#64748b;--line:#dbe5ee;--bg:#eef4f8;--ok:#15803d;--nav-h:52px}
    html,body{height:100%}
    body{font-family:Pretendard,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);padding-top:var(--nav-h);overflow:hidden}
    button,input,select,textarea{font:inherit}
    .top-nav{position:fixed;inset:0 0 auto 0;z-index:100;height:var(--nav-h);background:#12396d;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
    .nav-back{display:flex;align-items:center;color:rgba(255,255,255,.86);text-decoration:none;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:800}.nav-back:hover{background:rgba(255,255,255,.14)}
    .nav-title{flex:1;text-align:center;color:#fff;font-size:15px;font-weight:900}.nav-user{display:flex;align-items:center;gap:8px}.nav-user-name{font-size:12px;color:rgba(255,255,255,.76);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav-logout{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer}.nav-logout:hover{background:rgba(255,255,255,.22)}
    .workspace{display:grid;grid-template-columns:390px minmax(0,1fr);height:calc(100vh - var(--nav-h));min-height:0}
    .settings{background:#fff;border-right:1px solid var(--line);padding:14px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:11px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:15px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
    .card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}.step{width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.card-title{font-size:14px;font-weight:900}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.field{margin-bottom:9px}.field:last-child{margin-bottom:0}.field label,.label{display:block;font-size:10px;font-weight:900;color:#475569;margin-bottom:4px}.field input[type="number"],.field input[type="text"],.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;color:#172033;font-size:11px;outline:none}.field textarea{resize:vertical;min-height:52px;line-height:1.45}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(29,155,178,.09)}.unit-wrap{position:relative}.unit-wrap input{padding-right:31px!important}.unit{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:8px;color:#94a3b8;font-weight:800}.help{font-size:8px;color:#94a3b8;line-height:1.45;margin-top:4px}.checkline{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#475569;cursor:pointer;margin-top:6px}.checkline input{accent-color:var(--navy)}
    .upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.upload-box{border:2px dashed #bfd4e3;border-radius:10px;background:#f8fbfd;padding:10px 8px;text-align:center;cursor:pointer;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s;overflow:hidden}.upload-box:hover{border-color:var(--cyan);background:#f0fdff}.upload-box.has-file{border-style:solid;border-color:#67c7d8;background:#effcff}.upload-ico{font-size:21px}.upload-name{font-size:9px;font-weight:900;color:#334155;margin-top:5px;max-width:135px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.upload-sub{font-size:8px;color:#94a3b8;margin-top:2px}.upload-input{display:none}.mini-btn{border:1px solid var(--line);background:#f8fafc;color:#475569;border-radius:7px;padding:7px 8px;font-size:9px;font-weight:850;cursor:pointer}.mini-btn:hover{background:#eef2f7}.color-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.color-field label{display:block;font-size:8px;font-weight:850;color:#64748b;margin-bottom:3px}.color-field input{width:100%;height:31px;border:1px solid var(--line);border-radius:7px;padding:3px;background:#fff;cursor:pointer}
    .calc-box{background:linear-gradient(135deg,#eff6ff,#ecfeff);border:1px solid #bae6fd;border-radius:10px;padding:11px;margin-top:5px}.calc-main{display:flex;align-items:end;justify-content:space-between;gap:9px}.calc-label{font-size:8px;font-weight:900;color:#0e7490}.calc-value{font-size:23px;font-weight:950;color:#12396d}.calc-value small{font-size:10px;margin-left:3px}.calc-detail{font-size:8px;color:#64748b;line-height:1.45;margin-top:5px}.warning{display:none;margin-top:7px;border-radius:8px;padding:7px 9px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:8px;font-weight:800;line-height:1.45}.warning.show{display:block}
    .preview-panel{padding:12px;min-width:0;min-height:0;display:flex;flex-direction:column;background:#edf2f6}
    .preview-card{flex:1;min-height:0;background:#fff;border:1px solid #d5e0e9;border-radius:15px;box-shadow:0 8px 25px rgba(15,23,42,.07);overflow:hidden;display:flex;flex-direction:column}.preview-head{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfdff;flex:0 0 auto}.preview-title{font-size:13px;font-weight:900}.preview-meta{font-size:9px;color:#64748b;margin-top:2px}.preview-actions{margin-left:auto;display:flex;gap:6px}.view-btn{border:1px solid var(--line);background:#fff;color:#475569;border-radius:7px;padding:6px 8px;font-size:9px;font-weight:850;cursor:pointer}.view-btn.active{background:#ecfeff;border-color:#67c7d8;color:#0e7490}
    .canvas-shell{position:relative;flex:1;min-height:0;background:repeating-conic-gradient(#e6edf3 0% 25%,#f2f6f9 0% 50%) 50%/20px 20px;padding:26px;display:flex;align-items:center;justify-content:center;overflow:auto}.canvas-wrap{position:relative;box-shadow:0 15px 38px rgba(15,23,42,.2);background:#fff;line-height:0}.canvas-wrap canvas{display:block;max-width:none}.panel-label{position:absolute;top:-18px;font-size:9px;font-weight:900;color:#64748b;line-height:1}.panel-label.back{left:18%}.panel-label.spine{left:50%;transform:translateX(-50%)}.panel-label.front{right:18%}
    .dimension-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 12px;border-top:1px solid var(--line);background:#f8fafc;flex:0 0 auto}.dimension{background:#fff;border:1px solid #e5edf4;border-radius:8px;padding:7px;text-align:center}.dimension strong{display:block;font-size:11px}.dimension span{display:block;font-size:8px;color:#94a3b8;margin-top:2px;font-weight:750}
    .download-card{margin-top:9px;background:#fff;border:1px solid #d5e0e9;border-radius:13px;padding:11px 12px;box-shadow:0 7px 22px rgba(15,23,42,.06);flex:0 0 auto}.download-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:7px}.download-btn{border:0;border-radius:9px;padding:10px 8px;font-size:10px;font-weight:900;cursor:pointer}.download-btn.primary{background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff}.download-btn.secondary{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}.download-btn.gray{background:#f1f5f9;color:#475569;border:1px solid #dbe5ee}.download-btn:disabled{opacity:.5;cursor:not-allowed}.status{min-height:15px;font-size:9px;font-weight:800;margin-top:6px}.status.ok{color:var(--ok)}.status.err{color:#dc2626}.status.info{color:#2563eb}
    #authLoading{position:fixed;inset:0;z-index:999;background:#fff;display:grid;place-items:center}.spinner{width:34px;height:34px;border:3px solid #dbe5ee;border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:960px){body{overflow:auto}.workspace{grid-template-columns:1fr;height:auto}.settings{overflow:visible;border-right:0}.preview-panel{min-height:720px}.preview-card{min-height:580px}}
    @media(max-width:620px){.top-nav{padding:0 9px}.nav-title{text-align:left}.nav-user-name{display:none}.settings,.preview-panel{padding:9px}.grid3{grid-template-columns:1fr 1fr}.upload-grid{grid-template-columns:1fr 1fr}.download-grid{grid-template-columns:1fr}.dimension-bar{grid-template-columns:1fr 1fr}.preview-panel{min-height:590px}.preview-card{min-height:470px}.canvas-shell{padding:22px 9px}}
  </style>
</head>
<body>
  <div id="authLoading"><div><div class="spinner"></div><div style="font-size:11px;font-weight:800;color:#64748b">로그인 확인 중...</div></div></div>
  <nav class="top-nav">
    <a class="nav-back" href="../index.html">← 도구 목록</a>
    <div class="nav-title">무선제본 표지 제작기</div>
    <div class="nav-user"><span class="nav-user-name" id="navUserName">사용자</span><button class="nav-logout" id="logoutBtn">로그아웃</button></div>
  </nav>

  <main class="workspace">
    <aside class="settings">
      <section class="card">
        <div class="card-head"><span class="step">1</span><div class="card-title">완성 규격과 재단 여백</div></div>
        <div class="field"><label for="sizePreset">완성 규격</label><select id="sizePreset"><option value="a4">A4 · 210 × 297mm</option><option value="b5jis">B5(JIS) · 182 × 257mm</option><option value="b5iso">B5(ISO) · 176 × 250mm</option><option value="a5">A5 · 148 × 210mm</option><option value="custom">직접 입력</option></select></div>
        <div class="grid3">
          <div class="field"><label>가로</label><div class="unit-wrap"><input id="trimW" type="number" min="80" max="300" step="0.1" value="210"><span class="unit">mm</span></div></div>
          <div class="field"><label>세로</label><div class="unit-wrap"><input id="trimH" type="number" min="100" max="450" step="0.1" value="297"><span class="unit">mm</span></div></div>
          <div class="field"><label>재단 여백</label><div class="unit-wrap"><input id="bleed" type="number" min="0" max="10" step="0.5" value="3"><span class="unit">mm</span></div></div>
        </div>
        <div class="field"><label>안전 여백</label><div class="unit-wrap"><input id="safeMargin" type="number" min="3" max="30" step="1" value="10"><span class="unit">mm</span></div></div>
      </section>

      <section class="card">
        <div class="card-head"><span class="step">2</span><div class="card-title">본문과 책등 폭</div></div>
        <div class="grid2">
          <div class="field"><label>본문 페이지 수</label><div class="unit-wrap"><input id="pageCount" type="number" min="2" max="3000" step="1" value="160"><span class="unit">p</span></div></div>
          <div class="field"><label>가공 보정</label><div class="unit-wrap"><input id="bindingAdjust" type="number" min="-2" max="5" step="0.1" value="0.5"><span class="unit">mm</span></div></div>
        </div>
        <div class="field"><label for="paperPreset">본문 용지</label><select id="paperPreset"><option value="0.10">모조지·미색모조 80g · 약 0.10mm</option><option value="0.12">모조지 100g · 약 0.12mm</option><option value="0.08">아트지 100g · 약 0.08mm</option><option value="0.10">아트지 120g · 약 0.10mm</option><option value="0.09">스노우지 100g · 약 0.09mm</option><option value="custom">직접 입력</option></select></div>
        <div class="field"><label>종이 한 장 두께</label><div class="unit-wrap"><input id="paperCaliper" type="number" min="0.04" max="0.4" step="0.005" value="0.10"><span class="unit">mm</span></div></div>
        <label class="checkline"><input type="checkbox" id="manualSpine">책등 폭 직접 입력</label>
        <div class="field" id="manualSpineField" style="display:none;margin-top:8px"><label>책등 폭</label><div class="unit-wrap"><input id="spineManual" type="number" min="0" max="100" step="0.1" value="8.5"><span class="unit">mm</span></div></div>
        <div class="calc-box"><div class="calc-main"><div><div class="calc-label">예상 책등 폭</div><div class="calc-value" id="spineValue">8.5<small>mm</small></div></div><button class="mini-btn" id="applySpineBtn" type="button">직접 입력에 복사</button></div><div class="calc-detail" id="calcDetail">80장 × 0.100mm + 보정 0.5mm</div></div>
        <div class="warning" id="spineWarning"></div>
      </section>

      <section class="card">
        <div class="card-head"><span class="step">3</span><div class="card-title">앞표지와 뒤표지</div></div>
        <div class="upload-grid">
          <label class="upload-box" id="backUploadBox" for="backInput"><span class="upload-ico">🖼️</span><span class="upload-name" id="backName">뒤표지 이미지</span><span class="upload-sub">JPG · PNG</span></label>
          <label class="upload-box" id="frontUploadBox" for="frontInput"><span class="upload-ico">🖼️</span><span class="upload-name" id="frontName">앞표지 이미지</span><span class="upload-sub">JPG · PNG</span></label>
        </div>
        <input class="upload-input" id="backInput" type="file" accept="image/jpeg,image/png,image/webp">
        <input class="upload-input" id="frontInput" type="file" accept="image/jpeg,image/png,image/webp">
        <div class="grid2" style="margin-top:9px"><button class="mini-btn" id="copyFrontBtn" type="button">앞표지를 뒤표지에 복사</button><button class="mini-btn" id="clearImagesBtn" type="button">이미지 삭제</button></div>
        <div class="field" style="margin-top:9px"><label>이미지 맞춤</label><select id="imageFit"><option value="cover">자동 채우기 · 원본 비율 유지</option><option value="contain">전체 보이기 · 원본 비율 유지</option></select></div>
        <div class="color-row">
          <div class="color-field"><label>뒤표지</label><input type="color" id="backColor" value="#eef4f8"></div>
          <div class="color-field"><label>책등</label><input type="color" id="spineColor" value="#12396d"></div>
          <div class="color-field"><label>앞표지</label><input type="color" id="frontColor" value="#f8fbff"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><span class="step">4</span><div class="card-title">표지 글자</div></div>
        <div class="field"><label>앞표지 제목</label><textarea id="frontTitle" placeholder="예: 2026학년도 방과후학교 운영 계획서">2026학년도 방과후학교 운영 계획서</textarea></div>
        <div class="field"><label>앞표지 부제목</label><input id="frontSubtitle" type="text" placeholder="선택사항"></div>
        <div class="grid2"><div class="field"><label>기관명·발행처</label><input id="publisher" type="text" placeholder="예: 한국초등학교"></div><div class="field"><label>발행 연도</label><input id="publishYear" type="text" value="2026"></div></div>
        <div class="field"><label>뒤표지 문구</label><textarea id="backText" placeholder="선택사항"></textarea></div>
        <div class="field"><label>책등 제목</label><input id="spineTitle" type="text" value="2026학년도 방과후학교 운영 계획서"></div>
        <div class="grid3">
          <div class="field"><label>앞 제목 크기</label><div class="unit-wrap"><input id="titleSize" type="number" min="10" max="80" value="28"><span class="unit">pt</span></div></div>
          <div class="field"><label>책등 크기</label><div class="unit-wrap"><input id="spineTextSize" type="number" min="5" max="30" value="11"><span class="unit">pt</span></div></div>
          <div class="field"><label>글자색</label><input id="textColor" type="color" value="#12396d" style="width:100%;height:33px;border:1px solid var(--line);border-radius:7px;padding:3px;background:#fff"></div>
        </div>
        <div class="grid2"><div class="field"><label>제목 자동 위치</label><select id="titlePosition"><option value="top">상단 정렬</option><option value="center" selected>중앙 정렬</option><option value="bottom">하단 정렬</option></select></div><div class="field"><label>책등 방향</label><select id="spineDirection"><option value="bottomToTop">아래에서 위로</option><option value="topToBottom">위에서 아래로</option><option value="vertical">한 글자씩 세로</option></select></div></div>
      </section>
    </aside>

    <section class="preview-panel">
      <section class="preview-card">
        <div class="preview-head"><div><div class="preview-title">전체 표지 미리보기</div><div class="preview-meta" id="previewMeta">뒤표지 | 책등 | 앞표지</div></div><div class="preview-actions"><button class="view-btn active" id="guideOnBtn" type="button">가이드</button><button class="view-btn" id="guideOffBtn" type="button">완성본</button></div></div>
        <div class="canvas-shell" id="canvasShell"><div class="canvas-wrap" id="canvasWrap"><span class="panel-label back">뒤표지</span><span class="panel-label spine">책등</span><span class="panel-label front">앞표지</span><canvas id="previewCanvas"></canvas></div></div>
        <div class="dimension-bar">
          <div class="dimension"><strong id="dimTrim">210 × 297</strong><span>완성 규격 mm</span></div>
          <div class="dimension"><strong id="dimSpine">8.5</strong><span>책등 mm</span></div>
          <div class="dimension"><strong id="dimTotal">428.5 × 303</strong><span>전체 작업 크기 mm</span></div>
          <div class="dimension"><strong id="dimDpi">300 DPI</strong><span>출력 해상도</span></div>
        </div>
      </section>
      <section class="download-card">
        <div class="download-grid"><button class="download-btn primary" id="pdfBtn" type="button">인쇄용 PDF 만들기</button><button class="download-btn secondary" id="guidePdfBtn" type="button">가이드 PDF</button><button class="download-btn gray" id="pngBtn" type="button">미리보기 PNG</button></div>
        <div class="status" id="status"></div>
      </section>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    const MM_PER_PT=25.4/72;
    const state={frontImage:null,backImage:null,showGuides:true,renderTimer:null};
    const SIZE_PRESETS={a4:[210,297],b5jis:[182,257],b5iso:[176,250],a5:[148,210]};

    auth.onAuthStateChanged(user=>{if(!user){location.href='../login.html';return}$('navUserName').textContent=user.displayName||(user.email||'').split('@')[0];$('authLoading').style.display='none';requestRender()});
    $('logoutBtn').addEventListener('click',async()=>{await auth.signOut();location.href='../index.html'});

    function num(id,fallback=0){const v=parseFloat($(id).value);return Number.isFinite(v)?v:fallback}
    function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
    function round1(v){return Math.round(v*10)/10}
    function getSpine(){if($('manualSpine').checked)return clamp(num('spineManual',0),0,100);const pages=Math.max(2,Math.ceil(num('pageCount',160)));return Math.max(0,Math.ceil(pages/2)*num('paperCaliper',.1)+num('bindingAdjust',.5))}
    function getSpec(){const trimW=clamp(num('trimW',210),80,300),trimH=clamp(num('trimH',297),100,450),bleed=clamp(num('bleed',3),0,10),spine=getSpine();return{trimW,trimH,bleed,spine,totalW:trimW*2+spine+bleed*2,totalH:trimH+bleed*2,safe:clamp(num('safeMargin',10),3,30)}}
    function updateCalculation(){const pages=Math.max(2,Math.ceil(num('pageCount',160))),sheets=Math.ceil(pages/2),caliper=num('paperCaliper',.1),adjust=num('bindingAdjust',.5),spine=getSpine(),s=getSpec();$('spineValue').innerHTML=`${spine.toFixed(1)}<small>mm</small>`;$('calcDetail').textContent=$('manualSpine').checked?`직접 입력값 ${spine.toFixed(1)}mm`:`${sheets}장 × ${caliper.toFixed(3)}mm + 보정 ${adjust.toFixed(1)}mm`;$('dimTrim').textContent=`${round1(s.trimW)} × ${round1(s.trimH)}`;$('dimSpine').textContent=spine.toFixed(1);$('dimTotal').textContent=`${round1(s.totalW)} × ${round1(s.totalH)}`;$('previewMeta').textContent=`뒤표지 ${s.trimW}mm | 책등 ${spine.toFixed(1)}mm | 앞표지 ${s.trimW}mm · 재단 여백 ${s.bleed}mm`;const warning=$('spineWarning');if(pages%2!==0){warning.textContent='홀수 페이지는 마지막 빈 페이지를 포함해 계산했습니다.';warning.classList.add('show')}else if(spine<3.5&&$('spineTitle').value.trim()){warning.textContent='책등이 3.5mm 미만이라 책등 글자가 작거나 생략될 수 있습니다.';warning.classList.add('show')}else{warning.classList.remove('show');warning.textContent=''}}

    function loadImageFile(file){return new Promise((resolve,reject)=>{if(!file||!/^image\//.test(file.type))return reject(new Error('JPG 또는 PNG 이미지만 사용할 수 있습니다.'));const reader=new FileReader();reader.onerror=()=>reject(new Error('이미지를 읽지 못했습니다.'));reader.onload=()=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('이미지 형식을 확인해 주세요.'));img.src=reader.result};reader.readAsDataURL(file)})}
    async function handleImageInput(inputId,key,boxId,nameId){const file=$(inputId).files?.[0];$(inputId).value='';if(!file)return;try{const img=await loadImageFile(file);state[key]=img;$(boxId).classList.add('has-file');$(nameId).textContent=file.name;requestRender()}catch(e){setStatus(e.message,'err')}}
    $('frontInput').addEventListener('change',()=>handleImageInput('frontInput','frontImage','frontUploadBox','frontName'));
    $('backInput').addEventListener('change',()=>handleImageInput('backInput','backImage','backUploadBox','backName'));
    $('copyFrontBtn').addEventListener('click',()=>{if(!state.frontImage)return setStatus('먼저 앞표지 이미지를 선택하세요.','err');state.backImage=state.frontImage;$('backUploadBox').classList.add('has-file');$('backName').textContent='앞표지 이미지 복사본';requestRender()});
    $('clearImagesBtn').addEventListener('click',()=>{state.frontImage=null;state.backImage=null;$('frontUploadBox').classList.remove('has-file');$('backUploadBox').classList.remove('has-file');$('frontName').textContent='앞표지 이미지';$('backName').textContent='뒤표지 이미지';requestRender()});

    function drawImageFit(ctx,img,x,y,w,h,mode,bg){ctx.save();ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);if(img){const scale=mode==='contain'?Math.min(w/img.width,h/img.height):Math.max(w/img.width,h/img.height);const dw=img.width*scale,dh=img.height*scale,dx=x+(w-dw)/2,dy=y+(h-dh)/2;ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(img,dx,dy,dw,dh)}ctx.restore()}
    function wrapText(ctx,text,maxWidth){const lines=[];String(text||'').split(/\n/).forEach(part=>{if(!part){lines.push('');return}let line='';for(const ch of part){const next=line+ch;if(line&&ctx.measureText(next).width>maxWidth){lines.push(line);line=ch}else line=next}if(line)lines.push(line)});return lines}
    function drawCenteredLines(ctx,text,cx,startY,maxWidth,fontPx,color,lineGap=1.28,bold=true){if(!String(text||'').trim())return startY;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${bold?900:600} ${fontPx}px Pretendard, sans-serif`;const lines=wrapText(ctx,text,maxWidth);lines.forEach((line,i)=>ctx.fillText(line,cx,startY+i*fontPx*lineGap));return startY+lines.length*fontPx*lineGap}

    function renderCover(canvas,dpi=110,withGuides=state.showGuides){const s=getSpec(),pxPerMm=dpi/25.4,w=Math.max(1,Math.round(s.totalW*pxPerMm)),h=Math.max(1,Math.round(s.totalH*pxPerMm));canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const mm=v=>v*pxPerMm,bleed=mm(s.bleed),trimW=mm(s.trimW),trimH=mm(s.trimH),spine=mm(s.spine),totalH=mm(s.totalH),backX=0,spineX=bleed+trimW,frontX=spineX+spine;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);drawImageFit(ctx,state.backImage,backX,0,bleed+trimW,totalH,$('imageFit').value,$('backColor').value);ctx.fillStyle=$('spineColor').value;ctx.fillRect(spineX,0,Math.max(1,spine),totalH);drawImageFit(ctx,state.frontImage,frontX,0,trimW+bleed,totalH,$('imageFit').value,$('frontColor').value);
      const color=$('textColor').value,titlePt=clamp(num('titleSize',28),10,80),titlePx=titlePt*dpi/72,frontCenter=frontX+trimW/2,frontTop=bleed,frontBottom=bleed+trimH,maxTextW=trimW*.78;const pos=$('titlePosition').value;let titleY=pos==='top'?frontTop+trimH*.22:pos==='bottom'?frontTop+trimH*.64:frontTop+trimH*.39;const titleEnd=drawCenteredLines(ctx,$('frontTitle').value,frontCenter,titleY,maxTextW,titlePx,color,1.25,true);if($('frontSubtitle').value.trim())drawCenteredLines(ctx,$('frontSubtitle').value,frontCenter,titleEnd+titlePx*.42,maxTextW,titlePx*.52,color,1.2,false);const publisherText=[$('publisher').value.trim(),$('publishYear').value.trim()].filter(Boolean).join(' · ');if(publisherText)drawCenteredLines(ctx,publisherText,frontCenter,frontBottom-mm(18),maxTextW,titlePx*.42,color,1.15,true);if($('backText').value.trim())drawCenteredLines(ctx,$('backText').value,bleed+trimW/2,bleed+trimH*.73,trimW*.72,titlePx*.42,color,1.35,false);
      const spineTitle=$('spineTitle').value.trim();if(spineTitle&&s.spine>=2.2){ctx.save();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';let fontPt=Math.min(clamp(num('spineTextSize',11),5,30),Math.max(5,s.spine/MM_PER_PT*.56));let fontPx=fontPt*dpi/72;ctx.font=`800 ${fontPx}px Pretendard, sans-serif`;const cx=spineX+spine/2,cy=bleed+trimH/2;const direction=$('spineDirection').value;if(direction==='vertical'){const chars=[...spineTitle.replace(/\s+/g,'')];const maxHeight=trimH-mm(26);const gap=Math.min(fontPx*1.08,maxHeight/Math.max(1,chars.length));chars.forEach((ch,i)=>ctx.fillText(ch,cx,cy-(chars.length-1)*gap/2+i*gap))}else{ctx.translate(cx,cy);ctx.rotate(direction==='topToBottom'?Math.PI/2:-Math.PI/2);const maxWidth=trimH-mm(28);while(ctx.measureText(spineTitle).width>maxWidth&&fontPx>mm(1.5)){fontPx*=.95;ctx.font=`800 ${fontPx}px Pretendard, sans-serif`}ctx.fillText(spineTitle,0,0)}ctx.restore()}
      if(withGuides){ctx.save();ctx.lineWidth=Math.max(1,dpi/100);ctx.setLineDash([mm(2),mm(1.2)]);ctx.strokeStyle='rgba(220,38,38,.92)';ctx.strokeRect(bleed,bleed,trimW,trimH);ctx.strokeRect(frontX,bleed,trimW,trimH);ctx.strokeStyle='rgba(37,99,235,.92)';ctx.beginPath();ctx.moveTo(spineX,bleed);ctx.lineTo(spineX,bleed+trimH);ctx.moveTo(frontX,bleed);ctx.lineTo(frontX,bleed+trimH);ctx.stroke();const safe=mm(s.safe);ctx.strokeStyle='rgba(21,128,61,.85)';ctx.strokeRect(bleed+safe,bleed+safe,trimW-safe*2,trimH-safe*2);ctx.strokeRect(frontX+safe,bleed+safe,trimW-safe*2,trimH-safe*2);ctx.setLineDash([]);ctx.font=`800 ${Math.max(9,dpi/9)}px Pretendard, sans-serif`;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle='rgba(220,38,38,.95)';ctx.fillText('재단선',bleed+4,bleed+4);ctx.fillStyle='rgba(37,99,235,.95)';ctx.fillText('책등',spineX+3,bleed+4);ctx.fillStyle='rgba(21,128,61,.95)';ctx.fillText('안전 여백',frontX+safe+4,bleed+safe+4);ctx.restore()}return s}

    function fitPreview(){const canvas=$('previewCanvas'),shell=$('canvasShell'),s=getSpec();const maxW=Math.max(260,shell.clientWidth-54),maxH=Math.max(220,shell.clientHeight-48);const ratio=s.totalW/s.totalH;let cssW=Math.min(maxW,maxH*ratio),cssH=cssW/ratio;if(cssH>maxH){cssH=maxH;cssW=cssH*ratio}canvas.style.width=Math.round(cssW)+'px';canvas.style.height=Math.round(cssH)+'px'}
    async function renderPreview(){updateCalculation();await document.fonts.ready;renderCover($('previewCanvas'),110,state.showGuides);fitPreview()}
    function requestRender(){clearTimeout(state.renderTimer);state.renderTimer=setTimeout(()=>renderPreview().catch(e=>setStatus(e.message,'err')),80)}
    function setStatus(msg,type='info'){const el=$('status');el.className='status '+type;el.textContent=msg;if(type!=='info')setTimeout(()=>{if(el.textContent===msg){el.textContent='';el.className='status'}},4500)}
    function safeName(){return ($('frontTitle').value.trim()||'무선제본_표지').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60)}
    function downloadDataUrl(dataUrl,name){const a=document.createElement('a');a.href=dataUrl;a.download=name;document.body.appendChild(a);a.click();a.remove()}
    async function createOutput(kind){const buttons=[$('pdfBtn'),$('guidePdfBtn'),$('pngBtn')];buttons.forEach(b=>b.disabled=true);setStatus('300DPI 표지를 생성하는 중입니다.','info');try{await document.fonts.ready;const s=getSpec(),canvas=document.createElement('canvas'),dpi=kind==='png'?180:300;const pixels=Math.round(s.totalW*dpi/25.4)*Math.round(s.totalH*dpi/25.4);if(pixels>52000000)throw new Error('현재 규격은 300DPI 생성 크기가 너무 큽니다.');renderCover(canvas,dpi,kind==='guide');await new Promise(r=>setTimeout(r,20));if(kind==='png'){downloadDataUrl(canvas.toDataURL('image/png'),`${safeName()}_미리보기.png`);setStatus('미리보기 PNG를 저장했습니다.','ok');return}const {jsPDF}=window.jspdf;const orientation=s.totalW>=s.totalH?'landscape':'portrait';const doc=new jsPDF({orientation,unit:'mm',format:[s.totalW,s.totalH],compress:true,hotfixes:['px_scaling']});doc.setProperties({title:`${safeName()} ${kind==='guide'?'가이드':'인쇄용'} 표지`,subject:'무선제본 전체 표지',creator:'Program Tool'});const img=canvas.toDataURL('image/jpeg',0.97);const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();doc.addImage(img,'JPEG',0,0,pw,ph,undefined,'FAST');doc.save(`${safeName()}_${kind==='guide'?'가이드':'인쇄용'}_${s.totalW.toFixed(1)}x${s.totalH.toFixed(1)}mm.pdf`);setStatus(kind==='guide'?'가이드 PDF를 저장했습니다.':'인쇄용 PDF를 저장했습니다.','ok')}catch(e){console.error(e);setStatus(e.message||'파일 생성 중 오류가 발생했습니다.','err')}finally{buttons.forEach(b=>b.disabled=false)}}

    $('sizePreset').addEventListener('change',()=>{const v=$('sizePreset').value;if(SIZE_PRESETS[v]){[$('trimW').value,$('trimH').value]=SIZE_PRESETS[v]}requestRender()});
    $('paperPreset').addEventListener('change',()=>{if($('paperPreset').value!=='custom')$('paperCaliper').value=$('paperPreset').value;requestRender()});
    $('manualSpine').addEventListener('change',()=>{$('manualSpineField').style.display=$('manualSpine').checked?'block':'none';requestRender()});
    $('applySpineBtn').addEventListener('click',()=>{$('spineManual').value=getSpine().toFixed(1);$('manualSpine').checked=true;$('manualSpineField').style.display='block';requestRender()});
    $('guideOnBtn').addEventListener('click',()=>{state.showGuides=true;$('guideOnBtn').classList.add('active');$('guideOffBtn').classList.remove('active');requestRender()});
    $('guideOffBtn').addEventListener('click',()=>{state.showGuides=false;$('guideOffBtn').classList.add('active');$('guideOnBtn').classList.remove('active');requestRender()});
    $('pdfBtn').addEventListener('click',()=>createOutput('clean'));$('guidePdfBtn').addEventListener('click',()=>createOutput('guide'));$('pngBtn').addEventListener('click',()=>createOutput('png'));
    document.querySelectorAll('input:not([type=file]),select,textarea').forEach(el=>{el.addEventListener('input',requestRender);el.addEventListener('change',requestRender)});
    window.addEventListener('resize',()=>{clearTimeout(state.resizeTimer);state.resizeTimer=setTimeout(()=>{fitPreview();requestRender()},100)});
    updateCalculation();
  </script>
