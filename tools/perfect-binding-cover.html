<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=/design-editor/?mode=cover">
  <title>표지디자인 · 통합 디자인 편집기</title>
  <script>
    (function(){
      const target=new URL('/design-editor/',location.origin);
      const incoming=new URLSearchParams(location.search);
      incoming.forEach((value,key)=>target.searchParams.append(key,value));
      target.searchParams.set('mode','cover');
      if(!target.searchParams.has('preset'))target.searchParams.set('preset','cover-a4');
      location.replace(target.pathname+target.search+location.hash);
    })();
  </script>
</head>
<body>
  <main aria-live="polite"><p>통합 디자인 편집기의 표지디자인으로 이동합니다. <a href="/design-editor/?mode=cover&preset=cover-a4">표지디자인 열기</a></p></main>
</body>
</html>
