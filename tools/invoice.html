<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>견적서·청구서 생성기 · Program Tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6f8; --primary: #12396d; --accent: #1d9bb2;
      --panel: #fff; --line: #e5e7eb; --muted: #6b7280; --nav-h: 52px;
    }
    html, body { height: 100%; }
    body { font-family: Pretendard, "Noto Sans KR", sans-serif; background: var(--bg); color: #111827; padding-top: var(--nav-h); }

    /* Nav */
    .top-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 500; height: var(--nav-h); background: var(--primary); display: flex; align-items: center; padding: 0 16px; gap: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.2); }
    .nav-back { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,.85); font-size: 13px; font-weight: 700; text-decoration: none; padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); white-space: nowrap; transition: background .15s; }
    .nav-back:hover { background: rgba(255,255,255,.15); color: #fff; }
    .nav-title { flex: 1; text-align: center; font-size: 15px; font-weight: 800; color: #fff; }
    .nav-user { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .nav-user-name { font-size: 12px; color: rgba(255,255,255,.75); font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-logout { color: rgba(255,255,255,.75); font-size: 12px; font-weight: 700; background: rgba(255,255,255,.12); border: none; border-radius: 7px; padding: 6px 10px; cursor: pointer; font-family: inherit; transition: background .15s; }
    .nav-logout:hover { background: rgba(255,255,255,.22); color: #fff; }

    /* Layout */
    body { overflow: hidden; }
    .app { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: calc(100vh - var(--nav-h)); }
    aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; height: 100%; }
    main { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; height: 100%; background: var(--bg); }

    /* Sidebar header */
    .sidebar-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sidebar-title { font-size: 13px; font-weight: 900; color: #0f172a; }
    .sample-btn { font-size: 11px; font-weight: 700; color: var(--accent); background: rgba(29,155,178,.08); border: 1px solid rgba(29,155,178,.3); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap; }
    .sample-btn:hover { background: rgba(29,155,178,.15); }

    /* Document type toggle */
    .doc-type-section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .doc-type-label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
    .doc-type-toggle { display: flex; gap: 6px; }
    .doc-type-btn { flex: 1; border: 2px solid var(--line); border-radius: 10px; padding: 9px 4px; font-size: 13px; font-weight: 800; color: #6b7280; background: #fff; cursor: pointer; font-family: inherit; transition: all .15s; text-align: center; }
    .doc-type-btn.active { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
    .doc-type-btn:hover:not(.active) { border-color: #94a3b8; color: #374151; }

    /* Sections */
    .sec { border-bottom: 1px solid var(--line); }
    .sec-head { display: flex; align-items: center; gap: 6px; padding: 10px 16px 8px; cursor: pointer; user-select: none; }
    .sec-head .sec-title { font-size: 10px; font-weight: 800; color: #374151; text-transform: uppercase; letter-spacing: .5px; flex: 1; }
    .sec-head .sec-arrow { font-size: 9px; color: #9ca3af; transition: transform .2s; }
    .sec-head.collapsed .sec-arrow { transform: rotate(-90deg); }
    .sec-body { padding: 0 16px 14px; }
    .sec-body.hidden { display: none; }

    /* Form */
    .field { margin-bottom: 8px; }
    .field label { display: block; font-size: 11px; font-weight: 800; color: #374151; margin-bottom: 3px; }
    .field input[type="text"],
    .field input[type="date"],
    .field input[type="number"],
    .field input[type="email"],
    .field input[type="tel"],
    .field textarea,
    .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; font-family: inherit; outline: none; background: #fff; color: #111827; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29,155,178,.1); }
    .field textarea { min-height: 64px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .logo-row { display: flex; gap: 8px; align-items: flex-start; }
    .logo-thumb { width: 64px; height: 48px; border: 1px solid var(--line); border-radius: 8px; object-fit: contain; background: #f8fafc; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #9ca3af; font-weight: 700; cursor: pointer; overflow: hidden; }
    .logo-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .logo-upload-btn { font-size: 11px; font-weight: 700; color: var(--accent); background: transparent; border: 1px dashed rgba(29,155,178,.4); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-family: inherit; transition: all .15s; }
    .logo-upload-btn:hover { background: rgba(29,155,178,.06); }
    #logoInput { display: none; }

    /* Items table */
    .items-section { padding: 0 16px 14px; }
    .items-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 8px; }
    .items-label { font-size: 10px; font-weight: 800; color: #374151; text-transform: uppercase; letter-spacing: .5px; }
    .add-row-btn { font-size: 11px; font-weight: 800; color: var(--accent); background: rgba(29,155,178,.08); border: 1px solid rgba(29,155,178,.25); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-family: inherit; transition: all .15s; }
    .add-row-btn:hover { background: rgba(29,155,178,.15); }
    .items-table-wrap { overflow-x: auto; margin-bottom: 10px; }
    .items-table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 560px; }
    .items-table th { background: #f8fafc; padding: 6px 5px; text-align: center; font-weight: 800; color: #374151; border: 1px solid #e5e7eb; font-size: 10px; }
    .items-table td { padding: 4px 3px; border: 1px solid #e5e7eb; vertical-align: middle; }
    .items-table td input { width: 100%; border: none; border-radius: 5px; padding: 5px 6px; font-size: 11px; font-family: inherit; outline: none; background: transparent; text-align: right; }
    .items-table td input:focus { background: #f0f9ff; outline: 1px solid var(--accent); }
    .items-table td input.name-input { text-align: left; }
    .items-table td.calc-cell { text-align: right; padding: 4px 6px; color: #374151; font-weight: 700; background: #f8fafc; font-size: 11px; }
    .items-table td.del-cell { text-align: center; width: 28px; }
    .del-row-btn { background: none; border: none; color: #cbd5e1; font-size: 16px; cursor: pointer; line-height: 1; padding: 2px; transition: color .12s; }
    .del-row-btn:hover { color: #ef4444; }
    .items-table tr:hover td { background: rgba(29,155,178,.03); }
    .items-table tr:hover td.calc-cell { background: #f1f5f9; }

    /* Totals */
    .totals-box { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .total-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; }
    .total-row .t-label { color: #6b7280; font-weight: 700; }
    .total-row .t-val { font-weight: 800; color: #374151; }
    .total-row.grand { border-top: 1.5px solid #334155; margin-top: 6px; padding-top: 10px; }
    .total-row.grand .t-label { font-size: 13px; font-weight: 900; color: #0f172a; }
    .total-row.grand .t-val { font-size: 15px; font-weight: 900; color: var(--primary); }

    /* Main area */
    .preview-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .preview-title { font-size: 13px; font-weight: 800; color: #374151; }
    .download-btn { display: flex; align-items: center; gap: 8px; background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; transition: background .15s; }
    .download-btn:hover { background: #0f2f5c; }
    .download-btn:disabled { opacity: .5; cursor: not-allowed; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .preview-wrap { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; background: #e8ecf0; border-radius: 12px; padding: 20px; min-height: 0; }

    /* Invoice preview canvas */
    #previewCanvas { background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.15); display: block; max-width: 100%; }

    /* Error toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }
    .toast.success { background: #059669; }

    /* Responsive */
    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; height: auto; }
      aside { height: auto; border-right: none; border-bottom: 1px solid var(--line); }
      main { height: auto; min-height: 500px; overflow: visible; }
      .preview-wrap { min-height: 400px; }
      .nav-user-name { display: none; }
    }
  </style>
</head>

<script>
/* =========================================================
   Auth
   ========================================================= */
function denyAccess(msg) {
  document.body.replaceChildren();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;text-align:center;padding:24px;font-family:sans-serif;';
  wrap.innerHTML = '<div style="font-size:52px;">🔒</div><div style="font-size:20px;font-weight:900;color:#0f172a;">접근 권한이 없습니다</div><div class="msg" style="font-size:14px;color:#64748b;max-width:320px;line-height:1.6;"></div><a href="../index.html" style="margin-top:8px;padding:10px 24px;background:#12396d;color:#fff;border-radius:10px;text-decoration:none;font-weight:800;font-size:14px;">← 홈으로</a>';
  wrap.querySelector('.msg').textContent = msg;
  document.body.appendChild(wrap);
}

auth.onAuthStateChanged(async user => {
  if (!user) { window.location.href = '../login.html'; return; }
  const name = user.displayName || (user.email || '').split('@')[0];
  document.getElementById('userName').textContent = name;
  try {
    const userEmail = String(user.email || '').trim().toLowerCase();
    const [adminDoc, programsDoc, permDoc] = await Promise.all([
      db.collection('settings').doc('admin').get(),
      db.collection('settings').doc('programs').get(),
      db.collection('user_permissions').doc(user.uid).get()
    ]);
    const adminEmails = (adminDoc.exists ? (adminDoc.data().emails || []) : []).map(e => String(e).trim().toLowerCase());
    const isAdmin = adminEmails.includes(userEmail) || !adminDoc.exists;
    const isPublic = !!(programsDoc.exists && programsDoc.data().public?.['invoice']);
    const isApproved = permDoc.exists && permDoc.data().programs?.['invoice'] === true;
    if (!isAdmin && !isPublic && !isApproved) denyAccess('견적서·청구서 생성기는 관리자 승인 후 사용할 수 있습니다.');
  } catch (e) {
    console.error('Permission check failed', e);
    denyAccess('권한 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
  }
  // Init once auth is confirmed
  initPage();
});

async function doLogout() { await auth.signOut(); window.location.href = '../index.html'; }

/* =========================================================
   State
   ========================================================= */
let currentDocType = '견적서';
let logoDataUrl = null;
let itemIdCounter = 0;
let previewTimer = null;

/* =========================================================
   Init
   ========================================================= */
function initPage() {
  // Set today as issue date
  const today = new Date();
  document.getElementById('issueDate').value = formatDateInput(today);

  // Auto doc number
  const now = new Date();
  const ymd = now.getFullYear().toString().slice(2) +
    String(now.getMonth() + 1).padStart(2, '0') +
    String(now.getDate()).padStart(2, '0');
  document.getElementById('docNumber').value = `${ymd}-001`;

  // Valid until = today + 30 days
  const valid = new Date(today);
  valid.setDate(valid.getDate() + 30);
  document.getElementById('validUntil').value = formatDateInput(valid);

  // Attach change listeners to date/docnum fields
  ['issueDate', 'validUntil', 'docNumber'].forEach(id => {
    document.getElementById(id).addEventListener('input', schedulePreview);
  });

  // Add 3 initial rows
  addItemRow();
  addItemRow();
  addItemRow();

  // Initial preview
  schedulePreview();
}

/* =========================================================
   Helpers
   ========================================================= */
function formatDateInput(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDateKo(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  return `${y}년 ${m}월 ${d}일`;
}

function formatWon(n) {
  if (isNaN(n) || n === '' || n === null) return '₩0';
  return '₩' + Math.round(Number(n)).toLocaleString('ko-KR');
}

function parseNum(str) {
  const v = parseFloat(String(str).replace(/,/g, ''));
  return isNaN(v) ? 0 : v;
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 3000);
}

/* =========================================================
   Document type
   ========================================================= */
function setDocType(btn) {
  document.querySelectorAll('.doc-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDocType = btn.dataset.type;
  schedulePreview();
}

/* =========================================================
   Section toggle
   ========================================================= */
function toggleSec(head) {
  head.classList.toggle('collapsed');
  head.nextElementSibling.classList.toggle('hidden');
}

/* =========================================================
   Logo
   ========================================================= */
function handleLogoUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    logoDataUrl = e.target.result;
    document.getElementById('logoPlaceholder').style.display = 'none';
    const img = document.getElementById('logoImg');
    img.src = logoDataUrl;
    img.style.display = 'block';
    schedulePreview();
  };
  reader.readAsDataURL(file);
}

/* =========================================================
   Items
   ========================================================= */
function addItemRow(data = {}) {
  const id = ++itemIdCounter;
  const tbody = document.getElementById('itemsBody');
  const tr = document.createElement('tr');
  tr.dataset.id = id;
  tr.innerHTML = `
    <td><input type="text" class="name-input" placeholder="품목명" value="${data.name||''}" data-field="name" oninput="onItemInput(${id})" /></td>
    <td><input type="text" placeholder="" value="${data.spec||''}" data-field="spec" oninput="onItemInput(${id})" style="text-align:center;" /></td>
    <td><input type="number" placeholder="1" value="${data.qty||''}" data-field="qty" min="0" oninput="onItemInput(${id})" style="text-align:center;width:52px;" /></td>
    <td><input type="number" placeholder="0" value="${data.price||''}" data-field="price" min="0" oninput="onItemInput(${id})" /></td>
    <td class="calc-cell" data-role="supply">₩0</td>
    <td class="calc-cell" data-role="tax">₩0</td>
    <td class="calc-cell" data-role="total">₩0</td>
    <td class="del-cell"><button class="del-row-btn" onclick="delItemRow(${id})" title="행 삭제">×</button></td>
  `;
  tbody.appendChild(tr);
  if (data.qty || data.price) calcRow(id);
  schedulePreview();
}

function delItemRow(id) {
  const tr = document.querySelector(`#itemsBody tr[data-id="${id}"]`);
  if (tr) tr.remove();
  calcTotals();
  schedulePreview();
}

function onItemInput(id) {
  calcRow(id);
  schedulePreview();
}

function calcRow(id) {
  const tr = document.querySelector(`#itemsBody tr[data-id="${id}"]`);
  if (!tr) return;
  const qty = parseNum(tr.querySelector('[data-field="qty"]').value);
  const price = parseNum(tr.querySelector('[data-field="price"]').value);
  const supply = qty * price;
  const tax = Math.round(supply * 0.1);
  const total = supply + tax;
  tr.querySelector('[data-role="supply"]').textContent = formatWon(supply);
  tr.querySelector('[data-role="tax"]').textContent = formatWon(tax);
  tr.querySelector('[data-role="total"]').textContent = formatWon(total);
  calcTotals();
}

function calcTotals() {
  let supplySum = 0, taxSum = 0;
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const qty = parseNum(tr.querySelector('[data-field="qty"]')?.value || 0);
    const price = parseNum(tr.querySelector('[data-field="price"]')?.value || 0);
    const supply = qty * price;
    supplySum += supply;
    taxSum += Math.round(supply * 0.1);
  });
  document.getElementById('totalSupply').textContent = formatWon(supplySum);
  document.getElementById('totalTax').textContent = formatWon(taxSum);
  document.getElementById('totalGrand').textContent = formatWon(supplySum + taxSum);
}

/* =========================================================
   Collect form data
   ========================================================= */
function collectData() {
  const items = [];
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const name = tr.querySelector('[data-field="name"]')?.value?.trim() || '';
    const spec = tr.querySelector('[data-field="spec"]')?.value?.trim() || '';
    const qty = parseNum(tr.querySelector('[data-field="qty"]')?.value || 0);
    const price = parseNum(tr.querySelector('[data-field="price"]')?.value || 0);
    const supply = qty * price;
    const tax = Math.round(supply * 0.1);
    items.push({ name, spec, qty, price, supply, tax, total: supply + tax });
  });

  let supplySum = 0, taxSum = 0;
  items.forEach(it => { supplySum += it.supply; taxSum += it.tax; });

  return {
    doc_type: currentDocType,
    doc_number: document.getElementById('docNumber').value.trim(),
    issue_date: document.getElementById('issueDate').value,
    valid_until: document.getElementById('validUntil').value,
    company: {
      name: document.getElementById('companyName').value.trim(),
      biz_number: document.getElementById('bizNumber').value.trim(),
      ceo: document.getElementById('ceoName').value.trim(),
      biz_type: document.getElementById('bizType').value.trim(),
      address: document.getElementById('companyAddr').value.trim(),
      tel: document.getElementById('companyTel').value.trim(),
      email: document.getElementById('companyEmail').value.trim(),
      logo: logoDataUrl || null,
    },
    client: {
      name: document.getElementById('clientName').value.trim(),
      contact: document.getElementById('clientContact').value.trim(),
      biz_number: document.getElementById('clientBizNum').value.trim(),
      address: document.getElementById('clientAddr').value.trim(),
      tel: document.getElementById('clientTel').value.trim(),
    },
    items,
    totals: { supply: supplySum, tax: taxSum, grand: supplySum + taxSum },
    notes: document.getElementById('notes').value.trim(),
  };
}

/* =========================================================
   Canvas Preview
   ========================================================= */
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderPreview, 120);
}

function renderPreview() {
  const data = collectData();
  const canvas = document.getElementById('previewCanvas');
  const SCALE = 1.5;
  const W = 794; // A4 ~210mm at 96dpi
  const H = 1123; // A4 ~297mm at 96dpi
  canvas.width = W * SCALE;
  canvas.height = H * SCALE;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);

  // Background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const MARGIN = 40;
  let y = MARGIN;

  // ---- Document title ----
  ctx.fillStyle = '#12396d';
  ctx.font = 'bold 32px Pretendard, "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(data.doc_type, W / 2, y + 32);
  y += 50;

  // Divider line
  ctx.strokeStyle = '#12396d';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(MARGIN, y); ctx.lineTo(W - MARGIN, y); ctx.stroke();
  y += 14;

  // ---- Doc meta (number, dates) ----
  ctx.font = '11px Pretendard, "Noto Sans KR", sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.textAlign = 'left';
  const metaParts = [];
  if (data.doc_number) metaParts.push(`문서번호: ${data.doc_number}`);
  if (data.issue_date) metaParts.push(`발행일: ${formatDateKo(data.issue_date)}`);
  if (data.valid_until && data.doc_type === '견적서') metaParts.push(`유효기간: ${formatDateKo(data.valid_until)}`);
  ctx.fillText(metaParts.join('    '), MARGIN, y + 11);
  y += 26;

  // ---- Company / Client boxes ----
  const boxY = y;
  const halfW = (W - MARGIN * 2 - 12) / 2;

  // Helper: draw info box
  function drawInfoBox(x, bx, label, infoLines) {
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    const bh = 110;
    roundRect(ctx, x, bx, halfW, bh, 8);
    ctx.fillStyle = '#f8fafc';
    ctx.fill();
    ctx.stroke();

    // Label bar
    ctx.fillStyle = '#12396d';
    roundRectTop(ctx, x, bx, halfW, 24, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Pretendard, "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + halfW / 2, bx + 16);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#1e293b';
    let ly = bx + 38;
    infoLines.forEach((line, i) => {
      if (!line.val) return;
      ctx.font = i === 0 ? 'bold 12px Pretendard, "Noto Sans KR", sans-serif' : '10px Pretendard, "Noto Sans KR", sans-serif';
      ctx.fillStyle = i === 0 ? '#0f172a' : '#374151';
      if (line.label) {
        ctx.fillStyle = '#6b7280';
        ctx.font = '10px Pretendard, "Noto Sans KR", sans-serif';
        ctx.fillText(line.label, x + 10, ly);
        ctx.fillStyle = '#1e293b';
        ctx.font = i === 0 ? 'bold 12px Pretendard, "Noto Sans KR", sans-serif' : '10px Pretendard, "Noto Sans KR", sans-serif';
        ctx.fillText(line.val, x + 55, ly);
      } else {
        ctx.fillText(line.val, x + 10, ly);
      }
      ly += 14;
    });
  }

  // Logo
  function drawLogo() {
    if (!logoDataUrl) return;
    try {
      const img = document.getElementById('logoImg');
      if (img && img.complete) {
        const lx = W - MARGIN - halfW + 4;
        const lw = 48; const lh = 32;
        ctx.drawImage(img, lx + halfW - lw - 8, boxY + 28, lw, lh);
      }
    } catch (e) {}
  }

  const compLines = [
    { val: data.company.name || '(회사명 미입력)' },
    { label: '사업자번호', val: data.company.biz_number },
    { label: '대  표  자', val: data.company.ceo },
    { label: '주      소', val: data.company.address ? truncate(data.company.address, 28) : '' },
    { label: '전  화  번호', val: data.company.tel },
    { label: '이  메  일', val: data.company.email },
  ];
  const clientLines = [
    { val: data.client.name || '(고객사명 미입력)' },
    { label: '사업자번호', val: data.client.biz_number },
    { label: '담  당  자', val: data.client.contact },
    { label: '주      소', val: data.client.address ? truncate(data.client.address, 28) : '' },
    { label: '전  화  번호', val: data.client.tel },
  ];

  drawInfoBox(MARGIN, boxY, '공급자', compLines);
  drawInfoBox(MARGIN + halfW + 12, boxY, '공급받는자', clientLines);
  drawLogo();

  y = boxY + 118;

  // ---- Items table ----
  y += 16;
  const COLS = [
    { label: '품목명', w: 0.26, align: 'left' },
    { label: '규격', w: 0.08, align: 'center' },
    { label: '수량', w: 0.07, align: 'center' },
    { label: '단가', w: 0.13, align: 'right' },
    { label: '공급가액', w: 0.14, align: 'right' },
    { label: '세액(10%)', w: 0.14, align: 'right' },
    { label: '합계', w: 0.18, align: 'right' },
  ];
  const tableW = W - MARGIN * 2;
  const HEADER_H = 22;
  const ROW_H = 20;

  // Header
  ctx.fillStyle = '#12396d';
  ctx.fillRect(MARGIN, y, tableW, HEADER_H);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Pretendard, "Noto Sans KR", sans-serif';
  let cx = MARGIN;
  COLS.forEach(col => {
    const cw = tableW * col.w;
    ctx.textAlign = 'center';
    ctx.fillText(col.label, cx + cw / 2, y + 15);
    cx += cw;
  });
  y += HEADER_H;

  // Rows
  const visibleItems = data.items.filter(it => it.name || it.qty || it.price);
  const rowsToShow = Math.max(visibleItems.length, 8); // at least 8 rows
  for (let i = 0; i < rowsToShow; i++) {
    const item = visibleItems[i] || null;
    const bg = i % 2 === 0 ? '#ffffff' : '#f8fafc';
    ctx.fillStyle = bg;
    ctx.fillRect(MARGIN, y, tableW, ROW_H);
    ctx.strokeStyle = '#e5e7eb';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(MARGIN, y, tableW, ROW_H);

    if (item) {
      const vals = [
        { v: item.name, a: 'left', pad: 6 },
        { v: item.spec, a: 'center' },
        { v: item.qty > 0 ? item.qty.toString() : '', a: 'center' },
        { v: item.price > 0 ? formatWon(item.price) : '', a: 'right', pad: 6 },
        { v: item.supply > 0 ? formatWon(item.supply) : '', a: 'right', pad: 6 },
        { v: item.tax > 0 ? formatWon(item.tax) : '', a: 'right', pad: 6 },
        { v: item.total > 0 ? formatWon(item.total) : '', a: 'right', pad: 6 },
      ];
      ctx.fillStyle = '#111827';
      ctx.font = '10px Pretendard, "Noto Sans KR", sans-serif';
      let colX = MARGIN;
      COLS.forEach((col, ci) => {
        const cw = tableW * col.w;
        const vl = vals[ci];
        if (vl?.v) {
          ctx.textAlign = vl.a;
          const tx = vl.a === 'left' ? colX + (vl.pad || 4) : vl.a === 'right' ? colX + cw - (vl.pad || 4) : colX + cw / 2;
          ctx.fillText(truncate(vl.v, 20), tx, y + 14);
        }
        colX += cw;
      });
    }
    y += ROW_H;
  }

  // Totals
  y += 10;
  const totW = 280;
  const totX = W - MARGIN - totW;

  function drawTotalRow(lbl, val, bold, highlighted) {
    if (highlighted) {
      ctx.fillStyle = '#eff6ff';
      ctx.fillRect(totX - 4, y - 14, totW + 8, 22);
    }
    ctx.fillStyle = bold ? '#12396d' : '#374151';
    ctx.font = bold ? 'bold 12px Pretendard, "Noto Sans KR", sans-serif' : '11px Pretendard, "Noto Sans KR", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(lbl, totX + 4, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = bold ? '#12396d' : '#374151';
    ctx.font = bold ? 'bold 13px Pretendard, "Noto Sans KR", sans-serif' : '11px Pretendard, "Noto Sans KR", sans-serif';
    ctx.fillText(val, W - MARGIN - 4, y);
    y += 20;
  }

  drawTotalRow('공급가액 합계', formatWon(data.totals.supply), false, false);
  drawTotalRow('세액 합계 (10%)', formatWon(data.totals.tax), false, false);
  // divider
  ctx.strokeStyle = '#12396d';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(totX - 4, y - 6); ctx.lineTo(W - MARGIN, y - 6); ctx.stroke();
  drawTotalRow('합계금액', formatWon(data.totals.grand), true, true);

  // Notes
  if (data.notes) {
    y += 8;
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.strokeRect(MARGIN, y, tableW, 60);
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(MARGIN, y, tableW, 60);

    ctx.fillStyle = '#374151';
    ctx.font = 'bold 10px Pretendard, "Noto Sans KR", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('비고', MARGIN + 8, y + 14);

    ctx.fillStyle = '#6b7280';
    ctx.font = '10px Pretendard, "Noto Sans KR", sans-serif';
    const lines = data.notes.split('\n').slice(0, 3);
    lines.forEach((line, i) => {
      ctx.fillText(truncate(line, 90), MARGIN + 8, y + 28 + i * 13);
    });
    y += 70;
  }

  // Footer
  y = H - 30;
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(MARGIN, y); ctx.lineTo(W - MARGIN, y); ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.font = '9px Pretendard, "Noto Sans KR", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${data.company.name || ''}  |  본 문서는 Program Tool을 통해 생성되었습니다.`, W / 2, y + 14);
}

function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max) + '…' : str;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function roundRectTop(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* =========================================================
   PDF Download
   ========================================================= */
async function downloadPdf() {
  const btn = document.getElementById('downloadBtn');
  const data = collectData();

  if (!data.company.name) { showToast('공급자 회사명을 입력해주세요.', 'error'); return; }
  if (!data.client.name) { showToast('고객사 회사명을 입력해주세요.', 'error'); return; }
  const hasItems = data.items.some(it => it.name && (it.qty > 0 || it.price > 0));
  if (!hasItems) { showToast('품목을 최소 1개 이상 입력해주세요.', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 생성 중...';

  try {
    const user = auth.currentUser;
    if (!user) throw new Error('로그인이 필요합니다.');
    const token = await user.getIdToken();

    const resp = await fetch('/api/invoice/generate', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: `서버 오류 (${resp.status})` }));
      throw new Error(err.detail || 'PDF 생성 중 오류가 발생했습니다.');
    }

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = data.issue_date ? data.issue_date.replace(/-/g, '') : 'undated';
    a.href = url;
    a.download = `${data.doc_type}_${data.client.name || 'unknown'}_${dateStr}.pdf`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);

    showToast('PDF가 다운로드되었습니다.', 'success');
  } catch (e) {
    console.error(e);
    showToast(e.message || 'PDF 생성에 실패했습니다.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'PDF 다운로드';
  }
}
