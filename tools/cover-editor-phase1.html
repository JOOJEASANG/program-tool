<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>표지 텍스트 편집기 1단계 · Program Tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root{--navy:#12396d;--cyan:#1d9bb2;--line:#dbe5ee;--bg:#eef4f8;--ink:#0f172a;--muted:#64748b;--nav-h:52px}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Pretendard,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);padding-top:var(--nav-h);overflow:hidden}
    button,input,select,textarea{font:inherit}.top-nav{position:fixed;inset:0 0 auto;height:var(--nav-h);z-index:50;background:var(--navy);display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff}.top-nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:800;border:1px solid rgba(255,255,255,.22);padding:7px 10px;border-radius:8px}.title{font-weight:900;font-size:14px;flex:1;text-align:center}.status{font-size:11px;color:rgba(255,255,255,.8);min-width:95px;text-align:right}
    .app{height:calc(100vh - var(--nav-h));display:grid;grid-template-columns:240px minmax(0,1fr) 280px}.panel{background:#fff;overflow:auto;padding:12px;border-color:var(--line)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.panel h2{font-size:13px;margin:0 0 10px}.section{border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin-bottom:10px}.section-title{font-size:11px;font-weight:900;color:#475569;margin-bottom:8px}.btn{width:100%;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:11px;font-weight:850;background:#f1f5f9;color:#334155;margin-bottom:6px}.btn.primary{background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff}.btn.danger{color:#b91c1c;background:#fef2f2}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.field{margin-bottom:8px}.field label{display:block;font-size:10px;font-weight:850;color:#475569;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px;font-size:11px;background:#fff}.field textarea{min-height:70px;resize:vertical}.toolbar{display:flex;gap:5px;flex-wrap:wrap}.tool{border:1px solid var(--line);background:#fff;border-radius:7px;min-width:34px;padding:7px 8px;font-size:11px;font-weight:850;cursor:pointer}.tool.active{background:#e0f2fe;border-color:#38bdf8;color:#075985}.hint{font-size:9px;line-height:1.55;color:#64748b}
    .workspace{min-width:0;min-height:0;display:flex;flex-direction:column}.workbar{height:46px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:6px}.workbar .tool{padding:6px 9px}.zoom{margin-left:auto;font-size:10px;color:#64748b}.stage-shell{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:32px;background:repeating-conic-gradient(#e6edf3 0 25%,#f4f7f9 0 50%) 50%/20px 20px}.cover{position:relative;width:900px;height:620px;background:#fff;box-shadow:0 18px 45px rgba(15,23,42,.2);transform-origin:center;overflow:hidden;user-select:none}.zone{position:absolute;top:0;bottom:0;border-right:1px dashed rgba(18,57,109,.5);pointer-events:none}.zone.back{left:0;width:435px}.zone.spine{left:435px;width:30px;background:rgba(29,155,178,.06)}.zone.front{left:465px;right:0;border-right:0}.zone-label{position:absolute;top:9px;font-size:10px;font-weight:900;color:rgba(18,57,109,.55);pointer-events:none}.zone-label.back{left:205px}.zone-label.spine{left:442px;writing-mode:vertical-rl}.zone-label.front{right:205px}
    .text-object{position:absolute;min-width:40px;min-height:22px;padding:4px 7px;border:1px solid transparent;cursor:move;white-space:pre-wrap;line-height:1.2;transform-origin:center;outline:none}.text-object.selected{border:1px solid #0ea5e9;box-shadow:0 0 0 2px rgba(14,165,233,.15)}.text-object.editing{cursor:text;border-style:dashed}.handle{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #0ea5e9;display:none}.selected .handle{display:block}.handle.br{right:-6px;bottom:-6px;cursor:nwse-resize}.handle.rotate{left:50%;top:-22px;transform:translateX(-50%);cursor:grab}.handle.rotate:after{content:"";position:absolute;left:2px;top:7px;width:1px;height:13px;background:#0ea5e9}
    .layer{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:7px;margin-bottom:5px;font-size:10px;cursor:pointer}.layer.active{border-color:#38bdf8;background:#f0f9ff}.layer span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{font-size:10px;color:#94a3b8;text-align:center;padding:18px 4px}
    @media(max-width:980px){body{overflow:auto}.app{grid-template-columns:1fr;height:auto}.panel{border:0!important}.workspace{min-height:720px}.cover{transform:scale(.7)}}
  </style>
</head>
<body>
<nav class="top-nav"><a href="perfect-binding-cover.html">← 기존 제작기</a><div class="title">표지 텍스트 편집기 · 1단계</div><div class="status" id="saveStatus">자동 저장 준비</div></nav>
<main class="app">
  <aside class="panel left">
    <h2>요소 추가</h2>
    <section class="section"><div class="section-title">텍스트</div><button class="btn primary" id="addTitle">제목 추가</button><button class="btn" id="addSubtitle">부제 추가</button><button class="btn" id="addSpine">책등 제목 추가</button><div class="hint">추가한 글자는 캔버스에서 드래그해 이동하고, 더블클릭해 직접 수정할 수 있습니다.</div></section>
    <section class="section"><div class="section-title">작업</div><div class="row"><button class="btn" id="undoBtn">실행 취소</button><button class="btn" id="redoBtn">다시 실행</button></div><button class="btn" id="duplicateBtn">선택 개체 복제</button><button class="btn danger" id="deleteBtn">선택 개체 삭제</button></section>
    <section class="section"><div class="section-title">프로젝트</div><button class="btn" id="saveBtn">브라우저에 저장</button><button class="btn" id="loadBtn">저장 작업 불러오기</button><button class="btn" id="exportBtn">프로젝트 JSON 내보내기</button><label class="btn" style="display:block;text-align:center">프로젝트 JSON 불러오기<input id="importInput" type="file" accept="application/json" hidden></label><button class="btn danger" id="resetBtn">새 작업으로 초기화</button></section>
  </aside>
  <section class="workspace">
    <div class="workbar"><button class="tool" id="zoomOut">−</button><button class="tool" id="zoomReset">100%</button><button class="tool" id="zoomIn">＋</button><button class="tool" id="centerFront">앞표지 중앙</button><button class="tool" id="centerBack">뒤표지 중앙</button><button class="tool" id="centerSpine">책등 중앙</button><span class="zoom" id="zoomText">100%</span></div>
    <div class="stage-shell" id="stageShell"><div class="cover" id="cover"><div class="zone back"></div><div class="zone spine"></div><div class="zone front"></div><span class="zone-label back">뒤표지</span><span class="zone-label spine">책등</span><span class="zone-label front">앞표지</span></div></div>
  </section>
  <aside class="panel right">
    <h2>선택 개체 속성</h2>
    <div id="noSelection" class="empty">텍스트를 선택하면 편집 속성이 표시됩니다.</div>
    <div id="properties" hidden>
      <section class="section"><div class="section-title">내용</div><div class="field"><textarea id="textValue"></textarea></div></section>
      <section class="section"><div class="section-title">글꼴</div><div class="field"><label>글꼴</label><select id="fontFamily"><option value="Pretendard">Pretendard</option><option value="Noto Sans KR">Noto Sans KR</option><option value="Arial">Arial</option><option value="serif">명조 계열</option><option value="sans-serif">고딕 계열</option></select></div><div class="row"><div class="field"><label>크기</label><input id="fontSize" type="number" min="6" max="180"></div><div class="field"><label>색상</label><input id="fontColor" type="color"></div></div><div class="toolbar"><button class="tool" id="boldBtn">굵게</button><button class="tool" id="italicBtn">기울임</button><button class="tool" data-align="left">왼쪽</button><button class="tool" data-align="center">가운데</button><button class="tool" data-align="right">오른쪽</button></div></section>
      <section class="section"><div class="section-title">정밀 위치</div><div class="row"><div class="field"><label>X</label><input id="posX" type="number"></div><div class="field"><label>Y</label><input id="posY" type="number"></div></div><div class="row"><div class="field"><label>너비</label><input id="objW" type="number" min="20"></div><div class="field"><label>회전</label><input id="rotation" type="number" min="-180" max="180"></div></div></section>
      <section class="section"><div class="section-title">레이어</div><div class="row"><button class="btn" id="bringFront">맨 앞으로</button><button class="btn" id="sendBack">맨 뒤로</button></div></section>
    </div>
    <section class="section"><div class="section-title">개체 목록</div><div id="layerList"></div></section>
  </aside>
</main>
<script>
(() => {
  'use strict';
  const cover = document.getElementById('cover');
  const $ = id => document.getElementById(id);
  const state = {objects:[], selectedId:null, undo:[], redo:[], zoom:1};
  let drag=null, resize=null, rotate=null, saveTimer=null;
  const uid=()=>`t_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
  const clone=o=>JSON.parse(JSON.stringify(o));
  const selected=()=>state.objects.find(o=>o.id===state.selectedId)||null;
  function snapshot(){return JSON.stringify({objects:state.objects,selectedId:state.selectedId});}
  function pushHistory(){state.undo.push(snapshot());if(state.undo.length>60)state.undo.shift();state.redo=[];}
  function restore(raw){const data=JSON.parse(raw);state.objects=data.objects||[];state.selectedId=data.selectedId||null;render();}
  function scheduleSave(){clearTimeout(saveTimer);$('saveStatus').textContent='변경 저장 중…';saveTimer=setTimeout(()=>{localStorage.setItem('coverEditorPhase1',snapshot());$('saveStatus').textContent='자동 저장 완료';},500);}
  function addText(text,opts={}){pushHistory();const o={id:uid(),text,x:opts.x??590,y:opts.y??235,w:opts.w??250,fontSize:opts.fontSize??36,fontFamily:'Pretendard',color:'#12396d',bold:opts.bold??true,italic:false,align:'center',rotation:opts.rotation??0,z:Date.now()};state.objects.push(o);state.selectedId=o.id;render();scheduleSave();}
  function updateSelected(patch,history=true){const o=selected();if(!o)return;if(history)pushHistory();Object.assign(o,patch);render();scheduleSave();}
  function deleteSelected(){if(!selected())return;pushHistory();state.objects=state.objects.filter(o=>o.id!==state.selectedId);state.selectedId=null;render();scheduleSave();}
  function render(){cover.querySelectorAll('.text-object').forEach(el=>el.remove());[...state.objects].sort((a,b)=>a.z-b.z).forEach(o=>{const el=document.createElement('div');el.className='text-object'+(o.id===state.selectedId?' selected':'');el.dataset.id=o.id;el.textContent=o.text;Object.assign(el.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',fontSize:o.fontSize+'px',fontFamily:o.fontFamily,color:o.color,fontWeight:o.bold?'800':'400',fontStyle:o.italic?'italic':'normal',textAlign:o.align,transform:`rotate(${o.rotation}deg)`,zIndex:String(o.z)});el.innerHTML += '<span class="handle br"></span><span class="handle rotate"></span>';cover.appendChild(el);});renderProperties();renderLayers();}
  function renderProperties(){const o=selected();$('noSelection').hidden=!!o;$('properties').hidden=!o;if(!o)return;$('textValue').value=o.text;$('fontFamily').value=o.fontFamily;$('fontSize').value=o.fontSize;$('fontColor').value=o.color;$('posX').value=Math.round(o.x);$('posY').value=Math.round(o.y);$('objW').value=Math.round(o.w);$('rotation').value=Math.round(o.rotation);$('boldBtn').classList.toggle('active',o.bold);$('italicBtn').classList.toggle('active',o.italic);document.querySelectorAll('[data-align]').forEach(b=>b.classList.toggle('active',b.dataset.align===o.align));}
  function renderLayers(){const box=$('layerList');box.innerHTML='';if(!state.objects.length){box.innerHTML='<div class="empty">추가된 개체가 없습니다.</div>';return;}[...state.objects].sort((a,b)=>b.z-a.z).forEach(o=>{const el=document.createElement('div');el.className='layer'+(o.id===state.selectedId?' active':'');el.innerHTML=`<span>${o.text.replace(/\n/g,' ')||'빈 텍스트'}</span>`;el.onclick=()=>{state.selectedId=o.id;render();};box.appendChild(el);});}
  cover.addEventListener('pointerdown',e=>{const objEl=e.target.closest('.text-object');if(!objEl){state.selectedId=null;render();return;}const id=objEl.dataset.id;state.selectedId=id;const o=selected();if(e.target.classList.contains('br')){pushHistory();resize={id,startX:e.clientX,startW:o.w};e.target.setPointerCapture(e.pointerId);}else if(e.target.classList.contains('rotate')){pushHistory();const r=objEl.getBoundingClientRect();rotate={id,cx:r.left+r.width/2,cy:r.top+r.height/2};e.target.setPointerCapture(e.pointerId);}else{pushHistory();drag={id,startX:e.clientX,startY:e.clientY,x:o.x,y:o.y};objEl.setPointerCapture(e.pointerId);}render();e.preventDefault();});
  document.addEventListener('pointermove',e=>{if(drag){const o=state.objects.find(x=>x.id===drag.id);o.x=drag.x+(e.clientX-drag.startX)/state.zoom;o.y=drag.y+(e.clientY-drag.startY)/state.zoom;render();}if(resize){const o=state.objects.find(x=>x.id===resize.id);o.w=Math.max(40,resize.startW+(e.clientX-resize.startX)/state.zoom);render();}if(rotate){const o=state.objects.find(x=>x.id===rotate.id);o.rotation=Math.round(Math.atan2(e.clientY-rotate.cy,e.clientX-rotate.cx)*180/Math.PI+90);render();}});
  document.addEventListener('pointerup',()=>{if(drag||resize||rotate)scheduleSave();drag=resize=rotate=null;});
  cover.addEventListener('dblclick',e=>{const el=e.target.closest('.text-object');if(!el)return;el.contentEditable='true';el.classList.add('editing');el.focus();const range=document.createRange();range.selectNodeContents(el);range.collapse(false);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);});
  cover.addEventListener('focusout',e=>{const el=e.target.closest('.text-object');if(!el||!el.isContentEditable)return;const o=state.objects.find(x=>x.id===el.dataset.id);o.text=[...el.childNodes].filter(n=>!(n.nodeType===1&&n.classList.contains('handle'))).map(n=>n.textContent).join('');el.contentEditable='false';el.classList.remove('editing');render();scheduleSave();},true);
  document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement?.isContentEditable)return;const o=selected();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate();return;}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();return;}if(o&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();pushHistory();const step=e.shiftKey?10:1;if(e.key==='ArrowLeft')o.x-=step;if(e.key==='ArrowRight')o.x+=step;if(e.key==='ArrowUp')o.y-=step;if(e.key==='ArrowDown')o.y+=step;render();scheduleSave();}});
  function undo(){if(!state.undo.length)return;state.redo.push(snapshot());restore(state.undo.pop());scheduleSave();}
  function redo(){if(!state.redo.length)return;state.undo.push(snapshot());restore(state.redo.pop());scheduleSave();}
  function duplicate(){const o=selected();if(!o)return;pushHistory();const n={...clone(o),id:uid(),x:o.x+18,y:o.y+18,z:Date.now()};state.objects.push(n);state.selectedId=n.id;render();scheduleSave();}
  function center(zone){const o=selected();if(!o)return;const ranges={front:[465,900],back:[0,435],spine:[435,465]};const [l,r]=ranges[zone];updateSelected({x:l+(r-l-o.w)/2,y:(620-o.fontSize*1.4)/2,rotation:zone==='spine'?90:o.rotation});}
  $('addTitle').onclick=()=>addText('표지 제목',{fontSize:42,w:300,x:532,y:230});$('addSubtitle').onclick=()=>addText('부제목을 입력하세요',{fontSize:22,w:280,x:542,y:310,bold:false});$('addSpine').onclick=()=>addText('책등 제목',{fontSize:16,w:220,x:340,y:300,rotation:90});
  $('undoBtn').onclick=undo;$('redoBtn').onclick=redo;$('duplicateBtn').onclick=duplicate;$('deleteBtn').onclick=deleteSelected;
  $('textValue').oninput=e=>updateSelected({text:e.target.value},false);$('fontFamily').onchange=e=>updateSelected({fontFamily:e.target.value});$('fontSize').onchange=e=>updateSelected({fontSize:+e.target.value});$('fontColor').oninput=e=>updateSelected({color:e.target.value},false);$('boldBtn').onclick=()=>updateSelected({bold:!selected().bold});$('italicBtn').onclick=()=>updateSelected({italic:!selected().italic});document.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>updateSelected({align:b.dataset.align}));
  [['posX','x'],['posY','y'],['objW','w'],['rotation','rotation']].forEach(([id,key])=>$(id).onchange=e=>updateSelected({[key]:+e.target.value}));
  $('bringFront').onclick=()=>updateSelected({z:Math.max(0,...state.objects.map(o=>o.z))+1});$('sendBack').onclick=()=>updateSelected({z:Math.min(...state.objects.map(o=>o.z))-1});
  $('centerFront').onclick=()=>center('front');$('centerBack').onclick=()=>center('back');$('centerSpine').onclick=()=>center('spine');
  function setZoom(v){state.zoom=Math.max(.5,Math.min(1.5,v));cover.style.transform=`scale(${state.zoom})`;$('zoomText').textContent=Math.round(state.zoom*100)+'%';$('zoomReset').textContent=Math.round(state.zoom*100)+'%';}
  $('zoomOut').onclick=()=>setZoom(state.zoom-.1);$('zoomIn').onclick=()=>setZoom(state.zoom+.1);$('zoomReset').onclick=()=>setZoom(1);
  $('saveBtn').onclick=()=>{localStorage.setItem('coverEditorPhase1',snapshot());$('saveStatus').textContent='수동 저장 완료';};$('loadBtn').onclick=()=>{const raw=localStorage.getItem('coverEditorPhase1');if(raw){pushHistory();restore(raw);$('saveStatus').textContent='저장 작업 불러옴';}};
  $('exportBtn').onclick=()=>{const blob=new Blob([snapshot()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cover-project.json';a.click();URL.revokeObjectURL(a.href);};
  $('importInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{pushHistory();restore(await f.text());scheduleSave();}catch{alert('올바른 프로젝트 파일이 아닙니다.');}e.target.value='';};
  $('resetBtn').onclick=()=>{if(!confirm('현재 작업을 초기화할까요?'))return;pushHistory();state.objects=[];state.selectedId=null;render();scheduleSave();};
  const saved=localStorage.getItem('coverEditorPhase1');if(saved){try{restore(saved);$('saveStatus').textContent='자동 저장 복원';}catch{render();}}else{addText('표지 제목',{fontSize:42,w:300,x:532,y:230});state.undo=[];}
})();
</script>
</body>
</html>
