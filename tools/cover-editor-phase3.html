ass="btn" id="sub">부제 추가</button><button class="btn" id="spinet">책등 제목 추가</button><label class="btn" style="display:block;text-align:center">이미지 추가<input id="img" type="file" accept="image/*" hidden></label></div><div class="box"><h3>보기</h3><label class="muted"><input id="safeOn" type="checkbox" checked> 안전영역</label><br><label class="muted"><input id="snap" type="checkbox" checked> 자석 맞춤</label></div><div class="box"><h3>작업</h3><div class="row"><button class="btn" id="undo">취소</button><button class="btn" id="redo">다시</button></div><button class="btn" id="dup">복제</button><button class="btn" id="del">삭제</button></div><div class="box"><h3>출력·검수</h3><button class="btn pri" id="check">출력 전 검수</button><button class="btn" id="png300">300DPI PNG 저장</button><button class="btn" id="pdfPrint">인쇄용 PDF 저장</button><div class="muted" id="report">검수를 실행하면 결과가 표시됩니다.</div></div><div class="box"><h3>프로젝트</h3><button class="btn" id="savep">저장</button><button class="btn" id="loadp">불러오기</button><button class="btn" id="exp">JSON 내보내기</button><label class="btn" style="display:block;text-align:center">JSON 불러오기<input id="imp" type="file" accept=".json" hidden></label></div></aside><section class="work"><div class="bar"><button id="zo">−</button><button id="zr">100%</button><button id="zi">＋</button><button data-center="back">뒤표지 중앙</button><button data-center="spine">책등 중앙</button><button data-center="front">앞표지 중앙</button></div><div class="stage"><div id="cover" class="cover"><div id="back" class="zone"></div><div id="spine" class="zone spine"></div><div id="front" class="zone"></div><div id="sb" class="safe"></div><div id="sf" class="safe"></div><div id="gv" class="guide v"></div><div id="gh" class="guide h"></div></div></div></section><aside class="p r"><div id="none" class="muted">개체를 선택하세요.</div><div id="props" hidden><div class="box" id="tp"><h3>텍스트</h3><div class="f"><textarea id="txt"></textarea></div><div class="f"><select id="font"><option>Pretendard</option><option>Noto Sans KR</option><option>Arial</option><option value="serif">명조</option></select></div><div class="row"><div class="f"><input id="fs" type="number"></div><div class="f"><input id="color" type="color"></div></div><div class="row"><button class="btn" id="bold">굵게</button><button class="btn" id="italic">기울임</button></div><div class="row"><button class="btn" data-align="left">왼쪽</button><button class="btn" data-align="center">가운데</button></div><button class="btn" data-align="right">오른쪽</button></div><div class="box" id="ip"><h3>이미지</h3><select id="fit"><option value="contain">전체 보이기</option><option value="cover">영역 채우기</option></select><input id="op" type="range" min="10" max="100"></div><div class="box"><h3>위치·크기</h3><div class="row"><input id="x" type="number"><input id="y" type="number"></div><div class="row"><input id="w" type="number"><input id="h" type="number"></div><input id="rot" type="number"></div><div class="box"><button class="btn" id="frontz">맨 앞으로</button><button class="btn" id="backz">맨 뒤로</button></div></div><div class="box"><h3>레이어</h3><div id="layers"></div></div></aside></div><script>(()=>{'use strict';const $=i=>document.getElementById(i),C=$('cover');const S={o:[],sel:null,u:[],r:[],z:1,set:{tw:210,th:297,b:3,s:5,p:100,pt:.1,a:0,snap:true,safe:true}};let D=null,R=null,T=null,timer=null;const cp=x=>JSON.parse(JSON.stringify(x)),uid=p=>p+Date.now()+Math.random().toString(36).slice(2),so=()=>S.o.find(x=>x.id===S.sel);function dm(){let q=S.set,sp=Math.max(0,q.p/2*q.pt+q.a),tot=q.tw*2+sp+q.b*2,k=Math.min(950/tot,610/(q.th+q.b*2));return{sp,tot,k,w:tot*k,h:(q.th+q.b*2)*k,b:q.b*k,t:q.tw*k,s:q.s*k,sw:sp*k}}function snap(){return JSON.stringify({o:S.o,sel:S.sel,set:S.set})}function hist(){S.u.push(snap());if(S.u.length>50)S.u.shift();S.r=[]}function later(){clearTimeout(timer);$('status').textContent='저장 중';timer=setTimeout(()=>{localStorage.coverV2=snap();$('status').textContent='저장됨'},400)}function geom(){let d=dm();C.style.width=d.w+'px';C.style.height=d.h+'px';let sl=d.b+d.t,fl=sl+d.sw;Object.assign($('back').style,{left:d.b+'px',width:d.t+'px'});Object.assign($('spine').style,{left:sl+'px',width:d.sw+'px'});Object.assign($('front').style,{left:fl+'px',width:d.t+'px'});for(let [id,l] of [['sb',d.b+d.s],['sf',fl+d.s]])Object.assign($(id).style,{left:l+'px',top:(d.b+d.s)+'px',width:(d.t-d.s*2)+'px',height:(d.h-(d.b+d.s)*2)+'px',display:S.set.safe?'block':'none'});$('calc').textContent=`책등 ${d.sp.toFixed(2)}mm · 전체 ${d.tot.toFixed(2)}×${(S.set.th+S.set.b*2).toFixed(2)}mm`}function objs(){C.querySelectorAll('.obj').forEach(e=>e.remove());S.o.slice().sort((a,b)=>a.z-b.z).forEach(o=>{let e=document.createElement('div');e.className='obj '+o.type+(o.id===S.sel?' sel':'');e.dataset.id=o.id;Object.assign(e.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px',transform:`rotate(${o.rot}deg)`,opacity:o.op,zIndex:o.z});if(o.type==='text'){e.textContent=o.text;Object.assign(e.style,{fontSize:o.fs+'px',fontFamily:o.font,color:o.color,fontWeight:o.bold?'800':'400',fontStyle:o.italic?'italic':'normal',textAlign:o.align})}else{e.style.backgroundImage=`url("${o.src}")`;e.style.backgroundSize=o.fit}e.innerHTML+='<i class="h br"></i><i class="h ro"></i>';C.appendChild(e)});props();layers()}function render(){geom();objs()}function addText(text,fs=36){hist();let d=dm(),o={id:uid('t'),type:'text',text,x:d.w-d.b-d.t*.8,y:d.h*.38,w:d.t*.65,h:55,fs,font:'Pretendard',color:'#12396d',bold:true,italic:false,align:'center',rot:0,op:1,z:Date.now()};S.o.push(o);S.sel=o.id;render();later()}function addImg(src,nw=0,nh=0){hist();let d=dm(),o={id:uid('i'),type:'image',src,x:d.w-d.b-d.t*.8,y:d.h*.2,w:d.t*.6,h:d.h*.4,fit:'contain',rot:0,op:1,nw,nh,z:Date.now()};S.o.push(o);S.sel=o.id;render();later()}function upd(p,h=true){let o=so();if(!o)return;if(h)hist();Object.assign(o,p);objs();later()}function props(){let o=so();$('none').hidden=!!o;$('props').hidden=!o;if(!o)return;$('tp').hidden=o.type!=='text';$('ip').hidden=o.type!=='image';if(o.type==='text'){$('txt').value=o.text;$('font').value=o.font;$('fs').value=o.fs;$('color').value=o.color}else{$('fit').value=o.fit;$('op').value=o.op*100}for(let [id,k] of [['x','x'],['y','y'],['w','w'],['h','h'],['rot','rot']])$(id).value=Math.round(o[k])}function layers(){let b=$('layers');b.innerHTML='';S.o.slice().sort((a,b)=>b.z-a.z).forEach(o=>{let e=document.createElement('div');e.className='layer'+(o.id===S.sel?' on':'');e.textContent=o.type==='text'?o.text:'이미지';e.onclick=()=>{S.sel=o.id;objs()};b.appendChild(e)})}function magnet(o){if(!S.set.snap)return;let d=dm(),cx=o.x+o.w/2,cy=o.y+o.h/2,xs=[d.b+d.t/2,d.b+d.t+d.sw/2,d.b+d.t+d.sw+d.t/2],tol=7;for(let x of xs)if(Math.abs(cx-x)<tol){o.x=x-o.w/2;$('gv').style.display='block';$('gv').style.left=x+'px';break}if(Math.abs(cy-d.h/2)<tol){o.y=d.h/2-o.h/2;$('gh').style.display='block';$('gh').style.top=d.h/2+'px'}}C.onpointerdown=e=>{let el=e.target.closest('.obj');if(!el){S.sel=null;objs();return}S.sel=el.dataset.id;let o=so();hist();if(e.target.classList.contains('br'))R={id:o.id,x:e.clientX,y:e.clientY,w:o.w,h:o.h};else if(e.target.classList.contains('ro')){let r=el.getBoundingClientRect();T={id:o.id,x:r.left+r.width/2,y:r.top+r.height/2}}else D={id:o.id,x:e.clientX,y:e.clientY,ox:o.x,oy:o.y};objs();e.preventDefault()}document.onpointermove=e=>{if(D){let o=S.o.find(x=>x.id===D.id);o.x=D.ox+(e.clientX-D.x)/S.z;o.y=D.oy+(e.clientY-D.y)/S.z;magnet(o);objs()}if(R){let o=S.o.find(x=>x.id===R.id);o.w=Math.max(25,R.w+(e.clientX-R.x)/S.z);o.h=Math.max(22,R.h+(e.clientY-R.y)/S.z);objs()}if(T){let o=S.o.find(x=>x.id===T.id);o.rot=Math.round(Math.atan2(e.clientY-T.y,e.clientX-T.x)*180/Math.PI+90);objs()}}document.onpointerup=()=>{if(D||R||T)later();D=R=T=null;$('gv').style.display=$('gh').style.display='none'}function apply(){hist();S.set={...S.set,tw:+$('tw').value,th:+$('th').value,b:+$('bleed').value,s:+$('safe').value,p:+$('pages').value,pt:+$('paper').value,a:+$('adj').value};render();later()}for(let id of ['tw','th','bleed','s
