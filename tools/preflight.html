<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>인쇄 사전 검수기 · Program Tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6f8;
      --primary: #12396d;
      --accent: #1d9bb2;
      --pass: #16a34a;
      --warn: #d97706;
      --fail: #dc2626;
      --nav-h: 52px;
    }
    body {
      font-family: Pretendard, "Noto Sans KR", sans-serif;
      background: var(--bg); color: #0f172a;
      min-height: 100vh;
      padding-top: var(--nav-h);
    }

    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      height: var(--nav-h); background: var(--primary);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 700;
      text-decoration: none; padding: 7px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.15s; white-space: nowrap;
    }
    .nav-back:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .nav-title { flex: 1; text-align: center; font-size: 15px; font-weight: 800; color: #fff; }
    .nav-user { display: flex; align-items: center; gap: 8px; }
    .nav-user-name {
      font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 600;
      max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nav-logout {
      color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,0.12); border: none; border-radius: 7px;
      padding: 6px 10px; cursor: pointer; font-family: inherit; transition: background 0.15s;
    }
    .nav-logout:hover { background: rgba(255,255,255,0.22); color: #fff; }

    .container {
      max-width: 920px; margin: 0 auto; padding: 28px 20px 60px;
    }
    .page-head { margin-bottom: 22px; }
    .page-head h1 {
      font-size: 24px; font-weight: 900; color: #0f172a;
      letter-spacing: -0.5px;
    }
    .page-head p { font-size: 13px; color: #64748b; margin-top: 4px; }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 16px; background: #fff;
      padding: 40px 24px; text-align: center;
      cursor: pointer; transition: all 0.2s;
      margin-bottom: 16px;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent); background: rgba(29,155,178,0.04);
    }
    .upload-zone.has-file { border-style: solid; border-color: var(--accent); background: rgba(29,155,178,0.06); }
    .upload-icon { font-size: 40px; margin-bottom: 12px; }
    .upload-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
    .upload-sub { font-size: 13px; color: #64748b; }
    .upload-filename { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 8px; }
    #fileInput { display: none; }

    .options-row {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 12px; padding: 14px 18px;
      margin-bottom: 20px;
    }
    .opt-label { font-size: 13px; font-weight: 700; }
    .toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .toggle { position: relative; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; inset: 0; background: #cbd5e1;
      border-radius: 20px; transition: 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 14px; height: 14px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }
    .toggle-text { font-size: 12px; color: #64748b; }

    .run-btn {
      margin-left: auto;
      background: #12396d; color: #fff;
      border: none; border-radius: 10px;
      padding: 10px 22px; font-size: 14px; font-weight: 800;
      cursor: pointer; font-family: inherit;
      transition: background 0.15s;
      display: flex; align-items: center; gap: 8px;
    }
    .run-btn:hover { background: #0f2f5c; }
    .run-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: none; }
    .results-header {
      display: flex; align-items: center; gap: 16px;
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 14px; padding: 18px 22px; margin-bottom: 16px;
    }
    .score-ring {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 22px; font-weight: 900;
    }
    .score-ring.green { background: #dcfce7; color: var(--pass); }
    .score-ring.yellow { background: #fef9c3; color: var(--warn); }
    .score-ring.red { background: #fee2e2; color: var(--fail); }
    .results-meta { flex: 1; }
    .results-filename { font-size: 16px; font-weight: 800; }
    .results-pages { font-size: 13px; color: #64748b; margin-top: 4px; }
    .results-summary { font-size: 13px; color: #64748b; margin-top: 6px; }

    .checks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .check-card {
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 12px; padding: 16px 18px;
      display: flex; gap: 12px;
    }
    .check-badge {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-top: 1px;
    }
    .check-badge.pass { background: #dcfce7; }
    .check-badge.warning { background: #fef9c3; }
    .check-badge.fail { background: #fee2e2; }
    .check-label { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
    .check-detail { font-size: 12px; color: #64748b; line-height: 1.5; }
    .check-pages { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .page-tag {
      background: #f1f5f9; color: #64748b;
      font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 5px;
    }

    .ai-section {
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 14px; padding: 20px 22px; margin-bottom: 20px;
    }
    .ai-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 800; margin-bottom: 14px;
    }
    .ai-badge {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; font-size: 10px; font-weight: 800;
      padding: 2px 7px; border-radius: 6px; letter-spacing: 0.3px;
    }
    .ai-content {
      font-size: 13px; color: #0f172a; line-height: 1.7;
      white-space: pre-wrap;
    }

    .error-box {
      background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
      border-radius: 10px; padding: 12px 16px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .error-box.show { display: block; }
  </style>
</head>
<body>
  <div class="top-nav">
    <a class="nav-back" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      도구 목록
    </a>
    <div class="nav-title">🔍 인쇄 사전 검수기</div>
    <div class="nav-user">
      <span class="nav-user-name" id="userName">로딩 중...</span>
      <button class="nav-logout" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <div class="page-head">
      <h1>Pre-flight Checker</h1>
      <p>인쇄 전 PDF의 해상도·도련·폰트·색상 모드를 자동 검수하고, AI 시각 분석으로 인쇄 품질을 점검합니다.</p>
    </div>

    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📂</div>
      <div class="upload-title">PDF 파일을 드래그하거나 클릭하여 업로드</div>
      <div class="upload-sub">최대 200 MB · PDF만 지원</div>
      <div class="upload-filename" id="uploadFilename" style="display:none;"></div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,application/pdf" />

    <div class="options-row">
      <span class="opt-label">검수 옵션</span>
      <label class="toggle-wrap">
        <label class="toggle">
          <input type="checkbox" id="useAiToggle" />
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-text">AI 시각 분석 포함 <span style="color:#6366f1;font-weight:700;">GPT-4.1</span></span>
      </label>
      <button class="run-btn" id="runBtn" onclick="runCheck()" disabled>검수 시작</button>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div id="results">
      <div class="results-header">
        <div class="score-ring" id="scoreRing">–</div>
        <div class="results-meta">
          <div class="results-filename" id="resFilename"></div>
          <div class="results-pages" id="resPages"></div>
          <div class="results-summary" id="resSummary"></div>
        </div>
      </div>
      <div class="checks-grid" id="checksGrid"></div>
      <div class="ai-section" id="aiSection" style="display:none;">
        <div class="ai-title">
          <span>AI 시각 분석 결과</span>
          <span class="ai-badge">GPT-4.1</span>
        </div>
        <div class="ai-content" id="aiContent"></div>
      </div>
    </div>
  </div>

  <script src="../js/sw-register.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    let selectedFile = null;

    function denyPreflightAccess(msg) {
      document.body.replaceChildren();
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;text-align:center;padding:24px;font-family:sans-serif;';
      wrap.innerHTML = '<div style="font-size:52px;">🔒</div>'
        + '<div style="font-size:20px;font-weight:900;color:#0f172a;">접근 권한이 없습니다</div>'
        + '<div class="msg" style="font-size:14px;color:#64748b;max-width:320px;line-height:1.6;"></div>'
        + '<a href="../index.html" style="margin-top:8px;padding:10px 24px;background:#12396d;color:#fff;border-radius:10px;text-decoration:none;font-weight:800;font-size:14px;">← 홈으로</a>';
      wrap.querySelector('.msg').textContent = msg;
      document.body.appendChild(wrap);
    }

    auth.onAuthStateChanged(async user => {
      if (!user) { window.location.href = '../login.html'; return; }
      const name = user.displayName || (user.email || '').split('@')[0];
      document.getElementById('userName').textContent = name;

      try {
        const userEmail = String(user.email || '').trim().toLowerCase();
        const [adminDoc, programsDoc, permDoc] = await Promise.all([
          db.collection('settings').doc('admin').get(),
          db.collection('settings').doc('programs').get(),
          db.collection('user_permissions').doc(user.uid).get(),
        ]);
        const adminEmails = (adminDoc.exists ? (adminDoc.data().emails || []) : [])
          .map(e => String(e).trim().toLowerCase());
        const isAdmin = adminEmails.includes(userEmail);
        const isPublic = !!(programsDoc.exists && programsDoc.data().public?.['preflight']);
        const isApproved = permDoc.exists && permDoc.data().programs?.['preflight'] === true;

        if (!isAdmin && !isPublic && !isApproved) {
          denyPreflightAccess('인쇄 검수기는 관리자 승인 후 사용할 수 있습니다.');
          return;
        }
      } catch(e) {
        console.error('Permission check failed', e);
        denyPreflightAccess('권한 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        return;
      }
    });

    async function doLogout() {
      await auth.signOut();
      window.location.href = '../index.html';
    }

    document.getElementById('fileInput').addEventListener('change', e => {
      const f = e.target.files[0]; if (f) selectFile(f);
    });
    const zone = document.getElementById('uploadZone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('dragover');
      const f = e.dataTransfer.files[0]; if (f) selectFile(f);
    });

    function selectFile(f) {
      if (!f.name.toLowerCase().endsWith('.pdf')) { showError('PDF 파일만 업로드 가능합니다.'); return; }
      selectedFile = f;
      zone.classList.add('has-file');
      const fn = document.getElementById('uploadFilename');
      fn.textContent = `${f.name} (${(f.size / 1024 / 1024).toFixed(1)} MB)`;
      fn.style.display = 'block';
      document.getElementById('runBtn').disabled = false;
      hideError();
      document.getElementById('results').style.display = 'none';
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg; box.classList.add('show');
    }
    function hideError() { document.getElementById('errorBox').classList.remove('show'); }

    function setRunning(running) {
      const btn = document.getElementById('runBtn');
      btn.disabled = running;
      btn.innerHTML = running ? '<span class="spinner"></span> 검수 중...' : '검수 시작';
    }

    async function runCheck() {
      if (!selectedFile) return;
      hideError(); setRunning(true);
      document.getElementById('results').style.display = 'none';
      try {
        const useAi = document.getElementById('useAiToggle').checked;
        const report = await apiPreflightCheck(selectedFile, useAi);
        renderResults(report);
      } catch (e) {
        showError(e.message || '검수 중 오류가 발생했습니다.');
      } finally {
        setRunning(false);
      }
    }

    function renderResults(report) {
      const failCount = report.checks.filter(c => c.severity === 'fail').length;
      const warnCount = report.checks.filter(c => c.severity === 'warning').length;
      const passCount = report.checks.filter(c => c.severity === 'pass').length;

      const ring = document.getElementById('scoreRing');
      ring.textContent = report.score;
      ring.className = 'score-ring ' + (report.score >= 80 ? 'green' : report.score >= 50 ? 'yellow' : 'red');

      document.getElementById('resFilename').textContent = report.filename;
      document.getElementById('resPages').textContent = `총 ${report.page_count}페이지`;
      document.getElementById('resSummary').textContent = `통과 ${passCount}개 · 경고 ${warnCount}개 · 불량 ${failCount}개`;

      const grid = document.getElementById('checksGrid');
      grid.innerHTML = '';
      for (const c of report.checks) {
        const icon = c.severity === 'pass' ? '✅' : c.severity === 'warning' ? '⚠️' : '❌';
        const badgeClass = c.severity === 'pass' ? 'pass' : c.severity === 'warning' ? 'warning' : 'fail';
        const pageTagsHtml = c.page_refs?.length
          ? `<div class="check-pages">${c.page_refs.slice(0, 8).map(p => `<span class="page-tag">${p}p</span>`).join('')}${c.page_refs.length > 8 ? `<span class="page-tag">+${c.page_refs.length - 8}</span>` : ''}</div>`
          : '';
        grid.insertAdjacentHTML('beforeend', `
          <div class="check-card">
            <div class="check-badge ${badgeClass}">${icon}</div>
            <div>
              <div class="check-label">${c.label}</div>
              <div class="check-detail">${c.detail}</div>
              ${pageTagsHtml}
            </div>
          </div>
        `);
      }

      const aiSection = document.getElementById('aiSection');
      if (report.ai_feedback) {
        document.getElementById('aiContent').textContent = report.ai_feedback;
        aiSection.style.display = 'block';
      } else {
        aiSection.style.display = 'none';
      }
      document.getElementById('results').style.display = 'block';
    }
  </script>
</body>
</html>
