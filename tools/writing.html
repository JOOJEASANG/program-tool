<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 글쓰기 어시스턴트 · Program Tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f4f6f8;--primary:#12396d;--accent:#1d9bb2;--nav-h:52px;--sidebar-w:320px}
    body{font-family:Pretendard,"Noto Sans KR",sans-serif;background:var(--bg);color:#0f172a;min-height:100vh;padding-top:var(--nav-h)}

    /* ── Nav ── */
    .top-nav{position:fixed;top:0;left:0;right:0;z-index:500;height:var(--nav-h);background:var(--primary);display:flex;align-items:center;padding:0 16px;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
    .nav-back{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);font-size:13px;font-weight:700;text-decoration:none;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
    .nav-back:hover{background:rgba(255,255,255,.15);color:#fff}
    .nav-title{flex:1;text-align:center;font-size:15px;font-weight:800;color:#fff}
    .nav-user{display:flex;align-items:center;gap:8px}
    .nav-user-name{font-size:12px;color:rgba(255,255,255,.75);font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav-logout{color:rgba(255,255,255,.75);font-size:12px;font-weight:700;background:rgba(255,255,255,.12);border:none;border-radius:7px;padding:6px 10px;cursor:pointer;font-family:inherit}
    .nav-logout:hover{background:rgba(255,255,255,.22);color:#fff}

    /* ── Layout ── */
    .workspace{display:flex;height:calc(100vh - var(--nav-h));overflow:hidden}

    /* ── Sidebar ── */
    .sidebar{width:var(--sidebar-w);flex-shrink:0;background:#fff;border-right:1px solid #e2e8f0;overflow-y:auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:18px}
    .sidebar-section{display:flex;flex-direction:column;gap:8px}
    .section-label{font-size:12px;font-weight:800;color:#64748b;letter-spacing:.3px;text-transform:uppercase}

    /* Content type buttons */
    .type-grid{display:flex;flex-direction:column;gap:6px}
    .type-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:13px;font-weight:700;color:#334155;cursor:pointer;font-family:inherit;transition:all .15s;text-align:left}
    .type-btn:hover{border-color:var(--accent);background:rgba(29,155,178,.06);color:#0f172a}
    .type-btn.active{border-color:var(--primary);background:rgba(18,57,109,.07);color:var(--primary)}
    .type-btn .btn-icon{font-size:16px;flex-shrink:0}

    /* Tone buttons */
    .tone-row{display:flex;flex-wrap:wrap;gap:6px}
    .tone-btn{padding:6px 12px;border:2px solid #e2e8f0;border-radius:20px;background:#f8fafc;font-size:12px;font-weight:700;color:#334155;cursor:pointer;font-family:inherit;transition:all .15s}
    .tone-btn:hover{border-color:var(--accent);background:rgba(29,155,178,.06);color:#0f172a}
    .tone-btn.active{border-color:var(--primary);background:var(--primary);color:#fff}

    /* Length buttons */
    .length-row{display:flex;gap:6px}
    .length-btn{flex:1;padding:7px 4px;border:2px solid #e2e8f0;border-radius:8px;background:#f8fafc;font-size:12px;font-weight:700;color:#334155;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
    .length-btn:hover{border-color:var(--accent);background:rgba(29,155,178,.06)}
    .length-btn.active{border-color:var(--primary);background:var(--primary);color:#fff}

    /* Textareas */
    .ctrl-textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;color:#0f172a;background:#f8fafc;resize:vertical;min-height:80px;line-height:1.6;transition:border-color .15s}
    .ctrl-textarea:focus{outline:none;border-color:var(--accent);background:#fff}
    .ctrl-textarea::placeholder{color:#94a3b8}
    .ctrl-textarea.topic{min-height:80px}
    .ctrl-textarea.context-ta{min-height:64px}

    /* Action buttons */
    .generate-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
    .generate-btn:hover:not(:disabled){background:#0f2f5c}
    .generate-btn:disabled{opacity:.55;cursor:not-allowed}
    .reset-btn{width:100%;padding:9px;border:1.5px solid #e2e8f0;border-radius:10px;background:#f8fafc;color:#64748b;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
    .reset-btn:hover{background:#e2e8f0;color:#334155}

    /* ── Main area ── */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:20px 24px 24px}
    .main-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0}
    .main-title{font-size:18px;font-weight:900;letter-spacing:-.3px}
    .header-actions{display:flex;align-items:center;gap:8px}
    .copy-btn,.dl-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid #e2e8f0;background:#fff;color:#334155;transition:all .15s}
    .copy-btn:hover,.dl-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(29,155,178,.05)}
    .copy-btn:disabled,.dl-btn:disabled{opacity:.4;cursor:not-allowed}

    .output-wrapper{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
    .output-area{flex:1;width:100%;border:2px solid #e2e8f0;border-radius:14px;padding:18px;font-size:14px;font-family:inherit;line-height:1.8;color:#0f172a;background:#fff;resize:none;min-height:0;transition:border-color .2s}
    .output-area:focus{outline:none;border-color:var(--accent)}
    .output-area.has-content{border-color:#cbd5e1}
    .output-area::placeholder{color:#94a3b8;font-size:14px}

    /* Loading overlay */
    .loading-overlay{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10}
    .loading-overlay.visible{display:flex}
    .loading-dots{display:flex;gap:8px}
    .loading-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:bounce .9s ease-in-out infinite}
    .loading-dot:nth-child(2){animation-delay:.18s}
    .loading-dot:nth-child(3){animation-delay:.36s}
    @keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:.5}40%{transform:scale(1);opacity:1}}
    .loading-text{font-size:14px;font-weight:700;color:#334155}

    .output-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-shrink:0}
    .char-count{font-size:12px;color:#94a3b8;font-weight:600}
    .dl-btn{padding:7px 14px}

    /* Error box */
    .error-box{display:none;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:10px;padding:12px 16px;font-size:13px;margin-top:10px;flex-shrink:0}
    .error-box.show{display:block}

    /* Spinner inline */
    .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Responsive */
    @media(max-width:768px){
      .workspace{flex-direction:column;overflow:auto;height:auto}
      .sidebar{width:100%;border-right:none;border-bottom:1px solid #e2e8f0;overflow:visible}
      .main{padding:16px;min-height:60vh}
      .nav-user-name{display:none}
      .output-area{min-height:300px}
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <a class="nav-back" href="../index.html">← 도구 목록</a>
    <div class="nav-title">✍️ AI 글쓰기 어시스턴트</div>
    <div class="nav-user">
      <span class="nav-user-name" id="userName">로딩 중...</span>
      <button class="nav-logout" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="workspace">
    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <!-- Content type -->
      <div class="sidebar-section">
        <div class="section-label">글 유형</div>
        <div class="type-grid" id="typeGrid">
          <button class="type-btn active" data-type="이메일/비즈니스레터" onclick="selectType(this)"><span class="btn-icon">📧</span>이메일 / 비즈니스레터</button>
          <button class="type-btn" data-type="SNS 캡션" onclick="selectType(this)"><span class="btn-icon">📱</span>SNS 캡션 (인스타그램/블로그)</button>
          <button class="type-btn" data-type="마케팅 카피" onclick="selectType(this)"><span class="btn-icon">📣</span>마케팅 카피</button>
          <button class="type-btn" data-type="상품 설명" onclick="selectType(this)"><span class="btn-icon">📄</span>상품 설명</button>
          <button class="type-btn" data-type="보고서/기획서 요약" onclick="selectType(this)"><span class="btn-icon">📝</span>보고서 / 기획서 요약</button>
          <button class="type-btn" data-type="자기소개서" onclick="selectType(this)"><span class="btn-icon">✉️</span>자기소개서</button>
        </div>
      </div>

      <!-- Tone -->
      <div class="sidebar-section">
        <div class="section-label">문체 / 톤</div>
        <div class="tone-row" id="toneRow">
          <button class="tone-btn active" data-tone="전문적" onclick="selectTone(this)">전문적</button>
          <button class="tone-btn" data-tone="친근한" onclick="selectTone(this)">친근한</button>
          <button class="tone-btn" data-tone="격식체" onclick="selectTone(this)">격식체</button>
          <button class="tone-btn" data-tone="간결한" onclick="selectTone(this)">간결한</button>
          <button class="tone-btn" data-tone="감성적" onclick="selectTone(this)">감성적</button>
        </div>
      </div>

      <!-- Length -->
      <div class="sidebar-section">
        <div class="section-label">길이</div>
        <div class="length-row" id="lengthRow">
          <button class="length-btn active" data-length="short" onclick="selectLength(this)">짧게<br><span style="font-size:10px;opacity:.7">~200자</span></button>
          <button class="length-btn" data-length="medium" onclick="selectLength(this)">보통<br><span style="font-size:10px;opacity:.7">400~600자</span></button>
          <button class="length-btn" data-length="long" onclick="selectLength(this)">길게<br><span style="font-size:10px;opacity:.7">800자+</span></button>
        </div>
      </div>

      <!-- Topic -->
      <div class="sidebar-section">
        <div class="section-label">주제 / 키워드 <span style="color:#dc2626">*</span></div>
        <textarea class="ctrl-textarea topic" id="topicInput" placeholder="주제, 키워드, 핵심 내용을 입력하세요..."></textarea>
      </div>

      <!-- Context -->
      <div class="sidebar-section">
        <div class="section-label">추가 정보 <span style="font-size:10px;font-weight:400;color:#94a3b8">(선택)</span></div>
        <textarea class="ctrl-textarea context-ta" id="contextInput" placeholder="대상 독자, 회사명, 특이사항 등"></textarea>
      </div>

      <!-- Actions -->
      <div class="sidebar-section">
        <button class="generate-btn" id="generateBtn" onclick="generateText()">✍️ 글 생성하기</button>
        <button class="reset-btn" onclick="resetAll()">초기화</button>
      </div>
    </aside>

    <!-- ── Main ── -->
    <main class="main">
      <div class="main-header">
        <div class="main-title">생성된 글</div>
        <div class="header-actions">
          <button class="copy-btn" id="copyBtn" onclick="copyText()" disabled>📋 복사</button>
        </div>
      </div>

      <div class="output-wrapper">
        <textarea class="output-area" id="outputArea" readonly placeholder="여기에 AI가 작성한 글이 표시됩니다."></textarea>
        <div class="loading-overlay" id="loadingOverlay">
          <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
          </div>
          <div class="loading-text">AI가 글을 작성하고 있습니다...</div>
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>

      <div class="output-footer">
        <span class="char-count" id="charCount">0자</span>
        <button class="dl-btn" id="dlBtn" onclick="downloadTxt()" disabled>📄 TXT 다운로드</button>
      </div>
    </main>
  </div>

  <script src="../js/sw-register.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // ── State ──
    let selectedType = '이메일/비즈니스레터';
    let selectedTone = '전문적';
    let selectedLength = 'short';
    let isGenerating = false;

    // ── Auth ──
    function denyAccess(msg) {
      document.body.replaceChildren();
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;text-align:center;padding:24px;font-family:sans-serif;';
      wrap.innerHTML = '<div style="font-size:52px;">🔒</div><div style="font-size:20px;font-weight:900;color:#0f172a;">접근 권한이 없습니다</div><div class="msg" style="font-size:14px;color:#64748b;max-width:320px;line-height:1.6;"></div><a href="../index.html" style="margin-top:8px;padding:10px 24px;background:#12396d;color:#fff;border-radius:10px;text-decoration:none;font-weight:800;font-size:14px;">← 홈으로</a>';
      wrap.querySelector('.msg').textContent = msg;
      document.body.appendChild(wrap);
    }

    auth.onAuthStateChanged(async user => {
      if (!user) { window.location.href = '../login.html'; return; }
      const name = user.displayName || (user.email || '').split('@')[0];
      document.getElementById('userName').textContent = name;
      try {
        const userEmail = String(user.email || '').trim().toLowerCase();
        const [adminDoc, programsDoc, permDoc] = await Promise.all([
          db.collection('settings').doc('admin').get(),
          db.collection('settings').doc('programs').get(),
          db.collection('user_permissions').doc(user.uid).get()
        ]);
        const adminEmails = (adminDoc.exists ? (adminDoc.data().emails || []) : []).map(e => String(e).trim().toLowerCase());
        const isAdmin = adminEmails.includes(userEmail) || !adminDoc.exists;
        const isPublic = !!(programsDoc.exists && programsDoc.data().public?.['writing']);
        const isApproved = permDoc.exists && permDoc.data().programs?.['writing'] === true;
        if (!isAdmin && !isPublic && !isApproved) denyAccess('AI 글쓰기 어시스턴트는 관리자 승인 후 사용할 수 있습니다.');
      } catch (e) {
        console.error('Permission check failed', e);
        denyAccess('권한 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
      }
    });

    async function doLogout() { await auth.signOut(); window.location.href = '../index.html'; }

    // ── Selection helpers ──
    function selectType(btn) {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedType = btn.dataset.type;
    }
    function selectTone(btn) {
      document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedTone = btn.dataset.tone;
    }
    function selectLength(btn) {
      document.querySelectorAll('.length-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedLength = btn.dataset.length;
    }

    // ── Generate ──
    async function generateText() {
      if (isGenerating) return;
      const topic = document.getElementById('topicInput').value.trim();
      if (!topic) { showError('주제/키워드를 입력해주세요.'); document.getElementById('topicInput').focus(); return; }

      hideError();
      setGenerating(true);

      const payload = {
        content_type: selectedType,
        tone: selectedTone,
        length: selectedLength,
        topic: topic,
        context: document.getElementById('contextInput').value.trim()
      };

      try {
        const user = auth.currentUser;
        if (!user) { showError('로그인이 필요합니다.'); return; }
        const token = await user.getIdToken();

        const res = await fetch('/api/writing/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          let errMsg = '생성 중 오류가 발생했습니다.';
          try { const j = await res.json(); errMsg = j.detail || errMsg; } catch (_) {}
          showError(errMsg);
          return;
        }

        const data = await res.json();
        const result = data.result || '';
        setOutput(result);
      } catch (e) {
        showError(e.message || '네트워크 오류가 발생했습니다.');
      } finally {
        setGenerating(false);
      }
    }

    function setGenerating(on) {
      isGenerating = on;
      const btn = document.getElementById('generateBtn');
      btn.disabled = on;
      btn.innerHTML = on ? '<span class="spinner"></span> 생성 중...' : '✍️ 글 생성하기';
      document.getElementById('loadingOverlay').classList.toggle('visible', on);
    }

    function setOutput(text) {
      const area = document.getElementById('outputArea');
      area.value = text;
      area.classList.toggle('has-content', text.length > 0);
      updateCharCount(text.length);
      const hasText = text.length > 0;
      document.getElementById('copyBtn').disabled = !hasText;
      document.getElementById('dlBtn').disabled = !hasText;
    }

    function updateCharCount(n) {
      document.getElementById('charCount').textContent = n.toLocaleString() + '자';
    }

    // ── Copy ──
    async function copyText() {
      const text = document.getElementById('outputArea').value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById('copyBtn');
        const orig = btn.innerHTML;
        btn.innerHTML = '✅ 복사됨';
        setTimeout(() => { btn.innerHTML = orig; }, 1800);
      } catch (_) {
        showError('클립보드 복사에 실패했습니다.');
      }
    }

    // ── Download ──
    function downloadTxt() {
      const text = document.getElementById('outputArea').value;
      if (!text) return;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const ts = new Date().toISOString().slice(0, 10);
      a.download = `writing_${ts}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // ── Reset ──
    function resetAll() {
      document.getElementById('topicInput').value = '';
      document.getElementById('contextInput').value = '';
      setOutput('');
      hideError();
      // Reset type to first
      document.querySelectorAll('.type-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
      selectedType = '이메일/비즈니스레터';
      // Reset tone to first
      document.querySelectorAll('.tone-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
      selectedTone = '전문적';
      // Reset length to first
      document.querySelectorAll('.length-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
      selectedLength = 'short';
    }

    // ── Error ──
    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.add('show');
    }
    function hideError() {
      document.getElementById('errorBox').classList.remove('show');
    }

    // Live char count as user edits output (readonly but just in case)
    document.getElementById('outputArea').addEventListener('input', e => updateCharCount(e.target.value.length));
  </script>
</body>
</html>
