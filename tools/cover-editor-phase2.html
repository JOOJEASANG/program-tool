<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>표지 편집기 2단계</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4f8;color:#0f172a}button,input,select,textarea{font:inherit}.nav{height:52px;background:#12396d;color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px}.nav a{color:#fff}.nav b{flex:1;text-align:center}.app{height:calc(100vh - 52px);display:grid;grid-template-columns:260px 1fr 290px}.p{background:#fff;padding:12px;overflow:auto}.l{border-right:1px solid #dbe5ee}.r{border-left:1px solid #dbe5ee}.box{border:1px solid #dbe5ee;border-radius:10px;padding:10px;margin-bottom:10px}.box h3{font-size:12px;margin:0 0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.f{margin-bottom:7px}.f label{display:block;font-size:10px;font-weight:700;margin-bottom:3px}.f input,.f select,.f textarea{width:100%;padding:7px;border:1px solid #dbe5ee;border-radius:7px}.btn{width:100%;padding:8px;border:0;border-radius:7px;background:#edf2f7;margin-bottom:5px;font-weight:700;cursor:pointer}.pri{background:#12396d;color:#fff}.work{display:flex;flex-direction:column;min-width:0}.bar{height:44px;background:#fff;border-bottom:1px solid #dbe5ee;padding:6px;display:flex;gap:5px}.bar button{border:1px solid #dbe5ee;background:#fff;border-radius:6px;padding:5px 8px}.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:30px;background:repeating-conic-gradient(#e6edf3 0 25%,#f4f7f9 0 50%) 50%/20px 20px}.cover{position:relative;background:#fff;box-shadow:0 12px 35px #0003;transform-origin:center;overflow:hidden}.zone,.safe,.guide{position:absolute;pointer-events:none}.zone{top:0;bottom:0;border-right:1px dashed #12396d88}.spine{background:#1d9bb211}.safe{border:1px dashed #f59e0b}.guide{display:none;background:#f43f5e;z-index:999}.guide.v{top:0;bottom:0;width:1px}.guide.h{left:0;right:0;height:1px}.obj{position:absolute;border:1px solid transparent;cursor:move;transform-origin:center}.obj.text{padding:4px;white-space:pre-wrap}.obj.image{background-repeat:no-repeat;background-position:center}.obj.sel{border-color:#0ea5e9;box-shadow:0 0 0 2px #0ea5e933}.h{position:absolute;width:10px;height:10px;background:#fff;border:2px solid #0ea5e9;border-radius:50%;display:none}.sel .h{display:block}.h.br{right:-6px;bottom:-6px}.h.ro{left:50%;top:-20px}.layer{border:1px solid #dbe5ee;padding:7px;border-radius:7px;margin-bottom:5px;font-size:11px}.layer.on{background:#e0f2fe}.muted{font-size:10px;color:#64748b}@media(max-width:1000px){.app{grid-template-columns:1fr;height:auto}.work{min-height:720px}}</style></head><body><div class="nav"><a href="perfect-binding-cover.html">← 기존 제작기</a><b>무선제본 표지 편집기 · 2단계</b><span id="status">준비</span></div><div class="app"><aside class="p l"><div class="box"><h3>표지 규격</h3><div class="f"><label>규격</label><select id="preset"><option value="210,297">A4</option><option value="182,257">B5(JIS)</option><option value="148,210">A5</option></select></div><div class="row"><div class="f"><label>가로 mm</label><input id="tw" type="number" value="210"></div><div class="f"><label>세로 mm</label><input id="th" type="number" value="297"></div></div><div class="row"><div class="f"><label>재단 mm</label><input id="bleed" type="number" value="3"></div><div class="f"><label>안전 mm</label><input id="safe" type="number" value="5"></div></div></div><div class="box"><h3>책등 계산</h3><div class="row"><div class="f"><label>페이지</label><input id="pages" type="number" value="100"></div><div class="f"><label>두께/장 mm</label><input id="paper" type="number" step=".005" value=".1"></div></div><div class="f"><label>보정 mm</label><input id="adj" type="number" step=".1" value="0"></div><div class="muted" id="calc"></div></div><div class="box"><h3>요소 추가</h3><button class="btn pri" id="title">제목 추가</button><button class="btn" id="sub">부제 추가</button><button class="btn" id="spinet">책등 제목 추가</button><label class="btn" style="display:block;text-align:center">이미지 추가<input id="img" type="file" accept="image/*" hidden></label></div><div class="box"><h3>보기</h3><label class="muted"><input id="safeOn" type="checkbox" checked> 안전영역</label><br><label class="muted"><input id="snap" type="checkbox" checked> 자석 맞춤</label></div><div class="box"><h3>작업</h3><div class="row"><button class="btn" id="undo">취소</button><button class="btn" id="redo">다시</button></div><button class="btn" id="dup">복제</button><button class="btn" id="del">삭제</button></div><div class="box"><h3>프로젝트</h3><button class="btn" id="savep">저장</button><button class="btn" id="loadp">불러오기</button><button class="btn" id="exp">JSON 내보내기</button><label class="btn" style="display:block;text-align:center">JSON 불러오기<input id="imp" type="file" accept=".json" hidden></label></div></aside><section class="work"><div class="bar"><button id="zo">−</button><button id="zr">100%</button><button id="zi">＋</button><button data-center="back">뒤표지 중앙</button><button data-center="spine">책등 중앙</button><button data-center="front">앞표지 중앙</button></div><div class="stage"><div id="cover" class="cover"><div id="back" class="zone"></div><div id="spine" class="zone spine"></div><div id="front" class="zone"></div><div id="sb" class="safe"></div><div id="sf" class="safe"></div><div id="gv" class="guide v"></div><div id="gh" class="guide h"></div></div></div></section><aside class="p r"><div id="none" class="muted">개체를 선택하세요.</div><div id="props" hidden><div class="box" id="tp"><h3>텍스트</h3><div class="f"><textarea id="txt"></textarea></div><div class="f"><select id="font"><option>Pretendard</option><option>Noto Sans KR</option><option>Arial</option><option value="serif">명조</option></select></div><div class="row"><div class="f"><input id="fs" type="number"></div><div class="f"><input id="color" type="color"></div></div><div class="row"><button class="btn" id="bold">굵게</button><button class="btn" id="italic">기울임</button></div><div class="row"><button class="btn" data-align="left">왼쪽</button><button class="btn" data-align="center">가운데</button></div><button class="btn" data-align="right">오른쪽</button></div><div class="box" id="ip"><h3>이미지</h3><select id="fit"><option value="contain">전체 보이기</option><option value="cover">영역 채우기</option></select><input id="op" type="range" min="10" max="100"></div><div class="box"><h3>위치·크기</h3><div class="row"><input id="x" type="number"><input id="y" type="number"></div><div class="row"><input id="w" type="number"><input id="h" type="number"></div><input id="rot" type="number"></div><div class="box"><button class="btn" id="frontz">맨 앞으로</button><button class="btn" id="backz">맨 뒤로</button></div></div><div class="box"><h3>레이어</h3><div id="layers"></div></div></aside></div><script>(()=>{'use strict';const $=i=>document.getElementById(i),C=$('cover');const S={o:[],sel:null,u:[],r:[],z:1,set:{tw:210,th:297,b:3,s:5,p:100,pt:.1,a:0,snap:true,safe:true}};let D=null,R=null,T=null,timer=null;const cp=x=>JSON.parse(JSON.stringify(x)),uid=p=>p+Date.now()+Math.random().toString(36).slice(2),so=()=>S.o.find(x=>x.id===S.sel);function dm(){let q=S.set,sp=Math.max(0,q.p/2*q.pt+q.a),tot=q.tw*2+sp+q.b*2,k=Math.min(950/tot,610/(q.th+q.b*2));return{sp,tot,k,w:tot*k,h:(q.th+q.b*2)*k,b:q.b*k,t:q.tw*k,s:q.s*k,sw:sp*k}}function snap(){return JSON.stringify({o:S.o,sel:S.sel,set:S.set})}function hist(){S.u.push(snap());if(S.u.length>50)S.u.shift();S.r=[]}function later(){clearTimeout(timer);$('status').textContent='저장 중';timer=setTimeout(()=>{localStorage.coverV2=snap();$('status').textContent='저장됨'},400)}function geom(){let d=dm();C.style.width=d.w+'px';C.style.height=d.h+'px';let sl=d.b+d.t,fl=sl+d.sw;Object.assign($('back').style,{left:d.b+'px',width:d.t+'px'});Object.assign($('spine').style,{left:sl+'px',width:d.sw+'px'});Object.assign($('front').style,{left:fl+'px',width:d.t+'px'});for(let [id,l] of [['sb',d.b+d.s],['sf',fl+d.s]])Object.assign($(id).style,{left:l+'px',top:(d.b+d.s)+'px',width:(d.t-d.s*2)+'px',height:(d.h-(d.b+d.s)*2)+'px',display:S.set.safe?'block':'none'});$('calc').textContent=`책등 ${d.sp.toFixed(2)}mm · 전체 ${d.tot.toFixed(2)}×${(S.set.th+S.set.b*2).toFixed(2)}mm`}function objs(){C.querySelectorAll('.obj').forEach(e=>e.remove());S.o.slice().sort((a,b)=>a.z-b.z).forEach(o=>{let e=document.createElement('div');e.className='obj '+o.type+(o.id===S.sel?' sel':'');e.dataset.id=o.id;Object.assign(e.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px',transform:`rotate(${o.rot}deg)`,opacity:o.op,zIndex:o.z});if(o.type==='text'){e.textContent=o.text;Object.assign(e.style,{fontSize:o.fs+'px',fontFamily:o.font,color:o.color,fontWeight:o.bold?'800':'400',fontStyle:o.italic?'italic':'normal',textAlign:o.align})}else{e.style.backgroundImage=`url("${o.src}")`;e.style.backgroundSize=o.fit}e.innerHTML+='<i class="h br"></i><i class="h ro"></i>';C.appendChild(e)});props();layers()}function render(){geom();objs()}function addText(text,fs=36){hist();let d=dm(),o={id:uid('t'),type:'text',text,x:d.w-d.b-d.t*.8,y:d.h*.38,w:d.t*.65,h:55,fs,font:'Pretendard',color:'#12396d',bold:true,italic:false,align:'center',rot:0,op:1,z:Date.now()};S.o.push(o);S.sel=o.id;render();later()}function addImg(src){hist();let d=dm(),o={id:uid('i'),type:'image',src,x:d.w-d.b-d.t*.8,y:d.h*.2,w:d.t*.6,h:d.h*.4,fit:'contain',rot:0,op:1,z:Date.now()};S.o.push(o);S.sel=o.id;render();later()}function upd(p,h=true){let o=so();if(!o)return;if(h)hist();Object.assign(o,p);objs();later()}function props(){let o=so();$('none').hidden=!!o;$('props').hidden=!o;if(!o)return;$('tp').hidden=o.type!=='text';$('ip').hidden=o.type!=='image';if(o.type==='text'){$('txt').value=o.text;$('font').value=o.font;$('fs').value=o.fs;$('color').value=o.color}else{$('fit').value=o.fit;$('op').value=o.op*100}for(let [id,k] of [['x','x'],['y','y'],['w','w'],['h','h'],['rot','rot']])$(id).value=Math.round(o[k])}function layers(){let b=$('layers');b.innerHTML='';S.o.slice().sort((a,b)=>b.z-a.z).forEach(o=>{let e=document.createElement('div');e.className='layer'+(o.id===S.sel?' on':'');e.textContent=o.type==='text'?o.text:'이미지';e.onclick=()=>{S.sel=o.id;objs()};b.appendChild(e)})}function magnet(o){if(!S.set.snap)return;let d=dm(),cx=o.x+o.w/2,cy=o.y+o.h/2,xs=[d.b+d.t/2,d.b+d.t+d.sw/2,d.b+d.t+d.sw+d.t/2],tol=7;for(let x of xs)if(Math.abs(cx-x)<tol){o.x=x-o.w/2;$('gv').style.display='block';$('gv').style.left=x+'px';break}if(Math.abs(cy-d.h/2)<tol){o.y=d.h/2-o.h/2;$('gh').style.display='block';$('gh').style.top=d.h/2+'px'}}C.onpointerdown=e=>{let el=e.target.closest('.obj');if(!el){S.sel=null;objs();return}S.sel=el.dataset.id;let o=so();hist();if(e.target.classList.contains('br'))R={id:o.id,x:e.clientX,y:e.clientY,w:o.w,h:o.h};else if(e.target.classList.contains('ro')){let r=el.getBoundingClientRect();T={id:o.id,x:r.left+r.width/2,y:r.top+r.height/2}}else D={id:o.id,x:e.clientX,y:e.clientY,ox:o.x,oy:o.y};objs();e.preventDefault()};document.onpointermove=e=>{if(D){let o=S.o.find(x=>x.id===D.id);o.x=D.ox+(e.clientX-D.x)/S.z;o.y=D.oy+(e.clientY-D.y)/S.z;magnet(o);objs()}if(R){let o=S.o.find(x=>x.id===R.id);o.w=Math.max(25,R.w+(e.clientX-R.x)/S.z);o.h=Math.max(22,R.h+(e.clientY-R.y)/S.z);objs()}if(T){let o=S.o.find(x=>x.id===T.id);o.rot=Math.round(Math.atan2(e.clientY-T.y,e.clientX-T.x)*180/Math.PI+90);objs()}};document.onpointerup=()=>{if(D||R||T)later();D=R=T=null;$('gv').style.display=$('gh').style.display='none'};function apply(){hist();S.set={...S.set,tw:+$('tw').value,th:+$('th').value,b:+$('bleed').value,s:+$('safe').value,p:+$('pages').value,pt:+$('paper').value,a:+$('adj').value};render();later()}for(let id of ['tw','th','bleed','safe','pages','paper','adj'])$(id).onchange=apply;$('preset').onchange=e=>{[$('tw').value,$('th').value]=e.target.value.split(',');apply()};$('safeOn').onchange=e=>{S.set.safe=e.target.checked;geom();later()};$('snap').onchange=e=>{S.set.snap=e.target.checked;later()};$('title').onclick=()=>addText('표지 제목',42);$('sub').onclick=()=>addText('부제목',22);$('spinet').onclick=()=>{addText('책등 제목',16);center('spine')};$('img').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>8e6)return alert('8MB 이하 이미지를 사용하세요.');let r=new FileReader;r.onload=()=>addImg(r.result);r.readAsDataURL(f);e.target.value=''};function undo(){if(!S.u.length)return;S.r.push(snap());let d=JSON.parse(S.u.pop());S.o=d.o;S.sel=d.sel;S.set=d.set;render()}function redo(){if(!S.r.length)return;S.u.push(snap());let d=JSON.parse(S.r.pop());S.o=d.o;S.sel=d.sel;S.set=d.set;render()}$('undo').onclick=undo;$('redo').onclick=redo;$('dup').onclick=()=>{let o=so();if(!o)return;hist();let n={...cp(o),id:uid(o.type[0]),x:o.x+15,y:o.y+15,z:Date.now()};S.o.push(n);S.sel=n.id;render();later()};$('del').onclick=()=>{if(!so())return;hist();S.o=S.o.filter(x=>x.id!==S.sel);S.sel=null;render();later()};function center(z){let o=so();if(!o)return;let d=dm(),m={back:[d.b,d.b+d.t],spine:[d.b+d.t,d.b+d.t+d.sw],front:[d.b+d.t+d.sw,d.w-d.b]}[z];upd({x:m[0]+(m[1]-m[0]-o.w)/2,y:(d.h-o.h)/2,rot:z==='spine'&&o.type==='text'?90:o.rot})}document.querySelectorAll('[data-center]').forEach(b=>b.onclick=()=>center(b.dataset.center));$('txt').oninput=e=>upd({text:e.target.value},false);$('font').onchange=e=>upd({font:e.target.value});$('fs').onchange=e=>upd({fs:+e.target.value});$('color').oninput=e=>upd({color:e.target.value},false);$('bold').onclick=()=>upd({bold:!so().bold});$('italic').onclick=()=>upd({italic:!so().italic});document.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>upd({align:b.dataset.align}));$('fit').onchange=e=>upd({fit:e.target.value});$('op').oninput=e=>upd({op:e.target.value/100},false);for(let [id,k] of [['x','x'],['y','y'],['w','w'],['h','h'],['rot','rot']])$(id).onchange=e=>upd({[k]:+e.target.value});$('frontz').onclick=()=>upd({z:Math.max(0,...S.o.map(x=>x.z))+1});$('backz').onclick=()=>upd({z:Math.min(0,...S.o.map(x=>x.z))-1});function zoom(v){S.z=Math.max(.5,Math.min(1.5,v));C.style.transform=`scale(${S.z})`;$('zr').textContent=Math.round(S.z*100)+'%'}$('zo').onclick=()=>zoom(S.z-.1);$('zi').onclick=()=>zoom(S.z+.1);$('zr').onclick=()=>zoom(1);$('savep').onclick=()=>{localStorage.coverV2=snap();$('status').textContent='저장됨'};$('loadp').onclick=()=>{if(localStorage.coverV2){let d=JSON.parse(localStorage.coverV2);S.o=d.o;S.sel=d.sel;S.set=d.set;render()}};$('exp').onclick=()=>{let a=document.createElement('a'),b=new Blob([snap()],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='cover-project-v2.json';a.click();URL.revokeObjectURL(a.href)};$('imp').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());S.o=d.o||[];S.sel=d.sel;S.set={...S.set,...d.set};render();later()}catch{alert('올바른 파일이 아닙니다.')}e.target.value=''};if(localStorage.coverV2)try{let d=JSON.parse(localStorage.coverV2);S.o=d.o||[];S.sel=d.sel;S.set={...S.set,...d.set}}catch{}render();if(!S.o.length){addText('표지 제목',42);S.u=[]}})();</script></body></html>
