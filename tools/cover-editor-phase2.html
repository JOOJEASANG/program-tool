<style>
:root{--navy:#12396d;--cyan:#1d9bb2;--line:#dbe5ee;--bg:#eef4f8;--ink:#0f172a;--muted:#64748b;--nav-h:52px}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Pretendard,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);padding-top:var(--nav-h);overflow:hidden}button,input,select,textarea{font:inherit}.top-nav{position:fixed;inset:0 0 auto;height:var(--nav-h);z-index:50;background:var(--navy);display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff}.top-nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:800;border:1px solid rgba(255,255,255,.22);padding:7px 10px;border-radius:8px}.title{font-weight:900;font-size:14px;flex:1;text-align:center}.status{font-size:11px;color:rgba(255,255,255,.8);min-width:110px;text-align:right}.app{height:calc(100vh - var(--nav-h));display:grid;grid-template-columns:260px minmax(0,1fr) 300px}.panel{background:#fff;overflow:auto;padding:12px}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.panel h2{font-size:13px;margin:0 0 10px}.section{border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin-bottom:10px}.section-title{font-size:11px;font-weight:900;color:#475569;margin-bottom:8px}.btn{width:100%;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:11px;font-weight:850;background:#f1f5f9;color:#334155;margin-bottom:6px}.btn.primary{background:linear-gradient(135deg,var(--navy),var(--cyan));color:#fff}.btn.danger{color:#b91c1c;background:#fef2f2}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.field{margin-bottom:8px}.field label{display:block;font-size:10px;font-weight:850;color:#475569;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px;font-size:11px;background:#fff}.field textarea{min-height:64px;resize:vertical}.toolbar{display:flex;gap:5px;flex-wrap:wrap}.tool{border:1px solid var(--line);background:#fff;border-radius:7px;min-width:3 x;cursor:nwse-resize}.handle.rotate{left:50%;top:-22px;transform:translateX(-50%);cursor:grab}.handle.rotate:after{content:"";position:absolute;left:2px;top:7px;width:1px;height:13px;background:#0ea5e9}.layer{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:7px;margin-bottom:5px;font-size:10px;cursor:pointer}.layer.active{border-color:#38bdf8;background:#f0f9ff}.layer span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{font-size:10px;color:#94a3b8;text-align:center;padding:18px 4px}@media(max-width:1050px){body{overflow:auto}.app{grid-template-columns:1fr;height:auto}.panel{border:0!important}.workspace{min-height:760px}}
</style></head><body>
<nav class="top-nav"><a href="perfect-binding-cover.html">← 기존 제작기</a><div class="title">무선제본 표지 편집기 · 2단계</div><div class="status" id="saveStatus">자동 저장 준비</div></nav>
<main class="app"><aside class="panel left"><h2>표지 설정</h2>
<section class="section"><div class="section-title">완성 규격</div><div class="field"><label>규격</label><select id="sizePreset"><option value="a4">A4 · 210×297mm</option><option value="b5jis">B5(JIS) · 182×257mm</option><option value="a5">A5 · 148×210mm</option><option value="custom">직접 입력</option></select></div><div class="row"><div class="field"><label>가로(mm)</label><input id="trimW" type="number" value="210"></div><div class="field"><label>세로(mm)</label><input id="trimH" type="number" value="297"></div></div><div class="row"><div class="field"><label>재단 여백(mm)</label><input id="bleed" type="number" value="3"></div><div class="field"><label>안전 여백(mm)</label><input id="safeMargin" type="number" value="5"></div></div></section>
<section class="section"><div class="section-title">책등 계산</div><div class="row"><div class="field"><label>본문 페이지</label><input id="pages" type="number" value="100"></div><div class="field"><label>종이 두께(mm/장)</label><input id="paperThickness" type="number" value=".1" step=".005"></div></div><div class="field"><label>책등 보정(mm)</label><input id="spineAdjust" type="number" value="0" step=".1"></div><div class="warning" id="spineResult">책등 폭 계산 중</div></section>
<section class="section"><div class="section-title">요소 추가</div><button class="btn primary" id="addTitle">제목 추가</button><button class="btn" id="addSubtitle">부제 추가</button><button class="btn" id="addSpine">책등 제목 추가</button><label class="btn" style="display:block;text-align:center">이미지 추가<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><div class="hint">이미지는 브라우저 안에서만 처리됩니다.</div></section>
<section class="section"><div class="section-title">보기·맞춤</div><label class="hint"><input id="showSafe" type="checkbox" checked> 안전영역 표시</label><br><label class="hint"><input id="snapEnabled" type="checkbox" checked> 중앙선·경계선 자석 맞춤</label></section>
<section class="section"><div class="section-title">작업</div><div class="row"><button class="btn" id="undoBtn">실행 취소</button><button class="btn" id="redoBtn">다시 실행</button></div><button class="btn" id="duplicateBtn">선택 개체 복제</button><button class="btn danger" id="deleteBtn">선택 개체 삭제</button></section>
<section class="section"><div class="section-title">프로젝트</div><button class="btn" id="saveBtn">브라우저에 저장</button><button class="btn" id="loadBtn">저장 작업 불러오기</button><button class="btn" id="exportBtn">프로젝트 JSON 내보내기</button><label class="btn" style="display:block;text-align:center">프로젝트 JSON 불러오기<input id="importInput" type="file" accept="application/json" hidden></label><button class="btn danger" id="resetBtn">새 작업으로 초기화</button></section></aside>
<section class="workspace"><div class="workbar"><button class="tool" id="zoomOut">−</button><button class="tool" id="zoomReset">100%</button><button class="tool" id="zoomIn">＋</button><button class="tool" id="centerFront">앞표지 중앙</button><button class="tool" id="centerBack">뒤표지 중앙</button><button class="tool" id="centerSpine">책등 중앙</button><span class="zoom" id="zoomText">100%</span></div><div class="stage-shell"><div class="cover-wrap"><div class="cover" id="cover"><div class="zone back" id="zoneBack"></div><div class="zone spine" id="zoneSpine"></div><div class="zone front" id="zoneFront"></div><div class="safe" id="safeBack"></div><div class="safe" id="safeFront"></div><span class="zone-label" id="labelBack">뒤표지</span><span class="zone-label" id="labelSpine">책등</span><span class="zone-label" id="labelFront">앞표지</span><div class="guide v" id="guideV"></div><div class="guide h" id="guideH"></div></div></div></div></section>
<aside class="panel right"><h2>선택 개체 속성</h2><div id="noSelection" class="empty">개체를 선택하면 편집 속성이 표시됩니다.</div><div id="properties" hidden><section class="section" id="textSection"><div class="section-title">내용</div><div class="field"><textarea id="textValue"></textarea></div><div class="field"><label>글꼴</label><select id="fontFamily"><option value="Pretendard">Pretendard</option><option value="Noto Sans KR">Noto Sans KR</option><option value="Arial">Arial</option><option value="serif">명조 계열</option><option value="sans-serif">고딕 계열</option></select></div><div class="row"><div class="field"><label>크기</label><input id="fontSize" type="number"></div><div class="field"><label>색상</label><input id="fontColor" type="color"></div></div><div class="toolbar"><button class="tool" id="boldBtn">굵게</button><button class="tool" id="italicBtn">기울임</button><button class="tool" data-align="left">왼쪽</button><button class="tool" data-align="center">가운데</button><button class="tool" data-align="right">오른쪽</button></div></section><section class="section" id="imageSection"><div class="section-title">이미지</div><div class="field"><label>맞춤</label><select id="imageFit"><option value="contain">전체 보이기</option><option value="cover">영역 채우기</option></select></div><div class="field"><label>투명도</label><input id="opacity" type="range" min="10" max="100"></div></section><section class="section"><div class="section-title">정밀 위치</div><div class="row"><div class="field"><label>X</label><input id="posX" type="number"></div><div class="field"><label>Y</label><input id="posY" type="number"></div></div><div class="row"><div class="field"><label>너비</label><input id="objW" type="number"></div><div class="field"><label>높이</label><input id="objH" type="number"></div></div><div class="field"><label>회전</label><input id="rotation" type="number"></div></section><section class="section"><div class="section-title">레이어</div><div class="row"><button class="btn" id="bringFront">맨 앞으로</button><button class="btn" id="sendBack">맨 뒤로</button></div></section></div><section class="section"><div class="section-title">개체 목록</div><div id="layerList"></div></section></aside></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cover=$('cover');const state={objects:[],selectedId:null,undo:[],redo:[],zoom:1,settings:{trimW:210,trimH:297,bleed:3,safe:5,pages:100,paperThickness:.1,spineAdjust:0,snap:true,showSafe:true}};let drag=null,resize=null,rotate=null,saveTimer=null;const uid=(p='o')=>`${p}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,clone=o=>JSON.parse(JSON.stringify(o)),selected=()=>state.objects.find(o=>o.id===state.selectedId)||null;
function dims(){const s=state.settings,spine=Math.max(0,(s.pages/2)*s.paperThickness+s.spineAdjust),total=s.trimW*2+spine+s.bleed*2,scale=Math.min(980/total,640/(s.trimH+s.bleed*2));return{spine,total,h:s.trimH+s.bleed*2,scale,wPx:total*scale,hPx:(s.trimH+s.bleed*2)*scale,bleedPx:s.bleed*scale,trimPx:s.trimW*scale,spinePx:spine*scale,safePx:s.safe*scale};}function snapshot(){return JSON.stringify({objects:state.objects,selectedId:state.selectedId,settings:state.settings});}function pushHistory(){state.undo.push(snapshot());if(state.undo.length>60)state.undo.shift();state.redo=[];}function restore(raw){const d=JSON.parse(raw);state.objects=d.objects||[];state.selectedId=d.selectedId||null;state.settings={...state.settings,...(d.settings||{})};syncInputs();renderAll();}function scheduleSave(){clearTimeout(saveTimer);$('saveStatus').textContent='변경 저장 중…';saveTimer=setTimeout(()=>{localStorage.setItem('coverEditorPhase2',snapshot());$('saveStatus').textContent='자동 저장 완료';},500);}
function addText(text,opts={}){pushHistory();const d=dims(),o={id:uid('t'),type:'text',text,x:opts.x??d.wPx-d.bleedPx-d.trimPx*.82,y:opts.y??d.hPx*.38,w:opts.w??d.trimPx*.65,h:opts.h??60,fontSize:opts.fontSize??36,fontFamily:'Pretendard',color:'#12396d',bold:opts.bold??true,italic:false,align:'center',rotation:opts.rotation??0,opacity:1,z:Date.now()};state.objects.push(o);state.selectedId=o.id;renderAll();scheduleSave();}function addImage(src){pushHistory();const d=dims(),o={id:uid('i'),type:'image',src,x:d.wPx-d.bleedPx-d.trimPx*.8,y:d.hPx*.18,w:d.trimPx*.6,h:d.hPx*.42,fit:'contain',opacity:1,rotation:0,z:Date.now()};state.objects.push(o);state.selectedId=o.id;renderAll();scheduleSave();}function updateSelected(patch,history=true){const o=selected();if(!o)return;if(history)pushHistory();Object.assign(o,patch);renderObjects();scheduleSave();}function deleteSelected(){if(!selected())return;pushHistory();state.objects=state.objects.filter(o=>o.id!==state.selectedId);state.selectedId=null;renderObjects();scheduleSave();}
function renderGeometry(){const d=dims();cover.style.width=d.wPx+'px';cover.style.height=d.hPx+'px';const backL=d.bleedPx,spineL=d.bleedPx+d.trimPx,frontL=spineL+d.spinePx;Object.assign($('zoneBack').style,{left:backL+'px',width:d.trimPx+'px'});Object.assign($('zoneSpine').style,{left:spineL+'px',width:d.spinePx+'px'});Object.assign($('zoneFront').style,{left:frontL+'px',width:d.trimPx+'px'});Object.assign($('safeBack').style,{left:(backL+d.safePx)+'px',top:(d.bleedPx+d.safePx)+'px',width:(d.trimPx-d.safePx*2)+'px',height:(d.hPx-(d.bleedPx+d.safePx)*2)+'px',display:state.settings.showSafe?'block':'none'});Object.assign($('safeFront').style,{left:(frontL+d.safePx)+'px',top:(d.bleedPx+d.safePx)+'px',width:(d.trimPx-d.safePx*2)+'px',height:(d.hPx-(d.bleedPx+d.safePx)*2)+'px',display:state.settings.showSafe?'block':'none'});Object.assign($('labelBack').style,{left:(backL+d.trimPx/2-20)+'px'});Object.assign($('labelSpine').style,{left:(spineL+d.spinePx/2-4)+'px',writingMode:'vertical-rl'});Object.assign($('labelFront').style,{left:(frontL+d.trimPx/2-20)+'px'});$('spineResult').textContent=`책등 ${d.spine.toFixed(2)}mm · 전체 ${d.total.toFixed(2)}×${d.h.toFixed(2)}mm`;$('spineResult').style.color=d.spine<2?'#b91c1c':'#166534';}
function renderObjects(){cover.querySelectorAll('.obj').forEach(e=>e.remove());[...state.objects].sort((a,b)=>a.z-b.z).forEach(o=>{const el=document.createElement('div');el.className=`obj ${o.type}`+(o.id===state.selectedId?' selected':'');el.dataset.id=o.id;Object.assign(el.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px',transform:`rotate(${o.rotation}deg)`,opacity:o.opacity??1,zIndex:String(o.z)});if(o.type==='text'){el.textContent=o.text;Object.assign(el.style,{fontSize:o.fontSize+'px',fontFamily:o.fontFamily,color:o.color,fontWeight:o.bold?'800':'400',fontStyle:o.italic?'italic':'normal',textAlign:o.align});}else{el.style.backgroundImage=`url("${o.src}")`;el.style.backgroundSize=o.fit||'contain';}el.innerHTML+='<span class="handle br"></span><span class="handle rotate"></span>';cover.appendChild(el);});renderProperties();renderLayers();}function renderProperties(){const o=selected();$('noSelection').hidden=!!o;$('properties').hidden=!o;if(!o)return;$('textSection').hidden=o.type!=='text';$('imageSection').hidden=o.type!=='image';if(o.type==='text'){$('textValue').value=o.text;$('fontFamily').value=o.fontFamily;$('fontSize').value=o.fontSize;$('fontColor').value=o.color;$('boldBtn').classList.toggle('active',o.bold);$('italicBtn').classList.toggle('active',o.italic);document.querySelectorAll('[data-align]').forEach(b=>b.classList.toggle('active',b.dataset.align===o.align));}else{$('imageFit').value=o.fit;$('opacity').value=Math.round((o.opacity??1)*100);}$('posX').value=Math.round(o.x);$('posY').value=Math.round(o.y);$('objW').value=Math.round(o.w);$('objH').value=Math.round(o.h);$('rotation').value=Math.round(o.rotation);}function renderLayers(){const box=$('layerList');box.innerHTML='';if(!state.objects.length){box.innerHTML='<div class="empty">추가된 개체가 없습니다.</div>';return;}[...state.objects].sort((a,b)=>b.z-a.z).forEach(o=>{const e=document.createElement('div');e.className='layer'+(o.id===state.selectedId?' active':'');e.innerHTML=`<b>${o.type==='text'?'T':'▣'}</b><span>${o.type==='text'?(o.text.replace(/\n/g,' ')||'빈 텍스트'):'이미지'}</span>`;e.onclick=()=>{state.selectedId=o.id;renderObjects();};box.appendChild(e);});}function renderAll(){renderGeometry();renderObjects();}
function syncInputs(){const s=state.settings;$('trimW').value=s.trimW;$('trimH').value=s.trimH;$('bleed').value=s.bleed;$('safeMargin').value=s.safe;$('pages').value=s.pages;$('paperThickness').value=s.paperThickness;$('spineAdjust').value=s.spineAdjust;$('snapEnabled').checked=s.snap;$('showSafe').checked=s.showSafe;}function snapObject(o){if(!state.settings.snap)return;const d=dims(),tol=7,cx=o.x+o.w/2,cy=o.y+o.h/2,v=[d.bleedPx+d.trimPx/2,d.bleedPx+d.trimPx+d.spinePx/2,d.bleedPx+d.trimPx+d.spinePx+d.trimPx/2,d.wPx/2],h=[d.hPx/2];let vx=null,hy=null;for(const x of v)if(Math.abs(cx-x)<tol){o.x=x-o.w/2;vx=x;break;}for(const y of h)if(Math.abs(cy-y)<tol){o.y=y-o.h/2;hy=y;break;}$('guideV').style.display=vx===null?'none':'block';if(vx!==null)$('guideV').style.left=vx+'px';$('guideH').style.display=hy===null?'none':'block';if(hy!==null)$('guideH').style.top=hy+'px';}
cover.addEventListener('pointerdown',e=>{const el=e.target.closest('.obj');if(!el){state.selectedId=null;renderObjects();return;}state.selectedId=el.dataset.id;const o=selected();if(e.target.classList.contains('br')){pushHistory();resize={id:o.id,startX:e.clientX,startY:e.clientY,w:o.w,h:o.h};e.target.setPointerCapture(e.pointerId);}else if(e.target.classList.contains('rotate')){pushHistory();const r=el.getBoundingClientRect();rotate={id:o.id,cx:r.left+r.width/2,cy:r.top+r.height/2};e.target.setPointerCapture(e.pointerId);}else{pushHistory();drag={id:o.id,startX:e.clientX,startY:e.clientY,x:o.x,y:o.y};el.setPointerCapture(e.pointerId);}renderObjects();e.preventDefault();});document.addEventListener('pointermove',e=>{if(drag){const o=state.objects.find(x=>x.id===drag.id);o.x=drag.x+(e.clientX-drag.startX)/state.zoom;o.y=drag.y+(e.clientY-drag.startY)/state.zoom;snapObject(o);renderObjects();}if(resize){const o=state.objects.find(x=>x.id===resize.id);o.w=Math.max(24,resize.w+(e.clientX-resize.startX)/state.zoom);o.h=Math.max(22,resize.h+(e.clientY-resize.startY)/state.zoom);renderObjects();}if(rotate){const o=state.objects.find(x=>x.id===rotate.id);o.rotation=Math.round(Math.atan2(e.clientY-rotate.cy,e.clientX-rotate.cx)*180/Math.PI+90);renderObjects();}});document.addEventListener('pointerup',()=>{if(drag||resize||rotate)scheduleSave();drag=resize=rotate=null;$('guideV').style.display=$('guideH').style.display='none';});
function undo(){if(!state.undo.length)return;state.redo.push(snapshot());restore(state.undo.pop());scheduleSave();}function redo(){if(!state.redo.length)return;state.undo.push(snapshot());restore(state.redo.pop());scheduleSave();}function duplicate(){const o=selected();if(!o)return;pushHistory();const n={...clone(o),id:uid(o.type==='text'?'t':'i'),x:o.x+18,y:o.y+18,z:Date.now()};state.objects.push(n);state.selectedId=n.id;renderObjects();scheduleSave();}function center(zone){const o=selected();if(!o)return;const d=dims(),ranges={back:[d.bleedPx,d.bleedPx+d.trimPx],spine:[d.bleedPx+d.trimPx,d.bleedPx+d.trimPx+d.spinePx],front:[d.bleedPx+d.trimPx+d.spinePx,d.wPx-d.bleedPx]},[l,r]=ranges[zone];updateSelected({x:l+(r-l-o.w)/2,y:(d.hPx-o.h)/2,rotation:zone==='spine'&&o.type==='text'?90:o.rotation});}function applySettings(){pushHistory();const old=dims();state.settings.trimW=+$('trimW').value;state.settings.trimH=+$('trimH').value;state.settings.bleed=+$('bleed').value;state.settings.safe=+$('safeMargin').value;state.settings.pages=+$('pages').value;state.settings.paperThickness=+$('paperThickness').value;state.settings.spineAdjust=+$('spineAdjust').value;const now=dims(),sx=now.wPx/old.wPx,sy=now.hPx/old.hPx;state.objects.forEach(o=>{o.x*=sx;o.y*=sy;o.w*=sx;o.h*=sy;});renderAll();scheduleSave();}
$('sizePreset').onchange=e=>{const m={a4:[210,297],b5jis:[182,257],a5:[148,210]}[e.target.value];if(m){$('trimW').value=m[0];$('trimH').value=m[1];applySettings();}};['trimW','trimH','bleed','safeMargin','pages','paperThickness','spineAdjust'].forEach(id=>$(id).onchange=applySettings);$('showSafe').onchange=e=>{state.settings.showSafe=e.target.checked;renderGeometry();scheduleSave();};$('snapEnabled').onchange=e=>{state.settings.snap=e.target.checked;scheduleSave();};$('addTitle').onclick=()=>addText('표지 제목',{fontSize:42});$('addSubtitle').onclick=()=>addText('부제목을 입력하세요',{fontSize:22,bold:false});$('addSpine').onclick=()=>{addText('책등 제목',{fontSize:16,w:200,h:36,rotation:90});center('spine');};$('imageInput').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){alert('이미지는 8MB 이하를 사용하세요.');e.target.value='';return;}const r=new FileReader();r.onload=()=>addImage(r.result);r.readAsDataURL(f);e.target.value='';};
$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;$('duplicateBtn').onclick=duplicate;$('deleteBtn').onclick=deleteSelected;$('textValue').oninput=e=>updateSelected({text:e.target.value},false);$('fontFamily').onchange=e=>updateSelected({fontFamily:e.target.value});$('fontSize').onchange=e=>updateSelected({fontSize:+e.target.value});$('fontColor').oninput=e=>updateSelected({color:e.target.value},false);$('boldBtn').onclick=()=>selected()&&updateSelected({bold:!selected().bold});$('italicBtn').onclick=()=>selected()&&updateSelected({italic:!selected().italic});document.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>updateSelected({align:b.dataset.align}));$('imageFit').onchange=e=>updateSelected({fit:e.target.value});$('opacity').oninput=e=>updateSelected({opacity:+e.target.value/100},false);[['posX','x'],['posY','y'],['objW','w'],['objH','h'],['rotation','rotation']].forEach(([id,key])=>$(id).onchange=e=>updateSelected({[key]:+e.target.value}));$('bringFront').onclick=()=>selected()&&updateSelected({z:Math.max(0,...state.objects.map(o=>o.z))+1});$('sendBack').onclick=()=>selected()&&updateSelected({z:Math.min(0,...state.objects.map(o=>o.z))-1});$('centerFront').onclick=()=>center('front');$('centerBack').onclick=()=>center('back');$('centerSpine').onclick=()=>center('spine');
function setZoom(v){state.zoom=Math.max(.5,Math.min(1.5,v));cover.style.transform=`scale(${state.zoom})`;$('zoomText').textContent=Math.round(state.zoom*100)+'%';$('zoomReset').textContent=Math.round(state.zoom*100)+'%';}$('zoomOut').onclick=()=>setZoom(state.zoom-.1);$('zoomIn').onclick=()=>setZoom(state.zoom+.1);$('zoomReset').onclick=()=>setZoom(1);$('saveBtn').onclick=()=>{localStorage.setItem('coverEditorPhase2',snapshot());$('saveStatus').textContent='수동 저장 완료';};$('loadBtn').onclick=()=>{const r=localStorage.getItem('coverEditorPhase2');if(r){pushHistory();restore(r);$('saveStatus').textContent='저장 작업 불러옴';}};$('exportBtn').onclick=()=>{const blob=new Blob([snapshot()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cover-project-v2.json';a.click();URL.revokeObjectURL(a.href);};$('importInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{pushHistory();restore(await f.text());scheduleSave();}catch{alert('올바른 프로젝트 파일이 아닙니다.');}e.target.value='';};$('resetBtn').onclick=()=>{if(!confirm('현재 작업을 초기화할까요?'))return;pushHistory();state.objects=[];state.selectedId=null;renderAll();scheduleSave();};document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement?.isContentEditable)return;const o=selected();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate();return;}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();return;}if(o&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();pushHistory();const step=e.shiftKey?10:1;if(e.key==='ArrowLeft')o.x-=step;if(e.key==='ArrowRight')o.x+=step;if(e.key==='ArrowUp')o.y-=step;if(e.key==='ArrowDown')o.y+=step;snapObject(o);renderObjects();scheduleSave();}});syncInputs();const saved=localStorage.getItem('coverEditorPhase2');if(saved){try{restore(saved);$('saveStatus').textContent='자동 저장 복원';}catch{renderAll();}}else{renderAll();addText('표지 제목',{fontSize:42});state.undo=[];}})();
</script></body></html>
