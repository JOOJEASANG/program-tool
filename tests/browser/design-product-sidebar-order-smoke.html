<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Product sidebar order smoke</title>
</head>
<body>
  <div class="design-flat-panel" aria-label="디자인 도구 전체 메뉴">
    <section id="designOutputTools" class="side-card"><div class="side-label">인쇄 파일 만들기</div></section>
    <section id="designLayerTools" class="side-card"><div class="side-label">레이어</div><div id="layerList"></div></section>
    <section id="designRecipeTools" class="side-card"><div class="side-label">스타터 디자인 레시피</div></section>
    <section id="designPhase4SmartLayout" class="side-card"><div class="side-label">전문 기본 배치</div></section>
    <section id="designCoverSpineTools" class="side-card"><div class="side-label">책등 글자</div></section>
    <section id="designSimpleResultTools" class="side-card"><div class="side-label">빠른 제작</div></section>
    <section id="designPrintSafetyTools" class="side-card"><div class="side-label">인쇄 안전</div></section>
    <section id="inspector" class="side-card"><div class="inspector-title">선택 속성</div></section>
    <section id="designComponentBlocksTools" class="side-card"><div class="side-label">빠른 구성</div></section>
    <section id="designEmbeddedModeCard" class="side-card design-mode-card"><div class="side-label">작업 규격</div></section>
    <section class="side-card"><div class="side-label">내용 추가</div><button id="addTitleBtn" type="button">제목</button></section>
    <section id="designPhase2Tools" class="side-card"><div class="side-label">이미지·도형 추가</div></section>
    <section id="designQuickDesignTools" class="side-card"><div class="side-label">빠른 스타일</div></section>
    <section id="designPrintQualityTools" class="side-card"><div class="side-label">인쇄 품질</div></section>
    <section id="designFinalPrintCheckTools" class="side-card"><div class="side-label">출력 전 최종 검사</div></section>
    <section id="designCoverSettingsTools" class="side-card"><div class="side-label">표지 규격 · 책등</div></section>
    <details id="designAdvancedTools" class="side-card"><summary>고급 도구</summary></details>
  </div>

  <script src="/js/design-editor/standalone-product-profile.js?v=20260901-1"></script>
  <script>
    (function(){
      const app=new URLSearchParams(location.search).get('app')||'poster';
      if(app!=='cover'){
        document.getElementById('designCoverSettingsTools')?.remove();
        document.getElementById('designCoverSpineTools')?.remove();
      }
    })();
  </script>
  <script src="/js/design-editor/shared/sidebar-menu-order.js?v=20260901-2"></script>
  <script>
    setTimeout(()=>{
      try{
        const app=new URLSearchParams(location.search).get('app')||'poster';
        const profile=window.DesignEditorStandaloneProducts?.fromLocation?.(location.search);
        const api=window.DesignEditorSidebarMenuOrder;
        if(!profile||!api)throw new Error('sidebar order runtime missing');
        api.sync();
        const panel=document.querySelector('.design-flat-panel');
        const actual=[...panel.children]
          .filter(node=>node.matches?.('.side-card,.design-mode-card'))
          .map(node=>node.id);
        const expected=profile.sidebarOrder.filter(id=>document.getElementById(id));
        const actualKnown=actual.filter(id=>profile.sidebarOrder.includes(id));
        if(actualKnown.join('|')!==expected.join('|'))throw new Error(`profile order mismatch: ${actualKnown.join(' > ')}`);
        const labels=[...panel.querySelectorAll(':scope > .design-sidebar-group-label')];
        const sections=labels.map(node=>node.dataset.sidebarSection);
        for(const key of ['structure','create','edit','output','advanced']){
          if(!sections.includes(key))throw new Error(`missing section ${key}`);
        }
        if(sections.length!==new Set(sections).size)throw new Error(`repeated sidebar sections: ${sections.join(' > ')}`);
        if(sections.length!==5)throw new Error(`section count mismatch: ${sections.length}`);
        if(app==='cover'){
          const fallback=actual.indexOf('designRecipeTools'),edit=actual.indexOf('inspector'),advanced=actual.indexOf('designAdvancedTools');
          if(fallback<0||fallback>edit||fallback>advanced)throw new Error('unlisted create card escaped its semantic group');
        }

        const advancedLabel=panel.querySelector('[data-sidebar-section="advanced"]');
        const advancedCard=document.getElementById('designAdvancedTools');
        if(advancedLabel?.getAttribute('aria-expanded')!=='false')throw new Error('advanced section should default collapsed');
        if(!advancedCard?.classList.contains('design-sidebar-section-collapsed-card'))throw new Error('advanced card should default hidden by section state');

        const createLabel=panel.querySelector('[data-sidebar-section="create"]');
        const createCard=document.getElementById('designSimpleResultTools');
        createLabel?.click();
        if(createLabel?.getAttribute('aria-expanded')!=='false'||!createCard?.classList.contains('design-sidebar-section-collapsed-card'))throw new Error('create section did not collapse');
        createLabel?.click();
        if(createLabel?.getAttribute('aria-expanded')!=='true'||createCard?.classList.contains('design-sidebar-section-collapsed-card'))throw new Error('create section did not reopen');

        const outputLabel=panel.querySelector('[data-sidebar-section="output"]');
        outputLabel?.click();
        if(outputLabel?.getAttribute('aria-expanded')!=='false')throw new Error('output section did not collapse');
        const opened=api.openForStep('output');
        if(opened!=='output'||outputLabel?.getAttribute('aria-expanded')!=='true')throw new Error('workspace step did not reopen output section');

        if(panel.dataset.designSidebarSections!=='interactive')throw new Error('interactive section ownership missing');
        if(document.documentElement.dataset.designSidebarOrder!==profile.key)throw new Error('product ownership missing');
        document.documentElement.dataset.productSidebarOrderSmoke='pass';
        document.documentElement.dataset.productSidebarOrderApp=profile.key;
        document.documentElement.dataset.productSidebarOrderFirst=actual[0]||'';
        document.documentElement.dataset.productSidebarOrderLast=actual.at(-1)||'';
        document.documentElement.dataset.productSidebarOrderSections=String(sections.length);
        document.documentElement.dataset.productSidebarOrderFallback='grouped';
        document.documentElement.dataset.productSidebarSectionCollapse='pass';
        document.documentElement.dataset.productSidebarWorkspaceOpen='pass';
      }catch(error){
        document.documentElement.dataset.productSidebarOrderSmoke='fail';
        document.body.insertAdjacentHTML('beforeend',`<pre>${String(error?.stack||error)}</pre>`);
      }
    },500);
  </script>
</body>
</html>
