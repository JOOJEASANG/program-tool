<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>PDF layout nonprinting margin guides smoke</title>
<script>history.replaceState(null,'','/pdf-editor/index.html?app=layout&preview-guides-smoke=1');</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif}
#previewScroll{width:900px;height:700px;overflow:auto;background:#f1f5f9;padding:12px}
.page-preview{width:457px;background:white}
.page-preview canvas{display:block;width:100%}
</style></head>
<body data-pdf-preview-margin-guides-smoke="running">
<pre id="result">RUNNING</pre>
<button id="previewGuidesToggle" aria-pressed="true">여백선 ON</button>
<input id="marginH" type="number" value="10"><input id="marginV" type="number" value="1">
<input id="marginLeft" type="number" value="15"><input id="marginRight" type="number" value="12">
<input id="marginTop" type="number" value="1"><input id="marginBottom" type="number" value="1">
<input id="cropMarksEnabled" type="checkbox" checked>
<input id="printBleedMm" value="3"><input id="cropMarkLengthMm" value="5"><input id="cropMarkOffsetMm" value="2">
<div id="previewScroll"></div>
<script>
window.getSettings=()=>({pw:457,ph:305,mh:10,mv:1,gp:0});
window.PdfEditorLayoutExport={
  layoutMargins:index=>({
    left:Number(document.getElementById('marginLeft').value)+(index%2?1:0),
    right:Number(document.getElementById('marginRight').value),
    top:Number(document.getElementById('marginTop').value),
    bottom:Number(document.getElementById('marginBottom').value)
  })
};
function insertSheet(index=0){
 const node=document.createElement('div');
 node.className='page-preview';node.dataset.outputIndex=String(index);
 node.dataset.previewPaperWidthMm='457';
 node.dataset.previewPaperHeightMm='305';
 const canvas=document.createElement('canvas');canvas.width=457;canvas.height=305;
 const context=canvas.getContext('2d');
 context.fillStyle='#dbeafe';context.fillRect(0,0,457,305);
 context.fillStyle='#dc2626';context.fillRect(200,120,20,20);
 node.appendChild(canvas);document.getElementById('previewScroll').appendChild(node);
 return node;
}
insertSheet(0);
</script>
<script src="/js/pdf-editor/page-selection-preview-focus.js?v=20261113-1"></script>
<script src="/js/pdf-editor/crop-marks.js?v=20261113-1"></script>
<script>
(async()=>{
 const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const fail=m=>{throw Error(m)};
 const $=id=>document.getElementById(id);
 try{
  for(let i=0;i<25&&!window.PdfPreviewMarginGuides;i++)await sleep(20);
  const engine=window.PdfPreviewMarginGuides;
  if(!engine)fail('guide runtime did not boot');
  await sleep(80);
  const node=document.querySelector('.page-preview');
  if(!node.classList.contains('pdf-paper-guides'))fail('guide overlay was not attached on first preview render');
  if(getComputedStyle(node).outlineStyle!=='solid')fail('paper edge is not a solid border');
  if(getComputedStyle(node,'::after').borderTopStyle!=='dashed')fail('inner work-margin guide is not dashed');
  if(node.dataset.paperMm!=='457 × 305mm')fail('paper dimensions badge wrong '+node.dataset.paperMm);
  const left=parseFloat(node.style.getPropertyValue('--pdf-guide-left'));
  const right=parseFloat(node.style.getPropertyValue('--pdf-guide-right'));
  const top=parseFloat(node.style.getPropertyValue('--pdf-guide-top'));
  if(Math.abs(left-100*15/457)>.01||Math.abs(right-100*12/457)>.01||Math.abs(top-100/305)>.01)
    fail('mm to per-sheet guide inset conversion incorrect');
  const canvas=node.querySelector('canvas'),ctx=canvas.getContext('2d');
  const before=[...ctx.getImageData(210,130,1,1).data];
  $('marginLeft').value='20';
  $('marginLeft').dispatchEvent(new Event('input',{bubbles:true}));
  await sleep(45);
  if(Math.abs(parseFloat(node.style.getPropertyValue('--pdf-guide-left'))-100*20/457)>.01)
    fail('guide did not follow changed mm margin input');
  if([...ctx.getImageData(210,130,1,1).data].join(',')!==before.join(','))
    fail('screen guide was drawn into the PDF canvas');
  // A small sheet with invalid 80+80mm requested margins renders using
  // fallback 3.53mm. The guide must use the real rendered margins.
  for(const [edge,mm] of Object.entries({Left:3.53,Right:3.53,Top:2.1,Bottom:2.1}))
    node.dataset['previewMargin'+edge+'Mm']=String(mm);
  engine.refresh();await sleep(35);
  if(Math.abs(parseFloat(node.style.getPropertyValue('--pdf-guide-left'))-100*3.53/457)>.01)
    fail('rendered margin fallback was ignored by the guide');
  node.classList.add('preview-selection-target');
  if(getComputedStyle(node).outlineColor!=='rgb(37, 99, 235)')
    fail('selected output blue outline was hidden by green paper guide');
  if(!getComputedStyle(node).boxShadow.includes('rgb(15, 118, 110)'))
    fail('selected output lost the green paper boundary');
  node.classList.remove('preview-selection-target');
  $('previewGuidesToggle').click();await sleep(30);
  if(node.classList.contains('pdf-paper-guides')||$('previewGuidesToggle').getAttribute('aria-pressed')!=='false')
    fail('hide guide toggle did not work');
  $('previewGuidesToggle').click();await sleep(30);
  if(!node.classList.contains('pdf-paper-guides'))fail('guide show toggle did not restore overlay');
  // Large job: replacing preview with a virtualized later output sheet
  // must regenerate the badge and use its actual output index.
  $('previewScroll').replaceChildren();
  const later=insertSheet(7);
  await sleep(60);
  if(!later.classList.contains('pdf-paper-guides'))fail('lazy preview replacement lost guides');
  if(Math.abs(parseFloat(later.style.getPropertyValue('--pdf-guide-left'))-100*21/457)>.01)
    fail('virtualized sheet did not use its real output index');
  if([...later.querySelector('canvas').getContext('2d').getImageData(210,130,1,1).data].join(',')!==before.join(','))
    fail('guide altered an original PDF preview pixel');
  // Crop marks enlarge the PDF sheet beyond the originally selected paper.
  // The solid boundary and dashed margins must match that expanded MediaBox.
  $('previewScroll').replaceChildren();
  const marked=insertSheet(8);
  const source=document.createElement('canvas');
  source.width=457;source.height=305;
  for(const [edge,mm] of Object.entries({Left:20,Right:12,Top:1,Bottom:1}))
    source.dataset['margin'+edge+'Mm']=String(mm);
  const exported=window.PdfPrintMarks.addMarksToCanvas(source,1,8);
  if(exported.width!==481||exported.height!==329)
    fail('crop marks did not expand the output sheet by 12mm on every side');
  marked.dataset.previewPaperWidthMm=exported.dataset.paperWidthMm;
  marked.dataset.previewPaperHeightMm=exported.dataset.paperHeightMm;
  marked.dataset.previewTrimWidthMm=exported.dataset.trimPaperWidthMm;
  marked.dataset.previewTrimHeightMm=exported.dataset.trimPaperHeightMm;
  for(const edge of ['Left','Right','Top','Bottom'])
    marked.dataset['previewMargin'+edge+'Mm']=exported.dataset['margin'+edge+'Mm'];
  await sleep(60);
  if(!marked.dataset.paperMm.startsWith('481 × 329mm')||!marked.dataset.paperMm.includes('재단 457×305'))
    fail('expanded crop-mark paper size label is wrong');
  if(Math.abs(parseFloat(marked.style.getPropertyValue('--pdf-guide-left'))-100*32/481)>.01)
    fail('crop-mark padding not included in dashed margin offset');
  document.body.dataset.pdfPreviewMarginGuidesSmoke='pass';
  $('result').textContent='PASS: solid paper-size outline, dashed mm-based margins, toggle, input updates, virtual preview and unmodified PDF canvas';
 }catch(error){
  document.body.dataset.pdfPreviewMarginGuidesSmoke='fail';
  $('result').textContent='FAIL: '+String(error.stack||error);
 }
})();
</script></body></html>
