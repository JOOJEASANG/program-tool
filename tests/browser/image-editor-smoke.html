<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Image Editor Smoke</title></head>
<body data-image-editor-smoke="pending">
  <div id="result">PENDING</div>
  <iframe id="editor" src="/image-editor/" style="width:1100px;height:780px;border:0"></iframe>
  <script>
  (async()=>{
    const result=document.getElementById('result'),frame=document.getElementById('editor');
    const fail=error=>{document.body.dataset.imageEditorSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
    const pass=message=>{document.body.dataset.imageEditorSmoke='pass';result.textContent='PASS: '+message};
    const assert=(condition,message)=>{if(!condition)throw new Error(message)};
    const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40))}throw new Error('timeout: '+label)};
    try{
      await waitFor(()=>frame.contentWindow?.ImageEditorApp,'ImageEditorApp');
      const api=frame.contentWindow.ImageEditorApp;
      const source=document.createElement('canvas');source.width=80;source.height=60;const ctx=source.getContext('2d');ctx.fillStyle='#c43b3b';ctx.fillRect(0,0,40,60);ctx.fillStyle='#356bd6';ctx.fillRect(40,0,40,60);
      const blob=await new Promise(resolve=>source.toBlob(resolve,'image/png'));
      await api.loadBlob(blob,'smoke-source.png');
      let state=api.getState();assert(state.loaded&&state.width===80&&state.height===60,'source dimensions are wrong');
      assert(frame.contentDocument.documentElement.dataset.imageEditorReady==='1','ready marker missing');
      api.rotateRight();state=api.getState();assert(state.width===60&&state.height===80,'rotate right dimensions are wrong');
      assert(api.undo()===true,'undo after rotate failed');state=api.getState();assert(state.width===80&&state.height===60,'undo did not restore source dimensions');
      api.flipHorizontal();state=api.getState();assert(state.width===80&&state.height===60,'flip changed dimensions');
      api.setCrop({x:10,y:5,w:40,h:30});assert(api.applyCrop()===true,'crop did not apply');state=api.getState();assert(state.width===40&&state.height===30,'crop dimensions are wrong');
      api.resize(20,15);state=api.getState();assert(state.width===20&&state.height===15,'resize dimensions are wrong');
      api.setAdjustments({brightness:120,contrast:110,saturation:80});state=api.getState();assert(state.adjustments.brightness===120&&state.adjustments.contrast===110&&state.adjustments.saturation===80,'adjustments did not persist');
      const output=api.renderOutput('image/png');assert(output.width===20&&output.height===15,'rendered output dimensions are wrong');
      const exported=await api.exportBlob('image/png',.92);assert(exported.type==='image/png'&&exported.size>40,'PNG export failed');
      await api.resetOriginal();state=api.getState();assert(state.width===80&&state.height===60,'original reset failed');assert(state.adjustments.brightness===100&&state.adjustments.contrast===100&&state.adjustments.saturation===100,'original reset kept adjustments');
      document.body.dataset.imageEditorWidth=String(state.width);document.body.dataset.imageEditorHeight=String(state.height);document.body.dataset.imageEditorExportType=exported.type;document.body.dataset.imageEditorExportReady=String(exported.size>40);document.body.dataset.imageEditorStage=api.stage;
      pass('upload, rotate, undo, flip, crop, resize, adjustments, export and original reset');
    }catch(error){fail(error)}
  })();
  </script>
</body>
</html>
