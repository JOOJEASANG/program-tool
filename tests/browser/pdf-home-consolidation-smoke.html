<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>PDF Home Consolidation Smoke</title></head>
<body data-pdf-home-consolidation-smoke="running">
  <span id="cnt-all">3</span><span id="cnt-design">0</span><span id="cnt-print">1</span><span id="cnt-edit">0</span><span id="cnt-utility">0</span><span id="count">3개</span>
  <div id="programGrid"></div><div id="quickRow"></div><div id="result">RUNNING</div>
  <script>
    const PROGRAMS=[
      {id:'print-checker',cat:'print',name:'인쇄물 사전 검토',url:'print-checker/'},
      {id:'pdf-editor',cat:'pdf',name:'PDF 편집 · 인쇄배치',url:'pdf-editor/'},
      {id:'pdf-preflight',cat:'pdf',name:'PDF 도구 모음',url:'pdf-preflight/'}
    ];
    window.ProgramStudioHome={PROGRAMS,get activeCategory(){return 'all';}};
    window.renderGrid=()=>{document.getElementById('programGrid').textContent=PROGRAMS.map(item=>item.id).join(',');};
    window.buildQuickRow=()=>{document.getElementById('quickRow').textContent=PROGRAMS.map(item=>item.name).join(',');};
    renderGrid();buildQuickRow();
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  </script>
  <script src="/js/pdf-suite-home-launcher.js?v=smoke"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      try{
        for(let i=0;i<30&&document.documentElement.dataset.pdfHomeUnified!=='ready';i+=1)await wait(20);
        const ids=PROGRAMS.map(item=>item.id).join(',');
        if(ids!=='ai-design-maker,smart-print-layout,pdf-editor,pdf-editor-advanced,pdf-suite')throw new Error('home programs not normalized: '+ids);
        if(PROGRAMS.some(item=>item.id==='booklet'))throw new Error('booklet should not remain a separate home program');
        if(document.getElementById('cnt-all').textContent!=='5')throw new Error('all count wrong');
        if(document.getElementById('cnt-design').textContent!=='1')throw new Error('design count wrong');
        if(document.getElementById('cnt-print').textContent!=='0')throw new Error('print count wrong');
        if(document.getElementById('cnt-edit').textContent!=='3')throw new Error('edit count wrong');
        if(document.getElementById('cnt-utility').textContent!=='1')throw new Error('utility count wrong');
        if(PROGRAMS.some(item=>item.id==='print-checker'))throw new Error('detailed review is now inside the design workspace');
        const smart=PROGRAMS.find(item=>item.id==='smart-print-layout');
        const layout=PROGRAMS.find(item=>item.id==='pdf-editor');
        const advanced=PROGRAMS.find(item=>item.id==='pdf-editor-advanced');
        const maker=PROGRAMS.find(item=>item.id==='ai-design-maker');
        if(maker?.name!=='표지 디자인'||maker?.url!=='ai-design-maker/'||maker?.cat!=='design')throw new Error('AI design maker entry wrong');
        if(smart?.url!=='smart-print-layout/')throw new Error('smart layout route wrong: '+smart?.url);
        if(smart?.name!=='스마트 인쇄배치')throw new Error('smart layout label wrong: '+smart?.name);
        if(smart?.cat!=='edit'||!smart?.catLabel?.includes('문서 편집'))throw new Error('smart layout must be under document editing');
        if(layout?.url!=='pdf-editor/')throw new Error('layout route wrong: '+layout?.url);
        if(advanced?.url!=='pdf-editor-advanced')throw new Error('advanced route wrong: '+advanced?.url);
        if(layout?.name!=='PDF배치')throw new Error('layout label wrong: '+layout?.name);
        if(advanced?.name!=='PDF편집')throw new Error('advanced label wrong: '+advanced?.name);
        if(layout?.cat!=='edit'||!layout?.catLabel?.includes('페이지 구성')||!layout?.tags?.includes('페이지 정리'))throw new Error('layout purpose metadata wrong');
        if(advanced?.cat!=='edit'||!advanced?.catLabel?.includes('정밀 보정')||!advanced?.tags?.includes('페이지 직접 편집'))throw new Error('advanced purpose metadata wrong');
        const documentEditMatches=PROGRAMS.filter(item=>[item.name,item.desc,item.catLabel,...(item.tags||[])].some(value=>String(value||'').includes('문서 편집')));
        if(!documentEditMatches.some(item=>item.id==='smart-print-layout')||!documentEditMatches.some(item=>item.id==='pdf-editor')||!documentEditMatches.some(item=>item.id==='pdf-editor-advanced'))throw new Error('document editing category no longer reaches split editors');
        const utility=PROGRAMS.find(item=>item.id==='pdf-suite');
        if(utility?.cat!=='utility'||utility?.name!=='PDF 유틸리티')throw new Error('PDF utility category wrong');
        const quick=document.getElementById('quickRow').textContent;
        for(const name of ['표지 디자인','스마트 인쇄배치','PDF배치','PDF편집','PDF 유틸리티']){
          if(!quick.includes(name))throw new Error('home entry missing: '+name);
        }
        if(quick.includes('인쇄물 사전 검토'))throw new Error('legacy print checker label still exposed');
        if(quick.includes('PDF 도구 모음'))throw new Error('legacy PDF tool still exposed');
        if(document.documentElement.dataset.pdfHomeWorkspace!=='unified-design-five-programs')throw new Error('unified design home marker missing');
        if(window.ProgramStudioPdfSuiteHome?.stage!=='pdf-home-unified-design-five-programs-v11')throw new Error('unified design home runtime stage missing');
        document.body.dataset.pdfHomeConsolidationSmoke='pass';
        result.textContent='PASS: home launcher preserves purpose-based program categories';
      }catch(error){
        document.body.dataset.pdfHomeConsolidationSmoke='fail';
        result.textContent='FAIL: '+String(error?.stack||error);
      }
    })();
  </script>
</body>
</html>
