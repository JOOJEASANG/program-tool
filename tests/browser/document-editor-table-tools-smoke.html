<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Document Editor Table Tools Smoke</title></head>
<body data-document-table-smoke="pending">
  <div id="result">PENDING</div>
  <iframe id="editorFrame" src="/document-editor/" style="width:1200px;height:900px;border:0"></iframe>
  <script>
  (async()=>{
    const result=document.getElementById('result'),frame=document.getElementById('editorFrame');
    const fail=error=>{document.body.dataset.documentTableSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
    const pass=message=>{document.body.dataset.documentTableSmoke='pass';result.textContent='PASS: '+message};
    const assert=(condition,message)=>{if(!condition)throw new Error(message)};
    const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40))}throw new Error('timeout: '+label)};
    try{
      await waitFor(()=>frame.contentWindow?.DocumentEditorApp&&frame.contentWindow?.DocumentEditorWorkflow&&frame.contentWindow?.DocumentEditorTableTools&&frame.contentDocument?.documentElement.dataset.documentEditorTableToolsReady==='1','document table tools ready');
      const win=frame.contentWindow,doc=frame.contentDocument,core=win.DocumentEditorApp,workflow=win.DocumentEditorWorkflow,tools=win.DocumentEditorTableTools;
      core.clearDraft();core.newDocument(true);
      core.setContent('<table><tbody><tr><td>A1</td><td>A2</td></tr><tr><td>B1</td><td>B2</td></tr></tbody></table><p id="linkText">Program Studio 링크</p>',{save:false});
      const page=doc.getElementById('documentPage');let table=page.querySelector('table');

      let selected=tools.selectCell(table.rows[0].cells[0]);
      assert(selected&&selected.rows===2&&selected.columns===2&&selected.rowIndex===0&&selected.columnIndex===0,'initial table selection is wrong');
      assert(tools.addRowAfter()===true,'add row failed');table=page.querySelector('table');assert(table.rows.length===3&&table.rows[1].cells.length===2,'row add did not produce 3x2 table');
      assert(tools.addColumnAfter()===true,'add column failed');table=page.querySelector('table');assert(table.rows.length===3&&[...table.rows].every(row=>row.cells.length===3),'column add did not produce 3x3 table');
      assert(tools.deleteColumn()===true,'delete column failed');table=page.querySelector('table');assert([...table.rows].every(row=>row.cells.length===2),'column delete did not restore 2 columns');
      assert(tools.deleteRow()===true,'delete row failed');table=page.querySelector('table');assert(table.rows.length===2&&[...table.rows].every(row=>row.cells.length===2),'row delete did not restore 2x2 table');

      const linkText=doc.getElementById('linkText').firstChild,range=doc.createRange(),selection=win.getSelection();range.selectNodeContents(linkText);selection.removeAllRanges();selection.addRange(range);
      const anchor=tools.applyLink('example.com');
      assert(anchor&&/^https:\/\/example\.com\/?$/.test(anchor.href),'safe bare-domain link was not normalized');
      assert(anchor.target==='_blank'&&anchor.rel.includes('noopener')&&anchor.rel.includes('noreferrer'),'safe link security attributes missing');
      const project=workflow.buildProject();assert(project.html.includes('https://example.com'),'safe link was not preserved in project payload');
      const safe=workflow.sanitizeDocumentHtml(project.html),probe=doc.createElement('div');probe.innerHTML=safe;
      const safeAnchor=probe.querySelector('a[href^="https://example.com"]');assert(safeAnchor&&safeAnchor.rel.includes('noopener'),'safe link was not preserved by sanitizer');
      const unsafe=workflow.sanitizeDocumentHtml('<p><a href="javascript:alert(1)">위험 링크</a></p>'),badProbe=doc.createElement('div');badProbe.innerHTML=unsafe;
      assert(!badProbe.querySelector('a')&&badProbe.textContent.includes('위험 링크'),'unsafe link scheme survived sanitizer');

      const anchorText=anchor.firstChild,unlinkRange=doc.createRange();unlinkRange.selectNodeContents(anchorText);selection.removeAllRanges();selection.addRange(unlinkRange);
      assert(tools.unlink()===true,'unlink failed');assert(!doc.getElementById('linkText').querySelector('a'),'anchor survived unlink');

      table=page.querySelector('table');tools.selectCell(table.rows[0].cells[0]);assert(tools.deleteTable()===true,'delete table failed');assert(!page.querySelector('table'),'table survived deleteTable');
      assert(core.getState().hasDraft===true,'table/link edits were not autosaved');

      document.body.dataset.tableRows='2';
      document.body.dataset.tableCols='2';
      document.body.dataset.linkSafe='true';
      document.body.dataset.linkUnsafeStripped='true';
      document.body.dataset.linkRemoved='true';
      document.body.dataset.tableDeleted='true';
      document.body.dataset.documentTableStage=tools.stage;
      pass('table row/column editing, safe links and table removal');
    }catch(error){fail(error)}
  })();
  </script>
</body>
</html>
