<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Workspace Navigation Smoke</title>
  <style>
    html,body{margin:0;height:100%;font-family:Arial,sans-serif}.design-flat-panel{width:320px;height:420px;overflow:auto;padding:11px 12px 16px;box-sizing:border-box}.side-card{height:150px;margin-bottom:16px;border:1px solid #ddd}.design-mode-card{height:100px;margin-bottom:16px;border:1px solid #ddd}
  </style>
  <script>history.replaceState(null,'','/design-editor/general.html?embed=1&mode=poster&app=poster');</script>
</head>
<body data-workspace-nav-smoke="pending">
  <div class="design-flat-panel">
    <div id="designEmbeddedModeCard" class="design-mode-card">setup</div>
    <div id="inspector" class="side-card">edit</div>
    <div id="designLayerTools" class="side-card">arrange</div>
    <div id="designFinalPrintCheckTools" class="side-card">output</div>
  </div>
  <script>
    let product='poster';
    window.DesignEditorEssentialWorkspace={
      currentType(){return product;},
      select(step){document.body.dataset.workspaceNavLastSelect=step;return true;}
    };
  </script>
  <script src="/js/design-editor/shared/workspace-navigation.js?v=20260831-1"></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{
      const assert=(ok,msg)=>{if(!ok)throw new Error(msg);};
      try{
        const nav=document.getElementById('designWorkspaceNavigation');
        assert(nav,'workspace navigation missing');
        const buttons=[...nav.querySelectorAll('[data-workspace-step]')];
        assert(buttons.length===4,'workspace navigation step count');
        assert(nav.querySelector('[data-workspace-product]')?.textContent==='포스터','poster product label missing');
        nav.querySelector('[data-workspace-step="edit"]').click();
        assert(document.body.dataset.workspaceNavLastSelect==='edit','edit navigation did not delegate');
        nav.querySelector('[data-workspace-step="output"]').click();
        assert(document.body.dataset.workspaceNavLastSelect==='output','output navigation did not delegate');
        product='cover';
        window.dispatchEvent(new Event('programstudio:design-product-change'));
        window.DesignEditorWorkspaceNavigation.sync();
        assert(nav.querySelector('[data-workspace-product]')?.textContent==='표지','product label did not sync');
        document.body.dataset.workspaceNavSteps=String(buttons.length);
        document.body.dataset.workspaceNavProduct='cover';
        document.body.dataset.workspaceNavSmoke='pass';
      }catch(error){
        document.body.dataset.workspaceNavSmoke='fail';
        document.body.textContent='FAIL: '+String(error?.stack||error);
      }
    },100),{once:true});
  </script>
</body>
</html>
