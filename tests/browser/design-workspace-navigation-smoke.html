<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Workspace Navigation Smoke</title>
  <style>
    html,body{margin:0;height:100%;font-family:Arial,sans-serif}.design-flat-panel{width:268px;height:420px;overflow:auto;padding:11px 12px 16px;box-sizing:border-box}.side-card{height:150px;margin-bottom:16px;border:1px solid #ddd}.design-mode-card{height:100px;margin-bottom:16px;border:1px solid #ddd}
  </style>
  <script>history.replaceState(null,'','/design-editor/general.html?embed=1&mode=poster&app=poster');</script>
</head>
<body data-workspace-nav-smoke="pending">
  <div class="design-flat-panel">
    <div id="designEmbeddedModeCard" class="design-mode-card">setup</div>
    <div id="designFinalPrintCheckTools" class="side-card">output</div>
  </div>
  <aside id="propertiesPanel"><div id="inspector">edit</div><div id="designLayerTools">arrange</div></aside>
  <script>
    let product='poster';
    window.DesignEditorEssentialWorkspace={
      currentType(){return product;},
      select(step){
        document.body.dataset.workspaceNavLastSelect=step;
        if(step==='edit'){document.documentElement.dataset.designContextPaneOpen='true';document.documentElement.dataset.designContextTab='properties';}
        else if(step==='arrange'){document.documentElement.dataset.designContextPaneOpen='true';document.documentElement.dataset.designContextTab='layers';}
        else document.documentElement.dataset.designContextPaneOpen='false';
        return true;
      }
    };
    window.DesignEditorSidebarMenuOrder={
      openForStep(step){document.body.dataset.workspaceNavSidebarStep=step;return step==='output'?'output':'structure';}
    };
  </script>
  <script src="/js/design-editor/shared/workspace-navigation.js?v=20260901-4"></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{
      const assert=(ok,msg)=>{if(!ok)throw new Error(msg);};
      try{
        const nav=document.getElementById('designWorkspaceNavigation');
        assert(nav,'workspace navigation missing');
        const buttons=[...nav.querySelectorAll('[data-workspace-step]')];
        assert(buttons.length===4,'workspace navigation step count');
        assert(nav.querySelector('[data-workspace-product]')?.textContent==='포스터','poster product label missing');
        nav.querySelector('[data-workspace-step="edit"]').click();
        assert(document.body.dataset.workspaceNavLastSelect==='edit','edit navigation did not delegate');
        assert(!document.body.dataset.workspaceNavSidebarStep,'edit must not open a competing left sidebar section');
        assert(document.documentElement.dataset.designContextTab==='properties','edit must own property context pane');
        nav.querySelector('[data-workspace-step="arrange"]').click();
        assert(document.body.dataset.workspaceNavLastSelect==='arrange','arrange navigation did not delegate');
        assert(document.documentElement.dataset.designContextTab==='layers','arrange must own layer context pane');
        nav.querySelector('[data-workspace-step="output"]').click();
        assert(document.body.dataset.workspaceNavLastSelect==='output','output navigation did not delegate');
        assert(document.body.dataset.workspaceNavSidebarStep==='output','output navigation did not prepare sidebar');
        product='cover';
        window.dispatchEvent(new Event('programstudio:design-product-change'));
        window.DesignEditorWorkspaceNavigation.sync();
        assert(nav.querySelector('[data-workspace-product]')?.textContent==='표지','product label did not sync');
        assert(window.DesignEditorWorkspaceNavigation.stage==='shared-workspace-navigation-v3','workspace navigation stage mismatch');
        document.body.dataset.workspaceNavSteps=String(buttons.length);
        document.body.dataset.workspaceNavProduct='cover';
        document.body.dataset.workspaceNavSidebar='context-split';
        document.body.dataset.workspaceNavSmoke='pass';
      }catch(error){
        document.body.dataset.workspaceNavSmoke='fail';document.body.textContent='FAIL: '+String(error?.stack||error);
      }
    },100),{once:true});
  </script>
</body>
</html>
