<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>PDF selected source page margin smoke</title>
  <style>
    #thumbArea{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:5px;width:240px}
    #thumbArea .thumb-item{display:flex;flex-direction:column;align-items:center;width:100%}
    #thumbArea .thumb-wrap{width:100%;position:relative;background:#fff;border:2px solid #dbe5ef}
    #thumbArea .thumb-wrap canvas{width:100%;display:block}
  </style>
</head>
<body data-pdf-selected-margin-smoke="running">
  <div id="result">RUNNING</div>
  <div id="sidebar">
    <div class="thumb-hint"></div>
    <div id="thumbArea"></div>
  </div>
  <div id="previewScroll"></div>
  <div id="thumbCtxMenu"></div>
  <div id="paperSettings">
    <div class="grid2">
      <div class="field"><label>기본 가로 여백</label><input id="marginH" type="number" value="10"></div>
      <div class="field"><label>기본 세로 여백</label><input id="marginV" type="number" value="10"></div>
    </div>
    <input id="gap" type="number" value="5">
    <input id="bookletCheck" type="checkbox">
    <input id="bookletSpineGather" type="checkbox" checked>
    <input id="facingPages" type="checkbox">
  </div>
  <script>
    window.uploadedFiles = [{name:'첫째.pdf'}, {name:'둘째.pdf'}];
    function canvas() { const c = document.createElement('canvas'); c.width=100; c.height=140; return c; }
    window.parsedPages = [0,0,1,1].map((fileIndex, i) => ({
      id:i+1, file_index:fileIndex, page_index:i%2, pageType:'pdf',
      pdfPage:{ id:i+1 }, thumbCanvas:canvas(), excluded:false, rotation:0,
      sourceFile:uploadedFiles[fileIndex].name
    }));
    window.PdfBookletSpineGeometry = {
      cell:(column,pw,margins)=>column===0
        ? {x:margins.left,width:pw/2-margins.left,align:'right',baseMargins:{...margins,right:0}}
        : {x:pw/2,width:pw/2-margins.right,align:'left',baseMargins:{...margins,left:0}}
    };
    window.nup=1;
    window.BOOKLET_STRIPS={};
    window.getLayout=()=>({cols:1, rows:1});
    window.groupByNup=(pages)=>[{n:1, pages}];
    window.schedulePreview=()=>{};
    window.triggerPreview=()=>Promise.resolve();
    window.getSettings=()=>({pw:210,ph:297,mh:10,mv:10,gp:5});
    window.buildOutputPage=()=>{};
    window.buildAllPages=async()=>[];
    window.applyDocEdits=()=>{};
    window.getPageSrc=page=>page.thumbCanvas;
    window.renderPlacements=[];
    window.drawPageInCell=(_ctx,_src,x,y,w,h,_mm2px,align)=>{const p={x,y,w,h,align};window.lastRenderPlacement=p;window.renderPlacements.push(p)};
    window.displayPreview=()=>{};
    window.renderPdfPage=async ()=>canvas();
    window.showStatus=()=>{};
    window.hideStatus=()=>{};
    window._openThumbCtxMenu=()=>{};
    window.renderThumbs=()=>{
      const area=document.getElementById('thumbArea');
      area.replaceChildren();
      parsedPages.forEach(page=>{
        const item=document.createElement('div');
        item.className='thumb-item';item.dataset.id=page.id;
        const wrap=document.createElement('div');
        wrap.className='thumb-wrap';wrap.appendChild(canvas());
        const number=document.createElement('span');number.className='thumb-num';number.textContent=String(page.id);
        wrap.appendChild(number);
        item.appendChild(wrap);
        area.appendChild(item);
      });
    };
    renderThumbs();
  </script>
  <script src="/js/pdf-editor/page-selection-preview-focus.js?v=20261014-2"></script>
  <script src="/js/pdf-editor/layout-export.js?v=20261014-4"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const delay=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
      const fail=(message)=>{
        document.body.dataset.pdfSelectedMarginSmoke='fail';
        result.textContent='FAIL: '+message;
      };
      try {
        await delay(480);
        const scope=document.getElementById('pdfCellMarginScope');
        const apply=document.getElementById('pdfCellMarginApply');
        const left=document.getElementById('pdfCellMarginLeft');
        const top=document.getElementById('pdfCellMarginTop');
        if (!scope||!apply||!left)throw Error('individual margin panel did not mount');
        const thumbArea=document.getElementById('thumbArea');
        const firstTwo=[...thumbArea.querySelectorAll('.thumb-item')].slice(0,2);
        if(getComputedStyle(thumbArea).display!=='grid')throw Error('page selection expanded compact thumbnail grid');
        if(firstTwo.length!==2)throw Error('thumbnail fixture is incomplete');
        if(Math.abs(firstTwo[0].getBoundingClientRect().top-firstTwo[1].getBoundingClientRect().top)>2)
          throw Error('thumbnails became a full-width vertical list');
        if(firstTwo[0].getBoundingClientRect().width>=150)
          throw Error('thumbnail became too wide');
        if(!apply.disabled)throw Error('apply should initially be disabled');
        if(!window.PdfEditorPageSelection)throw Error('selection controller unavailable');
        const wraps=[...document.querySelectorAll('#thumbArea .thumb-wrap')];
        wraps[1].dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
        await delay(120);
        if(apply.disabled||left.disabled)throw Error('selecting a thumbnail did not enable inputs');
        left.value='12';apply.click();
        if(parsedPages[1].cellMargins?.left!==12)throw Error('selected page margin was not applied');
        if(parsedPages[1].cellMargins?.right!==undefined)throw Error('editing one direction incorrectly froze an inherited global edge');
        if(parsedPages[0].cellMargins || parsedPages[2].cellMargins)throw Error('unselected pages were modified');
        wraps[3].dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,ctrlKey:true}));
        await delay(100);
        top.value='5';apply.click();
        if(parsedPages[1].cellMargins?.top!==5 || parsedPages[3].cellMargins?.top!==5)
          throw Error('Ctrl-selected pages did not receive independent top margin');
        scope.value='file:1';scope.dispatchEvent(new Event('change',{bubbles:true}));
        if(apply.disabled)throw Error('source-file scope should enable fields');
        const right=document.getElementById('pdfCellMarginRight');
        right.value='7';apply.click();
        if(parsedPages[2].cellMargins?.right!==7 || parsedPages[3].cellMargins?.right!==7)
          throw Error('file scope did not apply to all pages from that PDF');
        if(parsedPages[1].cellMargins?.right)throw Error('file scope changed another PDF');
        const values=window.PdfEditorLayoutExport.marginValues();
        if(values.left!==10||values.right!==10)throw Error('paper margin was changed');
        // A 0mm page override must supersede the global 10mm, not add to it.
        scope.value='selected';scope.dispatchEvent(new Event('change',{bubbles:true}));
        wraps[0].dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
        await delay(100);
        for(const edge of ['Left','Right','Top','Bottom']){
          const input=document.getElementById('pdfCellMargin'+edge);
          if(input.value!=='10')throw Error('unset source margin should display inherited 10mm');
          input.value='0';
        }
        apply.click();
        if(Object.values(parsedPages[0].cellMargins||{}).length!==4
          || Object.values(parsedPages[0].cellMargins).some(value=>value!==0))
          throw Error('explicit zero source margins were discarded');
        if(window.PdfEditorLayoutExport.pageCellMargins(parsedPages[0]).left!==0)
          throw Error('0mm override was not effective');
        if(window.PdfEditorLayoutExport.pageCellMargins(parsedPages[1]).right!==10)
          throw Error('other pages no longer inherit global 10mm');
        window.buildOutputPage([parsedPages[0]],0,1,1,1,false,0,false,1);
        const zeroPlacement=window.lastRenderPlacement;
        if(!zeroPlacement || Math.abs(zeroPlacement.x)>0.01
          || Math.abs(zeroPlacement.y)>0.01
          || Math.abs(zeroPlacement.w-210)>0.01
          || Math.abs(zeroPlacement.h-297)>0.01)
          throw Error('preview added global margin to selected 0mm override: '+JSON.stringify(zeroPlacement));
        document.getElementById('pdfCellMarginReset').click();
        if(parsedPages[0].cellMargins)throw Error('reset did not restore inheritance');
        if(window.PdfEditorLayoutExport.pageCellMargins(parsedPages[0]).left!==10)
          throw Error('reset must inherit 10mm not preserve explicit zero');
        window.buildOutputPage([parsedPages[0]],0,1,1,1,false,0,false,1);
        const inheritedPlacement=window.lastRenderPlacement;
        if(Math.abs(inheritedPlacement.x-10)>0.01 || Math.abs(inheritedPlacement.y-10)>0.01
          || Math.abs(inheritedPlacement.w-190)>0.01 || Math.abs(inheritedPlacement.h-277)>0.01)
          throw Error('preview did not restore global 10mm margin: '+JSON.stringify(inheritedPlacement));
        // When booklet is active, the left and right printed pages should
        // touch the physical fold (105mm for this 210mm test paper), rather
        // than leave the global N-up 5mm gutter.
        window.BOOKLET_STRIPS={2:1};
        window.nup=2;
        document.getElementById('bookletCheck').checked=true;
        window.renderPlacements.length=0;
        window.buildOutputPage([parsedPages[0],parsedPages[0]],0,2,1,1,false,0,false,1);
        const [foldLeft,foldRight]=window.renderPlacements;
        if(foldLeft.align!=='right'||foldRight.align!=='left')
          throw Error('booklet content was not aligned inward to the fold');
        if(Math.abs(foldLeft.x+foldLeft.w-105)>0.01 || Math.abs(foldRight.x-105)>0.01)
          throw Error('booklet placed pages did not touch the center fold: '+JSON.stringify(window.renderPlacements));
        document.getElementById('bookletSpineGather').checked=false;
        window.renderPlacements.length=0;
        window.buildOutputPage([parsedPages[0],parsedPages[0]],0,2,1,1,false,0,false,1);
        if(window.renderPlacements[0].x+window.renderPlacements[0].w>=window.renderPlacements[1].x)
          throw Error('disabling fold alignment did not restore normal N-up gap');
        document.body.dataset.pdfSelectedMarginSmoke='pass';
        result.textContent='PASS: selected-page and per-file insets activate and preserve paper margins';
      }catch(error){fail(String(error.stack||error));}
    })();
  </script>
</body></html>
