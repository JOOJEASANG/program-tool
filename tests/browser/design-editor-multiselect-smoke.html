<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Multi Selection Smoke</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif}.editor-main{height:520px}.editor-toolbar{height:54px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ddd}.artboard{position:relative;width:420px;height:420px;margin:20px;background:#fff}.design-text,.phase2-extra-object{position:absolute;box-sizing:border-box}.design-text{height:24px}.phase2-extra-object{height:42px}#designCanvasQuickbar{display:block}.sidebar{display:none}
  </style>
  <script>history.replaceState(null,'','/design-editor/general.html?embed=1&mode=poster&multiSelection=20260828-1');</script>
</head>
<body data-design-multiselect-status="pending">
  <div id="result">PENDING</div>
  <div class="editor-main">
    <div class="editor-toolbar">toolbar <span id="saveState">현재 작업</span></div>
    <div id="designSelectionContextbar">single context</div>
    <div id="designCanvasQuickbar">floating quickbar</div>
    <div id="artboard" class="artboard"></div>
    <div id="editorStatus"></div>
  </div>
  <aside class="sidebar"><div id="inspector"></div></aside>
  <script>
    const textA={id:'text-a',type:'text',text:'A',x:10,y:10,w:30,size:18,lineHeight:1.2,locked:false};
    const textB={id:'text-b',type:'text',text:'B',x:70,y:60,w:30,size:18,lineHeight:1.2,locked:false};
    const shapeC={id:'shape-c',type:'shape',shape:'rect',name:'C',x:150,y:130,w:20,h:20,locked:false,opacity:100};
    const project={width:200,height:200,bleed:3,safe:5,activeSurface:'front',surfaces:[{id:'front',elements:[textA,textB],extras:[shapeC]}]};
    function renderObjects(){
      const board=document.getElementById('artboard');
      board.querySelectorAll('.design-text,.phase2-extra-object').forEach(node=>node.remove());
      project.surfaces[0].elements.forEach((item,index)=>{
        const node=document.createElement('div');node.className='design-text'+(index===0&&document.body.dataset.seeded!=='1'?' selected':'');node.dataset.id=item.id;node.textContent=item.text||'T';
        node.style.left=(item.x*2)+'px';node.style.top=(item.y*2)+'px';node.style.width=(item.w*2)+'px';node.style.height='24px';board.appendChild(node);
      });
      project.surfaces[0].extras.forEach(item=>{
        const node=document.createElement('div');node.className='phase2-extra-object';node.dataset.extraId=item.id;node.textContent=item.name||'X';
        node.style.left=(item.x*2)+'px';node.style.top=(item.y*2)+'px';node.style.width=(item.w*2)+'px';node.style.height=(item.h*2)+'px';board.appendChild(node);
      });
      document.body.dataset.seeded='1';
    }
    renderObjects();
    window.DesignEditorApp={get project(){return project;},resumeDraft(){renderObjects();}};
    window.DesignEditorPhase2={sync(){renderObjects();}};
    window.DesignEditorSelectionContextbar={sync(){window.__singleSync=(window.__singleSync||0)+1;}};
    window.DesignEditorWorkflowV2={activateStep(step){window.__lastStep=step;}};
    window.DesignEditorDraftScope={saveCurrent(reason){window.__saveReason=reason;}};
  </script>
  <script src="/js/design-editor/multi-selection-context.js?v=20260828-1"></script>
  <script>
    window.addEventListener('DOMContentLoaded',async()=>{
      const result=document.getElementById('result');
      const assert=(ok,message)=>{if(!ok)throw new Error(message);};
      const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      const total=()=>project.surfaces[0].elements.length+project.surfaces[0].extras.length;
      const event=(type,init={})=>new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:7,...init});
      try{
        const api=window.DesignEditorMultiSelection;assert(api,'multi selection runtime missing');
        const b=document.querySelector('[data-id="text-b"]');
        const c=document.querySelector('[data-extra-id="shape-c"]');
        b.dispatchEvent(event('pointerdown',{shiftKey:true,clientX:100,clientY:80}));
        c.dispatchEvent(event('pointerdown',{shiftKey:true,clientX:220,clientY:160}));
        api.sync();
        assert(api.records.length===3,'modifier selection did not select 3 records');
        const bar=document.getElementById('designMultiSelectionContextbar');
        assert(bar&&!bar.hidden&&document.documentElement.dataset.designMultiSelection==='3','multi contextbar is not active');
        assert(document.querySelectorAll('.ps-multi-selected').length===3,'multi selection visual markers missing');
        assert(getComputedStyle(document.getElementById('designCanvasQuickbar')).display==='none','floating quickbar not suppressed');
        document.body.dataset.designMultiselectSelection='modifier-3';

        api.align('left');
        assert(textA.x===textB.x&&textB.x===shapeC.x,'left alignment failed');
        textA.x=10;textB.x=80;shapeC.x=160;
        api.distribute('horizontal');
        const gap1=textB.x-(textA.x+textA.w),gap2=shapeC.x-(textB.x+textB.w);
        assert(Math.abs(gap1-gap2)<.001,'horizontal equal spacing failed');
        textA.y=10;textB.y=75;shapeC.y=155;
        api.distribute('vertical');
        assert(api.records.length===3,'selection lost after vertical distribute');
        document.body.dataset.designMultiselectAlign='selection-bounds';
        document.body.dataset.designMultiselectDistribute='horizontal-vertical';

        const groupId=api.group();assert(groupId&&api.records.every(record=>record.item.groupId===groupId),'group failed');
        assert(api.ungroup()&&api.records.every(record=>!record.item.groupId),'ungroup failed');
        const groupAgain=api.group();assert(groupAgain,'regroup failed');
        document.body.dataset.designMultiselectGroup='group-ungroup';

        const before=api.records.map(record=>({key:record.key,x:record.item.x,y:record.item.y}));
        const selectedNode=document.querySelector('.ps-multi-selected');
        selectedNode.dispatchEvent(event('pointerdown',{clientX:120,clientY:120}));
        document.dispatchEvent(event('pointermove',{clientX:140,clientY:132}));
        document.dispatchEvent(event('pointerup',{clientX:140,clientY:132}));
        const after=api.records;
        const deltas=before.map(start=>{
          const record=after.find(item=>item.key===start.key);return {dx:record.item.x-start.x,dy:record.item.y-start.y};
        });
        assert(deltas.every(delta=>delta.dx>0&&delta.dy>0),'group drag did not move all records');
        assert(deltas.every(delta=>Math.abs(delta.dx-deltas[0].dx)<.01&&Math.abs(delta.dy-deltas[0].dy)<.01),'group drag did not preserve relative positions');
        api.moveBy(.5,.5);
        document.body.dataset.designMultiselectDrag='group-drag-and-nudge';

        const locked=api.toggleLock();assert(locked===true&&project.surfaces[0].elements.every(item=>item.locked)&&project.surfaces[0].extras.every(item=>item.locked),'bulk lock failed');
        await wait(90);
        assert(api.records.length===3,'selection lost after lock reload');
        const unlocked=api.toggleLock();assert(unlocked===false&&project.surfaces[0].elements.every(item=>!item.locked)&&project.surfaces[0].extras.every(item=>!item.locked),'bulk unlock failed');
        await wait(90);

        const newKeys=api.duplicate();assert(Array.isArray(newKeys)&&newKeys.length===3&&total()===6,'bulk duplicate failed');
        await wait(110);assert(api.records.length===3,'duplicated set was not reselected');
        assert(api.remove()&&total()===3,'bulk delete failed');
        document.body.dataset.designMultiselectBulk='lock-duplicate-delete';

        document.body.dataset.designMultiselectStatus='pass';
        result.textContent='PASS: multi selection: 선택·정렬·동일 간격·그룹·이동·잠금·복제·삭제가 확인됨';
      }catch(error){
        document.body.dataset.designMultiselectStatus='fail';
        result.textContent='FAIL: '+String(error?.stack||error);
      }
    },{once:true});
  </script>
</body>
</html>
