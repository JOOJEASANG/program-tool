<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Shape Border Smoke</title>
  <style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:10px}.sidebar{width:300px}.side-card{padding:6px}.field{margin:4px}.field-grid{display:grid;grid-template-columns:1fr 1fr}.check-row{display:flex}.hidden{display:none!important}#artboard{position:relative;width:648px;height:909px;background:#fff}.phase2-extra-object{position:absolute}.phase2-shape-inner{width:100%;height:100%}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?embed=1&shape-border-smoke=1');
    const project={name:'도형 테두리 테스트',width:210,height:297,bleed:3,safe:6,activeSurface:'front',surfaces:[{id:'front',label:'앞면',background:'#ffffff',elements:[],extras:[]}]};
    let saveCount=0;
    window.DesignEditorApp={get project(){return project;}};
    window.DesignEditorDraftScope={saveCurrent(){saveCount+=1;return true;}};
  </script>
</head>
<body data-shape-border-smoke="pending">
  <div id="result">PENDING</div><div id="editorStatus"></div><div id="saveState"></div>
  <aside class="sidebar"><section id="inspector" class="side-card"></section></aside>
  <div id="artboard"></div>
  <script src="/js/design-editor/phase2.js?v=20260821-1"></script>
  <script src="/js/design-editor/output.js?v=20260821-1"></script>
  <script src="/js/design-editor/shape-border-controls.js?v=20260827-2"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.shapeBorderSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
      const pass=message=>{document.body.dataset.shapeBorderSmoke='pass';result.textContent='PASS: '+message};
      const assert=(condition,message)=>{if(!condition)throw new Error(message)};
      const waitFor=async(predicate,label,timeout=9000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,35))}throw new Error('timeout: '+label)};
      const pixelAt=(canvas,x,y)=>canvas.getContext('2d').getImageData(Math.max(0,Math.min(canvas.width-1,Math.round(x))),Math.max(0,Math.min(canvas.height-1,Math.round(y))),1,1).data;
      const pxPerMm=300/25.4;
      try{
        await waitFor(()=>window.DesignEditorPhase2&&window.DesignEditorOutput&&window.DesignEditorShapeBorderControls,'shape runtimes');
        const api=window.DesignEditorShapeBorderControls;
        assert(api.stage==='shape-border-none-screen-and-print-safe','runtime stage mismatch');

        window.DesignEditorPhase2.addShape('rect');
        await waitFor(()=>project.surfaces[0].extras.length===1&&document.querySelector('.phase2-extra-object.selected'),'rectangle add');
        const rect=project.surfaces[0].extras[0];rect.fill='#ff0000';rect.stroke='#000000';rect.strokeWidth=2;window.DesignEditorPhase2.sync();
        await waitFor(()=>document.getElementById('designShapeBorderToggle'),'rectangle border toggle');
        assert(api.getSelectedShapeId()===rect.id,'selected rectangle resolution failed');
        assert(document.getElementById('designShapeBorderToggle').checked===true,'rectangle border should start enabled');

        // Base Phase2 rebuilds the inspector. The extension must restore its control afterwards.
        window.DesignEditorPhase2.sync();
        await waitFor(()=>document.getElementById('designShapeBorderToggle'),'border toggle after inspector rebuild');
        const toggle=document.getElementById('designShapeBorderToggle');
        toggle.checked=false;toggle.dispatchEvent(new Event('change',{bubbles:true}));
        await waitFor(()=>rect.strokeDisabled===true&&rect.stroke==='rgba(0,0,0,0)','disable rectangle border');
        await waitFor(()=>document.querySelector('.phase2-extra-object.selected .phase2-shape-inner')?.style.border==='none','rectangle screen border none');
        assert(document.getElementById('designShapeBorderState').textContent.includes('300DPI'),'print guidance missing');
        assert(document.querySelector('[data-extra-field="stroke"]').disabled===true,'stroke color input not disabled');
        assert(document.querySelector('[data-extra-field="strokeWidth"]').disabled===true,'stroke width input not disabled');

        const disabledRender=await window.DesignEditorOutput.renderSurface(project,project.surfaces[0]);
        const rectSampleX=(project.bleed+rect.x+rect.w/2)*pxPerMm;
        const rectSampleY=(project.bleed+rect.y+.5)*pxPerMm;
        const noBorder=pixelAt(disabledRender.canvas,rectSampleX,rectSampleY);
        assert(noBorder[0]>200&&noBorder[1]<70&&noBorder[2]<70,'disabled rectangle border still appears in 300DPI output');

        const savedProject=JSON.parse(JSON.stringify(project));
        const savedRender=await window.DesignEditorOutput.renderSurface(savedProject,savedProject.surfaces[0]);
        const savedNoBorder=pixelAt(savedRender.canvas,rectSampleX,rectSampleY);
        assert(savedProject.surfaces[0].extras[0].strokeDisabled===true,'strokeDisabled was not preserved in saved project data');
        assert(savedNoBorder[0]>200&&savedNoBorder[1]<70&&savedNoBorder[2]<70,'saved borderless rectangle regained a border in 300DPI output');

        api.setBorderEnabled(true);
        await waitFor(()=>rect.strokeDisabled===false&&rect.stroke==='#000000','restore rectangle border');
        const enabledRender=await window.DesignEditorOutput.renderSurface(project,project.surfaces[0]);
        const withBorder=pixelAt(enabledRender.canvas,rectSampleX,rectSampleY);
        assert(withBorder[0]<90&&withBorder[1]<90&&withBorder[2]<90,'restored rectangle border missing from 300DPI output');

        window.DesignEditorPhase2.addShape('ellipse');
        await waitFor(()=>project.surfaces[0].extras.length===2&&api.getSelectedShapeId()===project.surfaces[0].extras[1].id,'ellipse selection');
        const ellipse=project.surfaces[0].extras[1];ellipse.fill='#0000ff';ellipse.stroke='#00ff00';ellipse.strokeWidth=2;window.DesignEditorPhase2.sync();
        await waitFor(()=>document.getElementById('designShapeBorderToggle'),'ellipse border toggle');
        api.setBorderEnabled(false);
        await waitFor(()=>ellipse.strokeDisabled===true&&document.querySelector('.phase2-extra-object.selected .phase2-shape-inner')?.style.border==='none','ellipse border none');
        const ellipseRender=await window.DesignEditorOutput.renderSurface(project,project.surfaces[0]);
        const ellipseSampleX=(project.bleed+ellipse.x+ellipse.w/2)*pxPerMm;
        const ellipseSampleY=(project.bleed+ellipse.y+1)*pxPerMm;
        const ellipseNoBorder=pixelAt(ellipseRender.canvas,ellipseSampleX,ellipseSampleY);
        assert(ellipseNoBorder[2]>150&&ellipseNoBorder[0]<120&&ellipseNoBorder[1]<120,'disabled ellipse border does not render as fill-only at 300DPI');

        window.DesignEditorPhase2.addShape('line');
        await waitFor(()=>project.surfaces[0].extras.length===3&&document.querySelector('.phase2-extra-object.selected'),'line add');
        await waitFor(()=>!document.getElementById('designShapeBorderToggle'),'line should not show border-none toggle');

        await waitFor(()=>saveCount>0,'draft save');
        document.body.dataset.disabledPixel=Array.from(noBorder.slice(0,3)).join(',');
        document.body.dataset.enabledPixel=Array.from(withBorder.slice(0,3)).join(',');
        document.body.dataset.ellipsePixel=Array.from(ellipseNoBorder.slice(0,3)).join(',');
        document.body.dataset.shapeBorderStage=api.stage;
        pass('rectangle/ellipse border-none, inspector rebuild, saved project and real 300DPI render are stable');
      }catch(error){fail(error)}
    })();
  </script>
</body>
</html>
