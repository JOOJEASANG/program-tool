<!doctype html><html lang="ko" class="ps-ui-v2" data-program-surface="approval"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approval Surface Polish V3 Smoke</title><script>history.replaceState(null,'','/approval-waiting.html?phase6-smoke=1');</script><style>*{box-sizing:border-box}body{margin:0}.card{max-width:520px;margin:20px auto;padding:20px}.actions{display:flex;gap:8px}.btn{min-width:0}</style></head><body data-phase6-smoke="pending"><main class="card"><div class="icon">⏳</div><h1 id="title">관리자 승인 대기</h1><div id="statusBox" class="status">승인 상태를 확인하고 있습니다.</div><div class="actions"><button class="btn">상태 확인</button><button class="btn">로그아웃</button></div></main><div id="result">PENDING</div><script src="/js/surface-polish-v3.js?v=smoke"></script><script>(async()=>{const result=document.getElementById('result'),assert=(v,m)=>{if(!v)throw new Error(m)},wait=async(p,l)=>{for(let i=0;i<80;i++){if(p())return;await new Promise(r=>setTimeout(r,15))}throw new Error('timeout: '+l)};try{await wait(()=>window.ProgramStudioPhase6,'api');const card=document.querySelector('.card'),status=document.getElementById('statusBox');assert(status.getAttribute('role')==='status','status role missing');assert(status.getAttribute('aria-live')==='polite','aria-live missing');assert(card.dataset.accountState==='pending','initial pending state wrong');assert(document.querySelector('.ps-approval-note'),'approval note missing');document.getElementById('title').textContent='계정 이용 중지';await Promise.resolve();assert(card.dataset.accountState==='suspended','suspended state not synchronized');document.getElementById('title').textContent='상태 확인 오류';status.textContent='승인 상태 확인에 실패했습니다.';await Promise.resolve();assert(card.dataset.accountState==='error','error state not synchronized');assert(document.documentElement.scrollWidth<=window.innerWidth+1,'mobile horizontal overflow');document.body.dataset.phase6Smoke='pass';result.textContent='PA
