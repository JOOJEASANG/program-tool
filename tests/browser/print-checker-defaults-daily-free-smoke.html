<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Print checker defaults daily free smoke</title></head>
<body>
  <div id="productGrid"></div>
  <section id="specSection" hidden><div class="sb-title">사양 입력</div><form id="specForm"></form></section>
  <section class="sb-section" id="uploadSection"><div id="uploadZone"><div id="uploadFilename" style="display:none"></div></div></section>
  <input id="fileInput" type="file">
  <span id="uploadFileInfo" hidden></span><span id="uploadError" hidden></span>
  <div id="adjPanel" hidden>
    <div id="sideSelectRow" hidden><button class="side-btn active" data-side="front" type="button">앞면</button><button class="side-btn" data-side="back" type="button">뒷면</button></div>
    <input type="checkbox" id="fileHasBleed">
    <input id="adjX" type="range" value="0"><span id="adjXVal"></span>
    <input id="adjY" type="range" value="0"><span id="adjYVal"></span>
    <input id="adjScale" type="range" value="100"><span id="adjScaleVal"></span>
    <button id="resetAdjBtn" type="button">reset</button>
  </div>
  <div class="action-row" id="actionRow"><button id="runBtn" type="button">run</button><button id="resetBtn" type="button">reset</button></div>
  <div class="canvas-tips"></div><div style="width:900px"><canvas id="previewCanvas"></canvas><div id="canvasFileInfo" hidden></div></div>
  <section id="leafletGuide" hidden></section><section id="impositionGuide" hidden></section>
  <section id="reportSection" hidden><div id="reportSummary"></div><div id="reportGrid"></div></section>

  <script>
    history.replaceState(null,'','/print-checker');
    window.__quotaCommits=0;
    window.ProgramPdfDailyFree={
      async canStart(){return {ok:true,status:{remaining:3}};},
      async commitSuccess(){window.__quotaCommits+=1;return {remaining:2};}
    };
  </script>
  <script src="../../js/print-checker/print-checker.js"></script>
  <script src="../../js/print-checker/defaults-live.js"></script>
  <script src="../../js/print-checker/booklet-layout-only.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded',async()=>{
      const fail=(message)=>{
        document.documentElement.dataset.printCheckerDefaultsDailyFreeSmoke='fail';
        const out=document.createElement('pre');out.textContent='FAIL '+message;document.body.appendChild(out);
      };
      try{
        await new Promise(r=>setTimeout(r,80));
        const initialProduct=PrintChecker.getState().product==='flyer';
        const initialValues=document.getElementById('trimW')?.value==='210'
          &&document.getElementById('trimH')?.value==='297'
          &&document.getElementById('bleed')?.value==='3'
          &&document.getElementById('safeZone')?.value==='3';
        const preset=document.getElementById('printSizePreset');
        const initialPreset=preset?.value==='a4';
        const summary=document.getElementById('printCheckerLiveSummary');
        const initialCanvas=document.getElementById('previewCanvas').width>0&&document.getElementById('previewCanvas').height>0;
        const summaryOk=summary?.textContent.includes('A4')&&summary.textContent.includes('210 × 297 mm');

        preset.value='a5';
        preset.dispatchEvent(new Event('change',{bubbles:true}));
        await new Promise(r=>setTimeout(r,20));
        const presetChanged=document.getElementById('trimW').value==='148'&&document.getElementById('trimH').value==='210';

        document.getElementById('trimW').value='155';
        document.getElementById('trimW').dispatchEvent(new Event('input',{bubbles:true}));
        const customMode=preset.value==='custom';

        document.querySelector('[data-product="cover"]')?.click();
        await new Promise(r=>setTimeout(r,50));
        const coverDefaults=PrintChecker.getState().product==='cover'
          &&document.getElementById('trimW')?.value==='148'
          &&document.getElementById('trimH')?.value==='210'
          &&document.getElementById('paperType')?.value==='mojo80'
          &&document.getElementById('pageCount')?.value==='100'
          &&document.getElementById('spine')?.value==='5'
          &&document.getElementById('bleed')?.value==='3'
          &&document.getElementById('safeZone')?.value==='3';

        document.getElementById('runBtn').click();
        await new Promise(r=>setTimeout(r,40));
        const quotaCommitted=window.__quotaCommits===1;
        const reportVisible=document.getElementById('reportSection').hidden===false;

        document.querySelector('[data-product="booklet"]')?.click();
        await new Promise(r=>setTimeout(r,100));
        const bookletPages=document.getElementById('bookletPages');
        const bookletOnly=PrintChecker.getState().product==='booklet'
          &&document.querySelectorAll('#specForm .spec-field').length===1
          &&bookletPages?.value==='8'
          &&bookletPages?.min==='1'
          &&!document.getElementById('trimW')
          &&!document.getElementById('trimH')
          &&!document.getElementById('bleed')
          &&!document.getElementById('safeZone')
          &&!document.getElementById('paperType')
          &&!document.getElementById('printSizePreset');
        const bookletMode=document.documentElement.dataset.printCheckerBookletLayoutOnly==='1'
          &&document.getElementById('uploadSection').classList.contains('pc-booklet-only-hidden')
          &&document.getElementById('actionRow').classList.contains('pc-booklet-only-hidden')
          &&document.getElementById('impositionGuide').classList.contains('pc-booklet-only-hidden')
          &&summary.classList.contains('pc-booklet-only-hidden');
        const bookletCanvas=document.getElementById('previewCanvas').width>0&&document.getElementById('previewCanvas').height>220;

        bookletPages.value='20';
        bookletPages.dispatchEvent(new Event('input',{bubbles:true}));
        await new Promise(r=>setTimeout(r,70));
        const bookletTwenty=PrintChecker.getState().specs.bookletPages===20
          &&PrintChecker.computeImposition(20).sheets===5
          &&document.getElementById('previewCanvas').height>500;
        const bookletDoesNotCharge=window.__quotaCommits===1;

        document.querySelector('[data-product="flyer"]')?.click();
        await new Promise(r=>setTimeout(r,80));
        const restored=PrintChecker.getState().product==='flyer'
          &&document.documentElement.dataset.printCheckerBookletLayoutOnly==='0'
          &&!document.getElementById('uploadSection').classList.contains('pc-booklet-only-hidden')
          &&!document.getElementById('actionRow').classList.contains('pc-booklet-only-hidden')
          &&document.getElementById('trimW')?.value==='210'
          &&document.getElementById('trimH')?.value==='297';
        const ready=document.documentElement.dataset.printCheckerDefaultsLive==='ready'
          &&document.documentElement.dataset.printCheckerBookletLayout==='ready';

        const pass=initialProduct&&initialValues&&initialPreset&&initialCanvas&&summaryOk&&presetChanged&&customMode&&coverDefaults&&quotaCommitted&&reportVisible&&bookletOnly&&bookletMode&&bookletCanvas&&bookletTwenty&&bookletDoesNotCharge&&restored&&ready;
        if(!pass)throw new Error(`initial=${initialProduct}/${initialValues}/${initialPreset}/${initialCanvas}/${summaryOk} size=${presetChanged}/${customMode} cover=${coverDefaults} quota=${quotaCommitted} report=${reportVisible} booklet=${bookletOnly}/${bookletMode}/${bookletCanvas}/${bookletTwenty}/${bookletDoesNotCharge} restored=${restored} ready=${ready}`);
        document.documentElement.dataset.printCheckerDefaultsDailyFreeSmoke='pass';
        const out=document.createElement('pre');out.textContent='PASS: standard print defaults remain intact and booklet is total-pages-only with an imposition-style live layout';document.body.appendChild(out);
      }catch(error){fail(error?.message||String(error));}
    });
  </script>
</body>
</html>
