<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Lossless PDF Browser Smoke</title>
  <style>
    .hidden{display:none!important}
    body{font-family:Arial,sans-serif;margin:0;padding:12px}
    .sidebar{width:320px}.side-card{border:1px solid #ddd;padding:8px;margin:4px 0}
    #editorShell{display:grid;grid-template-columns:320px 1fr;gap:12px}
    #artboardViewport{width:900px;height:700px;overflow:auto}
    #artboard{position:relative;background:#fff}.design-object{position:absolute}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?browser-pdf-lossless-smoke=1&embed=1');
    window.ProgramStudioBoot={reveal(){}};
    window.__browserLosslessRuntimeResults=[];
    window.addEventListener('programstudio:runtime-script-result',event=>window.__browserLosslessRuntimeResults.push(event.detail||{}));
  </script>
</head>
<body data-lossless-smoke-status="pending">
  <div id="losslessSmokeResult">PENDING</div>
  <div id="authLoading"></div><span id="navUserName"></span><button id="logoutBtn" type="button">logout</button>
  <main id="startScreen"><button id="resumeDraftBtn" class="hidden" type="button">resume</button><div id="presetGrid"></div><input id="customWidth" value="210"><input id="customHeight" value="297"><button id="customStartBtn" type="button">custom</button><button id="coverEditorBtn" type="button">cover</button></main>
  <main id="editorShell" class="hidden">
    <aside class="sidebar">
      <section class="side-card"><div id="documentTitle"></div><div id="documentMeta"></div><button id="newDesignBtn" type="button">new</button></section>
      <section class="side-card"><button id="addTitleBtn" type="button">title</button><button id="addSubtitleBtn" type="button">subtitle</button><button id="addBodyBtn" type="button">body</button><button id="addInfoBtn" type="button">info</button></section>
      <section id="inspector" class="side-card"></section><section class="side-card"><div id="layerList"></div></section>
    </aside>
    <section><div id="surfaceTabs"></div><div id="saveState"></div><div id="artboardViewport"><div id="artboard"></div></div><div class="editor-footer"><div id="editorStatus" class="editor-status"></div></div></section>
  </main>
  <script src="/js/design-editor/presets.js?v=20260821-1"></script>
  <script src="/js/design-editor/app.js?v=20260821-1"></script>
  <script src="/js/sw-register.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('losslessSmokeResult');
      const fail=error=>{document.body.dataset.losslessSmokeStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.losslessSmokeStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40));}throw new Error('timeout: '+label);};
      const settle=()=>new Promise(resolve=>setTimeout(resolve,40));
      try{
        await waitFor(()=>window.DesignEditorApp,'DesignEditorApp');
        await waitFor(()=>Array.isArray(window.ProgramStudioDesignEditorRuntimeManifest),'runtime manifest');
        await waitFor(()=>{
          const ids=new Set(window.ProgramStudioDesignEditorRuntimeManifest.map(entry=>entry.id));
          const latest=new Map();(window.__browserLosslessRuntimeResults||[]).forEach(entry=>{if(ids.has(entry?.id))latest.set(entry.id,entry);});
          return ids.size===31&&latest.size===31&&[...latest.values()].every(entry=>entry.status==='loaded');
        },'all runtime manifest results');
        assert(window.DesignEditorCoverModel,'cover model runtime module did not load');
        await waitFor(()=>window.DesignEditorOutput,'DesignEditorOutput');
        await waitFor(()=>window.DesignEditorFinalPrintCheck,'DesignEditorFinalPrintCheck');
        DesignEditorApp.startProject('flyer-a4');await settle();
        const project=DesignEditorApp.project;
        document.getElementById('addTitleBtn').click();await settle();
        document.getElementById('textContentInput').value='무손실 PDF 앞면';document.getElementById('textContentInput').dispatchEvent(new Event('input',{bubbles:true}));await settle();
        document.querySelectorAll('.surface-tab')[1].click();await settle();document.getElementById('addBodyBtn').click();await settle();
        document.getElementById('textContentInput').value='무손실 PDF 뒷면';document.getElementById('textContentInput').dispatchEvent(new Event('input',{bubbles:true}));await settle();
        const spec=DesignEditorOutput.expectedOutputSpec(project);assert(spec.widthPx===2551&&spec.heightPx===3579&&spec.surfaceCount===2,'lossless PDF output spec changed');
        const profile=document.getElementById('designPdfProfile');assert(profile,'PDF profile control is missing');profile.value='lossless';
        const pdfInstances=[];
        class LosslessSmokeJsPdf{
          constructor(options){this.options=options;this.pages=[{format:options.format,orientation:options.orientation}];this.images=[];this.savedName='';pdfInstances.push(this);}
          addPage(format,orientation){this.pages.push({format,orientation});}
          addImage(data,format,x,y,w,h,alias,compression){this.images.push({data,format,x,y,w,h,alias,compression});}
          getNumberOfPages(){return this.pages.length;}
          save(name){this.savedName=String(name||'');}
        }
        const originalLoader=window.CoverJsPdfLoader,finalCheck=window.DesignEditorFinalPrintCheck,originalGate=finalCheck.confirmBeforeOutput;let gateFormat='';
        window.CoverJsPdfLoader={ensure:async()=>LosslessSmokeJsPdf,ready:()=>true,stage:'browser-smoke-lossless-pdf-double'};
        finalCheck.confirmBeforeOutput=async options=>{gateFormat=String(options?.format||'');return true;};
        try{await DesignEditorOutput.exportPdf();}finally{finalCheck.confirmBeforeOutput=originalGate;if(originalLoader)window.CoverJsPdfLoader=originalLoader;else delete window.CoverJsPdfLoader;}
        assert(gateFormat==='pdf','lossless PDF export did not pass final print gate');
        assert(pdfInstances.length===1,'lossless PDF document count changed');
        const pdf=pdfInstances[0];assert(pdf.getNumberOfPages()===2&&pdf.images.length===2,'lossless PDF page/image count changed');
        pdf.images.forEach((image,index)=>{
          assert(image.format==='PNG',`lossless page ${index+1} image format changed`);
          assert(image.data?.startsWith('data:image/png;base64,'),`lossless page ${index+1} did not use PNG payload`);
          const bytes=Uint8Array.from(atob(image.data.split(',',2)[1].slice(0,48)),char=>char.charCodeAt(0));
          assert([137,80,78,71,13,10,26,10].every((value,i)=>bytes[i]===value),`lossless page ${index+1} PNG signature invalid`);
          const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);assert(view.getUint32(16)===2551&&view.getUint32(20)===3579,`lossless page ${index+1} PNG IHDR changed`);
          assert(image.compression===undefined,`lossless page ${index+1} must not request JPEG compression`);
          assert(Math.abs(image.w-216)<.001&&Math.abs(image.h-303)<.001,`lossless page ${index+1} image mm size changed`);
          assert(image.data.length>1000,`lossless page ${index+1} payload too small`);
        });
        assert(pdf.savedName.endsWith('_300dpi_lossless.pdf'),'lossless PDF filename changed');
        assert(document.getElementById('editorStatus')?.textContent.includes('고품질 PDF'),'lossless PDF success status lost profile label');
        assert(document.getElementById('editorStatus')?.textContent.includes('2개 면'),'lossless PDF success status lost page count');
        document.body.dataset.losslessPages=String(pdf.getNumberOfPages());document.body.dataset.losslessImages=String(pdf.images.length);document.body.dataset.losslessGate=gateFormat;document.body.dataset.losslessProfile='lossless';document.body.dataset.losslessWidth=String(spec.widthPx);document.body.dataset.losslessHeight=String(spec.heightPx);
        pdf.images.forEach(image=>{image.data='';});
        pass('two-surface lossless PNG-backed 300DPI PDF export orchestration');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
