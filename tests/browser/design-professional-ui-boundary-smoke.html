<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Professional UI boundary smoke</title>
</head>
<body>
  <div id="editorShell" class="editor-shell">
    <aside class="sidebar">
      <section class="side-card"><strong id="documentTitle">디자인</strong></section>
      <section class="side-card"><button id="addTitleBtn" type="button">제목 추가</button></section>
      <section id="designSimpleResultTools" class="side-card"><button type="button" data-simple-action="pdf">PDF</button></section>
    </aside>
    <main class="editor-main">
      <div class="editor-toolbar"></div>
      <section id="designEmbeddedModeCard"></section>
      <section id="designFinalPrintCheckTools"></section>
      <div id="editorStatus"></div>
    </main>
    <aside class="properties-panel">
      <section id="inspector" class="side-card"></section>
      <section class="side-card"><div id="layerList"></div></section>
    </aside>
  </div>
  <script>
    window.DesignEditorApp={project:{documentType:'poster'}};
    window.ProgramStudioEditorToolRail={select:function(){}};
  </script>
  <script src="../../js/design-editor/professional-ui.js"></script>
  <script>
    (function(){
      const params=new URLSearchParams(location.search);
      const standalone=params.get('case')==='standalone';
      let attempts=0;
      function verify(){
        attempts+=1;
        const shared=window.DesignEditorProfessionalShellUi;
        const compat=window.DesignEditorProfessionalUi;
        const workflow=document.getElementById('designProfessionalWorkflow');
        const style=document.getElementById('designProfessionalUiStyles');
        const check=document.getElementById('designProfessionalCheckCta');
        const pdf=document.getElementById('designProfessionalPdfCta');
        const owner=document.documentElement.dataset.professionalWorkflowOwner||'';
        const sharedOwner=document.documentElement.dataset.professionalShellOwnership||'';
        const sharedScript=[...document.scripts].find(script=>/\/js\/design-editor\/shared\/professional-shell-ui\.js(?:\?|$)/.test(script.src));
        const workflowOk=standalone?!workflow:Boolean(workflow);
        const ownerOk=standalone?owner==='workspace-navigation':owner==='professional-ui';
        if(
          shared?.stage==='design-editor-professional-shell-ui-v1'&&
          compat?.stage==='professional-workspace-result-first-v2'&&
          style&&check&&pdf&&sharedScript&&workflowOk&&ownerOk&&sharedOwner==='shared'
        ){
          document.documentElement.dataset.professionalBoundarySmoke='pass';
          document.documentElement.dataset.professionalBoundaryCase=standalone?'standalone':'integrated';
          document.documentElement.dataset.professionalBoundaryOwner=owner;
          document.documentElement.dataset.professionalBoundaryShared='loaded';
          return;
        }
        if(attempts<50)setTimeout(verify,50);
        else{
          document.documentElement.dataset.professionalBoundarySmoke='fail';
          document.documentElement.dataset.professionalBoundaryCase=standalone?'standalone':'integrated';
        }
      }
      verify();
    })();
  </script>
</body>
</html>
