<!doctype html>
<html lang="ko" data-pdf-preview-zoom-persistence-host="1" data-pdf-orientation-sidebar-cleanup-host="1">
<head><meta charset="utf-8"><title>PDF layout sidebar and workflow smoke</title></head>
<body data-program-kind="pdf-editor">
  <div class="app">
    <aside>
      <h1>PDF 문서 편집기</h1>
      <div class="legacy-print-output-label">인쇄,출력 도구</div>
      <div class="sub">PDF 업로드 · 페이지 편집</div>
      <label><input id="showBorder" type="checkbox" checked>슬라이드 테두리 표시</label>
      <div id="pdfPageListQuickAddV1"><button>＋ 연속 추가</button><button>＋ 새 묶음 추가</button></div>
      <div id="pdfFileNavigation"><strong>편집 페이지</strong><button>이동</button><button>모두 접기</button></div>
      <div id="pageProductivityPanelV3" class="page-productivity-panel">
        <div class="page-productivity-top">
          <button id="pageSelectionModeBtnV3">다중 선택</button><button>전체</button><button>해제</button><span id="pageSelectionCountV3" class="page-selection-count">선택 0</span>
        </div>
        <div class="page-productivity-jump"><input id="pageJumpInputV3" value="1"><button>이동</button><button id="pageUndoBtnV3">↶ 취소</button><button id="pageRedoBtnV3">↷ 다시</button></div>
        <div class="page-productivity-actions"><button data-batch-action="true">회전</button></div>
      </div>
      <div id="thumbArea">
        <div class="thumb-file-sep" data-file-nav-header="true" data-file-index="0"><span class="thumb-file-sep-label">A.pdf</span></div>
        <div class="thumb-item" data-id="1"><div class="thumb-wrap"><span class="thumb-num">1</span></div></div>
        <div class="thumb-file-sep" data-file-nav-header="true" data-file-index="1"><span class="thumb-file-sep-label">B.pdf</span></div>
        <div class="thumb-item" data-id="4"><div class="thumb-wrap"><span class="thumb-num">4</span></div></div>
      </div>
    </aside>
    <main>
      <div class="preview-info">
        <span id="previewInfo">대용량 작업 미리보기 · 선택한 페이지 주변만 실제 표시</span>
        <span id="previewPages">전체 100개 중 1–7 출력면</span>
        <div class="preview-zoom">
          <select id="perRowSelect"><option value="1">줄당 1장</option><option value="2" selected>줄당 2장</option></select>
          <button id="zoomOutBtn">−</button><span id="zoomLabel">60%</span><button id="zoomInBtn">＋</button><button id="zoomResetBtn">↺</button>
        </div>
      </div>
      <div id="pdfLazyPreviewNav" data-active="true">
        <button id="pdfLazyPreviewPrevious">‹ 이전</button><input id="pdfLazyPreviewOutputNumber" value="1"><span id="pdfLazyPreviewCount">/ 100</span><button id="pdfLazyPreviewNext">다음 ›</button><span id="pdfLazyPreviewRange">현재 출력면 주변만 표시</span>
      </div>
      <div id="previewScroll" style="width:900px;height:520px;overflow:auto"></div>
    </main>
  </div>
  <pre id="result">WAIT</pre>
  <script>
    history.replaceState(null,'','/pdf-editor/?app=layout&sidebar-title-smoke=1');
    window.ProgramStudioPdfEditorRuntimeContext={load(){return Promise.resolve(true);}};
    let parsedPages=[
      {id:1,file_index:0,page_index:0,sourceFile:'A.pdf',pageType:'pdf',groupBreak:false,rotation:0},
      {id:2,file_index:0,page_index:1,sourceFile:'A.pdf',pageType:'pdf',groupBreak:false,rotation:0},
      {id:3,pageType:'divider',sourceFile:'간지'},
      {id:4,file_index:1,page_index:0,sourceFile:'B.pdf',pageType:'pdf',groupBreak:true,rotation:0}
    ];
    let uploadedFiles=[new File(['a'],'A.pdf',{type:'application/pdf'}),new File(['b'],'B.pdf',{type:'application/pdf'})];
    let fileNupMap={0:2,1:4};
    let showBorder=true;
    let _previewZoom=.6;
    let _previewPerRow=2;
    const ZOOM_BASE_H=280;
    const smokeCanvas=document.createElement('canvas');smokeCanvas.width=700;smokeCanvas.height=990;
    let previewCanvases=[smokeCanvas];
    let lastAutoFit=null;
    let lastRawRotation=null;
    let lastSafetyRotation=null;
    let originalDrawCalls=0;
    let lastOutputSettings=null;
    function displayPreview(pages,autoFit=false){lastAutoFit=!!autoFit;if(autoFit)_previewZoom=2;document.getElementById('zoomLabel').textContent=Math.round(_previewZoom*100)+'%';}
    async function renderPdfPage(pdfPage,scale,rotation){lastRawRotation=rotation;const canvas=document.createElement('canvas');canvas.width=700;canvas.height=990;return canvas;}
    window.PdfImportTransactionSafety={safeRenderPdfPage:async function(pdfPage,scale,rotation){lastSafetyRotation=rotation;const canvas=document.createElement('canvas');canvas.width=700;canvas.height=990;return canvas;}};
    function drawPageInCell(ctx,src,cellX,cellY,cellW,cellH){
      originalDrawCalls++;
      const s0=Math.min(cellW/src.width,cellH/src.height);
      const s90=Math.min(cellW/src.height,cellH/src.width);
      const rot=s90>s0*1.10;
      if(rot){ctx.save();ctx.translate(cellX+cellW/2,cellY+cellH/2);ctx.rotate(Math.PI/2);ctx.drawImage(src,-src.width*s90/2,-src.height*s90/2,src.width*s90,src.height*s90);ctx.restore();return{rotated:true};}
      ctx.drawImage(src,cellX,cellY,src.width*s0,src.height*s0);return{rotated:false};
    }
    async function apiProcessPdf(files,settings){lastOutputSettings=settings;return new Blob(['pdf'],{type:'application/pdf'});}
    function renderThumbs(){}
    function schedulePreview(){}
    function showStatus(){}
    function hideStatus(){}
  </script>
  <script src="/js/pdf-editor/route-runtime.js"></script>
  <script src="/js/pdf-editor/simple-sidebar-ui.js"></script>
  <script src="/js/pdf-editor/preview-zoom-persistence.js"></script>
  <script src="/js/pdf-editor/layout-ui-refinements.js"></script>
  <script src="/js/pdf-editor/orientation-sidebar-cleanup.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      const fail=message=>{document.documentElement.dataset.pdfLayoutSidebarTitleSmoke='fail';result.textContent='FAIL: '+message;throw new Error(message);};
      const runtime=window.PdfEditorRouteRuntime;
      if(!runtime)return fail('route runtime missing');
      await runtime.loadAll();
      await wait(80);
      if(document.querySelector('.app > aside > h1'))return fail('layout sidebar title still exists');
      if(document.documentElement.dataset.pdfLayoutSidebarTitleRemoved!=='1')return fail('title removal marker missing');
      if(!document.querySelector('.app > aside > .sub'))return fail('sidebar description was removed with title');
      const sidebarText=String(document.querySelector('.app > aside')?.textContent||'').replace(/[\s,，·ㆍ/|:：]+/g,'');
      if(sidebarText.includes('인쇄출력도구'))return fail('legacy print/output tools label still exists');
      if(document.documentElement.dataset.pdfSidebarPrintOutputLabel!=='removed')return fail('print/output tools label cleanup marker missing');

      const zoomApi=window.PdfPreviewZoomPersistence;
      const layoutApi=window.PdfLayoutUiRefinements;
      const cleanupApi=window.PdfOrientationSidebarCleanup;
      if(!zoomApi||!layoutApi||!cleanupApi)return fail('layout refinement APIs missing');
      zoomApi.install();
      layoutApi.sync();
      cleanupApi.sync();

      if(document.getElementById('pdfPageListQuickAddV1'))return fail('page-list quick add bar still exists');
      if(document.getElementById('showBorder').checked||showBorder!==false)return fail('slide border did not default off');
      if(document.getElementById('zoomResetBtn').textContent.trim()!=='화면 맞춤')return fail('fit-to-screen button missing');
      const nav=document.getElementById('pdfLazyPreviewNav');
      if(nav.parentElement!==document.querySelector('.preview-info'))return fail('previous/next controls were not moved into preview toolbar');
      if(document.getElementById('pdfLazyPreviewRange'))return fail('lazy preview range text still exists');
      if(document.getElementById('previewInfo').hidden!==true)return fail('redundant fast preview message still visible');

      const fileNav=document.getElementById('pdfFileNavigation');
      if(getComputedStyle(fileNav).display!=='none')return fail('edit-page navigation card is still visible');
      const productivity=document.getElementById('pageProductivityPanelV3');
      const topLabels=[...productivity.querySelectorAll('.page-productivity-top button')].map(button=>button.textContent.trim()).join(',');
      if(topLabels!=='다중 선택,전체,해제')return fail('compact selection controls are not the requested three buttons');
      if(getComputedStyle(document.getElementById('pageSelectionCountV3')).display!=='none')return fail('selection count is still visible');
      if(getComputedStyle(productivity.querySelector('.page-productivity-jump')).display!=='none')return fail('page jump/undo row is still visible');
      if(getComputedStyle(productivity.querySelector('.page-productivity-actions')).display!=='none')return fail('batch action row is still visible');

      const rotatedPdf={rotate:90};
      parsedPages[0].pdfPage=rotatedPdf;
      const sourceCanvas=await window.renderPdfPage(rotatedPdf,.9,0);
      if(lastRawRotation!==90)return fail('intrinsic PDF rotation was not preserved in thumbnail renderer');
      if(sourceCanvas.dataset.pdfIntrinsicSourceRotation!=='90'||sourceCanvas.dataset.pdfEffectiveSourceRotation!=='90')return fail('intrinsic/effective rotation source markers are incorrect');
      const safetyCanvas=await window.PdfImportTransactionSafety.safeRenderPdfPage(rotatedPdf,.9,0,false);
      if(lastSafetyRotation!==90)return fail('intrinsic PDF rotation was not preserved in lazy/safety renderer');
      if(safetyCanvas.dataset.pdfEffectiveSourceRotation!=='90')return fail('lazy effective rotation marker missing');

      await window.renderPdfPage(rotatedPdf,.9,90);
      if(lastRawRotation!==180)return fail('explicit user rotation was not added to intrinsic PDF orientation');

      originalDrawCalls=0;
      const out=document.createElement('canvas');out.width=1000;out.height=500;
      const drawResult=window.drawPageInCell(out.getContext('2d'),sourceCanvas,0,0,1000,500);
      if(originalDrawCalls!==0)return fail('fit-based legacy draw path still auto-rotates PDF preview');
      if(drawResult?.rotated!==false)return fail('PDF preview source was rotated automatically for fit');
      if(document.documentElement.dataset.pdfAutoFitRotation!=='disabled')return fail('auto-fit rotation policy marker missing');

      parsedPages[0].rotation=0;
      await window.apiProcessPdf(uploadedFiles,{pages:[{rotation:0},{rotation:0},{},{rotation:0}]},{});
      if(lastOutputSettings?.pages?.[0]?.rotation!==90||lastOutputSettings?.pages?.[0]?.rotation_locked!==true)return fail('final PDF output did not lock intrinsic visible orientation');
      parsedPages[0].rotation=90;
      await window.apiProcessPdf(uploadedFiles,{pages:[{rotation:90},{rotation:0},{},{rotation:0}]},{});
      if(lastOutputSettings?.pages?.[0]?.rotation!==180||lastOutputSettings?.pages?.[0]?.rotation_locked!==true)return fail('final PDF output did not preserve intrinsic plus user rotation');
      parsedPages[0].rotation=0;

      _previewZoom=.6;
      zoomApi.pin();
      displayPreview(previewCanvases,true);
      if(lastAutoFit!==false)return fail('lazy rerender still requested auto-fit after user zoom');
      if(Math.abs(_previewZoom-.6)>.001)return fail('user zoom was not preserved');
      if(!zoomApi.fitToViewport())return fail('fit-to-screen calculation failed');
      if(!Number.isFinite(_previewZoom)||_previewZoom<=0)return fail('fit-to-screen produced invalid zoom');

      layoutApi.decorateFileHeaders();
      if(document.querySelectorAll('.pdf-file-order-handle').length!==2)return fail('file drag handles missing');
      if(!layoutApi.reorderFiles(1,0,false))return fail('file reorder operation failed');
      if(uploadedFiles[0]?.name!=='B.pdf'||uploadedFiles[1]?.name!=='A.pdf')return fail('uploaded file order did not change');
      if(parsedPages[0]?.sourceFile!=='B.pdf'||parsedPages[0]?.file_index!==0)return fail('page blocks did not follow file order');
      const firstA=parsedPages.find(page=>page.sourceFile==='A.pdf'&&page.pageType==='pdf');
      if(firstA?.file_index!==1)return fail('file_index was not remapped after file reorder');
      if(Number(fileNupMap[0])!==4||Number(fileNupMap[1])!==2)return fail('per-file layout settings were not remapped');

      document.documentElement.dataset.pdfLayoutSidebarTitleSmoke='pass';
      result.textContent='PASS: layout PDF editor compact toolbar, sticky zoom, file reorder and clean defaults; PDF visible orientation stays exact with no fit-based clockwise 90-degree turn';
    })().catch(error=>console.error(error));
  </script>
</body>
</html>
