<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Document Workflow V2 Smoke</title><style>.workspace{display:grid;grid-template-columns:300px 1fr}.sidebar{display:flex;flex-direction:column;gap:8px}.panel-card{border:1px solid #ddd;padding:8px}</style><script>history.replaceState(null,'','/document-editor/index.html?workflow-v2-smoke=1');</script></head>
<body data-document-workflow-v2-smoke="pending">
<header class="app-header"><button id="printBtn">인쇄 · PDF 저장</button></header>
<main class="workspace"><aside class="sidebar">
<section class="panel-card usability-card"><div class="panel-title">빠른 시작 · 화면</div></section>
<section class="panel-card outline-card"><div class="panel-title">문서 개요</div></section>
<section class="panel-card comment-card"><div class="panel-title">문서 메모</div></section>
<section class="panel-card"><div class="panel-title">찾기 · 바꾸기</div></section>
<section class="panel-card"><div class="panel-title">문서 저장</div><div id="draftState">자동 저장 준비됨</div><button id="saveNowBtn">지금 저장</button></section>
</aside><section><input id="documentTitle" value="테스트 문서"><article id="documentPage" contenteditable="true"><p><br></p></article><span id="statusText">준비됨</span><span id="pageMeta">A4 세로</span></section></main>
<div id="result">PENDING</div>
<script>
let mock={text:'',counts:{words:0,characters:0},hasDraft:false};window.DocumentEditorApp={getState:()=>mock,saveDraft:()=>true,printDocument:()=>true};
document.getElementById('saveNowBtn').addEventListener('click',()=>document.body.dataset.saveClicked='true');
document.getElementById('printBtn').addEventListener('click',()=>document.body.dataset.printClicked='true');
</script>
<script src="/js/document-editor/workflow-v2.js?v=smoke"></script>
<script>
(async()=>{const result=document.getElementById('result');const assert=(v,m)=>{if(!v)throw new Error(m)};const wait=async(p,l)=>{for(let i=0;i<120;i++){if(p())return;await new Promise(r=>setTimeout(r,20))}throw new Error('timeout: '+l)};try{
await wait(()=>window.DocumentEditorWorkflowV2,'workflow');const panel=document.getElementById('documentEditorWorkflowV2');assert(panel,'panel missing');assert(panel.querySelectorAll('[data-document-step]').length===4,'four steps missing');assert(document.getElementById('documentWorkflowOutputV2'),'output dock missing');
mock={text:'안녕하세요 문서 테스트',counts:{words:3,characters:11},hasDraft:true};document.getElementById('documentPage').innerHTML='<p>안녕하세요 문서 테스트</p>';document.getElementById('draftState').textContent='자동 저장됨 · 08:00';window.DocumentEditorWorkflowV2.refresh();
assert(panel.querySelector('[data-document-step="write"]').classList.contains('done'),'write step not done');assert(document.querySelector('.document-workflow-status-note').textContent.includes('11자'),'status count missing');
panel.querySelector('[data-document-step="output"]').click();assert(panel.querySelector('[data-document-step="output"]').classList.contains('active'),'output step not active');
document.querySelector('[data-document-output="save"]').click();document.querySelector('[data-document-output="print"]').click();assert(document.body.dataset.saveClicked==='true','save not reused');assert(document.body.dataset.printClicked==='true','print not reused');
document.getElementById('draftState').classList.add('warn');window.DocumentEditorWorkflowV2.refresh();assert(document.querySelector('.document-workflow-badge').classList.contains('warn'),'save warning not surfaced');
document.body.dataset.documentWorkflowV2Smoke='pass';result.textContent='PASS: document workflow v2, status, save and print reuse';
}catch(error){document.body.dataset.documentWorkflowV2Smoke='fail';result.textContent='FAIL: '+String(error.message||error)}})();
</script></body></html>
