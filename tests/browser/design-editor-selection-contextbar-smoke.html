<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Selection Contextbar Smoke</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif}.editor-toolbar{height:54px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ddd}.artboard{position:relative;width:420px;height:260px;margin:30px}.design-text,.phase2-extra-object{position:absolute}.sidebar{display:none}#designCanvasQuickbar{display:block;position:fixed}
  </style>
  <script>history.replaceState(null,'','/design-editor/general.html?embed=1&mode=poster&selectionContext=20260831-1');</script>
</head>
<body data-design-contextbar-status="pending">
  <div id="result">PENDING</div>
  <div class="editor-toolbar">toolbar</div>
  <div id="artboard" class="artboard"><div class="design-text selected" data-id="text-1"></div></div>
  <div id="designCanvasQuickbar">legacy floating quickbar</div>
  <aside class="sidebar"><div id="inspector">
    <select id="fontInput"><option value="Pretendard">Pretendard</option><option value="Arial">Arial</option></select>
    <input id="sizeInput" type="number" value="18">
    <select id="weightInput"><option value="400">400</option><option value="700">700</option><option value="900">900</option></select>
    <input id="colorInput" type="color" value="#112233">
    <button type="button" data-align="left">left</button><button type="button" data-align="center">center</button><button type="button" data-align="right">right</button>
    <input id="lockInput" type="checkbox"><button id="layerBackBtn">back</button><button id="layerFrontBtn">front</button><button id="duplicateBtn">duplicate</button><button id="deleteBtn">delete</button>
    <input data-extra-field="w" type="number" value="80"><input data-extra-field="h" type="number" value="50"><input data-extra-field="opacity" type="number" value="100">
    <select data-extra-field="fit"><option value="cover">cover</option><option value="contain">contain</option></select>
    <input data-extra-field="focusX" type="number" value="50"><input data-extra-field="focusY" type="number" value="50">
    <input data-extra-field="fill" type="color" value="#dceeff"><input data-extra-field="stroke" type="color" value="#12396d"><input data-extra-field="strokeWidth" type="number" value="1">
    <input id="quickCornerRadius" type="number" value="0"><input id="phase2ExtraLock" type="checkbox">
    <button id="phase2ExtraBack">back extra</button><button id="phase2ExtraFront">front extra</button><button id="phase2ExtraDuplicate">duplicate extra</button><button id="phase2ExtraDelete">delete extra</button><button id="phase2ReplaceImage">replace image</button>
  </div></aside>
  <script>
    const text={id:'text-1',type:'text',fontFamily:'Pretendard',size:18,weight:700,align:'left',color:'#112233',w:80,locked:false};
    const image={id:'image-1',type:'image',w:80,h:50,fit:'cover',focusX:50,focusY:50,opacity:100,locked:false};
    const shape={id:'shape-1',type:'shape',shape:'rect',w:60,h:40,fill:'#dceeff',stroke:'#12396d',strokeWidth:1,cornerRadius:0,opacity:100,locked:false};
    const project={activeSurface:'front',surfaces:[{id:'front',elements:[text],extras:[image,shape]}]};window.DesignEditorApp={project};
    const calls={arrange:[],textDuplicate:0,extraDuplicate:0,replace:0};
    const selectedExtra=()=>{const node=document.querySelector('.phase2-extra-object.selected');return project.surfaces[0].extras.find(item=>item.id===node?.dataset.extraId)||null;};
    fontInput.onchange=e=>text.fontFamily=e.target.value;sizeInput.oninput=e=>text.size=Number(e.target.value);weightInput.onchange=e=>text.weight=Number(e.target.value);colorInput.oninput=e=>text.color=e.target.value;
    document.querySelectorAll('[data-align]').forEach(button=>button.onclick=()=>text.align=button.dataset.align);lockInput.onchange=e=>text.locked=e.target.checked;duplicateBtn.onclick=()=>calls.textDuplicate++;
    document.querySelectorAll('[data-extra-field]').forEach(control=>{const type=control.tagName==='SELECT'?'change':'input';control.addEventListener(type,e=>{const item=selectedExtra();if(!item)return;const field=control.dataset.extraField;item[field]=['fill','stroke'].includes(field)||control.tagName==='SELECT'?e.target.value:Number(e.target.value);});});
    quickCornerRadius.oninput=e=>{const item=selectedExtra();if(item)item.cornerRadius=Number(e.target.value);};phase2ExtraLock.onchange=e=>{const item=selectedExtra();if(item)item.locked=e.target.checked;};phase2ExtraDuplicate.onclick=()=>calls.extraDuplicate++;phase2ReplaceImage.onclick=()=>calls.replace++;
    window.DesignEditorPhase3Controls={alignSelected(value){calls.arrange.push(value);}};
  </script>
  <script src="/js/design-editor/shared/selection-contextbar.js?v=20260831-1"></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{
      const result=document.getElementById('result'),assert=(ok,msg)=>{if(!ok)throw new Error(msg);};
      const change=(node,value,type='input')=>{assert(node,'context control missing');node.value=value;node.dispatchEvent(new Event(type,{bubbles:true}));};
      const selectExtra=item=>{document.querySelectorAll('.selected').forEach(node=>node.classList.remove('selected'));const node=document.createElement('div');node.className='phase2-extra-object selected';node.dataset.extraId=item.id;artboard.appendChild(node);window.DesignEditorSelectionContextbar.sync();return node;};
      try{
        assert(window.DesignEditorSelectionContextbar,'runtime missing');window.DesignEditorSelectionContextbar.sync();
        let bar=document.getElementById('designSelectionContextbar');assert(bar&&!bar.hidden&&bar.dataset.contextKind==='text','text context missing');assert(getComputedStyle(designCanvasQuickbar).display==='none','floating quickbar duplicated');
        change(bar.querySelector('[data-context-field="text-font"]'),'Arial','change');change(bar.querySelector('[data-context-field="text-size"]'),'26');change(bar.querySelector('[data-context-field="text-weight"]'),'900','change');change(bar.querySelector('[data-context-field="text-color"]'),'#445566');bar.querySelector('[data-context-text-align="center"]').click();change(bar.querySelector('[data-context-arrange]'),'center','change');bar.querySelector('[data-context-action="duplicate"]').click();
        assert(text.fontFamily==='Arial'&&text.size===26&&text.weight===900&&text.color==='#445566'&&text.align==='center','text proxy failed');assert(calls.arrange.includes('center')&&calls.textDuplicate===1,'text arrange/duplicate failed');document.body.dataset.designContextbarText='font-size-weight-color-align';

        const imageNode=selectExtra(image);bar=document.getElementById('designSelectionContextbar');assert(bar.dataset.contextKind==='image','image context missing');change(bar.querySelector('[data-context-field="extra-w"]'),'95');change(bar.querySelector('[data-context-field="extra-h"]'),'62');change(bar.querySelector('[data-context-field="image-fit"]'),'contain','change');change(bar.querySelector('[data-context-field="image-focus-x"]'),'35');change(bar.querySelector('[data-context-field="image-focus-y"]'),'65');change(bar.querySelector('[data-context-field="extra-opacity"]'),'82');bar.querySelector('[data-context-action="replace"]').click();bar.querySelector('[data-context-action="duplicate"]').click();
        assert(image.w===95&&image.h===62&&image.fit==='contain'&&image.focusX===35&&image.focusY===65&&image.opacity===82,'image proxy failed');assert(calls.replace===1&&calls.extraDuplicate===1,'image actions failed');document.body.dataset.designContextbarImage='size-fit-focus-opacity';

        imageNode.classList.remove('selected');const shapeNode=selectExtra(shape);bar=document.getElementById('designSelectionContextbar');assert(bar.dataset.contextKind==='shape','shape context missing');change(bar.querySelector('[data-context-field="shape-fill"]'),'#abcdef');change(bar.querySelector('[data-context-field="shape-stroke"]'),'#223344');change(bar.querySelector('[data-context-field="shape-stroke-width"]'),'2.4');change(bar.querySelector('[data-context-field="shape-radius"]'),'5');change(bar.querySelector('[data-context-field="extra-opacity"]'),'70');
        assert(shape.fill==='#abcdef'&&shape.stroke==='#223344'&&shape.strokeWidth===2.4&&shape.cornerRadius===5&&shape.opacity===70,'shape proxy failed');document.body.dataset.designContextbarShape='fill-stroke-radius-opacity';document.body.dataset.designContextbarProxy='existing-inspector-controls';document.body.dataset.designContextbarFloating='suppressed-when-context';

        shapeNode.classList.remove('selected');window.DesignEditorSelectionContextbar.sync();assert(bar.hidden,'context not hidden');assert(!document.documentElement.dataset.designSelectionContext,'context dataset remains');assert(getComputedStyle(designCanvasQuickbar).display==='block','floating quickbar contract not restored');
        document.body.dataset.designContextbarStatus='pass';result.textContent='PASS: selection contextbar: 글씨·이미지·도형 속성이 기존 inspector와 layout API를 통해 동기화됨';
      }catch(error){document.body.dataset.designContextbarStatus='fail';result.textContent='FAIL: '+String(error?.stack||error);}
    },{once:true});
  </script>
</body>
</html>
