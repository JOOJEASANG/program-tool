<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Selection Contextbar Smoke</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif}.editor-main{height:420px;overflow:auto}.editor-toolbar{height:54px;display:flex;align-items:center;padding:0 10px;background:#fff;border-bottom:1px solid #ddd}.artboard{position:relative;width:420px;height:260px;margin:30px;background:#fff}.design-text,.phase2-extra-object{position:absolute}.sidebar{display:none}#designCanvasQuickbar{display:block;position:fixed}
  </style>
  <script>history.replaceState(null,'','/design-editor/general.html?embed=1&mode=poster&selectionContext=20260828-1');</script>
</head>
<body data-design-contextbar-status="pending">
  <div id="result">PENDING</div>
  <main class="editor-main">
    <div class="editor-toolbar"><span>toolbar</span></div>
    <div id="artboard" class="artboard"></div>
  </main>
  <div id="designCanvasQuickbar">legacy floating quickbar</div>
  <aside class="sidebar">
    <div id="inspector">
      <select id="fontInput"><option value="Pretendard">Pretendard</option><option value="Malgun Gothic">맑은 고딕</option><option value="Arial">Arial</option></select>
      <input id="sizeInput" type="number" value="18">
      <select id="weightInput"><option value="400">400</option><option value="500">500</option><option value="700">700</option><option value="800">800</option><option value="900">900</option></select>
      <input id="colorInput" type="color" value="#112233">
      <button type="button" data-align="left">left</button><button type="button" data-align="center">center</button><button type="button" data-align="right">right</button>
      <input id="lockInput" type="checkbox">
      <button id="layerBackBtn" type="button">back</button><button id="layerFrontBtn" type="button">front</button><button id="duplicateBtn" type="button">duplicate</button><button id="deleteBtn" type="button">delete</button>
      <input data-extra-field="w" type="number" value="80"><input data-extra-field="h" type="number" value="50"><input data-extra-field="opacity" type="number" value="100">
      <select data-extra-field="fit"><option value="cover">cover</option><option value="contain">contain</option></select>
      <input data-extra-field="focusX" type="number" value="50"><input data-extra-field="focusY" type="number" value="50">
      <input data-extra-field="fill" type="color" value="#dceeff"><input data-extra-field="stroke" type="color" value="#12396d"><input data-extra-field="strokeWidth" type="number" value="1">
      <input id="quickCornerRadius" type="number" value="0">
      <input id="phase2ExtraLock" type="checkbox">
      <button id="phase2ExtraBack" type="button">back extra</button><button id="phase2ExtraFront" type="button">front extra</button><button id="phase2ExtraDuplicate" type="button">duplicate extra</button><button id="phase2ExtraDelete" type="button">delete extra</button><button id="phase2ReplaceImage" type="button">replace image</button>
    </div>
  </aside>
  <script>
    const text={id:'text-1',type:'text',fontFamily:'Pretendard',size:18,weight:700,align:'left',color:'#112233',w:80,locked:false};
    const image={id:'image-1',type:'image',w:80,h:50,fit:'cover',focusX:50,focusY:50,opacity:100,locked:false};
    const shape={id:'shape-1',type:'shape',shape:'rect',w:60,h:40,fill:'#dceeff',stroke:'#12396d',strokeWidth:1,cornerRadius:0,opacity:100,locked:false};
    const project={activeSurface:'front',surfaces:[{id:'front',elements:[text],extras:[image,shape]}]};
    window.DesignEditorApp={project};
    const calls={arrange:[],textDuplicate:0,textDelete:0,extraDuplicate:0,extraDelete:0,replace:0};
    const selectedExtra=()=>{const node=document.querySelector('.phase2-extra-object.selected');return project.surfaces[0].extras.find(item=>item.id===node?.dataset.extraId)||null;};
    document.getElementById('fontInput').addEventListener('change',event=>text.fontFamily=event.target.value);
    document.getElementById('sizeInput').addEventListener('input',event=>text.size=Number(event.target.value));
    document.getElementById('weightInput').addEventListener('change',event=>text.weight=Number(event.target.value));
    document.getElementById('colorInput').addEventListener('input',event=>text.color=event.target.value);
    document.querySelectorAll('[data-align]').forEach(button=>button.addEventListener('click',()=>text.align=button.dataset.align));
    document.getElementById('lockInput').addEventListener('change',event=>text.locked=event.target.checked);
    document.getElementById('duplicateBtn').addEventListener('click',()=>calls.textDuplicate+=1);
    document.getElementById('deleteBtn').addEventListener('click',()=>calls.textDelete+=1);
    document.querySelectorAll('[data-extra-field]').forEach(control=>{
      const eventName=control.tagName==='SELECT'?'change':'input';
      control.addEventListener(eventName,event=>{
        const item=selectedExtra();if(!item)return;const field=control.dataset.extraField;
        item[field]=control.tagName==='SELECT'?event.target.value:Number(event.target.value);
        if(['fill','stroke'].includes(field))item[field]=event.target.value;
      });
    });
    document.getElementById('quickCornerRadius').addEventListener('input',event=>{const item=selectedExtra();if(item)item.cornerRadius=Number(event.target.value);});
    document.getElementById('phase2ExtraLock').addEventListener('change',event=>{const item=selectedExtra();if(item)item.locked=event.target.checked;});
    document.getElementById('phase2ExtraDuplicate').addEventListener('click',()=>calls.extraDuplicate+=1);
    document.getElementById('phase2ExtraDelete').addEventListener('click',()=>calls.extraDelete+=1);
    document.getElementById('phase2ReplaceImage').addEventListener('click',()=>calls.replace+=1);
    window.DesignEditorPhase3Controls={alignSelected(value){calls.arrange.push(value);}};
  </script>
  <script src="/js/design-editor/selection-contextbar.js?v=20260828-1"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.designContextbarStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.designContextbarStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=7000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,25));}throw new Error('timeout: '+label);};
      const input=(node,value,type='input')=>{node.value=value;node.dispatchEvent(new Event(type,{bubbles:true}));};
      const selectText=()=>{document.querySelectorAll('.selected').forEach(node=>node.classList.remove('selected'));const node=document.createElement('div');node.className='design-text selected';node.dataset.id=text.id;document.getElementById('artboard').appendChild(node);return node;};
      const selectExtra=item=>{document.querySelectorAll('.selected').forEach(node=>node.classList.remove('selected'));const node=document.createElement('div');node.className='phase2-extra-object selected';node.dataset.extraId=item.id;document.getElementById('artboard').appendChild(node);return node;};
      try{
        await waitFor(()=>window.DesignEditorSelectionContextbar,'runtime');
        const textNode=selectText();
        await waitFor(()=>{const bar=document.getElementById('designSelectionContextbar');return bar&&!bar.hidden&&bar.dataset.contextKind==='text';},'text context');
        let bar=document.getElementById('designSelectionContextbar');
        assert(document.documentElement.dataset.designSelectionContext==='text','글씨 선택 컨텍스트 상태가 없습니다.');
        assert(getComputedStyle(document.getElementById('designCanvasQuickbar')).display==='none','기존 캔버스 퀵바가 중복 표시됩니다.');
        input(bar.querySelector('[data-context-field="text-font"]'),'Arial','change');
        input(bar.querySelector('[data-context-field="text-size"]'),'26');
        input(bar.querySelector('[data-context-field="text-weight"]'),'900','change');
        input(bar.querySelector('[data-context-field="text-color"]'),'#445566');
        bar.querySelector('[data-context-text-align="center"]').click();
        const arrange=bar.querySelector('[data-context-arrange]');input(arrange,'center','change');
        bar.querySelector('[data-context-action="duplicate"]').click();
        await waitFor(()=>text.fontFamily==='Arial'&&text.size===26&&text.weight===900&&text.color==='#445566'&&text.align==='center','text proxy values');
        assert(calls.arrange.includes('center')&&calls.textDuplicate===1,'글씨 배치·복제 프록시가 동작하지 않습니다.');
        document.body.dataset.designContextbarText='font-size-weight-color-align';

        textNode.classList.remove('selected');
        const imageNode=selectExtra(image);
        await waitFor(()=>{const node=document.getElementById('designSelectionContextbar');return node.dataset.contextKind==='image';},'image context');
        bar=document.getElementById('designSelectionContextbar');
        input(bar.querySelector('[data-context-field="extra-w"]'),'95');
        input(bar.querySelector('[data-context-field="extra-h"]'),'62');
        input(bar.querySelector('[data-context-field="image-fit"]'),'contain','change');
        input(bar.querySelector('[data-context-field="image-focus-x"]'),'35');
        input(bar.querySelector('[data-context-field="image-focus-y"]'),'65');
        input(bar.querySelector('[data-context-field="extra-opacity"]'),'82');
        bar.querySelector('[data-context-action="replace"]').click();
        bar.querySelector('[data-context-action="duplicate"]').click();
        await waitFor(()=>image.w===95&&image.h===62&&image.fit==='contain'&&image.focusX===35&&image.focusY===65&&image.opacity===82,'image proxy values');
        assert(calls.replace===1&&calls.extraDuplicate===1,'이미지 교체·복제 프록시가 동작하지 않습니다.');
        document.body.dataset.designContextbarImage='size-fit-focus-opacity';

        imageNode.classList.remove('selected');
        const shapeNode=selectExtra(shape);
        await waitFor(()=>document.getElementById('designSelectionContextbar').dataset.contextKind==='shape','shape context');
        bar=document.getElementById('designSelectionContextbar');
        input(bar.querySelector('[data-context-field="shape-fill"]'),'#abcdef');
        input(bar.querySelector('[data-context-field="shape-stroke"]'),'#223344');
        input(bar.querySelector('[data-context-field="shape-stroke-width"]'),'2.4');
        input(bar.querySelector('[data-context-field="shape-radius"]'),'5');
        input(bar.querySelector('[data-context-field="extra-opacity"]'),'70');
        await waitFor(()=>shape.fill==='#abcdef'&&shape.stroke==='#223344'&&shape.strokeWidth===2.4&&shape.cornerRadius===5&&shape.opacity===70,'shape proxy values');
        document.body.dataset.designContextbarShape='fill-stroke-radius-opacity';
        document.body.dataset.designContextbarProxy='existing-inspector-controls';
        document.body.dataset.designContextbarFloating='suppressed-when-context';

        shapeNode.classList.remove('selected');
        window.DesignEditorSelectionContextbar.sync();
        await waitFor(()=>document.getElementById('designSelectionContextbar').hidden,'context hidden');
        assert(!document.documentElement.dataset.designSelectionContext,'선택 해제 후 컨텍스트 상태가 남아 있습니다.');
        assert(getComputedStyle(document.getElementById('designCanvasQuickbar')).display==='block','선택 해제 후 기존 퀵바 표시 계약이 복구되지 않았습니다.');
        pass('selection contextbar: 글씨·이미지·도형 속성이 기존 inspector와 layout API를 통해 동기화됨');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
