<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image Editor Headerless Smoke</title>
  <link rel="stylesheet" href="/css/image-editor.css?v=20260823-2">
  <link rel="stylesheet" href="/css/image-editor-workflow.css?v=20260823-3">
  <link rel="stylesheet" href="/css/image-editor-pro.css?v=20260826-1">
  <link rel="stylesheet" href="/css/image-editor-pdf-layout.css?v=20260826-2">
  <link rel="stylesheet" href="/css/image-editor-headerless.css?v=20260830-1">
</head>
<body class="image-editor-pro" data-image-headerless-smoke="pending">
  <header class="app-header">
    <a class="home-link" href="/">← 홈</a>
    <div class="brand-block"><strong>이미지 편집기</strong><span>기존 상단 제목</span></div>
    <div class="header-actions">
      <button id="undoBtn" type="button">실행 취소</button>
      <button id="resetBtn" type="button">원본 복원</button>
      <button id="exportBtn" type="button">이미지 저장</button>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar"><section class="tool-card upload-card"><div class="tool-title">이미지</div></section></aside>
    <section class="stage-wrap"><div class="stage-toolbar"></div><div class="drop-zone"></div><footer class="status-bar">상태</footer></section>
  </main>
  <div id="result">PENDING</div>
  <script>
  (()=>{
    const result=document.getElementById('result');
    const assert=(condition,message)=>{if(!condition)throw new Error(message)};
    try{
      const header=document.querySelector('.app-header');
      const workspace=document.querySelector('.workspace');
      const sidebar=document.querySelector('.sidebar');
      const actions=document.querySelector('.header-actions');
      const rect=workspace.getBoundingClientRect();
      assert(getComputedStyle(header).display==='contents','header band must not occupy layout space');
      assert(getComputedStyle(document.querySelector('.brand-block')).display==='none','old header title must be hidden');
      assert(Math.abs(rect.top)<1,'workspace must start at viewport top');
      assert(Math.abs(rect.height-window.innerHeight)<2,'desktop workspace must use full viewport height');
      assert(getComputedStyle(actions).position==='fixed','undo/reset controls must remain available in compact sidebar area');
      assert(getComputedStyle(document.getElementById('exportBtn')).display==='none','duplicate header save button must be hidden');
      assert(parseFloat(getComputedStyle(sidebar).paddingTop)>=50,'sidebar must reserve room for compact local controls');
      document.body.dataset.imageHeaderlessSmoke='pass';
      result.textContent='PASS: image editor header removed and preview uses full viewport while local actions remain available';
    }catch(error){
      document.body.dataset.imageHeaderlessSmoke='fail';
      result.textContent='FAIL: '+String(error?.message||error);
    }
  })();
  </script>
</body>
</html>
