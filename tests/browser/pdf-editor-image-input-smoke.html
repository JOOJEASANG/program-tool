<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>PDF editor image input smoke</title></head>
<body>
  <div id="uploadZone"><span id="uploadZoneText">PDF 파일</span><span id="uploadZoneSub"></span></div>
  <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple>
  <div id="statusBar"></div>
  <script>
    const imported=[];
    const pdfCalls=[];
    let thumbRefreshes=0;
    var parsedPages=[];
    window.jspdf={jsPDF:class FakeJsPdf{
      constructor(options){this.options=options;this.images=[];pdfCalls.push(this);}
      addImage(){this.images.push(Array.from(arguments));}
      output(kind){if(kind!=='blob')throw new Error('unexpected output kind');return new Blob(['%PDF-1.4\n% image adapter smoke\n'],{type:'application/pdf'});}
    }};
    window.showStatus=function(message,type){document.body.dataset.status=type||'info';document.body.dataset.message=message;};
    window.renderThumbs=function(){thumbRefreshes++;};
    window.handleFile=async function(file){
      imported.push(file);
      parsedPages.push({id:`p${parsedPages.length+1}`,pageType:'pdf',sourceFile:file.name,rotation:0});
    };
  </script>
  <script src="/js/image-pdf-adapter.js?v=smoke"></script>
  <script src="/js/pdf-editor/image-input-bridge.js?v=smoke"></script>
  <script>
    (async()=>{
      const fail=message=>{document.documentElement.dataset.pdfEditorImageInputSmoke='fail';document.body.dataset.error=message;};
      try{
        await new Promise(r=>setTimeout(r,120));
        const api=window.ProgramImagePdfAdapter;
        if(!api)throw new Error('adapter missing');
        if(!window.PdfEditorImageInput)throw new Error('bridge missing');
        if(!document.getElementById('fileInput').accept.includes('image/png'))throw new Error('image accept missing');
        if(!document.getElementById('uploadZoneText').textContent.includes('이미지'))throw new Error('upload label not updated');

        const canvas=document.createElement('canvas');canvas.width=300;canvas.height=600;
        const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,300,600);ctx.fillStyle='#12396d';ctx.fillRect(30,40,240,520);
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
        if(!blob)throw new Error('sample png creation failed');
        const imageFile=new File([blob],'sample.png',{type:'image/png',lastModified:123});
        const converted=await api.imageToPdf(imageFile,{dpi:300});
        if(converted.type!=='application/pdf'||!converted.name.endsWith('.pdf'))throw new Error('conversion did not return PDF File');
        if(converted.__sourceType!=='image')throw new Error('source marker missing on converted file');
        const call=pdfCalls[0];
        if(!call)throw new Error('jsPDF constructor was not called');
        const format=call.options?.format||[];
        if(Math.abs(Number(format[0])-25.4)>0.05||Math.abs(Number(format[1])-50.8)>0.05)throw new Error(`unexpected page size ${format}`);
        if(call.images.length!==1)throw new Error('image was not embedded once');

        await window.PdfEditorImageInput.importFiles([imageFile]);
        if(imported.length!==1)throw new Error('bridge did not import converted image');
        if(imported[0].type!=='application/pdf')throw new Error('bridge passed non-PDF into canonical editor');
        if(imported[0].__sourceType!=='image')throw new Error('bridge source marker missing');
        if(parsedPages.length!==1)throw new Error('editor page was not created');
        if(parsedPages[0].sourceType!=='image')throw new Error('editor page image source marker missing');
        if(parsedPages[0].sourceFile!=='sample.png')throw new Error('editor page original filename not restored');
        if(parsedPages[0].sourceOriginalName!=='sample.png')throw new Error('editor original source name missing');
        if(Number(parsedPages[0].imageMeta?.dpi)!==300)throw new Error('editor image dpi metadata missing');
        if(Number(parsedPages[0].imageMeta?.widthPx)!==300||Number(parsedPages[0].imageMeta?.heightPx)!==600)throw new Error('editor image pixel metadata missing');
        if(thumbRefreshes<1)throw new Error('thumbnail labels were not refreshed');

        const pdfFile=new File([new Blob(['%PDF-1.4\n'],{type:'application/pdf'})],'original.pdf',{type:'application/pdf',lastModified:456});
        await window.PdfEditorImageInput.importFiles([pdfFile]);
        if(parsedPages.length!==2)throw new Error('PDF page was not added');
        if(parsedPages[1].sourceType==='image')throw new Error('ordinary PDF was marked as image');
        if(parsedPages[1].sourceFile!=='original.pdf')throw new Error('ordinary PDF label changed');
        document.documentElement.dataset.pdfEditorImageInputSmoke='pass';
      }catch(error){fail(error?.message||String(error));}
    })();
  </script>
</body>
</html>
