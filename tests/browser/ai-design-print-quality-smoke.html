<!doctype html><html lang="ko"><meta charset="utf-8"><title>Print design enhancer browser smoke</title>
<body data-status="running"><pre id="result">running</pre><script>
(async()=>{
  const assert=(ok,message)=>{if(!ok)throw new Error(message);};
  const source=await (await fetch('/ai-design-maker/index.html')).text();
  const parsed=new DOMParser().parseFromString(source,'text/html');
  for(const old of ['generateBtn','additionalPrompt','generationQuality','galleryBtn']) {
    assert(!parsed.getElementById(old),'retired AI creator visible: '+old);
  }
  for(const id of ['fileInput','trimWidth','trimHeight','bleedMm','processBtn','saveBtn','beforeCanvas','afterCanvas','confirmCheck']){
    assert(parsed.getElementById(id),'missing print finisher control '+id);
  }
  parsed.querySelectorAll('script,link[href^="https:"]').forEach(n=>n.remove());
  const frame=document.createElement('iframe');document.body.appendChild(frame);
  frame.srcdoc='<!doctype html>'+parsed.documentElement.outerHTML;
  await new Promise(r=>frame.onload=r);
  const w=frame.contentWindow;
  w.auth={currentUser:{uid:'test',getIdToken:async()=>'test'},onAuthStateChanged:fn=>fn({uid:'test'})};
  const js=await (await fetch('/js/design-bleed-enhancer.js')).text();
  w.eval(js);
  assert(w.DesignBleedEnhancer?.state,'new print finisher not initialized');
  const $=id=>w.document.getElementById(id);
  assert($('studio').hidden===false,'authenticated editor not opened');
  assert($('studio').classList.contains('layout-app'),'workspace is not editor-style two-pane layout');
  assert($('studio').querySelector('aside.sidebar.controls'),'left settings sidebar missing');
  assert($('studio').querySelector('main.workspace .preview-panel'),'right preview workspace missing');
  assert($('studio').querySelector('.sidebar-top .top-actions'),'common program navigation missing');
  assert($('enhancerHomeBtn')?.getAttribute('href')==='/','program home navigation missing');
  assert($('logoutBtn'),'logout action missing');
  assert($('previewGrid').dataset.previewMode==='compare','comparison should be initial view');
  const modes=[...w.document.querySelectorAll('button[data-preview-mode]')];
  assert(modes.length===3,'preview mode toolbar missing');
  modes.find(button=>button.dataset.previewMode==='original').click();
  assert($('previewGrid').dataset.previewMode==='original','original-only preview mode failed');
  assert(modes.find(button=>button.dataset.previewMode==='original').getAttribute('aria-pressed')==='true','active preview tab not accessible');
  modes.find(button=>button.dataset.previewMode==='result').click();
  assert($('previewGrid').dataset.previewMode==='result','enhanced-only preview mode failed');
  modes.find(button=>button.dataset.previewMode==='compare').click();
  assert($('previewGrid').dataset.previewMode==='compare','comparison preview did not restore');
  assert($('processBtn').disabled,'processing incorrectly enabled before file upload');
  assert($('edgeJumpBtn').disabled,'edge inspector should be disabled without results');
  assert($('previewZoom')?.value==='1','preview should start fitted to pane');
  assert($('guideToggle').checked,'guides should be initially visible');
  $('expandPreviewBtn').click();
  assert($('studio').classList.contains('preview-expanded'),'wide preview did not hide sidebar');
  assert($('expandPreviewBtn').getAttribute('aria-pressed')==='true','wide preview button state missing');
  $('expandPreviewBtn').click();
  assert(!$('studio').classList.contains('preview-expanded'),'side panel could not be restored');
  const canvas=w.document.createElement('canvas');canvas.width=600;canvas.height=900;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#268079';ctx.fillRect(0,0,600,900);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  const file=new w.File([blob],'invitation.png',{type:'image/png'});
  const dt=new w.DataTransfer();dt.items.add(file);
  $('fileInput').files=dt.files;
  $('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));
  for(let i=0;i<80&&$('fileInfo').hidden;i++)await new Promise(r=>setTimeout(r,50));
  assert(!$('fileInfo').hidden,'image upload did not load');
  assert($('fileName').textContent==='invitation.png','file name missing');
  assert($('beforeCanvas').width>1,'original image preview not drawn');
  for(let i=0;i<80&&$('processBtn').disabled;i++)await new Promise(r=>setTimeout(r,50));
  assert(!$('processBtn').disabled,'valid file and trim should enable correction');
  const sharedSource=await (await fetch('/js/shared-paper-favorites.js')).text();
  w.eval(sharedSource);
  const fav=w.SharedPaperFavorites;
  assert(fav?.load&&fav.save,'shared paper favorite library missing');
  const unique='시험용 '+Date.now().toString(36);
  $('sharedPaperName').value=unique;
  $('trimWidth').value='305';$('trimHeight').value='457';
  $('trimWidth').dispatchEvent(new w.Event('change'));
  $('trimHeight').dispatchEvent(new w.Event('change'));
  $('sharedPaperSave').click();
  const saved=fav.load().find(p=>p.name===unique);
  assert(saved&&saved.width===305&&saved.height===457,'saving custom 305x457 paper failed');
  $('trimWidth').value='210';$('trimHeight').value='297';
  $('sharedPaperSelect').value=saved.id;
  $('sharedPaperSelect').dispatchEvent(new w.Event('change'));
  assert(Number($('trimWidth').value)===305&&Number($('trimHeight').value)===457,
    'shared paper favorite not applied to design finisher');
  fav.remove(saved.id);
  $('edgeMode').value='ai';$('edgeMode').dispatchEvent(new w.Event('change'));
  assert(!$('aiBleedOptions').hidden,'AI option panel did not open');
  assert($('processBtn').disabled,'AI upload should require explicit data/cost consent');
  $('aiConsent').checked=true;$('aiConsent').dispatchEvent(new w.Event('change'));
  assert(!$('processBtn').disabled,'AI mode did not enable after consent');
  $('edgeMode').value='mirror';$('edgeMode').dispatchEvent(new w.Event('change'));
  assert($('aiBleedOptions').hidden,'basic extension should hide AI settings');
  const beforeFitWidth=$('beforeCanvas').width;
  $('previewZoom').value='2';
  $('previewZoom').dispatchEvent(new w.Event('change'));
  await w.DesignBleedEnhancer.state.renderQueue;
  assert($('beforeCanvas').width>beforeFitWidth*1.35,'200% zoom did not render a larger canvas');
  $('previewZoom').value='1';
  $('previewZoom').dispatchEvent(new w.Event('change'));
  await w.DesignBleedEnhancer.state.renderQueue;
  $('guideToggle').checked=false;
  $('guideToggle').dispatchEvent(new w.Event('change'));
  assert(!$('guideToggle').checked,'guides could not be hidden to reveal actual fill');
  $('guideToggle').checked=true;
  $('guideToggle').dispatchEvent(new w.Event('change'));
  $('sizePreset').value='a4';$('sizePreset').dispatchEvent(new w.Event('change'));
  assert(Number($('trimWidth').value)===210&&Number($('trimHeight').value)===297,'paper preset failed');
  assert($('outputSize').textContent.includes('216.0×303.0mm'),'3mm bleed size math failed');
  $('trimWidth').value='';$('trimWidth').dispatchEvent(new w.Event('input'));
  assert($('processBtn').disabled,'invalid trim dimension did not block processing');
  $('trimWidth').value='210';$('trimWidth').dispatchEvent(new w.Event('input'));
  assert(!$('processBtn').disabled,'restored trim dimension did not enable processing');
  assert($('saveBtn').disabled,'download enabled without proof and correction');
  // Exercise the separate 4x render from the completed PDF. A controlled PDF
  // page mock fills pixels with color so this proves the inspector displays
  // source content rather than a decorative/blank preview.
  const realPageColor=[232,115,72];
  const fakeResult={
    getPage:async()=>({
      getViewport:({scale})=>({width:216*72/25.4*scale,height:303*72/25.4*scale}),
      render:({canvasContext})=>{
        canvasContext.fillStyle='rgb('+realPageColor.join(',')+')';
        canvasContext.fillRect(0,0,canvasContext.canvas.width,canvasContext.canvas.height);
        return {promise:Promise.resolve()};
      }
    }),
    destroy:async()=>{}
  };
  const enhancer=w.DesignBleedEnhancer;
  enhancer.state.resultPdf=fakeResult;
  enhancer.state.resultSettings={trim_width_mm:210,trim_height_mm:297,bleed_mm:3};
  enhancer.setEdgeSide('top');
  await enhancer.state.renderQueue;
  assert($('edgeInspectEmpty').hidden,'edge inspector still shows empty placeholder');
  assert($('edgeInspectCanvas').width>100,'rendered top edge is too small');
  const topCtx=$('edgeInspectCanvas').getContext('2d');
  const px=topCtx.getImageData(3,3,1,1).data;
  assert(px[0]===232&&px[1]===115&&px[2]===72,'edge inspector does not render actual PDF pixels');
  $('edgePosition').value='100';
  $('edgePosition').dispatchEvent(new w.Event('change'));
  await enhancer.state.renderQueue;
  assert($('edgeInspectStatus').textContent.includes('끝 부분'),'edge inspector end-position selection failed');
  enhancer.setEdgeSide('left');
  await enhancer.state.renderQueue;
  assert($('edgeInspectStatus').textContent.includes('90°'),'side-edge rotation inspection missing');
  assert($('edgeInspectCanvas').width>$('edgeInspectCanvas').height,'side edge should be displayed horizontally');
  $('resetBtn').click();
  assert($('processBtn').disabled,'reset retained invalid active file');
  assert($('fileInfo').hidden,'reset should clear file');
  document.getElementById('result').textContent='PASS: file upload, preview, A4+3mm, validation, reset and no AI-generation controls';
  document.body.dataset.status='pass';
})().catch(error=>{document.body.dataset.status='fail';document.getElementById('result').textContent=String(error.stack||error);});
</script></body></html>
