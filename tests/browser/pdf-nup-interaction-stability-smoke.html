<!doctype html>
<html lang="ko" data-pdf-nup-stability-smoke="pending" data-pdf-nup-stability-host="1" data-pdf-preview-zoom-persistence-host="1">
<head>
  <meta charset="utf-8">
  <title>N-up interaction stability smoke</title>
  <style>
    body{margin:0;min-height:1800px;padding-top:120px}
    #previewScroll{width:460px;height:320px;overflow:auto;border:1px solid #ccc}
    .spacer{height:180px}
    .page-preview{position:relative;width:400px;height:560px;margin:0 auto;background:#eee}
    canvas{display:block;width:400px;height:560px}
    .pdf-nup-adjust-overlay{position:absolute;inset:0;pointer-events:none}
    .pdf-nup-adjust-hit{position:absolute;left:40px;top:70px;width:300px;height:410px;pointer-events:auto;touch-action:none}
  </style>
</head>
<body>
  <div id="zoomControls">
    <button id="zoomOutBtn" type="button">-</button>
    <span id="zoomLabel">150%</span>
    <button id="zoomInBtn" type="button">+</button>
    <button id="zoomResetBtn" type="button">reset</button>
  </div>
  <div id="previewScroll">
    <div class="spacer" id="previewLeadSpacer"></div>
    <div class="page-preview" data-output-index="17">
      <canvas width="400" height="560"></canvas>
      <div class="pdf-nup-adjust-overlay">
        <div class="pdf-nup-adjust-hit" data-page-id="p1"></div>
      </div>
    </div>
    <div class="spacer"></div>
  </div>
  <div id="pdfNupAdjustSelectedLabel"></div>
  <div id="pdfNupAdjustBadge"></div>
  <input id="pdfNupAdjustScaleRange" value="100">
  <input id="pdfNupAdjustScale" value="100">
  <input id="pdfNupAdjustX" value="0">
  <input id="pdfNupAdjustY" value="0">
  <input id="pdfNupAdjustState" value="기본">
  <input id="pdfPageCropLeftV1" type="number" value="0">

  <script>
    window.parsedPages=[{id:'p1',page_index:0,sourceFile:'scan.pdf',nupScale:1,nupOffsetX:0,nupOffsetY:0}];
    window.getSettings=()=>({pw:210,ph:297});
    window.__selectedCalls=0;
    window.__lazyCalls=0;
    window.__previewZoom=1.5;
    window.__autoFitCalls=0;
    window.displayPreview=function(_pages,autoFit=false){
      if(autoFit){
        window.__autoFitCalls+=1;
        window.__previewZoom=1.25;
      }
      document.getElementById('zoomLabel').textContent=Math.round(window.__previewZoom*100)+'%';
      return window.__previewZoom;
    };
    document.getElementById('zoomInBtn').addEventListener('click',()=>{
      window.__previewZoom=2;
      window.displayPreview([],false);
    });
    document.getElementById('zoomOutBtn').addEventListener('click',()=>{
      window.__previewZoom=1.5;
      window.displayPreview([],false);
    });
    document.getElementById('zoomResetBtn').addEventListener('click',()=>{
      window.displayPreview([],true);
    });
    window.PdfNupPageAdjust={
      valuesForPage(page){return{scale:page.nupScale,offsetX:page.nupOffsetX,offsetY:page.nupOffsetY};},
      setValues(page,next){
        if(Number.isFinite(Number(next.scale)))page.nupScale=Math.max(.5,Math.min(3,Number(next.scale)));
        if(Number.isFinite(Number(next.offsetX)))page.nupOffsetX=Math.max(-200,Math.min(200,Number(next.offsetX)));
        if(Number.isFinite(Number(next.offsetY)))page.nupOffsetY=Math.max(-200,Math.min(200,Number(next.offsetY)));
      },
      selectPage(){window.__selectedCalls+=1;}
    };
    window.PdfViewportLazyPreview={
      requestRender(){window.__lazyCalls+=1;return Promise.resolve(true);}
    };
  </script>
  <script src="/js/pdf-editor/preview-zoom-persistence.js?v=smoke"></script>
  <script src="/js/pdf-editor/nup-interaction-stability.js?v=smoke"></script>
  <script>
    setTimeout(async()=>{
      try{
        const scroll=document.getElementById('previewScroll');
        const hit=document.querySelector('.pdf-nup-adjust-hit');
        let legacyPointerDown=0;
        hit.addEventListener('pointerdown',()=>{legacyPointerDown+=1;});

        document.getElementById('zoomInBtn').click();
        const pinnedAt200=window.__previewZoom===2
          && document.getElementById('zoomLabel').textContent==='200%'
          && window.PdfPreviewZoomPersistence?.isPinned?.()===true;

        scroll.scrollTop=130;
        const initialTop=scroll.scrollTop;
        const rect=hit.getBoundingClientRect();
        const x=rect.left+80;
        const y=rect.top+120;

        hit.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:11,button:0,clientX:x,clientY:y}));
        const lazyResult=await window.PdfViewportLazyPreview.requestRender(22);

        scroll.scrollTop=245;
        scroll.dispatchEvent(new Event('scroll',{bubbles:false}));
        hit.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerId:11,button:0,clientX:x+35,clientY:y+22}));
        const duringTop=scroll.scrollTop;

        hit.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:11,button:0,clientX:x+35,clientY:y+22}));
        hit.dispatchEvent(new MouseEvent('click',{bubbles:true,button:0,clientX:x+35,clientY:y+22}));

        // Simulate a background/canonical refresh asking for auto-fit after editing.
        window.displayPreview([],true);
        const sticky200=window.__previewZoom===2
          && document.getElementById('zoomLabel').textContent==='200%'
          && window.__autoFitCalls===0;

        // A user-requested reset is allowed to auto-fit and becomes the new chosen zoom.
        document.getElementById('zoomResetBtn').click();
        const explicitReset=window.__autoFitCalls===1
          && window.__previewZoom===1.25
          && document.getElementById('zoomLabel').textContent==='125%';

        await new Promise(resolve=>setTimeout(resolve,140));
        const page=window.parsedPages[0];
        const moved=Math.abs(page.nupOffsetX)>0.1||Math.abs(page.nupOffsetY)>0.1;
        const fixed=initialTop===130&&duringTop===initialTop&&scroll.scrollTop===initialTop;
        const legacyBlocked=legacyPointerDown===0;
        const lazyBlocked=lazyResult===false&&window.__lazyCalls===0;
        const selectedOnce=window.__selectedCalls===1;
        const dragUnlocked=document.documentElement.dataset.pdfNupInteractionLock!=='1';

        // Precision edits used to rebuild the preview and move both the inner
        // preview scroller and the browser window. Force that failure shape here:
        // a layout shift before the selected output plus hostile scroll changes.
        const cropInput=document.getElementById('pdfPageCropLeftV1');
        const preview=document.querySelector('.page-preview');
        const spacer=document.getElementById('previewLeadSpacer');
        window.scrollTo(0,80);
        scroll.scrollTop=130;
        const anchorBefore=preview.getBoundingClientRect().top-scroll.getBoundingClientRect().top;
        const windowBefore=window.scrollY;
        cropInput.addEventListener('input',()=>{
          spacer.style.height='260px';
          scroll.scrollTop=285;
          window.scrollTo(0,260);
        });
        cropInput.focus({preventScroll:true});
        cropInput.value='12';
        cropInput.dispatchEvent(new Event('input',{bubbles:true}));
        await new Promise(resolve=>setTimeout(resolve,240));
        const anchorAfter=preview.getBoundingClientRect().top-scroll.getBoundingClientRect().top;
        const advancedFixed=Math.abs(anchorAfter-anchorBefore)<1&&Math.abs(window.scrollY-windowBefore)<1;
        const advancedLocked=document.documentElement.dataset.pdfAdvancedViewportLock==='1';
        cropInput.blur();
        await new Promise(resolve=>setTimeout(resolve,860));
        const advancedUnlocked=document.documentElement.dataset.pdfAdvancedViewportLock!=='1';

        const pass=moved&&fixed&&legacyBlocked&&lazyBlocked&&selectedOnce&&dragUnlocked
          &&pinnedAt200&&sticky200&&explicitReset&&advancedFixed&&advancedLocked&&advancedUnlocked;
        document.documentElement.dataset.pdfNupStabilitySmoke=pass?'pass':'fail';
        const out=document.createElement('pre');
        out.id='result';
        out.textContent=pass
          ?'PASS: N-up mouse edit keeps scroll/output face fixed and preserves user-selected 200% preview zoom; precision edit also keeps the advanced viewport stationary'
          :`FAIL moved=${moved} fixed=${fixed} legacy=${legacyPointerDown} lazy=${window.__lazyCalls}/${lazyResult} selected=${window.__selectedCalls} dragUnlocked=${dragUnlocked} pinned200=${pinnedAt200} sticky200=${sticky200} reset=${explicitReset} advancedFixed=${advancedFixed} advancedLocked=${advancedLocked} advancedUnlocked=${advancedUnlocked} anchor=${anchorAfter}/${anchorBefore} window=${window.scrollY}/${windowBefore} top=${scroll.scrollTop}/${initialTop}`;
        document.body.appendChild(out);
      }catch(error){
        document.documentElement.dataset.pdfNupStabilitySmoke='fail';
        const out=document.createElement('pre');
        out.textContent='FAIL '+(error?.stack||error);
        document.body.appendChild(out);
      }
    },160);
  </script>
</body>
</html>
