<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Print Production Stage2 Smoke</title>
  <style>
    .hidden{display:none!important}body{font-family:Arial,sans-serif;margin:0;padding:12px}.sidebar{width:320px}.side-card{border:1px solid #ddd;padding:8px;margin:4px 0}#editorShell{display:grid;grid-template-columns:320px 1fr;gap:12px}#artboardViewport{width:900px;height:700px;overflow:auto}#artboard{position:relative;background:#fff}.design-object,.phase2-extra-object{position:absolute}.editor-status{font-size:12px}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?print-production-stage2-smoke=1&embed=1');
  </script>
</head>
<body data-stage2-smoke-status="pending">
  <div id="stage2SmokeResult">PENDING</div>
  <div id="authLoading"></div><span id="navUserName"></span><button id="logoutBtn" type="button">logout</button>
  <main id="startScreen"><button id="resumeDraftBtn" class="hidden" type="button">resume</button><div id="presetGrid"></div><input id="customWidth" value="210"><input id="customHeight" value="297"><button id="customStartBtn" type="button">custom</button><button id="coverEditorBtn" type="button">cover</button></main>
  <main id="editorShell" class="hidden">
    <aside class="sidebar">
      <section class="side-card"><div id="documentTitle"></div><div id="documentMeta"></div><button id="newDesignBtn" type="button">new</button></section>
      <section class="side-card"><button id="addTitleBtn" type="button">title</button><button id="addSubtitleBtn" type="button">subtitle</button><button id="addBodyBtn" type="button">body</button><button id="addInfoBtn" type="button">info</button></section>
      <section id="inspector" class="side-card"></section><section class="side-card"><div id="layerList"></div></section>
    </aside>
    <section><div id="surfaceTabs"></div><div id="saveState"></div><div id="artboardViewport"><div id="artboard"></div></div><div class="editor-footer"><div id="editorStatus" class="editor-status"></div></div></section>
  </main>
  <script src="/js/design-editor/presets.js"></script>
  <script src="/js/design-editor/app.js"></script>
  <script src="/js/design-editor/phase2.js"></script>
  <script src="/js/design-editor/output.js"></script>
  <script src="/js/design-editor/phase22-final-print-check.js"></script>
  <script src="/js/design-editor/print-production-stage2.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('stage2SmokeResult');
      const fail=error=>{document.body.dataset.stage2SmokeStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.stage2SmokeStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40));}throw new Error('timeout: '+label);};
      const settle=()=>new Promise(resolve=>setTimeout(resolve,80));
      try{
        await waitFor(()=>window.DesignEditorApp,'DesignEditorApp');
        await waitFor(()=>window.DesignEditorPhase2,'DesignEditorPhase2');
        await waitFor(()=>window.DesignEditorOutput,'DesignEditorOutput');
        await waitFor(()=>window.DesignEditorFinalPrintCheck,'DesignEditorFinalPrintCheck');
        await waitFor(()=>window.DesignEditorPrintProductionStage2,'DesignEditorPrintProductionStage2');
        await waitFor(()=>document.getElementById('designPrintProductionStage2Tools'),'press-ready card');
        await waitFor(()=>document.getElementById('designQrCodeTools'),'QR tools');

        DesignEditorApp.startProject('flyer-a4');await settle();
        const project=DesignEditorApp.project;
        assert(project?.surfaces?.length===2,'stage2 smoke requires two surfaces');
        const front=project.surfaces[0];project.activeSurface=front.id;
        front.foldsY=[100];front.foldAxis='y';
        front.elements.push({id:'vertical_fold_text',type:'text',text:'상하 접지 검사',size:10,lineHeight:1.26,x:20,y:98,w:70,visible:true});
        const foldSummary=DesignEditorPrintProductionStage2.inspectStage2Project(project);
        assert(foldSummary.issues.some(item=>item.kind==='fold-y'),'vertical fold text warning missing');
        document.body.dataset.stage2FoldY='1';

        const tinyPng='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zy7sAAAAASUVORK5CYII=';
        window.qrcode=function(){return{addData(){},make(){},createDataURL(){return tinyPng;}};};
        const qr=await DesignEditorPrintProductionStage2.addQrCode({text:'https://example.com/print',sizeMm:16});await settle();
        assert(qr?.qrCodeV1===true&&qr.qrText.includes('example.com'),'QR metadata missing');
        const qrSummary=DesignEditorPrintProductionStage2.inspectStage2Project(project);
        assert(qrSummary.issues.some(item=>item.kind==='qr-small'),'small QR warning missing');
        document.body.dataset.stage2Qr='1';

        const combined=await DesignEditorFinalPrintCheck.inspectProject();
        assert(combined.issues.some(item=>item.kind==='fold-y'),'enhanced final check lost vertical fold warning');
        assert(combined.issues.some(item=>item.kind==='qr-small'),'enhanced final check lost QR warning');

        const pdfInstances=[];
        class Stage2JsPdf{
          constructor(options){this.options=options;this.pages=[{format:options.format,orientation:options.orientation}];this.images=[];this.lines=[];pdfInstances.push(this);}
          addPage(format,orientation){this.pages.push({format,orientation});}
          addImage(data,format,x,y,w,h,alias,compression){this.images.push({data,format,x,y,w,h,alias,compression});}
          setDrawColor(){}setLineWidth(){}line(...args){this.lines.push(args);}setProperties(){}
          getNumberOfPages(){return this.pages.length;}
          output(kind){assert(kind==='blob','press PDF output must request blob');return new Blob(['%PDF-1.4 stage2 smoke'],{type:'application/pdf'});}
        }
        window.CoverJsPdfLoader={ensure:async()=>Stage2JsPdf,ready:()=>true,stage:'stage2-smoke'};
        const press=await DesignEditorPrintProductionStage2.generatePressPdf({includeMarks:true});
        assert(press.pageCount===2,'press PDF page count changed');
        assert(press.markCount===16,'crop mark line count changed');
        assert(press.blob instanceof Blob&&press.blob.size>0,'press PDF blob missing');
        assert(pdfInstances.length===1,'press PDF created unexpected document count');
        const pdf=pdfInstances[0];
        assert(Math.abs(Number(pdf.options.format[0])-232)<.001&&Math.abs(Number(pdf.options.format[1])-319)<.001,'press PDF media size changed');
        assert(pdf.images.length===2,'press PDF artwork page images missing');
        pdf.images.forEach(image=>{assert(Math.abs(image.x-8)<.001&&Math.abs(image.y-8)<.001,'press artwork offset changed');assert(Math.abs(image.w-216)<.001&&Math.abs(image.h-303)<.001,'press artwork dimensions changed');image.data='';});
        document.body.dataset.stage2PressPages=String(press.pageCount);
        document.body.dataset.stage2CropMarks=String(press.markCount);

        window.auth={currentUser:{getIdToken:async()=> 'stage2-test-token'}};
        const originalFetch=window.fetch;let fetchCall=null;
        window.fetch=async(url,options)=>{fetchCall={url,options};return{ok:true,status:200,headers:{get:()=> 'application/json'},json:async()=>({filename:'checked.pdf',page_count:2,score:96,checks:[{id:'page_size',label:'페이지 규격',severity:'pass',detail:'ok'}]})};};
        let report;
        try{report=await DesignEditorPrintProductionStage2.checkGeneratedPdf(press.blob,press.filename);}finally{window.fetch=originalFetch;}
        assert(report?.page_count===2,'generated PDF preflight report missing');
        assert(fetchCall?.url==='/api/preflight/check','generated PDF did not use direct preflight endpoint');
        assert(fetchCall?.options?.headers?.Authorization==='Bearer stage2-test-token','generated PDF preflight auth missing');
        assert(fetchCall?.options?.body instanceof FormData,'generated PDF preflight body is not FormData');
        document.body.dataset.stage2Preflight='direct';

        pass('vertical fold, QR safety, crop marks, exact generated PDF preflight');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
