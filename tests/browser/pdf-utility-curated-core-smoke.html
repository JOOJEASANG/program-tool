<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PDF Utility Curated Core Smoke</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:sans-serif}.top{height:62px}.wrap{min-height:900px}.tool{display:block}.local-panel{padding:20px}.local-actions{display:grid}.pdfu-tab{display:inline-block}
  </style>
</head>
<body data-pdf-utility-curated-core-smoke="running">
  <nav class="top"><div class="top-title">PDF 올인원</div><a class="top-link" href="/pdf-preflight/">검사</a><a class="top-link" href="/pdf-editor/">편집</a></nav>
  <main class="wrap" id="fixture">
    <div class="toolbar">legacy toolbar</div>
    <section id="pdf-primary-workspace"><button class="pdfu-tab active" data-pdf-unified-mode="merge" type="button">PDF 합치기</button><button class="pdfu-tab" data-pdf-unified-mode="extract" type="button">페이지 추출</button><div>기본 PDF 작업</div></section>
    <section class="local-panel" id="local-tools">
      <div class="local-head"><div class="local-head-icon">⚡</div><div><h2 id="localTitle">브라우저 로컬 빠른 처리</h2><p>선택한 PDF는 서버로 업로드하지 않습니다.</p></div><span class="local-badge">서버 업로드 없음</span></div>
      <label class="drop" id="localDrop" for="localFile"><strong>PDF 한 개를 선택하거나 여기에 놓으세요</strong><span>회전 · 역순 · 메타데이터 · 폼 평면화 / 권장 120MB 이하</span></label>
      <input id="localFile" type="file" accept="application/pdf,.pdf"><div class="file-note" id="localFileNote"></div>
      <div class="local-actions"><button class="local-btn" type="button" data-local-run="rotate90" disabled>↻ 90° 회전</button><button class="local-btn" type="button" data-local-run="rotate180" disabled>↻ 180° 회전</button><button class="local-btn" type="button" data-local-run="reverse" disabled>🔃 페이지 역순</button><button class="local-btn" type="button" data-local-run="metadata" disabled>ℹ️ 메타데이터 확인</button><button class="local-btn" type="button" data-local-run="sanitize" disabled>🧼 메타데이터 정리</button><button class="local-btn" type="button" data-local-run="flatten" disabled>📋 폼 평면화</button></div>
      <div class="local-status" id="localStatus"></div><div class="meta-box" id="localMetadata"></div>
    </section>
    <section class="roadmap"><div class="roadmap-tags"></div></section>
  </main>
  <div id="result">RUNNING</div>

  <script>
    history.replaceState(null,'','/pdf-suite/?smoke=curated-core');
    const fixture=document.getElementById('fixture');
    const tool=(name,{href='',status='available',local='',planned=false}={})=>`<${href?'a':'div'} class="tool ${planned?'planned':'available'}" data-status="${planned?'planned':status}" ${href?`href="${href}"`:''} ${local?`data-local-action="${local}"`:''}><span class="status ${planned?'plan':status==='local'?'local':'now'}">${planned?'예정':status==='local'?'로컬':'사용'}</span><span class="tool-icon">📄</span><span class="tool-name">${name}</span><span class="tool-desc">${name} 테스트 설명</span></${href?'a':'div'}>`;
    const addSection=(category,items)=>{const section=document.createElement('section');section.className='section';section.dataset.category=category;section.innerHTML=`<div class="tool-grid">${items.join('')}</div>`;fixture.insertBefore(section,document.getElementById('local-tools'));};
    addSection('pages',[tool('PDF 합치기',{href:'/pdf-preflight/'}),tool('페이지 추출·나누기',{href:'/pdf-preflight/'}),tool('시각적 페이지 정리',{href:'/pdf-preflight/'}),tool('빈 페이지 자동 제거',{href:'/pdf-preflight/'}),tool('전체 페이지 회전',{href:'#local-tools',status:'local',local:'rotate'}),tool('페이지 순서 역순',{href:'#local-tools',status:'local',local:'reverse'}),tool('빈 페이지 삽입',{href:'/pdf-editor/'})]);
    addSection('convert',[tool('이미지 → PDF',{href:'/pdf-preflight/'}),tool('PDF 이미지 변환',{href:'/pdf-preflight/'}),tool('OCR 문자 인식',{planned:true}),tool('텍스트·문서 추출',{planned:true}),tool('첨부파일 추출',{planned:true})]);
    addSection('edit',[tool('여백·크롭·배경',{href:'/pdf-preflight/'}),tool('N-up 다면 배치',{href:'/pdf-editor/'})]);
    addSection('security',[tool('AES-256 암호 설정',{href:'/pdf-preflight/'}),tool('암호 해제',{href:'/pdf-preflight/'}),tool('메타데이터 확인',{status:'local',local:'metadata'}),tool('메타데이터 정리',{status:'local',local:'sanitize'}),tool('폼 평면화',{status:'local',local:'flatten'}),tool('영구 마스킹·Redaction',{planned:true})]);
    addSection('print',[tool('PDF 프리플라이트',{href:'/pdf-preflight/'}),tool('안전 자동 수정',{href:'/pdf-preflight/'}),tool('인쇄물 사전 검토',{href:'/print-checker/'})]);
    addSection('scan',[tool('스캔 빈 페이지 정리',{href:'/pdf-preflight/'}),tool('스캔 PDF 압축',{href:'/pdf-preflight/'}),tool('검색 가능한 PDF',{planned:true})]);
    addSection('optimize',[tool('PDF 압축',{href:'/pdf-preflight/'}),tool('PDF/A 장기보존 변환',{planned:true})]);
    addSection('analyze',[tool('문서 구조·인쇄 진단',{href:'/pdf-preflight/'}),tool('문서 메타데이터 분석',{status:'local',local:'metadata'}),tool('PDF 버전 비교',{planned:true}),tool('접근성·태그 검사',{planned:true})]);

    window.auth={currentUser:{uid:'smoke-user',getIdToken:async()=> 'smoke-token'},onAuthStateChanged(callback){setTimeout(()=>callback(this.currentUser),0);return()=>{};}};
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const waitFor=async(fn,label,timeout=6000)=>{const start=Date.now();while(Date.now()-start<timeout){if(fn())return;await wait(20);}throw new Error('timeout: '+label);};
    const names=()=>[...document.querySelectorAll('[data-pdfu-tool] .pdfu-menu-name')].map(node=>node.textContent.trim());
    const button=name=>[...document.querySelectorAll('[data-pdfu-tool]')].find(node=>node.querySelector('.pdfu-menu-name')?.textContent.trim()===name)||null;
    const click=async name=>{const b=button(name);if(!b)throw new Error('menu missing: '+name);b.click();await wait(220);return b;};
    const stage=()=>document.getElementById('pdfUtilityStageBody');
    const modal=()=>document.getElementById('pdfUtilityCenteredModal');
    const assertLayer=name=>{if(!stage()||!stage().textContent.trim())throw new Error('empty stage: '+name);if(!modal()?.classList.contains('open')||!modal().contains(stage()))throw new Error('centered layer stage missing: '+name);if(document.getElementById('pdfUtilityCenteredModalTitle')?.textContent.trim()!==name)throw new Error('modal title mismatch: '+name+' / '+document.getElementById('pdfUtilityCenteredModalTitle')?.textContent);};
    const assertDirect=(display,source)=>{assertLayer(display);const panel=stage().querySelector(`.pdfud-card[data-pdfud-tool="${source}"]`);if(!panel)throw new Error(`direct workflow mismatch: ${display} did not mount ${source}`);if(stage().querySelector('[data-pdfuc-server-tool="merge"]'))throw new Error(display+' incorrectly shows merge workflow');if(!panel.querySelector('.pdfud-file-input'))throw new Error(display+' tool-specific upload missing');return panel;};
    const assertDrop=()=>{const drop=stage().querySelector('#localDrop');if(!drop)throw new Error('local upload box missing');const style=getComputedStyle(drop);if(style.display!=='flex')throw new Error('upload label is not a single flex box: '+style.display);if(style.borderLeftStyle!=='dashed'||parseFloat(style.borderLeftWidth)<1.5)throw new Error('upload dashed border missing');if(drop.getClientRects().length!==1)throw new Error('upload border fragmented into multiple inline boxes');};
  </script>
  <script src="/js/pdf-suite/local-tools.js?v=smoke"></script>
  <script src="/js/pdf-suite/advanced-tools.js?v=smoke"></script>
  <script src="/js/pdf-suite/ocr-tools.js?v=smoke"></script>
  <script src="/js/pdf-suite/unified-navigation-prep.js?v=smoke"></script>
  <script src="/js/pdf-suite/single-page-shell.js?v=smoke"></script>
  <script src="/js/pdf-suite/direct-tool-bridge.js?v=smoke"></script>
  <script src="/js/pdf-suite/direct-tool-hook.js?v=smoke"></script>
  <script src="/js/pdf-suite/protected-tool-guard.js?v=smoke"></script>
  <script src="/js/pdf-suite/workspace-stability.js?v=smoke"></script>
  <script src="/js/pdf-suite/curated-core.js?v=smoke"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      try{
        await waitFor(()=>document.documentElement.dataset.pdfUtilityCuratedCore==='ready','curated core ready');
        await waitFor(()=>document.documentElement.dataset.pdfUtilityCentered==='tool-first-v2','tool-first centered ready');
        await waitFor(()=>document.documentElement.dataset.pdfUtilityToolModalFlow==='upload-first-reveal-v1','tool modal flow ready');
        await wait(120);
        const expected=['PDF 파일 검사','PDF 압축','인쇄 문제 자동 수정','PDF 합치기','빈 페이지 자동 제거','전체 페이지 회전','페이지 순서 역순','배경/여백 제거','이미지 → PDF','PDF → 이미지','OCR · 검색 가능한 PDF','본문 텍스트 추출 · TXT','페이지 추출·나누기','시각적 페이지 정리','PDF 암호 설정 · AES-256','암호 해제'];
        const actual=names();
        if(actual.length!==expected.length)throw new Error(`core menu count ${actual.length} != ${expected.length}: ${actual.join(', ')}`);
        expected.forEach(name=>{if(!actual.includes(name))throw new Error('essential menu missing: '+name);});
        if(actual.includes('여백·크롭·배경'))throw new Error('old background/crop label still visible');
        if(actual.includes('안전 자동 수정'))throw new Error('old safe-auto-fix label still visible');
        if(actual.includes('메타데이터 정리')||actual.includes('폼 평면화'))throw new Error('removed metadata/form tools are still visible');
        if(document.getElementById('pdfUtilityCenteredUpload'))throw new Error('legacy shared upload still visible');
        if(document.documentElement.dataset.pdfUtilityUploadFlow!=='tool-first')throw new Error('tool-first upload flow marker missing');
        const categories=[...document.querySelectorAll('#pdfUtilityCenteredCategories>.pdfuc-category>.pdfuc-cat-head>strong')].map(node=>node.textContent.trim());
        if(categories.join('|')!=='페이지 · 문서|변환 · OCR|편집 · 보안|최적화 · 검사')throw new Error('centered categories incorrect: '+categories.join('|'));
        const categoryOf=name=>button(name)?.closest('.pdfuc-category')?.dataset.category||'';
        if(categoryOf('페이지 추출·나누기')!=='security'||categoryOf('시각적 페이지 정리')!=='security')throw new Error('page cleanup/extract tools were not moved to edit/security');
        const shell=document.getElementById('pdfUtilitySplit'),home=shell?.querySelector(':scope>.pdfuc-home');
        if(!shell||!home)throw new Error('centered full-width shell missing');
        if(getComputedStyle(shell).display==='grid')throw new Error('legacy split grid still active in centered mode');
        if(shell.getBoundingClientRect().width>0&&home.getBoundingClientRect().width<shell.getBoundingClientRect().width*.9)throw new Error('centered home collapsed into old sidebar column');
        if(document.documentElement.dataset.pdfUtilityCenteredRefinements!=='tool-first-v4-large-layout')throw new Error('large layout refinement marker missing');

        await click('PDF 합치기');
        assertLayer('PDF 합치기');
        const merge=stage().querySelector('[data-pdfuc-server-tool="merge"]');
        if(!merge)throw new Error('merge-specific layer missing');
        const mergeInput=merge.querySelector('.pdfuc-tool-input');
        if(!mergeInput?.multiple)throw new Error('merge upload must accept multiple PDFs');
        if(!merge.querySelector('.pdfuc-tool-upload'))throw new Error('merge tool upload box missing');
        await waitFor(()=>merge.dataset.pdfucModalFlow==='idle','merge progressive flow');
        if(merge.querySelector('.pdfuc-flow-feedback')&&getComputedStyle(merge.querySelector('.pdfuc-flow-feedback')).display!=='none')throw new Error('merge feedback should stay hidden before run');

        await click('PDF 파일 검사');
        const inspection=assertDirect('PDF 파일 검사','PDF 프리플라이트');
        await waitFor(()=>inspection.dataset.pdfudModalFlow==='idle','inspection progressive flow');
        if(getComputedStyle(inspection.querySelector('.pdfud-result')).display!=='none')throw new Error('inspection result should stay hidden before run');
        const inspectionDrop=inspection.querySelector('.pdfud-file');
        const inspectionInput=inspection.querySelector('.pdfud-file-input');
        const transfer=new DataTransfer();transfer.items.add(new File(['%PDF-1.4\n%%EOF'],'drag-inspection.pdf',{type:'application/pdf'}));
        inspectionDrop.dispatchEvent(new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:transfer}));
        inspectionDrop.dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer}));
        await wait(60);
        if(inspectionInput.files?.[0]?.name!=='drag-inspection.pdf')throw new Error('direct upload drag/drop did not populate file input');
        const nativeFetch=window.fetch;
        window.fetch=async(input,init)=>{
          if(String(input).includes('/api/preflight/check'))return new Response(JSON.stringify({score:98,filename:'drag-inspection.pdf',page_count:1,checks:[{severity:'pass',label:'구조',detail:'정상'}]}),{status:200,headers:{'Content-Type':'application/json'}});
          return nativeFetch(input,init);
        };
        inspection.querySelector('.pdfud-run').click();
        await waitFor(()=>inspection.dataset.pdfudModalFlow==='active','inspection result reveal');
        if(!inspection.querySelector('.pdfud-flow-track'))throw new Error('inspection progress bar missing after diagnosis start');
        await waitFor(()=>inspection.querySelector('.pdfud-score')?.textContent.trim()==='98','inspection result rendered');
        window.fetch=nativeFetch;

        await click('PDF 압축');assertDirect('PDF 압축','PDF 압축');
        await click('인쇄 문제 자동 수정');assertDirect('인쇄 문제 자동 수정','안전 자동 수정');
        await click('빈 페이지 자동 제거');assertDirect('빈 페이지 자동 제거','빈 페이지 자동 제거');
        await click('시각적 페이지 정리');assertDirect('시각적 페이지 정리','시각적 페이지 정리');
        await click('배경/여백 제거');assertDirect('배경/여백 제거','여백·크롭·배경');
        await click('이미지 → PDF');assertDirect('이미지 → PDF','이미지 → PDF');
        await click('PDF → 이미지');assertDirect('PDF → 이미지','PDF 이미지 변환');
        await click('PDF 암호 설정 · AES-256');assertDirect('PDF 암호 설정 · AES-256','AES-256 암호 설정');
        await click('암호 해제');assertDirect('암호 해제','암호 해제');

        await click('페이지 추출·나누기');
        assertLayer('페이지 추출·나누기');
        const extract=stage().querySelector('[data-pdfuc-server-tool="extract"]');
        if(!extract)throw new Error('extract-specific layer missing');
        if(extract.querySelector('.pdfuc-tool-input')?.multiple)throw new Error('extract must accept one PDF');
        if(!extract.querySelector('[data-pdfuc-range]'))throw new Error('extract page range missing');

        await click('전체 페이지 회전');assertDrop();assertLayer('전체 페이지 회전');
        if(document.getElementById('localTitle')?.textContent.trim()!=='전체 페이지 회전')throw new Error('rotate local workflow mismatch');
        await click('페이지 순서 역순');assertDrop();assertLayer('페이지 순서 역순');
        if(document.getElementById('localTitle')?.textContent.trim()!=='페이지 순서 역순')throw new Error('reverse local workflow mismatch');

        await click('OCR · 검색 가능한 PDF');
        const ocr=stage().querySelector('#pdfSuiteOcrModal');
        if(!ocr?.classList.contains('open'))throw new Error('OCR panel missing');
        if(!ocr.querySelector('.pdfocr-file'))throw new Error('OCR tool-specific upload missing');
        assertLayer('OCR · 검색 가능한 PDF');

        for(const name of expected){await click(name);assertLayer(name);}
        document.body.dataset.pdfUtilityCuratedCoreSmoke='pass';
        result.textContent='PASS: curated PDF Utility keeps 16 essential workflows, removes metadata/form cleanup tools, moves page cleanup/extract to edit/security, uses the renamed print auto-fix tool, and keeps the enlarged centered layout';
      }catch(error){document.body.dataset.pdfUtilityCuratedCoreSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error);}
    })();
  </script>
</body>
</html>
