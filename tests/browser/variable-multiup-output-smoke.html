<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Variable multi-up PDF output smoke</title></head>
<body data-multiup-output-smoke="running">
  <div class="sidebar"><div class="first-panel"></div></div>
  <pre id="result">RUNNING</pre>
  <script>
  window.XLSX={
    read(){return {SheetNames:['Sheet1'],Sheets:{Sheet1:{}}};},
    utils:{sheet_to_json(){return [
      ['이름','번호','소속'],
      ['김민준','001','6학년'],['이서연','002','5학년'],['박지호','003','6학년']
    ];}}
  };
  window.pdfjsLib={
    GlobalWorkerOptions:{},
    getDocument(){
      return {promise:Promise.resolve({
        numPages:1,async destroy(){},
        async getPage(){return {
          rotate:0,userUnit:1,
          view:[20,35,20+90*72/25.4,35+50*72/25.4],
          getViewport({scale}){return {width:90*72/25.4*scale,height:50*72/25.4*scale};},
          render({canvasContext}){canvasContext.fillStyle='#eee';canvasContext.fillRect(0,0,50,50);return{promise:Promise.resolve()};}
        };}
      })};
    }
  };
  HTMLCanvasElement.prototype.toBlob=function(callback,type){
    callback(new Blob([new Uint8Array([137,80,78,71,1,2,3])],{type:type||'image/png'}));
  };
  window.__pages=[];window.__embeds=[];window.__pngs=0;window.__downloads=[];
  window.PDFLib={
    rgb(r,g,b){return{r,g,b};},
    PDFDocument:{
      async load(){return{getPage(){return {id:'source'};}};},
      async create(){return{
        async embedPage(page,bounds,matrix){
          window.__embeds.push({page,bounds,matrix});return{id:'clipped-pdf'};
        },
        addPage(size){
          const result={size,backgrounds:[],images:[],lines:[]};
          window.__pages.push(result);
          return{
            drawPage(pdf,geometry){result.backgrounds.push(geometry);},
            drawImage(image,geometry){result.images.push(geometry);},
            drawLine(geometry){result.lines.push(geometry);}
          };
        },
        async embedPng(bytes){window.__pngs++;return{id:'data'};},
        async save(){return new Uint8Array([37,80,68,70]);}
      };}
    }
  };
  </script>
  <script src="/js/print-specialists/ui.js"></script>
  <script src="/js/print-specialists/variable-multiup.js"></script>
  <script>
  (async()=>{
    const fail=message=>{throw Error(message);};
    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    function attach(id,name,mime){
      const input=document.getElementById('printSpecialistOverlay').querySelector('#'+id);
      const transfer=new DataTransfer();
      transfer.items.add(new File([new Uint8Array([37,80,68,70])],name,{type:mime}));
      input.files=transfer.files;
      input.dispatchEvent(new Event('change',{bubbles:true}));
    }
    try{
      await sleep(30);
      window.PrintSpecialistUi.open('multi-variable');
      const overlay=document.getElementById('printSpecialistOverlay');
      const $=id=>overlay.querySelector('#'+id);
      attach('mvRoster','recipients.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      await sleep(30);
      const ready=new Promise((resolve,reject)=>{
        const status=overlay.querySelector('.ps-status');
        const observer=new MutationObserver(()=>{
          if(status.textContent.includes('완성품 원본 PDF')){
            observer.disconnect();resolve();
          }else if(status.textContent.includes('원본 PDF 크기')||status.classList.contains('error')){
            observer.disconnect();reject(Error(status.textContent));
          }
        });
        observer.observe(status,{characterData:true,childList:true,subtree:true});
      });
      attach('mvPdf','badge.pdf','application/pdf');
      await ready;
      if($('mvPerson').options.length!==3)fail('recipient roster not loaded');
      if(!$('mvSummary').textContent.includes('21개'))fail('21-up A3 layout not shown');
      $('mvMarks').value='yes';$('mvMarks').dispatchEvent(new Event('change'));
      // Observe actual generation: await the disabled -> enabled transition.
      const finished=new Promise((resolve,reject)=>{
        let busy=false;
        const obs=new MutationObserver(()=>{
          if($('mvExport').disabled)busy=true;
          const text=overlay.querySelector('.ps-status')?.textContent||'';
          if(text.startsWith('생성 실패:')){
            obs.disconnect();reject(Error(text));
          }else if(busy&&!$('mvExport').disabled&&text.startsWith('완료:')){
            obs.disconnect();resolve();
          }
        });
        obs.observe($('mvExport'),{attributes:true,attributeFilter:['disabled']});
        obs.observe(overlay.querySelector('.ps-status'),{subtree:true,characterData:true,childList:true});
      });
      $('mvExport').click();
      await finished;
      if(window.__pages.length!==1)fail('expected one A3 output sheet, received '+window.__pages.length);
      const page=window.__pages[0];
      if(Math.abs(page.size[0]-297*72/25.4)>.1||Math.abs(page.size[1]-420*72/25.4)>.1)fail('A3 output physical size mismatch');
      if(page.backgrounds.length!==3)fail('separate recipients did not get their own template artwork');
      if(page.images.length!==9)fail('different Excel fields were not applied to each recipient: '+page.images.length);
      if(page.lines.length!==24)fail('crop marks not added for each item');
      if(window.__embeds.length!==1)fail('PDF template not embedded once');
      const box=window.__embeds[0].bounds;
      const mat=window.__embeds[0].matrix;
      if(box.left!==20||box.bottom!==35||mat[4]!==-20||mat[5]!==-35)fail('PDF CropBox offset lost');
      const first=page.backgrounds[0],second=page.backgrounds[1];
      if(Math.abs((second.x-first.x)-95*72/25.4)>.1)fail('slot placement scale or gap mismatch');
      document.body.dataset.multiupOutputSmoke='pass';
      document.getElementById('result').textContent='PASS: 3 unique Excel recipients on one A3 PDF sheet with vector CropBox, 300dpi data and cut marks';
    }catch(error){
      document.body.dataset.multiupOutputSmoke='fail';
      document.getElementById('result').textContent='FAIL: '+String(error.stack||error);
    }
  })();
  </script>
</body>
</html>
