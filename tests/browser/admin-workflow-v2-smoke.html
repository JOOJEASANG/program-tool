<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Admin Workflow V2 Smoke</title><style>.hidden{display:none}.item{display:flex}.btn{display:block}</style><script>history.replaceState(null,'','/admin.html?admin-v2-smoke=1');</script></head><body data-admin-v2-smoke="pending"><section id="members"><div class="toolbar"><input id="memberSearch"></div><div id="memberList"><div class="item"><div class="name">회원 A</div><button class="btn" data-member="user-a" data-status="approved">승인</button><button class="btn" data-plan="user-a">PRO</button><button class="btn" data-member="user-a" data-status="suspended">중지</button></div><div class="item"><div class="name">회원 B</div><button class="btn" data-member="user-b" data-status="approved">승인</button><button class="btn" data-plan="user-b">PRO</button><button class="btn" data-member="user-b" data-status="suspended">중지</button></div></div></section><div id="recentMembers"><div class="item"><div class="name">최근 회원</div><button class="btn" data-member="recent" data-status="approved">승인</button></div></div><button id="refreshBtn">새로고침</button><div id="result">PENDING</div><script>const writes=[];window.firebase={firestore:{FieldValue:{serverTimestamp:()=>({server:true})}}};window.db={collection:()=>({doc:id=>({set:async payload=>{writes.push({id,payload})}})})};window.confirm=()=>true;document.getElementById('refreshBtn').addEventListener('click',()=>document.body.dataset.refreshed='true');</script><script src="/js/admin-workflow-v2.js?v=smoke"></script><script>(async()=>{const result=document.getElementById('result'),assert=(v,m)=>{if(!v)throw new Error(m)},wait=async(p,l)=>{for(let i=0;i<100;i++){if(p())return;await new Promise(r=>setTimeout(r,20))}throw new Error('timeout: '+l)};try{await wait(()=>window.AdminWorkflowV2,'api');assert(document.getElementById('adminBulkBar'),'bulk bar missing');assert(document.querySelectorAll('#memberList .admin-member-select').length===2,'selection controls missing');assert(document.querySelector('#recentMembers .btn').disabled===true,'recent member action not disabled');const first=document.querySelector('#memberList .admin-member-select');first.checked=true;first.dispatchEvent(new Event('change',{bubbles:true}));assert(window.AdminWorkflowV2.getSelected().length===1,'member selection failed');const ok=await window.AdminWorkflowV2.applyBulk('status','approved','승인 상태');assert(ok===true,'bulk update failed');assert(writes.length===1&&writes[0].id==='user-a'&&writes[0].payload.status==='approved','wrong bulk payload');assert(document.body.dataset.refreshed==='true','refresh not reused');window.confirm=()=>false;let originalClicked=false;document.querySelector('#memberList [data-member="user-b"][data-status="suspended"]').addEventListener('click',()=>{originalClicked=true});document.querySelector('#memberList [data-member="user-b"][data-status="suspended"]').click();assert(originalClicked===false,'suspend cancellation did not stop action');document.body.dataset.adminV2Smoke='pass';result.textContent='PASS: admin read-only recent members, selection, bulk update and suspend guard';}catch(error){document.body.dataset.adminV2Smoke='fail';result.textContent='FAIL: '+String(error.message||error)}})();</script></body></html>
