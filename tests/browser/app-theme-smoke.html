<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Program Studio Theme Smoke</title>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body data-theme-smoke="pending">
  <header class="app-header"><strong>테마 테스트</strong><div class="header-actions"></div></header>
  <main class="workspace">
    <aside class="sidebar"><section class="panel-card"><label>입력 <input id="sampleInput" value="sample"></label></section></aside>
    <section class="page-viewport"><article id="paper" class="document-page">인쇄 용지</article></section>
  </main>
  <div id="result">PENDING</div>
  <script>try{localStorage.removeItem('program-studio-theme')}catch(_){}</script>
  <script src="/js/app-theme.js"></script>
  <script>
  (async()=>{
    const result=document.getElementById('result');
    const fail=error=>{document.body.dataset.themeSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
    const pass=message=>{document.body.dataset.themeSmoke='pass';result.textContent='PASS: '+message};
    const assert=(condition,message)=>{if(!condition)throw new Error(message)};
    const waitFor=async(predicate,label,timeout=8000)=>{const start=Date.now();while(Date.now()-start<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,30))}throw new Error('timeout: '+label)};
    try{
      await waitFor(()=>window.ProgramStudioTheme&&document.documentElement.dataset.programStudioThemeReady==='1','theme ready');
      const button=document.querySelector('[data-program-studio-theme-toggle]');
      assert(button,'theme toggle missing');
      assert(document.querySelector('.header-actions').contains(button),'theme toggle did not mount in header actions');
      assert(window.ProgramStudioTheme.current()==='light','default theme is not light');
      button.click();
      await waitFor(()=>document.documentElement.dataset.psTheme==='dark','dark theme');
      assert(localStorage.getItem('program-studio-theme')==='dark','dark theme was not persisted');
      const paperStyle=getComputedStyle(document.getElementById('paper'));
      assert(paperStyle.backgroundColor==='rgb(255, 255, 255)','document paper must stay white in dark mode');
      window.ProgramStudioTheme.apply('light');
      assert(document.documentElement.dataset.psTheme==='light','light theme did not restore');
      assert(button.textContent.includes('다크'),'toggle label did not update');
      pass('shared light/dark toggle, persistence and white print surface');
    }catch(error){fail(error)}
  })();
  </script>
</body>
</html>
