<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Shape Inspector UX Smoke</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:14px;font-family:Arial,sans-serif}.side-card{width:330px;padding:11px}.inspector-note{font-size:8px}.field{margin-bottom:9px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field label{display:block;font-size:8px;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #cfd8e3;border-radius:8px;padding:7px 8px}.quick-style-panel{padding:9px}.quick-radius-buttons{display:grid;grid-template-columns:repeat(4,1fr)}.quick-range-row{display:grid;grid-template-columns:1fr 42px}.quick-shadow-row,.check-row{display:flex;align-items:center;gap:6px}.phase2-inspector-actions{display:grid;grid-template-columns:repeat(3,1fr)}
  </style>
  <script>history.replaceState(null,'','/design-editor/general.html?embed=1&shape-inspector-ux-smoke=1');</script>
</head>
<body data-shape-inspector-ux-smoke="pending">
  <div id="result">PENDING</div>
  <section id="inspector" class="side-card"></section>
  <script>
    function inspectorMarkup(){return `<div class="inspector-title">사각형 설정</div><div class="inspector-note">선택한 요소 하나만 조절합니다.</div><div id="quickShapeStylePanel" class="quick-style-panel"><div class="quick-style-title">모서리·그림자</div><div class="quick-radius-buttons"><button type="button" data-radius-preset="square">각진</button><button type="button" data-radius-preset="soft">살짝</button><button type="button" class="on" data-radius-preset="round">둥글게</button><button type="button" data-radius-preset="pill">캡슐</button></div><div class="quick-range-row"><input id="quickCornerRadius" type="range" min="0" max="20" step="0.5" value="7.5"><span id="quickCornerRadiusValue" class="quick-range-value">7.5mm</span></div><label class="quick-shadow-row"><input id="quickShapeShadow" type="checkbox"> 은은한 그림자</label></div><div class="field-grid"><div class="field"><label>X mm</label><input data-extra-field="x" type="number" value="179.3"></div><div class="field"><label>Y mm</label><input data-extra-field="y" type="number" value="127.5"></div></div><div class="field-grid"><div class="field"><label>가로 mm</label><input data-extra-field="w" type="number" value="114.6"></div><div class="field"><label>세로 mm</label><input data-extra-field="h" type="number" value="15.8"></div></div><div class="field"><label>채우기</label><input data-extra-field="fill" type="color" value="#dceeff"></div><div class="field"><label>테두리</label><select id="borderSelect"><option value="none">없음</option><option value="on" selected>있음</option></select></div><div class="field"><label>테두리 색상</label><input data-extra-field="stroke" type="color" value="#12396d"></div><div class="field"><label>선 두께</label><input data-extra-field="strokeWidth" type="number" value="0.2"></div><div class="field"><label>불투명도 %</label><input data-extra-field="opacity" type="number" value="96"></div><label class="check-row"><input id="phase2ExtraLock" type="checkbox"> 이 요소 잠금</label><div id="designShapeBorderToggleRow" class="shape-border-toggle-row"><label class="shape-border-toggle"><span>테두리 선</span><span><input id="designShapeBorderToggle" type="checkbox" checked> 표시</span></label><div id="designShapeBorderState" class="shape-border-state">출력에도 적용됩니다.</div></div><div class="phase2-inspector-actions"><button type="button">뒤로</button><button type="button">앞으로</button><button type="button">복제</button></div>`;}
    document.getElementById('inspector').innerHTML=inspectorMarkup();
  </script>
  <script src="/js/design-editor/shape-inspector-ux.js?v=20260827-1"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.shapeInspectorUxSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
      const pass=message=>{document.body.dataset.shapeInspectorUxSmoke='pass';result.textContent='PASS: '+message};
      const assert=(condition,message)=>{if(!condition)throw new Error(message)};
      const waitFor=async(predicate,label,timeout=5000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,30))}throw new Error('timeout: '+label)};
      try{
        await waitFor(()=>window.DesignEditorShapeInspectorUX?.stage==='shape-inspector-natural-controls','ux runtime');
        const inspector=document.getElementById('inspector');
        assert(inspector.classList.contains('shape-ux-inspector'),'inspector enhancement class missing');
        const radiusButtons=[...inspector.querySelectorAll('[data-radius-preset]')];
        assert(radiusButtons.length===4,'radius presets missing');
        assert(radiusButtons.find(button=>button.dataset.radiusPreset==='round').getAttribute('aria-pressed')==='true','selected radius aria state missing');
        assert(radiusButtons.every(button=>button.getBoundingClientRect().height>=33),'radius preset hit area is too small');
        const range=document.getElementById('quickCornerRadius');
        assert(range.getAttribute('aria-label')==='모서리 둥글기','range aria label missing');
        assert(range.getAttribute('aria-valuetext')==='7.5mm','range aria value missing');
        assert(range.getBoundingClientRect().height>=23,'range hit area is too small');
        const shadow=document.getElementById('quickShapeShadow'),shadowRow=shadow.closest('label');
        assert(shadowRow.classList.contains('shape-ux-toggle-row'),'shadow row not enhanced');
        shadowRow.click();assert(shadow.checked===true,'shadow whole-row click did not toggle');
        const lock=document.getElementById('phase2ExtraLock'),lockRow=lock.closest('label');
        assert(lockRow.classList.contains('shape-ux-toggle-row'),'lock row not enhanced');
        lockRow.click();assert(lock.checked===true,'lock whole-row click did not toggle');
        const borderToggle=document.getElementById('designShapeBorderToggle');
        assert(borderToggle.closest('label').classList.contains('shape-ux-toggle-row'),'border checkbox row not enhanced');
        const borderSelect=document.getElementById('borderSelect');let borderChanges=0;borderSelect.addEventListener('change',()=>borderChanges++);
        const borderSegment=document.getElementById('designShapeBorderSegmented');
        assert(borderSegment&&borderSelect.classList.contains('shape-ux-native-select'),'two-state border select not converted');
        const noneButton=[...borderSegment.querySelectorAll('button')].find(button=>button.textContent.trim()==='없음');
        noneButton.click();
        assert(borderSelect.value==='none'&&borderChanges===1,'border segmented click did not drive existing select');
        assert(noneButton.getAttribute('aria-pressed')==='true','border selected state not visible');
        assert(inspector.querySelector('input[type=number]').getBoundingClientRect().height>=35,'number input hit area is too small');
        assert(inspector.querySelector('input[type=color]').getBoundingClientRect().height>=39,'color input hit area is too small');
        inspector.innerHTML=inspectorMarkup();
        await waitFor(()=>document.getElementById('designShapeBorderSegmented')&&document.getElementById('quickShapeShadow')?.closest('label')?.classList.contains('shape-ux-toggle-row'),'inspector rebuild enhancement');
        document.body.dataset.shapeInspectorUxStage=window.DesignEditorShapeInspectorUX.stage;
        pass('large hit areas, whole-row toggles, border segmented control and inspector rebuild are stable');
      }catch(error){fail(error)}
    })();
  </script>
</body>
</html>
