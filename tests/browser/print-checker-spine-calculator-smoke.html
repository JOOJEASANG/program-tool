<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Print checker automatic spine calculator smoke</title></head>
<body>
  <form id="specForm">
    <div class="spec-field"><select id="paperType"><option value="mojo80">모조지 80g</option><option value="custom">직접 입력</option></select></div>
    <div class="spec-field"><input id="pageCount" type="number" value="200"></div>
    <div class="spec-field"><label><small class="spec-hint" id="spineHint">기존 계산</small></label><input id="spine" type="number" value=""></div>
  </form>
  <button class="product-card" type="button">표지</button><button id="resetBtn" type="button">초기화</button>
  <script src="/js/print-checker/spine-calculator-v2.js?v=smoke"></script>
  <script>
    document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{
      try{
        const paper=document.getElementById('paperType');
        const pages=document.getElementById('pageCount');
        const spine=document.getElementById('spine');

        pages.value='200';pages.dispatchEvent(new Event('input',{bubbles:true}));
        paper.value='mojo80';paper.dispatchEvent(new Event('change',{bubbles:true}));
        const mojo80Ok=spine.value==='9.5';

        paper.value='mojo100';paper.dispatchEvent(new Event('change',{bubbles:true}));
        const mojo100Ok=spine.value==='11.9';

        paper.value='art100';paper.dispatchEvent(new Event('change',{bubbles:true}));
        const art100Ok=spine.value==='8.6';

        pages.value='300';pages.dispatchEvent(new Event('input',{bubbles:true}));
        paper.value='snow120';paper.dispatchEvent(new Event('change',{bubbles:true}));
        const snow120Ok=spine.value==='15.1';

        const readOnlyOk=spine.readOnly===true&&spine.getAttribute('aria-readonly')==='true';
        const customRemoved=paper.querySelector('option[value="custom"]')===null;
        const manualFieldsRemoved=!document.getElementById('paperGsmV2')&&!document.getElementById('paperCaliperV2')&&!document.getElementById('spineAllowanceV2');
        const note=document.getElementById('spineAutoResult')?.textContent||'';
        const noteOk=note.includes('자동 책등 15.1mm')&&note.includes('스노우지 120g')&&note.includes('제본 여유 0.5mm');
        const ready=document.documentElement.dataset.printCheckerSpineCalculator==='v2-automatic-paper-profile';
        const pass=mojo80Ok&&mojo100Ok&&art100Ok&&snow120Ok&&readOnlyOk&&customRemoved&&manualFieldsRemoved&&noteOk&&ready;
        document.documentElement.dataset.printCheckerSpineCalculatorSmoke=pass?'pass':'fail';
        const out=document.createElement('pre');out.id='result';out.textContent=pass?'PASS: paper option and page count automatically produce a read-only spine':`FAIL m80=${mojo80Ok} m100=${mojo100Ok} art=${art100Ok} snow=${snow120Ok} readonly=${readOnlyOk} custom=${customRemoved} manual=${manualFieldsRemoved} note=${noteOk} ready=${ready} spine=${spine.value}`;document.body.appendChild(out);
      }catch(error){
        document.documentElement.dataset.printCheckerSpineCalculatorSmoke='fail';
        const out=document.createElement('pre');out.id='result';out.textContent='FAIL '+(error?.stack||error);document.body.appendChild(out);
      }
    },80));
  </script>
</body>
</html>
