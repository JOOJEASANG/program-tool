<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Modular PDF App Shell Smoke</title>
  <link rel="stylesheet" href="/css/studio-app-shell.css?v=20260901-2">
  <style>.hide{display:none}</style>
</head>
<body data-modular-shell-smoke="running">
  <div id="result">RUNNING</div>
  <span id="appTitle"></span><span id="appCategory"></span><span id="appDescription"></span>
  <span id="appSymbol" class="product-symbol"></span><span id="appWorkspaceTitle"></span><span id="appWorkspaceHint"></span>
  <div id="productContext"></div><nav id="appQuickActions" class="product-quick-actions" hidden></nav>
  <span class="engine-chip"><span id="engineLabel"></span></span>
  <a id="legacyLink" hidden></a>
  <div id="workspaceLoading"><strong id="loadingTitle"></strong><p id="loadingMessage"></p></div>
  <div id="workspaceError" hidden><p></p></div>
  <button id="retryBtn"></button>
  <iframe id="appFrame"></iframe>
  <script>
    const original=new URL(location.href);
    const key=original.searchParams.get('app')||'';
    const expected={
      'pdf-layout':{target:'/pdf-editor/?embed=1&app=layout',title:'PDF 배치',category:'PDF · N-UP',symbol:'PDF',workspace:'PDF 배치 작업실',quick:0,accent:'rgb(95, 103, 199)'},
      booklet:{target:'/pdf-editor/?embed=1&app=booklet',title:'소책자 제작',category:'PDF · BOOKLET',symbol:'책',workspace:'소책자 조판 작업실',quick:0,accent:'rgb(60, 109, 158)'}
    };
    if(!expected[key])throw new Error('unknown smoke app: '+key);
    history.replaceState(null,'','/apps/'+key+'?smoke=1');
    const frame=document.getElementById('appFrame');
    Object.defineProperty(frame,'src',{configurable:true,get(){return frame.dataset.assignedSrc||'';},set(value){frame.dataset.assignedSrc=String(value);setTimeout(()=>frame.dispatchEvent(new Event('load')),0);}});
    let approve;
    // "engine started before approval" remains a protected regression phrase:
    // preloading may happen, but the workspace must never become usable first.
    window.ProgramAccessReady=Promise.resolve(null);
    window.__modularSmoke={key,expected:expected[key],installRealAccess(){window.ProgramAccessReady=new Promise(resolve=>{approve=resolve;});},approve(value){approve?.(value);}};
  </script>
  <script src="/js/studio-app-shell.js?v=20260901-7"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const frame=document.getElementById('appFrame');
      const fail=error=>{document.body.dataset.modularShellSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error)};
      const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      const waitFor=async(fn,label,timeout=5000)=>{const started=Date.now();while(Date.now()-started<timeout){if(fn())return;await wait(25);}throw new Error('timeout: '+label);};
      try{
        const exp=window.__modularSmoke.expected;
        await waitFor(()=>frame.dataset.assignedSrc,'early engine preload');
        if(frame.dataset.assignedSrc!==exp.target)throw new Error('wrong preload target: '+frame.dataset.assignedSrc);
        if(document.documentElement.dataset.modularAppReady==='true')throw new Error('shell became usable before approval');

        window.__modularSmoke.installRealAccess();
        await wait(100);
        if(document.documentElement.dataset.modularAppReady==='true')throw new Error('shell became usable before real approval resolved');
        window.__modularSmoke.approve({approved:true,status:'approved'});

        if(document.getElementById('appTitle').textContent!==exp.title)throw new Error('wrong title');
        if(document.getElementById('appCategory').textContent!==exp.category)throw new Error('wrong category');
        if(document.getElementById('appSymbol').textContent!==exp.symbol)throw new Error('wrong product symbol');
        if(document.getElementById('appWorkspaceTitle').textContent!==exp.workspace)throw new Error('wrong workspace title');
        if(document.documentElement.dataset.appTheme!==window.__modularSmoke.key)throw new Error('product theme ownership missing');
        const accent=getComputedStyle(document.getElementById('appSymbol')).backgroundColor;
        if(accent!==exp.accent)throw new Error(`wrong accent ${accent} != ${exp.accent}`);
        const quick=document.querySelectorAll('#appQuickActions button');
        if(quick.length!==0)throw new Error(`wrong quick action count ${quick.length}`);
        if(!document.getElementById('appQuickActions').hidden)throw new Error('empty quick actions should stay hidden');

        await waitFor(()=>document.documentElement.dataset.modularAppReady==='true','shell ready');
        if(document.documentElement.dataset.modularAppEnginePreload!=='ready')throw new Error('engine preload did not finish');

        document.body.dataset.modularShellSmoke='pass';
        document.body.dataset.modularShellApp=window.__modularSmoke.key;
        document.body.dataset.modularShellTarget=frame.dataset.assignedSrc;
        document.body.dataset.modularShellTheme=document.documentElement.dataset.appTheme||'';
        document.body.dataset.modularShellQuick=String(quick.length);
        document.body.dataset.modularShellWorkspace=exp.workspace;
        document.body.dataset.modularShellAccessRace='pass';
        document.body.dataset.modularShellParallelPreload='pass';
        document.body.dataset.modularShellStableWorkspace='pass';
        result.textContent='PASS: '+window.__modularSmoke.key+' -> '+frame.dataset.assignedSrc;
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
