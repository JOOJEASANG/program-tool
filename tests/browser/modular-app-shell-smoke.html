<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Modular App Shell Smoke</title>
  <style>.hide{display:none}</style>
</head>
<body data-modular-shell-smoke="running">
  <div id="result">RUNNING</div>
  <span id="appTitle"></span><span id="appCategory"></span><span id="appDescription"></span>
  <span class="engine-chip"><span id="engineLabel"></span></span>
  <a id="legacyLink" hidden></a>
  <div id="workspaceLoading"></div>
  <div id="workspaceError" hidden><p></p></div>
  <button id="retryBtn"></button>
  <iframe id="appFrame"></iframe>
  <script>
    const original=new URL(location.href);
    const key=original.searchParams.get('app')||'';
    const expected={
      cover:{target:'/design-editor/general?embed=1&mode=cover&preset=cover-a4&app=cover',title:'표지 제작',category:'DESIGN · COVER'},
      poster:{target:'/design-editor/general?embed=1&mode=poster&preset=poster-a4&paper=a4&orientation=portrait&w=210&h=297&app=poster',title:'포스터 제작',category:'DESIGN · POSTER'},
      flyer:{target:'/design-editor/general?embed=1&mode=flyer&preset=flyer-a4&paper=a4&orientation=portrait&w=210&h=297&app=flyer',title:'전단지 제작',category:'DESIGN · FLYER'},
      invitation:{target:'/design-editor/general?embed=1&mode=invitation&preset=invitation-a4&paper=a4&orientation=landscape&w=297&h=210&app=invitation',title:'초대장 제작',category:'DESIGN · INVITATION'},
      notice:{target:'/design-editor/general?embed=1&mode=invitation&preset=invitation-a4&paper=a4&orientation=landscape&w=297&h=210&app=invitation&surface=notice',title:'안내장 제작',category:'DESIGN · NOTICE'},
      leaflet:{target:'/design-editor/general?embed=1&mode=leaflet3&preset=leaflet-3-roll&paper=a4&orientation=landscape&w=297&h=210&fold=leaflet-3-roll&app=leaflet',title:'리플렛 제작',category:'DESIGN · LEAFLET'},
      'pdf-layout':{target:'/pdf-editor/?embed=1&app=layout',title:'PDF 배치',category:'PDF · N-UP'},
      booklet:{target:'/pdf-editor/?embed=1&app=booklet',title:'소책자 제작',category:'PDF · BOOKLET'}
    };
    if(!expected[key])throw new Error('unknown smoke app: '+key);
    history.replaceState(null,'','/apps/'+key+'?smoke=1');
    const frame=document.getElementById('appFrame');
    Object.defineProperty(frame,'src',{configurable:true,get(){return frame.dataset.assignedSrc||'';},set(value){frame.dataset.assignedSrc=String(value);setTimeout(()=>frame.dispatchEvent(new Event('load')),0);}});
    let approve;
    window.ProgramAccessReady=new Promise(resolve=>{approve=resolve;});
    window.__modularSmoke={key,expected:expected[key],approve};
  </script>
  <script src="/js/studio-app-shell.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const frame=document.getElementById('appFrame');
      const fail=error=>{document.body.dataset.modularShellSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error)};
      const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      const waitFor=async(fn,label,timeout=5000)=>{const started=Date.now();while(Date.now()-started<timeout){if(fn())return;await wait(25);}throw new Error('timeout: '+label);};
      try{
        await wait(120);
        if(frame.dataset.assignedSrc)throw new Error('engine started before approval');
        window.__modularSmoke.approve({approved:true,status:'approved'});
        await waitFor(()=>frame.dataset.assignedSrc,'canonical target assignment');
        const exp=window.__modularSmoke.expected;
        if(frame.dataset.assignedSrc!==exp.target)throw new Error('wrong target: '+frame.dataset.assignedSrc);
        if(document.getElementById('appTitle').textContent!==exp.title)throw new Error('wrong title');
        if(document.getElementById('appCategory').textContent!==exp.category)throw new Error('wrong category');
        await waitFor(()=>document.documentElement.dataset.modularAppReady==='true','shell ready');
        document.body.dataset.modularShellSmoke='pass';
        document.body.dataset.modularShellApp=window.__modularSmoke.key;
        document.body.dataset.modularShellTarget=frame.dataset.assignedSrc;
        result.textContent='PASS: '+window.__modularSmoke.key+' -> '+frame.dataset.assignedSrc;
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
