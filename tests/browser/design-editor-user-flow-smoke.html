<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor User Flow Smoke</title>
  <style>
    .hidden{display:none!important}body{font-family:Arial,sans-serif;margin:0;padding:12px}.sidebar{width:320px}.side-card{border:1px solid #ddd;padding:8px;margin:4px 0}#editorShell{display:grid;grid-template-columns:320px 1fr;gap:12px}#artboardViewport{width:900px;height:700px;overflow:auto}#artboard{position:relative;background:#fff}.design-object{position:absolute}.editor-status{font-size:12px}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?browser-user-flow-smoke=1&embed=1');
    window.ProgramStudioBoot={reveal(){}};
    window.__browserUserFlowRuntimeResults=[];
    window.__phase2ImageChangeHandler=null;
    const nativeAddEventListener=EventTarget.prototype.addEventListener;
    EventTarget.prototype.addEventListener=function(type,listener,options){
      if(type==='change'&&this?.id==='phase2ImageInput'&&typeof listener==='function')window.__phase2ImageChangeHandler=listener;
      return nativeAddEventListener.call(this,type,listener,options);
    };
    window.addEventListener('programstudio:runtime-script-result',event=>window.__browserUserFlowRuntimeResults.push(event.detail||{}));
  </script>
</head>
<body data-user-flow-status="pending">
  <img src="/__design_user_flow_hold__" alt="" width="1" height="1" hidden>
  <div id="userFlowResult">PENDING</div>
  <div id="authLoading"></div><span id="navUserName"></span><button id="logoutBtn" type="button">logout</button>
  <main id="startScreen"><button id="resumeDraftBtn" class="hidden" type="button">resume</button><div id="presetGrid"></div><input id="customWidth" value="210"><input id="customHeight" value="297"><button id="customStartBtn" type="button">custom</button><button id="coverEditorBtn" type="button">cover</button></main>
  <main id="editorShell" class="hidden"><aside class="sidebar"><section class="side-card"><div id="documentTitle"></div><div id="documentMeta"></div><button id="newDesignBtn" type="button">new</button></section><section class="side-card"><button id="addTitleBtn" type="button">title</button><button id="addSubtitleBtn" type="button">subtitle</button><button id="addBodyBtn" type="button">body</button><button id="addInfoBtn" type="button">info</button></section><section id="inspector" class="side-card"></section><section class="side-card"><div id="layerList"></div></section></aside><section><div id="surfaceTabs"></div><div id="saveState"></div><div id="artboardViewport"><div id="artboard"></div></div><div class="editor-footer"><div id="editorStatus" class="editor-status"></div></div></section></main>
  <script src="/js/design-editor/presets.js?v=20260821-1"></script>
  <script src="/js/design-editor/app.js?v=20260821-1"></script>
  <script src="/js/sw-register.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('userFlowResult');
      const fail=error=>{document.body.dataset.userFlowStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.userFlowStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=18000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,50));}throw new Error('timeout: '+label);};
      const settle=(ms=80)=>new Promise(resolve=>setTimeout(resolve,ms));
      const runtimeResults=()=>{const manifest=Array.isArray(window.ProgramStudioDesignEditorRuntimeManifest)?window.ProgramStudioDesignEditorRuntimeManifest:[];const ids=new Set(manifest.map(entry=>entry.id));const latest=new Map();(window.__browserUserFlowRuntimeResults||[]).forEach(entry=>{if(ids.has(entry?.id))latest.set(entry.id,entry);});return{manifest,latest};};
      const canvasPngFile=async()=>{const canvas=document.createElement('canvas');canvas.width=64;canvas.height=48;const ctx=canvas.getContext('2d');ctx.fillStyle='#dceeff';ctx.fillRect(0,0,64,48);ctx.fillStyle='#12396d';ctx.fillRect(8,8,48,32);ctx.fillStyle='#ffffff';ctx.fillRect(24,16,16,16);const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('test PNG creation failed')),'image/png'));return new File([blob],'user-flow.png',{type:'image/png'});};
      try{
        await waitFor(()=>window.DesignEditorApp,'DesignEditorApp');
        await waitFor(()=>Array.isArray(window.ProgramStudioDesignEditorRuntimeManifest),'runtime manifest');
        await waitFor(()=>{const {manifest,latest}=runtimeResults();return manifest.length===32&&latest.size===manifest.length;},'all runtime modules');
        const boot=runtimeResults();boot.manifest.forEach(entry=>assert(boot.latest.get(entry.id)?.status==='loaded',`runtime failed: ${entry.id}`));
        await waitFor(()=>window.DesignEditorPhase2&&window.DesignEditorAssetStore&&window.DesignEditorProjectFile&&window.DesignEditorOutput&&window.DesignEditorFinalPrintCheck,'user-flow modules');
        await waitFor(()=>typeof window.__phase2ImageChangeHandler==='function','phase2 image change handler');

        DesignEditorApp.startProject('flyer-a4');await settle();
        let project=DesignEditorApp.project;
        assert(project?.surfaces?.length===2,'user flow requires two-surface flyer project');
        document.getElementById('addTitleBtn').click();await settle();
        const textInput=document.getElementById('textContentInput');assert(textInput,'title inspector missing');textInput.value='저장 복원 사용자 흐름';textInput.dispatchEvent(new Event('input',{bubbles:true}));await settle();
        assert(DesignEditorApp.project?.surfaces?.[0]?.elements?.[0]?.text==='저장 복원 사용자 흐름','text edit did not reach project state');

        await waitFor(()=>document.getElementById('phase2ImageInput'),'image input');
        const imageInput=document.getElementById('phase2ImageInput');const transfer=new DataTransfer();const imageFile=await canvasPngFile();assert(imageFile.size>0,'test PNG file is empty');transfer.items.add(imageFile);Object.defineProperty(imageInput,'files',{configurable:true,value:transfer.files});assert(imageInput.files?.[0]?.name==='user-flow.png','test file did not reach image input');
        await window.__phase2ImageChangeHandler.call(imageInput,{currentTarget:imageInput});
        await waitFor(()=>{const current=DesignEditorApp.project;const hasImage=current?.surfaces?.[0]?.extras?.some(item=>item.type==='image'&&item.assetId&&String(item.src||'').startsWith('blob:'));if(hasImage)return true;const status=String(document.getElementById('editorStatus')?.textContent||'');if(/이미지.*(못|실패)|JPG·PNG·WEBP|12MB|5천만/.test(status))throw new Error('image upload failed: '+status);return false;},'indexeddb image asset');
        project=DesignEditorApp.project;const uploaded=project.surfaces[0].extras.find(item=>item.type==='image');assert(uploaded?.name==='user-flow.png','uploaded image metadata changed');
        document.body.dataset.userFlowUploadHandler='production-change-listener';

        const payload=await DesignEditorProjectFile.buildPortablePayload(project);
        const portableImage=payload.project.surfaces[0].extras.find(item=>item.type==='image');
        assert(portableImage?.src?.startsWith('data:image/webp;base64,'),'portable project did not inline optimized image');
        assert(!portableImage.assetId,'portable project leaked browser-local asset id');
        assert(payload.project.surfaces[0].elements[0]?.text==='저장 복원 사용자 흐름','portable project lost edited text');
        document.body.dataset.userFlowPortable='true';

        DesignEditorApp.startProject('flyer-a4');await settle();project=DesignEditorApp.project;assert((project.surfaces[0].extras||[]).length===0,'fresh project unexpectedly retained image');
        await DesignEditorProjectFile.restorePortablePayload(payload,'browser-user-flow-smoke');
        await waitFor(()=>DesignEditorApp.project?.surfaces?.[0]?.elements?.[0]?.text==='저장 복원 사용자 흐름','restored text');
        await waitFor(()=>DesignEditorApp.project?.surfaces?.[0]?.extras?.some(item=>item.type==='image'&&item.assetId&&String(item.src||'').startsWith('blob:')),'restored image asset');
        project=DesignEditorApp.project;const restoredImage=project.surfaces[0].extras.find(item=>item.type==='image');
        assert(restoredImage?.name==='user-flow.png','restored image metadata changed');
        await waitFor(()=>{const image=document.querySelector('.phase2-image img');return image?.complete&&image.naturalWidth>0;},'restored image render');
        document.body.dataset.userFlowRestored='true';

        const finalCheck=window.DesignEditorFinalPrintCheck;const originalGate=finalCheck.confirmBeforeOutput;const originalAnchorClick=HTMLAnchorElement.prototype.click;let gateFormat='';let pngDownload=null;
        finalCheck.confirmBeforeOutput=async options=>{gateFormat=String(options?.format||'');return true;};HTMLAnchorElement.prototype.click=function(){pngDownload={href:this.href,download:this.download};};
        try{await DesignEditorOutput.exportPng();}finally{HTMLAnchorElement.prototype.click=originalAnchorClick;}
        assert(gateFormat==='png','restored project PNG did not pass final print gate');assert(pngDownload?.href?.startsWith('data:image/png;base64,'),'restored project PNG payload missing');assert(pngDownload?.download?.endsWith('_300dpi.png'),'restored project PNG filename changed');document.body.dataset.userFlowPng='true';if(pngDownload)pngDownload.href='';

        await waitFor(()=>document.getElementById('designPdfProfile'),'PDF profile');document.getElementById('designPdfProfile').value='standard';
        const pdfInstances=[];class UserFlowJsPdf{constructor(options){this.options=options;this.pages=[{format:options.format,orientation:options.orientation}];this.images=[];this.savedName='';pdfInstances.push(this);}addPage(format,orientation){this.pages.push({format,orientation});}addImage(data,format,x,y,w,h,alias,compression){this.images.push({data,format,x,y,w,h,alias,compression});}getNumberOfPages(){return this.pages.length;}save(name){this.savedName=String(name||'');}}
        const originalLoader=window.CoverJsPdfLoader;window.CoverJsPdfLoader={ensure:async()=>UserFlowJsPdf,ready:()=>true,stage:'browser-user-flow-pdf-double'};gateFormat='';
        try{await DesignEditorOutput.exportPdf();}finally{finalCheck.confirmBeforeOutput=originalGate;if(originalLoader)window.CoverJsPdfLoader=originalLoader;else delete window.CoverJsPdfLoader;}
        assert(gateFormat==='pdf','restored project PDF did not pass final print gate');assert(pdfInstances.length===1,'restored project PDF document count changed');const pdf=pdfInstances[0];assert(pdf.getNumberOfPages()===2&&pdf.images.length===2,'restored project PDF lost two-surface output');assert(pdf.savedName.endsWith('_300dpi.pdf'),'restored project PDF filename changed');pdf.images.forEach(image=>{image.data='';});
        document.body.dataset.userFlowPdfPages=String(pdf.getNumberOfPages());document.body.dataset.userFlowRuntime=String(boot.manifest.length);

        const report=window.DesignEditorRuntimeDiagnostics?.report?.();const fatalTypes=new Set(['error','rejection','resource-error','runtime-error','runtime-timeout','output-verification-error']);const fatal=(report?.records||[]).filter(entry=>fatalTypes.has(entry.type));assert(fatal.length===0,`user flow runtime errors found: ${fatal.map(entry=>entry.type+':'+entry.message).join(' | ')}`);
        pass('image upload, edit, portable save, restore, PNG and PDF output');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
