<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PDF Editor Unified Shell Smoke</title>
  <style>
    :root{--nav-h:52px}*{box-sizing:border-box}body{margin:0;padding-top:var(--nav-h)}.top-nav{height:var(--nav-h)}.app{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - var(--nav-h))}aside{padding:16px}.sec{display:block;border:1px solid #ddd;margin:6px 0}.sec-body{display:block;padding:8px}.sec-body.hidden{display:none}
  </style>
  <script>history.replaceState(null,'','/pdf-editor/index.html?browser-shell-smoke=1');</script>
</head>
<body data-shell-smoke="pending">
  <nav class="top-nav">
    <a class="nav-back" href="/index.html">목록으로</a>
    <div class="nav-title">PDF 문서 편집기</div>
    <div class="nav-user">
      <button id="navSessionBtn" style="display:none">편집 저장</button>
      <button id="navSessionLoadBtn" style="display:none">편집 불러오기</button>
      <span id="navUserName" class="nav-user-name">사용자</span>
      <button id="navLogout" class="nav-logout">로그아웃</button>
    </div>
  </nav>
  <div class="app">
    <aside>
      <h1>PDF 문서 편집기</h1>
      <div class="sub">PDF 편집 작업</div>
      <div class="sec" id="uploadSection"><div class="sec-head"><span class="sec-title">파일 업로드</span></div><div class="sec-body" id="sb-upload">업로드 도구</div></div>
      <div class="sec" id="nupSection"><div class="sec-head"><span class="sec-title">N-up 배치</span></div><div class="sec-body" id="sb-nup">배치 도구</div></div>
      <div class="sec" id="paperSection"><div class="sec-head"><span class="sec-title">용지 설정</span></div><div class="sec-body" id="sb-paper">용지 도구</div></div>
      <div class="sec" id="editSection"><div class="sec-head collapsed"><span class="sec-title">문서 편집</span></div><div class="sec-body hidden" id="sb-edit">편집 도구</div></div>
      <div class="sec" id="outputSection"><div class="sec-head"><span class="sec-title">출력</span></div><div class="sec-body">출력 도구</div></div>
    </aside>
    <main></main>
  </div>
  <div id="result">PENDING</div>

  <!-- Production regression order: the common UI can reach DOM ready before
       the PDF-specific shell/runtime. It must never mount the retired PDF
       workflow or icon tool rail in this ordering. -->
  <script src="/js/program-studio-ui-v2.js?v=20260830-2"></script>
  <script src="/js/program-shell-unify.js?v=20260824-1"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const assert=(value,message)=>{if(!value)throw new Error(message)};
      const waitFor=async(predicate,label,timeout=5000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,20));}throw new Error('timeout: '+label)};
      const visible=node=>node&&getComputedStyle(node).display!=='none'&&getComputedStyle(node).visibility!=='hidden';
      try{
        await waitFor(()=>document.body.dataset.programShell==='compact','compact shell');
        await waitFor(()=>window.PdfEditorSimpleSidebarUi?.stage==='single-sidebar-all-controls-visible-v3','always-visible sidebar runtime');
        await new Promise(resolve=>setTimeout(resolve,2300));

        assert(window.ProgramShellUnify?.stage==='pdf-tools-headerless-unified-shell','shell API missing');
        assert(window.ProgramStudioUI?.surface==='pdf-editor','common UI surface missing');
        assert(document.body.dataset.programKind==='pdf-editor','pdf editor kind missing');
        assert(!document.querySelector('body > .top-nav'),'fixed top nav remained');
        const aside=document.querySelector('.app > aside');
        const bar=aside?.querySelector(':scope > .program-local-actions');
        assert(bar&&bar===aside?.firstElementChild,'local actions not moved to sidebar top');
        assert(bar.querySelector('.nav-back')?.textContent.trim()==='← 홈','home action missing');
        assert(bar.querySelector('#navSessionBtn')&&bar.querySelector('#navSessionLoadBtn'),'session actions lost');
        assert(bar.querySelector('#navLogout'),'logout action lost');
        assert(document.getElementById('navUserName'),'user node lost');
        assert(getComputedStyle(document.body).paddingTop==='0px','body top padding remained');

        const sections=[...aside.querySelectorAll('.sec')];
        assert(sections.length===5,'sidebar sections were lost');
        assert(sections.every(visible),'one or more sidebar sections became hidden');
        assert(visible(document.getElementById('sb-edit')),'previously collapsed editor section did not stay open');
        assert(!document.querySelector('.ps-sidebar-toggle'),'legacy sidebar toggle was mounted');
        assert(!document.querySelector('.ps-tool-rail'),'legacy editor tool rail was mounted');
        assert(!document.querySelector('.ps-tool-sidebar-shell'),'legacy editor tool shell was mounted');
        assert(!document.getElementById('pdfEditorWorkflowV2Script'),'legacy PDF workflow script was loaded');
        assert(!document.getElementById('editorToolRailV1Script'),'legacy tool-rail script was loaded');
        assert(document.body.dataset.pdfSidebarMode==='all-visible','always-visible sidebar marker missing');

        document.body.dataset.shellSmoke='pass';
        document.body.dataset.shellHeaderRemoved='true';
        document.body.dataset.shellActionsPreserved='true';
        document.body.dataset.shellSidebarStable='true';
        result.textContent='PASS: PDF sidebar remains visible after delayed common/runtime initialization';
      }catch(error){document.body.dataset.shellSmoke='fail';result.textContent='FAIL: '+String(error?.message||error)}
    })();
  </script>
</body>
</html>
