<!doctype html>
<html lang="ko">
<head><script data-program-studio-boot-guard src="/js/app-boot-guard.js?v=2026.09.02.003"></script>
  <meta charset="utf-8">
  <title>Design Editor Cover Project Roundtrip Smoke</title>
  <style>
    .hidden{display:none!important}body{font-family:Arial,sans-serif;margin:0;padding:12px}.sidebar{width:320px}.side-card{border:1px solid #ddd;padding:8px;margin:4px 0}#editorShell{display:grid;grid-template-columns:320px 1fr;gap:12px}#artboardViewport{width:1200px;height:700px;overflow:auto}#artboard{position:relative;background:#fff}.design-object{position:absolute}.editor-status{font-size:12px}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?browser-cover-project-smoke=1&embed=1&mode=cover&preset=cover-a4');
    window.ProgramStudioBoot={reveal(){}};
    window.__coverProjectRuntimeResults=[];
    window.addEventListener('programstudio:runtime-script-result',event=>window.__coverProjectRuntimeResults.push(event.detail||{}));
  </script>
</head>
<body data-cover-project-smoke-status="pending">
  <div id="coverProjectSmokeResult">PENDING</div><div id="authLoading"></div><span id="navUserName"></span><button id="logoutBtn" type="button">logout</button>
  <main id="startScreen"><button id="resumeDraftBtn" class="hidden" type="button">resume</button><div id="presetGrid"></div><input id="customWidth" value="210"><input id="customHeight" value="297"><button id="customStartBtn" type="button">custom</button><button id="coverEditorBtn" type="button">cover</button></main>
  <main id="editorShell" class="hidden"><aside class="sidebar"><section class="side-card"><div id="documentTitle"></div><div id="documentMeta"></div><button id="newDesignBtn" type="button">new</button></section><section class="side-card"><button id="addTitleBtn" type="button">title</button><button id="addSubtitleBtn" type="button">subtitle</button><button id="addBodyBtn" type="button">body</button><button id="addInfoBtn" type="button">info</button></section><section id="inspector" class="side-card"></section><section class="side-card"><div id="layerList"></div></section></aside><section><div id="surfaceTabs"></div><div id="saveState"></div><div id="artboardViewport"><div id="artboard"></div></div><div class="editor-footer"><div id="editorStatus" class="editor-status"></div></div></section></main>
  <script src="/js/design-editor/presets.js?v=20260821-1"></script><script src="/js/design-editor/app.js?v=20260821-1"></script><script src="/js/sw-register.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('coverProjectSmokeResult');
      const fail=error=>{document.body.dataset.coverProjectSmokeStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.coverProjectSmokeStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=14000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40));}throw new Error('timeout: '+label);};
      const settle=ms=>new Promise(resolve=>setTimeout(resolve,ms||100));
      const clone=value=>JSON.parse(JSON.stringify(value));
      try{
        await waitFor(()=>window.DesignEditorApp,'DesignEditorApp');
        await waitFor(()=>Array.isArray(window.ProgramStudioDesignEditorRuntimeManifest),'runtime manifest');
        await waitFor(()=>{
          const ids=new Set(window.ProgramStudioDesignEditorRuntimeManifest.map(entry=>entry.id)),latest=new Map();
          (window.__coverProjectRuntimeResults||[]).forEach(entry=>{if(ids.has(entry?.id))latest.set(entry.id,entry);});
          return ids.size===32&&latest.size===32&&[...latest.values()].every(entry=>entry.status==='loaded');
        },'all runtime results');
        await waitFor(()=>window.DesignEditorProjectFile,'DesignEditorProjectFile');
        await waitFor(()=>window.DesignEditorCoverModel,'DesignEditorCoverModel');
        await waitFor(()=>window.DesignEditorCoverSpineTools,'DesignEditorCoverSpineTools');
        await waitFor(()=>window.DesignEditorApp?.project?.presetId==='cover-a4','cover project');
        const project=DesignEditorApp.project;
        DesignEditorCoverModel.applyToProject(project,{pageCount:200,paperCaliper:.1,bindingAdjust:.5,spineDirection:'topToBottom'});
        window.dispatchEvent(new CustomEvent('programstudio:cover-geometry-change',{detail:{source:'cover-project-roundtrip-smoke'}}));await settle(140);
        assert(project.width===430.5&&project.cover.spine===10.5,'cover model setup failed');
        assert(project.surfaces[0].folds[0]===210&&project.surfaces[0].folds[1]===220.5,'cover folds setup failed');

        document.getElementById('addTitleBtn').click();await settle();
        const regular=project.surfaces[0].elements.find(item=>item.coverRole!=='spine-title');assert(regular,'regular cover title missing');
        regular.text='프로젝트 왕복 앞표지 제목';
        const regularId=regular.id;
        const spine=DesignEditorCoverSpineTools.addSpineTitle('center');await settle();
        spine.text='프로젝트 왕복 책등';spine.spineYPercent=63;DesignEditorCoverSpineTools.setDirection('topToBottom');DesignEditorCoverSpineTools.placeEntry(spine);await settle();
        const spineId=spine.id;
        assert(spine.spineDirection==='topToBottom'&&spine.rotation===90,'spine direction setup failed');

        const payload=await DesignEditorProjectFile.buildPortablePayload(project);
        assert(payload.format==='program-studio-design-project'&&payload.version===1,'portable wrapper changed');
        assert(payload.project.designMode==='cover'&&payload.project.presetId==='cover-a4','portable cover identity lost');
        assert(payload.project.cover.pageCount===200&&payload.project.cover.spine===10.5,'portable binding metadata lost');
        assert(payload.project.width===430.5&&payload.project.surfaces[0].folds.join(',')==='210,220.5','portable cover geometry lost');
        const portableSpine=payload.project.surfaces[0].elements.find(item=>item.id===spineId);
        assert(portableSpine?.coverRole==='spine-title'&&portableSpine.spineDirection==='topToBottom','portable spine semantics lost');
        assert(portableSpine.spineYPercent===63,'portable spine vertical position lost');
        assert(!Object.prototype.hasOwnProperty.call(payload.project,'coverPreviewZones'),'preview-only state leaked into project payload');

        const altered=clone(payload);
        altered.project.width=999;
        altered.project.cover.spine=99;
        altered.project.cover.spreadWidth=999;
        altered.project.cover.folds=[1,2];
        altered.project.surfaces[0].folds=[1,2];
        const restored=await DesignEditorProjectFile.restorePortablePayload(altered,'browser-cover-project-roundtrip');await settle(220);
        assert(restored.width===430.5&&restored.height===297,'restore did not canonicalize cover spread');
        assert(restored.cover.spine===10.5&&restored.cover.pageCount===200,'restore did not recalculate spine from binding inputs');
        assert(restored.surfaces.length===1&&restored.surfaces[0].id==='cover','restore lost single cover spread');
        assert(restored.surfaces[0].folds.join(',')==='210,220.5','restore did not rebuild cover fold boundaries');
        const restoredRegular=restored.surfaces[0].elements.find(item=>item.id===regularId),restoredSpine=restored.surfaces[0].elements.find(item=>item.id===spineId);
        assert(restoredRegular?.text==='프로젝트 왕복 앞표지 제목','restore lost common cover text');
        assert(restoredSpine?.text==='프로젝트 왕복 책등','restore lost spine title text');
        assert(restoredSpine?.spineDirection==='topToBottom'&&restoredSpine?.spineYPercent===63,'restore lost spine direction/position');
        assert(DesignEditorApp.project.width===430.5&&DesignEditorApp.project.cover?.spine===10.5,'common editor did not resume canonical cover project');
        const appSpine=DesignEditorApp.project.surfaces[0].elements.find(item=>item.id===spineId);
        assert(appSpine?.spineDirection==='topToBottom','resumed common editor lost spine semantics');

        let rejected=false;
        const broken=clone(payload);broken.project.cover.spineDirection='diagonal';
        try{DesignEditorProjectFile.unwrapProject(broken);}catch(error){rejected=String(error?.message||'').includes('책등 글자 방향');}
        assert(rejected,'invalid cover spine direction did not fail closed');

        document.body.dataset.coverProjectRuntime=String(window.ProgramStudioDesignEditorRuntimeManifest.length);
        document.body.dataset.coverProjectWidth=String(restored.width);
        document.body.dataset.coverProjectSpine=String(restored.cover.spine);
        document.body.dataset.coverProjectFolds=restored.surfaces[0].folds.join(',');
        document.body.dataset.coverProjectDirection=restoredSpine.spineDirection;
        document.body.dataset.coverProjectY=String(restoredSpine.spineYPercent);
        document.body.dataset.coverProjectRejected=String(rejected);
        pass('cover project file roundtrip preserves binding, common content and spine semantics');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
