<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Text Auto Fit Smoke</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;margin:0;padding:10px}
    #artboard{position:relative;width:648px;height:909px;background:#fff}
    .design-object{position:absolute;min-height:10px;border:1px solid transparent;padding:2px 3px;line-height:1.26}
    .design-text-inner{display:flex;align-items:flex-start;gap:.28em;width:100%;min-height:1.3em}
    .editable-text{display:block;flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;outline:none}
    .design-prefix-icon{width:1em;height:1em;flex:0 0 1em;margin-top:.12em}
    .field label{display:block}
    .phase3-resize-handle{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?text-auto-fit-smoke=1');
    const project={
      width:210,height:297,bleed:3,safe:6,activeSurface:'front',designMode:'cover',
      surfaces:[
        {id:'front',elements:[
          {id:'title1',type:'text',role:'title',text:'짧은 제목',fontFamily:'Arial',size:32,weight:800,align:'center',color:'#111827',icon:'none',x:15,y:20,w:180,visible:true},
          {id:'body1',type:'text',role:'body',text:'본문',fontFamily:'Arial',size:14,weight:400,align:'left',color:'#111827',icon:'none',x:20,y:55,w:130,visible:true}
        ]},
        {id:'back',elements:[
          {id:'back1',type:'text',role:'subtitle',text:'뒷면 자동 맞춤',fontFamily:'Arial',size:18,weight:700,align:'right',color:'#111827',icon:'none',x:10,y:40,w:170,visible:true}
        ]}
      ]
    };
    window.DesignEditorApp={get project(){return project;}};
    window.DesignEditorDraftScope={saveCurrent(){return true;}};
  </script>
</head>
<body data-text-auto-fit-smoke="pending">
  <div id="result">PENDING</div>
  <div id="inspector"><div class="field"><label>글상자 폭 mm</label><input id="widthInput" value="180"></div></div>
  <div id="artboard">
    <div class="design-object design-text selected" data-id="title1" style="left:54px;top:69px;width:540px;font-family:Arial,sans-serif;font-weight:800;font-size:45.155px;text-align:center"><div class="design-text-inner"><span class="editable-text">짧은 제목</span></div></div>
    <div class="design-object design-text" data-id="body1" style="left:69px;top:174px;width:390px;font-family:Arial,sans-serif;font-weight:400;font-size:19.753px;text-align:left"><div class="design-text-inner"><span class="editable-text">본문</span></div></div>
  </div>
  <script src="/js/design-editor/text-auto-fit.js?v=20260826-2"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.textAutoFitSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
      const pass=message=>{document.body.dataset.textAutoFitSmoke='pass';result.textContent='PASS: '+message};
      const assert=(condition,message)=>{if(!condition)throw new Error(message)};
      const waitFor=async(predicate,label,timeout=8000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,35))}throw new Error('timeout: '+label)};
      try{
        await waitFor(()=>window.DesignEditorTextAutoFit,'auto fit runtime');
        const title=project.surfaces[0].elements[0],body=project.surfaces[0].elements[1],back=project.surfaces[1].elements[0];
        await waitFor(()=>title.w<80&&body.w<60&&back.w<100,'initial all-surface auto fit');
        const originalCenter=15+180/2;
        assert(Math.abs((title.x+title.w/2)-originalCenter)<.35,'centered title moved while auto fitting');
        assert(Math.abs(body.x-20)<.1,'left-aligned body x changed');
        const widthInput=document.getElementById('widthInput');
        assert(widthInput.disabled===false&&widthInput.readOnly===false,'manual width input is not editable');
        assert(document.querySelector('#inspector .field>label').textContent.includes('자동'),'auto width label is missing');
        await waitFor(()=>document.getElementById('textBoxAutoWidthInput'),'auto width toggle');
        const autoToggle=document.getElementById('textBoxAutoWidthInput');
        assert(autoToggle.checked===true,'auto width should be enabled by default');

        const titleNode=document.querySelector('[data-id="title1"]');
        const textNode=titleNode.querySelector('.editable-text');
        const shortWidth=title.w;
        const centerBeforeLong=title.x+title.w/2;
        title.text='이 제목은 자동 폭이 더 길어져야 합니다 ABC 12345';
        textNode.textContent=title.text;
        textNode.dispatchEvent(new Event('input',{bubbles:true}));
        await waitFor(()=>title.w>shortWidth+20,'long text auto grow');
        assert(Math.abs((title.x+title.w/2)-centerBeforeLong)<.35,'center anchor changed after growing');

        const longWidth=title.w;
        const centerBeforeShort=title.x+title.w/2;
        title.text='짧게';textNode.textContent=title.text;textNode.dispatchEvent(new Event('input',{bubbles:true}));
        await waitFor(()=>title.w<longWidth-20,'short text auto shrink');
        assert(Math.abs((title.x+title.w/2)-centerBeforeShort)<.35,'center anchor changed after shrinking');

        const noIconWidth=title.w;
        title.icon='calendar';window.DesignEditorTextAutoFit.sync();
        await waitFor(()=>title.w>noIconWidth+.2,'icon width included');
        const noSpacingWidth=title.w;
        title.letterSpacing=1;window.DesignEditorTextAutoFit.sync();
        await waitFor(()=>title.w>noSpacingWidth+.2,'letter spacing included');

        widthInput.value='70';
        widthInput.dispatchEvent(new Event('input',{bubbles:true}));
        await waitFor(()=>title.textBoxWidthMode==='manual'&&Math.abs(title.w-70)<.1,'manual width input');
        await waitFor(()=>document.querySelector('#inspector .field>label').textContent.includes('직접'),'manual width label');
        assert(document.getElementById('textBoxAutoWidthInput').checked===false,'auto toggle did not turn off after manual width input');
        const manualWidth=title.w;
        title.text='수동 폭에서는 글자가 아주 길어져도 사용자가 지정한 글상자 폭을 그대로 유지해야 합니다 ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        textNode.textContent=title.text;
        textNode.dispatchEvent(new Event('input',{bubbles:true}));
        await new Promise(resolve=>setTimeout(resolve,180));
        assert(Math.abs(title.w-manualWidth)<.1,'manual width was overwritten by automatic fitting');

        const toggle=document.getElementById('textBoxAutoWidthInput');
        toggle.checked=true;
        toggle.dispatchEvent(new Event('change',{bubbles:true}));
        await waitFor(()=>title.textBoxWidthMode==='auto'&&Math.abs(title.w-manualWidth)>2,'return to auto width');
        assert(document.querySelector('#inspector .field>label').textContent.includes('자동'),'auto label did not return');

        title.text='드래그 폭 조절';
        textNode.textContent=title.text;
        textNode.dispatchEvent(new Event('input',{bubbles:true}));
        await waitFor(()=>title.textBoxWidthMode==='auto'&&title.w<120,'prepare drag width');
        const handle=document.createElement('button');
        handle.type='button';handle.className='phase3-resize-handle';titleNode.appendChild(handle);
        await waitFor(()=>handle.title.includes('글상자 폭'),'manual drag handle hint');
        const dragStartWidth=title.w,dragStartSize=title.size;
        handle.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:7,clientX:100,clientY:100}));
        document.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId:7,clientX:160,clientY:100}));
        document.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:7,clientX:160,clientY:100}));
        await waitFor(()=>title.textBoxWidthMode==='manual'&&title.w>dragStartWidth+10,'manual drag width resize');
        assert(title.size===dragStartSize,'manual width drag changed font size');
        assert(handle.style.getPropertyValue('cursor')==='ew-resize','manual width drag cursor missing');
        assert(document.getElementById('textBoxAutoWidthInput').checked===false,'drag resize did not switch auto width off');

        document.body.dataset.titleWidth=title.w.toFixed(2);
        document.body.dataset.bodyWidth=body.w.toFixed(2);
        document.body.dataset.backWidth=back.w.toFixed(2);
        document.body.dataset.widthMode=title.textBoxWidthMode;
        document.body.dataset.autoStage=window.DesignEditorTextAutoFit.stage;
        pass('text box width supports auto fitting, direct numeric width, drag resize, and return-to-auto mode');
      }catch(error){fail(error)}
    })();
  </script>
</body>
</html>
