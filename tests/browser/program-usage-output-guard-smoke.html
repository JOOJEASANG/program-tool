<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Program usage output guard smoke</title></head>
<body>
  <button id="generateBtn" type="button" data-program-usage-action="결과 만들기" data-program-usage-program="future-tool">결과 만들기</button>
  <script>
    let allowed=true;
    let canStartCalls=0;
    let commitCalls=0;
    let outputRuns=0;
    let alerts=0;
    window.alert=()=>{alerts+=1;};
    window.ProgramUsageCatalog={
      resolve(){return 'future-tool';},
      get(id){return id==='future-tool'?{id,name:'미래 프로그램',outputActionSelector:'#generateBtn'}:null;}
    };
    window.ProgramUsagePolicy={
      authReady:true,
      resolveProgramId(){return 'future-tool';},
      forProgram(id){
        if(id!=='future-tool')throw new Error('wrong program id '+id);
        return {
          async canStart(){canStartCalls+=1;return allowed?{ok:true}:{ok:false,message:'사용 제한'};},
          async commitSuccess(){commitCalls+=1;return {programId:id};}
        };
      }
    };
    document.getElementById('generateBtn').addEventListener('click',()=>{
      outputRuns+=1;
      const link=document.createElement('a');
      link.href='data:text/plain,ok';
      link.download='result.txt';
      link.addEventListener('click',event=>event.preventDefault());
      document.body.appendChild(link);
      link.click();
      link.remove();
    });
  </script>
  <script src="../../js/program-usage-output-guard.js"></script>
  <script>
    (async()=>{
      const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      const fail=message=>{document.documentElement.dataset.programUsageOutputGuardSmoke='fail';document.body.dataset.error=message;};
      try{
        document.getElementById('generateBtn').click();
        await wait(200);
        if(canStartCalls!==1)throw new Error('gate was not checked exactly once');
        if(outputRuns!==1)throw new Error('result action did not resume exactly once');
        if(commitCalls!==1)throw new Error('successful download was not committed');
        if(window.ProgramUsageOutputGuard?.pending?.programId!=='future-tool')throw new Error('pending program id mismatch');

        allowed=false;
        document.getElementById('generateBtn').click();
        await wait(120);
        if(canStartCalls!==2)throw new Error('second gate was not checked');
        if(outputRuns!==1)throw new Error('blocked result action still ran');
        if(commitCalls!==1)throw new Error('blocked action changed usage count');
        if(alerts!==1)throw new Error('blocked action did not notify user');
        document.documentElement.dataset.programUsageOutputGuardSmoke='pass';
      }catch(error){fail(error?.message||String(error));}
    })();
  </script>
</body>
</html>
