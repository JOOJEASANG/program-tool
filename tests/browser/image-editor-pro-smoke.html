<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Image Editor Pro Smoke</title></head>
<body data-image-pro-smoke="pending">
  <div id="result">PENDING</div>
  <div id="dropZone"><div id="emptyState"></div><div id="canvasViewport" hidden><div class="canvas-shell"><canvas id="previewCanvas"></canvas><div id="cropOverlay" hidden></div></div></div></div>
  <div id="fileMeta"></div><div id="statusText"></div><div id="dimensionText"></div>
  <input id="fileInput" type="file"><button id="openBtn"></button><button id="undoBtn"></button><button id="resetBtn"></button><button id="exportBtn"></button><button id="exportSideBtn"></button>
  <button id="rotateLeftBtn"></button><button id="rotateRightBtn"></button><button id="flipHBtn"></button><button id="flipVBtn"></button>
  <input id="cropX" value="0"><input id="cropY" value="0"><input id="cropW" value="1"><input id="cropH" value="1"><button id="squareCropBtn"></button><button id="fullCropBtn"></button><button id="applyCropBtn"></button>
  <button data-crop-ratio="square"></button><button data-crop-ratio="wide169"></button><div id="cropPresetStatus"></div><div id="clipboardStatus"></div>
  <input id="resizeW"><input id="resizeH"><input id="lockRatio" type="checkbox" checked><button id="applyResizeBtn"></button><button data-resize-preset="half"></button><button data-resize-preset="long1080"></button><div id="resizePresetStatus"></div>
  <button data-adjust-preset="clean"></button><button data-adjust-preset="mono"></button><div id="adjustPresetStatus"></div>
  <input id="brightness" type="range" min="20" max="180" value="100"><output id="brightnessOut"></output><input id="contrast" type="range" min="20" max="180" value="100"><output id="contrastOut"></output><input id="saturation" type="range" min="0" max="200" value="100"><output id="saturationOut"></output><button id="compareAdjustBtn"></button><button id="resetAdjustBtn"></button>
  <input id="backgroundColor" type="color" value="#ffffff"><button id="sampleBackgroundBtn"></button><input id="backgroundTolerance" type="range" min="0" max="120" value="30"><output id="backgroundToleranceOut"></output><input id="backgroundFeather" type="range" min="0" max="80" value="18"><output id="backgroundFeatherOut"></output><button id="removeBackgroundBtn"></button><button id="trimTransparentBtn"></button><div id="backgroundStatus"></div>
  <select id="exportFormat"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select><input id="exportQuality" value="92"><div id="exportNote"></div><div id="exportEstimate"></div>
  <div id="imageInfoBadge"></div><div id="cropInfoBadge"></div><div id="historyInfoBadge"></div><button id="zoomOutBtn"></button><span id="zoomValue"></span><button id="zoomInBtn"></button><button id="zoomFitBtn" data-zoom-mode="fit"></button><button id="checkerToggleBtn"></button>
  <section data-requires-image></section>
  <script src="/js/image-editor/app.js?v=20260823-2"></script>
  <script src="/js/image-editor/workflow.js?v=20260823-3"></script>
  <script src="/js/image-editor/pro.js?v=20260826-1"></script>
  <script>
  (async()=>{
    const result=document.getElementById('result');
    const fail=error=>{document.body.dataset.imageProSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
    const pass=message=>{document.body.dataset.imageProSmoke='pass';result.textContent='PASS: '+message};
    const assert=(condition,message)=>{if(!condition)throw new Error(message)};
    const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40))}throw new Error('timeout: '+label)};
    try{
      await waitFor(()=>window.ImageEditorApp&&window.ImageEditorPro&&document.documentElement.dataset.imageEditorProReady==='1','image pro ready');
      const api=window.ImageEditorApp,pro=window.ImageEditorPro;
      const source=document.createElement('canvas');source.width=160;source.height=100;const ctx=source.getContext('2d');ctx.clearRect(0,0,160,100);ctx.fillStyle='#4b7bd8';ctx.fillRect(10,10,140,80);
      const blob=await new Promise(resolve=>source.toBlob(resolve,'image/png'));
      await api.loadBlob(blob,'transparent-frame.png');
      let state=api.getState();assert(state.width===160&&state.height===100,'source dimensions are wrong');

      const half=pro.resizePreset('half');
      assert(half&&half.width===80&&half.height===50,'50% resize preset is wrong');
      assert(document.getElementById('resizeW').value==='80'&&document.getElementById('resizeH').value==='50','resize preset did not update fields');

      pro.applyAdjustmentPreset('mono');state=api.getState();assert(state.adjustments.saturation===0,'mono preset did not set saturation to zero');
      assert(pro.beginCompare()===true,'compare did not start');state=api.getState();assert(state.adjustments.saturation===100,'compare did not show unadjusted state');
      assert(pro.endCompare()===true,'compare did not end');state=api.getState();assert(state.adjustments.saturation===0,'compare did not restore adjustments');

      assert(pro.trimTransparentMargins()===true,'transparent trim did not apply');state=api.getState();assert(state.width===140&&state.height===80,'transparent trim dimensions are wrong');

      assert(pro.setZoom(150)===true,'zoom did not apply');
      assert(document.getElementById('zoomValue').textContent==='150%','zoom label is wrong');
      await pro.updateExportEstimate();
      await waitFor(()=>document.getElementById('exportEstimate').dataset.tone==='ready'&&document.getElementById('exportEstimate').textContent.includes('예상'),'export estimate ready');
      const estimateText=document.getElementById('exportEstimate').textContent;
      assert(/예상\s+[\d.,]+\s+(?:B|KB|MB)/.test(estimateText),'export estimate size text missing');
      pro.updateMetrics();assert(document.getElementById('imageInfoBadge').textContent.includes('140'),'image metrics did not update');

      document.body.dataset.proTrim=`${state.width}x${state.height}`;
      document.body.dataset.proZoom=document.getElementById('zoomValue').textContent;
      document.body.dataset.proEstimate=estimateText;
      document.body.dataset.proStage=pro.stage;
      pass('resize presets, adjustment compare, transparent trim, zoom and export estimate');
    }catch(error){fail(error)}
  })();
  </script>
</body>
</html>
