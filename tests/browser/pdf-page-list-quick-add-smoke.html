<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PDF page list quick add retired smoke</title>
</head>
<body>
  <div class="preview-zoom"><span>줄당</span><select id="perRowSelect"><option value="2">2</option></select></div>
  <section id="sb-upload">
    <div id="uploadZone">upload</div>
    <div class="mode-row">
      <button class="mode-btn" data-mode="new">새 작업</button>
      <button class="mode-btn active" data-mode="cont">연속</button>
      <button class="mode-btn" data-mode="break">비연속</button>
    </div>
    <input id="fileInput" type="file" multiple hidden>
    <div id="pdfPrintUtilityRedirectCard">PDF 가공·분할 도구로 이동</div>
  </section>
  <section id="sb-pages">
    <div id="pdfFileNavigation">legacy file navigation</div>
    <div id="pageProductivityPanelV3">multi select panel</div>
    <div id="thumbArea"></div>
  </section>
  <div id="previewScroll"></div>
  <div id="result">WAIT</div>

  <script>
    history.replaceState(null,'','/pdf-editor/?quick-add-retired-smoke=1');
    var parsedPages = [{ id: 'p1' }, { id: 'p2' }];
    var uploadedFiles = [];
    var fileNupMap = {};
    var showBorder = false;
    var _uploadMode = 'cont';
    async function handleFile(file) {
      uploadedFiles.push(file);
      parsedPages.push({ id: 'loaded-' + file.name });
    }
    window.handleFile = handleFile;
    function renderThumbs() {}
    function schedulePreview() {}
    document.querySelectorAll('.mode-btn').forEach(function (button) {
      button.addEventListener('click', function () { _uploadMode = button.dataset.mode; });
    });
    document.getElementById('fileInput').click = function () {};
  </script>
  <script src="/js/pdf-editor/preview-row-default.js?v=20260831-1"></script>
  <script src="/js/pdf-editor/upload-order-ui.js?v=20260831-1"></script>
  <script src="/js/pdf-editor/layout-ui-refinements.js?v=20260915-2"></script>
  <script>
    setTimeout(function () {
      var fail = function (message) {
        document.documentElement.dataset.pdfPageListQuickAddSmoke = 'fail';
        document.body.dataset.error = message;
        document.getElementById('result').textContent = 'FAIL: ' + message;
      };
      try {
        if (!window.PdfUploadOrderUi || !window.PdfLayoutUiRefinements) return fail('required APIs missing');

        // The old page-list quick append box is intentionally retired.
        window.PdfLayoutUiRefinements.removePageListQuickAdd();
        if (document.getElementById('pdfPageListQuickAddV1')) return fail('quick add bar still exists');
        if (document.documentElement.dataset.pdfPageListQuickAdd !== 'removed') return fail('retired marker missing');

        // Upload-order staging is a separate workflow and must keep working even
        // though its old page-list shortcut buttons are gone.
        var first = new File(['1'], '01-first.pdf', { type: 'application/pdf' });
        var second = new File(['2'], '02-second.pdf', { type: 'application/pdf' });
        var third = new File(['3'], '03-third.pdf', { type: 'application/pdf' });
        window.PdfUploadOrderUi.stageFiles([first, second, third], 'cont');
        if (window.PdfUploadOrderUi.pending.files.length !== 3) return fail('upload-order staging failed');
        window.PdfUploadOrderUi.movePending(2, 0);
        var reordered = window.PdfUploadOrderUi.pending.files.map(function (file) { return file.name; }).join(',');
        if (reordered !== '03-third.pdf,01-first.pdf,02-second.pdf') return fail('pending upload reorder failed');
        if (document.getElementById('pdfPageListQuickAddV1')) return fail('quick add bar returned after staging');

        document.documentElement.dataset.pdfPageListQuickAddSmoke = 'pass';
        document.getElementById('result').textContent = 'PASS: retired page-list quick add stays removed while upload-order staging remains intact';
      } catch (error) {
        fail(error && error.message ? error.message : String(error));
      }
    }, 120);
  </script>
</body>
</html>
