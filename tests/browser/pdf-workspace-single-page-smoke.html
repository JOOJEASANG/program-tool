<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>PDF Workspace Single Page Smoke</title></head>
<body data-pdf-workspace-single-page-smoke="running">
  <nav class="top">
    <a class="back" href="/index.html">← 도구 목록</a>
    <div class="top-title">PDF 올인원 <span class="top-sub">ALL PDF WORKSPACE</span></div>
    <div class="top-spacer"></div>
    <a class="top-link" href="/pdf-preflight/">전문 검사·변환</a>
    <a class="top-link" href="/pdf-editor/">전문 편집·인쇄</a>
  </nav>
  <main class="wrap">
    <section class="hero"><span class="hero-badge">old</span><h1>old</h1><p>old</p><div class="hero-meta"></div></section>
    <section class="quick"><a href="/pdf-preflight/"><strong>legacy</strong></a></section>
    <section id="pdf-primary-workspace">LOCAL PRIMARY</section>
    <div class="toolbar">SEARCH</div>
    <section class="section" data-category="pages"><a class="tool available" href="#local-tools"><span class="tool-name">전체 페이지 회전</span></a></section>
    <section class="section" data-category="convert"><a class="tool available" id="preflightTool" href="/pdf-preflight/"><span class="tool-name">PDF 압축</span></a></section>
    <section class="section" data-category="scan"><div class="tool planned"><span class="tool-name">OCR</span></div></section>
    <section class="section" data-category="edit"><a class="tool available" id="editorTool" href="/pdf-editor/"><span class="tool-name">N-up 다면 배치</span></a></section>
    <section class="section" data-category="security"><div class="tool planned"><span class="tool-name">보안</span></div></section>
    <section class="section" data-category="optimize"><div class="tool planned"><span class="tool-name">최적화</span></div></section>
    <section class="section" data-category="print"><div class="tool planned"><span class="tool-name">인쇄</span></div></section>
    <section class="section" data-category="analyze"><div class="tool planned"><span class="tool-name">분석</span></div></section>
    <section id="local-tools">LOCAL TOOLS</section>
    <section class="roadmap">ROADMAP</section>
  </main>
  <div id="result">RUNNING</div>
  <script>
    history.replaceState(null,'','/pdf-suite/?smoke=single-page');
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const waitFor=async(fn,label,timeout=3000)=>{const start=Date.now();while(Date.now()-start<timeout){if(fn())return;await wait(20);}throw new Error('timeout: '+label);};
  </script>
  <script src="/js/pdf-suite/single-page-shell.js?v=smoke"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      try{
        await waitFor(()=>document.documentElement.dataset.pdfWorkspaceSinglePage==='ready','single-page runtime');
        if(document.title!=='PDF 작업실 · Program Studio')throw new Error('workspace title not normalized');
        if(!document.querySelector('.top-title')?.textContent.includes('PDF 작업실'))throw new Error('top title missing');
        if(!document.querySelector('.quick')?.classList.contains('pdfws-legacy-hidden'))throw new Error('legacy quick routes still visible');
        if(document.querySelectorAll('#pdfWorkspaceNav button[data-pdf-workspace-group]').length!==4)throw new Error('four workspace groups missing');
        if(!document.querySelector('[data-pdf-workspace-print]'))throw new Error('print checker top route missing');
        if(document.querySelector('.top-link[href="/pdf-preflight/"]')&&!document.querySelector('.top-link[href="/pdf-preflight/"]').classList.contains('pdfws-legacy-hidden'))throw new Error('specialist top route still exposed');

        window.ProgramStudioPdfSinglePageWorkspace.setGroup('convert',{scroll:false});
        if(document.querySelector('[data-category="convert"]').style.display==='none')throw new Error('convert group hidden');
        if(document.querySelector('[data-category="pages"]').style.display!=='none')throw new Error('pages group still visible');
        if(document.getElementById('pdf-primary-workspace').style.display!=='none')throw new Error('local primary should hide outside basic');

        const before=location.pathname+location.search;
        document.getElementById('preflightTool').click();
        await waitFor(()=>document.getElementById('pdfWorkspaceEmbedded')?.classList.contains('open'),'embedded preflight');
        if(location.pathname+location.search!==before)throw new Error('top-level route changed for preflight');
        if(document.documentElement.dataset.pdfWorkspaceEmbedded!=='preflight')throw new Error('preflight embed marker missing');
        const preflightFrame=document.getElementById('pdfWorkspaceFramePreflight');
        if(!preflightFrame.getAttribute('src')?.includes('/pdf-preflight/?embed=1'))throw new Error('preflight iframe not embedded');
        if(!preflightFrame.classList.contains('active'))throw new Error('preflight frame not active');

        document.getElementById('pdfWorkspaceEmbeddedClose').click();
        await wait(30);
        if(document.getElementById('pdfWorkspaceEmbedded').classList.contains('open'))throw new Error('embedded view did not close');
        if(document.documentElement.dataset.pdfWorkspaceView!=='group-convert')throw new Error('group state not restored');

        window.ProgramStudioPdfSinglePageWorkspace.setGroup('edit',{scroll:false});
        document.getElementById('editorTool').click();
        await waitFor(()=>document.documentElement.dataset.pdfWorkspaceEmbedded==='editor','embedded editor');
        if(location.pathname+location.search!==before)throw new Error('top-level route changed for editor');
        const editorFrame=document.getElementById('pdfWorkspaceFrameEditor');
        if(!editorFrame.getAttribute('src')?.includes('/pdf-editor/?embed=1'))throw new Error('editor iframe not embedded');
        if(!editorFrame.classList.contains('active'))throw new Error('editor frame not active');

        document.body.dataset.pdfWorkspaceSinglePageSmoke='pass';
        result.textContent='PASS';
      }catch(error){
        document.body.dataset.pdfWorkspaceSinglePageSmoke='fail';
        result.textContent='FAIL: '+String(error?.stack||error);
      }
    })();
  </script>
</body>
</html>
