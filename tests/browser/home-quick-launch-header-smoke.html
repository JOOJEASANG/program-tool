<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Home Quick Launch Header Smoke</title>
  <link rel="stylesheet" href="/css/program-studio-ui-v2.css?v=quick-smoke">
  <link rel="stylesheet" href="/css/studio-workspace.css?v=quick-smoke">
  <style>body{margin:0}.topbar{display:flex;align-items:center;min-height:78px;padding:16px 28px;background:#fff}.topbar-right{margin-left:auto;display:flex;align-items:center}</style>
  <script>history.replaceState({},'', '/?home-quick-launch-smoke=1')</script>
</head>
<body data-home-suite="categorized-programs-v2" data-home-quick-launch-smoke="running">
  <header class="topbar"><div class="topbar-right" aria-label="빠른 실행"></div></header>
  <main><h1>프로그램 모음</h1><div id="result">RUNNING</div></main>
  <script src="/js/program-studio-ui-v2.js?v=home-quick-smoke"></script>
  <script>
  (async()=>{
    const result=document.getElementById('result');
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const assert=(condition,message)=>{if(!condition)throw new Error(message)};
    try{
      const response=await fetch('/index.html',{cache:'no-store'});
      assert(response.ok,'failed to fetch actual home markup');
      const source=await response.text();
      const parsed=new DOMParser().parseFromString(source,'text/html');
      const right=parsed.querySelector('.topbar-right');
      assert(right,'home right header is missing');
      assert(!right.querySelector('.topbar-login,.topbar-user,#tbLogin,#tbUser'),'home header still contains account details');
      assert(parsed.querySelector('#sbUser')&&parsed.querySelector('#sbLogout')&&parsed.querySelector('#sbAdmin'),'sidebar auth or admin access was lost');
      assert(source.includes("document.getElementById('sbAdmin').classList.remove('hidden')"),'admin link cannot become visible');
      await wait(150);
      const host=document.querySelector('.topbar-right'),button=host?.querySelector('.ps-home-quick-launch');
      assert(button&&host.children.length===1,'quick-launch is not the only top-right button');
      assert(button.querySelector('.ps-quick-launch-icon svg circle'),'search icon missing');
      assert(button.querySelector('.ps-quick-launch-label')?.textContent==='빠른 실행','quick-launch label missing');
      assert(button.querySelector('kbd')?.textContent==='Ctrl K','keyboard shortcut hint missing');
      assert(button.getAttribute('aria-label').includes('Ctrl+K'),'accessible keyboard hint missing');
      const bg=getComputedStyle(button);
      assert(bg.borderRadius==='13px','quick launch refined corner radius missing: '+bg.borderRadius);
      assert(bg.minHeight==='46px','quick launch touch target too small: '+bg.minHeight);
      assert(bg.boxShadow!=='none','quick launch shadow not applied');
      button.click();
      const palette=document.getElementById('psCommandPalette');
      assert(palette?.classList.contains('open'),'quick-launch click did not open command palette');
      document.dispatchEvent(new KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true,cancelable:true}));
      assert(!palette.classList.contains('open'),'Ctrl+K did not close existing command palette');
      document.dispatchEvent(new KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true,cancelable:true}));
      assert(palette.classList.contains('open'),'Ctrl+K did not reopen command palette');
      document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));
      assert(!palette.classList.contains('open'),'Escape did not close command palette');
      document.body.dataset.homeQuickLaunchSmoke='pass';
      result.textContent='PASS: home header shows only a refined quick launch, preserves Ctrl+K and sidebar account access';
    }catch(error){
      document.body.dataset.homeQuickLaunchSmoke='fail';
      result.textContent='FAIL: '+String(error?.stack||error);
    }
  })();
  </script>
</body>
</html>
