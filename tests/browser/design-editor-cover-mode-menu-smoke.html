<!doctype html>
<html lang="ko">
<head><script data-program-studio-boot-guard src="/js/app-boot-guard.js?v=2026.09.02.003"></script>
  <meta charset="utf-8">
  <title>Design Editor Cover Mode Menu Smoke</title>
  <style>
    .hidden{display:none!important}body{font-family:Arial,sans-serif;margin:0;padding:12px}.sidebar{width:320px}.side-card{border:1px solid #ddd;padding:8px;margin:4px 0}#editorShell{display:grid;grid-template-columns:320px 1fr;gap:12px}#artboardViewport{width:1000px;height:650px;overflow:auto}#artboard{position:relative;background:#fff}.design-object{position:absolute}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?browser-cover-mode-menu-smoke=1&embed=1&mode=cover&preset=cover-a4');
    window.ProgramStudioBoot={reveal(){}};
  </script>
</head>
<body data-cover-mode-menu-status="pending">
  <div id="coverModeMenuResult">PENDING</div>
  <div id="authLoading"></div><span id="navUserName"></span><button id="logoutBtn" type="button">logout</button>
  <main id="startScreen"><button id="resumeDraftBtn" class="hidden" type="button">resume</button><div id="presetGrid"></div><input id="customWidth" value="210"><input id="customHeight" value="297"><button id="customStartBtn" type="button">custom</button><button id="coverEditorBtn" type="button">cover</button></main>
  <main id="editorShell" class="hidden">
    <aside class="sidebar">
      <section class="side-card"><div id="documentTitle"></div><div id="documentMeta"></div><button id="newDesignBtn" type="button">new</button></section>
      <section class="side-card"><button id="addTitleBtn" type="button">title</button><button id="addSubtitleBtn" type="button">subtitle</button><button id="addBodyBtn" type="button">body</button><button id="addInfoBtn" type="button">info</button></section>
      <section id="inspector" class="side-card"></section><section class="side-card"><div id="layerList"></div></section>
    </aside>
    <section><div id="surfaceTabs"></div><div id="saveState"></div><div id="artboardViewport"><div id="artboard"></div></div><div class="editor-footer"><div id="editorStatus" class="editor-status"></div></div></section>
  </main>
  <script src="/js/design-editor/presets.js?v=20260821-1"></script>
  <script src="/js/design-editor/app.js?v=20260821-1"></script>
  <script src="/js/sw-register.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('coverModeMenuResult');
      const fail=error=>{document.body.dataset.coverModeMenuStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.coverModeMenuStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,30));}throw new Error('timeout: '+label);};
      const settle=()=>new Promise(resolve=>setTimeout(resolve,180));
      const coverPanels=()=>['designCoverSettingsTools','designCoverSpineTools','designCoverPreviewZoneTools'].map(id=>document.getElementById(id));
      try{
        await waitFor(()=>window.DesignEditorApp?.project?.designMode==='cover','initial cover project');
        await waitFor(()=>window.DesignEditorEmbeddedRuntime,'embedded runtime');
        await waitFor(()=>window.DesignEditorEmbeddedPolish,'embedded polish');
        await waitFor(()=>window.DesignEditorCoverModeBridge?.activateCoverInPlace,'cover in-place bridge');
        await waitFor(()=>coverPanels().every(Boolean),'real cover-only menu panels');
        await settle();

        const initialPanels=coverPanels();
        DesignEditorEmbeddedPolish.syncCapabilityVisibility();
        assert(initialPanels.every(panel=>panel.hidden===false&&panel.getAttribute('aria-hidden')==='false'),'cover mode must show cover settings, spine and guide menus');
        assert(document.documentElement.dataset.activeDesignMode==='cover','cover active-mode marker missing');
        assert(document.getElementById('designCoverSpineTools')?.textContent.includes('책등 글자'),'real spine menu is missing in cover mode');

        const flyerButton=document.querySelector('[data-design-mode="flyer"]');
        assert(flyerButton,'flyer mode button missing');
        flyerButton.click();
        await waitFor(()=>window.DesignEditorApp?.project?.designMode==='flyer','in-place switch to flyer');
        await settle();
        DesignEditorEmbeddedPolish.syncCapabilityVisibility();
        assert(coverPanels().every(panel=>panel.hidden===true&&panel.getAttribute('aria-hidden')==='true'),'cover-only menus remained visible in flyer mode');
        assert(document.documentElement.dataset.activeDesignMode==='flyer','flyer active-mode marker missing');
        assert(document.querySelector('[data-design-mode="flyer"]')?.classList.contains('on'),'flyer mode button did not become active');

        const coverButton=document.querySelector('[data-design-mode="cover"]');
        assert(coverButton,'cover mode button missing after flyer switch');
        const before=performance.now();
        coverButton.click();
        await waitFor(()=>window.DesignEditorApp?.project?.designMode==='cover','in-place return to cover');
        await settle();
        const elapsed=Math.round(performance.now()-before);
        DesignEditorEmbeddedPolish.syncCapabilityVisibility();
        assert(coverPanels().every(panel=>panel.hidden===false&&panel.getAttribute('aria-hidden')==='false'),'cover-only menus did not return after cover selection');
        assert(document.getElementById('designCoverSpineTools')?.textContent.includes('책등 글자'),'spine menu did not return with cover mode');
        assert(document.querySelector('[data-design-mode="cover"]')?.classList.contains('on'),'cover mode button did not become active again');
        assert(!document.querySelector('[data-design-mode="flyer"]')?.classList.contains('on'),'flyer mode button remained active after returning to cover');
        assert(location.pathname.endsWith('/design-editor/index.html'),'cover switch unexpectedly navigated away from the current editor document');

        document.body.dataset.coverModeMenuCoverVisible='true';
        document.body.dataset.coverModeMenuFlyerHidden='true';
        document.body.dataset.coverModeMenuReturnVisible='true';
        document.body.dataset.coverModeMenuNoReload='true';
        document.body.dataset.coverModeMenuElapsed=String(elapsed);
        pass('cover switches in place and real cover-only sidebar menus follow the selected design mode');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
