<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Admin per-program usage settings smoke</title></head>
<body>
  <aside class="side">
    <button class="navbtn on" data-tab="dashboard"><span>▦</span>대시보드</button>
    <button class="navbtn" data-tab="members"><span>👥</span>회원·구독</button>
    <button class="navbtn" data-tab="business"><span>▤</span>사업자·약관</button>
    <div class="sidefoot"></div>
  </aside>
  <header><h1 id="pageTitle">대시보드</h1><p id="pageSub">운영 상태</p><button id="refreshBtn" type="button">새로고침</button></header>
  <main class="content">
    <section class="panel on" id="dashboard"><div class="hero"><p>기본 운영 설명</p></div></section>
    <section class="panel" id="members"><div class="cardtitle">회원·구독 관리</div><div class="cardsub"></div></section>
    <section class="panel" id="business"></section>
  </main>
  <script>
    window.__saved=[];
    window.firebase={firestore:{FieldValue:{serverTimestamp(){return 'SERVER_TIMESTAMP';}}}};
    const storedDocs=[{
      id:'print-checker',
      data(){return {programId:'print-checker',label:'인쇄물 사전 검토',enabled:true,period:'monthly',guestLimit:7,memberLimit:21};}
    }];
    window.db={
      collection(name){
        if(name==='program_usage_limits'){
          return {
            async get(){return {docs:storedDocs,forEach(callback){storedDocs.forEach(callback);}};},
            doc(id){return {async set(payload,options){window.__saved.push({path:`program_usage_limits/${id}`,payload,options});}};}
          };
        }
        if(name==='settings'){
          return {doc(){return {async get(){return {exists:false};}};}};
        }
        throw new Error('unexpected collection '+name);
      }
    };
    const adminUser={uid:'admin-config-smoke'};
    window.auth={currentUser:adminUser,onAuthStateChanged(callback){setTimeout(()=>callback(adminUser),0);return()=>{};}};
    window.ProgramAccess={async isAdmin(){return true;}};
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const waitFor=async(fn,label,timeout=5000)=>{const start=Date.now();while(Date.now()-start<timeout){if(fn())return;await wait(20);}throw new Error('timeout: '+label);};
  </script>
  <script src="../../js/admin-pdf-usage-settings.js"></script>
  <script>
    (async function(){
      const fail=message=>{document.documentElement.dataset.adminPdfUsageSettingsSmoke='fail';document.body.dataset.error=message;};
      try{
        await waitFor(()=>document.documentElement.dataset.adminProgramUsageSettings==='ready','admin settings UI');
        await waitFor(()=>document.documentElement.dataset.adminProgramUsageCount==='5','catalog rows');
        const nav=document.getElementById('adminProgramUsageNav');
        if(!nav||!nav.textContent.includes('프로그램 사용횟수'))throw new Error('admin navigation missing');
        nav.click();
        if(!document.getElementById('programusage')?.classList.contains('on'))throw new Error('admin settings panel did not open');
        if(document.getElementById('pageTitle')?.textContent!=='프로그램 사용횟수')throw new Error('admin page title not updated');

        const printRow=document.querySelector('.program-usage-row[data-program-id="print-checker"]');
        if(!printRow)throw new Error('print checker row missing');
        if(printRow.querySelector('[data-field="period"]')?.value!=='monthly')throw new Error('saved period did not load');
        if(printRow.querySelector('[data-field="guestLimit"]')?.value!=='7')throw new Error('saved guest limit did not load');
        if(printRow.querySelector('[data-field="memberLimit"]')?.value!=='21')throw new Error('saved member limit did not load');

        printRow.querySelector('[data-field="period"]').value='daily';
        printRow.querySelector('[data-field="guestMode"]').value='limited';
        printRow.querySelector('[data-field="guestMode"]').dispatchEvent(new Event('change'));
        printRow.querySelector('[data-field="guestLimit"]').value='4';
        printRow.querySelector('[data-field="memberMode"]').value='unlimited';
        printRow.querySelector('[data-field="memberMode"]').dispatchEvent(new Event('change'));
        printRow.querySelector('[data-save-program="print-checker"]').click();
        await waitFor(()=>window.__saved.some(item=>item.path==='program_usage_limits/print-checker'),'print checker save');
        const saved=window.__saved.find(item=>item.path==='program_usage_limits/print-checker');
        if(saved.payload.guestLimit!==4||saved.payload.memberLimit!==-1||saved.payload.period!=='daily')throw new Error('per-program settings payload incorrect');
        if(saved.payload.updatedAt!=='SERVER_TIMESTAMP'||saved.options?.merge!==true)throw new Error('safe save metadata missing');

        document.getElementById('newUsageProgramId').value='image-converter';
        document.getElementById('newUsageProgramName').value='이미지 변환';
        document.getElementById('addUsageProgramBtn').click();
        await waitFor(()=>document.querySelector('.program-usage-row[data-program-id="image-converter"]'),'future program row');
        document.querySelector('[data-save-program="image-converter"]').click();
        await waitFor(()=>window.__saved.some(item=>item.path==='program_usage_limits/image-converter'),'future program save');
        const custom=window.__saved.find(item=>item.path==='program_usage_limits/image-converter');
        if(custom.payload.label!=='이미지 변환'||custom.payload.programId!=='image-converter')throw new Error('future program payload incorrect');
        if(document.documentElement.dataset.adminProgramUsageCount!=='6')throw new Error('future program was not added to dynamic list');

        document.documentElement.dataset.adminPdfUsageSettingsSmoke='pass';
      }catch(error){fail(error?.message||String(error));}
    })();
  </script>
</body>
</html>
