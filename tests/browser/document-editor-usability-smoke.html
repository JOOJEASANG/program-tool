<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Document Editor Usability Smoke</title></head>
<body data-document-usability-smoke="pending">
  <div id="result">PENDING</div>
  <iframe id="editorFrame" src="/document-editor/" style="width:1200px;height:900px;border:0"></iframe>
  <script>
  (async()=>{
    const result=document.getElementById('result'),frame=document.getElementById('editorFrame');
    const fail=error=>{document.body.dataset.documentUsabilitySmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
    const pass=message=>{document.body.dataset.documentUsabilitySmoke='pass';result.textContent='PASS: '+message};
    const assert=(condition,message)=>{if(!condition)throw new Error(message)};
    const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40))}throw new Error('timeout: '+label)};
    try{
      await waitFor(()=>frame.contentWindow?.DocumentEditorApp&&frame.contentWindow?.DocumentEditorWorkflow&&frame.contentWindow?.DocumentEditorUsability&&frame.contentDocument?.documentElement.dataset.documentEditorUsabilityReady==='1','document usability ready');
      const win=frame.contentWindow,doc=frame.contentDocument,core=win.DocumentEditorApp,usability=win.DocumentEditorUsability;
      core.clearDraft();win.localStorage.removeItem(usability.constants.zoomKey);core.newDocument(true);

      const zoom=usability.applyZoom(125);
      const page=doc.getElementById('documentPage');
      assert(zoom===125&&page.dataset.zoom==='125'&&page.style.zoom==='1.25','125% editor zoom did not apply');
      assert(win.localStorage.getItem(usability.constants.zoomKey)==='125','zoom preference was not saved');

      const template=usability.applyTemplate('meeting',{force:true});
      assert(template&&template.key==='meeting'&&doc.getElementById('documentTitle').value==='회의록','meeting template metadata failed');
      assert(page.querySelector('h1')?.textContent==='회의록'&&page.querySelector('table'),'meeting template content/table missing');
      assert(core.getState().hasDraft===true,'template was not saved as draft');

      page.focus();const range=doc.createRange(),selection=win.getSelection();range.selectNodeContents(page);range.collapse(false);selection.removeAllRanges();selection.addRange(range);
      const unsafeScript='<'+'script>window.bad=1<'+'/script>';
      const unsafeHtml='<p onclick="window.bad=2"><b>붙여넣기 안전 확인</b></p>'+unsafeScript+'<img src="https://bad.example/a.png" onerror="window.bad=3">';
      let prevented=false;
      const pasted=usability.handlePaste({target:page,clipboardData:{getData:type=>type==='text/html'?unsafeHtml:''},preventDefault(){prevented=true;}});
      assert(pasted===true&&prevented===true,'rich paste was not intercepted');
      assert(core.getState().text.includes('붙여넣기 안전 확인'),'sanitized paste text missing');
      assert(!page.querySelector('script,[onclick],[onerror]'),'unsafe paste attributes/script survived');
      assert(!page.querySelector('img[src^="http"]'),'remote pasted image survived');

      const templates=usability.templates();assert(templates.meeting&&templates.weekly&&templates.notice,'starter template catalog incomplete');
      document.body.dataset.documentZoom=String(zoom);
      document.body.dataset.documentTemplate=template.key;
      document.body.dataset.documentPaste=String(pasted);
      document.body.dataset.documentPastePrevented=String(prevented);
      document.body.dataset.documentTemplateCount=String(Object.keys(templates).length);
      document.body.dataset.documentUsabilityStage=usability.stage;
      pass('zoom, starter template and sanitized rich paste');
    }catch(error){fail(error)}
  })();
  </script>
</body>
</html>
