<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PDF editor runtime profile split smoke</title>
</head>
<body>
  <div class="app">
    <aside>
      <div class="sub">N-up · 소책자 · 페이지 편집 · 인쇄용 PDF 저장</div>
      <section class="sec" data-sec="nup">
        <div class="sec-head"><span class="sec-title">N-up 배치</span></div>
        <div class="sec-body" id="sb-nup">
          <label>기본 N-up (페이지당 슬라이드 수)</label>
          <div class="nup-grid" id="nupGrid">
            <button class="nup-btn active" data-nup="2">2장</button>
            <button class="nup-btn" data-nup="1">1장</button>
          </div>
          <div id="bookletRow"><input id="bookletCheck" type="checkbox" checked><span>소책자 배치</span></div>
        </div>
      </section>
      <div id="thumbArea"><div id="fileLayoutControl"><span>배치:</span><select><option>2장</option></select></div></div>
    </aside>
  </div>
  <pre id="result">RUNNING</pre>
  <script>
    (function(){
      const calls=[];
      window.__profileSplitCalls=calls;
      window.ProgramStudioPdfEditorRuntimeContext={
        load(id,src){
          calls.push({id,src});
          const realRuntime=id==='pdfEditorAdvancedProfileScopeScriptV1'||id==='pdfEditorAdvancedRuntimeScriptV1';
          if(realRuntime){
            return new Promise((resolve,reject)=>{
              let script=document.getElementById(id);
              if(script?.dataset.loaded==='true')return resolve(true);
              if(!script){script=document.createElement('script');script.id=id;script.src=src;}
              script.addEventListener('load',()=>{script.dataset.loaded='true';resolve(true);},{once:true});
              script.addEventListener('error',reject,{once:true});
              if(!script.isConnected)document.head.appendChild(script);
            });
          }
          return Promise.resolve(true);
        }
      };
    })();
  </script>
  <script src="/js/pdf-editor/core-runtime.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=message=>{
        document.documentElement.dataset.pdfEditorRuntimeProfileSplitSmoke='fail';
        result.textContent='FAIL: '+message;
        throw new Error(message);
      };
      const core=window.PdfEditorCoreRuntime;
      if(!core)return fail('core runtime missing');
      await core.loadAll();
      const baseCalls=window.__profileSplitCalls.slice();
      const advancedIds=[
        'pdfPreviewZoomPersistenceScriptV1','pdfNupInteractionStabilityScriptV1',
        'pdfNupPageAdjustScriptV1','pdfPageTransformEditScriptV1','pdfDragCropAutoFitScriptV1',
        'pdfNupDirectPreviewEditScriptV1','pdfEditorInteractionPolishScriptV1',
        'pdfOrientationScaleRegressionScriptV1','pdfPrecisionEditToolsScriptV1'
      ];
      if(document.documentElement.dataset.pdfEditorProfile!=='lightweight')return fail('default profile is not lightweight');
      if(baseCalls.some(call=>advancedIds.includes(call.id)||call.id==='pdfEditorAdvancedRuntimeScriptV1'||call.id==='pdfEditorAdvancedProfileScopeScriptV1'))return fail('advanced module loaded in default editor');
      if(baseCalls.filter(call=>String(call.id).startsWith('pdfEditor')&&call.id!=='pdfEditorAdvancedRuntimeScriptV1').length!==8)return fail('default core module count changed');

      history.replaceState({},'', '/pdf-editor?profile=advanced');
      delete document.documentElement.dataset.pdfEditorProfile;
      if(location.pathname!=='/pdf-editor')return fail('advanced profile left canonical PDF editor path');
      if(!core.isAdvancedProfile())return fail('advanced query profile not detected');
      await core.loadAll();
      const allCalls=window.__profileSplitCalls;
      if(!allCalls.some(call=>call.id==='pdfEditorAdvancedProfileScopeScriptV1'))return fail('advanced profile scope loader missing');
      if(!allCalls.some(call=>call.id==='pdfEditorAdvancedRuntimeScriptV1'))return fail('advanced runtime loader missing');
      for(const id of advancedIds){
        if(!allCalls.some(call=>call.id===id))return fail('advanced module missing: '+id);
      }
      if(document.documentElement.dataset.pdfAdvancedRuntime!=='1')return fail('advanced runtime did not finish');
      if(document.documentElement.dataset.pdfEditorProfile!=='advanced')return fail('advanced profile marker missing');
      if(document.documentElement.dataset.pdfEditorAdvancedScope!=='single-page-precision-v1')return fail('advanced single-page scope marker missing');
      if(document.getElementById('nupGrid').style.display!=='none')return fail('advanced N-up layout controls are still visible');
      if(document.getElementById('bookletRow').style.display!=='none')return fail('advanced booklet control is still visible');
      if(!document.getElementById('bookletCheck').disabled||document.getElementById('bookletCheck').checked)return fail('advanced booklet state was not disabled');
      if(document.getElementById('fileLayoutControl').style.display!=='none')return fail('advanced file-level N-up selector is still visible');
      if(!document.querySelector('[data-sec="nup"] .sec-title').textContent.includes('페이지 위치·크기 보정'))return fail('advanced precision section was not renamed');
      if(/N\s*-?\s*up|소책자/i.test(document.querySelector('.app > aside > .sub').textContent))return fail('advanced branding still advertises N-up/booklet');

      const cropPage={id:'crop-orientation-page',rotation:0,pageRotationLocked:false};
      window.parsedPages=[cropPage];
      let transformPatch=null;
      let selectedPage=null;
      let refreshCount=0;
      window.PdfPageTransformEdit={
        setValues(page,patch){
          transformPatch={...patch};
          if(Object.prototype.hasOwnProperty.call(patch,'rotationLocked'))page.pageRotationLocked=!!patch.rotationLocked;
          if(Object.prototype.hasOwnProperty.call(patch,'rotation'))page.rotation=Number(patch.rotation||0);
        }
      };
      window.PdfNupPageAdjust={
        selectPage(page){selectedPage=page;},
        refresh(){refreshCount+=1;}
      };
      document.dispatchEvent(new CustomEvent('pdf-drag-crop-autofit-applied',{detail:{pageId:cropPage.id}}));
      if(cropPage.rotation!==0)return fail('drag crop changed portrait rotation');
      if(!cropPage.pageRotationLocked)return fail('drag crop did not lock current orientation');
      if(transformPatch?.rotation!==undefined)return fail('drag crop rewrote explicit rotation');
      if(transformPatch?.rotationLocked!==true)return fail('drag crop orientation lock patch missing');
      if(selectedPage!==cropPage)return fail('drag crop page selection sync broke');
      if(refreshCount<1)return fail('drag crop did not refresh after orientation lock');
      if(!document.documentElement.dataset.pdfAdvancedDragCropOrientationLock)return fail('drag crop orientation lock marker missing');

      document.documentElement.dataset.pdfEditorRuntimeProfileSplitSmoke='pass';
      result.textContent='PASS: default PDF editor stays lightweight and advanced route loads editing modules separately; advanced editor hides N-up/booklet and preserves page orientation after drag crop';
    })().catch(error=>console.error(error));
  </script>
</body>
</html>
