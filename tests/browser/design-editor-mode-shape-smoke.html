<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Mode + Shape Smoke</title>
  <style>
    .hidden{display:none!important}body{font-family:Arial,sans-serif;margin:0;padding:12px}.sidebar{width:320px}.side-card{border:1px solid #ddd;padding:8px;margin:4px 0}#editorShell{display:grid;grid-template-columns:320px 1fr;gap:12px}#artboardViewport{width:900px;height:700px;overflow:auto}#artboard{position:relative;background:#fff}.design-object{position:absolute}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?browser-mode-shape-smoke=1&embed=1&mode=flyer&preset=flyer-a4');
    window.ProgramStudioBoot={reveal(){}};
    window.__modeShapeRuntimeResults=[];
    window.addEventListener('programstudio:runtime-script-result',event=>window.__modeShapeRuntimeResults.push(event.detail||{}));
  </script>
</head>
<body data-mode-shape-smoke-status="pending">
  <div id="modeShapeSmokeResult">PENDING</div>
  <div id="authLoading"></div><span id="navUserName"></span><button id="logoutBtn" type="button">logout</button>
  <main id="startScreen"><button id="resumeDraftBtn" class="hidden" type="button">resume</button><div id="presetGrid"></div><input id="customWidth" value="210"><input id="customHeight" value="297"><button id="customStartBtn" type="button">custom</button><button id="coverEditorBtn" type="button">cover</button></main>
  <main id="editorShell" class="hidden"><aside class="sidebar"><section class="side-card"><div id="documentTitle"></div><div id="documentMeta"></div><button id="newDesignBtn" type="button">new</button></section><section class="side-card"><button id="addTitleBtn" type="button">title</button><button id="addSubtitleBtn" type="button">subtitle</button><button id="addBodyBtn" type="button">body</button><button id="addInfoBtn" type="button">info</button></section><section id="inspector" class="side-card"></section><section class="side-card"><div id="layerList"></div></section></aside><section><div id="surfaceTabs"></div><div id="saveState"></div><div id="artboardViewport"><div id="artboard"></div></div><div class="editor-footer"><div id="editorStatus" class="editor-status"></div></div></section></main>
  <script src="/js/design-editor/presets.js?v=20260821-1"></script>
  <script src="/js/design-editor/app.js?v=20260821-1"></script>
  <script src="/js/sw-register.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('modeShapeSmokeResult');
      const fail=error=>{document.body.dataset.modeShapeSmokeStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.modeShapeSmokeStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40));}throw new Error('timeout: '+label);};
      const settle=()=>new Promise(resolve=>setTimeout(resolve,160));
      try{
        await waitFor(()=>window.DesignEditorApp,'DesignEditorApp');
        await waitFor(()=>window.DesignEditorPhase2,'DesignEditorPhase2');
        await waitFor(()=>window.DesignEditorOutput,'DesignEditorOutput');
        await waitFor(()=>window.DesignEditorEmbeddedPolish,'DesignEditorEmbeddedPolish');
        await waitFor(()=>window.DesignEditorOutput.renderSurface?.__shapeStrokeNoneGuard===true,'shape output guard');
        DesignEditorApp.startProject('flyer-a4');await settle();
        const project=DesignEditorApp.project;
        assert(project?.presetId==='flyer-a4','flyer project did not start');
        assert(DesignEditorEmbeddedPolish.supportsCapability('cover')===false,'flyer must not expose cover capability');
        assert(DesignEditorEmbeddedPolish.supportsCapability('fold')===false,'flyer must not expose fold-only capability');
        assert(DesignEditorEmbeddedPolish.supportsCapability('common')===true,'flyer lost common capability');

        const sidebar=document.querySelector('.sidebar');
        const fakeCover=document.createElement('section');fakeCover.id='smokeCoverOnly';fakeCover.dataset.designCapability='cover';sidebar.appendChild(fakeCover);
        const fakeFold=document.createElement('section');fakeFold.id='smokeFoldOnly';fakeFold.dataset.designCapability='fold';sidebar.appendChild(fakeFold);
        const fakeCommon=document.createElement('section');fakeCommon.id='smokeCommon';fakeCommon.dataset.designCapability='common';sidebar.appendChild(fakeCommon);
        DesignEditorEmbeddedPolish.syncCapabilityVisibility();
        assert(fakeCover.hidden===true&&fakeFold.hidden===true&&fakeCommon.hidden===false,'mode capability visibility is incorrect for flyer');
        assert(document.documentElement.dataset.activeDesignMode==='flyer','active design mode marker is incorrect');

        DesignEditorPhase2.addShape('rect');await settle();
        const surface=project.surfaces.find(item=>item.id===project.activeSurface)||project.surfaces[0];
        const rect=surface.extras.find(item=>item.type==='shape'&&item.shape==='rect');
        assert(rect,'rectangle was not added');
        await waitFor(()=>document.getElementById('designShapeStrokeMode'),'shape stroke mode control');
        const strokeMode=document.getElementById('designShapeStrokeMode');
        assert(strokeMode.value==='on','existing/new shape border must default to on');
        strokeMode.value='none';strokeMode.dispatchEvent(new Event('change',{bubbles:true}));
        await waitFor(()=>rect.strokeEnabled===false,'shape border none project state');
        await waitFor(()=>{
          const node=document.querySelector(`.phase2-extra-object[data-extra-id="${rect.id}"] .phase2-shape-inner`);
          return Boolean(node&&getComputedStyle(node).borderTopStyle==='none');
        },'borderless rectangle render');
        await waitFor(()=>document.querySelector('[data-extra-field="stroke"]')?.closest('.field')?.hidden===true&&document.querySelector('[data-extra-field="strokeWidth"]')?.closest('.field')?.hidden===true,'border controls hidden');
        assert(rect.strokeEnabled===false,'shape border none did not persist to project state');
        const rectNode=document.querySelector(`.phase2-extra-object[data-extra-id="${rect.id}"] .phase2-shape-inner`);
        assert(rectNode&&getComputedStyle(rectNode).borderTopStyle==='none','borderless rectangle still shows a CSS border');
        assert(document.querySelector('[data-extra-field="stroke"]')?.closest('.field')?.hidden===true,'border color control must hide when border is none');
        assert(document.querySelector('[data-extra-field="strokeWidth"]')?.closest('.field')?.hidden===true,'border width control must hide when border is none');

        const rendered=await DesignEditorOutput.renderSurface(project,surface);
        const ppm=300/25.4;
        const px=Math.max(0,Math.round((project.bleed+rect.x+.2)*ppm));
        const py=Math.max(0,Math.round((project.bleed+rect.y+rect.h/2)*ppm));
        const pixel=rendered.canvas.getContext('2d').getImageData(px,py,1,1).data;
        assert(pixel[0]>180&&pixel[1]>205&&pixel[2]>225,'300DPI render still contains dark border pixels after border none');
        rendered.canvas.width=1;rendered.canvas.height=1;

        DesignEditorPhase2.addShape('line');await settle();
        const line=surface.extras.find(item=>item.type==='shape'&&item.shape==='line');assert(line,'line was not added');
        DesignEditorEmbeddedPolish.syncShapeStrokeControls();
        assert(!document.getElementById('designShapeStrokeMode'),'line must not expose a border on/off control');
        const visibleStrokeFields=[...document.querySelectorAll('[data-extra-field="stroke"]')].filter(control=>!control.closest('.field')?.hidden);
        assert(visibleStrokeFields.length===1,'line inspector must show one line-color field without duplicate border color');

        document.body.dataset.modeShapeMode=document.documentElement.dataset.activeDesignMode;
        document.body.dataset.modeShapeCoverHidden=String(fakeCover.hidden);
        document.body.dataset.modeShapeFoldHidden=String(fakeFold.hidden);
        document.body.dataset.modeShapeStrokeNone=String(rect.strokeEnabled===false);
        document.body.dataset.modeShapeRenderedNoBorder='true';
        document.body.dataset.modeShapeLineStrokeFields=String(visibleStrokeFields.length);
        pass('mode-aware sidebar hides irrelevant options and borderless shapes match 300DPI output');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
