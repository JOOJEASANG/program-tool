<!doctype html>
<html lang="ko" data-program-manuals-smoke="pending">
<head><meta charset="utf-8"><title>Program manuals smoke</title></head>
<body>
  <div id="result">waiting</div>
  <div id="programGrid" hidden>
    <a class="prog-card" href="/print-checker/"><div class="card-footer"><span class="card-status-badge">바로 사용</span><span class="card-cta">시작하기 →</span></div></a>
    <a class="prog-card" href="/smart-print-layout/"><div class="card-footer"><span class="card-status-badge">바로 사용</span><span class="card-cta">시작하기 →</span></div></a>
    <a class="prog-card" href="/pdf-editor/"><div class="card-footer"><span class="card-status-badge">바로 사용</span><span class="card-cta">시작하기 →</span></div></a>
    <a class="prog-card" href="/pdf-editor-advanced"><div class="card-footer"><span class="card-status-badge">바로 사용</span><span class="card-cta">시작하기 →</span></div></a>
    <a class="prog-card" href="/pdf-suite/"><div class="card-footer"><span class="card-status-badge">바로 사용</span><span class="card-cta">시작하기 →</span></div></a>
  </div>
  <iframe id="manualFrame" src="/manuals/?program=smart-print-layout" style="width:1200px;height:800px;border:0"></iframe>
  <script>
    window.ProgramStudioHome = {
      PROGRAMS: [
        { id:'print-checker', name:'인쇄물 사전 검토' },
        { id:'smart-print-layout', name:'스마트 인쇄배치' },
        { id:'pdf-editor', name:'PDF배치' },
        { id:'pdf-editor-advanced', name:'PDF편집' },
        { id:'pdf-suite', name:'PDF 유틸리티' }
      ],
      get activeCategory(){ return 'all'; }
    };
  </script>
  <script src="/js/pdf-suite-home-launcher.js"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const result = document.getElementById('result');
      const frame = document.getElementById('manualFrame');
      const fail = message => {
        root.dataset.programManualsSmoke = 'fail';
        result.textContent = `FAIL: ${message}`;
      };
      const pass = message => {
        root.dataset.programManualsSmoke = 'pass';
        root.dataset.phase7Smoke = 'pass';
        result.textContent = `PASS: ${message}`;
      };
      const waitFor = async (fn, timeout = 6000) => {
        const started = Date.now();
        while (Date.now() - started < timeout) {
          try { if (fn()) return true; } catch (_) {}
          await new Promise(resolve => setTimeout(resolve, 50));
        }
        return false;
      };

      frame.addEventListener('load', async () => {
        try {
          const doc = frame.contentDocument;
          if (!doc) return fail('iframe document unavailable');
          if (!await waitFor(() => doc.getElementById('heroTitle')?.textContent === '스마트 인쇄배치')) return fail('smart layout manual did not render');
          if (doc.querySelector('[data-tab="demo"],#demoPanel,#demoStage')) return fail('removed demo UI is still present');
          if (doc.body.textContent.includes('자동 시연')) return fail('removed demo label is still visible');
          if (doc.querySelectorAll('#manualBody .pm-quick-step').length < 5) return fail('usage steps missing');
          if (doc.querySelectorAll('#manualBody .pm-section-card').length < 6) return fail('detailed manual sections missing');
          if (doc.querySelectorAll('#manualBody details').length < 4) return fail('troubleshooting content missing');

          const advancedButton = doc.querySelector('[data-program="pdf-editor-advanced"]');
          advancedButton?.click();
          if (!await waitFor(() => doc.getElementById('heroTitle')?.textContent === 'PDF편집')) return fail('program manual switching failed');
          if (!doc.getElementById('openProgram')?.getAttribute('href')?.includes('/pdf-editor-advanced/')) return fail('open program deep link incorrect');

          if (!await waitFor(() => document.querySelectorAll('[data-manual-program]').length === 5)) return fail('home card manual buttons missing');
          const modalButton = document.querySelector('[data-manual-program="smart-print-layout"]');
          modalButton?.click();
          if (!await waitFor(() => document.getElementById('programManualLayer')?.classList.contains('open'))) return fail('home manual layer did not open');
          if (!await waitFor(() => document.getElementById('programManualLayerTitle')?.textContent.includes('스마트 인쇄배치'))) return fail('home modal manual did not render');
          const modal = document.getElementById('programManualLayer');
          if (modal.textContent.includes('자동 시연')) return fail('home manual layer contains removed demo UI');
          if (modal.querySelectorAll('.ps-manual-detail').length < 6) return fail('home modal detailed sections missing');
          if (modal.querySelectorAll('.ps-manual-faq details').length < 4) return fail('home modal troubleshooting missing');
          pass('detailed manuals and lazy home-card modal are working without demo UI');
        } catch (error) {
          fail(error?.stack || error?.message || String(error));
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
