<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Smart print layout image input smoke</title></head>
<body>
  <section class="panel first-panel">
    <h2>PDF 파일</h2>
    <label id="uploadZone"><strong>PDF 올리기</strong><small>PDF only</small></label>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple>
    <div id="fileList"></div>
  </section>
  <section id="summaryCard"><div class="summary-empty">PDF를 올리면 자동 계산합니다.</div></section>
  <section id="canvasShell" class="canvas-shell">
    <canvas id="layoutCanvas"></canvas>
    <div id="emptyPreview"><strong>PDF를 올리면 바로 자동배치됩니다</strong><span>설명</span></div>
  </section>
  <div id="statusLine"></div>
  <script>
    const coreReceived=[];
    window.SmartPrintLayout={state:{busy:false,items:[]}};
    // Keep this smoke deterministic under headless virtual time. Production
    // decoder/encoder timeout and resource cleanup are covered separately.
    HTMLCanvasElement.prototype.toBlob=function(callback,type){
      callback(new Blob(['smoke-canvas'],{type:type||'image/png'}));
    };
    window.createImageBitmap=async function(){
      const canvas=document.createElement('canvas');canvas.width=300;canvas.height=600;
      const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,300,600);ctx.fillStyle='#155e75';ctx.fillRect(30,40,240,520);
      return canvas;
    };
    window.jspdf={jsPDF:class FakeJsPdf{
      constructor(options){this.options=options;this.images=[];}
      addImage(){this.images.push(Array.from(arguments));}
      output(kind){if(kind!=='blob')throw new Error('unexpected output kind');return new Blob(['%PDF-1.4\n% smart image smoke\n'],{type:'application/pdf'});}
    }};
    function renderCoreRows(){
      const list=document.getElementById('fileList');list.replaceChildren();
      window.SmartPrintLayout.state.items.forEach(item=>{
        const row=document.createElement('div');row.className='file-item';
        row.innerHTML='<div class="file-name"></div><div class="file-meta"></div><span class="side-pill">앞면</span>';
        row.querySelector('.file-name').textContent=item.name;
        row.querySelector('.file-meta').textContent='25.4 × 50.8mm · 1p · 수량 자동';
        list.appendChild(row);
      });
    }
    document.getElementById('fileInput').addEventListener('change',event=>{
      const files=Array.from(event.target.files||[]);
      coreReceived.push(...files);
      window.SmartPrintLayout.state.items=files.map(file=>({file,name:file.name,pageCount:1,widthMm:25.4,heightMm:50.8}));
      renderCoreRows();
      event.target.value='';
    });
  </script>
  <script src="/js/image-pdf-adapter.js?v=smoke"></script>
  <script src="/js/smart-print-layout/image-input-bridge.js?v=smoke"></script>
  <script src="/js/smart-print-layout/preview-upload.js?v=smoke"></script>
  <script>
    (async()=>{
      const fail=message=>{document.documentElement.dataset.smartPrintLayoutImageInputSmoke='fail';document.body.dataset.error=message;};
      try{
        await new Promise(r=>setTimeout(r,120));
        if(!window.ProgramImagePdfAdapter)throw new Error('adapter missing');
        if(!window.SmartPrintLayoutImageInput)throw new Error('smart bridge missing');
        if(!window.SmartPrintLayoutPreviewUpload)throw new Error('preview upload bridge missing');
        if(document.documentElement.dataset.smartPrintPreviewUpload!=='ready')throw new Error('preview upload bridge not bound');
        if(!document.getElementById('fileInput').accept.includes('image/webp'))throw new Error('image accept missing');
        if(!document.querySelector('.first-panel h2').textContent.includes('이미지'))throw new Error('heading not updated');
        if(!document.querySelector('#uploadZone strong').textContent.includes('이미지'))throw new Error('upload copy not updated');
        if(document.getElementById('emptyPreview').getAttribute('role')!=='button')throw new Error('empty preview upload accessibility missing');

        const canvas=document.createElement('canvas');canvas.width=300;canvas.height=600;
        const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,300,600);ctx.fillStyle='#155e75';ctx.fillRect(30,40,240,520);
        const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
        if(!png)throw new Error('sample png creation failed');
        const imageFile=new File([png],'photo.png',{type:'image/png',lastModified:123});
        const pdfFile=new File([new Blob(['%PDF-1.4\n'],{type:'application/pdf'})],'original.pdf',{type:'application/pdf',lastModified:456});

        const normalized=await window.SmartPrintLayoutImageInput.normalizeForSmart([pdfFile,imageFile]);
        if(normalized.length!==2)throw new Error('mixed normalize count mismatch');
        if(normalized[0]!==pdfFile)throw new Error('original PDF was unnecessarily replaced');
        if(normalized[1].type!=='application/pdf'||!normalized[1].name.endsWith('.pdf'))throw new Error('image did not normalize to PDF');
        if(normalized[1].__sourceType!=='image')throw new Error('image source marker missing');
        if(normalized[1].__displayName!=='photo.png')throw new Error('image original display name missing');
        if(Number(normalized[1].__imageMeta?.dpi)!==300)throw new Error('image dpi metadata missing');

        let rejectedMixed=false;
        try{
          await window.SmartPrintLayoutImageInput.normalizeForSmart([
            pdfFile,
            new File(['not-supported'],'notes.txt',{type:'text/plain'})
          ]);
        }catch(error){
          rejectedMixed=String(error?.message||error).includes('지원하지 않는 파일');
        }
        if(!rejectedMixed)throw new Error('unsupported mixed input was silently dropped');

        // Regression: dropping mixed PDF/image files on the preview canvas must
        // route through the same canonical file input path. The image must still
        // normalize to PDF before the legacy PDF-only core sees it.
        coreReceived.length=0;
        const dropTransfer=new DataTransfer();
        dropTransfer.items.add(pdfFile);
        dropTransfer.items.add(imageFile);
        const dropEvent=new Event('drop',{bubbles:true,cancelable:true});
        Object.defineProperty(dropEvent,'dataTransfer',{value:dropTransfer});
        document.getElementById('canvasShell').dispatchEvent(dropEvent);
        for(let i=0;i<100&&(coreReceived.length<2||window.SmartPrintLayoutImageInput.busy);i++)await new Promise(r=>setTimeout(r,20));
        if(coreReceived.length!==2)throw new Error(`preview canvas drop delivered ${coreReceived.length} files`);
        if(coreReceived.some(file=>file.type!=='application/pdf'))throw new Error('preview canvas drop leaked raw image into canonical core');
        if(document.documentElement.dataset.smartPrintImageImport!=='complete')throw new Error('preview canvas image normalization did not complete');

        coreReceived.length=0;
        const imported=await window.SmartPrintLayoutImageInput.importImages([pdfFile,imageFile]);
        if(!imported)throw new Error('bridge import failed');
        if(coreReceived.length!==2)throw new Error(`canonical app received ${coreReceived.length} files`);
        if(coreReceived.some(file=>file.type!=='application/pdf'))throw new Error('canonical smart app received non-PDF');
        const decorated=window.SmartPrintLayoutImageInput.syncImageLabels();
        if(decorated!==1)throw new Error(`expected one decorated image row, got ${decorated}`);
        const rows=document.querySelectorAll('#fileList .file-item');
        if(rows.length!==2)throw new Error('smart file rows missing');
        if(rows[0].querySelector('.file-name').textContent!=='original.pdf')throw new Error('PDF label was changed');
        if(rows[1].querySelector('.file-name').textContent!=='photo.png')throw new Error('image original filename not restored');
        if(rows[1].querySelector('.side-pill').textContent!=='이미지')throw new Error('image badge missing');
        if(!rows[1].querySelector('.file-meta').textContent.includes('이미지 300dpi'))throw new Error('image dpi label missing');
        if(window.SmartPrintLayout.state.items[1].sourceType!=='image')throw new Error('smart state image source metadata missing');
        if(document.documentElement.dataset.smartPrintImageImport!=='complete')throw new Error('completion marker missing');

        // Regression: while one image is still normalizing, a second raw image
        // must be intercepted by the bridge rather than leaking into the PDF-only core.
        const api=window.ProgramImagePdfAdapter;
        const originalNormalize=api.normalizeFile;
        let releaseSlow=null;
        api.normalizeFile=function(file,options){
          if(file.name!=='slow.png')return originalNormalize.call(api,file,options);
          return new Promise((resolve,reject)=>{
            releaseSlow=()=>originalNormalize.call(api,file,options).then(resolve,reject);
          });
        };
        try{
          const beforeBusyCount=coreReceived.length;
          const slowFile=new File([png],'slow.png',{type:'image/png',lastModified:789});
          const busyLeakFile=new File([png],'busy-leak.png',{type:'image/png',lastModified:790});
          const slowImport=window.SmartPrintLayoutImageInput.importImages([slowFile]);
          for(let i=0;i<40&&!releaseSlow;i++)await new Promise(r=>setTimeout(r,5));
          if(!releaseSlow||!window.SmartPrintLayoutImageInput.busy)throw new Error('busy regression setup failed');
          const transfer=new DataTransfer();transfer.items.add(busyLeakFile);
          const input=document.getElementById('fileInput');input.files=transfer.files;
          input.dispatchEvent(new Event('change',{bubbles:true}));
          await new Promise(r=>setTimeout(r,20));
          if(coreReceived.length!==beforeBusyCount)throw new Error('raw image leaked into canonical core while bridge was busy');
          if(!document.getElementById('statusLine').textContent.includes('현재 파일을 변환하는 중'))throw new Error('busy status was not shown');
          releaseSlow();
          if(!await slowImport)throw new Error('slow import did not recover');
          if(coreReceived.length!==beforeBusyCount+1)throw new Error('slow normalized PDF did not reach canonical core once');
          if(coreReceived.at(-1)?.type!=='application/pdf')throw new Error('slow raw image reached canonical core');
        }finally{
          api.normalizeFile=originalNormalize;
        }

        document.documentElement.dataset.smartPrintLayoutImageInputSmoke='pass';
      }catch(error){fail(error?.message||String(error));}
    })();
  </script>
</body>
</html>
