<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Leaflet2 Layout Smoke</title>
  <style>
    .hidden{display:none!important}body{font-family:Arial,sans-serif;margin:0;padding:12px}.sidebar{width:320px}.side-card{border:1px solid #ddd;padding:8px;margin:4px 0}#editorShell{display:grid;grid-template-columns:320px 1fr;gap:12px}#artboardViewport{width:1000px;height:650px;overflow:auto}#artboard{position:relative;background:#fff}.design-object{position:absolute}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?browser-leaflet2-layout-smoke=1&embed=1&mode=leaflet2&preset=leaflet-2&paper=a4&orientation=landscape&w=297&h=210');
    window.ProgramStudioBoot={reveal(){}};
  </script>
</head>
<body data-leaflet2-layout-status="pending">
  <div id="leaflet2LayoutResult">PENDING</div>
  <div id="authLoading"></div><span id="navUserName"></span><button id="logoutBtn" type="button">logout</button>
  <main id="startScreen"><button id="resumeDraftBtn" class="hidden" type="button">resume</button><div id="presetGrid"></div><input id="customWidth" value="210"><input id="customHeight" value="297"><button id="customStartBtn" type="button">custom</button><button id="coverEditorBtn" type="button">cover</button></main>
  <main id="editorShell" class="hidden">
    <aside class="sidebar">
      <section class="side-card"><div id="documentTitle"></div><div id="documentMeta"></div><button id="newDesignBtn" type="button">new</button></section>
      <section class="side-card"><button id="addTitleBtn" type="button">title</button><button id="addSubtitleBtn" type="button">subtitle</button><button id="addBodyBtn" type="button">body</button><button id="addInfoBtn" type="button">info</button></section>
      <section id="inspector" class="side-card"></section><section class="side-card"><div id="layerList"></div></section>
    </aside>
    <section><div id="surfaceTabs"></div><div id="saveState"></div><div id="artboardViewport"><div id="artboard"></div></div><div class="editor-footer"><div id="editorStatus" class="editor-status"></div></div></section>
  </main>
  <script src="/js/design-editor/presets.js?v=20260821-1"></script>
  <script src="/js/design-editor/app.js?v=20260821-1"></script>
  <script src="/js/sw-register.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('leaflet2LayoutResult');
      const fail=error=>{document.body.dataset.leaflet2LayoutStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.leaflet2LayoutStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=14000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,35));}throw new Error('timeout: '+label);};
      const settle=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      try{
        await waitFor(()=>window.DesignEditorApp?.project?.designMode==='leaflet2','leaflet2 project');
        await waitFor(()=>window.DesignEditorEmbeddedRuntime,'embedded runtime');
        await waitFor(()=>window.DesignEditorLeaflet2Layout&&document.documentElement.dataset.designLeaflet2LayoutReady==='1','leaflet2 layout module');
        await waitFor(()=>document.getElementById('designLeaflet2Layout'),'leaflet2 layout select');
        const app=window.DesignEditorApp,layout=window.DesignEditorLeaflet2Layout;
        let project=app.project,surface=project.surfaces.find(item=>item.id===project.activeSurface)||project.surfaces[0];
        project.showFolds=true;

        layout.applyGeometry('left-right',{persist:false,source:'browser-smoke-left-right'});
        await settle(120);
        project=app.project;surface=project.surfaces.find(item=>item.id===project.activeSurface)||project.surfaces[0];
        assert(project.leaflet2Layout==='left-right','left-right project layout marker missing');
        assert(surface.foldAxis==='x','left-right fold axis is not x');
        assert(surface.folds.length===1&&Math.abs(surface.folds[0]-148.5)<.01,'left-right fold is not at half width');
        assert(!surface.foldsY,'left-right layout unexpectedly kept horizontal folds');
        assert(document.getElementById('designLeaflet2Layout').value==='left-right','left-right select state missing');

        const select=document.getElementById('designLeaflet2Layout');select.value='top-bottom';select.dispatchEvent(new Event('change',{bubbles:true}));
        await waitFor(()=>app.project?.leaflet2Layout==='top-bottom','top-bottom project layout');
        await settle(180);
        project=app.project;surface=project.surfaces.find(item=>item.id===project.activeSurface)||project.surfaces[0];
        assert(surface.foldAxis==='y','top-bottom fold axis is not y');
        assert(Array.isArray(surface.folds)&&surface.folds.length===0,'top-bottom layout kept vertical folds');
        assert(surface.foldsY?.length===1&&Math.abs(surface.foldsY[0]-105)<.01,'top-bottom fold is not at half height');
        assert(surface.panels.join('|').includes('위')||surface.panels.join('|').includes('상단'),'top-bottom panel labels are not vertical');
        await waitFor(()=>document.querySelector('#artboard .leaflet2-horizontal-fold-guide'),'horizontal guide');
        const horizontal=document.querySelector('#artboard .leaflet2-horizontal-fold-guide');
        assert(horizontal&&getComputedStyle(horizontal).borderTopStyle==='dashed','horizontal fold guide was not rendered');
        assert(document.querySelectorAll('#artboard .leaflet2-horizontal-panel-label').length===2,'top-bottom panel labels were not rendered');
        assert(new URLSearchParams(location.search).get('leaflet2Layout')==='top-bottom','top-bottom layout was not reflected in history');

        surface.elements.push({id:'fold-text',type:'text',text:'접지선 확인',x:20,y:103,w:60,size:12,visible:true});
        const issues=layout.horizontalFoldIssues();
        assert(issues.some(item=>item.itemId==='fold-text'&&item.kind==='horizontal-fold'),'horizontal fold safety did not detect crossing text');
        assert(document.getElementById('designLeaflet2LayoutSafety')?.textContent.includes('확인 필요')||issues.length>0,'horizontal fold safety note missing');

        await waitFor(()=>window.DesignEditorProjectFile?.buildPortablePayload,'project file module');
        const portable=await window.DesignEditorProjectFile.buildPortablePayload(project);
        const savedSurface=portable.project.surfaces.find(item=>item.id===surface.id);
        assert(portable.project.leaflet2Layout==='top-bottom','portable project lost top-bottom layout');
        assert(savedSurface.foldAxis==='y'&&savedSurface.foldsY?.length===1,'portable project lost horizontal fold metadata');

        await waitFor(()=>window.DesignEditorFinalPrintCheck?.confirmBeforeOutput?.__leaflet2TopBottomGuard===true,'final print gate patch');

        document.body.dataset.leaflet2LeftRight='true';
        document.body.dataset.leaflet2TopBottom='true';
        document.body.dataset.leaflet2HorizontalGuide='true';
        document.body.dataset.leaflet2Safety='true';
        document.body.dataset.leaflet2Portable='true';
        document.body.dataset.leaflet2FinalGate='true';
        document.body.dataset.leaflet2LayoutStage=layout.stage;
        pass('leaflet2 left-right and top-bottom folds, guides, safety and project persistence');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
