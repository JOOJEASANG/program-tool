<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Image Workflow V2 Smoke</title><style>.workspace{display:grid;grid-template-columns:320px 1fr}.sidebar{display:flex;flex-direction:column;gap:8px}.tool-card{border:1px solid #ddd;padding:8px}</style><script>history.replaceState(null,'','/image-editor/index.html?workflow-v2-smoke=1');</script></head>
<body data-image-workflow-v2-smoke="pending">
<main class="workspace"><aside class="sidebar">
<section class="tool-card upload-card"><div class="tool-title">이미지</div><button id="openBtn">이미지 불러오기</button></section>
<section class="tool-card"><div class="tool-title">자르기</div><input id="cropX"><input id="cropY"><input id="cropW"><input id="cropH"></section>
<section class="tool-card"><div class="tool-title">회전 · 뒤집기</div></section>
<section class="tool-card"><div class="tool-title">크기 조절</div><input id="resizeW"><input id="resizeH"></section>
<section class="tool-card"><div class="tool-title">기본 보정</div></section>
<section class="tool-card"><div class="tool-title">흰색 · 단색 배경 제거</div></section>
<section class="tool-card export-card"><div class="tool-title">저장 설정</div><select id="exportFormat"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select><input id="exportQuality" value="92"><button id="exportSideBtn">편집 이미지 저장</button></section>
</aside><section><span id="statusText">이미지를 불러오면 편집을 시작할 수 있습니다.</span><span id="dimensionText">—</span><span id="fileMeta"></span><span id="historyInfoBadge">작업 0</span><button id="resetBtn">원본 복원</button></section></main>
<div id="result">PENDING</div>
<script>
let mock={loaded:false,width:0,height:0,historyLength:0};window.ImageEditorApp={getState:()=>mock};
document.getElementById('openBtn').addEventListener('click',()=>document.body.dataset.openClicked='true');document.getElementById('resetBtn').addEventListener('click',()=>document.body.dataset.resetClicked='true');
</script>
<script src="/js/image-editor/workflow-v2.js?v=smoke"></script>
<script>
(async()=>{const result=document.getElementById('result');const assert=(v,m)=>{if(!v)throw new Error(m)};const wait=async(p,l)=>{for(let i=0;i<120;i++){if(p())return;await new Promise(r=>setTimeout(r,20))}throw new Error('timeout: '+l)};try{
await wait(()=>window.ImageEditorWorkflowV2,'workflow');const panel=document.getElementById('imageEditorWorkflowV2');assert(panel,'panel missing');assert(panel.querySelectorAll('[data-image-step]').length===4,'four steps missing');assert(document.querySelector('.export-card').classList.contains('image-output-dock-v2'),'output dock missing');
mock={loaded:true,width:140,height:80,historyLength:2};document.getElementById('dimensionText').textContent='140 × 80 px';document.getElementById('historyInfoBadge').textContent='작업 2';window.ImageEditorWorkflowV2.refresh();assert(document.getElementById('imageOutputSummaryV2').classList.contains('ready'),'summary not ready');assert(document.getElementById('imageOutputSummaryV2').textContent.includes('140'),'dimensions missing');
let bubbled=0;document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z')bubbled++});document.getElementById('resizeW').dispatchEvent(new KeyboardEvent('keydown',{key:'z',ctrlKey:true,bubbles:true}));assert(bubbled===0,'editable Ctrl+Z escaped to image undo handler');
panel.querySelector('[data-image-step="output"]').click();assert(panel.querySelector('[data-image-step="output"]').classList.contains('active'),'output step not active');document.querySelector('[data-image-recovery="open"]').click();document.querySelector('[data-image-recovery="reset"]').click();assert(document.body.dataset.openClicked==='true','open button not reused');assert(document.body.dataset.resetClicked==='true','reset button not reused');
document.getElementById('statusText').dataset.type='error';document.getElementById('statusText').textContent='테스트 오류';window.ImageEditorWorkflowV2.refresh();assert(document.querySelector('.image-workflow-badge').classList.contains('warn'),'error not surfaced');
document.body.dataset.imageWorkflowV2Smoke='pass';result.textContent='PASS: image workflow v2, output summary, recovery and editable undo guard';
}catch(error){document.body.dataset.imageWorkflowV2Smoke='fail';result.textContent='FAIL: '+String(error.message||error)}})();
</script></body></html>
