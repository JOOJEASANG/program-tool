<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>PDF Utility Direct Tools Smoke</title></head>
<body data-pdf-utility-direct-tools-smoke="running">
  <div id="pdfUtilitySourceStore">
    <a class="tool available" href="/pdf-preflight/"><span class="tool-icon">🗜️</span><span class="tool-name">PDF 압축</span><span class="tool-desc">PDF 용량 줄이기</span></a>
    <a class="tool available" href="/pdf-preflight/"><span class="tool-icon">🖼️</span><span class="tool-name">이미지 → PDF</span><span class="tool-desc">이미지를 PDF로 변환</span></a>
    <a class="tool available" href="/pdf-preflight/"><span class="tool-icon">🗂️</span><span class="tool-name">시각적 페이지 정리</span><span class="tool-desc">페이지 순서·회전·제외</span></a>
  </div>
  <button type="button" data-pdfu-tool="compress"><span class="pdfu-menu-name">PDF 압축</span></button>
  <button type="button" data-pdfu-tool="images"><span class="pdfu-menu-name">이미지 → PDF</span></button>
  <button type="button" data-pdfu-tool="visual"><span class="pdfu-menu-name">시각적 페이지 정리</span></button>
  <div id="pdfUtilityStageTitle"></div><div id="pdfUtilityStageDesc"></div><span id="pdfUtilityStageBadge"></span><button id="pdfUtilityStageAction"></button><div id="pdfUtilityStageBody"></div>
  <div id="result">RUNNING</div>
  <script>window.auth={currentUser:{uid:'smoke-user',getIdToken:async()=> 'smoke-token'}};</script>
  <script src="/js/pdf-suite/direct-tool-bridge.js?v=smoke"></script>
  <script src="/js/pdf-suite/direct-tool-hook.js?v=smoke"></script>
  <script>
    (async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms)),result=document.getElementById('result');try{
      await wait(30);
      if(!window.ProgramStudioPdfUtilityDirectBridge?.handles('PDF 압축'))throw new Error('compression direct handler missing');
      document.querySelector('[data-pdfu-tool="compress"]').click();await wait(30);
      if(!document.querySelector('#pdfUtilityStageBody [data-pdfud-tool="PDF 압축"]'))throw new Error('compression did not open directly');
      if(document.querySelector('iframe'))throw new Error('legacy iframe opened for compression');
      if(!document.querySelector('[data-opt="quality"]'))throw new Error('compression options missing');
      window.auth.currentUser=null;
      document.querySelector('[data-pdfu-tool="images"]').click();await wait(30);
      if(!document.querySelector('#pdfUtilityStageBody [data-pdfud-tool="이미지 → PDF"]'))throw new Error('public image converter did not open directly');
      if(document.querySelector('iframe'))throw new Error('legacy iframe opened for image conversion');
      if(window.ProgramStudioPdfUtilityDirectBridge.requiresAuth('이미지 → PDF')!==false)throw new Error('local image conversion should not require auth');
      document.querySelector('[data-pdfu-tool="visual"]').click();await wait(30);
      if(!document.querySelector('#pdfUtilityStageBody [data-pdfud-tool="시각적 페이지 정리"]'))throw new Error('visual organizer did not open directly');
      if(window.ProgramStudioPdfUtilityDirectBridge.requiresAuth('시각적 페이지 정리')!==false)throw new Error('visual organizer should open locally');
      document.body.dataset.pdfUtilityDirectToolsSmoke='pass';result.textContent='PASS: PDF Utility menu opens exact workflows directly without a legacy intermediate page';
    }catch(error){document.body.dataset.pdfUtilityDirectToolsSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error);}})();
  </script>
</body></html>
