<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Typography Pro Smoke</title>
  <style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:10px}#artboard{position:relative;width:648px;height:909px;background:#fff}.design-object{position:absolute;padding:2px 3px}.design-text-inner{display:flex;width:100%;min-height:1.3em}.editable-text{display:block;flex:1;min-width:0}.field label{display:block}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?embed=1&typography-pro-smoke=1');
    const project={width:210,height:297,bleed:3,safe:6,activeSurface:'front',surfaces:[{id:'front',background:'#fff',elements:[{id:'title1',type:'text',role:'title',text:'정밀 편집 테스트',fontFamily:'Pretendard',size:28,weight:700,align:'left',color:'#172033',icon:'none',x:12,y:20,w:120,visible:true}],extras:[]}]};
    let saveCount=0,autoFitCount=0;
    window.DesignEditorApp={get project(){return project;}};
    window.DesignEditorDraftScope={saveCurrent(){saveCount+=1;return true;}};
    window.DesignEditorTextAutoFit={sync(){autoFitCount+=1;},stage:'smoke-auto-fit'};
  </script>
</head>
<body data-typography-pro-smoke="pending">
  <div id="result">PENDING</div>
  <div id="editorStatus"></div><div id="saveState"></div>
  <div id="inspector">
    <div class="field"><label>글꼴</label><select id="fontInput"><option value="Pretendard">Pretendard</option><option value="Arial">Arial</option></select></div>
    <div class="field-grid"><div class="field"><label>글자 크기 pt</label><input id="sizeInput" type="number" step="1" value="28"></div><div class="field"><label>굵기</label><select id="weightInput"><option value="400">보통</option><option value="500">중간</option><option value="700" selected>굵게</option><option value="800">더 굵게</option><option value="900">매우 굵게</option></select></div></div>
    <div class="field-grid"><div class="field"><label>색상</label><input id="colorInput" type="color" value="#172033"></div><div class="field"><label>글상자 폭 mm</label><input id="widthInput" type="number" value="120"></div></div>
  </div>
  <div id="artboard"><div class="design-object design-text selected" data-id="title1" style="left:45px;top:69px;width:360px;font-family:Pretendard;font-weight:700;font-size:39px"><div class="design-text-inner"><span class="editable-text">정밀 편집 테스트</span></div></div></div>
  <script src="/js/design-editor/typography-pro.js?v=20260827-1"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.typographyProSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
      const pass=message=>{document.body.dataset.typographyProSmoke='pass';result.textContent='PASS: '+message};
      const assert=(condition,message)=>{if(!condition)throw new Error(message)};
      const waitFor=async(predicate,label,timeout=8000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,35))}throw new Error('timeout: '+label)};
      const fire=(node,name)=>node.dispatchEvent(new Event(name,{bubbles:true}));
      try{
        await waitFor(()=>window.DesignEditorTypographyPro,'typography runtime');
        await waitFor(()=>document.getElementById('designTypographyProPanel'),'detail panel');
        const api=window.DesignEditorTypographyPro,item=project.surfaces[0].elements[0],node=document.querySelector('[data-id="title1"]'),editable=node.querySelector('.editable-text');
        assert(api.stage==='open-source-korean-fonts-and-print-safe-detailed-typography','runtime stage is wrong');
        assert(api.fonts.length>=10,'open font catalog is too small');
        const font=document.getElementById('fontInput');
        assert([...font.options].some(option=>option.value==='Noto Sans KR'),'Noto Sans KR missing');
        assert([...font.options].some(option=>option.value==='Noto Serif KR'),'Noto Serif KR missing');
        assert([...font.options].some(option=>option.value==='Nanum Gothic'),'Nanum Gothic missing');
        assert([...font.options].some(option=>option.value==='Black Han Sans'),'Black Han Sans missing');
        assert(document.getElementById('designTypographyLicenseNote').textContent.includes('무료·상업용'),'license note missing');
        assert(document.getElementById('designEditorOpenFontStylesheet').href.includes('fonts.googleapis.com'),'Google Fonts stylesheet missing');
        assert(document.getElementById('sizeInput').step==='0.5','fine font-size step missing');
        assert(document.querySelector('#weightInput option[value="300"]'),'light weight option missing');

        font.value='Noto Serif KR';fire(font,'change');
        await waitFor(()=>item.fontFamily==='Noto Serif KR','font family update');
        assert(document.getElementById('designTypographyFontPreview').style.fontFamily.includes('Noto Serif KR'),'font preview did not change');

        const letter=document.getElementById('typographyLetterSpacing'),line=document.getElementById('typographyLineHeight'),x=document.getElementById('typographyX'),y=document.getElementById('typographyY');
        letter.value='1.2';fire(letter,'input');line.value='1.6';fire(line,'input');x.value='25';fire(x,'input');y.value='40';fire(y,'input');
        const titleStyle=document.getElementById('typographyTitleStyle'),accent=document.getElementById('typographyTitleAccent');
        titleStyle.value='highlight';fire(titleStyle,'change');accent.value='#ff0066';fire(accent,'input');
        await waitFor(()=>item.letterSpacing===1.2&&item.lineHeight===1.6&&item.x===25&&item.y===40&&item.titleStyle==='highlight'&&item.titleAccent==='#ff0066','detail values update');
        assert(Math.abs(parseFloat(editable.style.letterSpacing)-3.6)<.15,'letter-spacing preview is wrong');
        assert(node.style.lineHeight==='1.6','line-height preview is wrong');
        assert(Math.abs(parseFloat(node.style.left)-84)<.2,'x position preview does not include bleed');
        assert(Math.abs(parseFloat(node.style.top)-129)<.2,'y position preview does not include bleed');
        assert(node.classList.contains('typography-title-highlight'),'title style preview missing');
        assert(node.style.getPropertyValue('--title-accent')==='#ff0066','title accent preview missing');
        await waitFor(()=>saveCount>0,'draft save');
        await waitFor(()=>autoFitCount>0,'auto-fit resync');

        document.getElementById('typographyReset').click();
        await waitFor(()=>item.letterSpacing===0&&item.lineHeight===1.26&&item.titleStyle==='none','detail reset');
        document.body.dataset.font=item.fontFamily;
        document.body.dataset.letterSpacing=String(item.letterSpacing);
        document.body.dataset.lineHeight=String(item.lineHeight);
        document.body.dataset.saveCount=String(saveCount);
        document.body.dataset.autoFitCount=String(autoFitCount);
        document.body.dataset.typographyStage=api.stage;
        pass('open-source font catalog, license guidance, fine typography, precise positioning and print-safe title styling');
      }catch(error){fail(error)}
    })();
  </script>
</body>
</html>
