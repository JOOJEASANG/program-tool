<!doctype html>
<html lang="ko">
<head><script data-program-studio-boot-guard src="/js/app-boot-guard.js?v=2026.09.02.003"></script>
  <meta charset="utf-8">
  <title>Design Editor Browser Smoke</title>
  <style>
    .hidden{display:none!important}
    body{font-family:Arial,sans-serif;margin:0;padding:12px}
    .sidebar{width:320px}
    .side-card{border:1px solid #ddd;padding:8px;margin:4px 0}
    #editorShell{display:grid;grid-template-columns:320px 1fr;gap:12px}
    #artboardViewport{width:900px;height:700px;overflow:auto}
    #artboard{position:relative;background:#fff}
    .design-object{position:absolute}
    .editor-status{font-size:12px}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?browser-smoke=1&embed=1');
    window.ProgramStudioBoot={reveal(){}};
    window.__browserSmokeRuntimeResults=[];
    window.addEventListener('programstudio:runtime-script-result',event=>{
      window.__browserSmokeRuntimeResults.push(event.detail||{});
    });
  </script>
</head>
<body data-smoke-status="pending">
  <div id="smokeResult">PENDING</div>
  <div id="authLoading"></div>
  <span id="navUserName"></span>
  <button id="logoutBtn" type="button">logout</button>

  <main id="startScreen">
    <button id="resumeDraftBtn" class="hidden" type="button">resume</button>
    <div id="presetGrid"></div>
    <input id="customWidth" value="210">
    <input id="customHeight" value="297">
    <button id="customStartBtn" type="button">custom</button>
    <button id="coverEditorBtn" type="button">cover</button>
  </main>

  <main id="editorShell" class="hidden">
    <aside class="sidebar">
      <section class="side-card">
        <div id="documentTitle"></div>
        <div id="documentMeta"></div>
        <button id="newDesignBtn" type="button">new</button>
      </section>
      <section class="side-card">
        <button id="addTitleBtn" type="button">title</button>
        <button id="addSubtitleBtn" type="button">subtitle</button>
        <button id="addBodyBtn" type="button">body</button>
        <button id="addInfoBtn" type="button">info</button>
      </section>
      <section id="inspector" class="side-card"></section>
      <section class="side-card"><div id="layerList"></div></section>
    </aside>
    <section>
      <div id="surfaceTabs"></div>
      <div id="saveState"></div>
      <div id="artboardViewport"><div id="artboard"></div></div>
      <div class="editor-footer"><div id="editorStatus" class="editor-status"></div></div>
    </section>
  </main>

  <script src="/js/design-editor/presets.js?v=20260821-1"></script>
  <script src="/js/design-editor/app.js?v=20260821-1"></script>
  <script src="/js/sw-register.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('smokeResult');
      const fail=error=>{
        document.body.dataset.smokeStatus='fail';
        result.textContent='FAIL: '+String(error?.stack||error?.message||error);
      };
      const pass=message=>{
        document.body.dataset.smokeStatus='pass';
        result.textContent='PASS: '+message;
      };
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=10000)=>{
        const started=Date.now();
        while(Date.now()-started<timeout){
          if(predicate())return;
          await new Promise(resolve=>setTimeout(resolve,40));
        }
        throw new Error('timeout: '+label);
      };
      const settle=()=>new Promise(resolve=>setTimeout(resolve,40));
      const runtimeResultsForManifest=()=>{
        const manifest=Array.isArray(window.ProgramStudioDesignEditorRuntimeManifest)?window.ProgramStudioDesignEditorRuntimeManifest:[];
        const ids=new Set(manifest.map(entry=>entry.id));
        const latest=new Map();
        (window.__browserSmokeRuntimeResults||[]).forEach(entry=>{if(ids.has(entry?.id))latest.set(entry.id,entry);});
        return{manifest,latest};
      };

      try{
        await waitFor(()=>window.DesignEditorApp,'DesignEditorApp');
        await waitFor(()=>Array.isArray(window.ProgramStudioDesignEditorRuntimeManifest),'runtime manifest');
        await waitFor(()=>{
          const {manifest,latest}=runtimeResultsForManifest();
          return manifest.length>0&&latest.size===manifest.length;
        },'all runtime manifest results');

        const runtimeBoot=runtimeResultsForManifest();
        assert(runtimeBoot.manifest.length===32,'runtime manifest size changed without updating browser smoke contract');
        runtimeBoot.manifest.forEach(entry=>{
          const event=runtimeBoot.latest.get(entry.id);
          assert(event?.status==='loaded',`runtime module failed: ${entry.id} (${event?.status||'missing-result'})`);
          const node=document.getElementById(entry.id);
          assert(node?.dataset?.loaded==='true',`runtime script was not marked loaded: ${entry.id}`);
          assert(!node?.dataset?.failed,`runtime script has failure marker: ${entry.id}`);
        });
        document.body.dataset.runtimeExpected=String(runtimeBoot.manifest.length);
        document.body.dataset.runtimeLoaded=String([...runtimeBoot.latest.values()].filter(entry=>entry.status==='loaded').length);

        await waitFor(()=>window.DesignEditorRuntimeDiagnostics,'DesignEditorRuntimeDiagnostics');
        await waitFor(()=>window.DesignEditorOutput,'DesignEditorOutput');
        await waitFor(()=>window.DesignEditorSimpleInterface,'DesignEditorSimpleInterface');
        await waitFor(()=>window.DesignEditorFinalPrintCheck,'DesignEditorFinalPrintCheck');
        await waitFor(()=>window.DesignEditorEmbeddedPolish,'DesignEditorEmbeddedPolish');
        assert(window.DesignEditorCoverModel,'cover model runtime module did not load');

        assert(DesignEditorPresets.get('flyer-a4')?.surfaces?.length===2,'flyer-a4 preset must keep two surfaces');
        DesignEditorApp.startProject('flyer-a4');
        await settle();

        const project=DesignEditorApp.project;
        assert(project?.width===210&&project?.height===297,'A4 project dimensions changed');
        assert(project?.bleed===3,'A4 bleed changed');
        assert(project?.surfaces?.length===2,'A4 flyer surface count changed');
        assert(!document.getElementById('editorShell').classList.contains('hidden'),'editor shell did not open');
        assert(document.querySelectorAll('.surface-tab').length===2,'surface tabs were not rendered');
        await waitFor(()=>document.querySelector('.sidebar')?.firstElementChild?.id==='designEmbeddedModeCard','design mode selector pinned first');
        const modeCard=document.getElementById('designEmbeddedModeCard');
        assert(modeCard&&getComputedStyle(modeCard).position==='sticky','design mode selector is not sticky at sidebar top');
        assert(document.querySelector('.sidebar')?.dataset?.designModeCardPinned==='top','sidebar did not record top-pinned mode selector');

        document.getElementById('addTitleBtn').click();
        await settle();
        assert(project.surfaces[0].elements.length===1,'title button did not add an element');
        assert(document.querySelectorAll('.design-object').length===1,'title was not rendered on artboard');

        const textInput=document.getElementById('textContentInput');
        assert(textInput,'selected text inspector did not render');
        textInput.value='브라우저 자동검증 제목';
        textInput.dispatchEvent(new Event('input',{bubbles:true}));
        await settle();
        assert(project.surfaces[0].elements[0].text==='브라우저 자동검증 제목','text edit did not update project state');
        assert(document.querySelector('.design-object')?.textContent.includes('브라우저 자동검증 제목'),'text edit did not rerender artboard');

        const titleNode=document.querySelector('.design-text.selected');
        assert(titleNode,'selected title node is missing for mouse interaction smoke');
        titleNode.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,button:2,clientX:240,clientY:220,view:window}));
        await settle();
        const mouseMenu=document.getElementById('designEditorMouseContextMenu');
        assert(mouseMenu&&!mouseMenu.hidden,'right-click context menu did not open');
        assert(mouseMenu.textContent.includes('복제')&&mouseMenu.textContent.includes('삭제'),'right-click selected-element actions are incomplete');
        const titleBeforeWheel=project.surfaces[0].elements[0];
        const sizeBeforeWheel=Number(titleBeforeWheel.size),yBeforeWheel=Number(titleBeforeWheel.y);
        titleNode.dispatchEvent(new WheelEvent('wheel',{bubbles:true,cancelable:true,ctrlKey:true,deltaY:-100}));
        await settle();
        assert(Number(titleBeforeWheel.size)===sizeBeforeWheel+1,'Ctrl+wheel did not increase selected text size');
        document.querySelector('.design-text.selected')?.dispatchEvent(new WheelEvent('wheel',{bubbles:true,cancelable:true,altKey:true,deltaY:100}));
        await settle();
        assert(Number(titleBeforeWheel.y)>yBeforeWheel,'Alt+wheel did not nudge selected element');
        document.body.dataset.modeSelectorTop=String(document.querySelector('.sidebar')?.firstElementChild?.id==='designEmbeddedModeCard');
        document.body.dataset.mouseContext='selected';
        document.body.dataset.mouseWheel='scale-nudge';

        const tabs=[...document.querySelectorAll('.surface-tab')];
        tabs[1].click();
        await settle();
        assert(project.activeSurface==='back','second surface did not become active');
        document.getElementById('addBodyBtn').click();
        await settle();
        assert(project.surfaces[1].elements.length===1,'second surface edit failed');

        const spec=DesignEditorOutput.expectedOutputSpec(project);
        assert(spec.dpi===300,'output DPI changed');
        assert(spec.surfaceCount===2,'output surface count changed');
        assert(spec.widthMm===216&&spec.heightMm===303,'bleed geometry changed');
        assert(spec.widthPx===2551&&spec.heightPx===3579,'300DPI pixel geometry changed');

        const frontSurface=project.surfaces[0];
        const actualRendered=await DesignEditorOutput.renderSurface(project,frontSurface);
        assert(DesignEditorOutput.verifyRenderedSurface(actualRendered,spec)===true,'real 300DPI surface render failed verification');
        document.body.dataset.renderedWidth=String(actualRendered.canvas.width);
        document.body.dataset.renderedHeight=String(actualRendered.canvas.height);

        const frontText=frontSurface.elements[0];
        const pxPerMm=spec.dpi/25.4;
        const fontPx=Math.max(1,(Number(frontText.size)||24)*spec.dpi/72);
        const sampleX=Math.max(0,Math.floor((Number(frontText.x)+Number(project.bleed||0))*pxPerMm));
        const sampleY=Math.max(0,Math.floor((Number(frontText.y)+Number(project.bleed||0))*pxPerMm-fontPx*1.5));
        const sampleW=Math.max(1,Math.min(actualRendered.canvas.width-sampleX,Math.ceil((Number(frontText.width)||100)*pxPerMm)));
        const sampleH=Math.max(1,Math.min(actualRendered.canvas.height-sampleY,Math.ceil(fontPx*3)));
        const pixels=actualRendered.canvas.getContext('2d').getImageData(sampleX,sampleY,sampleW,sampleH).data;
        let hasInk=false;
        for(let index=0;index<pixels.length;index+=16){
          if(pixels[index]<245||pixels[index+1]<245||pixels[index+2]<245){hasInk=true;break;}
        }
        assert(hasInk,'real 300DPI render did not contain expected text pixels');
        actualRendered.canvas.width=1;
        actualRendered.canvas.height=1;

        assert(DesignEditorOutput.verifyRenderedSurface({canvas:{width:2551,height:3579},totalW:216,totalH:303},spec)===true,'valid rendered surface was rejected');
        let rejected=false;
        try{
          DesignEditorOutput.verifyRenderedSurface({canvas:{width:2550,height:3579},totalW:216,totalH:303},spec);
        }catch(error){
          rejected=error?.code==='OUTPUT_VERIFICATION_FAILED';
        }
        assert(rejected,'invalid rendered surface did not fail closed');

        const finalCheck=window.DesignEditorFinalPrintCheck;
        assert(finalCheck?.confirmBeforeOutput,'final print gate is unavailable');
        const originalGate=finalCheck.confirmBeforeOutput;
        const originalAnchorClick=HTMLAnchorElement.prototype.click;
        let gateFormat='';
        let capturedDownload=null;
        finalCheck.confirmBeforeOutput=async options=>{gateFormat=String(options?.format||'');return true;};
        HTMLAnchorElement.prototype.click=function(){capturedDownload={href:this.href,download:this.download};};
        try{
          await DesignEditorOutput.exportPng();
        }finally{
          finalCheck.confirmBeforeOutput=originalGate;
          HTMLAnchorElement.prototype.click=originalAnchorClick;
        }
        assert(gateFormat==='png','PNG export did not pass through the final print gate');
        assert(capturedDownload?.href?.startsWith('data:image/png;base64,'),'PNG export did not produce a PNG data URL');
        assert(capturedDownload?.download?.endsWith('_300dpi.png'),'PNG export filename lost the 300dpi suffix');
        const pngBase64=capturedDownload.href.split(',',2)[1];
        const pngHeader=Uint8Array.from(atob(pngBase64.slice(0,48)),char=>char.charCodeAt(0));
        assert(pngHeader.length>=24,'PNG header is too short');
        assert([137,80,78,71,13,10,26,10].every((value,index)=>pngHeader[index]===value),'PNG file signature is invalid');
        const pngView=new DataView(pngHeader.buffer,pngHeader.byteOffset,pngHeader.byteLength);
        const pngWidth=pngView.getUint32(16);
        const pngHeight=pngView.getUint32(20);
        assert(pngWidth===spec.widthPx&&pngHeight===spec.heightPx,`PNG IHDR dimensions changed: ${pngWidth}×${pngHeight}`);
        assert(capturedDownload.href.length>1000,'PNG export payload is unexpectedly small');
        assert(document.getElementById('editorStatus')?.textContent.includes('검증 후 만들었습니다'),'PNG success status was not shown');
        document.body.dataset.exportedPngWidth=String(pngWidth);
        document.body.dataset.exportedPngHeight=String(pngHeight);
        document.body.dataset.exportedPngGate=gateFormat;
        capturedDownload.href='';

        DesignEditorSimpleInterface.sync();
        assert(document.getElementById('designOutputTools'),'output card was not installed in real browser DOM');
        assert(DesignEditorSimpleInterface.stage==='basic-first-contextual-sidebar','simple interface module did not boot');
        assert(DesignEditorOutput.stage==='selectable-standard-lossless-300dpi-pdf-output-with-postrender-verification','output module stage mismatch');

        const health=DesignEditorRuntimeDiagnostics.audit();
        assert(health.ok===true,`runtime diagnostics reported issues: ${(health.issues||[]).join(' | ')}`);
        assert(health.runtime.expected===runtimeBoot.manifest.length,'diagnostics expected runtime count mismatch');
        assert(health.runtime.loaded===runtimeBoot.manifest.length,'diagnostics loaded runtime count mismatch');
        assert(health.runtime.failed===0,'diagnostics reported failed runtime modules');
        assert(health.runtime.missing===0,'diagnostics reported missing runtime modules');
        assert(health.storage.localStorage===true,'localStorage diagnostics failed');
        assert(health.storage.indexedDB===true,'IndexedDB diagnostics failed');
        assert(health.project.ready===true&&health.project.activeSurfaceExists===true,'project diagnostics failed');

        const report=DesignEditorRuntimeDiagnostics.report();
        const fatalTypes=new Set(['error','rejection','resource-error','runtime-error','runtime-timeout']);
        const fatalRecords=(report.records||[]).filter(entry=>fatalTypes.has(entry.type));
        assert(fatalRecords.length===0,`runtime error records found: ${fatalRecords.map(entry=>entry.type+':'+entry.message).join(' | ')}`);

        pass('core edit, two-surface flow, real 300DPI render, real PNG export, fail-closed verification, full runtime manifest');
      }catch(error){
        fail(error);
      }
    })();
  </script>
</body>
</html>
