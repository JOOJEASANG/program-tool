<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Context Workspace Smoke</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}.hidden{display:none!important}#editorShell{position:relative;display:grid;grid-template-columns:300px 1fr 306px;height:760px}.sidebar,.properties-panel{padding:10px}.side-card{border:1px solid #ddd;padding:9px;margin-bottom:7px}.editor-main{min-width:0}.editor-toolbar{height:48px}.artboard-viewport{width:900px;height:600px;display:flex;align-items:center;justify-content:center}.artboard{position:relative;width:606px;height:432px;background:#fff}.fold-guide{position:absolute}.panel-guide-label{position:absolute}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?embed=1&mode=invitation&preset=invitation-a4');
    document.documentElement.dataset.programSurface='design-editor';
    document.documentElement.dataset.designDocumentType='invitation';
    try{localStorage.removeItem('programTool.designEditor.contextPane.v1')}catch(_){}
  </script>
</head>
<body data-essential-workspace-status="pending">
  <div id="result">PENDING</div>
  <main id="editorShell">
    <aside class="sidebar" aria-label="디자인 제작 도구">
      <section id="documentCard" class="side-card"><div class="document-head"><div class="document-title">초대장</div></div></section>
      <section id="designEmbeddedModeCard" class="side-card">
        <div class="side-label">작업 종류</div>
        <div class="design-mode-options">
          <div class="design-product-two"><div class="design-product-field"><select id="designProductAxis"><option value="x">세로 접기</option></select></div><div class="design-product-field"><input id="designProductFoldPosition" value="148.5"></div></div>
          <button id="designProductCenterFold" type="button">정중앙</button>
          <div class="design-product-field"><select id="designProductFlip"><option value="none">없음</option></select></div>
          <p class="design-product-note">기존 접지 안내</p>
          <button class="design-product-apply" type="button">적용</button>
        </div>
      </section>
      <section id="contentCard" class="side-card"><div class="side-label">내용 추가</div><button>제목</button></section>
      <section id="designCoverSettingsTools" class="side-card"><div class="side-label">표지 규격 · 책등</div></section>
      <section id="designCoverSpineTools" class="side-card"><div class="side-label">책등 도구</div></section>
      <section id="designFinalPrintCheckTools" class="side-card"><div class="side-label">최종 인쇄 검사</div></section>
      <section id="designPrintQualityTools" class="side-card"><div class="side-label">이미지 품질 내부 상태</div></section>
      <section id="designPrintSafetyTools" class="side-card"><div class="side-label">인쇄 안전 내부 상태</div></section>
      <section id="designOutputTools" class="side-card"><div class="side-label">출력</div></section>
      <section id="designQuickDesignTools" class="side-card"><div class="side-label">빠른 꾸미기</div></section>
    </aside>
    <section class="editor-main"><div class="editor-toolbar"></div><div id="designProfessionalWorkflow">작업 순서</div><div id="artboardViewport" class="artboard-viewport"><div id="artboard" class="artboard"></div></div></section>
    <aside id="propertiesPanel" class="properties-panel">
      <section id="inspector" class="side-card"><div class="inspector-title">선택 속성</div><div class="prop-grid"><button>위치</button><button>크기</button></div></section>
      <section class="side-card"><div class="side-label">레이어</div><div id="layerList"></div><button>앞으로</button></section>
    </aside>
  </main>
  <script>
    const project={
      documentType:'invitation',designMode:'invitation',printProductMode:'invitation',presetId:'invitation-a4',width:297,height:210,bleed:3,safe:8,showGuides:true,showFolds:true,activeSurface:'outside',printProductFold:'custom',printProductAxis:'x',printProductFoldPosition:148.5,foldType:'leaflet-2-left-right',
      surfaces:[{id:'outside',label:'바깥면',foldAxis:'x',folds:[148.5],foldsY:[],panels:['뒷면','앞면'],elements:[],extras:[]}]
    };
    window.DesignEditorApp={project};
    window.DesignEditorWorkflowV2={activateStep(){}};
  </script>
  <script src="/js/design-editor/essential-workspace.js?v=20260901-2"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.essentialWorkspaceStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
      const pass=message=>{document.body.dataset.essentialWorkspaceStatus='pass';result.textContent='PASS: '+message};
      const assert=(condition,message)=>{if(!condition)throw new Error(message)};
      const waitFor=async(predicate,label,timeout=8000)=>{const start=Date.now();while(Date.now()-start<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,30))}throw new Error('timeout: '+label)};
      const settle=(ms=180)=>new Promise(resolve=>setTimeout(resolve,ms));
      const visible=id=>{const node=document.getElementById(id);return Boolean(node)&&!node.hidden&&getComputedStyle(node).display!=='none'};
      try{
        await waitFor(()=>window.DesignEditorEssentialWorkspace?.stage==='context-pane-product-aware-workspace-v3','context essential workspace');
        await waitFor(()=>document.querySelector('.design-flat-panel'),'product sidebar panel');
        await settle();

        const panel=document.querySelector('.design-flat-panel');
        const properties=document.getElementById('propertiesPanel');
        const inspector=document.getElementById('inspector');
        const layer=document.getElementById('designLayerTools');
        assert(!document.querySelector('.design-essential-rail'),'step rail must stay removed');
        assert(!document.getElementById('designProfessionalWorkflow'),'preview workflow bar must be removed');
        assert(properties.hidden===false,'right context panel must be restored');
        assert(Boolean(document.getElementById('designContextPaneChrome')),'right context chrome missing');
        assert(inspector.parentElement===properties,'inspector must stay in right context pane');
        assert(layer&&layer.parentElement===properties,'layer card must stay in right context pane');
        assert(!panel.contains(inspector)&&!panel.contains(layer),'context tools must not be mixed into product sidebar');
        assert(document.documentElement.dataset.designContextPaneOpen==='false','context pane must start collapsed for canvas priority');
        const collapsedWidth=Math.round(properties.getBoundingClientRect().width);
        assert(collapsedWidth===52,'collapsed context rail should be 52px');
        const firstColumn=parseFloat(getComputedStyle(document.getElementById('editorShell')).gridTemplateColumns.split(' ')[0]);
        assert(firstColumn<=268.5,'product sidebar must be narrower than legacy 320px workspace');
        assert(visible('documentCard')&&visible('contentCard')&&visible('designOutputTools')&&visible('designQuickDesignTools'),'product tools must stay in the left sidebar');
        assert(!visible('designPrintQualityTools')&&!visible('designPrintSafetyTools'),'internal status cards must remain hidden');
        assert(!visible('designCoverSettingsTools')&&!visible('designCoverSpineTools'),'invitation must hide cover-only settings');
        assert(!document.getElementById('designProductAxis')&&!document.getElementById('designProductFoldPosition')&&!document.getElementById('designProductCenterFold')&&!document.getElementById('designProductFlip'),'invitation fold controls must be removed');
        assert(project.surfaces[0].folds.length===0&&!project.surfaces[0].foldAxis&&project.surfaces[0].panels.length===0,'invitation fold geometry must be cleared');
        assert(!Object.prototype.hasOwnProperty.call(project,'printProductFold')&&!Object.prototype.hasOwnProperty.call(project,'printProductAxis'),'invitation project fold metadata must be cleared');

        window.DesignEditorEssentialWorkspace.select('edit',false);
        await waitFor(()=>document.documentElement.dataset.designContextPaneOpen==='true'&&document.documentElement.dataset.designContextTab==='properties','property context open');
        assert(visible('inspector'),'property tab must reveal inspector');
        await waitFor(()=>properties.getBoundingClientRect().width>=278,'context pane expansion transition');
        const expandedWidth=Math.round(properties.getBoundingClientRect().width);
        assert(expandedWidth>=278&&expandedWidth>collapsedWidth+200,'open context pane should expand substantially for inspector content');
        document.body.dataset.essentialContextExpandedWidth=String(expandedWidth);
        window.DesignEditorEssentialWorkspace.select('arrange',false);
        await waitFor(()=>document.documentElement.dataset.designContextTab==='layers','layer context open');
        assert(visible('designLayerTools')&&!visible('inspector'),'layer tab must exclusively reveal layers');
        window.DesignEditorEssentialWorkspace.select('start',false);
        await waitFor(()=>document.documentElement.dataset.designContextPaneOpen==='false','context closes for setup');
        await waitFor(()=>properties.getBoundingClientRect().width<=53,'context pane collapse transition');

        document.body.dataset.essentialContextPane='pass';
        document.body.dataset.essentialCanvasPriority='pass';
        document.body.dataset.essentialInvitationNoFold='true';
        document.body.dataset.essentialInvitationCoverHidden='true';

        project.documentType='cover';project.designMode='cover';delete project.printProductMode;project.presetId='cover-a4';project.width=428;project.height=297;project.bleed=3;project.cover={trimWidth:210,trimHeight:297,spine:8};project.surfaces[0].folds=[];project.surfaces[0].panels=[];
        document.documentElement.dataset.designDocumentType='cover';
        window.dispatchEvent(new CustomEvent('programstudio:document-type-change',{detail:{type:'cover'}}));
        window.DesignEditorEssentialWorkspace.sync();window.dispatchEvent(new Event('resize'));
        await waitFor(()=>visible('designCoverSettingsTools')&&visible('designCoverSpineTools'),'cover-only settings restored',4000);
        await waitFor(()=>document.querySelectorAll('#designFlatCoverBoundaries .design-flat-cover-boundary').length===2,'cover structural boundaries',4000);
        assert(document.querySelectorAll('#designFlatCoverBoundaries .design-flat-cover-boundary').length===2,'back/spine/front need two structural separators');
        document.body.dataset.essentialCoverBoundaries='2';

        pass('product sidebar + canvas-priority right context pane + cover boundaries');
      }catch(error){fail(error)}
    })();
  </script>
</body>
</html>
