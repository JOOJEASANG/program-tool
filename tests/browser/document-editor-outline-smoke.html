<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Document Editor Outline Smoke</title></head>
<body data-document-outline-smoke="pending">
  <div id="result">PENDING</div>
  <iframe id="editorFrame" src="/document-editor/" style="width:1200px;height:900px;border:0"></iframe>
  <script>
  (async()=>{
    const result=document.getElementById('result'),frame=document.getElementById('editorFrame');
    const fail=error=>{document.body.dataset.documentOutlineSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
    const pass=message=>{document.body.dataset.documentOutlineSmoke='pass';result.textContent='PASS: '+message};
    const assert=(condition,message)=>{if(!condition)throw new Error(message)};
    const waitFor=async(predicate,label,timeout=12000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40))}throw new Error('timeout: '+label)};
    try{
      await waitFor(()=>frame.contentWindow?.DocumentEditorApp&&frame.contentWindow?.DocumentEditorOutline&&frame.contentDocument?.documentElement.dataset.documentEditorOutlineReady==='1','document outline ready');
      const win=frame.contentWindow,doc=frame.contentDocument,core=win.DocumentEditorApp,outline=win.DocumentEditorOutline;
      core.clearDraft();core.newDocument(true);
      core.setContent('<h1>사업 계획</h1><p>본문</p><h2>세부 계획</h2><h3>일정</h3><p>마무리</p>',{save:false});
      let headings=outline.renderOutline();
      assert(headings.length===3,'outline did not find 3 headings');
      assert(headings.map(item=>item.level).join(',')==='1,2,3','heading levels are wrong');
      let buttons=[...doc.querySelectorAll('#documentOutlineList [data-outline-index]')];
      assert(buttons.length===3,'outline did not render 3 navigation buttons');
      assert(buttons[0].dataset.outlineLevel==='1'&&buttons[1].dataset.outlineLevel==='2'&&buttons[2].dataset.outlineLevel==='3','outline level markers are wrong');

      assert(outline.focusHeading(1)===true,'outline navigation failed');
      assert(win.getSelection().toString()==='세부 계획','outline navigation did not select heading text');
      assert(outline.getState().activeIndex===1,'outline active index is wrong');
      assert(doc.querySelector('#documentOutlineList [data-outline-index="1"]').classList.contains('active'),'active outline button not marked');

      const second=doc.querySelector('#documentPage h2');second.textContent='수정된 세부 계획';second.dispatchEvent(new win.Event('input',{bubbles:true}));
      await waitFor(()=>doc.querySelector('#documentOutlineList [data-outline-index="1"]')?.textContent.includes('수정된 세부 계획'),'outline text refresh');
      const extra=doc.createElement('h2');extra.textContent='추가 항목';doc.getElementById('documentPage').appendChild(extra);
      await waitFor(()=>outline.collectHeadings().length===4&&doc.querySelectorAll('#documentOutlineList [data-outline-index]').length===4,'outline structural refresh');
      assert(!core.getContent().includes('data-outline-'),'outline navigation polluted document HTML');

      core.setContent('<p>제목 없는 일반 본문</p>',{save:false});
      await waitFor(()=>outline.collectHeadings().length===0&&doc.querySelector('.document-outline-empty'),'outline empty state');
      assert(doc.getElementById('outlineState').textContent.includes('제목이 없습니다'),'outline empty status is wrong');

      document.body.dataset.outlineCount='4';
      document.body.dataset.outlineNavigation='true';
      document.body.dataset.outlineAutoRefresh='true';
      document.body.dataset.outlineCleanHtml='true';
      document.body.dataset.outlineEmpty='true';
      document.body.dataset.documentOutlineStage=outline.stage;
      pass('heading outline navigation, automatic refresh and clean document HTML');
    }catch(error){fail(error)}
  })();
  </script>
</body>
</html>
