<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Professional Command Bar Smoke</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif}.editor-main{height:400px;overflow:auto}.editor-toolbar{height:50px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fff;border-bottom:1px solid #ddd}.surface-tabs{display:flex;gap:4px}.sidebar{width:320px}.design-mode-card{padding:10px}.spacer{height:900px}#artboardViewport{width:500px;height:300px;overflow:auto}#artboard{position:relative;width:300px;height:200px}.design-text{position:absolute}
  </style>
  <script>history.replaceState(null,'','/design-editor/general.html?embed=1&mode=cover&productTopbar=20260828-2');</script>
</head>
<body data-design-product-topbar-status="pending">
  <div id="result">PENDING</div>
  <div class="editor-main">
    <div class="editor-toolbar"><div id="surfaceTabs" class="surface-tabs"><button type="button" class="surface-tab on">앞면</button><button type="button" class="surface-tab">뒷면</button></div><div class="toolbar-hint">기존 긴 안내</div><span id="saveState">자동 저장됨</span></div>
    <div id="artboardViewport"><div id="artboard"></div></div>
    <div id="editorStatus"></div>
    <section id="designOutputTools"></section>
    <div class="spacer"></div>
  </div>
  <aside class="sidebar">
    <section id="designEmbeddedModeCard" class="design-mode-card" data-ps-tool-step="all" hidden>
      <div class="design-mode-head"><a class="design-mode-home" href="#">←</a><div><div class="design-mode-title">디자인 편집기</div><div class="design-mode-sub">기존 선택 카드</div></div></div>
      <div class="design-mode-grid">
        <button type="button" data-print-product="cover">표지</button>
        <button type="button" data-print-product="poster">포스터</button>
        <button type="button" data-print-product="flyer">전단</button>
        <button type="button" data-print-product="invitation">초대장·안내장</button>
        <button type="button" data-print-product="leaflet">리플렛</button>
      </div>
      <div class="design-mode-options"><label>용지 규격 <select><option>A4</option></select></label></div>
    </section>
    <button id="phase3Undo" type="button">undo source</button>
    <button id="phase3Redo" type="button">redo source</button>
    <button id="addTitleBtn" type="button">title source</button>
    <button id="addSubtitleBtn" type="button">subtitle source</button>
    <button id="addBodyBtn" type="button">body source</button>
    <button id="addInfoBtn" type="button">info source</button>
    <button id="phase2AddImage" type="button">image source</button>
    <button id="phase2AddRect" type="button">rect source</button>
    <button id="phase2AddEllipse" type="button">ellipse source</button>
    <button id="phase2AddLine" type="button">line source</button>
  </aside>
  <script>
    document.documentElement.dataset.printProductMenu='cover';
    document.querySelectorAll('[data-print-product]').forEach(button=>button.addEventListener('click',()=>{
      document.documentElement.dataset.printProductMenu=button.dataset.printProduct;
    }));
    window.DesignEditorPrintProductMenu={render(){return true;}};
    window.DesignEditorApp={project:{designMode:'cover'}};
    const calls={undo:0,redo:0,rect:0,resize:0,steps:[]};
    window.DesignEditorPhase3Controls={undo(){calls.undo+=1;},redo(){calls.redo+=1;}};
    window.ProgramStudioEditorToolRail={activeStep:'compose',select(step){this.activeStep=step;calls.steps.push(step);}};
    document.getElementById('phase2AddRect').addEventListener('click',()=>{calls.rect+=1;});
    window.addEventListener('resize',()=>{calls.resize+=1;});
  </script>
  <script src="/js/design-editor/print-product-topbar.js?v=20260828-2"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.designProductTopbarStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error);};
      const pass=message=>{document.body.dataset.designProductTopbarStatus='pass';result.textContent='PASS: '+message;};
      const assert=(condition,message)=>{if(!condition)throw new Error(message);};
      const waitFor=async(predicate,label,timeout=8000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,30));}throw new Error('timeout: '+label);};
      try{
        await waitFor(()=>document.querySelectorAll('#designPrintProductTopbar [data-print-product-top]').length===5,'topbar mount');
        await waitFor(()=>document.getElementById('designTopCommandbar'),'commandbar mount');
        const topbar=document.getElementById('designPrintProductTopbar');
        const commandbar=document.getElementById('designTopCommandbar');
        const toolbar=document.querySelector('.editor-toolbar');
        const card=document.getElementById('designEmbeddedModeCard');
        const sourceGrid=card.querySelector('.design-mode-grid');
        const surfaceGroup=document.getElementById('designSurfaceTopbarGroup');
        assert(topbar.parentElement===toolbar,'작업 종류가 editor toolbar 안에 고정되지 않았습니다.');
        const labels=[...topbar.querySelectorAll('[data-print-product-top]')].map(node=>node.textContent.trim());
        assert(labels.join('|')==='표지|포스터|전단|초대장·안내장|리플렛','상단 작업 종류 순서가 잘못되었습니다.');
        assert(getComputedStyle(toolbar).position==='sticky'&&getComputedStyle(toolbar).top==='0px','editor toolbar가 상단 sticky가 아닙니다.');
        assert(getComputedStyle(sourceGrid).display==='none','사이드바의 중복 작업 종류 선택이 숨겨지지 않았습니다.');
        assert(card.dataset.psToolAlways==='1'&&!card.dataset.psToolStep&&!card.hidden,'문서 세부 설정 카드가 항상 표시 상태가 아닙니다.');
        assert(card.querySelector('.design-mode-title').textContent.trim()==='문서 설정','사이드바 카드 제목이 문서 설정으로 정리되지 않았습니다.');
        assert(surfaceGroup?.querySelector('#surfaceTabs')&&surfaceGroup.querySelectorAll('.surface-tab').length===2,'앞면·뒷면 면 선택이 별도 계층으로 묶이지 않았습니다.');
        assert(toolbar.dataset.designCommandbar==='v2','전문 명령바 v2 상태가 표시되지 않았습니다.');
        assert(getComputedStyle(toolbar.querySelector('.toolbar-hint')).display==='none','긴 기존 안내가 상단 공간을 계속 차지합니다.');
        document.body.dataset.designProductTopbarFixed='sticky';
        document.body.dataset.designProductTopbarSidebar='details-only';
        document.body.dataset.designProductTopbarHierarchy='product-surface';

        topbar.querySelector('[data-print-product-top="flyer"]').click();
        await waitFor(()=>document.documentElement.dataset.printProductMenu==='flyer','topbar proxy flyer');
        await waitFor(()=>topbar.querySelector('[data-print-product-top="flyer"]').classList.contains('on'),'flyer active sync');
        document.body.dataset.designProductTopbarProxy='flyer';

        document.documentElement.dataset.printProductMenu='leaflet';
        await waitFor(()=>topbar.querySelector('[data-print-product-top="leaflet"]').classList.contains('on'),'leaflet state sync');
        document.body.dataset.designProductTopbarSync='leaflet';

        commandbar.querySelector('[data-design-command="undo"]').click();
        commandbar.querySelector('[data-design-command="redo"]').click();
        assert(calls.undo===1&&calls.redo===1,'상단 실행취소·다시실행이 기존 history API에 연결되지 않았습니다.');

        const insert=commandbar.querySelector('[data-design-command="insert"]');insert.click();
        const insertPopover=document.getElementById('designTopInsertPopover');
        assert(!insertPopover.hidden&&insert.getAttribute('aria-expanded')==='true','추가 메뉴가 열리지 않았습니다.');
        insertPopover.querySelector('[data-design-insert="rect"]').click();
        await waitFor(()=>calls.rect===1,'rect proxy');
        await waitFor(()=>window.ProgramStudioEditorToolRail.activeStep==='edit','insert edit routing');

        commandbar.querySelector('[data-design-command="panel"]').click();
        await waitFor(()=>document.documentElement.classList.contains('ps-sidebar-collapsed'),'panel collapse');
        assert(document.querySelector('.sidebar').getAttribute('aria-hidden')==='true','패널 접기 접근성 상태가 갱신되지 않았습니다.');
        commandbar.querySelector('[data-design-command="panel"]').click();
        await waitFor(()=>!document.documentElement.classList.contains('ps-sidebar-collapsed'),'panel expand');

        const beforeResize=calls.resize;
        commandbar.querySelector('[data-design-command="fit"]').click();
        await waitFor(()=>calls.resize>beforeResize,'fit resize');
        assert(document.getElementById('editorStatus').textContent.includes('화면에 맞췄습니다'),'화면 맞춤 상태 안내가 없습니다.');

        const help=commandbar.querySelector('[data-design-command="help"]');help.click();
        const helpPopover=document.getElementById('designTopHelpPopover');
        assert(!helpPopover.hidden&&helpPopover.textContent.includes('Ctrl Z')&&helpPopover.textContent.includes('Shift + 방향키'),'단축키 도움말이 충분하지 않습니다.');
        help.click();

        commandbar.querySelector('[data-design-command="output"]').click();
        await waitFor(()=>window.ProgramStudioEditorToolRail.activeStep==='output','output route');

        window.ProgramStudioEditorToolRail.activeStep='compose';
        const selected=document.createElement('div');selected.className='design-text selected';selected.dataset.id='selected-1';document.getElementById('artboard').appendChild(selected);
        await waitFor(()=>window.ProgramStudioEditorToolRail.activeStep==='edit','selection edit routing');
        document.body.dataset.designProductTopbarContext='edit';
        document.body.dataset.designProductTopbarCommands='undo-redo-insert-panel-fit-output';
        pass('professional command bar: 종류·면 계층, 실행취소, 빠른 추가, 패널, 맞춤, 도움말, 출력, 선택 자동 편집이 확인됨');
      }catch(error){fail(error);}
    })();
  </script>
</body>
</html>
