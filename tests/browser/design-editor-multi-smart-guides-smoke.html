<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Multi Smart Guides Smoke</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif}.editor-main{height:560px}.editor-toolbar{height:54px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ddd}.artboard{position:relative;width:412px;height:412px;margin:20px;background:#fff}.design-text,.phase2-extra-object{position:absolute;box-sizing:border-box}.design-text{height:20px}.phase2-extra-object{height:40px}#designCanvasQuickbar{display:block}.sidebar{display:none}
  </style>
  <script>history.replaceState(null,'','/design-editor/general.html?embed=1&mode=poster&multiSmart=20260828-1');</script>
</head>
<body data-design-multi-smart-status="pending">
  <div id="result">PENDING</div>
  <div class="editor-main">
    <div class="editor-toolbar">toolbar <span id="saveState">현재 작업</span></div>
    <div id="designSelectionContextbar">single context</div>
    <div id="designCanvasQuickbar">floating quickbar</div>
    <div id="artboard" class="artboard"></div>
    <div id="editorStatus"></div>
  </div>
  <aside class="sidebar"><div id="inspector"></div></aside>
  <script>
    const textA={id:'text-a',type:'text',text:'A',x:10,y:10,w:20,size:14,lineHeight:1,locked:false};
    const textB={id:'text-b',type:'text',text:'B',x:40,y:40,w:20,size:14,lineHeight:1,locked:false};
    const shapeC={id:'shape-c',type:'shape',shape:'rect',name:'C',x:70,y:70,w:20,h:20,locked:false,opacity:100};
    const anchorD={id:'shape-d',type:'shape',shape:'rect',name:'Anchor',x:160,y:120,w:20,h:20,locked:false,opacity:100};
    const project={width:200,height:200,bleed:3,safe:5,activeSurface:'front',surfaces:[{id:'front',elements:[textA,textB],extras:[shapeC,anchorD]}]};
    function renderObjects(){
      const board=document.getElementById('artboard');
      board.querySelectorAll('.design-text,.phase2-extra-object').forEach(node=>node.remove());
      project.surfaces[0].elements.forEach((item,index)=>{
        const node=document.createElement('div');node.className='design-text'+(index===0&&document.body.dataset.seeded!=='1'?' selected':'');node.dataset.id=item.id;node.textContent=item.text||'T';
        node.style.left=((project.bleed+item.x)*2)+'px';node.style.top=((project.bleed+item.y)*2)+'px';node.style.width=(item.w*2)+'px';node.style.height='20px';board.appendChild(node);
      });
      project.surfaces[0].extras.forEach(item=>{
        const node=document.createElement('div');node.className='phase2-extra-object';node.dataset.extraId=item.id;node.textContent=item.name||'X';
        node.style.left=((project.bleed+item.x)*2)+'px';node.style.top=((project.bleed+item.y)*2)+'px';node.style.width=(item.w*2)+'px';node.style.height=(item.h*2)+'px';board.appendChild(node);
      });
      document.body.dataset.seeded='1';
    }
    renderObjects();
    window.DesignEditorApp={get project(){return project;},resumeDraft(){renderObjects();}};
    window.DesignEditorPhase2={sync(){renderObjects();}};
    window.DesignEditorSelectionContextbar={sync(){}};
    window.DesignEditorWorkflowV2={activateStep(step){window.__lastStep=step;}};
    window.DesignEditorDraftScope={saveCurrent(reason){window.__saveReason=reason;}};
  </script>
  <script src="/js/design-editor/multi-selection-context.js?v=20260828-1"></script>
  <script src="/js/design-editor/multi-selection-smart-guides.js?v=20260828-1"></script>
  <script>
    window.addEventListener('DOMContentLoaded',async()=>{
      const result=document.getElementById('result');
      const assert=(ok,message)=>{if(!ok)throw new Error(message);};
      const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      const pointer=(type,init={})=>new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:17,button:0,buttons:type==='pointermove'?1:0,...init});
      const scale=()=>document.getElementById('artboard').getBoundingClientRect().width/(project.width+project.bleed*2);
      const textHeight=item=>document.querySelector(`[data-id="${item.id}"]`).getBoundingClientRect().height/scale();
      const horizontalGaps=()=>{
        const rows=[textA,textB,shapeC].sort((a,b)=>a.x-b.x);return [rows[1].x-(rows[0].x+rows[0].w),rows[2].x-(rows[1].x+rows[1].w)];
      };
      const verticalGaps=()=>{
        const rows=[textA,textB,shapeC].sort((a,b)=>a.y-b.y);const h=item=>item.type==='text'?textHeight(item):item.h;return [rows[1].y-(rows[0].y+h(rows[0])),rows[2].y-(rows[1].y+h(rows[1]))];
      };
      try{
        const multi=window.DesignEditorMultiSelection,smart=window.DesignEditorMultiSmartGuides;
        assert(multi&&smart,'multi smart runtime missing');
        multi.selectKeys(['text:text-a','text:text-b','extra:shape-c']);smart.sync();
        const bar=document.getElementById('designMultiSelectionContextbar'),controls=document.getElementById('designMultiSmartGuideControls');
        assert(bar&&!bar.hidden&&controls,'smart controls missing');
        const toggle=controls.querySelector('[data-multi-smart-toggle]');assert(toggle&&toggle.getAttribute('aria-pressed')==='true','smart toggle not enabled');
        toggle.click();assert(toggle.getAttribute('aria-pressed')==='false','smart toggle did not disable');toggle.click();assert(toggle.getAttribute('aria-pressed')==='true','smart toggle did not re-enable');
        document.body.dataset.designMultiSmartToggle='enabled';

        const hInput=controls.querySelector('[data-multi-exact-gap="horizontal"]');hInput.value='6';hInput.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
        const hg=horizontalGaps();assert(hg.every(value=>Math.abs(value-6)<.02),'exact horizontal gap failed');
        const vInput=controls.querySelector('[data-multi-exact-gap="vertical"]');vInput.value='4';controls.querySelector('[data-multi-gap-apply="vertical"]').click();
        const vg=verticalGaps();assert(vg.every(value=>Math.abs(value-4)<.05),'exact vertical gap failed');
        assert(window.__lastStep==='arrange','exact gap did not keep arrange workflow');
        document.body.dataset.designMultiSmartGap='horizontal-6-vertical-4';

        textA.x=10;textB.x=36;shapeC.x=62;textA.y=10;textB.y=24;shapeC.y=38;
        multi.sync();smart.sync();
        multi.records.forEach(record=>{
          const node=record.node;if(node){node.style.left=((project.bleed+record.item.x)*scale())+'px';node.style.top=((project.bleed+record.item.y)*scale())+'px';}
        });
        const selected=document.querySelector('.ps-multi-selected');assert(selected,'selected node missing before smart drag');
        selected.dispatchEvent(pointer('pointerdown',{clientX:100,clientY:100}));
        document.dispatchEvent(pointer('pointermove',{clientX:206.8,clientY:100}));
        document.dispatchEvent(pointer('pointerup',{clientX:206.8,clientY:100}));
        await wait(90);
        const left=Math.min(textA.x,textB.x,shapeC.x),right=Math.max(textA.x+textA.w,textB.x+textB.w,shapeC.x+shapeC.w),center=(left+right)/2;
        assert(Math.abs(center-100)<.08,`group center did not snap to artboard center: ${center}`);
        assert(document.querySelector('.phase17-multi-guide.vertical'),'vertical smart guide not visible');
        assert(document.documentElement.dataset.designMultiSmartSnap?.includes('x'),'smart snap state missing');
        assert(window.__saveReason==='multi-smart-snap','smart snap was not persisted');
        document.body.dataset.designMultiSmartSnap='artboard-center';
        document.body.dataset.designMultiSmartGuide='visible';

        document.body.dataset.designMultiSmartStatus='pass';
        result.textContent='PASS: multi smart guides: 자석 가이드·아트보드 중앙 스냅·가로/세로 정확한 mm 간격이 확인됨';
      }catch(error){document.body.dataset.designMultiSmartStatus='fail';result.textContent='FAIL: '+String(error?.stack||error);}
    },{once:true});
  </script>
</body>
</html>
