<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PDF Divider Modal Layout Race Smoke</title>
  <style>
    :root{--primary:#12396d;--line:#e5e7eb}*{box-sizing:border-box}body{font-family:Arial,sans-serif}.modal-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.6)}.modal-box{width:620px;background:#fff;padding:16px}.modal-head{font-weight:800}.divider-prev-wrap{width:240px;aspect-ratio:210/297;background:#fff}.divider-prev-wrap canvas{width:100%;height:100%}.field{margin:8px 0}.modal-footer{display:flex;gap:8px}.btn{padding:8px}.btn-primary{background:#12396d;color:#fff}.btn-secondary{background:#e5e7eb}.btn-sm{padding:5px}
  </style>
  <script>history.replaceState(null,'','/pdf-editor/index.html?divider-modal-layout-smoke=1');</script>
</head>
<body data-divider-modal-smoke="pending">
  <button type="button" id="openDividerBtn">간지</button>

  <div id="dividerModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">간지 페이지 편집 <button type="button" id="dividerModalClose">×</button></div>
      <div class="divider-prev-wrap"><canvas id="dividerPrevCanvas" width="595" height="842"></canvas></div>
      <div class="field"><label>제목</label><input type="text" id="dividerTitle"></div>
      <div class="field"><label>부제목</label><input type="text" id="dividerSubtitle"></div>
      <div class="field"><label>하단 메모</label><input type="text" id="dividerNote"></div>
      <div class="field"><label>배경색</label><input type="color" id="dividerBg" value="#ffffff"></div>
      <div class="field"><label><input type="checkbox" id="dividerNoBg" checked> 배경 없음</label></div>
      <div class="field"><label>글자색</label><input type="color" id="dividerFg" value="#1f2937"></div>
      <div class="field"><label>스타일</label><select id="dividerStyle"><option value="simple">기본</option></select></div>
      <div class="field"><label>세로 이동</label><input type="range" id="dividerVOffset" min="-40" max="40" value="0"><span id="dividerVOffsetVal">0%</span></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="dividerCancelBtn">취소</button>
        <button type="button" class="btn btn-primary" id="dividerConfirmBtn">삽입</button>
      </div>
    </div>
  </div>

  <div id="result">PENDING</div>

  <script>
    function getDividerContent(){return {title:document.getElementById('dividerTitle').value,subtitle:document.getElementById('dividerSubtitle').value,note:document.getElementById('dividerNote').value,bg:document.getElementById('dividerBg').value,fg:document.getElementById('dividerFg').value,noBg:document.getElementById('dividerNoBg').checked,style:'simple',textVOffset:Number(document.getElementById('dividerVOffset').value||0)};}
    function renderDividerCanvas(content,w,h){const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle=content?.noBg===false?(content.bg||'#fff'):'#fff';ctx.fillRect(0,0,w,h);return canvas;}
    function updateDividerPreview(){const target=document.getElementById('dividerPrevCanvas');const rendered=renderDividerCanvas(getDividerContent(),595,842);const ctx=target.getContext('2d');ctx.clearRect(0,0,target.width,target.height);ctx.drawImage(rendered,0,0,target.width,target.height);}
    function openDividerInsert(){document.getElementById('dividerModal').style.display='flex';updateDividerPreview();}
    function editDivider(){document.getElementById('dividerModal').style.display='flex';updateDividerPreview();}
    function makeDividerPageObj(content){return {dividerContent:content,thumbCanvas:renderDividerCanvas(content,200,283)};}
    function renderThumbs(){}
    window.getDividerContent=getDividerContent;window.renderDividerCanvas=renderDividerCanvas;window.updateDividerPreview=updateDividerPreview;window.openDividerInsert=openDividerInsert;window.editDivider=editDivider;window.makeDividerPageObj=makeDividerPageObj;window.renderThumbs=renderThumbs;
    document.getElementById('openDividerBtn').addEventListener('click',()=>window.openDividerInsert());
    const close=()=>{document.getElementById('dividerModal').style.display='none';};
    document.getElementById('dividerModalClose').addEventListener('click',close);
    document.getElementById('dividerCancelBtn').addEventListener('click',close);
  </script>

  <!-- Load the layout before the studio and let the local panel appear first.
       This reproduces the dangerous ordering that previously detached the modal. -->
  <script src="/js/pdf-editor/divider-modal-layout.js?v=20260830-2"></script>
  <script src="/js/pdf-divider-local-image-upload.js?v=20260830-1"></script>
  <script>
    window.setTimeout(()=>{
      const helper=document.createElement('script');
      helper.src='/js/pdf-editor/divider-helper.js?v=20260731-2';
      helper.async=false;
      document.head.appendChild(helper);
    },1100);

    (async()=>{
      const result=document.getElementById('result');
      const assert=(value,message)=>{if(!value)throw new Error(message)};
      const waitFor=async(predicate,label,timeout=9000)=>{const started=Date.now();while(Date.now()-started<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,30));}throw new Error('timeout: '+label);};
      try{
        await waitFor(()=>document.getElementById('pdfDividerLocalImagePanel'),'local image panel');
        await waitFor(()=>window.__pdfDividerStudioV2===true,'divider studio');
        await waitFor(()=>document.documentElement.dataset.pdfDividerWidePreview==='2','safe wide layout');

        const modal=document.getElementById('dividerModal');
        const body=document.getElementById('pdfDividerStudioLayoutV1');
        const controls=document.getElementById('pdfDividerStudioControlsV1');
        const preview=document.getElementById('pdfDividerStudioPreviewV1');
        const footer=document.querySelector('#dividerModal .modal-footer');
        const local=document.getElementById('pdfDividerLocalImagePanel');

        assert(body?.isConnected,'studio body must remain connected');
        assert(controls?.isConnected,'studio controls must remain connected');
        assert(preview?.isConnected,'studio preview must remain connected');
        assert(footer?.parentElement===controls,'cancel/insert footer must move into left controls');
        assert(local?.parentElement===controls,'local image panel must stay in left controls');
        assert(document.getElementById('dividerPrevCanvas')?.isConnected,'preview canvas must stay connected');
        assert(document.getElementById('dividerConfirmBtn')?.isConnected,'insert button must stay connected');

        document.getElementById('openDividerBtn').click();
        await new Promise(resolve=>setTimeout(resolve,80));
        assert(modal.style.display==='flex','clicking divider must open the modal');
        assert(getComputedStyle(modal).display==='flex','divider modal must be visibly displayed');

        document.getElementById('dividerCancelBtn').click();
        assert(modal.style.display==='none','cancel button must still close the modal');

        document.body.dataset.dividerModalSmoke='pass';
        result.textContent='PASS: divider modal survives delayed studio load, opens on click and keeps actions in the narrow left panel';
      }catch(error){
        document.body.dataset.dividerModalSmoke='fail';
        result.textContent='FAIL: '+String(error?.stack||error?.message||error);
      }
    })();
  </script>
</body>
</html>
