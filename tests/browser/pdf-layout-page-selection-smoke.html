<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PDF Layout Page Selection Smoke</title>
  <style>
    #thumbArea{display:flex;gap:8px}.thumb-wrap{width:60px;height:80px;border:1px solid #ccc;position:relative}.page-preview{height:40px}.ctx-item{padding:2px}
  </style>
</head>
<body data-pdf-layout-page-selection-smoke="running">
  <div id="result">RUNNING</div>
  <div id="sidebarFixture">
    <div class="thumb-hint"></div>
    <div id="thumbArea"></div>
  </div>
  <div id="previewScroll"></div>
  <div id="thumbCtxMenu"></div>

  <script>
    const sourceCanvas = () => {
      const c = document.createElement('canvas');
      c.width = 60; c.height = 80;
      return c;
    };
    window.parsedPages = [1, 2, 3, 4].map(id => ({
      id,
      pageType: 'pdf',
      pdfPage: { id },
      thumbCanvas: sourceCanvas(),
      excluded: false,
      rotation: 0,
    }));
    window.nup = 1;
    window.BOOKLET_STRIPS = {};
    window.groupByNup = pages => [{ n: 1, pages }];
    window.getLayout = () => ({ cols: 1, rows: 1 });
    window.schedulePreviewCalls = 0;
    window.triggerPreviewCalls = 0;
    window.schedulePreview = () => { window.schedulePreviewCalls += 1; };
    window.triggerPreview = () => { window.triggerPreviewCalls += 1; return Promise.resolve(); };
    window.showStatus = () => {};
    window.hideStatus = () => {};
    window.makeBlankPage = () => ({ id: Date.now(), pageType: 'blank', excluded: false, rotation: 0, thumbCanvas: sourceCanvas() });
    window.displayPreview = () => {};
    window.renderPdfPage = async (_page, _scale, rotation) => {
      const c = sourceCanvas();
      c.dataset.rotation = String(rotation || 0);
      return c;
    };

    window.renderThumbs = function renderThumbs() {
      const area = document.getElementById('thumbArea');
      area.innerHTML = '';
      parsedPages.forEach((page, index) => {
        const item = document.createElement('div');
        item.className = 'thumb-item';
        item.dataset.id = page.id;
        const wrap = document.createElement('div');
        wrap.className = 'thumb-wrap';
        if (page.thumbCanvas) {
          const canvas = document.createElement('canvas');
          canvas.width = page.thumbCanvas.width;
          canvas.height = page.thumbCanvas.height;
          wrap.appendChild(canvas);
        }
        const num = document.createElement('span');
        num.className = 'thumb-num';
        num.textContent = String(index + 1);
        wrap.appendChild(num);
        wrap.addEventListener('contextmenu', event => window._openThumbCtxMenu?.(event, page, index));
        item.appendChild(wrap);
        area.appendChild(item);
      });

      const preview = document.getElementById('previewScroll');
      preview.innerHTML = '';
      parsedPages.filter(page => !page.excluded).forEach(() => {
        const node = document.createElement('div');
        node.className = 'page-preview';
        node.getBoundingClientRect = () => ({ top: 0 });
        preview.appendChild(node);
      });
    };
    document.getElementById('previewScroll').getBoundingClientRect = () => ({ top: 0 });
    document.getElementById('previewScroll').scrollTo = () => {};
    renderThumbs();
  </script>
  <script src="/js/pdf-editor/page-selection-preview-focus.js?v=20260914-2"></script>
  <script>
    (async () => {
      const result = document.getElementById('result');
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
      const fail = error => {
        document.body.dataset.pdfLayoutPageSelectionSmoke = 'fail';
        result.textContent = 'FAIL: ' + String(error?.stack || error);
      };
      const click = (index, options = {}) => {
        const wrap = document.querySelectorAll('#thumbArea .thumb-wrap')[index];
        wrap.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, ...options }));
      };
      const rightClick = index => {
        const wrap = document.querySelectorAll('#thumbArea .thumb-wrap')[index];
        wrap.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 20, clientY: 20 }));
      };
      const menuItem = text => [...document.querySelectorAll('#thumbCtxMenu .ctx-item')].find(node => node.textContent.includes(text));

      try {
        await wait(250);
        if (!document.getElementById('pageSelectionToolbar')) throw new Error('selection toolbar missing');
        if (document.documentElement.dataset.pdfSidebarPageView !== 'source-portrait') throw new Error('sidebar source portrait mode missing');

        click(0);
        click(2, { ctrlKey: true });
        await wait(30);
        if (document.querySelectorAll('#thumbArea .page-selected').length !== 2) throw new Error('Ctrl multi-selection failed');
        if (document.getElementById('pageSelectionCount')?.textContent !== '선택 2개') throw new Error('selection count mismatch');

        rightClick(0);
        await wait(20);
        const heading = document.querySelector('#thumbCtxMenu .ctx-heading');
        if (!heading?.textContent.includes('선택한 페이지 2개')) throw new Error('batch context heading mismatch');
        if (document.getElementById('thumbCtxMenu')?.dataset.selectionCount !== '2') throw new Error('context selection snapshot count mismatch');

        // Prove that menu actions use the frozen right-click selection, not a later
        // single/live selection. Clearing the live set after opening the menu must
        // not shrink the action target.
        window.PdfEditorPageSelection.clearSelection();
        const rotate = menuItem('시계방향 90° 회전');
        if (!rotate) throw new Error('batch rotate action missing');
        rotate.click();
        await wait(120);
        if (parsedPages[0].rotation !== 90 || parsedPages[2].rotation !== 90) throw new Error('batch rotate did not update every snapshotted page');
        if (parsedPages[1].rotation !== 0 || parsedPages[3].rotation !== 0) throw new Error('batch rotate touched an unselected page');
        if (window.triggerPreviewCalls + window.schedulePreviewCalls < 1) throw new Error('right preview was not refreshed after batch rotation');
        if (!parsedPages[0].sourceThumbCanvas || !parsedPages[2].sourceThumbCanvas) throw new Error('source sidebar thumbnail was not preserved');

        click(0);
        click(2, { ctrlKey: true });
        rightClick(0);
        await wait(20);
        const hide = menuItem('선택 페이지 숨기기');
        if (!hide) throw new Error('batch hide action missing');
        hide.click();
        await wait(60);
        if (!parsedPages[0].excluded || !parsedPages[2].excluded || parsedPages[1].excluded) throw new Error('batch hide did not target full selection');

        document.querySelector('[data-selection-action="clear"]').click();
        click(0);
        click(3, { shiftKey: true });
        await wait(30);
        if (document.querySelectorAll('#thumbArea .page-selected').length !== 4) throw new Error('Shift range selection failed');

        document.querySelector('[data-selection-action="clear"]').click();
        document.querySelector('[data-selection-action="all"]').click();
        await wait(20);
        if (document.querySelectorAll('#thumbArea .page-selected').length !== 4) throw new Error('select all failed');

        document.body.dataset.pdfLayoutPageSelectionSmoke = 'pass';
        result.textContent = 'PASS: frozen multi-selection, full batch actions, source sidebar and right preview refresh';
      } catch (error) {
        fail(error);
      }
    })();
  </script>
</body>
</html>
