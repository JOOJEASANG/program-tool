<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Standalone advanced PDF editor isolation smoke</title>
</head>
<body>
  <pre id="result">RUNNING</pre>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=message=>{
        document.documentElement.dataset.pdfAdvancedSidebarHardIsolationSmoke='fail';
        result.textContent='FAIL: '+message;
        throw new Error(message);
      };
      const text=async path=>{
        const response=await fetch(path,{cache:'no-store'});
        if(!response.ok)throw new Error(path+' '+response.status);
        return response.text();
      };

      const firebase=JSON.parse(await text('/firebase.json'));
      const rewrite=firebase.hosting.rewrites.find(item=>item.source==='/pdf-editor-advanced');
      if(!rewrite)return fail('advanced Firebase rewrite missing');
      if(rewrite.destination!=='/pdf-editor-advanced/index.html')return fail('advanced route still points at general PDF editor');

      const htmlSource=await text('/pdf-editor-advanced/index.html');
      const documentCopy=new DOMParser().parseFromString(htmlSource,'text/html');
      if(!documentCopy.body?.dataset?.pdfAdvancedStandalone)return fail('standalone app marker missing');
      if(!htmlSource.includes('/js/pdf-editor-advanced/app.js'))return fail('standalone app entry missing');
      for(const forbidden of [
        '/js/pdf-editor/core-runtime.js',
        '/js/pdf-editor/advanced-runtime.js',
        'advanced-profile-scope',
        'N-up','N-UP','nup','booklet','소책자','간지'
      ]){
        if(htmlSource.includes(forbidden))return fail('legacy layout dependency leaked into standalone HTML: '+forbidden);
      }
      for(const id of [
        'uploadBtn','pageList','scaleRange','offsetXRange','offsetYRange',
        'cropLeft','cropTop','cropRight','cropBottom','eraseModeBtn',
        'marginLeft','marginTop','marginRight','marginBottom',
        'hfEnabled','headerLeft','footerRight','pnEnabled','pnPosition','pnFormat','downloadBtn'
      ]){
        if(!documentCopy.getElementById(id))return fail('standalone control missing: '+id);
      }
      if(documentCopy.querySelector('.top-nav'))return fail('legacy top header exists');

      const stateSource=(await text('/js/pdf-editor-advanced/state.js')).toLowerCase();
      const appSource=(await text('/js/pdf-editor-advanced/app.js')).toLowerCase();
      const previewSource=(await text('/js/pdf-editor-advanced/preview.js')).toLowerCase();
      const apiSource=(await text('/js/pdf-editor-advanced/api.js')).toLowerCase();
      const combined=[stateSource,appSource,previewSource,apiSource].join('\n');
      for(const forbidden of ['nupscale','nupoffset','pdfnup','booklet','/js/pdf-editor/']){
        if(combined.includes(forbidden))return fail('legacy runtime/state dependency leaked: '+forbidden);
      }
      if(!stateSource.includes('edit_scale')||!stateSource.includes('offset_x_mm')||!stateSource.includes('offset_y_mm'))return fail('standalone transform serialization missing');
      if(!stateSource.includes('header_footer')||!stateSource.includes('page_numbers')||!stateSource.includes('margins'))return fail('required document settings missing');
      if(!apiSource.includes('/api/pdf/advanced/process'))return fail('standalone advanced API missing');
      if(!previewSource.includes('max_source_canvas_cache = 8'))return fail('bounded preview cache missing');
      if(!previewSource.includes('renderthumbnail')||previewSource.includes('renderthumbnail(page, canvas) {\n  const source = await sourcecanvasfor'))return fail('thumbnail still consumes high-resolution source cache');

      document.documentElement.dataset.pdfAdvancedSidebarHardIsolationSmoke='pass';
      result.textContent='PASS: /pdf-editor-advanced stays advanced, hides spread/N-up/order controls and skips general print-layout modules';
    })().catch(error=>console.error(error));
  </script>
</body>
</html>
