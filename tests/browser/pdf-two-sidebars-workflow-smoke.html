<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>PDF two sidebar workflow smoke</title></head>
<body data-program-kind="pdf-editor" data-pdf-two-sidebars-smoke="running">
<div class="app" id="pdfEditorApp">
  <aside id="left">
    <div class="sec" id="uploadSec"><div class="sec-head" data-sec="upload"><span class="sec-title">파일 업로드</span><span class="sec-arrow">▾</span></div><div class="sec-body" id="sb-upload"><button id="uploadProbe">업로드</button></div></div>
    <div class="sec" id="nupSec"><div class="sec-head" data-sec="nup"><span class="sec-title">N-up 배치</span><span class="sec-arrow">▾</span></div><div class="sec-body" id="sb-nup"><details id="pdfActualSizeDisclosure"><summary>실제 크기 · 상세 배치 설정</summary><div id="actualSizePanel"><input type="checkbox" id="actualSizeCheck"></div></details><button id="nupProbe">N-up</button></div></div>
    <div class="sec" id="paperSec"><div class="sec-head" data-sec="paper"><span class="sec-title">용지 설정</span><span class="sec-arrow">▾</span></div><div class="sec-body" id="sb-paper"><label>용지<input id="paperSize" value="a4"></label><div id="pdfPageCellMarginsV1"><button id="pdfCellMarginApply" type="button">파일에 적용</button></div></div></div>
    <div class="sec" id="editSec"><div class="sec-head collapsed" data-sec="edit"><span class="sec-title">문서 편집</span><span class="sec-badge">표시 도구</span><span class="sec-arrow">▾</span></div><div class="sec-body hidden" id="sb-edit"><input id="wmEnabled" type="checkbox"><input id="hfEnabled" type="checkbox"><input id="pnEnabled" type="checkbox"></div></div>
    <div class="sec" id="outputSec"><div class="sec-head"><span class="sec-title">출력</span></div><div class="sec-body"><button id="previewBtn">미리보기 새로고침</button><div style="height:6px"></div><button id="downloadBtn">PDF 저장</button><div style="height:6px"></div><button id="resetBtn">전체 초기화</button></div></div>
  </aside>
  <main><div class="preview-shell">미리보기</div></main>
  <aside id="pageSidebar">
    <section id="pageSelectedMarginPanel"><details id="pageSelectedMarginDetails"><summary>개별 여백</summary></details></section>
    <div class="sec" id="thumbSection"><div class="sec-head" data-sec="pages"><span class="sec-title">파일별 페이지</span></div><div class="sec-body" id="sb-pages">
      <div id="pdfFileNavigation"><button id="pdfEditedPageJumpButton">이동</button></div>
      <div id="thumbArea"><div class="thumb-item">페이지 1</div></div>
    </div></div>
  </aside>
</div>
<pre id="result">RUNNING</pre>
<script>history.replaceState(null,'','/pdf-editor/?ui-workflow-smoke=1');</script>
<script src="/js/pdf-editor/simple-sidebar-ui.js?v=20261112-1"></script>
<script>
(async()=>{
  const sleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
  const byId=(id)=>document.getElementById(id);
  const fail=(message)=>{throw new Error(message)};
  let marginClicks=0,navClicks=0,outputClicks=0;
  byId('pdfCellMarginApply').addEventListener('click',()=>marginClicks++);
  byId('pdfEditedPageJumpButton').addEventListener('click',()=>navClicks++);
  byId('downloadBtn').addEventListener('click',()=>outputClicks++);
  try{
    await sleep(170);
    const left=byId('left'),right=byId('pageSidebar');
    const ids=[...left.querySelectorAll(':scope>.sec')].map(section=>section.id);
    if(ids.indexOf('paperSec')>ids.indexOf('nupSec'))fail('paper options did not precede N-up');
    if(byId('editSec').classList.contains('pdf-ui-closed')!==true)fail('optional document display should start closed');
    if(getComputedStyle(byId('sb-edit')).display!=='none')fail('optional document options are not actually collapsed');
    byId('editSec').querySelector('.sec-head').click();
    await sleep(50);
    if(byId('editSec').classList.contains('pdf-ui-closed'))fail('document display did not open');
    byId('editSec').querySelector('.sec-head').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
    await sleep(50);
    if(!byId('editSec').classList.contains('pdf-ui-closed'))fail('keyboard did not close document display');
    if(byId('pdfActualSizeDisclosure').open)fail('actual-size detail should start closed');
    byId('actualSizeCheck').checked=true;
    window.PdfEditorSimpleSidebarUi.sync();
    if(!byId('pdfActualSizeDisclosure').open)fail('active actual size not revealed');
    if(!right.contains(byId('pdfPageCellMarginsV1'))||left.contains(byId('pdfPageCellMarginsV1')))fail('per-file margin controls stayed in left sidebar');
    if(!byId('pdfFileMarginsDetails')||byId('pdfFileMarginsDetails').open)fail('file margin disclosure missing or open by default');
    if(!byId('pdfPageJumpDetails')||byId('pdfPageJumpDetails').open)fail('page navigation disclosure missing or open by default');
    byId('pdfFileMarginsDetails').open=true;
    byId('pdfPageJumpDetails').open=true;
    byId('pdfCellMarginApply').click();
    byId('pdfEditedPageJumpButton').click();
    byId('downloadBtn').click();
    if(marginClicks!==1||navClicks!==1||outputClicks!==1)fail('existing action handlers were replaced');
    if(right.querySelectorAll('#pdfPageCellMarginsV1').length!==1||right.querySelectorAll('#pdfFileNavigation').length!==1)fail('duplicate tools were created');
    if(!left.contains(byId('paperSize'))||!left.contains(byId('downloadBtn')))fail('print settings or PDF save moved out of left sidebar');
    if(!right.contains(byId('thumbArea')))fail('page thumbnails left the right sidebar');
    if(getComputedStyle(byId('outputSec')).position!=='sticky')fail('PDF save actions are not pinned to left sidebar');
    document.body.dataset.pdfTwoSidebarsSmoke='pass';
    byId('result').textContent='PASS: PDF left paper/N-up workflow, advanced disclosures, right file navigation and margins, preserved action handlers and pinned PDF save';
  }catch(error){
    document.body.dataset.pdfTwoSidebarsSmoke='fail';
    byId('result').textContent='FAIL: '+String(error.stack||error);
  }
})();
</script>
</body></html>
