<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Home Dashboard V2 Smoke</title><script>history.replaceState(null,'','/index.html?home-v2-smoke=1');localStorage.removeItem('program-studio:home:favorites-v2');localStorage.removeItem('program-studio:home:recent-v2');</script></head><body data-home-v2-smoke="pending"><main><section id="programs"></section></main><div id="result">PENDING</div><script src="/js/home-dashboard-v2.js?v=smoke"></script><script>(async()=>{const result=document.getElementById('result'),assert=(v,m)=>{if(!v)throw new Error(m)},wait=async(p,l)=>{for(let i=0;i<100;i++){if(p())return;await new Promise(r=>setTimeout(r,20))}throw new Error('timeout: '+l)};try{await wait(()=>window.HomeDashboardV2,'api');const root=document.getElementById('homeDashboardV2');assert(root,'workspace missing');assert(root.querySelectorAll('.ps-home-tool').length===5,'five active tools missing');const search=root.querySelector('.ps-home-search');search.value='이미지';search.dispatchEvent(new Event('input',{bubbles:true}));assert(root.querySelectorAll('.ps-home-tool:not(.hidden-by-search)').length===1,'search filter wrong');search.value='';search.dispatchEvent(new Event('input',{bubbles:true}));const favorite=root.querySelector('[data-tool-id="image-editor"] .ps-home-favorite');favorite.click();assert(favoriteIds().includes('image-editor'),'favorite persistence missing');window.HomeDashboardV2.markRecent('image-editor');window.HomeDashboardV2.render();assert(root.querySelector('.ps-home-meta').textContent.includes('이미지 편집기'),'recent/favorite chips missing');document.body.dataset.homeV2Smoke='pass';result.textContent='PASS: home search, favorites and recent tools';}catch(error){document.body.dataset.homeV2Smoke='fail';result.textContent='FAIL: '+String(error.message||error)}function favoriteIds(){try{return JSON.parse(localStorage.getItem('program-studio:home:favorites-v2')||'[]')}catch(_){return[]}}})();</script></body></html>
