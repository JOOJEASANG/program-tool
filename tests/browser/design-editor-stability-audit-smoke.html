<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Stability Audit Smoke</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:10px;font-family:Arial,sans-serif}#artboard{position:relative;width:648px;height:909px;background:#fff}.design-object{position:absolute;min-height:10px}.design-text-inner{width:100%}.editable-text{display:block;width:100%}
  </style>
  <script>
    history.replaceState(null,'','/design-editor/general.html?embed=1&stability-audit-smoke=1');
    const project={width:210,height:297,bleed:3,safe:6,activeSurface:'front',surfaces:[{id:'front',elements:[{id:'title1',type:'text',text:'안정성 점검',fontFamily:'Arial',size:24,weight:700,align:'left',color:'#111827',x:20,y:30,w:90,visible:true,locked:false}],extras:[]}]};
    window.DesignEditorApp={get project(){return project;}};
    window.DesignEditorDraftScope={saveCurrent(){return true;}};
  </script>
</head>
<body data-stability-audit-smoke="pending">
  <div id="result">PENDING</div>
  <div id="inspector"><div class="field"><label>글상자 폭 mm</label><input id="widthInput" value="90"></div></div>
  <div id="artboard">
    <div class="design-object design-text selected" data-id="title1" style="left:69px;top:99px;width:270px;font-family:Arial,sans-serif;font-size:32px"><div class="design-text-inner"><span class="editable-text">안정성 점검</span></div></div>
  </div>
  <script src="/js/design-editor/text-auto-fit.js?v=20260826-2"></script>
  <script src="/js/design-editor/direct-resize-handles.js?v=20260901-1"></script>
  <script src="/js/design-editor/stability-guards.js?v=20260901-1"></script>
  <script>
    async function runStabilityAudit(){
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.stabilityAuditSmoke='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
      const pass=message=>{document.body.dataset.stabilityAuditSmoke='pass';result.textContent='PASS: '+message};
      const assert=(condition,message)=>{if(!condition)throw new Error(message)};
      try{
        assert(window.DesignEditorTextAutoFit,'text auto fit runtime missing');
        assert(window.DesignEditorDirectResize,'direct resize runtime missing');
        assert(window.DesignEditorStabilityGuards,'stability guard runtime missing');
        const entry=project.surfaces[0].elements[0];

        window.DesignEditorTextAutoFit.sync();
        window.DesignEditorDirectResize.sync();
        window.DesignEditorStabilityGuards.sync();
        assert(document.querySelectorAll('.design-direct-resize-handle').length===2,'direct text resize handles missing');

        const legacy=document.createElement('button');legacy.className='phase3-resize-handle';document.querySelector('[data-id="title1"]').appendChild(legacy);
        window.DesignEditorStabilityGuards.sync();
        assert(!document.querySelector('.phase3-resize-handle'),'legacy resize handle was not removed');

        const startWidth=entry.w;
        const handle=document.querySelector('.design-direct-resize-handle[data-resize-dir="e"]');
        assert(handle,'east direct resize handle missing');
        handle.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:11,button:0,clientX:300,clientY:120}));
        document.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId:11,buttons:1,clientX:360,clientY:120}));
        document.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:11,button:0,clientX:360,clientY:120}));
        await Promise.resolve();
        assert(entry.w>startWidth+10,'direct text width drag did not resize');
        assert(entry.textBoxWidthMode==='manual','direct resize did not persist manual width mode');
        const manualWidth=entry.w;

        const text=document.querySelector('.editable-text');
        entry.text='직접 조절한 폭은 이후 글자가 길어져도 자동 맞춤이 덮어쓰면 안 됩니다 ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        text.textContent=entry.text;text.dispatchEvent(new Event('input',{bubbles:true}));
        window.DesignEditorTextAutoFit.sync();
        assert(Math.abs(entry.w-manualWidth)<.1,'auto fit overwrote direct manual width');
        window.DesignEditorStabilityGuards.sync();
        assert(document.documentElement.dataset.designDirectResize==='1','direct resize stability marker missing');
        assert(!document.querySelector('.phase3-resize-handle'),'legacy resize handle returned');
        document.body.dataset.finalWidth=entry.w.toFixed(2);
        document.body.dataset.widthMode=entry.textBoxWidthMode;
        document.body.dataset.stabilityStage=window.DesignEditorStabilityGuards.stage;
        pass('direct resize keeps manual text width and removes legacy resize conflicts');
      }catch(error){fail(error)}
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',runStabilityAudit,{once:true});else runStabilityAudit();
  </script>
</body>
</html>
