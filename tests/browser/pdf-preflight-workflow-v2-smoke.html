<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>PDF Preflight Workflow V2 Smoke</title><style>.preflight-filter-hidden{display:none!important}</style><script>history.replaceState(null,'','/pdf-preflight/index.html?preflight-v2-smoke=1');</script></head><body data-preflight-v2-smoke="pending"><section id="results" style="display:block"><div id="resSummary">검사 완료</div><div id="checksGrid"><div class="check-card" id="passCard"><span class="check-badge pass">✓</span><div><div class="check-label">정상 항목</div><div class="check-detail">문제 없음</div></div></div><div class="check-card" id="warnCard"><span class="check-badge warning">!</span><div><div class="check-label">확인 항목</div><div class="check-detail">확인 필요</div></div></div><div class="check-card" id="failCard"><span class="check-badge fail">×</span><div><div class="check-label">문제 항목</div><div class="check-detail">수정 필요</div></div></div></div></section><div id="result">PENDING</div><script src="/js/pdf-preflight/workflow-v2.js?v=smoke"></script><script>(async()=>{const result=document.getElementById('result'),assert=(v,m)=>{if(!v)throw new Error(m)},wait=async(p,l)=>{for(let i=0;i<100;i++){if(p())return;await new Promise(r=>setTimeout(r,20))}throw new Error('timeout: '+l)};try{await wait(()=>window.PdfPreflightWorkflowV2,'api');window.PdfPreflightWorkflowV2.refresh();const grid=document.getElementById('checksGrid'),cards=[...grid.querySelectorAll(':scope>.check-card')];assert(cards[0].id==='failCard'&&cards[1].id==='warnCard'&&cards[2].id==='passCard','severity order wrong');const bar=document.getElementById('preflightPriorityV2');assert(bar,'priority toolbar missing');assert(bar.querySelector('[data-filter="fail"]').textContent.includes('1'),'fail count wrong');assert(bar.querySelector('[data-filter="warning"]').textContent.includes('1'),'warning count wrong');assert(bar.querySelector('[data-filter="pass"]').textContent.includes('1'),'pass count wrong');window.PdfPreflightWorkflowV2.setFilter('warning');assert(document.getElementById('warnCard').classList.contains('preflight-filter-hidden')===false,'warning hidden');assert(document.getElementById('failCard').classList.contains('preflight-filter-hidden'),'fail not filtered');assert(document.getElementById('failCard').textContent.includes('우선 수정 필요'),'priority label missing');document.body.dataset.preflightV2Smoke='pass';result.textContent='PASS: preflight severity ordering, counts and filters';}catch(error){document.body.dataset.preflightV2Smoke='fail';result.textContent='FAIL: '+String(error.message||error)}})();</script></body></html>
