<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Design Editor Canvas Viewport Smoke</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}.hidden{display:none!important}
    #editorShell{width:920px;height:680px;display:grid;grid-template-columns:180px 1fr 180px}
    .editor-main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
    .editor-toolbar{height:48px;flex:0 0 48px}.editor-footer{height:34px;flex:0 0 34px}
    .artboard-viewport{position:relative;flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:36px;background:#eef2f6}
    .artboard{position:relative;flex:0 0 auto;background:#fff}.design-object{position:absolute;min-height:10px}.design-text-inner{display:flex}.editable-text{display:block;flex:1}.trim-guide,.safe-guide,.fold-guide,.panel-guide-label{position:absolute}
  </style>
</head>
<body data-canvas-viewport-status="pending">
  <div id="result">PENDING</div>
  <div id="authLoading"></div>
  <main id="startScreen"></main>
  <main id="editorShell" class="hidden">
    <aside class="sidebar"><div id="documentTitle"></div><div id="documentMeta"></div><div id="presetGrid"></div><button id="resumeDraftBtn"></button></aside>
    <section class="editor-main">
      <div class="editor-toolbar"><div id="surfaceTabs"></div><span id="saveState"></span></div>
      <div id="artboardViewport" class="artboard-viewport"><div id="artboard" class="artboard"></div></div>
      <div class="editor-footer"><span id="editorStatus"></span></div>
    </section>
    <aside><section id="inspector"></section><div id="layerList"></div></aside>
  </main>
  <script>
    const role=(label,size,weight,align='left',color='#172033')=>({label,size,weight,align,color});
    const preset={id:'test-a4',group:'테스트',name:'A4 테스트',description:'viewport smoke',width:210,height:297,bleed:3,safe:8,surfaces:[{id:'front',label:'앞면',folds:[],panels:[]}]};
    window.DesignEditorPresets={
      ROLE_PRESETS:{title:role('제목',30,800,'center','#12396d'),subtitle:role('부제',18,700,'center'),body:role('본문',12,400),info:role('정보',10,500)},
      get(id){return id===preset.id?JSON.parse(JSON.stringify(preset)):null;},
      all(){return [JSON.parse(JSON.stringify(preset))];}
    };
  </script>
  <script src="/js/design-editor/app.js"></script>
  <script src="/js/design-editor/shared/canvas-viewport-toolbar.js"></script>
  <script>
    (async()=>{
      const result=document.getElementById('result');
      const fail=error=>{document.body.dataset.canvasViewportStatus='fail';result.textContent='FAIL: '+String(error?.stack||error?.message||error)};
      const pass=message=>{document.body.dataset.canvasViewportStatus='pass';result.textContent='PASS: '+message};
      const assert=(condition,message)=>{if(!condition)throw new Error(message)};
      const waitFor=async(predicate,label,timeout=7000)=>{const start=Date.now();while(Date.now()-start<timeout){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,25))}throw new Error('timeout: '+label)};
      const near=(actual,expected,tolerance=1)=>Math.abs(actual-expected)<=tolerance;
      try{
        await waitFor(()=>window.DesignEditorApp?.viewport?.stage==='design-editor-viewport-api-v1','viewport API');
        await waitFor(()=>window.DesignEditorCanvasViewportToolbar?.stage==='design-editor-canvas-viewport-toolbar-v1','viewport toolbar module');
        window.DesignEditorApp.startProject('test-a4');
        await waitFor(()=>document.getElementById('designCanvasViewportToolbar'),'toolbar mount');
        const api=window.DesignEditorApp.viewport;
        const viewport=document.getElementById('artboardViewport');
        const artboard=document.getElementById('artboard');
        const toolbar=document.getElementById('designCanvasViewportToolbar');
        const input=toolbar.querySelector('[data-canvas-zoom-value]');
        const fitButton=toolbar.querySelector('[data-canvas-view-action="fit"]');
        const actualButton=toolbar.querySelector('[data-canvas-view-action="actual"]');
        const plusButton=toolbar.querySelector('[data-canvas-view-action="zoom-in"]');
        const minusButton=toolbar.querySelector('[data-canvas-view-action="zoom-out"]');
        const centerButton=toolbar.querySelector('[data-canvas-view-action="center"]');
        assert(api.getState().mode==='fit','new project must start in fit mode');
        assert(document.documentElement.dataset.designCanvasViewportToolbar==='v1','toolbar dataset missing');
        assert(document.getElementById('designCanvasViewportToolbarStyles'),'toolbar styles missing');

        actualButton.click();
        await waitFor(()=>api.getState().mode==='manual'&&api.getState().percent===100,'100 percent');
        const pxPerMm=96/25.4;
        assert(near(artboard.getBoundingClientRect().width,(210+6)*pxPerMm,1.2),'100% artboard width must use CSS 96dpi scale');
        assert(input.value==='100','toolbar input must follow actual zoom');

        plusButton.click();
        await waitFor(()=>api.getState().percent===125,'zoom in');
        minusButton.click();
        await waitFor(()=>api.getState().percent===100,'zoom out');
        input.value='150';input.dispatchEvent(new Event('change',{bubbles:true}));
        await waitFor(()=>api.getState().percent===150,'manual 150 percent');
        assert(artboard.getBoundingClientRect().width>1200,'150% should create a scrollable A4 canvas');

        const rect=artboard.getBoundingClientRect();
        const dbl=new MouseEvent('dblclick',{bubbles:true,clientX:rect.left+(3+100)*api.getState().ppm,clientY:rect.top+(3+100)*api.getState().ppm});
        artboard.dispatchEvent(dbl);
        await waitFor(()=>window.DesignEditorApp.project.surfaces[0].elements.length===1,'text element creation');
        const entry=window.DesignEditorApp.project.surfaces[0].elements[0];
        const node=artboard.querySelector('.design-object');
        const beforeX=entry.x;
        node.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,button:0,pointerId:7,clientX:220,clientY:220}));
        document.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,pointerId:7,clientX:250,clientY:220}));
        document.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:7,clientX:250,clientY:220}));
        const expectedMove=30/api.getState().ppm;
        assert(near(entry.x-beforeX,expectedMove,.35),'drag coordinates must use the active viewport ppm');
        document.body.dataset.canvasViewportDragMm=(entry.x-beforeX).toFixed(2);

        centerButton.click();
        await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
        assert(viewport.scrollLeft>0&&viewport.scrollTop>0,'center must scroll a large manual canvas to its center');

        viewport.style.width='480px';viewport.style.height='360px';
        window.dispatchEvent(new Event('resize'));
        await waitFor(()=>api.getState().percent===150,'manual zoom survives resize');
        fitButton.click();
        await waitFor(()=>api.getState().mode==='fit','fit mode restore');
        assert(fitButton.getAttribute('aria-pressed')==='true','fit button must expose active state');
        assert(api.getState().percent!==150,'fit must recalculate scale after viewport resize');

        document.body.dataset.canvasViewportFitPercent=String(api.getState().percent);
        document.body.dataset.canvasViewportActualWidth=String(Math.round((210+6)*pxPerMm));
        document.body.dataset.canvasViewportToolbar='pass';
        document.body.dataset.canvasViewportManualResize='pass';
        document.body.dataset.canvasViewportCoordinates='pass';
        pass('fit, 100%, zoom steps, manual resize persistence, center, drag scale');
      }catch(error){fail(error)}
    })();
  </script>
</body>
</html>
