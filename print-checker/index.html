<!doctype html>
<html lang="ko" data-program-studio-print-checker="1" style="visibility:hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>인쇄물 제작·검토 · Program Studio</title>
  <meta name="description" content="표지·리플렛·전단지·초대장·소책자의 간단한 글씨·도형·이미지 배치 작업과 재단 규격, 도련, 안전 영역, 책등, 접지 검토를 한곳에서 처리합니다.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="/css/print-checker.css?v=20260907-4">
  <link rel="stylesheet" href="/css/print-checker-production-guides.css?v=20260911-2">
  <link rel="stylesheet" href="/css/print-checker-page-layout-v2.css?v=20260911-2">
  <link rel="stylesheet" href="/css/print-checker-leaflet-popover.css?v=20260911-1">
  <link rel="stylesheet" href="/css/print-checker-content-preflight.css?v=20260910-1">
  <link rel="stylesheet" href="/css/print-checker-simple-editor.css?v=20260911-1">
</head>
<body class="print-checker-page" data-print-checker-workspace="review">
  <div class="app-layout">
    <aside class="sidebar" aria-label="인쇄물 제작·검토 설정">
      <nav class="sb-nav">
        <a class="sb-nav-back" href="/">← 홈</a>
        <span class="sb-nav-title">인쇄물 제작·검토</span>
        <div class="sb-nav-user">
          <span class="sb-nav-name" id="userName">확인 중…</span>
          <button class="sb-nav-logout" id="logoutBtn" type="button" aria-label="로그아웃">로그아웃</button>
        </div>
      </nav>

      <section class="sb-section">
        <div class="sb-kicker">STEP 1</div>
        <div class="sb-title">제품 유형 선택</div>
        <div id="productGrid" role="group" aria-label="제품 유형"></div>
      </section>

      <section class="sb-section" id="specSection" hidden>
        <div class="sb-kicker">STEP 2</div>
        <div class="sb-title">사양 입력</div>
        <form id="specForm" onsubmit="return false"></form>
      </section>

      <section class="sb-section" id="fileCompareSection">
        <div class="sb-kicker">STEP 3 · 선택</div>
        <div class="sb-title">완성 파일 대조</div>
        <div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="PDF 또는 이미지 파일 업로드">
          <div class="upload-icon" aria-hidden="true">📂</div>
          <div class="upload-title">파일 올리기</div>
          <div class="upload-sub">PDF·PNG·JPEG·WEBP<br>클릭하거나 끌어다 놓으세요</div>
          <div class="upload-filename" id="uploadFilename" style="display:none"></div>
        </div>
        <input type="file" id="fileInput" accept=".pdf,application/pdf,image/png,image/jpeg,image/webp">
        <span class="file-info" id="uploadFileInfo" hidden></span>
        <span class="upload-error" id="uploadError" role="alert" hidden></span>
      </section>

      <section class="adj-panel" id="adjPanel" hidden aria-label="미리보기 수동 조절">
        <div class="adj-kicker">미리보기 조절</div>
        <div class="side-select-row" id="sideSelectRow" hidden>
          <span class="side-label">PDF 면 선택</span>
          <button class="side-btn active" data-side="front" type="button">앞면 · PDF 1p</button>
          <button class="side-btn" data-side="back" type="button">뒷면 · PDF 2p</button>
        </div>
        <label class="adj-check-row"><input type="checkbox" id="fileHasBleed"><span>파일에 도련(bleed) 포함</span></label>
        <div class="adj-row"><span class="adj-label">가로 이동</span><input type="range" class="adj-slider" id="adjX" min="-80" max="80" value="0" step="1"><span class="adj-val" id="adjXVal">0 px</span></div>
        <div class="adj-row"><span class="adj-label">세로 이동</span><input type="range" class="adj-slider" id="adjY" min="-80" max="80" value="0" step="1"><span class="adj-val" id="adjYVal">0 px</span></div>
        <div class="adj-row"><span class="adj-label">크기 조절</span><input type="range" class="adj-slider" id="adjScale" min="70" max="130" value="100" step="1"><span class="adj-val" id="adjScaleVal">100%</span></div>
        <button class="reset-adj-btn" id="resetAdjBtn" type="button">조절 초기화</button>
      </section>

      <div class="action-row" id="reviewActionRow">
        <button class="run-btn" id="runBtn" type="button">검토 실행</button>
        <button class="reset-btn" id="resetBtn" type="button">초기화</button>
      </div>
    </aside>

    <main class="canvas-area" id="printCheckerMain">
      <div class="preview-zoom-toolbar" id="previewZoomToolbar" role="group" aria-label="캔버스 미리보기 확대 축소">
        <button class="preview-zoom-btn" id="previewZoomOut" type="button" aria-label="미리보기 축소">−</button>
        <span class="preview-zoom-label" id="previewZoomLabel" aria-live="polite">100%</span>
        <button class="preview-zoom-btn" id="previewZoomIn" type="button" aria-label="미리보기 확대">+</button>
        <button class="preview-zoom-btn zoom-reset" id="previewZoomReset" type="button" aria-label="미리보기를 화면에 맞춤" aria-pressed="true">맞춤</button>
      </div>

      <section class="canvas-wrap" aria-label="인쇄물 미리보기">
        <canvas id="previewCanvas"></canvas>
        <div class="file-info-bar" id="canvasFileInfo" hidden></div>
      </section>

      <section class="info-card" id="leafletGuide" hidden></section>
      <section class="info-card" id="impositionGuide" hidden></section>

      <section class="content-preflight-wrap" id="contentPreflightSection" hidden aria-live="polite">
        <div class="content-preflight-head">
          <div>
            <div class="content-preflight-kicker">AUTO PREFLIGHT</div>
            <h3 class="content-preflight-title">자동 내용·인쇄 검사</h3>
          </div>
          <div class="content-preflight-note">PDF 문자의 실제 위치와 감지 가능한 색상 명령, 이미지 유효 DPI를 자동 대조합니다.</div>
        </div>
        <div class="content-preflight-summary" id="contentPreflightSummary"></div>
        <div class="content-preflight-grid" id="contentPreflightGrid"></div>
      </section>

      <section class="report-wrap" id="reportSection" hidden aria-live="polite">
        <div class="report-kicker">STEP 4 · 검토 결과</div>
        <div id="reportSummary" class="report-summary"></div>
        <div id="reportGrid"></div>
      </section>
    </main>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script defer src="/js/firebase-config.js"></script>
  <script defer src="/js/pdf-daily-free.js?v=20260907-2"></script>
  <script defer src="/js/print-checker/access.js?v=20260907-2"></script>
  <script defer src="/js/print-checker/canvas-dimension-cleanup.js?v=20260911-1"></script>
  <script defer src="/js/print-checker/print-checker.js?v=20260904-2"></script>
  <script defer src="/js/print-checker/spine-calculator-v2.js?v=20260910-2"></script>
  <script defer src="/js/print-checker/file-relative-preview.js?v=20260907-5"></script>
  <script defer src="/js/print-checker/production-guides-v2.js?v=20260911-5"></script>
  <script defer src="/js/print-checker/preview-zoom.js?v=20260911-3"></script>
  <script defer src="/js/print-checker/content-preflight.js?v=20260910-1"></script>
  <script defer src="/js/print-checker/spine-live-dimension.js?v=20260911-6"></script>
  <script defer src="/js/print-checker/live-summary-cleanup.js?v=20260911-1"></script>
  <script defer src="/js/print-checker/reliability.js?v=20260904-1"></script>
  <script defer src="/js/print-checker/defaults-live.js?v=20260911-3"></script>
  <script defer src="/js/print-checker/booklet-layout-only.js?v=20260910-3"></script>
  <script defer src="/js/print-checker/page-layout-v2.js?v=20260910-2"></script>
  <script defer src="/js/print-checker/leaflet-layout-popover.js?v=20260911-1"></script>
  <script defer src="/js/print-checker/product-transition-v1.js?v=20260911-1"></script>
  <script defer src="/js/print-checker/simple-editor.js?v=20260911-1"></script>
  <script>
    (() => {
      const url = new URL(location.href);
      if (!url.searchParams.get('product')) {
        url.searchParams.set('product', 'cover');
        history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
      }
    })();
  </script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const logout = document.getElementById('logoutBtn');
      logout?.addEventListener('click', () => window.auth?.signOut().then(() => location.replace('/')));
      window.auth?.onAuthStateChanged(user => {
        if (!user) return;
        const name = document.getElementById('userName');
        if (name) name.textContent = user.displayName || user.email || '사용자';
      });
    });
  </script>
</body>
</html>
