<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 주문제작 문의 - WebApp Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; }
        /* 채팅 버블 */
        .bubble-me    { background: #2563eb; color: #fff; border-radius: 18px 18px 4px 18px; }
        .bubble-admin { background: #fff; color: #1e293b; border-radius: 18px 18px 18px 4px; border: 1px solid #e2e8f0; }
        .chat-wrap    { max-height: calc(100vh - 280px); overflow-y: auto; scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
        #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: .5rem 1.2rem; border-radius: 999px; font-size: .8rem; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
        #toast.show { opacity: 1; }
        .step { display: none; }
        .step.show { display: block; }
        .badge-new { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    </style>
</head>
<body>

<!-- 헤더 -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center gap-3">
        <a href="../index.html" class="text-slate-400 hover:text-blue-600 transition-colors">
            <i class="fas fa-chevron-left text-sm"></i>
        </a>
        <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center">
            <i class="fas fa-cube text-white text-xs"></i>
        </div>
        <span class="font-bold text-slate-800 text-sm">WebApp<span class="text-blue-600">Studio</span></span>
        <div class="flex-1"></div>
        <span class="text-xs text-slate-400">1:1 주문제작 문의</span>
    </div>
</header>

<div class="max-w-2xl mx-auto px-4 py-8">

    <!-- ── STEP 1: 접수 폼 ── -->
    <div id="step1" class="step show">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-comments text-blue-600 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">주문제작 문의</h1>
            <p class="text-slate-500 text-sm leading-relaxed">
                이름과 연락처만 남겨주시면 바로 1:1 채팅으로 상담을 도와드립니다.<br>
                원하시는 프로그램을 자유롭게 설명해 주세요.
            </p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <form id="startForm" onsubmit="startChat(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">이름 <span class="text-red-400">*</span></label>
                    <input type="text" id="inName" placeholder="홍길동" required maxlength="20"
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">연락처 <span class="text-red-400">*</span></label>
                    <input type="tel" id="inPhone" placeholder="010-0000-0000" required maxlength="20"
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">첫 메시지</label>
                    <textarea id="inFirstMsg" rows="3" placeholder="어떤 프로그램이 필요하신지 간단히 적어주세요. (업종, 필요한 기능 등)"
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50 transition-all resize-none"></textarea>
                </div>

                <!-- 문의 유형 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">문의 유형</label>
                    <div class="flex gap-2 flex-wrap">
                        <label class="flex items-center gap-2 px-3 py-2 border border-slate-200 rounded-lg cursor-pointer hover:border-blue-300 transition-colors text-sm">
                            <input type="radio" name="inqType" value="custom" checked class="text-blue-600"> 신규 주문제작
                        </label>
                        <label class="flex items-center gap-2 px-3 py-2 border border-slate-200 rounded-lg cursor-pointer hover:border-blue-300 transition-colors text-sm">
                            <input type="radio" name="inqType" value="modify"> 기존 프로그램 수정
                        </label>
                        <label class="flex items-center gap-2 px-3 py-2 border border-slate-200 rounded-lg cursor-pointer hover:border-blue-300 transition-colors text-sm">
                            <input type="radio" name="inqType" value="consult"> 기능 상담
                        </label>
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane"></i> 상담 시작하기
                </button>
            </form>
        </div>

        <!-- 기존 문의 이어보기 -->
        <div class="mt-4 text-center">
            <button onclick="showResume()" class="text-sm text-slate-400 hover:text-blue-600 transition-colors">
                <i class="fas fa-history mr-1"></i>이전 문의 이어보기
            </button>
        </div>

        <!-- 이어보기 입력 -->
        <div id="resumeArea" class="hidden mt-3 bg-white rounded-xl border border-slate-200 p-4">
            <p class="text-xs text-slate-500 mb-2">문의 번호를 입력하세요</p>
            <div class="flex gap-2">
                <input id="resumeId" type="text" placeholder="예) INQ-abc123" class="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-400 transition-colors">
                <button onclick="resumeChat()" class="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 transition-colors">이동</button>
            </div>
        </div>
    </div>

    <!-- ── STEP 2: 채팅방 ── -->
    <div id="step2" class="step">
        <!-- 문의 정보 바 -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-4 flex items-center justify-between gap-3">
            <div>
                <p class="font-bold text-slate-800 text-sm" id="chatTitle">문의 로딩 중...</p>
                <p class="text-xs text-slate-400 mt-0.5">문의번호: <span id="chatId" class="font-mono text-blue-600"></span></p>
            </div>
            <div class="flex items-center gap-2">
                <span id="chatStatus" class="text-xs px-2.5 py-1 rounded-full font-semibold bg-blue-100 text-blue-700">접수완료</span>
                <button onclick="copyId()" class="text-xs text-slate-400 hover:text-blue-600 transition-colors" title="문의번호 복사">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
        </div>

        <!-- 안내 배너 -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mb-4 flex gap-2.5">
            <i class="fas fa-info-circle text-amber-500 mt-0.5 flex-shrink-0"></i>
            <div class="text-xs text-amber-800 leading-relaxed">
                <strong>문의번호를 저장해두세요!</strong><br>
                이 번호로 언제든지 채팅을 이어볼 수 있습니다. 담당자가 확인 후 빠르게 답변드립니다.
            </div>
        </div>

        <!-- 채팅 영역 -->
        <div class="bg-white rounded-2xl border border-slate-200 flex flex-col" style="height: calc(100vh - 340px); min-height: 320px;">
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 chat-wrap"></div>

            <!-- 메시지 입력 -->
            <div class="border-t border-slate-100 p-3 flex gap-2">
                <textarea id="msgInput" rows="1" placeholder="메시지를 입력하세요... (Enter = 전송, Shift+Enter = 줄바꿈)"
                    class="flex-1 px-3 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-400 transition-colors resize-none"
                    style="max-height:100px; overflow-y:auto"
                    oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
                <button onclick="sendMsg()" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-colors flex-shrink-0">
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>

        <!-- 새로고침 안내 -->
        <p class="text-center text-xs text-slate-400 mt-3">
            <i class="fas fa-sync-alt mr-1"></i>새 답변은 <span id="refreshTimer">30</span>초마다 자동으로 확인합니다.
        </p>
    </div>
</div>

<div id="toast"></div>

<script>
/* ── 스토리지 헬퍼 ── */
const IQ_KEY = 'was_inquiries';
function loadAll() { try { return JSON.parse(localStorage.getItem(IQ_KEY) || '[]'); } catch { return []; } }
function saveAll(arr) { localStorage.setItem(IQ_KEY, JSON.stringify(arr)); }
function genId() { return 'INQ-' + Date.now().toString(36) + Math.random().toString(36).substr(2,4); }

let curInqId = null;
let pollTimer = null;
let countdown = 30;

/* ── STEP 1: 문의 시작 ── */
function startChat(e) {
    e.preventDefault();
    const name    = document.getElementById('inName').value.trim();
    const phone   = document.getElementById('inPhone').value.trim();
    const firstMsg= document.getElementById('inFirstMsg').value.trim();
    const type    = document.querySelector('input[name="inqType"]:checked').value;
    const typeLabel = { custom:'신규 주문제작', modify:'기존 프로그램 수정', consult:'기능 상담' };

    const inq = {
        id: genId(),
        name, phone,
        type, typeLabel: typeLabel[type],
        status: '접수완료',
        createdAt: new Date().toISOString(),
        messages: [],
        isNew: true   // 관리자 알림용
    };

    if (firstMsg) {
        inq.messages.push({ from: 'user', name, text: firstMsg, time: new Date().toISOString() });
    } else {
        inq.messages.push({ from: 'user', name, text: `안녕하세요! ${typeLabel[type]} 문의드립니다.`, time: new Date().toISOString() });
    }

    // 자동 답변 메시지
    inq.messages.push({
        from: 'admin', name: '담당자',
        text: `${name}님, 안녕하세요! 문의해 주셔서 감사합니다 😊\n접수가 완료되었습니다. 담당자가 확인 후 빠르게 답변드릴게요.\n\n문의번호: ${inq.id}\n(이 번호로 언제든지 채팅을 이어보실 수 있습니다.)`,
        time: new Date(Date.now() + 500).toISOString()
    });

    const all = loadAll();
    all.unshift(inq);
    saveAll(all);

    openChat(inq.id);
}

/* ── 채팅방 열기 ── */
function openChat(id) {
    curInqId = id;
    document.getElementById('step1').classList.remove('show');
    document.getElementById('step2').classList.add('show');
    renderChat();
    startPoll();
}

function renderChat() {
    const all = loadAll();
    const inq = all.find(x => x.id === curInqId);
    if (!inq) { toast('문의를 찾을 수 없습니다.'); return; }

    document.getElementById('chatTitle').textContent = inq.name + '님의 문의 (' + inq.typeLabel + ')';
    document.getElementById('chatId').textContent = inq.id;

    const statusMap = { 접수완료:'bg-blue-100 text-blue-700', 검토중:'bg-amber-100 text-amber-700', 상담중:'bg-purple-100 text-purple-700', 견적발송:'bg-green-100 text-green-700', 진행중:'bg-teal-100 text-teal-700', 완료:'bg-slate-100 text-slate-600' };
    const statusEl = document.getElementById('chatStatus');
    statusEl.textContent = inq.status;
    statusEl.className = 'text-xs px-2.5 py-1 rounded-full font-semibold ' + (statusMap[inq.status] || 'bg-slate-100 text-slate-600');

    const box = document.getElementById('chatMessages');
    box.innerHTML = inq.messages.map(m => {
        const isMe = m.from === 'user';
        const time = new Date(m.time).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
        const txt  = m.text.replace(/\n/g,'<br>');
        return isMe
            ? `<div class="flex justify-end gap-2 items-end">
                <span class="text-xs text-slate-400 flex-shrink-0">${time}</span>
                <div class="bubble-me px-4 py-2.5 text-sm max-w-xs leading-relaxed">${txt}</div>
               </div>`
            : `<div class="flex justify-start gap-2 items-end">
                <div class="w-7 h-7 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-headset text-white text-xs"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-400 mb-1">담당자</p>
                    <div class="bubble-admin px-4 py-2.5 text-sm max-w-xs leading-relaxed">${txt}</div>
                </div>
                <span class="text-xs text-slate-400 flex-shrink-0">${time}</span>
               </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
}

/* ── 메시지 전송 ── */
function sendMsg() {
    const input = document.getElementById('msgInput');
    const text  = input.value.trim();
    if (!text) return;

    const all = loadAll();
    const idx = all.findIndex(x => x.id === curInqId);
    if (idx < 0) return;

    all[idx].messages.push({ from: 'user', name: all[idx].name, text, time: new Date().toISOString() });
    all[idx].isNew = true; // 관리자 알림용
    saveAll(all);

    input.value = '';
    input.style.height = 'auto';
    renderChat();
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

/* ── 폴링 (새 답변 확인) ── */
function startPoll() {
    clearInterval(pollTimer);
    countdown = 30;
    pollTimer = setInterval(() => {
        countdown--;
        const el = document.getElementById('refreshTimer');
        if (el) el.textContent = countdown;
        if (countdown <= 0) {
            renderChat();
            countdown = 30;
        }
    }, 1000);
}

/* ── 이어보기 ── */
function showResume() {
    document.getElementById('resumeArea').classList.toggle('hidden');
}
function resumeChat() {
    const id = document.getElementById('resumeId').value.trim();
    const all = loadAll();
    if (!all.find(x => x.id === id)) { toast('문의번호를 찾을 수 없습니다.'); return; }
    openChat(id);
}

/* ── 문의번호 복사 ── */
function copyId() {
    navigator.clipboard.writeText(curInqId).then(() => toast('문의번호가 복사되었습니다.')).catch(() => toast(curInqId));
}

/* ── 토스트 ── */
function toast(msg, d = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), d);
}
</script>
</body>
</html>
