name: Connect cover image tools
on:
  push:
    paths:
      - 'js/cover-editor-image-tools.js'
      - '.github/workflows/connect-cover-image-tools.yml'
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert image tools script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/perfect-binding-cover.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="../js/cover-editor-image-tools.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit connection
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/perfect-binding-cover.html
          git commit -m "chore: load cover image tools"
          git push
