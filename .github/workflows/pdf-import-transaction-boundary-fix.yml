name: PDF import transaction boundary patch

on:
  push:
    branches:
      - agent/pdf-import-transaction-safety-stage1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/pdf-import-transaction-safety-stage1
          fetch-depth: 0
      - name: Harden failed commit cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path('js/pdf-editor/import-transaction-safety.js')
          source = path.read_text(encoding='utf-8')
          old_commit = "  function commitStagedFile(stage) {\n    const before = captureEditorState();\n"
          new_commit = "  function commitStagedFile(stage) {\n    const before = captureEditorState();\n    before.nextId = stage.startId;\n"
          if source.count(old_commit) != 1:
              raise SystemExit('commit snapshot boundary not found')
          source = source.replace(old_commit, new_commit, 1)
          old_try = "    const hadExistingWork = parsedPages.length > 0 || uploadedFiles.length > 0;\n    try {\n      const stage = await stagePdfFile(file, requestedMode);\n      commitStagedFile(stage);\n"
          new_try = "    const hadExistingWork = parsedPages.length > 0 || uploadedFiles.length > 0;\n    let stage = null;\n    let committed = false;\n    try {\n      stage = await stagePdfFile(file, requestedMode);\n      commitStagedFile(stage);\n      committed = true;\n"
          if source.count(old_try) != 1:
              raise SystemExit('transaction start boundary not found')
          source = source.replace(old_try, new_try, 1)
          old_catch = "    } catch (error) {\n      console.error(error);\n      const pageText = error.pageNumber ? ` · ${error.pageNumber}페이지에서 중단` : '';\n"
          new_catch = "    } catch (error) {\n      if (stage && !committed) {\n        _nextId = stage.startId;\n        releaseStagedPages(stage.pages);\n        try { await stage.pdfDocument?.destroy?.(); } catch (_) {}\n      }\n      console.error(error);\n      const pageText = error.pageNumber ? ` · ${error.pageNumber}페이지에서 중단` : '';\n"
          if source.count(old_catch) != 1:
              raise SystemExit('transaction failure boundary not found')
          source = source.replace(old_catch, new_catch, 1)
          path.write_text(source, encoding='utf-8')
      - name: Commit boundary fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pdf-editor/import-transaction-safety.js
          git commit -m "PDF 파일 커밋 실패 메모리와 ID 복구"
          git push origin HEAD:agent/pdf-import-transaction-safety-stage1
