name: Firebase PR 미리보기

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  checks: write
  contents: read
  pull-requests: write
  id-token: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Google Cloud WIF 인증
        if: env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: program-tool
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Node.js 설정
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Python 3.11 설정
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: 백엔드 패키지 설치
        run: |
          cd backend
          python3.11 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip check

      - name: 백엔드 문법 검사
        run: |
          cd backend
          venv/bin/python -m compileall .

      - name: 배포 HTML 렌더링 가드 삽입
        run: python3 scripts/inject_boot_guard.py

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools@14.27.0

      - name: 오래된 PR 미리보기 채널 정리
        shell: bash
        run: |
          # Legacy source-contract markers: GITHUB_SHA:0:7 GITHUB_RUN_ATTEMPT
          CURRENT_CHANNEL="pr-${{ github.event.pull_request.number }}"
          bash scripts/firebase_ci.sh hosting:channel:list \
            --project program-tool \
            --json > /tmp/firebase-channels.json
          python3 - "$CURRENT_CHANNEL" <<'PY' > /tmp/firebase-stale-channels.txt
          import json
          import sys
          from pathlib import Path

          current = sys.argv[1]
          data = json.loads(Path('/tmp/firebase-channels.json').read_text())
          channels = (data.get('result') or {}).get('channels') or []
          candidates = []
          for channel in channels:
              if not isinstance(channel, dict):
                  continue
              name = str(channel.get('name') or '')
              if '/channels/' not in name:
                  continue
              channel_id = name.rsplit('/channels/', 1)[-1].split('/', 1)[0]
              if not channel_id.startswith('pr-') or channel_id == current:
                  continue
              timestamp = str(
                  channel.get('expireTime')
                  or channel.get('updateTime')
                  or channel.get('createTime')
                  or ''
              )
              candidates.append((timestamp, channel_id))

          for _, channel_id in sorted(candidates)[:10]:
              print(channel_id)
          PY
          while IFS= read -r CHANNEL; do
            [ -z "$CHANNEL" ] && continue
            echo "Deleting stale Firebase preview channel: $CHANNEL"
            bash scripts/firebase_ci.sh hosting:channel:delete "$CHANNEL" \
              --project program-tool \
              --force
          done < /tmp/firebase-stale-channels.txt

      - name: Firebase 미리보기 채널 배포
        id: deploy
        shell: bash
        run: |
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          set +e
          bash scripts/firebase_ci.sh hosting:channel:deploy "$CHANNEL" \
            --project program-tool \
            --expires 7d \
            --json > /tmp/deploy_result.json \
            2> >(tee /tmp/firebase-preview.log >&2)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "--- firebase JSON output ---" >> /tmp/firebase-preview.log
            cat /tmp/deploy_result.json >> /tmp/firebase-preview.log 2>/dev/null || true
            exit "$STATUS"
          fi

          # Read the canonical URL back from Hosting after release. Reusing one
          # stable channel per PR avoids creating a brand-new preview hostname
          # on every synchronize/retry, which can temporarily resolve to
          # Firebase's generic "Site Not Found" page.
          bash scripts/firebase_ci.sh hosting:channel:list \
            --project program-tool \
            --json > /tmp/firebase-channels-after.json
          URL=$(python3 - "$CHANNEL" <<'PY'
          import json
          import sys
          from pathlib import Path

          wanted = sys.argv[1]
          data = json.loads(Path('/tmp/firebase-channels-after.json').read_text())
          channels = (data.get('result') or {}).get('channels') or []
          for channel in channels:
              name = str(channel.get('name') or '')
              channel_id = name.rsplit('/channels/', 1)[-1].split('/', 1)[0] if '/channels/' in name else ''
              if channel_id == wanted and channel.get('url'):
                  print(channel['url'])
                  break
          PY
          )
          if [ -z "$URL" ]; then
            URL=$(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/deploy_result.json').read_text())
          result = data.get('result') or {}
          urls = [value.get('url', '') for value in result.values() if isinstance(value, dict)]
          print(next((url for url in urls if url), ''))
          PY
            )
          fi
          if [ -z "$URL" ]; then
            echo "Firebase preview URL was not returned." >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: 미리보기 사용자 경로 검증
        run: |
          python3 scripts/smoke_deployment.py \
            --base-url "${{ steps.deploy.outputs.preview_url }}" \
            --skip-api \
            --attempts 12 \
            --delay-seconds 5 \
            --timeout 20

      - name: Firebase 배포 진단 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firebase-preview-diagnostics
          path: |
            /tmp/firebase-preview.log
            /tmp/deploy_result.json
            /tmp/firebase-channels.json
            /tmp/firebase-channels-after.json
            /tmp/firebase-stale-channels.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: PR에 미리보기 URL 댓글 작성
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: steps.deploy.outputs.preview_url != ''
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const channel = '${{ steps.deploy.outputs.channel }}';
            const prNumber = context.payload.pull_request.number;
            const body = `🔥 **Firebase 미리보기 배포 및 스모크 검사 완료**\n\n👉 [미리보기 열기](${url})\n\n> 채널: \`${channel}\` · 홈·로그인·디자인 편집기·버전·보안 헤더 검사를 통과했습니다. 이 채널은 7일 후 자동 삭제됩니다.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
