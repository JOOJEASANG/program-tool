name: Firebase PR 미리보기

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  checks: write
  contents: read
  pull-requests: write
  id-token: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Google Cloud WIF 인증
        if: env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: program-tool
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Python 3.11 설정
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: 백엔드 패키지 설치
        run: |
          cd backend
          python3.11 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip check

      - name: 백엔드 문법 검사
        run: |
          cd backend
          venv/bin/python -m compileall .

      - name: 배포 HTML 렌더링 가드 삽입
        run: python3 scripts/inject_boot_guard.py

      - name: 호스팅 캐시·보안 정책 계약 검사
        run: python3 scripts/validate_hosting_delivery.py

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools@15.28.1

      - name: 오래된 PR 미리보기 채널 정리
        shell: bash
        run: |
          # Legacy source-contract markers: GITHUB_SHA:0:7 GITHUB_RUN_ATTEMPT
          CURRENT_CHANNEL="pr-${{ github.event.pull_request.number }}"
          bash scripts/firebase_ci.sh hosting:channel:list \
            --project program-tool \
            --json > /tmp/firebase-channels.json
          python3 - "$CURRENT_CHANNEL" <<'PY' > /tmp/firebase-stale-channels.txt
          import json
          import sys
          from pathlib import Path

          current = sys.argv[1]
          data = json.loads(Path('/tmp/firebase-channels.json').read_text())
          channels = (data.get('result') or {}).get('channels') or []
          candidates = []
          for channel in channels:
              if not isinstance(channel, dict):
                  continue
              name = str(channel.get('name') or '')
              if '/channels/' not in name:
                  continue
              channel_id = name.rsplit('/channels/', 1)[-1].split('/', 1)[0]
              if not channel_id.startswith('pr-') or channel_id == current:
                  continue
              timestamp = str(
                  channel.get('expireTime')
                  or channel.get('updateTime')
                  or channel.get('createTime')
                  or ''
              )
              candidates.append((timestamp, channel_id))

          for _, channel_id in sorted(candidates)[:10]:
              print(channel_id)
          PY
          while IFS= read -r CHANNEL; do
            [ -z "$CHANNEL" ] && continue
            echo "Deleting stale Firebase preview channel: $CHANNEL"
            bash scripts/firebase_ci.sh hosting:channel:delete "$CHANNEL" \
              --project program-tool \
              --force
          done < /tmp/firebase-stale-channels.txt

      - name: Firebase 미리보기 채널 배포
        id: deploy
        shell: bash
        run: |
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          set +e
          bash scripts/firebase_ci.sh hosting:channel:deploy "$CHANNEL" \
            --project program-tool \
            --expires 7d \
            --json > /tmp/deploy_result.json \
            2> >(tee /tmp/firebase-preview.log >&2)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "--- firebase JSON output ---" >> /tmp/firebase-preview.log
            cat /tmp/deploy_result.json >> /tmp/firebase-preview.log 2>/dev/null || true
            exit "$STATUS"
          fi

          bash scripts/firebase_ci.sh hosting:channel:list \
            --project program-tool \
            --json > /tmp/firebase-channels-after.json
          URL=$(python3 - "$CHANNEL" <<'PY'
          import json
          import sys
          from pathlib import Path

          wanted = sys.argv[1]
          data = json.loads(Path('/tmp/firebase-channels-after.json').read_text())
          channels = (data.get('result') or {}).get('channels') or []
          for channel in channels:
              name = str(channel.get('name') or '')
              channel_id = name.rsplit('/channels/', 1)[-1].split('/', 1)[0] if '/channels/' in name else ''
              if channel_id == wanted and channel.get('url'):
                  print(channel['url'])
                  break
          PY
          )
          if [ -z "$URL" ]; then
            echo "Firebase preview URL was not returned from channel list." >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: 미리보기 사용자 경로 검증 및 고착 채널 복구
        id: smoke
        shell: bash
        run: |
          PRIMARY_CHANNEL="${{ steps.deploy.outputs.channel }}"
          PRIMARY_URL="${{ steps.deploy.outputs.preview_url }}"

          verify_preview() {
            local url="$1"
            python3 scripts/smoke_deployment.py \
              --base-url "$url" \
              --skip-api \
              --attempts 12 \
              --delay-seconds 5 \
              --timeout 20
          }

          set +e
          verify_preview "$PRIMARY_URL"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "channel=$PRIMARY_CHANNEL" >> "$GITHUB_OUTPUT"
            echo "preview_url=$PRIMARY_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Firebase preview channel stayed unavailable after retries. Recreating it on a fresh recovery channel."
          bash scripts/firebase_ci.sh hosting:channel:delete "$PRIMARY_CHANNEL" \
            --project program-tool \
            --force || true

          RECOVERY_CHANNEL="${PRIMARY_CHANNEL}-r${GITHUB_RUN_ATTEMPT}"
          bash scripts/firebase_ci.sh hosting:channel:delete "$RECOVERY_CHANNEL" \
            --project program-tool \
            --force >/dev/null 2>&1 || true

          set +e
          bash scripts/firebase_ci.sh hosting:channel:deploy "$RECOVERY_CHANNEL" \
            --project program-tool \
            --expires 7d \
            --json > /tmp/firebase-redeploy-result.json \
            2> >(tee -a /tmp/firebase-preview.log >&2)
          REDEPLOY_STATUS=$?
          set -e
          if [ "$REDEPLOY_STATUS" -ne 0 ]; then
            echo "--- firebase recovery JSON output ---" >> /tmp/firebase-preview.log
            cat /tmp/firebase-redeploy-result.json >> /tmp/firebase-preview.log 2>/dev/null || true
            exit "$REDEPLOY_STATUS"
          fi

          bash scripts/firebase_ci.sh hosting:channel:list \
            --project program-tool \
            --json > /tmp/firebase-channels-recovered.json
          RECOVERY_URL=$(python3 - "$RECOVERY_CHANNEL" <<'PY'
          import json
          import sys
          from pathlib import Path

          wanted = sys.argv[1]
          data = json.loads(Path('/tmp/firebase-channels-recovered.json').read_text())
          channels = (data.get('result') or {}).get('channels') or []
          for channel in channels:
              name = str(channel.get('name') or '')
              channel_id = name.rsplit('/channels/', 1)[-1].split('/', 1)[0] if '/channels/' in name else ''
              if channel_id == wanted and channel.get('url'):
                  print(channel['url'])
                  break
          PY
          )
          if [ -z "$RECOVERY_URL" ]; then
            echo "Firebase recovery preview URL was not returned." >&2
            exit 1
          fi

          verify_preview "$RECOVERY_URL"
          echo "channel=$RECOVERY_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "preview_url=$RECOVERY_URL" >> "$GITHUB_OUTPUT"

      - name: 실제 배포 전달 예산·헤더 검증
        run: |
          python3 scripts/verify_preview_delivery.py \
            --base-url "${{ steps.smoke.outputs.preview_url }}" \
            --timeout 20 \
            --workers 8 \
            --report /tmp/preview-delivery.json

      - name: Firebase 배포 진단 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-preview-diagnostics
          path: |
            /tmp/firebase-preview.log
            /tmp/deploy_result.json
            /tmp/firebase-redeploy-result.json
            /tmp/firebase-channels.json
            /tmp/firebase-channels-after.json
            /tmp/firebase-channels-recovered.json
            /tmp/firebase-stale-channels.txt
            /tmp/preview-delivery.json
          retention-days: 7
          if-no-files-found: ignore

      - name: PR에 미리보기 URL 댓글 작성
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.smoke.outputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ steps.smoke.outputs.preview_url }}
          PREVIEW_CHANNEL: ${{ steps.smoke.outputs.channel }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const channel = process.env.PREVIEW_CHANNEL;
            const prNumber = context.payload.pull_request.number;
            const body = `🔥 **Firebase 미리보기 배포 및 스모크 검사 완료**\n\n👉 [미리보기 열기](${url})\n\n> 채널: \`${channel}\` · 사용자 경로, 실제 first-party 전달 예산, 404/MIME, 캐시·보안 헤더 검사를 통과했습니다. 응답 지연 시간은 진단값으로만 기록하며 실패 기준으로 사용하지 않습니다. 이 채널은 7일 후 자동 삭제됩니다.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
