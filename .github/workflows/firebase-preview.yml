name: Firebase PR 미리보기

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: Firebase 미리보기 채널 배포
        id: deploy
        run: |
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          firebase hosting:channel:deploy "$CHANNEL" \
            --project program-tool \
            --token "$FIREBASE_TOKEN" \
            --expires 7d \
            --json > /tmp/deploy_result.json
          URL=$(cat /tmp/deploy_result.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(list(d.get('result',{}).values())[0].get('url',''))" 2>/dev/null || echo "")
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: PR에 미리보기 URL 댓글 작성
        uses: actions/github-script@v7
        if: steps.deploy.outputs.preview_url != ''
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const prNumber = context.payload.pull_request.number;
            const body = `🔥 **Firebase 미리보기 배포 완료**\n\n👉 [미리보기 열기](${url})\n\n> 이 채널은 7일 후 자동 삭제됩니다.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
