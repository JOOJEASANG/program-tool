name: Cover recovery final boundary patch

on:
  push:
    branches:
      - agent/cover-recovery-checkpoints-stage11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/cover-recovery-checkpoints-stage11
          fetch-depth: 0
      - name: Harden IndexedDB and restore order
        shell: python
        run: |
          from pathlib import Path

          path = Path('js/cover-recovery-checkpoints.js')
          source = path.read_text(encoding='utf-8')
          replacements = {
              "const transaction = db.transaction(storeName, 'readwrite');\n    transaction.objectStore(storeName).put(value);\n    await transactionPromise(transaction);": "const transaction = db.transaction(storeName, 'readwrite');\n    const completion = transactionPromise(transaction);\n    transaction.objectStore(storeName).put(value);\n    await completion;",
              "const transaction = db.transaction(storeName, 'readonly');\n    const completion = transactionPromise(transaction);\n    const result = await requestPromise(transaction.objectStore(storeName).get(id));\n    await completion;": "const transaction = db.transaction(storeName, 'readonly');\n    const completion = transactionPromise(transaction);\n    const resultRequest = requestPromise(transaction.objectStore(storeName).get(id));\n    const [result] = await Promise.all([resultRequest, completion]);",
              "const transaction = db.transaction(storeName, 'readonly');\n    const completion = transactionPromise(transaction);\n    const result = await requestPromise(transaction.objectStore(storeName).getAll());\n    await completion;": "const transaction = db.transaction(storeName, 'readonly');\n    const completion = transactionPromise(transaction);\n    const resultRequest = requestPromise(transaction.objectStore(storeName).getAll());\n    const [result] = await Promise.all([resultRequest, completion]);",
              "const transaction = db.transaction(storeName, 'readwrite');\n    transaction.objectStore(storeName).delete(id);\n    await transactionPromise(transaction);": "const transaction = db.transaction(storeName, 'readwrite');\n    const completion = transactionPromise(transaction);\n    transaction.objectStore(storeName).delete(id);\n    await completion;",
              "const transaction = db.transaction(storeName, 'readwrite');\n    transaction.objectStore(storeName).clear();\n    await transactionPromise(transaction);": "const transaction = db.transaction(storeName, 'readwrite');\n    const completion = transactionPromise(transaction);\n    transaction.objectStore(storeName).clear();\n    await completion;",
              "try {\n      await queueSave({ manual: true, force: true });\n      activeRestore = true;\n      const [front, back] = await Promise.all([\n        loadAssetImage(record.snapshot.images?.front),\n        loadAssetImage(record.snapshot.images?.back),\n      ]);": "try {\n      const [front, back] = await Promise.all([\n        loadAssetImage(record.snapshot.images?.front),\n        loadAssetImage(record.snapshot.images?.back),\n      ]);\n      await queueSave({ manual: true, force: true });\n      activeRestore = true;",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected boundary not found exactly once: {old[:80]}')
              source = source.replace(old, new, 1)
          required = [
              "const [result] = await Promise.all([resultRequest, completion]);",
              "const [front, back] = await Promise.all([",
              "]);\n      await queueSave({ manual: true, force: true });\n      activeRestore = true;",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'final patch incomplete: {missing}')
          path.write_text(source, encoding='utf-8')
      - name: Commit final boundary patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/cover-recovery-checkpoints.js
          git commit -m "책표지 복구 대상 이미지와 IndexedDB 경계 보강"
          git push origin HEAD:agent/cover-recovery-checkpoints-stage11
