name: Audit game wording

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Find site game wording
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Find repository wording
        shell: bash
        run: |
          {
            echo '=== Repository matches for 게임 ==='
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=venv --exclude-dir=.venv \
              --include='*.html' --include='*.js' --include='*.json' --include='*.md' \
              '게임' . || true
          } > game-wording-report.txt
      - name: Crawl deployed site wording
        shell: bash
        run: |
          python - <<'PY' >> game-wording-report.txt
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          ROOTS = ['https://program-tool.web.app/', 'https://program-tool.firebaseapp.com/']
          TEXT_EXTS = ('.html', '.js', '.json', '.txt', '/')
          MAX_URLS = 200

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ('href', 'src'):
                      value = values.get(key)
                      if value:
                          self.urls.append(value)

          for root in ROOTS:
              print(f'\n=== Deployed crawl: {root} ===')
              host = urlparse(root).netloc
              queue = [root]
              seen = set()
              found = 0
              while queue and len(seen) < MAX_URLS:
                  url = queue.pop(0)
                  if url in seen:
                      continue
                  seen.add(url)
                  try:
                      req = Request(url, headers={'User-Agent': 'ProgramStudioWordingAudit/1.0'})
                      with urlopen(req, timeout=15) as response:
                          content_type = response.headers.get('Content-Type', '')
                          raw = response.read(5_000_000)
                      text = raw.decode('utf-8', errors='replace')
                  except Exception as exc:
                      print(f'FETCH_ERROR {url} :: {type(exc).__name__}: {exc}')
                      continue

                  for line_no, line in enumerate(text.splitlines(), 1):
                      if '게임' in line:
                          found += 1
                          snippet = ' '.join(line.strip().split())[:500]
                          print(f'MATCH {url}:{line_no}: {snippet}')

                  if 'text/html' in content_type or url.endswith(('.html', '/')):
                      parser = Links()
                      try:
                          parser.feed(text)
                      except Exception:
                          pass
                      for value in parser.urls:
                          absolute = urljoin(url, value).split('#', 1)[0]
                          parsed = urlparse(absolute)
                          if parsed.scheme not in ('http', 'https') or parsed.netloc != host:
                              continue
                          path = parsed.path.lower()
                          if path.endswith(('.html', '.js', '.json', '.txt')) or path.endswith('/') or '.' not in path.rsplit('/', 1)[-1]:
                              if absolute not in seen and absolute not in queue:
                                  queue.append(absolute)
              print(f'CRAWLED {len(seen)} URLs; MATCHES {found}')
          PY
          cat game-wording-report.txt
      - name: Upload wording audit report
        uses: actions/upload-artifact@v4
        with:
          name: game-wording-report
          path: game-wording-report.txt
          retention-days: 1
          if-no-files-found: error
