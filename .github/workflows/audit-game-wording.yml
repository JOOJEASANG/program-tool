name: Audit game wording

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Find site game wording
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Find user-facing game wording
        shell: bash
        run: |
          echo '=== Matches for 게임 in site-facing text files ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=venv --exclude-dir=.venv \
            --include='*.html' --include='*.js' --include='*.json' --include='*.md' \
            '게임' . | tee game-wording-report.txt || true
      - name: Upload wording audit report
        uses: actions/upload-artifact@v4
        with:
          name: game-wording-report
          path: game-wording-report.txt
          retention-days: 1
          if-no-files-found: error
