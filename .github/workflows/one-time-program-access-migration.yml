name: One-time ProgramAccess migration

on:
  push:
    branches:
      - agent/unify-program-access

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[program-access-migrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/unify-program-access
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Apply exact source migration
        run: python scripts/migrate_program_access.py

      - name: Commit migrated sources
        shell: bash
        run: |
          if git diff --quiet -- js/firebase-config.js pdf-editor/index.html; then
            echo "No migration changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/firebase-config.js pdf-editor/index.html
          git commit -m "ProgramAccess 공통 권한으로 마이그레이션 [program-access-migrated]"
          git push origin HEAD:agent/unify-program-access
