name: PDF lazy preview runtime patch

on:
  push:
    branches:
      - agent/pdf-viewport-lazy-preview-stage2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/pdf-viewport-lazy-preview-stage2
          fetch-depth: 0
      - name: Register viewport lazy preview
        shell: python
        run: |
          from pathlib import Path
          path = Path('js/sw-register.js')
          source = path.read_text(encoding='utf-8')
          anchor = "      tasks.push(load('pdfImportTransactionSafetyScriptV1','/js/pdf-editor/import-transaction-safety.js?v=20260806-1'));\n"
          addition = anchor + "      tasks.push(load('pdfViewportLazyPreviewScriptV1','/js/pdf-editor/viewport-lazy-preview.js?v=20260806-1'));\n"
          if source.count(anchor) != 1:
              raise SystemExit('transaction safety runtime anchor not found exactly once')
          if 'pdfViewportLazyPreviewScriptV1' not in source:
              source = source.replace(anchor, addition, 1)
          path.write_text(source, encoding='utf-8')
      - name: Commit runtime registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/sw-register.js
          git commit -m "PDF 선택 구간 지연 미리보기 런타임 연결"
          git push origin HEAD:agent/pdf-viewport-lazy-preview-stage2
