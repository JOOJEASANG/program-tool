name: Manual sync guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: manual-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manual-sync:
    name: Program manual sync
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify manual assets and guide contracts
        run: |
          python scripts/check_manual_sync.py --verify-only
          python scripts/validate_program_manuals.py

      - name: Require matching manual changes
        run: >-
          python scripts/check_manual_sync.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Run animated manual browser smoke
        run: bash scripts/run_program_manuals_browser_smoke.sh

      - name: Upload manual diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: program-manual-browser-smoke
          path: browser-smoke-artifacts
          retention-days: 7
          if-no-files-found: ignore
