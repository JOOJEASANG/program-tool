name: Cover source cleanup branch task

on:
  push:
    branches:
      - agent/cover-source-cleanup-lazy-jspdf

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/cover-source-cleanup-lazy-jspdf
          fetch-depth: 0

      - name: Remove retired cover source dependencies
        shell: python
        run: |
          from pathlib import Path

          path = Path('perfect-binding-cover/index.html')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>': '',
              '<script src="../js/cover-editor-multiselect.js"></script>': '',
              '<script src="../js/cover-editor-layer-style.js"></script>': '',
              '<textarea id="frontTitle">2026학년도 방과후학교 운영 계획서</textarea>': '<textarea id="frontTitle" placeholder="표지 제목을 입력하세요"></textarea>',
              '<input id="publishYear" type="text" value="2026">': '<input id="publishYear" type="text" placeholder="예: 2026">',
              '<input id="spineTitle" type="text" value="2026학년도 방과후학교 운영 계획서">': '<input id="spineTitle" type="text" placeholder="책등 제목을 입력하세요">',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          forbidden = (
              'cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
              '../js/cover-editor-multiselect.js',
              '../js/cover-editor-layer-style.js',
              '2026학년도 방과후학교 운영 계획서',
          )
          remaining = [item for item in forbidden if item in source]
          if remaining:
              raise SystemExit(f'cleanup incomplete: {remaining}')
          path.write_text(source, encoding='utf-8')

      - name: Commit source cleanup
        run: |
          if git diff --quiet -- perfect-binding-cover/index.html; then
            echo "No source cleanup changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfect-binding-cover/index.html
          git commit -m "책표지 비활성 스크립트와 jsPDF 초기 로드 제거"
          git push origin HEAD:agent/cover-source-cleanup-lazy-jspdf
