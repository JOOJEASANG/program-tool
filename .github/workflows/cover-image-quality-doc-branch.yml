name: Cover image quality documentation branch task

on:
  push:
    branches:
      - agent/cover-image-print-quality-stage8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/cover-image-print-quality-stage8
          fetch-depth: 0
      - name: Document image print quality stage
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/cover-editor-runtime-audit.md')
          source = path.read_text(encoding='utf-8')
          old_list = '''7. `cover-template-surface-cleanup.js`
          8. `cover-floating-action-dock.js`
          9. `cover-ui-runtime-normalizer.js`
          10. `cover-output-performance-safety.js`
          11. `cover-runtime-safety.js`
          12. `cover-render-pipeline-contract.js`'''.replace('          ', '')
          new_list = '''7. `cover-template-surface-cleanup.js`
          8. `cover-image-print-quality.js`
          9. `cover-floating-action-dock.js`
          10. `cover-ui-runtime-normalizer.js`
          11. `cover-output-performance-safety.js`
          12. `cover-runtime-safety.js`
          13. `cover-render-pipeline-contract.js`'''.replace('          ', '')
          if old_list not in source:
              raise SystemExit('runtime list boundary not found')
          source = source.replace(old_list, new_list, 1)

          anchor = '`cover-template-surface-cleanup.js`는 기본 스타일 프리셋과 개인 작업 템플릿 화면을 운영 UI에서 제거하고, 기존 관리자 제공 이미지 템플릿 DOM과 이벤트 연결은 그대로 유지한다.\n'
          description = '\n`cover-image-print-quality.js`는 원본 이미지 픽셀, 완성 규격·재단 여백, 이미지 맞춤 방식과 현재 확대율을 함께 계산해 앞·뒤표지의 예상 인쇄 DPI를 표시한다. 300DPI 이상 최적, 250DPI 이상 양호, 180DPI 이상 주의, 120DPI 이상 낮음, 그 미만 위험으로 안내하며 자동 채우기의 예상 잘림과 전체 보이기의 배경 노출도 함께 알려준다.\n'
          if anchor not in source:
              raise SystemExit('module description anchor not found')
          source = source.replace(anchor, anchor + description, 1)

          section_anchor = '## 확인 완료 후 남은 구조 개선 사항\n'
          section = '''## 8차 점검에서 정리한 항목

- 앞표지와 뒤표지 이미지의 원본 픽셀 크기를 각각 표시한다.
- 현재 표지 규격·재단 여백·맞춤 방식·확대율을 반영한 실제 예상 인쇄 DPI를 계산한다.
- 300DPI 이상 최적, 250DPI 이상 양호, 180DPI 이상 주의, 120DPI 이상 낮음, 그 미만 위험으로 단계화한다.
- 자동 채우기는 예상 잘림 비율을, 전체 보이기는 가장자리 배경색 노출을 안내한다.
- 이미지 교체·복사·삭제, 관리자 템플릿 적용, 규격과 확대율 변경 후 자동 갱신한다.
- 이미지가 없는 경우에는 오류 대신 배경색만 출력된다고 명확히 표시한다.
- 품질 진단은 경고 정보로 제공하며 사용자의 의도적인 저해상도 출력 자체를 강제로 차단하지 않는다.

'''
          if section_anchor not in source:
              raise SystemExit('section anchor not found')
          source = source.replace(section_anchor, section + section_anchor, 1)
          path.write_text(source, encoding='utf-8')
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cover-editor-runtime-audit.md
          git commit -m "책표지 이미지 품질 진단 문서화"
          git push origin HEAD:agent/cover-image-print-quality-stage8
