name: Cover shared jsPDF loader branch task

on:
  push:
    branches:
      - agent/cover-source-cleanup-lazy-jspdf

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/cover-source-cleanup-lazy-jspdf
          fetch-depth: 0
      - name: Reuse the synchronous lazy loader
        shell: python
        run: |
          from pathlib import Path

          path = Path('js/cover-output-performance-safety.js')
          source = path.read_text(encoding='utf-8')
          old = "  function ensureJsPdf() {\n    if (jsPdfReady()) return Promise.resolve(window.jspdf.jsPDF);\n    if (jsPdfPromise) return jsPdfPromise;"
          new = "  function ensureJsPdf() {\n    if (jsPdfReady()) return Promise.resolve(window.jspdf.jsPDF);\n    if (typeof window.CoverJsPdfLoader?.ensure === 'function') return window.CoverJsPdfLoader.ensure();\n    if (jsPdfPromise) return jsPdfPromise;"
          if source.count(old) != 1:
              raise SystemExit('ensureJsPdf boundary not found exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Commit shared loader patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/cover-output-performance-safety.js
          git commit -m "책표지 출력 안전 모듈 공유 지연 로더 사용"
          git push origin HEAD:agent/cover-source-cleanup-lazy-jspdf
