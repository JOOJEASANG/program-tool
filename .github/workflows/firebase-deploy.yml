name: Firebase 자동 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

permissions:
  checks: write
  contents: read
  pull-requests: read
  statuses: write
  id-token: write

jobs:
  source-guard:
    name: 운영 배포 소스 확인
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: main 직접 push 배포 차단
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.sha;
            let mergedPullRequest = null;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const pulls = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha, per_page: 100 }
              );
              mergedPullRequest = pulls.find(pr =>
                Boolean(pr.merged_at)
                && pr.base?.ref === 'main'
                && pr.merge_commit_sha === sha
              );
              if (mergedPullRequest) break;
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!mergedPullRequest) {
              core.setFailed(`운영 배포 차단: ${sha} 는 main 대상 PR의 실제 병합 커밋이 아닙니다.`);
              return;
            }
            core.info(`운영 배포 허용: PR #${mergedPullRequest.number}의 실제 병합 SHA로 확인되었습니다.`);

      - name: 수동 재배포 안내
        if: github.event_name == 'workflow_dispatch'
        run: echo "수동 workflow_dispatch 운영 재배포를 허용합니다."

  quality:
    name: 배포 전 품질 검사
    needs: source-guard
    uses: ./.github/workflows/quality-gate.yml

  deploy:
    name: Firebase 배포 및 운영 검증
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      BIND_OPENAI_ADMIN_KEY: ${{ vars.BIND_OPENAI_ADMIN_KEY }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Google Cloud WIF 인증
        if: env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: program-tool
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Python 3.11 설정
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: 백엔드 패키지 설치
        run: |
          cd backend
          python3.11 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip check

      - name: 배포 HTML 렌더링 가드 삽입
        run: python3 scripts/inject_boot_guard.py

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools@15.28.1

      - name: Firebase 전체 배포 (Hosting + Functions + Rules)
        run: bash scripts/firebase_ci.sh deploy --project program-tool --force --non-interactive

      - name: 운영 배포 사용자 경로 검증
        run: |
          python3 scripts/smoke_deployment.py \
            --base-url https://program-tool.web.app \
            --attempts 10 \
            --delay-seconds 6 \
            --timeout 25
          python3 scripts/smoke_smart_layout_deployment.py \
            --base-url https://program-tool.web.app \
            --attempts 10 \
            --delay-seconds 6 \
            --timeout 25

  production-status:
    name: 운영 배포 상태 기록
    needs: [source-guard, quality, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: production-smoke 커밋 상태 기록
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const source = '${{ needs.source-guard.result }}';
            const quality = '${{ needs.quality.result }}';
            const deploy = '${{ needs.deploy.result }}';
            const success = source === 'success' && quality === 'success' && deploy === 'success';
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'production-smoke',
              description: success
                ? 'Firebase 운영 배포와 사용자 경로 검증 통과'
                : `운영 배포 실패 (source=${source}, quality=${quality}, deploy=${deploy})`,
              target_url: targetUrl,
            });
