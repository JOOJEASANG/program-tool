name: Firebase Hosting 배포

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: 서비스 계정 파일 생성
        run: echo "$FIREBASE_SA_JSON" > /tmp/sa.json
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Firebase Hosting 배포
        run: firebase deploy --only hosting --project program-tool
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: 서비스 계정 파일 삭제
        if: always()
        run: rm -f /tmp/sa.json
