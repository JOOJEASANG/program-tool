name: Firebase Hosting 배포

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Google 서비스 계정 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROGRAM_TOOL }}

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: Firebase Hosting 배포
        run: firebase deploy --only hosting --project program-tool
