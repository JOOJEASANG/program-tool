name: Firebase 자동 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

permissions:
  checks: write
  contents: read

jobs:
  quality:
    name: 배포 전 품질 검사
    uses: ./.github/workflows/quality-gate.yml

  deploy:
    name: Firebase 배포 및 운영 검증
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js 설정
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Python 3.11 설정
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: 백엔드 패키지 설치
        run: |
          cd backend
          python3.11 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip check

      - name: 배포 HTML 렌더링 가드 삽입
        run: python3 scripts/inject_boot_guard.py

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools@14.27.0

      - name: Firebase 전체 배포 (Hosting + Functions + Rules)
        run: firebase deploy --project program-tool --token "$FIREBASE_TOKEN" --force --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: 운영 배포 사용자 경로 검증
        run: |
          python3 scripts/smoke_deployment.py \
            --base-url https://program-tool.web.app \
            --attempts 10 \
            --delay-seconds 6 \
            --timeout 25
