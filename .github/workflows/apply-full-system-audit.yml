name: Apply full system audit fixes

on:
  push:
    branches:
      - agent/full-system-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/full-system-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Decode and apply reviewed audit changes
        run: |
          base64 -d scripts/apply_full_system_audit.py.gz.b64 | gzip -d > /tmp/apply_full_system_audit.py
          python -m py_compile /tmp/apply_full_system_audit.py
          python /tmp/apply_full_system_audit.py

      - name: Remove audit-only files and restore normal quality gate
        run: |
          rm -f scripts/apply_full_system_audit.py.gz.b64
          rm -f .github/workflows/apply-full-system-audit.yml
          git checkout origin/main -- .github/workflows/quality-gate.yml

      - name: Run focused validation
        run: |
          python scripts/check_inline_js.py
          python scripts/check_version_sync.py
          python scripts/validate_static_references.py
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          cd backend
          python -m pytest -q \
            tests/test_current_system_audit.py \
            tests/test_file_library_and_cover_ui.py \
            tests/test_pdf_editor_july20_runtime.py

      - name: Commit final audit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "전체 시스템 구성·디자인·기능 재점검 보완"
          git push origin HEAD:agent/full-system-audit
