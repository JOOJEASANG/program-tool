name: Apply thumbnail navigation fix

on:
  push:
    branches:
      - agent/fix-thumbnail-click-navigation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/fix-thumbnail-click-navigation
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply thumbnail navigation and context hide behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          targets = [Path('pdf-editor/index.html'), Path('tools/pdf-editor.html')]

          helper_anchor = """// ── Thumbnails ────────────────────────────────────────────────────────
          function renderThumbs() {
          """
          helper_code = """// ── Thumbnails ────────────────────────────────────────────────────────
          let _focusedThumbPageId = null;
          let _previewFocusClearTimer = null;

          function getPreviewLocationForPage(page) {
            if (!page || page.excluded) return null;
            const active = parsedPages.filter(p => !p.excluded);
            let ordered = active;
            const useBooklet = Boolean(document.getElementById('bookletCheck')?.checked)
              && typeof BOOKLET_STRIPS !== 'undefined'
              && typeof nup !== 'undefined'
              && nup in BOOKLET_STRIPS;
            if (useBooklet && typeof bookletReorderPreview === 'function') {
              ordered = bookletReorderPreview(active, nup) || active;
            }

            const outputGroups = [];
            for (const grp of groupByNup(ordered)) {
              const { cols, rows } = getLayout(grp.n);
              const perPage = Math.max(1, cols * rows);
              for (let start = 0; start < grp.pages.length; start += perPage) {
                outputGroups.push(grp.pages.slice(start, start + perPage));
              }
            }
            const index = outputGroups.findIndex(group => group.includes(page));
            return index < 0 ? null : { index, total: outputGroups.length };
          }

          function markFocusedThumbnail(page) {
            _focusedThumbPageId = page.id;
            document.querySelectorAll('#thumbArea .thumb-wrap').forEach(node => {
              const selected = node.closest('.thumb-item')?.dataset.id === page.id;
              node.style.borderColor = selected ? '#2563eb' : '';
              node.style.boxShadow = selected ? '0 0 0 2px rgba(37,99,235,.18)' : '';
            });
          }

          async function focusPageInPreview(page) {
            if (!page) return;
            if (page.excluded) {
              showStatus('숨김 페이지입니다. 마우스 오른쪽 메뉴에서 숨김 해제를 선택하세요.', 'error');
              return;
            }

            markFocusedThumbnail(page);
            let location = getPreviewLocationForPage(page);
            let previews = [...document.querySelectorAll('#previewScroll .page-preview')];
            if (!location || previews.length !== location.total || !previews[location.index]) {
              await triggerPreview();
              location = getPreviewLocationForPage(page);
              previews = [...document.querySelectorAll('#previewScroll .page-preview')];
            }

            const target = location ? previews[location.index] : null;
            if (!target) {
              showStatus('선택한 페이지의 미리보기를 찾지 못했습니다.', 'error');
              return;
            }

            previews.forEach(node => {
              node.style.outline = '';
              node.style.outlineOffset = '';
            });
            target.style.outline = '3px solid #2563eb';
            target.style.outlineOffset = '3px';
            target.scrollIntoView({ behavior: 'auto', block: 'center', inline: 'center' });
            clearTimeout(_previewFocusClearTimer);
            _previewFocusClearTimer = setTimeout(() => {
              target.style.outline = '';
              target.style.outlineOffset = '';
            }, 1600);
          }

          function renderThumbs() {
          """

          wrap_anchor = """    const wrap = document.createElement('div');
              wrap.className = 'thumb-wrap' + (page.excluded ? ' excluded' : '');
          """
          wrap_code = """    const wrap = document.createElement('div');
              wrap.className = 'thumb-wrap' + (page.excluded ? ' excluded' : '');
              wrap.tabIndex = 0;
              wrap.setAttribute('role', 'button');
              wrap.setAttribute('aria-label', `${i + 1}페이지 미리보기로 이동`);
              wrap.title = '클릭: 미리보기 이동 · 마우스 오른쪽 클릭: 페이지 메뉴';
              wrap.style.cursor = 'pointer';
              if (page.id === _focusedThumbPageId) {
                wrap.style.borderColor = '#2563eb';
                wrap.style.boxShadow = '0 0 0 2px rgba(37,99,235,.18)';
              }
          """

          old_click = """    wrap.addEventListener('click', () => {
              page.excluded = !page.excluded;
              wrap.classList.toggle('excluded', page.excluded);
              if (page.excluded) {
                if (!wrap.querySelector('.thumb-ex')) {
                  const ex = document.createElement('div'); ex.className = 'thumb-ex'; ex.textContent = '✕';
                  wrap.appendChild(ex);
                }
              } else { wrap.querySelector('.thumb-ex')?.remove(); }
              schedulePreview(300);
            });
          """
          new_click = """    wrap.addEventListener('click', e => {
              e.preventDefault();
              e.stopPropagation();
              focusPageInPreview(page).catch(error => {
                console.error('[thumbnail] preview navigation failed', error);
                showStatus('선택한 페이지로 이동하지 못했습니다.', 'error');
              });
            });
              wrap.addEventListener('keydown', e => {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                e.preventDefault();
                focusPageInPreview(page).catch(error => {
                  console.error('[thumbnail] keyboard preview navigation failed', error);
                });
              });
          """

          old_context = """    menu.appendChild(sep());
              menu.appendChild(item('🗑', '페이지 삭제', 'danger', () => {
                parsedPages.splice(idx, 1);
                renderThumbs(); schedulePreview(300);
              }));
          """
          new_context = """    menu.appendChild(sep());
              menu.appendChild(item(
                page.excluded ? '👁' : '🙈',
                page.excluded ? '페이지 숨김 해제' : '페이지 숨기기',
                '',
                () => {
                  page.excluded = !page.excluded;
                  if (page.excluded && _focusedThumbPageId === page.id) _focusedThumbPageId = null;
                  renderThumbs();
                  schedulePreview(80);
                  showStatus(page.excluded ? '페이지를 숨겼습니다.' : '페이지 숨김을 해제했습니다.', 'success');
                  setTimeout(hideStatus, 1200);
                }
              ));
              menu.appendChild(sep());
              menu.appendChild(item('🗑', '페이지 삭제', 'danger', () => {
                if (_focusedThumbPageId === page.id) _focusedThumbPageId = null;
                parsedPages.splice(idx, 1);
                renderThumbs(); schedulePreview(300);
              }));
          """

          for path in targets:
              source = path.read_text(encoding='utf-8')
              for old, new, label in (
                  (helper_anchor, helper_code, 'thumbnail helper anchor'),
                  (wrap_anchor, wrap_code, 'thumbnail wrapper'),
                  (old_click, new_click, 'thumbnail click handler'),
                  (old_context, new_context, 'context menu'),
              ):
                  if old not in source:
                      raise SystemExit(f'{label} not found in {path}')
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')

          if targets[0].read_bytes() != targets[1].read_bytes():
              raise SystemExit('PDF editor entrypoints differ after thumbnail patch')

          old_version = '2026.07.30.002'
          new_version = '2026.07.30.003'
          for name in ('js/firebase-config.js', 'js/sw-register.js', 'sw.js'):
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              if old_version not in source:
                  raise SystemExit(f'{old_version} not found in {name}')
              path.write_text(source.replace(old_version, new_version), encoding='utf-8')

          Path('version.json').write_text(json.dumps({
              'version': new_version,
              'label': 'PDF 사이드바 클릭·숨김 동작 분리',
              'updatedAt': '2026-07-30T17:14:00+09:00',
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('backend/tests/test_pdf_editor_thumbnail_navigation.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nEDITOR = ROOT / "pdf-editor" / "index.html"\nLEGACY = ROOT / "tools" / "pdf-editor.html"\n\n\ndef test_thumbnail_click_navigates_instead_of_toggling_hidden_state():\n    source = EDITOR.read_text(encoding="utf-8")\n    assert EDITOR.read_bytes() == LEGACY.read_bytes()\n    assert "async function focusPageInPreview(page)" in source\n    assert "target.scrollIntoView({ behavior: 'auto', block: 'center', inline: 'center' });" in source\n    assert "focusPageInPreview(page).catch" in source\n    assert "wrap.classList.toggle('excluded', page.excluded)" not in source\n    assert "숨김 페이지입니다. 마우스 오른쪽 메뉴에서 숨김 해제를 선택하세요." in source\n\n\ndef test_hidden_state_is_only_exposed_through_the_context_menu():\n    source = EDITOR.read_text(encoding="utf-8")\n    assert "page.excluded ? '페이지 숨김 해제' : '페이지 숨기기'" in source\n    assert "page.excluded = !page.excluded;" in source\n    assert "클릭: 미리보기 이동 · 마우스 오른쪽 클릭: 페이지 메뉴" in source\n    assert "aria-label', `${i + 1}페이지 미리보기로 이동`" in source\n\n\ndef test_preview_navigation_understands_nup_and_booklet_output_groups():\n    source = EDITOR.read_text(encoding="utf-8")\n    assert "function getPreviewLocationForPage(page)" in source\n    assert "bookletReorderPreview(active, nup)" in source\n    assert "for (const grp of groupByNup(ordered))" in source\n    assert "outputGroups.findIndex(group => group.includes(page))" in source\n''', encoding='utf-8')
          PY
      - name: Restore quality gate and validate
        run: |
          git show origin/main:.github/workflows/quality-gate.yml > .github/workflows/quality-gate.yml
          python scripts/check_inline_js.py
          python scripts/check_version_sync.py
          python scripts/validate_static_references.py
          python -m pip install pytest
          python -m pytest \
            backend/tests/test_pdf_editor_thumbnail_navigation.py \
            backend/tests/test_current_system_audit.py \
            backend/tests/test_pdf_editor_july20_runtime.py -q
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            pdf-editor/index.html tools/pdf-editor.html \
            js/firebase-config.js js/sw-register.js sw.js version.json \
            backend/tests/test_pdf_editor_thumbnail_navigation.py \
            .github/workflows/quality-gate.yml
          git commit -m "PDF 사이드바 클릭 이동과 우클릭 숨김을 분리"
          git push origin HEAD:agent/fix-thumbnail-click-navigation
