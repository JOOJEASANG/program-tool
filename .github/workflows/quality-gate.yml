name: Apply stale preview navigation fix

on:
  push:
    branches:
      - agent/fix-thumbnail-stale-preview

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/fix-thumbnail-stale-preview
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Refresh stale ordinary previews only
        run: |
          python - <<'PY'
          from pathlib import Path

          loader_path = Path('js/pdf-editor/loader.js')
          source = loader_path.read_text(encoding='utf-8')
          old = """    let location = getPreviewLocationForPage(page);
              let previews = [...document.querySelectorAll('#previewScroll .page-preview')];
              let target = location ? previews[location.index] : null;

              if (!target) {
                if (window.__pdfEditorExtremeMode && previews.length > 0 && location?.index >= previews.length) {
                  showLimitedPreviewNotice(previews);
                  return;
                }

                if (typeof triggerPreview === 'function') {
                  window.__pdfEditorManualPreviewRequest = true;
                  await triggerPreview();
                }
          """
          new = """    let location = getPreviewLocationForPage(page);
              let previews = [...document.querySelectorAll('#previewScroll .page-preview')];
              let target = location ? previews[location.index] : null;
              const intentionallyLimitedExtreme = Boolean(window.__pdfEditorExtremeMode)
                && previews.length > 0
                && location
                && previews.length < location.total;
              const staleOrdinaryPreview = Boolean(location)
                && previews.length !== location.total
                && !intentionallyLimitedExtreme;
              if (staleOrdinaryPreview) target = null;

              if (!target) {
                if (intentionallyLimitedExtreme && location?.index >= previews.length) {
                  showLimitedPreviewNotice(previews);
                  return;
                }

                if (typeof triggerPreview === 'function') {
                  window.__pdfEditorManualPreviewRequest = true;
                  await triggerPreview();
                }
          """
          if old not in source:
              raise SystemExit('preview navigation block not found')
          loader_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('backend/tests/test_pdf_editor_thumbnail_navigation.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = """def test_extreme_limited_preview_is_preserved_during_navigation():
              source = LOADER.read_text(encoding=\"utf-8\")
              assert \"previews.length !== location.total\" not in source
              assert \"window.__pdfEditorManualPreviewRequest = true;\" in source
              assert \"window.__pdfEditorExtremeMode && previews.length > 0\" in source
              assert \"showLimitedPreviewNotice(previews);\" in source
              assert \"선택한 페이지는 최종 저장에는 정상 반영됩니다.\" in source


          """
          replacement = """def test_extreme_limited_preview_is_preserved_during_navigation():
              source = LOADER.read_text(encoding=\"utf-8\")
              assert \"const intentionallyLimitedExtreme = Boolean(window.__pdfEditorExtremeMode)\" in source
              assert \"previews.length < location.total\" in source
              assert \"window.__pdfEditorManualPreviewRequest = true;\" in source
              assert \"showLimitedPreviewNotice(previews);\" in source
              assert \"선택한 페이지는 최종 저장에는 정상 반영됩니다.\" in source


          def test_non_extreme_count_mismatch_forces_preview_refresh():
              source = LOADER.read_text(encoding=\"utf-8\")
              assert \"const staleOrdinaryPreview = Boolean(location)\" in source
              assert \"previews.length !== location.total\" in source
              assert \"&& !intentionallyLimitedExtreme;\" in source
              assert \"if (staleOrdinaryPreview) target = null;\" in source


          """
          if anchor not in tests:
              raise SystemExit('extreme preview test block not found')
          test_path.write_text(tests.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Restore quality gate and validate
        run: |
          git show origin/main:.github/workflows/quality-gate.yml > .github/workflows/quality-gate.yml
          node --check js/pdf-editor/loader.js
          python scripts/check_inline_js.py
          python scripts/check_version_sync.py
          python scripts/validate_static_references.py
          python -m pip install pytest
          python -m pytest \
            backend/tests/test_pdf_editor_thumbnail_navigation.py \
            backend/tests/test_current_system_audit.py \
            backend/tests/test_pdf_editor_july20_runtime.py -q
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pdf-editor/loader.js backend/tests/test_pdf_editor_thumbnail_navigation.py .github/workflows/quality-gate.yml
          git commit -m "일반 문서의 오래된 미리보기 이동을 방지"
          git push origin HEAD:agent/fix-thumbnail-stale-preview
