name: Repository quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend scripts

      - name: Run regression tests
        working-directory: backend
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-diagnostics
          path: backend/pytest.log
          retention-days: 7
          if-no-files-found: ignore

  frontend-static:
    name: Frontend and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build deployment HTML
        run: python scripts/inject_boot_guard.py

      - name: Validate JavaScript files
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_inline_js.py 2>&1 | tee inline-js.log

      - name: Validate JSON files
        run: |
          python -m json.tool firebase.json >/dev/null
          python -m json.tool firestore.indexes.json >/dev/null
          python -m json.tool storage-lifecycle.json >/dev/null
          python -m json.tool version.json >/dev/null

      - name: Validate deployment version
        run: python scripts/check_version_sync.py

      - name: Validate static asset paths
        run: python scripts/validate_static_references.py

      - name: Build repository audit bundle
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          root = Path.cwd()
          staging = root / '_repository_audit_source'
          staging.mkdir()
          keep = [
              '.github', 'backend', 'js', 'pdf-editor', 'pdf-preflight',
              'perfect-binding-cover', 'scripts', 'tests', 'tools',
              'admin.html', 'guide.html', 'index.html', 'login.html',
              'firebase.json', 'firestore.rules', 'storage.rules',
              'sw.js', 'version.json', 'PROGRAM_STRUCTURE.md', 'README.md',
          ]
          for entry in keep:
              source = root / entry
              if not source.exists():
                  continue
              target = staging / entry
              if source.is_dir():
                  shutil.copytree(source, target, dirs_exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          shutil.make_archive('repository-audit-source', 'zip', staging)
          PY

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-diagnostics
          path: |
            inline-js.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload repository audit bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-audit-source
          path: repository-audit-source.zip
          retention-days: 1
          if-no-files-found: error

  firebase-rules:
    name: Firebase rules compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: |
          npm ci
          npm install -g firebase-tools@14.27.0

      - name: Test Firestore and Storage rules
        run: firebase emulators:exec --only firestore,storage --project demo-program-tool "npm run test:rules"
