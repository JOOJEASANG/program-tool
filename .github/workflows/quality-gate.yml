name: Repository quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend scripts

      - name: Run regression tests
        working-directory: backend
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: backend/pytest.log
          retention-days: 7
          if-no-files-found: ignore

  frontend-static:
    name: Frontend and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JavaScript files
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_inline_js.py 2>&1 | tee inline-js.log

      - name: Validate JSON files
        run: |
          python -m json.tool firebase.json >/dev/null
          python -m json.tool version.json >/dev/null

      - name: Validate deployment version
        run: python scripts/check_version_sync.py

      - name: Validate static asset paths
        run: python scripts/validate_static_references.py

      - name: Reject stale generated workflow targets
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee stale-workflows.log
          from pathlib import Path

          needle = "git add " + "tools/perfect-binding-cover.html"
          failures = []
          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'quality-gate.yml':
                  continue
              if needle in path.read_text(encoding='utf-8'):
                  failures.append(str(path))
          if failures:
              raise SystemExit('Obsolete generated HTML target remains in: ' + ', '.join(failures))
          print('No stale generated workflow targets found.')
          PY

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            inline-js.log
            stale-workflows.log
          retention-days: 7
          if-no-files-found: ignore

  firebase-rules:
    name: Firebase rules compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Compile Firestore and Storage rules
        run: firebase emulators:exec --only firestore,storage --project demo-program-tool "echo Firebase rules compiled"
