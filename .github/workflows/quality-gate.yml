name: Repository quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Run regression tests
        working-directory: backend
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-diagnostics
          path: backend/pytest.log
          retention-days: 7
          if-no-files-found: ignore

  frontend-static:
    name: Frontend and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build deployment HTML
        run: python scripts/inject_boot_guard.py
      - name: Validate JavaScript files
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_inline_js.py 2>&1 | tee inline-js.log
      - name: Validate JSON files
        run: |
          python -m json.tool firebase.json >/dev/null
          python -m json.tool firestore.indexes.json >/dev/null
          python -m json.tool storage-lifecycle.json >/dev/null
          python -m json.tool version.json >/dev/null
      - name: Validate deployment version
        run: python scripts/check_version_sync.py
      - name: Validate static asset paths
        run: python scripts/validate_static_references.py
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-diagnostics
          path: inline-js.log
          retention-days: 7
          if-no-files-found: ignore

  visual-layout-audit:
    name: Desktop and mobile layout audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run layout screenshots and overflow checks
        run: |
          mkdir -p layout-audit
          python -m http.server 4173 >layout-audit/server.log 2>&1 &
          cat > layout-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const targets = [
            { name: 'home', path: 'index.html', js: true, css: '#loading{display:none!important}' },
            { name: 'login', path: 'login.html', js: false, css: '' },
            { name: 'admin', path: 'admin.html', js: false, css: '#loading{display:none!important}#app{display:grid!important}' },
            { name: 'guide', path: 'guide.html', js: false, css: '' },
            { name: 'pdf-editor', path: 'pdf-editor/index.html', js: false, css: '#authLoading{display:none!important}' },
            { name: 'pdf-preflight', path: 'pdf-preflight/index.html', js: false, css: '#authLoading{display:none!important}' },
            { name: 'cover', path: 'perfect-binding-cover/index.html', js: false, css: '#authLoading{display:none!important}' },
          ];
          const sizes = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
          ];
          const browser = await chromium.launch({ headless: true });
          const report = [];
          let failed = false;
          for (const target of targets) {
            for (const size of sizes) {
              const context = await browser.newContext({ viewport: size, javaScriptEnabled: target.js });
              const page = await context.newPage();
              await page.goto(`http://127.0.0.1:4173/${target.path}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              if (target.js) await page.waitForTimeout(1800);
              if (target.css) await page.addStyleTag({ content: target.css });
              await page.waitForTimeout(150);
              const metrics = await page.evaluate(() => ({
                title: document.title,
                bodyWidth: document.body.scrollWidth,
                viewportWidth: document.documentElement.clientWidth,
                bodyHeight: document.body.scrollHeight,
                viewportHeight: document.documentElement.clientHeight,
                visibleText: (document.body.innerText || '').trim().length,
              }));
              const overflow = metrics.bodyWidth - metrics.viewportWidth;
              if (overflow > 4 || metrics.visibleText < 20) failed = true;
              const file = `layout-audit/${target.name}-${size.name}.png`;
              await page.screenshot({ path: file, fullPage: true });
              report.push({ page: target.name, viewport: size.name, overflow, ...metrics, screenshot: file });
              await context.close();
            }
          }
          await browser.close();
          fs.writeFileSync('layout-audit/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (failed) process.exit(1);
          JS
          node layout-audit.mjs
      - name: Upload layout audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layout-audit
          path: layout-audit
          retention-days: 2
          if-no-files-found: error

  firebase-rules:
    name: Firebase rules compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: |
          npm ci
          npm install -g firebase-tools@14.27.0
      - name: Test Firestore and Storage rules
        run: firebase emulators:exec --only firestore,storage --project demo-program-tool "npm run test:rules"
