name: Repository quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend scripts

      - name: Run regression tests
        working-directory: backend
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-diagnostics
          path: backend/pytest.log
          retention-days: 7
          if-no-files-found: ignore

  frontend-static:
    name: Frontend and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build deployment HTML
        run: python scripts/inject_boot_guard.py

      - name: Validate release hygiene
        run: python scripts/validate_release_hygiene.py

      - name: Validate JavaScript files
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_inline_js.py 2>&1 | tee inline-js.log

      - name: Validate JSON files
        run: |
          python -m json.tool firebase.json >/dev/null
          python -m json.tool firestore.indexes.json >/dev/null
          python -m json.tool storage-lifecycle.json >/dev/null
          python -m json.tool version.json >/dev/null

      - name: Validate deployment version
        run: python scripts/check_version_sync.py

      - name: Validate static asset paths
        run: python scripts/validate_static_references.py

      - name: Validate runtime asset manifest
        run: python scripts/validate_runtime_assets.py

      - name: Validate route bootstrap budgets
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_route_budgets.py 2>&1 | tee route-budget.log

      - name: Run Phase 5 UX browser smoke
        run: bash scripts/run_phase5_browser_smoke.sh

      - name: Run Phase 6 mobile accessibility smoke
        run: bash scripts/run_phase6_browser_smoke.sh

      - name: Run Phase 7 public first-paint smoke
        run: bash scripts/run_phase7_browser_smoke.sh

      - name: Run Phase 8 runtime asset smoke
        run: bash scripts/run_phase8_browser_smoke.sh

      - name: Run Phase 12 compact editor tool rail smoke
        run: bash scripts/run_phase12_browser_smoke.sh

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-diagnostics
          path: |
            inline-js.log
            route-budget.log
            browser-smoke-artifacts
          retention-days: 7
          if-no-files-found: ignore

  design-editor-browser-smoke:
    name: Design editor browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run headless Chrome smoke
        run: bash scripts/run_design_editor_browser_smoke.sh

      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-editor-browser-smoke
          path: browser-smoke-artifacts
          retention-days: 7
          if-no-files-found: ignore

  image-editor-browser-smoke:
    name: Image editor browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run image editor Chrome smokes
        run: |
          bash scripts/run_image_editor_browser_smoke.sh
          bash scripts/run_image_editor_background_smoke.sh
          bash scripts/run_image_editor_workflow_smoke.sh
          bash scripts/run_image_editor_pro_smoke.sh

      - name: Upload image editor diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-editor-browser-smoke
          path: browser-smoke-artifacts
          retention-days: 7
          if-no-files-found: ignore

  document-editor-browser-smoke:
    name: Document editor browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run document editor Chrome smokes
        run: |
          bash scripts/run_document_editor_browser_smoke.sh
          bash scripts/run_document_editor_workflow_smoke.sh
          bash scripts/run_document_editor_usability_smoke.sh
          bash scripts/run_document_editor_table_tools_smoke.sh
          bash scripts/run_document_editor_print_layout_smoke.sh
          bash scripts/run_document_editor_outline_smoke.sh
          bash scripts/run_document_editor_comments_smoke.sh

      - name: Upload document editor diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-editor-browser-smoke
          path: browser-smoke-artifacts
          retention-days: 7
          if-no-files-found: ignore

  pdf-program-shell-browser-smoke:
    name: PDF program shell browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run PDF program shell Chrome smoke
        run: bash scripts/run_pdf_program_shell_smoke.sh

      - name: Upload PDF shell diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-program-shell-browser-smoke
          path: browser-smoke-artifacts
          retention-days: 7
          if-no-files-found: ignore

  firebase-rules:
    name: Firebase rules compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: |
          npm ci
          npm install -g firebase-tools@14.27.0

      - name: Test Firestore and Storage rules
        shell: bash
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore,storage --project demo-program-tool "npm run test:rules" 2>&1 | tee firebase-rules.log

      - name: Upload Firebase rules diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firebase-rules-diagnostics
          path: firebase-rules.log
          retention-days: 7
          if-no-files-found: ignore
