name: Repository quality gate

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run PDF regression tests
        working-directory: backend
        run: pytest -q

  frontend-static:
    name: Frontend and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JavaScript syntax
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Validate JSON files
        run: |
          python -m json.tool firebase.json >/dev/null
          python -m json.tool version.json >/dev/null

      - name: Validate deployment version
        run: python scripts/check_version_sync.py

      - name: Validate static asset paths
        run: python scripts/validate_static_references.py

      - name: Reject stale generated workflow targets
        run: |
          if grep -R "git add tools/perfect-binding-cover.html" .github/workflows; then
            echo "Obsolete generated HTML target remains in a workflow."
            exit 1
          fi

  firebase-rules:
    name: Firebase rules compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Compile Firestore and Storage rules
        run: firebase emulators:exec --only firestore,storage --project demo-program-tool "echo Firebase rules compiled"
