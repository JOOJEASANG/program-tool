name: Apply final preview queue protection

on:
  push:
    branches:
      - agent/final-preview-queue

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-preview-queue
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Move serialization to the final preview guard and queue rerenders
        run: |
          python - <<'PY'
          from pathlib import Path

          loader_path = Path('js/pdf-editor/loader.js')
          loader = loader_path.read_text(encoding='utf-8')
          old_loader_guard = """  function installPreviewSingleFlight(attempt = 0) {
              if (window.__pdfEditorPreviewSingleFlightV1) return true;
              if (typeof triggerPreview !== 'function') {
                if (attempt < 20) setTimeout(() => installPreviewSingleFlight(attempt + 1), 100 + attempt * 25);
                return false;
              }

              const originalTriggerPreview = triggerPreview;
              let inFlight = null;
              const serializedTriggerPreview = function(...args) {
                if (inFlight) return inFlight;
                inFlight = Promise.resolve()
                  .then(() => originalTriggerPreview.apply(this, args))
                  .finally(() => { inFlight = null; });
                return inFlight;
              };
              serializedTriggerPreview.__pdfEditorSingleFlightWrapped = true;
              window.__pdfEditorPreviewSingleFlightV1 = {
                getInFlight: () => inFlight,
              };
              triggerPreview = serializedTriggerPreview;
              window.triggerPreview = serializedTriggerPreview;
              return true;
            }

          """
          if old_loader_guard not in loader:
              raise SystemExit('loader single-flight block not found')
          loader = loader.replace(old_loader_guard, '', 1)
          old_boot = """  function bootEditorEnhancements() {
              installPreviewToolbarLayoutFix();
              installPreviewSingleFlight(0);
              installThumbnailPageBehavior(0);
            }
          """
          new_boot = """  function bootEditorEnhancements() {
              installPreviewToolbarLayoutFix();
              installThumbnailPageBehavior(0);
            }
          """
          if old_boot not in loader:
              raise SystemExit('loader boot block not found')
          loader_path.write_text(loader.replace(old_boot, new_boot, 1), encoding='utf-8')

          upload_path = Path('js/pdf-editor/upload-fix.js')
          upload = upload_path.read_text(encoding='utf-8')
          old_guard = """  function installFastPreviewGuard() {
              if (window.__pdfEditorFastPreviewGuardInstalledV6 || typeof triggerPreview !== 'function') return;
              window.__pdfEditorFastPreviewGuardInstalledV6 = true;
              const originalTriggerPreview = triggerPreview;
              const guarded = async function guardedTriggerPreview() {
                const manual = !!window.__pdfEditorManualPreviewRequest;
                if (window.__pdfEditorFastMode && !manual) {
                  const stats = aggregateStats();
                  showFastModePlaceholder(stats.pages, stats.bytes);
                  document.getElementById('previewBtn').disabled = false;
                  document.getElementById('downloadBtn').disabled = parsedPages.length === 0;
                  window.__pdfEditorManualPreviewRequest = false;
                  return;
                }
                if (window.__pdfEditorExtremeMode && manual) {
                  try { return await buildExtremeLayoutPreview(); }
                  finally { window.__pdfEditorManualPreviewRequest = false; }
                }
                try {
                  return await originalTriggerPreview.apply(this, arguments);
                } finally {
                  window.__pdfEditorManualPreviewRequest = false;
                }
              };
              triggerPreview = guarded;
              window.triggerPreview = guarded;
              document.addEventListener('click', (event) => {
                if (event.target?.closest('#previewBtn')) window.__pdfEditorManualPreviewRequest = true;
              }, true);
            }
          """
          new_guard = """  function installFastPreviewGuard() {
              if (window.__pdfEditorFastPreviewGuardInstalledV7 || typeof triggerPreview !== 'function') return;
              window.__pdfEditorFastPreviewGuardInstalledV7 = true;
              const originalTriggerPreview = triggerPreview;
              let previewInFlight = null;
              let rerenderQueued = false;
              let queuedManual = false;
              let queuedContext = null;
              let queuedArgs = [];

              async function runPreviewOnce(context, args, manual) {
                if (window.__pdfEditorFastMode && !manual) {
                  const stats = aggregateStats();
                  showFastModePlaceholder(stats.pages, stats.bytes);
                  document.getElementById('previewBtn').disabled = false;
                  document.getElementById('downloadBtn').disabled = parsedPages.length === 0;
                  return;
                }
                if (window.__pdfEditorExtremeMode && manual) {
                  return buildExtremeLayoutPreview();
                }
                return originalTriggerPreview.apply(context, args);
              }

              const guarded = function guardedTriggerPreview(...args) {
                const manual = !!window.__pdfEditorManualPreviewRequest;
                window.__pdfEditorManualPreviewRequest = false;

                if (previewInFlight) {
                  rerenderQueued = true;
                  queuedManual = queuedManual || manual;
                  queuedContext = this;
                  queuedArgs = args;
                  return previewInFlight;
                }

                const initialContext = this;
                const initialArgs = args;
                previewInFlight = (async () => {
                  let nextManual = manual;
                  let nextContext = initialContext;
                  let nextArgs = initialArgs;
                  let result;
                  do {
                    rerenderQueued = false;
                    result = await runPreviewOnce(nextContext, nextArgs, nextManual);
                    if (rerenderQueued) {
                      nextManual = queuedManual;
                      nextContext = queuedContext;
                      nextArgs = queuedArgs;
                      queuedManual = false;
                      queuedContext = null;
                      queuedArgs = [];
                    }
                  } while (rerenderQueued);
                  return result;
                })().finally(() => {
                  previewInFlight = null;
                  window.__pdfEditorManualPreviewRequest = false;
                });
                return previewInFlight;
              };

              window.__pdfEditorPreviewQueueV7 = {
                getInFlight: () => previewInFlight,
                hasQueuedRerender: () => rerenderQueued,
              };
              triggerPreview = guarded;
              window.triggerPreview = guarded;
              document.addEventListener('click', (event) => {
                if (event.target?.closest('#previewBtn')) window.__pdfEditorManualPreviewRequest = true;
              }, true);
            }
          """
          if old_guard not in upload:
              raise SystemExit('upload fast preview guard block not found')
          upload_path.write_text(upload.replace(old_guard, new_guard, 1), encoding='utf-8')

          test_path = Path('backend/tests/test_pdf_editor_thumbnail_navigation.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = """def test_preview_refreshes_share_one_in_flight_render_and_recheck_state():
              source = LOADER.read_text(encoding=\"utf-8\")
              assert \"function installPreviewSingleFlight(attempt = 0)\" in source
              assert \"if (inFlight) return inFlight;\" in source
              assert \"originalTriggerPreview.apply(this, args)\" in source
              assert \"async function refreshPreviewForNavigation()\" in source
              assert \"const stillStaleAfterAwait = Boolean(location)\" in source
              assert source.count(\"await refreshPreviewForNavigation();\") >= 2


          """
          new_test = """def test_preview_refreshes_are_queued_by_the_final_upload_guard():
              loader = LOADER.read_text(encoding=\"utf-8\")
              upload = (ROOT / \"js\" / \"pdf-editor\" / \"upload-fix.js\").read_text(encoding=\"utf-8\")
              assert \"installPreviewSingleFlight\" not in loader
              assert \"async function refreshPreviewForNavigation()\" in loader
              assert loader.count(\"await refreshPreviewForNavigation();\") >= 2
              assert \"__pdfEditorFastPreviewGuardInstalledV7\" in upload
              assert \"let previewInFlight = null;\" in upload
              assert \"if (previewInFlight)\" in upload
              assert \"rerenderQueued = true;\" in upload
              assert \"queuedManual = queuedManual || manual;\" in upload
              assert \"do {\" in upload and \"} while (rerenderQueued);\" in upload
              assert \"return buildExtremeLayoutPreview();\" in upload
              assert \"window.__pdfEditorPreviewQueueV7\" in upload


          """
          if old_test not in tests:
              raise SystemExit('old single-flight test not found')
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding='utf-8')
          PY
      - name: Restore quality gate and validate
        run: |
          git show origin/main:.github/workflows/quality-gate.yml > .github/workflows/quality-gate.yml
          node --check js/pdf-editor/loader.js
          node --check js/pdf-editor/upload-fix.js
          python scripts/check_inline_js.py
          python scripts/check_version_sync.py
          python scripts/validate_static_references.py
          python -m pip install pytest
          python -m pytest \
            backend/tests/test_pdf_editor_thumbnail_navigation.py \
            backend/tests/test_pdf_editor_july24_core_port.py \
            backend/tests/test_current_system_audit.py \
            backend/tests/test_pdf_editor_july20_runtime.py -q
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pdf-editor/loader.js js/pdf-editor/upload-fix.js backend/tests/test_pdf_editor_thumbnail_navigation.py .github/workflows/quality-gate.yml
          git commit -m "최종 미리보기 요청을 큐 방식으로 직렬화"
          git push origin HEAD:agent/final-preview-queue
