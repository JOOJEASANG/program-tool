name: Apply serialized thumbnail preview refresh

on:
  push:
    branches:
      - agent/serialize-thumbnail-preview-refresh

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/serialize-thumbnail-preview-refresh
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Serialize preview rebuilds and await stale refreshes
        run: |
          python - <<'PY'
          from pathlib import Path

          loader_path = Path('js/pdf-editor/loader.js')
          source = loader_path.read_text(encoding='utf-8')

          anchor = """  function showLimitedPreviewNotice(previews) {
          """
          helper = """  function installPreviewSingleFlight(attempt = 0) {
              if (window.__pdfEditorPreviewSingleFlightV1) return true;
              if (typeof triggerPreview !== 'function') {
                if (attempt < 20) setTimeout(() => installPreviewSingleFlight(attempt + 1), 100 + attempt * 25);
                return false;
              }

              const originalTriggerPreview = triggerPreview;
              let inFlight = null;
              const serializedTriggerPreview = function(...args) {
                if (inFlight) return inFlight;
                inFlight = Promise.resolve()
                  .then(() => originalTriggerPreview.apply(this, args))
                  .finally(() => { inFlight = null; });
                return inFlight;
              };
              serializedTriggerPreview.__pdfEditorSingleFlightWrapped = true;
              window.__pdfEditorPreviewSingleFlightV1 = {
                getInFlight: () => inFlight,
              };
              triggerPreview = serializedTriggerPreview;
              window.triggerPreview = serializedTriggerPreview;
              return true;
            }

            async function refreshPreviewForNavigation() {
              if (typeof triggerPreview !== 'function') return;
              window.__pdfEditorManualPreviewRequest = true;
              await triggerPreview();
            }

            function showLimitedPreviewNotice(previews) {
          """
          if anchor not in source:
              raise SystemExit('limited preview helper anchor not found')
          source = source.replace(anchor, helper, 1)

          old_refresh = """      if (typeof triggerPreview === 'function') {
                  window.__pdfEditorManualPreviewRequest = true;
                  await triggerPreview();
                }
                location = getPreviewLocationForPage(page);
                previews = [...document.querySelectorAll('#previewScroll .page-preview')];
                target = location ? previews[location.index] : null;
              }

              if (!target) {
          """
          new_refresh = """      await refreshPreviewForNavigation();
                location = getPreviewLocationForPage(page);
                previews = [...document.querySelectorAll('#previewScroll .page-preview')];
                target = location ? previews[location.index] : null;

                const refreshedLimitedExtreme = Boolean(window.__pdfEditorExtremeMode)
                  && previews.length > 0
                  && location
                  && previews.length < location.total;
                const stillStaleAfterAwait = Boolean(location)
                  && previews.length !== location.total
                  && !refreshedLimitedExtreme;
                if (stillStaleAfterAwait) {
                  await refreshPreviewForNavigation();
                  location = getPreviewLocationForPage(page);
                  previews = [...document.querySelectorAll('#previewScroll .page-preview')];
                  target = location ? previews[location.index] : null;
                }
              }

              if (!target) {
          """
          if old_refresh not in source:
              raise SystemExit('navigation refresh block not found')
          source = source.replace(old_refresh, new_refresh, 1)

          old_boot = """  function bootEditorEnhancements() {
              installPreviewToolbarLayoutFix();
              installThumbnailPageBehavior(0);
            }
          """
          new_boot = """  function bootEditorEnhancements() {
              installPreviewToolbarLayoutFix();
              installPreviewSingleFlight(0);
              installThumbnailPageBehavior(0);
            }
          """
          if old_boot not in source:
              raise SystemExit('editor enhancements boot block not found')
          loader_path.write_text(source.replace(old_boot, new_boot, 1), encoding='utf-8')

          test_path = Path('backend/tests/test_pdf_editor_thumbnail_navigation.py')
          tests = test_path.read_text(encoding='utf-8')
          test_anchor = """def test_stable_editor_surface_and_module_count_are_unchanged():
          """
          new_test = """def test_preview_refreshes_share_one_in_flight_render_and_recheck_state():
              source = LOADER.read_text(encoding=\"utf-8\")
              assert \"function installPreviewSingleFlight(attempt = 0)\" in source
              assert \"if (inFlight) return inFlight;\" in source
              assert \"originalTriggerPreview.apply(this, args)\" in source
              assert \"async function refreshPreviewForNavigation()\" in source
              assert \"const stillStaleAfterAwait = Boolean(location)\" in source
              assert source.count(\"await refreshPreviewForNavigation();\") >= 2


          def test_stable_editor_surface_and_module_count_are_unchanged():
          """
          if test_anchor not in tests:
              raise SystemExit('stable surface test anchor not found')
          test_path.write_text(tests.replace(test_anchor, new_test, 1), encoding='utf-8')
          PY
      - name: Restore quality gate and validate
        run: |
          git show origin/main:.github/workflows/quality-gate.yml > .github/workflows/quality-gate.yml
          node --check js/pdf-editor/loader.js
          python scripts/check_inline_js.py
          python scripts/check_version_sync.py
          python scripts/validate_static_references.py
          python -m pip install pytest
          python -m pytest \
            backend/tests/test_pdf_editor_thumbnail_navigation.py \
            backend/tests/test_current_system_audit.py \
            backend/tests/test_pdf_editor_july20_runtime.py -q
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pdf-editor/loader.js backend/tests/test_pdf_editor_thumbnail_navigation.py .github/workflows/quality-gate.yml
          git commit -m "미리보기 갱신을 단일 실행으로 직렬화"
          git push origin HEAD:agent/serialize-thumbnail-preview-refresh
