name: Repository quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-final-layout-audit:
    name: Apply final mobile layout fixes
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request' && github.head_ref == 'agent/full-system-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/full-system-audit
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Apply reviewed responsive fixes
        run: python scripts/apply_final_layout_audit_fixes.py
      - name: Remove audit-only files and restore normal quality gate
        run: |
          rm -f scripts/apply_final_layout_audit_fixes.py
          git checkout origin/main -- .github/workflows/quality-gate.yml
      - name: Run focused validation
        run: |
          python -m pip install pytest
          python scripts/check_inline_js.py
          python scripts/check_version_sync.py
          python scripts/validate_static_references.py
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          cd backend
          python -m pytest -q tests/test_current_system_audit.py tests/test_file_library_and_cover_ui.py tests/test_pdf_editor_july20_runtime.py
      - name: Commit final audit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "모바일 홈·관리자 레이아웃 최종 보완"
          git push origin HEAD:agent/full-system-audit
