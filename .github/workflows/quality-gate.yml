name: Apply shared preview coordinator

on:
  push:
    branches:
      - agent/final-preview-queue

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/final-preview-queue
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Share one queue from loader through final upload guard
        run: |
          python - <<'PY'
          from pathlib import Path

          loader_path = Path('js/pdf-editor/loader.js')
          loader = loader_path.read_text(encoding='utf-8')
          anchor = """  async function refreshPreviewForNavigation() {
          """
          coordinator = """  function installPreviewCoordinator(attempt = 0) {
              if (window.__pdfEditorPreviewCoordinatorV8) return window.__pdfEditorPreviewCoordinatorV8;
              if (typeof triggerPreview !== 'function') {
                if (attempt < 20) setTimeout(() => installPreviewCoordinator(attempt + 1), 100 + attempt * 25);
                return null;
              }

              const originalTriggerPreview = triggerPreview;
              let delegate = (context, args) => originalTriggerPreview.apply(context, args);
              let inFlight = null;
              let rerenderQueued = false;
              let queuedManual = false;
              let queuedContext = null;
              let queuedArgs = [];

              const request = function coordinatedPreviewRequest(...args) {
                const manual = !!window.__pdfEditorManualPreviewRequest;
                window.__pdfEditorManualPreviewRequest = false;

                if (inFlight) {
                  rerenderQueued = true;
                  queuedManual = queuedManual || manual;
                  queuedContext = this;
                  queuedArgs = args;
                  return inFlight;
                }

                const initialContext = this;
                const initialArgs = args;
                inFlight = (async () => {
                  let nextManual = manual;
                  let nextContext = initialContext;
                  let nextArgs = initialArgs;
                  let result;
                  let pendingError = null;

                  while (true) {
                    rerenderQueued = false;
                    pendingError = null;
                    try {
                      result = await delegate(nextContext, nextArgs, nextManual);
                    } catch (error) {
                      pendingError = error;
                    }

                    if (!rerenderQueued) {
                      if (pendingError) throw pendingError;
                      return result;
                    }

                    nextManual = queuedManual;
                    nextContext = queuedContext;
                    nextArgs = queuedArgs;
                    queuedManual = false;
                    queuedContext = null;
                    queuedArgs = [];
                  }
                })().finally(() => {
                  inFlight = null;
                  rerenderQueued = false;
                  queuedManual = false;
                  queuedContext = null;
                  queuedArgs = [];
                  window.__pdfEditorManualPreviewRequest = false;
                });
                return inFlight;
              };

              const coordinator = {
                request,
                setDelegate(nextDelegate) {
                  if (typeof nextDelegate === 'function') delegate = nextDelegate;
                },
                getOriginal: () => originalTriggerPreview,
                getInFlight: () => inFlight,
                hasQueuedRerender: () => rerenderQueued,
              };
              window.__pdfEditorPreviewCoordinatorV8 = coordinator;
              triggerPreview = request;
              window.triggerPreview = request;
              return coordinator;
            }

            window.__pdfEditorEnsurePreviewCoordinatorV8 = installPreviewCoordinator;

            async function refreshPreviewForNavigation() {
          """
          if anchor not in loader:
              raise SystemExit('navigation refresh anchor not found')
          loader = loader.replace(anchor, coordinator, 1)
          old_boot = """  function bootEditorEnhancements() {
              installPreviewToolbarLayoutFix();
              installThumbnailPageBehavior(0);
            }
          """
          new_boot = """  function bootEditorEnhancements() {
              installPreviewToolbarLayoutFix();
              installPreviewCoordinator(0);
              installThumbnailPageBehavior(0);
            }
          """
          if old_boot not in loader:
              raise SystemExit('loader boot block not found')
          loader_path.write_text(loader.replace(old_boot, new_boot, 1), encoding='utf-8')

          upload_path = Path('js/pdf-editor/upload-fix.js')
          upload = upload_path.read_text(encoding='utf-8')
          start = upload.index('  function installFastPreviewGuard() {')
          end = upload.index('\n\n  async function patchedHandleFile(file)', start)
          new_guard = """  function installFastPreviewGuard() {
              if (window.__pdfEditorFastPreviewGuardInstalledV8 || typeof triggerPreview !== 'function') return;
              const ensureCoordinator = window.__pdfEditorEnsurePreviewCoordinatorV8;
              const coordinator = window.__pdfEditorPreviewCoordinatorV8
                || (typeof ensureCoordinator === 'function' ? ensureCoordinator(0) : null);
              if (!coordinator) return;

              window.__pdfEditorFastPreviewGuardInstalledV8 = true;
              const originalTriggerPreview = coordinator.getOriginal();
              coordinator.setDelegate(async (context, args, manual) => {
                if (window.__pdfEditorFastMode && !manual) {
                  const stats = aggregateStats();
                  showFastModePlaceholder(stats.pages, stats.bytes);
                  document.getElementById('previewBtn').disabled = false;
                  document.getElementById('downloadBtn').disabled = parsedPages.length === 0;
                  return;
                }
                if (window.__pdfEditorExtremeMode && manual) {
                  return buildExtremeLayoutPreview();
                }
                return originalTriggerPreview.apply(context, args);
              });

              triggerPreview = coordinator.request;
              window.triggerPreview = coordinator.request;
              document.addEventListener('click', (event) => {
                if (event.target?.closest('#previewBtn')) window.__pdfEditorManualPreviewRequest = true;
              }, true);
            }
          """
          upload_path.write_text(upload[:start] + new_guard + upload[end:], encoding='utf-8')

          test_path = Path('backend/tests/test_pdf_editor_thumbnail_navigation.py')
          tests = test_path.read_text(encoding='utf-8')
          start_test = tests.index('def test_preview_refreshes_are_queued_by_the_final_upload_guard():')
          end_test = tests.index('\n\ndef test_stable_editor_surface_and_module_count_are_unchanged():', start_test)
          new_test = """def test_preview_requests_share_one_coordinator_before_and_after_upload_fix():
              loader = LOADER.read_text(encoding=\"utf-8\")
              upload = (ROOT / \"js\" / \"pdf-editor\" / \"upload-fix.js\").read_text(encoding=\"utf-8\")
              assert \"function installPreviewCoordinator(attempt = 0)\" in loader
              assert \"window.__pdfEditorEnsurePreviewCoordinatorV8\" in loader
              assert \"if (inFlight)\" in loader
              assert \"rerenderQueued = true;\" in loader
              assert \"while (true)\" in loader
              assert \"if (pendingError) throw pendingError;\" in loader
              assert \"installPreviewCoordinator(0);\" in loader
              assert \"__pdfEditorFastPreviewGuardInstalledV8\" in upload
              assert \"coordinator.setDelegate\" in upload
              assert \"return buildExtremeLayoutPreview();\" in upload
              assert \"triggerPreview = coordinator.request;\" in upload
              assert \"let previewInFlight = null;\" not in upload
              assert loader.count(\"await refreshPreviewForNavigation();\") >= 2
          """
          tests = tests[:start_test] + new_test + tests[end_test:]
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Restore quality gate and validate
        run: |
          git show origin/main:.github/workflows/quality-gate.yml > .github/workflows/quality-gate.yml
          node --check js/pdf-editor/loader.js
          node --check js/pdf-editor/upload-fix.js
          python scripts/check_inline_js.py
          python scripts/check_version_sync.py
          python scripts/validate_static_references.py
          python -m pip install pytest
          python -m pytest \
            backend/tests/test_pdf_editor_thumbnail_navigation.py \
            backend/tests/test_pdf_editor_july24_core_port.py \
            backend/tests/test_current_system_audit.py \
            backend/tests/test_pdf_editor_july20_runtime.py -q
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/pdf-editor/loader.js js/pdf-editor/upload-fix.js backend/tests/test_pdf_editor_thumbnail_navigation.py .github/workflows/quality-gate.yml
          git commit -m "공유 미리보기 코디네이터로 큐를 통합"
          git push origin HEAD:agent/final-preview-queue
