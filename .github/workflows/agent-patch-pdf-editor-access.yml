name: Agent patch PDF editor access

on:
  push:
    branches: [agent/security-stability-upgrade]
    paths:
      - '.github/workflows/agent-patch-pdf-editor-access.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-stability-upgrade
          fetch-depth: 1
      - name: Replace legacy client admin lookup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/pdf-editor.html')
          text = path.read_text(encoding='utf-8')
          start_marker = "auth.onAuthStateChanged(async user => {"
          end_marker = "document.getElementById('navLogout').addEventListener"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('PDF editor access block markers were not found')

          replacement = r'''auth.onAuthStateChanged(async user => {
            if (!user) { location.href = '../login.html'; return; }
            document.getElementById('navUserName').textContent = user.displayName || user.email.split('@')[0];

            try {
              const token = await user.getIdToken();
              const response = await fetch('/api/access/pdf-editor', {
                headers: { Authorization: `Bearer ${token}` },
                cache: 'no-store',
              });
              const access = await response.json().catch(() => ({}));
              if (!response.ok || !access.allowed) {
                denyPdfAccess(access.detail || 'PDF 편집기는 관리자 승인 후 사용할 수 있습니다.');
                return;
              }
            } catch (error) {
              console.error('Permission check failed', error);
              denyPdfAccess('권한 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
              return;
            }

            document.getElementById('authLoading').style.display = 'none';
            document.getElementById('navHistoryBtn').style.display = 'flex';
            document.getElementById('navSessionBtn').style.display = 'flex';
            document.getElementById('navSessionLoadBtn').style.display = 'flex';
          });
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Commit targeted patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pdf-editor.html
          git diff --cached --quiet || git commit -m "fix: use server access check in pdf editor [skip ci]"
          git push
