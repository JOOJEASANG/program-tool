name: One-off individual margin version sync

on:
  push:
    branches:
      - agent/restore-individual-paper-margins
    paths:
      - .github/workflows/oneoff-individual-margin-version.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-individual-paper-margins
          fetch-depth: 0
      - name: Sync deployment runtime version
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '2026.07.31.002'
          new = '2026.07.31.003'
          paths = [
              Path('js/firebase-config.js'),
              Path('js/sw-register.js'),
              Path('sw.js'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{old} not found in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit synchronized version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/firebase-config.js js/sw-register.js sw.js
          git commit -m "PDF 개별 여백 배포 캐시 버전 동기화"
          git push origin HEAD:agent/restore-individual-paper-margins
