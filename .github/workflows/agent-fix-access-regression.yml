name: Agent fix access regression

on:
  push:
    branches: [agent/security-stability-upgrade]
    paths:
      - '.github/workflows/agent-fix-access-regression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-stability-upgrade
          fetch-depth: 0
      - name: Patch staged-deployment access behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'js/access-compat.js',
              "    'pdf-editor': false,",
              "    'pdf-editor': true,",
          )
          replace(
              'backend/utils/permissions.py',
              '    "pdf-editor": False,',
              '    "pdf-editor": True,',
          )

          replace(
              'admin.html',
              '''  async function api(path,options={}){
    const user=auth.currentUser;if(!user)throw new Error('로그인이 필요합니다.');
    const token=await user.getIdToken();
    const resp=await fetch(path,{...options,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(options.headers||{})}});
    const data=await resp.json().catch(()=>({}));
    if(!resp.ok)throw new Error(data.detail||`서버 오류 (${resp.status})`);
    return data;
  }''',
              '''  async function api(path,options={}){
    for(let i=0;i<80&&!window.ProgramToolCompat;i++)await new Promise(resolve=>setTimeout(resolve,50));
    if(!window.ProgramToolCompat)throw new Error('관리자 기능을 불러오지 못했습니다.');
    return window.ProgramToolCompat.adminRequest(path,options);
  }''',
          )

          replace(
              'login.html',
              '''    auth.onAuthStateChanged(async user => {
      if (!user) return;
      try {
        const doc = await db.collection('settings').doc('admin').get();
        const emails = (doc.exists ? (doc.data().emails || []) : [])
          .map(e => String(e).trim().toLowerCase());
        const userEmail = String(user.email || '').trim().toLowerCase();
        if (emails.includes(userEmail)) {
          window.location.href = 'admin.html';
          return;
        }
      } catch (e) {}
      window.location.href = 'index.html';
    });''',
              '''    auth.onAuthStateChanged(async user => {
      if (!user) return;
      try {
        for(let i=0;i<80&&!window.ProgramToolCompat;i++)await new Promise(resolve=>setTimeout(resolve,50));
        if(window.ProgramToolCompat){
          const status=await window.ProgramToolCompat.adminStatus();
          if(status.isAdmin){window.location.replace('admin.html');return;}
        }
      } catch (e) { console.warn('[login] administrator check failed', e); }
      window.location.replace('index.html');
    });''',
          )

          replace(
              'tools/pdf-editor.html',
              '''  try {
    const token = await user.getIdToken();
    const response = await fetch('/api/access/pdf-editor', {
      headers: { Authorization: `Bearer ${token}` },
      cache: 'no-store',
    });
    const access = await response.json().catch(() => ({}));
    if (!response.ok || !access.allowed) {
      denyPdfAccess(access.detail || 'PDF 편집기는 관리자 승인 후 사용할 수 있습니다.');
      return;
    }
  } catch (error) {
    console.error('Permission check failed', error);
    denyPdfAccess('권한 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    return;
  }''',
              '''  try {
    for (let i = 0; i < 80 && !window.ProgramToolCompat; i++) {
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    if (!window.ProgramToolCompat) throw new Error('권한 확인 모듈을 불러오지 못했습니다.');
    const access = await window.ProgramToolCompat.programAccess('pdf-editor');
    if (!access.allowed) {
      denyPdfAccess('PDF 편집기는 관리자 승인 후 사용할 수 있습니다.');
      return;
    }
  } catch (error) {
    console.error('Permission check failed', error);
    denyPdfAccess(error.message || '권한 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    return;
  }''',
          )
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html login.html tools/pdf-editor.html js/access-compat.js backend/utils/permissions.py
          git diff --cached --quiet || git commit -m "fix: restore admin redirect and member access"
          git push origin HEAD:agent/security-stability-upgrade
