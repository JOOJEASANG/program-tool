name: Enable cover layer style module

on:
  push:
    branches: [main]
    paths:
      - 'js/cover-editor-layer-style.js'
      - '.github/workflows/enable-cover-layer-style.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add layer style script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/perfect-binding-cover.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="../js/cover-editor-layer-style.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit generated page change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/perfect-binding-cover.html
          git commit -m "chore: load cover layer style module"
          git push
