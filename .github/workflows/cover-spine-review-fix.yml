name: Cover spine review fix

on:
  push:
    branches:
      - agent/cover-spine-print-safety-stage12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/cover-spine-print-safety-stage12
          fetch-depth: 0
      - name: Address blocking spine review feedback
        shell: python
        run: |
          from pathlib import Path

          js_path = Path('js/cover-spine-print-safety.js')
          source = js_path.read_text(encoding='utf-8')

          old_entries = '''  function currentSpineEntries() {
    const output = [];
    try {
      const data = window.CoverTextZones?.data?.spine;
      if (data) {
        for (const zone of ZONES) {
          for (const entry of data[zone] || []) {
            const layout = typeof state !== 'undefined' ? state.layout?.[entry.id] : null;
            output.push({ ...entry, zone, scale: finite(layout?.scale, finite(entry.scale, 100)), y: finite(layout?.y, finite(entry.y, zone === 'top' ? 18 : zone === 'bottom' ? 84 : 50)) });
          }
        }
      }
    } catch (_) {}
    if (output.some((entry) => String(entry.text || '').trim())) return output;
    const legacy = String(byId('spineTitle')?.value || '').trim();
    return legacy ? [{ id: 'legacySpineTitle', zone: 'center', text: legacy, size: positive(byId('spineTextSize')?.value, 11), scale: 100, y: 50 }] : [];
  }
'''
          new_entries = '''  function currentSpineEntries() {
    const output = [];
    const textApi = window.CoverTextZones;
    if (textApi) {
      try {
        const data = textApi.data?.spine;
        if (data) {
          for (const zone of ZONES) {
            for (const entry of data[zone] || []) {
              const layout = typeof state !== 'undefined' ? state.layout?.[entry.id] : null;
              output.push({ ...entry, zone, scale: finite(layout?.scale, finite(entry.scale, 100)), y: finite(layout?.y, finite(entry.y, zone === 'top' ? 18 : zone === 'bottom' ? 84 : 50)) });
            }
          }
        }
      } catch (_) {}
      return output;
    }
    const legacy = String(byId('spineTitle')?.value || '').trim();
    return legacy ? [{ id: 'legacySpineTitle', zone: 'center', text: legacy, size: positive(byId('spineTextSize')?.value, 11), scale: 100, y: 50 }] : [];
  }
'''
          if source.count(old_entries) != 1:
              raise SystemExit('currentSpineEntries boundary not found exactly once')
          source = source.replace(old_entries, new_entries, 1)

          guard_code = '''  const OUTPUT_IDS = ['pdfBtn', 'guidePdfBtn', 'pngBtn'];

  function currentPreflightItemsFromDom() {
    const list = byId('coverPreflightList');
    if (!list) return [];
    return [...list.querySelectorAll('strong')].map((node) => {
      const text = String(node.textContent || '').trim();
      return { level: text.startsWith('✕') ? 'error' : text.startsWith('!') ? 'warn' : 'ok' };
    });
  }

  function syncSpinePreflightRow(result) {
    const list = byId('coverPreflightList');
    if (!list) return;
    list.querySelectorAll('[data-cover-spine-safety-issue="1"]').forEach((row) => row.remove());
    const item = preflightIssue(result);
    appendPreflightRow(item);
    updatePreflightSummary(currentPreflightItemsFromDom());
  }

  function guardUnsafeSpineOutput(event) {
    const result = renderEvaluation(currentEvaluation());
    syncSpinePreflightRow(result);
    if (result.level !== 'error') return;
    event.preventDefault();
    event.stopImmediatePropagation();
    event.stopPropagation();
    try { window.setStatus?.('책등 글자 인쇄 오류를 먼저 수정해 주세요.', 'err'); } catch (_) {}
    byId('coverSpinePrintSafety')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function installOutputGuards() {
    for (const id of OUTPUT_IDS) {
      const button = byId(id);
      if (!button || button.dataset.coverSpineSafetyGuardV1 === '1') continue;
      button.dataset.coverSpineSafetyGuardV1 = '1';
      button.addEventListener('click', guardUnsafeSpineOutput, { capture: true });
    }
  }

'''
          anchor = '  function wrapPreflightButton(id) {'
          if source.count(anchor) != 1:
              raise SystemExit('preflight wrapper anchor not found exactly once')
          source = source.replace(anchor, guard_code + anchor, 1)

          old_update = '''  function update() {
    const result = renderEvaluation(); wrapPreflightButton('runCoverPreflight'); wrapPreflightButton('refreshCoverPreflight'); return result;
  }
'''
          new_update = '''  function update() {
    const result = renderEvaluation();
    wrapPreflightButton('runCoverPreflight');
    wrapPreflightButton('refreshCoverPreflight');
    installOutputGuards();
    return result;
  }
'''
          if source.count(old_update) != 1:
              raise SystemExit('update boundary not found exactly once')
          source = source.replace(old_update, new_update, 1)

          old_export = "currentEvaluation, preflightIssue, renderEvaluation, applyRecommendedSizes, update, stage: 'multi-layer-spine-print-fit-safety'"
          new_export = "currentEvaluation, preflightIssue, renderEvaluation, applyRecommendedSizes, guardUnsafeSpineOutput, installOutputGuards, update, stage: 'multi-layer-spine-print-fit-safety'"
          if source.count(old_export) != 1:
              raise SystemExit('export boundary not found exactly once')
          source = source.replace(old_export, new_export, 1)
          js_path.write_text(source, encoding='utf-8')

          behavior_path = Path('backend/tests/test_cover_spine_print_safety_behavior.cjs')
          behavior = behavior_path.read_text(encoding='utf-8')
          old_document = "const document = { getElementById() { return null; } };"
          new_document = "const elements = new Map();\nconst document = { getElementById(id) { return elements.get(id) || null; } };"
          if behavior.count(old_document) != 1:
              raise SystemExit('behavior document boundary not found')
          behavior = behavior.replace(old_document, new_document, 1)
          stage_anchor = "assert.equal(api.stage, 'multi-layer-spine-print-fit-safety');\n"
          stage_insert = """assert.equal(api.stage, 'multi-layer-spine-print-fit-safety');

elements.set('spineTitle', { value: '구형 책등 제목' });
window.CoverTextZones = { data: { spine: { top: [], center: [], bottom: [] } } };
assert.equal(api.currentSpineEntries().length, 0, 'multi-layer editor must not fall back to hidden legacy text');
delete window.CoverTextZones;
assert.equal(api.currentSpineEntries()[0].id, 'legacySpineTitle', 'legacy fallback remains available when the multi-layer editor is unavailable');
elements.delete('spineTitle');
"""
          if behavior.count(stage_anchor) != 1:
              raise SystemExit('behavior stage anchor not found')
          behavior = behavior.replace(stage_anchor, stage_insert, 1)
          behavior_path.write_text(behavior, encoding='utf-8')

          test_path = Path('backend/tests/test_cover_spine_print_safety_stage12.py')
          test_source = test_path.read_text(encoding='utf-8')
          marker_anchor = '''        "updatePreflightSummary(items)",
'''
          marker_replacement = '''        "updatePreflightSummary(items)",
        "const OUTPUT_IDS = ['pdfBtn', 'guidePdfBtn', 'pngBtn']",
        "button.addEventListener('click', guardUnsafeSpineOutput, { capture: true })",
        "event.stopImmediatePropagation()",
        "syncSpinePreflightRow(result)",
'''
          if test_source.count(marker_anchor) != 1:
              raise SystemExit('static output marker anchor not found')
          test_source = test_source.replace(marker_anchor, marker_replacement, 1)
          behavior_test_anchor = '\n\ndef test_cover_spine_safety_behavior_executes():\n'
          new_test = '''

def test_cover_spine_safety_uses_legacy_text_only_without_multi_layer_editor():
    source = SAFETY.read_text(encoding="utf-8")
    start = source.index("function currentSpineEntries")
    end = source.index("function currentEvaluation", start)
    block = source[start:end]
    assert "const textApi = window.CoverTextZones" in block
    assert "if (textApi)" in block
    assert block.index("return output") < block.index("const legacy")


def test_cover_spine_safety_behavior_executes():
'''
          if test_source.count(behavior_test_anchor) != 1:
              raise SystemExit('behavior test anchor not found')
          test_source = test_source.replace(behavior_test_anchor, new_test, 1)
          test_path.write_text(test_source, encoding='utf-8')
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/cover-spine-print-safety.js backend/tests/test_cover_spine_print_safety_behavior.cjs backend/tests/test_cover_spine_print_safety_stage12.py
          git commit -m "책등 출력 경계와 구형 문구 판정 보강"
          git push origin HEAD:agent/cover-spine-print-safety-stage12
