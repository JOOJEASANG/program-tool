name: Cover recovery boundary patch

on:
  push:
    branches:
      - agent/cover-recovery-checkpoints-stage11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/cover-recovery-checkpoints-stage11
          fetch-depth: 0
      - name: Patch recovery boundaries
        shell: python
        run: |
          from pathlib import Path
          path = Path('js/cover-recovery-checkpoints.js')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "request.onblocked = () => reject(new Error('다른 창에서 사용 중인 작업 저장소를 닫아 주세요.'));",
              "request.onblocked = () => { dbPromise = null; reject(new Error('다른 창에서 사용 중인 작업 저장소를 닫아 주세요.')); };",
              1,
          )
          source = source.replace(
              "const transaction = db.transaction(storeName, 'readonly');\n    const result = await requestPromise(transaction.objectStore(storeName).get(id));\n    await transactionPromise(transaction);",
              "const transaction = db.transaction(storeName, 'readonly');\n    const completion = transactionPromise(transaction);\n    const result = await requestPromise(transaction.objectStore(storeName).get(id));\n    await completion;",
              1,
          )
          source = source.replace(
              "const transaction = db.transaction(storeName, 'readonly');\n    const result = await requestPromise(transaction.objectStore(storeName).getAll());\n    await transactionPromise(transaction);",
              "const transaction = db.transaction(storeName, 'readonly');\n    const completion = transactionPromise(transaction);\n    const result = await requestPromise(transaction.objectStore(storeName).getAll());\n    await completion;",
              1,
          )
          source = source.replace(
              "if (button) button.disabled = true;\n    activeRestore = true;\n    clearTimeout(saveTimer);\n    try {\n      await queueSave({ force: true });",
              "if (button) button.disabled = true;\n    clearTimeout(saveTimer);\n    try {\n      await queueSave({ manual: true, force: true });\n      activeRestore = true;",
              1,
          )
          required = [
              "const completion = transactionPromise(transaction);",
              "await queueSave({ manual: true, force: true });\n      activeRestore = true;",
              "request.onblocked = () => { dbPromise = null;",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'patch incomplete: {missing}')
          path.write_text(source, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/cover-recovery-checkpoints.js
          git commit -m "책표지 복구본 트랜잭션과 복원 전 보존 보강"
          git push origin HEAD:agent/cover-recovery-checkpoints-stage11
