name: Apply requested file library and cover update

on:
  push:
    branches:
      - agent/remove-history-cover-floating-preview
    paths:
      - .github/scripts/apply_file_library_cover_update.py
      - .github/workflows/apply-file-library-cover-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-history-cover-floating-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply requested changes
        run: python .github/scripts/apply_file_library_cover_update.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "내 파일함 제거 및 책표지제작 UI 통일"
          git push origin HEAD:agent/remove-history-cover-floating-preview
