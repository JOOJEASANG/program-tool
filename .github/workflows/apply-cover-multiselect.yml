name: Apply cover multiselect upgrade

on:
  push:
    branches: [main]
    paths:
      - 'js/cover-editor-multiselect.js'
      - '.github/workflows/apply-cover-multiselect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add multiselect script to cover editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/perfect-binding-cover.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="../js/cover-editor-multiselect.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '</body>')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated loader change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/perfect-binding-cover.html
          git commit -m 'feat: enable cover editor multi-select tools'
          git push
