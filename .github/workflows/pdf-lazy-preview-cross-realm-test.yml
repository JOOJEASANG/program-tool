name: PDF lazy preview cross realm test patch

on:
  push:
    branches:
      - agent/pdf-viewport-lazy-preview-stage2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/pdf-viewport-lazy-preview-stage2
          fetch-depth: 0
      - name: Normalize VM arrays before comparison
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/tests/test_pdf_viewport_lazy_preview_behavior.cjs')
          source = path.read_text(encoding='utf-8')
          replacements = {
              "assert.deepEqual(outputCalls.map((call) => call.outputIndex), [0, 1]);": "assert.equal(JSON.stringify(outputCalls.map((call) => call.outputIndex)), JSON.stringify([0, 1]));",
              "assert.deepEqual(editCalls.map((call) => [call.outputIndex, call.total]), [[0, 2], [1, 2]]);": "assert.equal(JSON.stringify(editCalls.map((call) => [call.outputIndex, call.total])), JSON.stringify([[0, 2], [1, 2]]));",
              "assert.deepEqual(previewNodes.map((node) => Number(node.dataset.outputIndex)), [0, 1]);": "assert.equal(JSON.stringify(previewNodes.map((node) => Number(node.dataset.outputIndex))), JSON.stringify([0, 1]));",
              "assert.deepEqual(editCalls.map((call) => [call.outputIndex, call.total]), [[0, 1]]);": "assert.equal(JSON.stringify(editCalls.map((call) => [call.outputIndex, call.total])), JSON.stringify([[0, 1]]));",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'comparison boundary not found exactly once: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
      - name: Commit comparison fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_pdf_viewport_lazy_preview_behavior.cjs
          git commit -m "PDF 지연 미리보기 VM 배열 비교 수정"
          git push origin HEAD:agent/pdf-viewport-lazy-preview-stage2
