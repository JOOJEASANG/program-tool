name: PDF lazy preview test deduplicate

on:
  push:
    branches:
      - agent/pdf-viewport-lazy-preview-stage2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/pdf-viewport-lazy-preview-stage2
          fetch-depth: 0
      - name: Remove duplicate registry declaration
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/tests/test_pdf_viewport_lazy_preview_behavior.cjs')
          source = path.read_text(encoding='utf-8')
          duplicate = "const registry = new Map();\n\nconst registry = new Map();"
          if source.count(duplicate) != 1:
              raise SystemExit('duplicate registry declaration not found exactly once')
          source = source.replace(duplicate, "const registry = new Map();", 1)
          path.write_text(source, encoding='utf-8')
      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_pdf_viewport_lazy_preview_behavior.cjs
          git commit -m "PDF 지연 미리보기 테스트 중복 선언 정리"
          git push origin HEAD:agent/pdf-viewport-lazy-preview-stage2
