name: Connect cover preflight module

on:
  push:
    branches: [main]
    paths:
      - 'js/cover-editor-preflight-project.js'
      - '.github/workflows/connect-cover-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add script to cover editor
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/perfect-binding-cover.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="../js/cover-editor-preflight-project.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '</body>')
              path.write_text(text, encoding='utf-8')
      - name: Commit page connection
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/perfect-binding-cover.html
          git commit -m "Load cover preflight and project module"
          git push
