name: PDF import transaction runtime patch

on:
  push:
    branches:
      - agent/pdf-import-transaction-safety-stage1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/pdf-import-transaction-safety-stage1
          fetch-depth: 0
      - name: Register transactional import module
        shell: python
        run: |
          from pathlib import Path
          path = Path('js/sw-register.js')
          source = path.read_text(encoding='utf-8')
          anchor = "      tasks.push(load('pdfFileContextScopeScript','/js/pdf-editor/file-context-scope.js?v=20260805-1'));\n"
          addition = anchor + "      tasks.push(load('pdfImportTransactionSafetyScriptV1','/js/pdf-editor/import-transaction-safety.js?v=20260806-1'));\n"
          if source.count(anchor) != 1:
              raise SystemExit('PDF editor runtime anchor not found exactly once')
          if 'pdfImportTransactionSafetyScriptV1' not in source:
              source = source.replace(anchor, addition, 1)
          path.write_text(source, encoding='utf-8')
      - name: Commit runtime registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/sw-register.js
          git commit -m "PDF 파일 추가 안전 모듈 런타임 연결"
          git push origin HEAD:agent/pdf-import-transaction-safety-stage1
