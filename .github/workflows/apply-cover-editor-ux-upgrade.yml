name: Apply cover editor UX upgrade

on:
  push:
    branches:
      - agent/cover-editor-ux-upgrade
    paths:
      - scripts/apply_editor_improvements.py
      - js/cover-editor-ux-upgrade.js
      - .github/workflows/apply-cover-editor-ux-upgrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cover-editor-ux-upgrade
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cover patches
        run: python scripts/apply_editor_improvements.py
      - name: Validate JavaScript
        run: node --check js/cover-editor-ux-upgrade.js
      - name: Commit generated HTML
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/perfect-binding-cover.html
          git commit -m "apply cover editor UX upgrade"
          git push
