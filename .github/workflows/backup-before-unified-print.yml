name: Manual source backup artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create repository ZIP
        run: |
          mkdir -p backup-tmp
          zip -r backup-tmp/program-tool-source-${GITHUB_SHA::7}.zip . \
            -x '.git/*' 'backup-tmp/*' 'backups/*' 'node_modules/*' '**/__pycache__/*'
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: program-tool-source-${{ github.sha }}
          path: backup-tmp/*.zip
          retention-days: 90
          if-no-files-found: error
