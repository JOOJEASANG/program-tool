name: Manual repository backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Create repository ZIP
        run: |
          mkdir -p backup-tmp
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          zip -r "backup-tmp/program-tool-${stamp}.zip" . \
            -x '.git/*' 'backup-tmp/*' 'backups/*' 'backend/venv/*' 'backend/.venv/*' '**/node_modules/*'

      - name: Upload backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: program-tool-backup
          path: backup-tmp/*.zip
          retention-days: 30
          if-no-files-found: error
