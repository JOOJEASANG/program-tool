<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캐시 복구 · Program Tool</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f8;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#0f172a}
    .box{background:white;border-radius:18px;box-shadow:0 18px 50px rgba(15,23,42,.14);padding:28px;max-width:420px;width:calc(100% - 32px);text-align:center}
    h1{font-size:22px;margin:0 0 10px}p{font-size:14px;color:#64748b;line-height:1.6}button,a{display:block;width:100%;box-sizing:border-box;border:0;border-radius:10px;padding:12px 16px;font-weight:800;font-size:14px;text-decoration:none;margin-top:10px;cursor:pointer}button{background:#12396d;color:white}a{background:#e5e7eb;color:#111827}.status{margin-top:14px;font-size:13px;color:#166534;font-weight:700;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="box">
    <h1>캐시/서비스워커 복구</h1>
    <p>PDF 문서편집기나 디자인 프로그램이 열리지 않을 때 이 버튼을 누르면 이전 서비스워커와 캐시를 제거합니다.</p>
    <button id="resetBtn">복구 실행</button>
    <a href="/tools/pdf-editor.html">PDF 문서편집기 열기</a>
    <a href="/tools/perfect-binding-cover.html">책표지제작 열기</a>
    <div class="status" id="status"></div>
  </div>
  <script>
    async function resetAppCache(){
      const status=document.getElementById('status');
      status.textContent='복구 중...';
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        status.textContent='복구 완료. 아래 버튼으로 다시 접속하세요.';
      }catch(e){
        status.textContent='복구 중 오류: '+(e.message||e);
      }
    }
    document.getElementById('resetBtn').onclick=resetAppCache;
    resetAppCache();
  </script>
</body>
</html>
