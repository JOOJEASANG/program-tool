gram-detail"><div class="desc">${p.desc}</div><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="program-action"><span class="status">${p.coming?'COMING SOON':'사용 가능'}</span><span class="cta">${p.coming?'준비 중':'시작하기'} <span class="cta-arrow">${p.coming?'·':'→'}</span></span></div>`;document.getElementById('slider').appendChild(e)}function switchStudio(key,scrollHero=false){activeStudio=key;const s=STUDIOS[key];document.querySelectorAll('.studio-link').forEach(x=>x.classList.toggle('active',x.dataset.studio===key));const hero=document.getElementById('hero');hero.className='hero '+s.className;document.getElementById('heroBadge').textContent=s.badge;document.getElementById('heroTitle').innerHTML=s.heroTitle;document.getElementById('heroLead').textContent=s.lead;document.getElementById('heroCopy').innerHTML=s.copy;const v=s.visual;['visualIcon','visualTitle','visualText','visualStatus','smallIcon','smallTitle','smallText'].forEach((id,i)=>document.getElementById(id).textContent=v[i]);document.getElementById('heroSteps').innerHTML=s.steps.map(x=>`<div class="hero-step"><div class="hero-step-no">STEP ${x[0]}</div><div class="hero-step-title">${x[1]}</div><div class="hero-step-text">${x[2]}</div></div>`).join('');document.getElementById('sectionKicker').textContent=s.kicker;document.getElementById('sectionTitle').textContent=s.title;const slider=document.getElementById('slider');slider.innerHTML='';s.programs.forEach(addCard);const ready=s.programs.filter(p=>!p.coming).length,soon=s.programs.filter(p=>p.coming).length;document.getElementById('count').textContent=`사용 가능 ${ready}개 · 준비 중 ${soon}개`;if(scrollHero)requestAnimationFrame(()=>hero.scrollIntoView({behavior:'smooth',block:'start'}))}function paintAvatar(target,user,name){target.innerHTML='';if(user.photoURL){const img=document.createElement('img');img.src=user.photoURL;target.appendChild(img)}else target.textContent=name.charAt(0)}function showUser(user){loginBtn.classList.add('hidden');startBtn.classList.add('hidden');userBox.classList.remove('hidden');const name=user.displayName||(user.email||'').split('@')[0];userName.textContent=name;accountName.textContent=name;accountMini.textContent=name.charAt(0);userEmail.textContent=user.email||'';greetingText.textContent=`안녕하세요, ${name}님`;paintAvatar(avatar,user,name)}buildNav();switchStudio('design');auth.onAuthStateChanged(async user=>{loading.style.display='none';if(!user)return;showUser(user);try{const access=await ProgramAccess.getAccess(user);if(!access.approved){approval.classList.remove('hidden');return}greeting.classList.remove('hidden');isAdmin=!!access.admin;if(isAdmin){adminBtn.classList.remove('hidden');testBtn.classList.remove('hidden')}}catch(e){approval.classList.remove('hidden')}});userBox.onclick=e=>{e.stopPropagation();userBox.classList.toggle('open')};document.onclick=()=>userBox.classList.remove('open');logoutBtn.onclick=async()=>{await auth.signOut();location.reload()};</script></body></html>
