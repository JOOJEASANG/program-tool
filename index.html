<!doctype html>
<html lang="ko" data-home-static-professional="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program Studio · 인쇄·출력 실무 도구</title>
<meta name="description" content="인쇄물 사전 검토, PDF 편집·검사를 카테고리별로 제공하는 인쇄·출력 실무 웹 도구">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--sb-w:252px;--tb-h:78px;--sb-bg:#0c1526;--sb-hover:rgba(255,255,255,.07);--sb-active:#1e40af;--sb-text:#b0c6de;--sb-dim:#7a96b4;--sb-border:rgba(255,255,255,.1);--bg:#f0f4f8;--card:#fff;--accent:#2563eb;--accent-d:#1d4ed8;--t1:#0f172a;--t2:#475569;--t3:#94a3b8;--line:#e2e8f0;--r:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Pretendard,"Noto Sans KR",sans-serif;color:var(--t1);background:var(--bg);line-height:1;min-height:100vh}
.hidden{display:none!important}

/* LOADING */
#loading{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:9999}
.spin{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* APP LAYOUT */
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:var(--sb-w);flex:0 0 var(--sb-w);background:var(--sb-bg);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:200;transition:transform .25s ease}
.sb-logo{height:var(--tb-h);display:flex;align-items:center;gap:11px;padding:0 18px;text-decoration:none;border-bottom:1px solid var(--sb-border);flex:0 0 var(--tb-h)}
.sb-mark{width:36px;height:36px;background:linear-gradient(135deg,#1e40af,#0ea5e9);border-radius:10px;display:grid;place-items:center;flex:0 0 36px}
.sb-mark svg{width:22px;height:22px}
.sb-brand{display:flex;flex-direction:column}
.sb-name{font-size:15px;font-weight:900;color:#fff;letter-spacing:-.3px}
.sb-sub{font-size:9px;font-weight:800;color:var(--sb-dim);letter-spacing:1.2px;margin-top:3px;text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;padding:16px 10px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.sb-section-label{font-size:10px;font-weight:800;color:var(--sb-dim);letter-spacing:1px;padding:0 10px;margin:0 0 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--sb-text);font:700 13px Pretendard,sans-serif;cursor:pointer;text-align:left;transition:background .15s,color .15s;margin-bottom:2px}
.nav-item:hover{background:var(--sb-hover);color:#dde8f2}
.nav-item.active{background:var(--sb-active);color:#fff}
.nav-icon{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:13px;flex:0 0 28px;background:rgba(255,255,255,.07)}
.nav-item.active .nav-icon{background:rgba(255,255,255,.2)}
.nav-count{margin-left:auto;font-size:10px;font-weight:800;background:rgba(255,255,255,.1);padding:2px 7px;border-radius:999px}
.nav-item.active .nav-count{background:rgba(255,255,255,.25)}
.sb-divider{height:1px;background:var(--sb-border);margin:10px 10px}
.sb-bottom{padding:12px 10px;border-top:1px solid var(--sb-border)}
.sb-user{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:default}
.sb-avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1e40af,#0ea5e9);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900;flex:0 0 32px;overflow:hidden}
.sb-avatar img{width:100%;height:100%;object-fit:cover}
.sb-user-info{flex:1;min-width:0}
.sb-user-name{font-size:12px;font-weight:800;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-email{font-size:10px;color:var(--sb-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-logout-btn{width:100%;padding:9px 10px;border:0;background:transparent;color:var(--sb-dim);font:700 12px Pretendard;border-radius:8px;cursor:pointer;text-align:left;margin-top:4px;transition:background .15s,color .15s}
.sb-logout-btn:hover{background:rgba(239,68,68,.15);color:#f87171}
.sb-login-link{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;font:800 13px Pretendard;transition:background .15s}
.sb-login-link:hover{background:var(--accent-d)}

/* SIDEBAR OVERLAY */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:199}
.sb-overlay.open{display:block}

/* MAIN */
.main{flex:1;margin-left:var(--sb-w);display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{min-height:var(--tb-h);height:auto;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:12px 28px;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(15,23,42,.035);backdrop-filter:blur(12px)}
.menu-toggle{display:none;width:38px;height:38px;border:0;background:transparent;border-radius:9px;font-size:18px;cursor:pointer;color:var(--t2);align-items:center;justify-content:center}
.menu-toggle:hover{background:var(--bg)}
.topbar-title{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;min-width:158px}
.topbar-kicker{font-size:8px;font-weight:950;letter-spacing:1.35px;color:#2563eb;text-transform:uppercase}
.topbar-heading{font-size:14px;font-weight:950;letter-spacing:-.25px;color:var(--t1);white-space:nowrap}
.topbar-divider{width:1px;height:32px;background:var(--line);flex:0 0 1px}
.search-wrap{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:#f8fafc;border:1.5px solid #dce4ed;border-radius:12px;padding:0 14px;height:42px;transition:border-color .15s,box-shadow .15s,background .15s}
.search-wrap:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.search-icon{color:var(--t3);font-size:14px;flex:0 0 auto}
.search{flex:1;border:0;background:transparent;font:500 13px Pretendard;color:var(--t1);outline:none;min-width:0}
.search::placeholder{color:var(--t3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.topbar-login{display:flex;align-items:center;gap:8px}
.tb-btn{padding:9px 15px;border-radius:10px;font:800 12px Pretendard;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:.15s;white-space:nowrap}
.tb-outline{border:1.5px solid var(--line);background:#fff;color:var(--t2)}
.tb-outline:hover{border-color:#94a3b8}
.tb-primary{border:0;background:var(--accent);color:#fff;box-shadow:0 3px 9px rgba(37,99,235,.18)}
.tb-primary:hover{background:var(--accent-d)}
.topbar-user{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;position:relative;background:#fff;transition:border-color .15s;user-select:none}
.topbar-user:hover{border-color:#94a3b8}
.tb-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1e40af,#0ea5e9);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;overflow:hidden;flex:0 0 30px}
.tb-avatar img{width:100%;height:100%;object-fit:cover}
.tb-user-name{font-size:12px;font-weight:800;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-caret{font-size:10px;color:var(--t3)}
.tb-dropdown{display:none;position:absolute;right:0;top:calc(100% + 8px);width:220px;background:#fff;border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:6px;z-index:300}
.topbar-user.open .tb-dropdown{display:block}
.tb-drop-head{padding:10px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tb-drop-name{font-size:13px;font-weight:900}
.tb-drop-email{font-size:10px;color:var(--t3);margin-top:2px}
.tb-drop-btn{width:100%;border:0;background:transparent;padding:9px 10px;text-align:left;font:700 12px Pretendard;color:var(--t2);border-radius:8px;cursor:pointer;transition:background .12s;display:block}
.tb-drop-btn:hover{background:var(--bg)}
.tb-drop-danger{color:#dc2626}
.tb-drop-danger:hover{background:#fef2f2!important}

/* CONTENT */
.content{padding:28px 32px 60px;flex:1}

/* BANNER */
.banner{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:20px 24px;display:flex;align-items:center;gap:18px;margin-bottom:24px}
.banner-icon{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:0 0 48px}
.banner-icon.blue{background:linear-gradient(135deg,#1e40af,#0ea5e9)}
.banner-icon.amber{background:linear-gradient(135deg,#b45309,#f59e0b)}
.banner-icon.green{background:linear-gradient(135deg,#15803d,#22c55e)}
.banner-body{flex:1}
.banner-title{font-size:15px;font-weight:950;margin-bottom:5px}
.banner-desc{font-size:13px;color:var(--t2);line-height:1.55}
.banner.amber-frame{border-color:#fde68a;background:#fffbeb}
.banner.green-frame{border-color:#bbf7d0;background:#f0fdf4}

/* QUICK LAUNCH */
.quick-section{margin-bottom:28px}
.quick-label{font-size:10px;font-weight:900;color:var(--t3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
.quick-row{display:flex;gap:8px;flex-wrap:wrap}
.quick-chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:800 12px Pretendard;cursor:pointer;text-decoration:none;color:var(--t1);transition:.15s;white-space:nowrap}
.quick-chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.12)}
.quick-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}

/* PROGRAMS */
.programs-header{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.programs-header h2{font-size:20px;font-weight:950}
.prog-count{font-size:12px;font-weight:800;color:var(--t3);background:var(--bg);padding:3px 9px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* CARD */
.prog-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.prog-card:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(0,0,0,.1),0 14px 36px rgba(0,0,0,.1);border-color:#cbd5e1}
.card-header{height:84px;display:flex;align-items:center;padding:0 22px;gap:14px}
.card-icon-wrap{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px;flex:0 0 46px}
.card-cat{font-size:9px;font-weight:900;color:rgba(255,255,255,.7);letter-spacing:1.2px;text-transform:uppercase}
.card-body{padding:18px 22px;flex:1;display:flex;flex-direction:column}
.card-name{font-size:15px;font-weight:950;margin-bottom:8px;line-height:1.25;color:var(--t1)}
.card-desc{font-size:12px;color:var(--t2);line-height:1.65;flex:1}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}
.card-tag{font-size:10px;font-weight:800;background:var(--bg);color:var(--t2);border-radius:6px;padding:4px 8px}
.card-footer{padding:12px 22px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--bg)}
.card-status-badge{font-size:10px;font-weight:950;padding:5px 10px;border-radius:999px;background:#f0fdf4;color:#15803d}
.card-cta{font-size:12px;font-weight:900;display:flex;align-items:center;gap:4px}

/* EMPTY */
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px}
.empty-icon{font-size:40px;margin-bottom:14px}
.empty-text{font-size:14px;font-weight:800;color:var(--t2);margin-bottom:6px}
.empty-hint{font-size:12px;color:var(--t3)}

/* FOOTER */
.footer{background:#08172d;color:rgba(255,255,255,.5);padding:22px 32px;font-size:12px}
.footer-inner{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer-brand{color:#fff;font-weight:900;font-size:13px}
.footer-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.footer-link{border:0;background:transparent;color:rgba(255,255,255,.5);font:700 11px Pretendard;cursor:pointer;padding:3px 0;transition:color .15s}
.footer-link:hover{color:#fff;text-decoration:underline}

/* LEGAL MODAL */
.legal-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,12,28,.68);backdrop-filter:blur(6px)}
.legal-modal.open{display:flex}
.legal-dialog{width:min(900px,100%);height:min(82vh,850px);background:#fff;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
.legal-head{height:58px;flex:0 0 58px;display:flex;align-items:center;padding:0 18px 0 22px;border-bottom:1px solid var(--line)}
.legal-head h2{font-size:15px}
.legal-close{margin-left:auto;width:34px;height:34px;border:0;border-radius:9px;background:var(--bg);font-size:20px;cursor:pointer}
.legal-frame{width:100%;flex:1;border:0;background:#fff}

/* RESPONSIVE */
@media(max-width:1200px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar-title{min-width:145px}
  .topbar-heading{font-size:13px}
}
@media(max-width:900px){
  .topbar-title{display:none}
  .topbar-divider{display:none}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:flex}
  .content{padding:20px 16px 48px}
  .topbar{padding:10px 16px;gap:10px;flex-wrap:wrap}
  .search-wrap{order:10;max-width:none;flex:1 0 100%;height:40px}
  .topbar-right{margin-left:auto}
  .topbar-login .tb-btn:first-child{display:none}
  .grid{grid-template-columns:1fr}
  .footer{padding:20px 16px}
}
@media(max-width:520px){
  .banner{flex-direction:column;align-items:flex-start;gap:14px}
  .quick-chip{font-size:11px;padding:8px 11px}
  .tb-user-name{display:none}
}
</style>
</head>

<div class="app">
<!-- ====== SIDEBAR ====== -->

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
const PROGRAMS=[
  {id:'print-checker',cat:'print',name:'인쇄물 사전 검토',icon:'🔍',accent:'#1d9bb2',bg:'linear-gradient(135deg,#12396d,#1d9bb2)',catLabel:'인쇄 검토',desc:'외부 도구로 제작한 인쇄물 파일(PDF)의 책등·재단선·안전 영역·접지선·간격을 한 번에 검토합니다.',url:'print-checker/',tags:['재단선','안전 영역','접지선']},
  {id:'pdf-editor',cat:'pdf',name:'PDF 편집 · 인쇄배치',icon:'🖨️',accent:'#059669',bg:'linear-gradient(135deg,#065f46,#059669)',catLabel:'PDF',desc:'여러 PDF의 페이지를 정리하고 N-up 배치·간지·여백을 설정해 출력용 PDF를 만듭니다.',url:'pdf-editor/',tags:['페이지 편집','N-up 배치','인쇄 배치']},
  {id:'pdf-preflight',cat:'pdf',name:'PDF 도구 모음',icon:'🧰',accent:'#d97706',bg:'linear-gradient(135deg,#92400e,#d97706)',catLabel:'PDF',desc:'인쇄 전 검사부터 PDF 합치기·나누기·압축·변환까지 자주 쓰는 PDF 작업을 한곳에서 처리합니다.',url:'pdf-preflight/',tags:['검사·진단','합치기·나누기','압축·변환']}
];

const CATS={
  all:{label:'전체 프로그램'},
  print:{label:'인쇄물 검토'},
  pdf:{label:'PDF 프로그램'}
};

let activeCat='all';
let searchQuery='';

function filteredPrograms(){
  let list=activeCat==='all'?PROGRAMS:PROGRAMS.filter(p=>p.cat===activeCat);
  const q=searchQuery.trim().toLowerCase();
  if(q)list=list.filter(p=>p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||p.tags.some(t=>t.toLowerCase().includes(q))||p.catLabel.toLowerCase().includes(q));
  return list;
}

function makeCard(p){
  const a=document.createElement('a');
  a.href=p.url;
  a.className='prog-card';
  a.innerHTML=
    '<div class="card-header" style="background:'+p.bg+'">'+
      '<div class="card-icon-wrap">'+p.icon+'</div>'+
      '<div class="card-cat">'+p.catLabel+'</div>'+
    '</div>'+
    '<div class="card-body">'+
      '<div class="card-name">'+p.name+'</div>'+
      '<div class="card-desc">'+p.desc+'</div>'+
      '<div class="card-tags">'+p.tags.map(t=>'<span class="card-tag">'+t+'</span>').join('')+'</div>'+
    '</div>'+
    '<div class="card-footer">'+
      '<span class="card-status-badge">바로 사용</span>'+
      '<span class="card-cta" style="color:'+p.accent+'">시작하기 →</span>'+
    '</div>';
  return a;
}

function renderGrid(){
  const list=filteredPrograms();
  const grid=document.getElementById('programGrid');
  grid.replaceChildren();
  document.getElementById('sectionTitle').textContent=CATS[activeCat].label;
  document.getElementById('count').textContent=list.length+'개';
  if(!list.length){
    const el=document.createElement('div');
    el.className='empty-state';
    el.innerHTML='<div class="empty-icon">🔍</div><div class="empty-text">검색 결과가 없습니다</div><div class="empty-hint">다른 검색어를 입력해 보세요.</div>';
    grid.appendChild(el);
    return;
  }
  list.forEach(p=>grid.appendChild(makeCard(p)));
}

function switchCat(key){
  if(!CATS[key])key='all';
  activeCat=key;
  document.querySelectorAll('.nav-item[data-cat]').forEach(btn=>btn.classList.toggle('active',btn.dataset.cat===key));
  renderGrid();
}

function buildQuickRow(){
  const row=document.getElementById('quickRow');
  row.replaceChildren();
  PROGRAMS.forEach(p=>{
    const a=document.createElement('a');
    a.href=p.url;
    a.className='quick-chip';
    a.innerHTML='<span class="quick-dot" style="background:'+p.accent+'"></span>'+p.name;
    row.appendChild(a);
  });
}

function setBanner(cls,iconCls,iconText,title,desc){
  document.getElementById('bannerArea').innerHTML=
    '<div class="banner '+cls+'">'+
      '<div class="banner-icon '+iconCls+'">'+iconText+'</div>'+
      '<div class="banner-body"><div class="banner-title">'+title+'</div><div class="banner-desc">'+desc+'</div></div>'+
    '</div>';
}

function showUser(user){
  const name=user.displayName||(user.email||'').split('@')[0];
  function setAvatar(el){
    if(user.photoURL){const img=document.createElement('img');img.src=user.photoURL;el.replaceChildren(img);}
    else el.textContent=name.charAt(0).toUpperCase();
  }
  document.getElementById('sbUser').classList.remove('hidden');
  document.getElementById('sbLogin').classList.add('hidden');
  document.getElementById('sbLogout').classList.remove('hidden');
  setAvatar(document.getElementById('sbAvatar'));
  document.getElementById('sbUserName').textContent=name;
  document.getElementById('sbUserEmail').textContent=user.email||'';
  document.getElementById('sbLogout').onclick=()=>auth.signOut().then(()=>location.reload());
  document.getElementById('tbLogin').classList.add('hidden');
  document.getElementById('tbUser').classList.remove('hidden');
  setAvatar(document.getElementById('tbAvatar'));
  document.getElementById('tbUserName').textContent=name;
  document.getElementById('tbDropName').textContent=name;
  document.getElementById('tbDropEmail').textContent=user.email||'';
  document.getElementById('tbLogout').onclick=()=>auth.signOut().then(()=>location.reload());
}

// Sidebar mobile toggle
const sidebar=document.getElementById('sidebar');
const overlay=document.getElementById('sbOverlay');
const menuToggle=document.getElementById('menuToggle');
menuToggle.onclick=()=>{
  const open=sidebar.classList.toggle('open');
  overlay.classList.toggle('open',open);
  menuToggle.setAttribute('aria-expanded',String(open));
};
overlay.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');};

// Category nav
document.querySelectorAll('.nav-item[data-cat]').forEach(btn=>{
  btn.onclick=()=>{
    switchCat(btn.dataset.cat);
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
    menuToggle.setAttribute('aria-expanded','false');
  };
});

// Search
document.getElementById('search').oninput=e=>{searchQuery=e.target.value;renderGrid();};

// Topbar user dropdown
const tbUser=document.getElementById('tbUser');
tbUser.onclick=e=>{e.stopPropagation();tbUser.classList.toggle('open');};
document.addEventListener('click',()=>tbUser.classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')tbUser.classList.remove('open');});

// Legal modal
const legalModal=document.getElementById('legalModal');
const legalFrame=document.getElementById('legalFrame');
const legalTitle=document.getElementById('legalTitle');
function openLegal(url,title){legalTitle.textContent=title;legalFrame.src=url;legalModal.classList.add('open');document.body.style.overflow='hidden';}
function closeLegal(){legalModal.classList.remove('open');document.body.style.overflow='';legalFrame.src='about:blank';}
document.querySelectorAll('[data-legal]').forEach(btn=>btn.onclick=()=>openLegal(btn.dataset.legal,btn.dataset.title));
document.getElementById('legalClose').onclick=closeLegal;
legalModal.onclick=e=>{if(e.target===legalModal)closeLegal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&legalModal.classList.contains('open'))closeLegal();});

// Year
document.querySelectorAll('[data-current-year]').forEach(el=>el.textContent=new Date().getFullYear());

// Auth
if(window.auth){
  auth.onAuthStateChanged(async user=>{
    document.getElementById('loading').style.display='none';
    if(!user)return;
    showUser(user);
    try{
      const access=await ProgramAccess.getAccess(user);
      if(!access.approved){
        setBanner('amber-frame','amber','⏳','관리자 승인 대기 중','관리자가 계정을 승인하면 모든 프로그램을 사용할 수 있습니다. 승인 완료 후 페이지를 새로고침하세요.');
        document.getElementById('quickSection').classList.add('hidden');
        const grid=document.getElementById('programGrid');
        grid.style.opacity='0.35';
        grid.style.pointerEvents='none';
        return;
      }
      const name=user.displayName||(user.email||'').split('@')[0];
      setBanner('green-frame','green','👋','안녕하세요, '+name+'님!','작업 목적에 맞는 프로그램을 선택해 바로 시작하세요. 빠른 시작 버튼을 눌러 바로 열 수도 있습니다.');
      if(access.admin){
        const adminBtn=document.getElementById('tbAdmin');
        adminBtn.classList.remove('hidden');
        adminBtn.onclick=()=>location.href='admin.html';
      }
    }catch(err){
      setBanner('amber-frame','amber','⚠️','상태를 확인할 수 없습니다','페이지를 새로고침하거나 잠시 후 다시 시도해 주세요.');
    }
  });
}else{
  document.getElementById('loading').style.display='none';
}

buildQuickRow();
renderGrid();

window.ProgramStudioHome={PROGRAMS,CATS,switchCat,get activeCategory(){return activeCat;},stage:'categorized-program-home-v3'};
</script>
</body>
</html>
