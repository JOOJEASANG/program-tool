const CATEGORIES={all:{label:'전체 프로그램',accent:'#1769e0',badge:'PROGRAM STUDIO',heroTitle:'작업별로 나눈 <span>전문 프로그램</span>',lead:'디자인·PDF·문서·이미지 작업을 목적에 맞는 프로그램에서 바로 시작하세요.',copy:'각 프로그램은 작업 목적에 맞게 단순화되어 있지만, <strong>공통 편집 기능과 출력 기준은 일관되게 유지</strong>됩니다.',visual:['ALL','필요한 프로그램만 바로','디자인은 작업 종류별로 분리하고 PDF·문서·이미지 도구도 카테고리별로 정리했습니다.'],summary:'전체 프로그램을 한 번에 보여줍니다.'},design:{label:'디자인 프로그램',accent:'#5969dc',badge:'DESIGN PROGRAMS',heroTitle:'인쇄 디자인을 <span>작업 종류별로</span>',lead:'표지·포스터·전단·초대장·리플렛을 각각 독립 프로그램처럼 사용합니다.',copy:'화면은 작업별로 분리하지만 <strong>글씨·이미지·도형·정렬·레이어·출력 엔진은 하나로 공유</strong>합니다.',visual:['DESIGN','5개 디자인 프로그램 · 1개 공통 엔진','표지에는 책등, 리플렛에는 접지처럼 필요한 기능만 보이고 조작 방식은 모두 같습니다.'],summary:'표지·포스터·전단지·초대장/안내장·리플렛 디자인'},pdf:{label:'PDF 프로그램',accent:'#18a47a',badge:'PDF PROGRAMS',heroTitle:'PDF 편집부터 <span>인쇄 전 검사까지</span>',lead:'페이지 편집·인쇄배치와 최종 파일 검사를 목적별 프로그램으로 나눴습니다.',copy:'출력용 페이지 구성과 최종 검사를 분리해 <strong>작업 단계가 섞이지 않도록</strong> 구성했습니다.',visual:['PDF','편집 · 배치 · 검사','PDF 페이지 정리, N-up·소책자 인쇄배치와 DPI·폰트·도련 검사를 처리합니다.'],summary:'PDF 편집·인쇄배치와 인쇄 전 검사'},content:{label:'문서 · 이미지',accent:'#9b5ea8',badge:'CONTENT TOOLS',heroTitle:'문서와 이미지는 <span>가볍고 빠르게</span>',lead:'출력 전 자주 필요한 문서 작성과 이미지 보정을 별도 도구로 처리합니다.',copy:'디자인 편집기를 열지 않아도 되는 작업은 <strong>전용 프로그램에서 더 빠르게</strong> 끝낼 수 있습니다.',visual:['TOOLS','문서 · 이미지 전용 도구','A4 문서 작성부터 이미지 리사이즈·배경 제거·기본 보정까지 필요한 기능만 제공합니다.'],summary:'A4 문서 작성과 이미지 편집'}};
let active='all';function categoryPrograms(key){return key==='all'?PROGRAMS:PROGRAMS.filter(program=>program.category===key)}function card(program){const el=document.createElement('a');el.href=program.url;el.className='card';el.style.setProperty('--card-accent',program.accent);el.innerHTML=`<div class="program-main"><div class="icon" style="background:${program.bg}">${program.icon}</div><div><div class="name">${program.name}</div><div class="program-type">${CATEGORIES[program.category].label}</div></div></div><div class="desc">${program.desc}</div><div class="tags">${program.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><div class="program-action"><span class="status">바로 사용</span><span class="cta">시작하기 →</span></div>`;return el}function buildCategoryTabs(){const root=document.getElementById('categoryTabs');Object.entries(CATEGORIES).forEach(([key,category])=>{const button=document.createElement('button');button.type='button';button.className='category-tab';button.dataset.category=key;button.setAttribute('role','tab');button.textContent=category.label;button.onclick=()=>switchCategory(key,true);root.appendChild(button)})}function switchCategory(key='all',scroll=false){if(!CATEGORIES[key])key='all';active=key;const category=CATEGORIES[key],programs=categoryPrograms(key);document.documentElement.style.setProperty('--accent',category.accent);document.getElementById('heroBadge').textContent=category.badge;document.getElementById('heroTitle').innerHTML=category.heroTitle;document.getElementById('heroLead').textContent=category.lead;document.getElementById('heroCopy').innerHTML=category.copy;document.getElementById('visualIcon').textContent=category.visual[0];document.getElementById('visualTitle').textContent=category.visual[1];document.getElementById('visualText').textContent=category.visual[2];document.querySelectorAll('.category-tab').forEach(button=>{const selected=button.dataset.category===key;button.classList.toggle('active',selected);button.setAttribute('aria-selected',String(selected))});const grid=document.getElementById('programGrid');grid.replaceChildren();programs.forEach(program=>grid.appendChild(card(program)));document.getElementById('sectionTitle').textContent=key==='all'?'필요한 프로그램을 선택하세요':category.label;document.getElementById('count').textContent=`바로 사용 ${programs.length}개`;document.getElementById('categorySummary').innerHTML=`<strong>${category.label}</strong><span>${category.summary}</span>`;if(scroll)document.getElementById('programs').scrollIntoView({behavior:'smooth',block:'start'})}
function showUser(user){document.getElementById('loginBtn').classList.add('hidden');document.getElementById('startBtn').classList.add('hidden');document.getElementById('userBox').classList.remove('hidden');const name=user.displayName||(user.email||'').split('@')[0];document.getElementById('userName').textContent=name;document.getElementById('accountName').textContent=name;document.getElementById('accountMini').textContent=name.charAt(0);document.getElementById('userEmail').textContent=user.email||'';document.getElementById('greetingText').textContent=`안녕하세요, ${name}님`;const avatar=document.getElementById('avatar');if(user.photoURL){const image=document.createElement('img');image.src=user.photoURL;avatar.replaceChildren(image)}else avatar.textContent=name.charAt(0)}buildCategoryTabs();switchCategory('all');document.querySelectorAll('[data-current-year]').forEach(element=>element.textContent=new Date().getFullYear());if(window.auth){auth.onAuthStateChanged(async user=>{document.getElementById('loading').style.display='none';if(!user)return;showUser(user);try{const access=await ProgramAccess.getAccess(user);if(!access.approved){document.getElementById('approval').classList.remove('hidden');return}document.getElementById('greeting').classList.remove('hidden');if(access.admin)document.getElementById('adminBtn').classList.remove('hidden')}catch(error){document.getElementById('approval').classList.remove('hidden')}})}else document.getElementById('loading').style.display='none';document.getElementById('userBox').onclick=event=>{event.stopPropagation();event.currentTarget.classList.toggle('open')};document.onclick=()=>document.getElementById('userBox').classList.remove('open');document.getElementById('logoutBtn').onclick=async()=>{await auth.signOut();location.reload()};const legalModal=document.getElementById('legalModal'),legalFrame=document.getElementById('legalFrame'),legalTitle=document.getElementById('legalTitle');function openLegal(url,title){legalTitle.textContent=title;legalFrame.src=url;legalModal.classList.add('open');document.body.classList.add('modal-open')}function closeLegal(){legalModal.classList.remove('open');document.body.classList.remove('modal-open');legalFrame.src='about:blank'}document.querySelectorAll('[data-legal]').forEach(button=>button.onclick=()=>openLegal(button.dataset.legal,button.dataset.title));document.getElementById('legalClose').onclick=closeLegal;legalModal.onclick=event=>{if(event.target===legalModal)closeLegal()};document.addEventListener('keydown',event=>{if(event.key==='Escape'&&legalModal.classList.contains('open'))closeLegal()});window.ProgramStudioHome={PROGRAMS,CATEGORIES,switchCategory,get activeCategory(){return active;},stage:'categorized-program-home-v1'};
</script></body></html>
