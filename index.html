<style>
:root{--navy:#0b2a55;--blue:#1769e0;--cyan:#18a7bd;--ink:#101828;--line:#e7edf5;--shell:1320px;--accent:#1769e0}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Pretendard,"Noto Sans KR",sans-serif;color:var(--ink);background:#fff}body.modal-open{overflow:hidden}main{padding-top:76px}.hidden{display:none!important}.nav{position:fixed;inset:0 0 auto;z-index:100;height:76px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid #e8edf4}.nav-shell{max-width:var(--shell);height:100%;margin:auto;padding:0 24px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px}.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy)}.brand-mark{width:46px;height:46px;display:grid;place-items:center;filter:drop-shadow(0 10px 18px rgba(23,105,224,.22))}.brand-mark svg{width:46px;height:46px}.brand-copy{display:flex;flex-direction:column;line-height:1}.brand-name{font-size:19px;font-weight:950}.brand-platform{margin-top:5px;font-size:9px;font-weight:900;letter-spacing:1.45px;color:#8793a6}.studio-nav{display:none}.nav-right{justify-self:end;display:flex;gap:9px;align-items:center}.nav-btn{font-size:13px;font-weight:850;border-radius:11px;text-decoration:none;padding:10px 15px;border:1px solid #dce4ef;color:#344054;background:#fff}.primary{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:0}.user{position:relative;display:flex;align-items:center;gap:8px;padding:3px 7px 3px 3px;border-radius:999px;border:1px solid #dde5ef;background:#fff;cursor:pointer}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:950;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.user-name{font-size:12px;font-weight:900;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dropdown{display:none;position:absolute;right:0;top:calc(100% + 10px);width:240px;padding:8px;background:#fff;border:1px solid #dde5ef;border-radius:17px;box-shadow:0 22px 55px #0f172a29}.user.open .dropdown{display:block}.account-simple{display:flex;gap:10px;padding:11px;border-bottom:1px solid #edf1f5;margin-bottom:5px}.account-mini{width:35px;height:35px;border-radius:11px;background:#edf4ff;display:grid;place-items:center;font-weight:950;color:var(--navy)}.email{font-size:10px;color:#7b8799;margin-top:4px}.dropbtn{width:100%;border:0;background:transparent;padding:10px;text-align:left;border-radius:9px;font:800 13px Pretendard;cursor:pointer}.dropbtn:hover{background:#f4f7fb}.danger{color:#c2414b}
.hero{color:#fff;position:relative;overflow:hidden;background:linear-gradient(145deg,#06172f,#103a68 56%,#176b87)}.hero:after{content:"";position:absolute;width:440px;height:440px;right:-110px;top:-170px;border-radius:50%;background:rgba(45,224,204,.13);filter:blur(2px)}.hero-shell{max-width:var(--shell);margin:auto;padding:62px 24px 40px;position:relative;z-index:1}.hero-inner{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}.badge{display:inline-flex;padding:7px 12px;border:1px solid #ffffff2e;background:#ffffff15;border-radius:999px;font-size:11px;font-weight:850;margin-bottom:18px}.hero h1{font-size:clamp(40px,5.5vw,66px);line-height:.98;letter-spacing:-3px;font-weight:950;margin-bottom:18px}.hero h1 span{display:block;background:linear-gradient(90deg,#fff,#8cf3e8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero-lead{font-size:clamp(19px,2vw,26px);font-weight:850;margin-bottom:14px}.hero-copy{font-size:14px;line-height:1.78;color:#ffffffbd;max-width:620px}.hero-copy strong{color:#fff}.hero-actions{display:flex;gap:10px;margin-top:24px}.hero-action{padding:12px 19px;border-radius:11px;text-decoration:none;font-size:13px;font-weight:850}.hero-action.main{background:#fff;color:var(--navy)}.hero-visual{min-height:240px;display:grid;place-items:center}.visual-card{width:310px;background:#fffffff5;color:var(--ink);border-radius:22px;box-shadow:0 24px 50px #00000035;padding:24px}.visual-icon{width:52px;height:52px;border-radius:15px;background:#edf4ff;display:grid;place-items:center;margin-bottom:16px;font-size:16px;font-weight:950;color:#1769e0}.visual-title{font-size:18px;font-weight:950;margin-bottom:7px}.visual-text{font-size:12px;line-height:1.6;color:#667085}
.programs{max-width:var(--shell);margin:auto;padding:58px 24px 84px}.section-kicker{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:900;margin-bottom:10px}.programs-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.programs h2{font-size:clamp(28px,3.6vw,40px);font-weight:950}.count{font-size:13px;color:#778397}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{position:relative;display:flex;flex-direction:column;min-height:248px;padding:21px;background:#fff;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:inherit;box-shadow:0 8px 28px #0f172a0e;overflow:hidden;transition:.16s}.card:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;background:var(--card-accent);border-radius:0 5px 5px 0}.card:not(.coming):hover{transform:translateY(-3px);box-shadow:0 16px 38px #12396d1c}.program-main{display:flex;align-items:center;gap:14px;margin-bottom:14px}.icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:16px;font-weight:950;color:var(--card-accent)}.name{font-size:16px;font-weight:950;line-height:1.25}.program-type{margin-top:5px;font-size:10px;font-weight:850;color:#8b97a8}.desc{font-size:12px;color:#697586;line-height:1.65;flex:1}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{font-size:10px;font-weight:800;background:#f2f5f9;border-radius:7px;padding:5px 8px}.program-action{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.status{font-size:10px;font-weight:950;padding:7px 10px;border-radius:999px;background:#e8f8f3;color:#19836d}.cta{font-size:12px;font-weight:900;color:var(--card-accent)}.card.coming{opacity:.58;filter:grayscale(.35);cursor:not-allowed;background:#f8fafc}
.greeting,.approval{padding:36px 5%;text-align:center;background:linear-gradient(#eef7ff,#fff)}.approval-card{max-width:650px;margin:auto;background:#fff;border:1px solid #dbe5ee;border-radius:22px;padding:30px}footer{background:#08172d;color:#ffffff9c;padding:30px 24px;font-size:12px}.footer-inner{max-width:var(--shell);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.footer-brand{color:#fff;font-weight:900}.footer-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}.footer-links{display:flex;gap:14px;flex-wrap:wrap}.footer-link{border:0;background:transparent;color:#ffffffb8;font:800 11px Pretendard;cursor:pointer;padding:4px 0}.footer-link:hover{color:#fff;text-decoration:underline}.legal-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,12,28,.68);backdrop-filter:blur(6px)}.legal-modal.open{display:flex}.legal-dialog{width:min(900px,100%);height:min(82vh,850px);background:#fff;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}.legal-head{height:64px;flex:0 0 64px;display:flex;align-items:center;padding:0 20px 0 24px;border-bottom:1px solid #e7edf5}.legal-head h2{font-size:17px}.legal-close{margin-left:auto;width:38px;height:38px;border:0;border-radius:11px;background:#f1f4f8;color:#344054;font-size:22px;cursor:pointer}.legal-frame{width:100%;height:100%;border:0;background:#fff}#loading{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:999}.spin{width:38px;height:38px;border:3px solid #e2e8f0;border-top-color:var(--navy);border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:1120px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-inner{gap:30px}}@media(max-width:760px){.nav-shell{padding:0 4%}.brand-platform{display:none}.hero-inner{grid-template-columns:1fr}.hero-visual{display:none}.grid{grid-template-columns:1fr}.programs-head{display:block}.programs h2{word-break:keep-all}.count{margin-top:8px}.footer-inner{align-items:flex-start;flex-direction:column}.footer-right{justify-content:flex-start}.legal-modal{padding:10px}.legal-dialog{height:92vh;border-radius:16px}}@media(max-width:520px){.brand-copy{display:none}.nav-btn{padding:9px 11px;font-size:11px}.programs{padding-left:14px;padding-right:14px}.hero-shell{padding-left:18px;padding-right:18px}}
</style>

<main><section class="hero studio" id="hero"><div class="hero-shell"><div class="hero-inner"><div><div class="badge" id="heroBadge"></div><h1 id="heroTitle"></h1><div class="hero-lead" id="heroLead"></div><p class="hero-copy" id="heroCopy"></p><div class="hero-actions"><a class="hero-action main" href="#programs">작업 선택하기 →</a></div></div><div class="hero-visual"><div class="visual-card"><div class="visual-icon" id="visualIcon"></div><div class="visual-title" id="visualTitle"></div><div class="visual-text" id="visualText"></div></div></div></div></div></section><section class="greeting hidden" id="greeting"><h2 id="greetingText">안녕하세요</h2><p>필요한 인쇄 작업을 선택해 바로 시작하세요.</p></section><section class="approval hidden" id="approval"><div class="approval-card"><h2 id="approvalTitle">관리자 승인 대기 중입니다</h2><p id="approvalMessage">관리자가 승인하면 프로그램을 사용할 수 있습니다.</p></div></section><section class="programs" id="programs"><div class="section-kicker" id="sectionKicker"></div><div class="programs-head"><h2 id="sectionTitle"></h2><div class="count" id="count"></div></div><div class="grid" id="programGrid"></div></section></main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script>
<script>
const CATEGORIES={studio:{label:'인쇄·출력 실무 도구',accent:'#1769e0',title:'무엇을 하려는지 선택하세요',badge:'PDF · PRINT · OUTPUT',heroTitle:'인쇄·출력 실무에 <span>필요한 도구만 바로</span>',lead:'디자인하고, 편집·인쇄배치하고, 마지막으로 검사하세요.',copy:'기능 목록을 찾지 않아도 됩니다.<br><strong>디자인 제작 → PDF 편집·인쇄배치 → 인쇄 전 검사 → 결과 저장</strong> 흐름으로 작업하세요.',visual:['PRINT','디자인부터 최종 검사까지','포스터·표지·초대장 제작, 페이지 배치, 소책자, 규격·해상도·도련 점검까지 실제 출력 작업을 한곳에서 처리합니다.'],programs:[
{id:'design-editor',name:'디자인 제작',icon:'DESIGN',accent:'#5969dc',bg:'#edf1ff',desc:'포스터·전단·책표지·초대장·리플렛을 실제 인쇄 규격과 접지 가이드에 맞춰 제작합니다.',url:'design-editor/',tags:['포스터·전단','책표지','초대장·리플렛']},
{id:'pdf-editor',name:'PDF 편집 · 인쇄배치',icon:'PRINT',accent:'#18a47a',bg:'#eafaf3',desc:'여러 PDF의 페이지를 정리하고 N-up·소책자·간지·여백을 설정해 출력용 PDF를 만듭니다.',url:'pdf-editor/',tags:['페이지 편집','N-up·소책자','인쇄 배치']},
{id:'pdf-utility',name:'인쇄 전 검사',icon:'CHECK',accent:'#f08b32',bg:'#fff3e7',desc:'DPI, 폰트, 규격, 도련과 함께 PDF 합치기·나누기·압축 등 출력 전 작업을 처리합니다.',url:'pdf-preflight/',tags:['인쇄 파일 검사','PDF 변환','규격·해상도']},
{id:'image-editor',name:'이미지 작업',icon:'IMAGE',accent:'#b65f8c',bg:'#fff0f6',desc:'자르기·리사이즈·배경 제거·기본 보정처럼 출력 전에 자주 필요한 이미지 작업을 빠르게 처리합니다.',url:'image-editor/',tags:['배경 제거','리사이즈','이미지 보정']}
]}};
let active='studio';
function buildNav(){const nav=document.getElementById('studioNav');if(!nav)return;nav.replaceChildren();Object.entries(CATEGORIES).forEach(([key,c])=>{const b=document.createElement('button');b.className='studio-link active';b.dataset.key=key;b.textContent=c.label;b.onclick=()=>switchCategory(key,true);nav.appendChild(b)})}
function card(p){const el=document.createElement(p.coming?'div':'a');if(!p.coming)el.href=p.url;el.className='card'+(p.coming?' coming':'');el.style.setProperty('--card-accent',p.accent);el.innerHTML=`<div class="program-main"><div class="icon" style="background:${p.bg}">${p.icon}</div><div><div class="name">${p.name}</div><div class="program-type">${p.coming?'준비 중':'인쇄 실무 도구'}</div></div></div><div class="desc">${p.desc}</div><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="program-action"><span class="status">${p.coming?'개발 예정':'바로 사용'}</span><span class="cta">${p.coming?'준비 중':'시작하기 →'}</span></div>`;return el}
function switchCategory(key='studio',scroll=false){active='studio';const c=CATEGORIES.studio;document.documentElement.style.setProperty('--accent',c.accent);document.getElementById('heroBadge').textContent=c.badge;document.getElementById('heroTitle').innerHTML=c.heroTitle;document.getElementById('heroLead').textContent=c.lead;document.getElementById('heroCopy').innerHTML=c.copy;document.getElementById('visualIcon').textContent=c.visual[0];document.getElementById('visualTitle').textContent=c.visual[1];document.getElementById('visualText').textContent=c.visual[2];document.getElementById('sectionKicker').textContent='PRINT PRODUCTION WORKFLOW';document.getElementById('sectionTitle').textContent=c.title;const grid=document.getElementById('programGrid');grid.replaceChildren();c.programs.forEach(p=>grid.appendChild(card(p)));document.getElementById('count').textContent=`바로 사용 ${c.programs.filter(p=>!p.coming).length}개`;if(scroll)document.getElementById('programs').scrollIntoView({behavior:'smooth'})}
function showUser(user){document.getElementById('loginBtn').classList.add('hidden');document.getElementById('startBtn').classList.add('hidden');document.getElementById('userBox').classList.remove('hidden');const name=user.displayName||(user.email||'').split('@')[0];document.getElementById('userName').textContent=name;document.getElementById('accountName').textContent=name;document.getElementById('accountMini').textContent=name.charAt(0);document.getElementById('userEmail').textContent=user.email||'';document.getElementById('greetingText').textContent=`안녕하세요, ${name}님`;const av=document.getElementById('avatar');if(user.photoURL){const img=document.createElement('img');img.src=user.photoURL;av.replaceChildren(img)}else av.textContent=name.charAt(0)}
buildNav();switchCategory('studio');document.querySelectorAll('[data-current-year]').forEach(el=>el.textContent=new Date().getFullYear());if(window.auth){auth.onAuthStateChanged(async user=>{document.getElementById('loading').style.display='none';if(!user)return;showUser(user);try{const access=await ProgramAccess.getAccess(user);if(!access.approved){document.getElementById('approval').classList.remove('hidden');return}document.getElementById('greeting').classList.remove('hidden');if(access.admin)document.getElementById('adminBtn').classList.remove('hidden')}catch(e){document.getElementById('approval').classList.remove('hidden')}})}else document.getElementById('loading').style.display='none';document.getElementById('userBox').onclick=e=>{e.stopPropagation();e.currentTarget.classList.toggle('open')};document.onclick=()=>document.getElementById('userBox').classList.remove('open');document.getElementById('logoutBtn').onclick=async()=>{await auth.signOut();location.reload()};
const legalModal=document.getElementById('legalModal'),legalFrame=document.getElementById('legalFrame'),legalTitle=document.getElementById('legalTitle');function openLegal(url,title){legalTitle.textContent=title;legalFrame.src=url;legalModal.classList.add('open');document.body.classList.add('modal-open')}function closeLegal(){legalModal.classList.remove('open');document.body.classList.remove('modal-open');legalFrame.src='about:blank'}document.querySelectorAll('[data-legal]').forEach(btn=>btn.onclick=()=>openLegal(btn.dataset.legal,btn.dataset.title));document.getElementById('legalClose').onclick=closeLegal;legalModal.onclick=e=>{if(e.target===legalModal)closeLegal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&legalModal.classList.contains('open'))closeLegal()});
</script></body></html>
