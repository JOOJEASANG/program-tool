<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Program Tool · 인쇄 문서 도구</title><meta name="description" content="관리자 승인 회원 전용 인쇄 문서 도구"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:#111827;background:#fff;min-height:100vh;display:flex;flex-direction:column}main{flex:1;padding-top:60px}.nav{position:fixed;inset:0 0 auto;z-index:100;height:60px;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 5%;gap:16px}.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#12396d;font-size:17px;font-weight:900}.logo{width:32px;height:32px;background:linear-gradient(135deg,#12396d,#1d9bb2);border-radius:8px;display:grid;place-items:center}.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}.nav-btn{font-size:13px;font-weight:800;border-radius:9px;text-decoration:none;padding:8px 16px;border:1px solid #e5e7eb;color:#374151}.primary{background:linear-gradient(135deg,#12396d,#1d9bb2);color:#fff;border:0}.user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid #e5e7eb;position:relative}.avatar{width:28px;height:28px;border-radius:50%;background:#12396d;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px #0002;padding:8px;min-width:200px;display:none}.user.open .dropdown{display:block}.email{padding:8px 10px;font-size:11px;color:#64748b;border-bottom:1px solid #f1f5f9}.dropbtn{display:block;width:100%;border:0;background:transparent;padding:9px 10px;text-align:left;border-radius:8px;font-weight:700;cursor:pointer}.hero,.greeting,.approval{padding:86px 5% 44px;text-align:center;background:linear-gradient(180deg,#f0f9ff,#fff)}.hero h1,.greeting h2,.approval h2{font-size:clamp(30px,5vw,52px);font-weight:900;margin-bottom:14px}.hero h1 span{background:linear-gradient(135deg,#12396d,#1d9bb2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero p,.greeting p,.approval p{font-size:15px;color:#64748b;line-height:1.65}.approval-card{max-width:650px;margin:0 auto;background:#fff;border:1px solid #dbe5ee;border-radius:22px;padding:30px;box-shadow:0 15px 40px #12396d18}.approval-icon{font-size:42px;margin-bottom:12px}.programs{padding:28px 5% 70px;max-width:1180px;width:100%;margin:0 auto}.programs h3{font-size:22px;font-weight:900;margin-bottom:5px}.count{font-size:12px;color:#64748b;margin-bottom:18px}.slider{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:#fff;border:1.5px solid #e8edf3;border-radius:22px;padding:27px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:13px;min-height:282px;box-shadow:0 12px 32px #0f172a0f}.card:hover{transform:translateY(-4px);border-color:#bfdbfe}.icon{width:62px;height:62px;border-radius:17px;display:grid;place-items:center;font-size:31px}.name{font-size:20px;font-weight:900}.desc{font-size:13px;color:#64748b;line-height:1.65;flex:1}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;font-weight:800;color:#475569;background:#f1f5f9;border-radius:5px;padding:4px 8px}.cta{color:#1d9bb2;font-size:13px;font-weight:900}.test{border-color:#fcd34d;background:linear-gradient(180deg,#fffdf5,#fff)}footer{background:#0f172a;color:#ffffff99;padding:28px 5%;font-size:12px}.hidden{display:none!important}#loading{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:999}.spin{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#12396d;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:900px){.slider{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.slider{grid-template-columns:1fr}.nav{padding:0 4%}.user-name{display:none}}</style></head><body><div id="loading"><div class="spin"></div></div><nav class="nav"><a class="nav-logo" href="index.html"><span class="logo">📄</span>Program Tool</a><div class="nav-right"><a class="nav-btn" href="login.html" id="loginBtn">로그인</a><a class="nav-btn primary" href="login.html" id="startBtn">무료 시작하기</a><div class="user hidden" id="userBox"><div class="avatar" id="avatar"></div><span class="user-name" id="userName"></span><div class="dropdown"><div class="email" id="userEmail"></div><button class="dropbtn hidden" id="adminBtn" onclick="location.href='admin.html'">⚙️ 관리자 설정</button><button class="dropbtn hidden" id="testBtn" onclick="location.href='tool-access.html?target=tools/cover-editor-phase4.html'">🧪 표지 편집기 테스트</button><button class="dropbtn" id="logoutBtn">🚪 로그아웃</button></div></div></div></nav><main><section class="hero" id="hero"><h1>인쇄 문서 작업을 더 쉽게,<br><span>브라우저에서 바로 처리</span></h1><p>회원가입 후 관리자 승인이 완료되면 PDF 편집, 문서 검수와 표지 제작을 사용할 수 있습니다.</p></section><section class="greeting hidden" id="greeting"><h2 id="greetingText">안녕하세요</h2><p>승인된 인쇄 문서 프로그램을 선택해 시작하세요.</p></section><section class="approval hidden" id="approval"><div class="approval-card"><div class="approval-icon">⏳</div><h2 id="approvalTitle">관리자 승인 대기 중입니다</h2><p id="approvalMessage">가입 정보가 등록되었습니다. 관리자가 승인하면 프로그램 카드가 자동으로 표시됩니다.</p><div style="margin-top:18px"><a class="nav-btn primary" href="approval-waiting.html">승인 상태 확인</a></div></div></section><section class="programs hidden" id="programs"><h3>📦 인쇄 문서 도구</h3><div class="count" id="count">사용 가능 3개</div><div class="slider" id="slider"></div></section></main><footer>© 2026 Program Tool. All rights reserved.</footer><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script>const PROGRAMS=[{name:'PDF 편집',icon:'📝',bg:'#fff7ed',desc:'PDF 페이지 편집, N-up 배치, 소책자, 간지, 머리말·꼬리말, 워터마크와 페이지 번호를 지원합니다.',url:'tools/pdf-editor.html',tags:['PDF','편집','N-up','소책자']},{name:'PDF 검사',icon:'🔍',bg:'#f0fdf4',desc:'PDF 문서 검수와 암호 설정·자동 암호 해제를 처리합니다.',url:'tools/preflight.html',tags:['문서 검수','암호 설정','암호 해제']},{name:'표지 제작',icon:'📚',bg:'#eef2ff',desc:'규격과 페이지 수로 책등 폭을 계산하고 인쇄용 전체 표지를 만듭니다.',url:'tools/perfect-binding-cover.html',tags:['책등 계산','재단 여백','인쇄용 PDF']}];const TEST={name:'표지 제작 테스트',icon:'🧪',bg:'#fffbeb',desc:'정렬, 글꼴, 이미지, 자동 검수와 300DPI 출력을 시험하는 관리자 전용 버전입니다.',url:'tool-access.html?target=tools/cover-editor-phase4.html',tags:['관리자 전용','테스트','300DPI'],test:true};function addCard(p){const a=document.createElement('a');a.href=p.url;a.className='card'+(p.test?' test':'');a.innerHTML=`<div class="icon" style="background:${p.bg}">${p.icon}</div><div class="name">${p.name}</div><div class="desc">${p.desc}</div><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="cta">${p.test?'테스트 시작':'시작하기'} →</div>`;document.getElementById('slider').appendChild(a)}function showUser(user){document.getElementById('loginBtn').classList.add('hidden');document.getElementById('startBtn').classList.add('hidden');document.getElementById('userBox').classList.remove('hidden');const name=user.displayName||(user.email||'').split('@')[0];document.getElementById('userName').textContent=name;document.getElementById('userEmail').textContent=user.email||'';document.getElementById('greetingText').textContent=`안녕하세요, ${name}님!`;const av=document.getElementById('avatar');if(user.photoURL){const img=document.createElement('img');img.src=user.photoURL;av.appendChild(img)}else av.textContent=name.charAt(0)}auth.onAuthStateChanged(async user=>{document.getElementById('loading').style.display='none';if(!user)return;showUser(user);document.getElementById('hero').classList.add('hidden');try{const access=await ProgramAccess.getAccess(user);if(!access.approved){document.getElementById('approval').classList.remove('hidden');if(access.status==='suspended'){document.getElementById('approvalTitle').textContent='이용이 중지된 계정입니다';document.getElementById('approvalMessage').textContent='관리자에게 문의해 이용 상태를 확인해 주세요.'}return}document.getElementById('greeting').classList.remove('hidden');document.getElementById('programs').classList.remove('hidden');PROGRAMS.forEach(addCard);if(access.admin){addCard(TEST);document.getElementById('adminBtn').classList.remove('hidden');document.getElementById('testBtn').classList.remove('hidden');document.getElementById('count').textContent='사용 가능 3개 · 관리자 테스트 1개'}}catch(e){document.getElementById('approval').classList.remove('hidden')}});document.getElementById('userBox').onclick=e=>{e.stopPropagation();e.currentTarget.classList.toggle('open')};document.onclick=()=>document.getElementById('userBox').classList.remove('open');document.getElementById('logoutBtn').onclick=async()=>{await auth.signOut();location.reload()};</script></body></html>
