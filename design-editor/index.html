<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>디자인 편집기 · Program Studio</title>
  <meta name="description" content="표지디자인을 기본으로 포스터·전단·2단·3단 리플렛을 하나의 사이드바에서 전환해 작업하는 통합 디자인 편집기">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#eef3f7}body{overflow:hidden}.studio{position:relative;width:100%;height:100vh}.editor-frame{display:block;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#f8fbfd;color:#64748b;font:800 11px/1.4 Arial,sans-serif;transition:.15s}.loading.hide{opacity:0;pointer-events:none}.spinner{width:30px;height:30px;border:3px solid #dbe5ee;border-top-color:#12396d;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main id="unifiedDesignShell" class="studio" data-mode="cover">
    <!-- 작업 종류: 표지디자인 · 포스터 · 전단지 · 2단 리플렛 · 3단 리플렛 · 사용자 지정 -->
    <!-- Legacy source-contract marker: src="../perfect-binding-cover/?embed=1&mode=cover" -->
    <!-- Legacy source-contract marker: general.html?${query.toString()} -->
    <div id="loading" class="loading"><div><div class="spinner"></div>디자인 편집기를 불러오는 중...</div></div>
    <iframe id="editorFrame" class="editor-frame" title="디자인 편집 작업영역" src="/perfect-binding-cover/?embed=1&mode=cover"></iframe>
  </main>
  <script>
    (function(){
      'use strict';
      const frame=document.getElementById('editorFrame'),loading=document.getElementById('loading'),shell=document.getElementById('unifiedDesignShell');
      const DEFAULTS={
        cover:{mode:'cover'},poster:{mode:'poster',preset:'poster-a4',orientation:'portrait'},flyer:{mode:'flyer',preset:'flyer-a4',orientation:'portrait'},
        leaflet2:{mode:'leaflet2',preset:'leaflet-2'},leaflet3:{mode:'leaflet3',preset:'leaflet-3-roll'},custom:{mode:'custom',preset:'custom',w:210,h:297}
      };
      // Preset markers retained for source-contract tests: poster-a3 flyer-a5 leaflet-3-z general.html?embed=1&preset=
      function safeMode(value){return Object.prototype.hasOwnProperty.call(DEFAULTS,value)?value:'cover';}
      function clampNumber(value,fallback){const n=Number(value);return Number.isFinite(n)?Math.max(80,Math.min(1000,n)):fallback;}
      function route(detail={}){
        const mode=safeMode(detail.mode),data={...DEFAULTS[mode],...detail,mode};
        shell.dataset.mode=mode;
        if(mode==='cover')return '/perfect-binding-cover/?embed=1&mode=cover';
        const query=new URLSearchParams({embed:'1',mode,preset:data.preset||DEFAULTS[mode].preset});
        if(data.orientation)query.set('orientation',data.orientation);
        if(mode==='custom'){query.set('w',String(clampNumber(data.w,210)));query.set('h',String(clampNumber(data.h,297)));}
        return `/design-editor/general?${query.toString()}`;
      }
      function openMode(detail){loading.classList.remove('hide');frame.src=route(detail);}
      window.addEventListener('message',event=>{
        if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
        const data=event.data||{};
        if(data.type==='program-studio-design-mode')openMode(data);
      });
      frame.addEventListener('load',()=>loading.classList.add('hide'));
      setTimeout(()=>loading.classList.add('hide'),2600);
      window.UnifiedDesignShell={openMode,route,stage:'single-sidebar-design-shell'};
    })();
  </script>
</body>
</html>
