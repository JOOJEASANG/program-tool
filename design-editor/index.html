<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>디자인 편집기 · Program Studio</title>
  <meta name="description" content="표지·포스터·전단·초대장·안내장·4P~12P 리플렛을 인쇄 실무 기준으로 작업하는 통합 디자인 편집기">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#eef3f7}body{overflow:hidden}.studio{position:relative;width:100%;height:100vh}.editor-frame{display:block;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#f8fbfd;color:#64748b;font:800 11px/1.4 Arial,sans-serif;transition:.15s}.loading.hide{opacity:0;pointer-events:none}.spinner{width:30px;height:30px;border:3px solid #dbe5ee;border-top-color:#12396d;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main id="unifiedDesignShell" class="studio" data-mode="cover">
    <!-- 작업 종류: 표지디자인 · 포스터 · 전단지 · 초대장/안내장 · 리플렛(4P~12P) -->
    <!-- Retired compatibility URL only; it redirects here and is not an editor fallback: /perfect-binding-cover/?embed=1&mode=cover -->
    <div id="loading" class="loading"><div><div class="spinner"></div>디자인 편집기를 불러오는 중...</div></div>
    <iframe id="editorFrame" class="editor-frame" title="디자인 편집 작업영역" src="/design-editor/general?embed=1&mode=cover&preset=cover-a4"></iframe>
  </main>
  <script>
    (function(){
      'use strict';
      const frame=document.getElementById('editorFrame'),loading=document.getElementById('loading'),shell=document.getElementById('unifiedDesignShell');
      const FOLD_RUNTIME_VERSION='20260825-5';
      const PRODUCT_RUNTIME_VERSION='20260825-1';
      const PRODUCT_STATE_VERSION='20260825-1';
      const PRODUCT_TOPBAR_VERSION='20260828-2';
      const SELECTION_CONTEXT_VERSION='20260828-1';
      const MULTI_SELECTION_VERSION='20260828-1';
      const MULTI_SMART_GUIDES_VERSION='20260828-1';
      const SIMPLE_RESULT_VERSION='20260828-1';
      const DEFAULTS={
        cover:{mode:'cover',preset:'cover-a4'},
        poster:{mode:'poster',preset:'poster-a4',paper:'a4',orientation:'portrait',w:210,h:297},
        flyer:{mode:'flyer',preset:'flyer-a4',paper:'a4',orientation:'portrait',w:210,h:297},
        leaflet2:{mode:'leaflet2',preset:'leaflet-2',paper:'a4',orientation:'landscape',w:297,h:210},
        leaflet3:{mode:'leaflet3',preset:'leaflet-3-roll',paper:'a4',orientation:'landscape',w:297,h:210,fold:'leaflet-3-roll'},
        custom:{mode:'custom',preset:'custom',paper:'custom',orientation:'portrait',w:210,h:297}
      };
      function safeMode(value){return Object.prototype.hasOwnProperty.call(DEFAULTS,value)?value:'cover';}
      function clampNumber(value,fallback){const n=Number(value);return Number.isFinite(n)?Math.max(80,Math.min(1000,n)):fallback;}
      function incomingDetail(){
        const query=new URLSearchParams(location.search),mode=safeMode(query.get('mode')||'cover');
        const detail={mode,_query:query};
        ['preset','paper','orientation','fold'].forEach(key=>{if(query.has(key))detail[key]=query.get(key);});
        if(query.has('w'))detail.w=query.get('w');
        if(query.has('h'))detail.h=query.get('h');
        return detail;
      }
      function canonicalCoverRoute(mode){if(mode==='cover')return '/design-editor/general?embed=1&mode=cover&preset=cover-a4';return '';}
      function route(detail={}){
        const mode=safeMode(detail.mode),data={...DEFAULTS[mode],...detail,mode};
        shell.dataset.mode=mode;
        const incomingQuery=detail._query instanceof URLSearchParams;
        if(mode==='cover'&&!incomingQuery)return canonicalCoverRoute(mode);
        const query=incomingQuery?new URLSearchParams(detail._query):new URLSearchParams();
        query.set('embed','1');
        query.set('mode',mode);
        query.set('preset',data.preset||DEFAULTS[mode].preset);
        if(mode==='cover')return `/design-editor/general?${query.toString()}`;
        const width=clampNumber(data.w??data.width,DEFAULTS[mode].w||210),height=clampNumber(data.h??data.height,DEFAULTS[mode].h||297);
        query.set('paper',data.paper||'custom');
        query.set('orientation',data.orientation||'portrait');
        query.set('w',String(width));
        query.set('h',String(height));
        if(mode==='leaflet3')query.set('fold',data.fold||data.preset||'leaflet-3-roll');
        else query.delete('fold');
        return `/design-editor/general?${query.toString()}`;
      }
      function injectRuntime(id,src,ready){
        try{
          const doc=frame.contentDocument,win=frame.contentWindow;if(!doc?.head||!win)return false;
          if(ready(win))return true;
          let script=doc.getElementById(id);
          if(!script){script=doc.createElement('script');script.id=id;script.src=src;script.async=false;doc.head.appendChild(script);}
          return true;
        }catch(_){return false;}
      }
      function ensureFoldRuntime(){
        return injectRuntime('designPrintFoldRuntimeEnsureScriptV1',`/js/design-editor/print-fold-runtime-ensure.js?v=${FOLD_RUNTIME_VERSION}`,win=>{
          if(win.DesignEditorPrintFoldRuntimeEnsure?.refresh){win.DesignEditorPrintFoldRuntimeEnsure.refresh();return true;}return false;
        });
      }
      function ensureProductRuntime(){
        return injectRuntime('designPrintProductMenuScriptV1',`/js/design-editor/print-product-menu.js?v=${PRODUCT_RUNTIME_VERSION}`,win=>{
          if(win.DesignEditorPrintProductMenu?.render){win.DesignEditorPrintProductMenu.render();return true;}return false;
        });
      }
      function ensureProductStateRuntime(){
        return injectRuntime('designPrintProductStateRestoreScriptV1',`/js/design-editor/print-product-state-restore.js?v=${PRODUCT_STATE_VERSION}`,win=>{
          if(win.DesignEditorPrintProductStateRestore?.patch){win.DesignEditorPrintProductStateRestore.patch();return true;}return false;
        });
      }
      function ensureProductTopbarRuntime(){
        return injectRuntime('designPrintProductTopbarScriptV1',`/js/design-editor/print-product-topbar.js?v=${PRODUCT_TOPBAR_VERSION}`,win=>{
          if(win.DesignEditorPrintProductTopbar?.sync){win.DesignEditorPrintProductTopbar.sync();return true;}return false;
        });
      }
      function ensureSelectionContextRuntime(){
        return injectRuntime('designSelectionContextbarScriptV1',`/js/design-editor/selection-contextbar.js?v=${SELECTION_CONTEXT_VERSION}`,win=>{
          if(win.DesignEditorSelectionContextbar?.sync){win.DesignEditorSelectionContextbar.sync();return true;}return false;
        });
      }
      function ensureMultiSelectionRuntime(){
        return injectRuntime('designMultiSelectionScriptV1',`/js/design-editor/multi-selection-context.js?v=${MULTI_SELECTION_VERSION}`,win=>{
          if(win.DesignEditorMultiSelection?.sync){win.DesignEditorMultiSelection.sync();return true;}return false;
        });
      }
      function ensureMultiSmartGuidesRuntime(){
        return injectRuntime('designMultiSmartGuidesScriptV1',`/js/design-editor/multi-selection-smart-guides.js?v=${MULTI_SMART_GUIDES_VERSION}`,win=>{
          if(win.DesignEditorMultiSmartGuides?.sync){win.DesignEditorMultiSmartGuides.sync();return true;}return false;
        });
      }
      function ensureSimpleResultRuntime(){
        return injectRuntime('designSimpleResultWorkflowScriptV1',`/js/design-editor/simple-result-workflow.js?v=${SIMPLE_RESULT_VERSION}`,win=>{
          if(win.DesignEditorSimpleResultWorkflow?.sync){win.DesignEditorSimpleResultWorkflow.sync();return true;}return false;
        });
      }
      function ensurePrintRuntimes(){
        ensureFoldRuntime();ensureProductRuntime();ensureProductStateRuntime();ensureProductTopbarRuntime();ensureSelectionContextRuntime();ensureMultiSelectionRuntime();ensureMultiSmartGuidesRuntime();ensureSimpleResultRuntime();
      }
      function openMode(detail){loading.classList.remove('hide');frame.src=route(detail);}
      window.addEventListener('message',event=>{
        if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
        const data=event.data||{};
        if(data.type==='program-studio-design-mode')openMode(data);
      });
      frame.addEventListener('load',()=>{
        ensurePrintRuntimes();
        [80,240,600,1200,2400].forEach(delay=>setTimeout(ensurePrintRuntimes,delay));
        loading.classList.add('hide');
      });
      const initialRoute=route(incomingDetail());
      if(frame.getAttribute('src')!==initialRoute)frame.src=initialRoute;
      setTimeout(()=>loading.classList.add('hide'),2600);
      window.UnifiedDesignShell={openMode,route,incomingDetail,ensureFoldRuntime,ensureProductRuntime,ensureProductStateRuntime,ensureProductTopbarRuntime,ensureSelectionContextRuntime,ensureMultiSelectionRuntime,ensureMultiSmartGuidesRuntime,ensureSimpleResultRuntime,ensurePrintRuntimes,foldRuntimeStage:'direct-fold-runtime-loader-and-verifier',productRuntimeStage:'print-product-menu-loader',productTopbarStage:'professional-design-commandbar-v2',selectionContextStage:'selection-context-properties-v1',multiSelectionStage:'multi-select-align-distribute-group-v1',multiSmartGuidesStage:'multi-smart-guides-exact-gap-v1',simpleResultStage:'simple-result-background-logo-text-output-v1',routingStage:'query-aware-initial-route-v2',stage:'single-sidebar-general-engine-shell-no-legacy-fallback'};
    })();
  </script>
</body>
</html>
