<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>디자인 편집기 · Program Studio</title>
  <meta name="description" content="표지디자인을 기본으로 포스터·전단·2단·3단 리플렛을 하나의 화면에서 전환해 작업하는 통합 디자인 편집기">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Pretendard,"Malgun Gothic",sans-serif;color:#172033;background:#eaf0f5}button,input,select{font:inherit}
    :root{--navy:#12396d;--cyan:#1d9bb2;--line:#d9e3ec;--muted:#6b7788;--side:238px}
    body{overflow:hidden}.studio{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh;min-height:0}.studio-side{position:relative;z-index:3;display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--line);box-shadow:4px 0 18px rgba(15,23,42,.04)}
    .brand{padding:17px 16px 13px;border-bottom:1px solid #e5ebf0}.brand-top{display:flex;align-items:center;gap:8px}.home{width:28px;height:28px;display:grid;place-items:center;text-decoration:none;border:1px solid #d9e3ec;border-radius:8px;color:#475569;font-weight:950;font-size:13px}.brand h1{font-size:15px;letter-spacing:-.3px;margin:0;color:var(--navy)}.brand p{font-size:8px;line-height:1.5;color:var(--muted);margin:6px 0 0}.side-scroll{padding:12px;overflow:auto;min-height:0}.label{font-size:8px;font-weight:950;color:#7c8797;letter-spacing:.7px;margin:2px 4px 7px}.mode-list{display:flex;flex-direction:column;gap:5px}.mode-btn{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;background:#fff;padding:9px;text-align:left;color:#344054;cursor:pointer}.mode-btn:hover{background:#f7fafc;border-color:#dce6ee}.mode-btn.on{background:#eef6ff;border-color:#8fb8e3;color:#12396d;box-shadow:0 0 0 2px rgba(23,105,224,.05)}.mode-icon{width:29px;height:29px;border-radius:8px;background:#f1f5f9;display:grid;place-items:center;font-size:11px;font-weight:950}.mode-btn.on .mode-icon{background:#12396d;color:#fff}.mode-name{display:block;font-size:10px;font-weight:950}.mode-sub{display:block;margin-top:2px;font-size:7px;color:#8a94a4;line-height:1.35}
    .options{margin-top:13px;padding-top:12px;border-top:1px solid #e7edf2}.option-card{border:1px solid #e0e7ee;border-radius:11px;background:#fbfdff;padding:10px}.option-title{font-size:10px;font-weight:950;color:#12396d;margin-bottom:4px}.option-note{font-size:7px;color:#7c8797;line-height:1.45;margin-bottom:9px}.field{margin-bottom:8px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:7px;font-weight:900;color:#667085;margin-bottom:4px}.field select,.field input{width:100%;border:1px solid #cfd9e3;border-radius:8px;background:#fff;padding:7px 8px;font-size:9px;outline:none}.field select:focus,.field input:focus{border-color:#1d9bb2;box-shadow:0 0 0 3px rgba(29,155,178,.08)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.open-btn{width:100%;margin-top:9px;border:0;border-radius:9px;background:linear-gradient(135deg,#12396d,#1d8198);color:#fff;padding:9px;font-size:9px;font-weight:950;cursor:pointer}.open-btn:hover{filter:brightness(1.04)}.side-foot{margin-top:auto;padding:10px 12px;border-top:1px solid #e5ebf0;font-size:7px;color:#8a94a4;line-height:1.45;background:#fbfcfd}
    .studio-main{position:relative;min-width:0;min-height:0;background:#edf2f6}.editor-frame{display:block;width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f8fbfd;color:#64748b;font-size:10px;font-weight:850;z-index:2;transition:.15s}.loading.hide{opacity:0;pointer-events:none}.spinner{width:28px;height:28px;border:3px solid #dbe5ee;border-top-color:#12396d;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 9px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:760px){:root{--side:178px}.brand{padding:12px 10px}.brand p,.mode-sub,.option-note,.side-foot{display:none}.side-scroll{padding:8px}.mode-btn{grid-template-columns:26px 1fr;padding:7px}.mode-icon{width:25px;height:25px}.option-card{padding:8px}.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="studio">
    <aside class="studio-side">
      <div class="brand"><div class="brand-top"><a class="home" href="../index.html" title="홈">←</a><h1>디자인 편집기</h1></div><p>작업 종류만 바꾸면 필요한 편집 옵션과 작업영역이 자동으로 전환됩니다.</p></div>
      <div class="side-scroll">
        <div class="label">작업 종류</div>
        <div class="mode-list" id="modeList">
          <button class="mode-btn on" type="button" data-mode="cover"><span class="mode-icon">표</span><span><span class="mode-name">표지디자인</span><span class="mode-sub">책표지 · 책등 · 앞뒤표지</span></span></button>
          <button class="mode-btn" type="button" data-mode="poster"><span class="mode-icon">P</span><span><span class="mode-name">포스터</span><span class="mode-sub">A4 · A3 · 세로/가로</span></span></button>
          <button class="mode-btn" type="button" data-mode="flyer"><span class="mode-icon">F</span><span><span class="mode-name">전단지</span><span class="mode-sub">단면·양면 인쇄 디자인</span></span></button>
          <button class="mode-btn" type="button" data-mode="leaflet2"><span class="mode-icon">2</span><span><span class="mode-name">2단 리플렛</span><span class="mode-sub">바깥면 · 안쪽면 · 접지선</span></span></button>
          <button class="mode-btn" type="button" data-mode="leaflet3"><span class="mode-icon">3</span><span><span class="mode-name">3단 리플렛</span><span class="mode-sub">말아접기 · Z접지</span></span></button>
          <button class="mode-btn" type="button" data-mode="custom"><span class="mode-icon">＋</span><span><span class="mode-name">사용자 지정</span><span class="mode-sub">가로·세로 크기 직접 입력</span></span></button>
        </div>
        <section class="options" id="options"></section>
      </div>
      <div class="side-foot">표지디자인은 기존 검증된 책표지 기능을 그대로 사용합니다. 다른 디자인 모드는 별도 엔진으로 분리해 서로 영향을 주지 않도록 구성했습니다.</div>
    </aside>
    <section class="studio-main"><div class="loading" id="loading"><div><div class="spinner"></div>편집기를 불러오는 중...</div></div><iframe id="editorFrame" class="editor-frame" title="디자인 편집 작업영역" src="../perfect-binding-cover/?embed=1"></iframe></section>
  </main>
  <script>
    (function(){
      'use strict';
      const frame=document.getElementById('editorFrame'),options=document.getElementById('options'),loading=document.getElementById('loading');
      let mode='cover';
      const definitions={
        cover:{title:'표지디자인',note:'기존 책표지 기능을 그대로 사용합니다.',fields:'',src:()=> '../perfect-binding-cover/?embed=1'},
        poster:{title:'포스터 설정',note:'규격과 방향을 고르면 바로 빈 포스터 작업영역이 열립니다.',fields:'<div class="field"><label>규격</label><select id="quickSize"><option value="poster-a4">A4 · 210×297</option><option value="poster-a3">A3 · 297×420</option></select></div><div class="field"><label>방향</label><select id="quickOrientation"><option value="portrait">세로</option><option value="landscape">가로</option></select></div>',src:()=>`general.html?embed=1&preset=${value('quickSize','poster-a4')}&orientation=${value('quickOrientation','portrait')}`},
        flyer:{title:'전단지 설정',note:'앞면·뒷면을 같은 문서에서 편집합니다.',fields:'<div class="field"><label>규격</label><select id="quickSize"><option value="flyer-a4">A4 · 210×297</option><option value="flyer-a5">A5 · 148×210</option></select></div><div class="field"><label>방향</label><select id="quickOrientation"><option value="portrait">세로</option><option value="landscape">가로</option></select></div>',src:()=>`general.html?embed=1&preset=${value('quickSize','flyer-a4')}&orientation=${value('quickOrientation','portrait')}`},
        leaflet2:{title:'2단 리플렛 설정',note:'A4 가로 바깥면·안쪽면과 중앙 접지선을 자동 생성합니다.',fields:'<div class="field"><label>접지 방식</label><select disabled><option>A4 2단 반접지</option></select></div>',src:()=> 'general.html?embed=1&preset=leaflet-2'},
        leaflet3:{title:'3단 리플렛 설정',note:'말아접기와 Z접지를 선택하면 면 구성이 자동으로 바뀝니다.',fields:'<div class="field"><label>접지 방식</label><select id="quickFold"><option value="leaflet-3-roll">말아접기</option><option value="leaflet-3-z">Z접지</option></select></div>',src:()=>`general.html?embed=1&preset=${value('quickFold','leaflet-3-roll')}`},
        custom:{title:'사용자 지정',note:'완성 크기를 mm로 직접 입력해 빈 작업영역을 만듭니다.',fields:'<div class="grid2"><div class="field"><label>가로 mm</label><input id="quickWidth" type="number" min="80" max="1000" value="210"></div><div class="field"><label>세로 mm</label><input id="quickHeight" type="number" min="80" max="1000" value="297"></div></div>',src:()=>`general.html?embed=1&preset=custom&w=${numberValue('quickWidth',210)}&h=${numberValue('quickHeight',297)}`}
      };
      function value(id,fallback){return document.getElementById(id)?.value||fallback}
      function numberValue(id,fallback){const n=Number(value(id,fallback));return Number.isFinite(n)?Math.max(80,Math.min(1000,n)):fallback}
      function renderOptions(){const def=definitions[mode];options.innerHTML=`<div class="option-card"><div class="option-title">${def.title}</div><div class="option-note">${def.note}</div>${def.fields}${mode==='cover'?'':'<button class="open-btn" id="openMode" type="button">이 설정으로 작업하기</button>'}</div>`;document.getElementById('openMode')?.addEventListener('click',openCurrent)}
      function openCurrent(){const def=definitions[mode];loading.classList.remove('hide');frame.src=def.src()}
      document.getElementById('modeList').addEventListener('click',event=>{const button=event.target.closest('.mode-btn');if(!button)return;mode=button.dataset.mode;document.querySelectorAll('.mode-btn').forEach(node=>node.classList.toggle('on',node===button));renderOptions();openCurrent()});
      frame.addEventListener('load',()=>loading.classList.add('hide'));
      renderOptions();
      setTimeout(()=>loading.classList.add('hide'),2500);
    })();
  </script>
</body>
</html>
