<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>문서 편집기 | Program Studio</title>
  <meta name="description" content="A4 문서를 글·표·이미지와 함께 작성하고 자동 저장한 뒤 인쇄 또는 PDF로 저장하는 브라우저 문서 편집기">
  <link rel="stylesheet" href="/css/document-editor.css?v=20260823-1">
</head>
<body>
  <header class="app-header">
    <a class="home-link" href="/">← 홈</a>
    <div class="brand-block"><strong>문서 편집기</strong><span>A4 문서 작성 · 표 · 이미지 · 자동 저장 · PDF 출력</span></div>
    <input id="documentTitle" class="document-title-input" type="text" maxlength="100" value="제목 없는 문서" aria-label="문서 제목">
    <div class="header-actions">
      <button id="newDocumentBtn" class="ghost" type="button">새 문서</button>
      <button id="printBtn" class="primary" type="button">인쇄 · PDF 저장</button>
    </div>
  </header>

  <nav class="format-toolbar" aria-label="문서 서식 도구">
    <select id="blockFormat" aria-label="문단 스타일">
      <option value="p">본문</option><option value="h1">제목 1</option><option value="h2">제목 2</option><option value="h3">제목 3</option>
    </select>
    <select id="fontName" aria-label="글꼴">
      <option value="Malgun Gothic">맑은 고딕</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="monospace">고정폭</option>
    </select>
    <select id="fontSize" aria-label="글자 크기">
      <option value="2">10pt</option><option value="3" selected>12pt</option><option value="4">14pt</option><option value="5">18pt</option><option value="6">24pt</option><option value="7">36pt</option>
    </select>
    <span class="toolbar-separator"></span>
    <button type="button" data-command="bold" title="굵게"><b>B</b></button>
    <button type="button" data-command="italic" title="기울임"><i>I</i></button>
    <button type="button" data-command="underline" title="밑줄"><u>U</u></button>
    <label class="color-tool" title="글자색">글자 <input id="foreColor" type="color" value="#172033"></label>
    <label class="color-tool" title="형광펜">배경 <input id="hiliteColor" type="color" value="#fff2a8"></label>
    <span class="toolbar-separator"></span>
    <button type="button" data-command="justifyLeft" title="왼쪽 정렬">≡</button>
    <button type="button" data-command="justifyCenter" title="가운데 정렬">≣</button>
    <button type="button" data-command="justifyRight" title="오른쪽 정렬">≡→</button>
    <button type="button" data-command="justifyFull" title="양쪽 정렬">☰</button>
    <span class="toolbar-separator"></span>
    <button type="button" data-command="insertUnorderedList" title="글머리 기호">• 목록</button>
    <button type="button" data-command="insertOrderedList" title="번호 목록">1. 목록</button>
    <button type="button" data-command="undo" title="실행 취소">↶</button>
    <button type="button" data-command="redo" title="다시 실행">↷</button>
  </nav>

  <main class="workspace">
    <aside class="sidebar">
      <section class="panel-card">
        <div class="panel-title">표 삽입</div>
        <div class="field-row">
          <label>행<input id="tableRows" type="number" min="1" max="20" value="3"></label>
          <label>열<input id="tableCols" type="number" min="1" max="10" value="3"></label>
        </div>
        <button id="insertTableBtn" class="wide" type="button">표 넣기</button>
      </section>

      <section class="panel-card">
        <div class="panel-title">이미지 삽입</div>
        <p class="help">사진은 문서 안에 저장되도록 자동으로 적당한 크기로 줄입니다.</p>
        <button id="insertImageBtn" class="wide" type="button">이미지 선택</button>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      </section>

      <section class="panel-card">
        <div class="panel-title">문서 저장</div>
        <div id="draftState" class="draft-state">자동 저장 준비됨</div>
        <p class="help">내용은 이 브라우저에 자동 저장됩니다. 서버로 문서 내용을 전송하지 않습니다.</p>
        <button id="saveNowBtn" class="wide secondary" type="button">지금 저장</button>
        <button id="clearDraftBtn" class="wide danger" type="button">저장본 삭제</button>
      </section>

      <section class="panel-card tip-card">
        <div class="panel-title">PDF로 저장</div>
        <p class="help">상단의 <b>인쇄 · PDF 저장</b>을 누른 뒤 인쇄 창에서 대상 또는 프린터를 <b>PDF로 저장</b>으로 선택하세요.</p>
      </section>
    </aside>

    <section class="editor-area">
      <div class="page-viewport">
        <article id="documentPage" class="document-page" contenteditable="true" spellcheck="true" data-placeholder="여기에 문서 내용을 입력하세요."><p><br></p></article>
      </div>
      <footer class="status-bar">
        <span id="statusText">새 문서를 작성할 수 있습니다.</span>
        <span><b id="wordCount">0</b>단어 · <b id="charCount">0</b>자 · A4</span>
      </footer>
    </section>
  </main>

  <script src="/js/document-editor/app.js?v=20260823-1"></script>
</body>
</html>
