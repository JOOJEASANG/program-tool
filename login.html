<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Program Tool · 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      background: linear-gradient(150deg, #0a1f3d 0%, #12396d 55%, #1a6080 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap { width: 100%; max-width: 420px; }

    /* Brand */
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #1d9bb2, #12396d);
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 26px; margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .brand h1 { color: #fff; font-size: 26px; font-weight: 900; letter-spacing: -0.6px; }
    .brand p { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 5px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 5px;
      color: rgba(255,255,255,0.55); font-size: 12px; font-weight: 700;
      text-decoration: none; margin-top: 20px;
      transition: color 0.15s;
    }
    .back-link:hover { color: rgba(255,255,255,0.9); }

    /* Card */
    .card {
      background: #fff;
      border-radius: 22px;
      padding: 32px 28px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.28);
    }

    /* Tabs */
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      background: #f1f5f9; border-radius: 12px; padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      border: none; background: transparent;
      padding: 10px; border-radius: 9px;
      font-size: 14px; font-weight: 700; color: #64748b;
      cursor: pointer; transition: all 0.18s; font-family: inherit;
    }
    .tab.active { background: #fff; color: #12396d; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    /* Google button */
    .google-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      border: 1.5px solid #e2e8f0; background: #fff;
      border-radius: 12px; padding: 12px;
      font-size: 14px; font-weight: 700; color: #1e293b;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
      margin-bottom: 18px;
    }
    .google-btn:hover { background: #f8fafc; border-color: #94a3b8; }
    .google-btn:disabled { opacity: 0.65; cursor: wait; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 18px; color: #94a3b8; font-size: 12px; font-weight: 700;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }

    /* Fields */
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 12px; font-weight: 800; color: #374151; margin-bottom: 6px; }
    .field input {
      width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px;
      padding: 11px 13px; font-size: 14px; font-family: inherit; outline: none;
      color: #0f172a; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { border-color: #12396d; box-shadow: 0 0 0 3px rgba(18,57,109,0.1); }

    /* Submit */
    .submit-btn {
      width: 100%; background: #12396d; color: #fff; border: none;
      border-radius: 12px; padding: 13px;
      font-size: 15px; font-weight: 800; cursor: pointer;
      font-family: inherit; margin-top: 4px; transition: background 0.15s;
      letter-spacing: -0.2px;
    }
    .submit-btn:hover { background: #0f2f5c; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Error */
    .error-box {
      background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
      border-radius: 10px; padding: 10px 13px;
      font-size: 13px; margin-top: 13px; display: none;
    }
    .error-box.show { display: block; }

    /* Loading spinner */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #confirmPwField { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <a href="index.html" style="text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:0;">
        <div class="brand-icon">🛠️</div>
        <h1>Program Tool</h1>
      </a>
      <p>유용한 온라인 도구 모음 서비스</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">로그인</button>
        <button class="tab" id="tabSignup" onclick="switchTab('signup')">회원가입</button>
      </div>

      <button class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.34-8.16 2.34-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="googleBtnLabel">Google로 계속하기</span>
      </button>

      <div class="divider">또는 이메일로 계속하기</div>

      <form id="authForm" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="example@email.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="6자리 이상" autocomplete="current-password" />
        </div>
        <div class="field" id="confirmPwField">
          <label for="confirmPw">비밀번호 확인</label>
          <input type="password" id="confirmPw" placeholder="비밀번호를 다시 입력" autocomplete="new-password" />
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">로그인</button>
      </form>

      <div class="error-box" id="errorBox"></div>
    </div>
    <div style="text-align:center;">
      <a class="back-link" href="index.html">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        서비스 소개로 돌아가기
      </a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    let mode = 'login';
    let authRoutingStarted = false;

    async function routeAuthenticatedUser(user) {
      if (!user || authRoutingStarted) return;
      authRoutingStarted = true;
      try {
        const doc = await db.collection('settings').doc('admin').get();
        const emails = (doc.exists ? (doc.data().emails || []) : [])
          .map(e => String(e).trim().toLowerCase());
        const userEmail = String(user.email || '').trim().toLowerCase();
        if (emails.includes(userEmail)) {
          window.location.replace('admin.html');
          return;
        }
      } catch (e) {}
      window.location.replace('index.html');
    }

    auth.onAuthStateChanged(user => routeAuthenticatedUser(user));

    function switchTab(tab) {
      mode = tab;
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
      document.getElementById('submitBtn').textContent = tab === 'login' ? '로그인' : '회원가입 하기';
      document.getElementById('confirmPwField').style.display = tab === 'signup' ? 'block' : 'none';
      hideError();
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.add('show');
    }
    function hideError() {
      document.getElementById('errorBox').classList.remove('show');
    }
    function setLoading(loading) {
      const btn = document.getElementById('submitBtn');
      const gBtn = document.getElementById('googleBtn');
      btn.disabled = loading;
      gBtn.disabled = loading;
      if (loading) {
        const label = mode === 'login' ? '로그인 중...' : '가입 중...';
        btn.innerHTML = `<span class="spinner"></span>${label}`;
      } else {
        btn.textContent = mode === 'login' ? '로그인' : '회원가입 하기';
      }
    }
    function setGoogleLoading(loading) {
      const btn = document.getElementById('googleBtn');
      const label = document.getElementById('googleBtnLabel');
      btn.disabled = loading;
      btn.setAttribute('aria-busy', String(loading));
      label.textContent = loading ? 'Google 로그인 연결 중...' : 'Google로 계속하기';
    }

    const errMap = {
      'auth/user-not-found': '등록되지 않은 이메일입니다.',
      'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
      'auth/email-already-in-use': '이미 사용 중인 이메일입니다.',
      'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.',
      'auth/invalid-email': '올바른 이메일 형식이 아닙니다.',
      'auth/popup-closed-by-user': '로그인 창이 닫혔습니다.',
      'auth/popup-blocked': '브라우저가 로그인 창을 차단했습니다. 팝업 허용 후 다시 시도해주세요.',
      'auth/cancelled-popup-request': '이미 다른 로그인 창을 여는 중입니다.',
      'auth/unauthorized-domain': '현재 사이트 주소가 Google 로그인 허용 목록에 없습니다. 관리자에게 문의해주세요.',
      'auth/operation-not-allowed': 'Google 로그인이 아직 활성화되지 않았습니다. 관리자에게 문의해주세요.',
      'auth/network-request-failed': '네트워크 연결을 확인한 뒤 다시 시도해주세요.',
      'auth/web-storage-unsupported': '브라우저의 쿠키 또는 저장소가 차단되어 로그인할 수 없습니다.',
      'auth/operation-not-supported-in-this-environment': '현재 브라우저에서는 Google 로그인 창을 열 수 없습니다. 기본 브라우저에서 다시 시도해주세요.',
      'auth/account-exists-with-different-credential': '같은 이메일로 가입된 계정이 있습니다. 기존 로그인 방식을 이용해주세요.',
      'auth/internal-error': 'Google 인증 서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.',
      'auth/invalid-credential': '이메일 또는 비밀번호를 확인해주세요.',
      'auth/too-many-requests': '잠시 후 다시 시도해주세요.',
    };

    function reportAuthError(error, context) {
      const code = String(error && error.code || '');
      console.error(`[auth] ${context} failed`, {
        code: code || 'unknown',
        message: String(error && error.message || error || 'Unknown error'),
      });
      showError(errMap[code] || '로그인 연결에 실패했습니다. 잠시 후 다시 시도해주세요.');
    }

    document.getElementById('googleBtn').addEventListener('click', async () => {
      hideError();
      if (!auth || !googleProvider) {
        showError('로그인 기능을 초기화하지 못했습니다. 페이지를 새로고침해주세요.');
        return;
      }
      setGoogleLoading(true);
      try {
        await window.authPersistenceReady;
        await auth.signInWithPopup(googleProvider);
      } catch (error) {
        reportAuthError(error, 'Google popup sign-in');
        setGoogleLoading(false);
      }
    });

    document.getElementById('authForm').addEventListener('submit', async e => {
      e.preventDefault();
      hideError();
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;
      if (!email) return showError('이메일을 입력해주세요.');
      if (!pw) return showError('비밀번호를 입력해주세요.');
      if (mode === 'signup') {
        const cpw = document.getElementById('confirmPw').value;
        if (pw !== cpw) return showError('비밀번호가 일치하지 않습니다.');
        if (pw.length < 6) return showError('비밀번호는 6자 이상이어야 합니다.');
      }
      setLoading(true);
      try {
        await window.authPersistenceReady;
        if (mode === 'login') {
          await auth.signInWithEmailAndPassword(email, pw);
        } else {
          await auth.createUserWithEmailAndPassword(email, pw);
        }
      } catch (e) {
        showError(errMap[e.code] || '오류가 발생했습니다. 다시 시도해주세요.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
