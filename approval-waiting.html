<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원 승인 안내 · Program Tool</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#eff8ff,#fff);font-family:Pretendard,"Noto Sans KR",sans-serif;color:#0f172a}.card{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid #dbe5ee;border-radius:24px;padding:34px;box-shadow:0 20px 55px rgba(18,57,109,.14);text-align:center}.icon{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:#fff7ed;font-size:34px}h1{font-size:25px;margin:0 0 10px}p{color:#64748b;line-height:1.7;font-size:14px}.status{margin:20px 0;padding:14px;border-radius:12px;background:#f8fafc;font-size:13px;font-weight:800}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:900;cursor:pointer;text-decoration:none;font-size:13px}.primary{background:#12396d;color:#fff}.secondary{background:#e5e7eb;color:#334155}</style></head><body><main class="card"><div class="icon">⏳</div><h1 id="title">관리자 승인 대기 중입니다</h1><p id="message">가입 정보가 관리자에게 전달되었습니다.<br>승인이 완료되면 모든 프로그램을 사용할 수 있습니다.</p><div class="status" id="statusBox">승인 상태를 확인하고 있습니다.</div><div class="actions"><button class="btn primary" id="refreshBtn">승인 상태 다시 확인</button><button class="btn secondary" id="logoutBtn">로그아웃</button></div></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script>const title=document.getElementById('title'),message=document.getElementById('message'),statusBox=document.getElementById('statusBox');async function check(){statusBox.textContent='승인 상태 확인 중…';const user=auth.currentUser;if(!user){location.replace('login.html');return;}try{const access=await ProgramAccess.getAccess(user);if(access.approved){location.replace('index.html');return;}if(access.status==='suspended'){title.textContent='이용이 중지된 계정입니다';message.innerHTML='관리자에게 문의해 이용 상태를 확인해 주세요.';statusBox.textContent='현재 상태: 이용 중지';}else{title.textContent='관리자 승인 대기 중입니다';statusBox.textContent='현재 상태: 승인 대기';}}catch(e){statusBox.textContent='상태 확인에 실패했습니다. 잠시 후 다시 시도해 주세요.';}}auth.onAuthStateChanged(user=>user?check():location.replace('login.html'));document.getElementById('refreshBtn').onclick=check;document.getElementById('logoutBtn').onclick=async()=>{await auth.signOut();location.replace('index.html');};</script></body></html>
