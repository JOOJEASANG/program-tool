<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 설정 · Program Tool</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:#f4f6f8;color:#111827;min-height:100vh}.top{height:58px;background:#12396d;color:#fff;display:flex;align-items:center;padding:0 24px;gap:12px}.back{color:#fff;text-decoration:none;font-size:13px;font-weight:800;border:1px solid #ffffff33;padding:8px 12px;border-radius:9px}.title{font-size:16px;font-weight:900;flex:1;text-align:center}.logout{border:0;background:#ffffff22;color:#fff;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer}.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 60px}.hero{background:linear-gradient(135deg,#12396d,#1d9bb2);color:#fff;border-radius:20px;padding:27px;margin-bottom:18px}.hero h1{font-size:27px;margin-bottom:7px}.hero p{font-size:14px;color:#ffffffd9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:20px;box-shadow:0 8px 26px #0f172a0d}.wide{grid-column:1/-1}.card-title{font-size:17px;font-weight:900;margin-bottom:5px}.card-sub{font-size:12px;color:#64748b;line-height:1.5;margin-bottom:14px}label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}input{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:10px}.row{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:900;cursor:pointer}.primary{background:#12396d;color:#fff}.success{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.danger{background:#fee2e2;color:#991b1b}.secondary{background:#e5e7eb;color:#334155}.admin-item,.member{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #e5e7eb;border-radius:11px;background:#f8fafc;margin-bottom:7px}.admin-item span,.member-main{flex:1}.member-name{font-weight:900;font-size:13px}.member-email{font-size:11px;color:#64748b;margin-top:2px}.badge{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px}.pending{background:#fff7ed;color:#9a3412}.approved{background:#dcfce7;color:#166534}.suspended{background:#fee2e2;color:#991b1b}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.filter{border:1px solid #dbe5ee;background:#fff;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:900;cursor:pointer}.filter.on{background:#12396d;color:#fff}.status{font-size:12px;font-weight:800;margin-top:8px}.ok{color:#166534}.err{color:#dc2626}.hidden{display:none!important}#authLoading{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:99}.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#12396d;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.title{text-align:left}.member{align-items:flex-start;flex-wrap:wrap}.member-actions{width:100%}}</style></head><body><div id="authLoading"><div class="spinner"></div></div><nav class="top"><a class="back" href="index.html">← 홈으로</a><div class="title">관리자 설정</div><button class="logout" id="logoutBtn">로그아웃</button></nav><main class="wrap hidden" id="adminContent"><section class="hero"><h1>회원 승인 및 프로그램 운영</h1><p>신규 가입자는 승인 대기 상태로 등록되며, 관리자가 승인한 회원만 프로그램을 사용할 수 있습니다.</p></section><div class="grid"><section class="card"><div class="card-title">👤 관리자 계정</div><div class="card-sub">관리자 페이지와 회원 승인 기능을 사용할 이메일입니다.</div><div id="adminList"></div><div style="margin-top:12px"><label>관리자 이메일 추가</label><div class="row"><input type="email" id="newAdminEmail" placeholder="admin@example.com"><button class="btn primary" id="addAdminBtn">추가</button></div></div><div class="status" id="adminStatus"></div></section><section class="card"><div class="card-title">📊 회원 현황</div><div class="card-sub">가입 및 승인 상태를 집계합니다.</div><div id="summary" style="font-size:14px;font-weight:900;line-height:2"></div></section><section class="card wide"><div class="card-title">✅ 회원 승인 관리</div><div class="card-sub">승인 대기 회원을 승인하거나, 승인된 회원의 이용을 중지할 수 있습니다.</div><div class="filters"><button class="filter on" data-filter="all">전체</button><button class="filter" data-filter="pending">승인 대기</button><button class="filter" data-filter="approved">승인 완료</button><button class="filter" data-filter="suspended">이용 중지</button></div><div id="memberList"></div><div class="status" id="memberStatus"></div></section></div></main><main class="wrap hidden" id="noAccess"><section class="hero"><h1>접근 권한이 없습니다</h1><p>관리자 계정으로 로그인해야 합니다.</p></section></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script>const N=ProgramAccess.normalizeEmail;let currentUser=null,currentFilter='all',members=[];function setStatus(id,msg,error=false){const el=document.getElementById(id);el.className='status '+(error?'err':'ok');el.textContent=msg;setTimeout(()=>el.textContent='',3500)}async function loadAdmins(){const doc=await db.collection('settings').doc('admin').get();const emails=doc.exists?(doc.data().emails||[]):[];const box=document.getElementById('adminList');box.innerHTML='';emails.forEach(email=>{const row=document.createElement('div');row.className='admin-item';row.innerHTML=`<span>${email}</span><button class="btn danger" data-email="${email}">삭제</button>`;box.appendChild(row)});box.querySelectorAll('[data-email]').forEach(b=>b.onclick=()=>removeAdmin(b.dataset.email))}async function addAdmin(){const input=document.getElementById('newAdminEmail'),email=N(input.value);if(!email||!email.includes('@'))return setStatus('adminStatus','올바른 이메일을 입력하세요.',true);await db.collection('settings').doc('admin').set({emails:firebase.firestore.FieldValue.arrayUnion(email)},{merge:true});input.value='';setStatus('adminStatus','관리자를 추가했습니다.');loadAdmins()}async function removeAdmin(email){if(email===N(currentUser.email))return setStatus('adminStatus','현재 로그인한 본인은 삭제할 수 없습니다.',true);if(!confirm(email+' 관리자를 삭제할까요?'))return;await db.collection('settings').doc('admin').update({emails:firebase.firestore.FieldValue.arrayRemove(email)});loadAdmins()}function renderMembers(){const list=document.getElementById('memberList');const filtered=members.filter(m=>currentFilter==='all'||(m.status||'pending')===currentFilter);list.innerHTML='';if(!filtered.length){list.innerHTML='<div style="padding:20px;text-align:center;color:#94a3b8">해당 회원이 없습니다.</div>';return}filtered.forEach(m=>{const s=m.status||'pending';const label={pending:'승인 대기',approved:'승인 완료',suspended:'이용 중지'}[s]||s;const row=document.createElement('div');row.className='member';row.innerHTML=`<div class="member-main"><div class="member-name">${m.displayName||'이름 없음'}</div><div class="member-email">${m.email||''}</div></div><span class="badge ${s}">${label}</span><div class="member-actions">${s!=='approved'?`<button class="btn success" data-action="approved" data-id="${m.id}">승인</button>`:''}${s!=='suspended'?`<button class="btn warn" data-action="suspended" data-id="${m.id}">중지</button>`:''}${s!=='pending'?`<button class="btn secondary" data-action="pending" data-id="${m.id}">대기 전환</button>`:''}</div>`;list.appendChild(row)});list.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>changeStatus(b.dataset.id,b.dataset.action))}async function loadMembers(){const snap=await db.collection('user_permissions').orderBy('createdAt','desc').get();members=snap.docs.map(d=>({id:d.id,...d.data()}));const count=s=>members.filter(m=>(m.status||'pending')===s).length;document.getElementById('summary').innerHTML=`전체 회원 ${members.length}명<br>승인 대기 ${count('pending')}명<br>승인 완료 ${count('approved')}명<br>이용 중지 ${count('suspended')}명`;renderMembers()}async function changeStatus(uid,status){const data={status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(status==='approved'){data.approvedAt=firebase.firestore.FieldValue.serverTimestamp();data.approvedBy=currentUser.email}else{data.approvedAt=null;data.approvedBy=null}await db.collection('user_permissions').doc(uid).set(data,{merge:true});setStatus('memberStatus','회원 상태를 변경했습니다.');loadMembers()}auth.onAuthStateChanged(async user=>{document.getElementById('authLoading').style.display='none';if(!user){location.replace('login.html');return}currentUser=user;const admin=await ProgramAccess.isAdmin(user).catch(()=>false);if(!admin){document.getElementById('noAccess').classList.remove('hidden');return}document.getElementById('adminContent').classList.remove('hidden');loadAdmins();loadMembers()});document.getElementById('addAdminBtn').onclick=addAdmin;document.getElementById('newAdminEmail').onkeydown=e=>{if(e.key==='Enter')addAdmin()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');currentFilter=b.dataset.filter;renderMembers()});document.getElementById('logoutBtn').onclick=async()=>{await auth.signOut();location.replace('index.html')};</script></body></html>
